<script>
// ================================================================
//  SUPPLIER — JavaScript
// ================================================================

let _cachedSupplierData = [];

// ── Dropdown detail pricelist per supplier ────────────────────────
let _supPricelist = {};        // idSupplier -> [item pricelist]
let _supPricelistLoaded = false;
let _supOpen = {};             // idSupplier -> expanded?

function _supEsc(s) { return (s == null ? '' : s.toString()).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

function _loadSupPricelist(cb) {
  if (_supPricelistLoaded) { if (cb) cb(); return; }
  if (typeof google === 'undefined') { _supPricelistLoaded = true; if (cb) cb(); return; }
  google.script.run.withSuccessHandler(function(res) {
    _supPricelist = {};
    (((res && res.success) ? res.list : []) || []).forEach(function(it) {
      if (!_supPricelist[it.idSupplier]) _supPricelist[it.idSupplier] = [];
      _supPricelist[it.idSupplier].push(it);
    });
    _supPricelistLoaded = true;
    if (cb) cb();
  }).withFailureHandler(function() { _supPricelistLoaded = true; if (cb) cb(); }).getPricelistAll();
}

function toggleSupplierDetail(id) {
  _supOpen[id] = !_supOpen[id];
  if (_supOpen[id] && !_supPricelistLoaded) _loadSupPricelist(function() { _pgRender('supplier'); });
  else _pgRender('supplier');
}

function _renderSupplierPricelistDetail(idSupplier) {
  if (!_supPricelistLoaded) return '<div class="text-[11px] text-slate-400 py-2 pl-2"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat pricelist...</div>';
  var items = _supPricelist[idSupplier] || [];
  if (!items.length) return '<div class="text-[11px] text-slate-400 italic py-2 pl-2">Belum ada item pricelist untuk supplier ini. Tambahkan di menu <b>Pricelist Supplier</b>.</div>';
  var rows = items.map(function(it) {
    var ready = it.ready
      ? '<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">READY</span>'
      : '<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">BELUM</span>';
    return '<tr class="border-b border-slate-100">'
      + '<td class="p-2 text-slate-500">' + _supEsc(it.kategori || '-') + '</td>'
      + '<td class="p-2 text-slate-500">' + _supEsc(it.merek || '-') + '</td>'
      + '<td class="p-2"><div class="font-semibold text-slate-700">' + _supEsc(it.namaMaterial) + '</div>' + (it.spesifikasi ? '<div class="text-[10px] text-slate-400">' + _supEsc(it.spesifikasi) + '</div>' : '') + '</td>'
      + '<td class="p-2 text-center text-slate-500">' + _supEsc(it.satuan || '-') + '</td>'
      + '<td class="p-2 text-right font-bold text-slate-800 whitespace-nowrap">Rp ' + (Math.round(it.hargaBeli || 0)).toLocaleString('id-ID') + '</td>'
      + '<td class="p-2 text-slate-500 whitespace-nowrap">' + _supEsc(it.updateTerakhir || '-') + '</td>'
      + '<td class="p-2 text-center">' + ready + '</td></tr>';
  }).join('');
  return '<div class="rounded-xl border border-slate-200 overflow-x-auto bg-white">'
    + '<table class="w-full min-w-[640px] text-xs text-left"><thead><tr class="bg-slate-100 text-[10px] font-bold text-slate-500 uppercase tracking-wider">'
    + '<th class="p-2">Kategori</th><th class="p-2">Merek</th><th class="p-2">Nama Material</th><th class="p-2 text-center">Satuan</th><th class="p-2 text-right">Harga Beli</th><th class="p-2">Update Terakhir</th><th class="p-2 text-center">Status</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

// ── Render tabel supplier ─────────────────────────────────────────
function _pgRenderSupplier(data) {
  const tbody = document.getElementById('table-supplier');
  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400">
      <i class="fas fa-search mr-2"></i>Tidak ada data supplier.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(i => {
    const statusBadge = i.status === 'Aktif'
      ? 'bg-emerald-100 text-emerald-700'
      : 'bg-rose-100 text-rose-600';
    const open = !!_supOpen[i.id];
    const mainRow = `<tr class="border-b border-slate-100 hover:bg-slate-50 transition">
      <td class="p-4 font-bold text-slate-600" data-label="ID">${i.id}</td>
      <td class="p-4 font-bold text-slate-800" data-label="Nama Supplier">${i.nama}</td>
      <td class="p-4 text-slate-600" data-label="PIC">${i.pic || '-'}</td>
      <td class="p-4 text-slate-600" data-label="Telepon">${i.telepon || '-'}</td>
      <td class="p-4 text-slate-600" data-label="Email">${i.email || '-'}</td>
      <td class="p-4 text-center" data-label="Status">
        <span class="text-xs font-extrabold px-2 py-1 rounded-lg ${statusBadge}">
          ${i.status || 'Aktif'}
        </span>
      </td>
      <td class="p-4 text-center rp-actions">
        <div class="flex items-center justify-center gap-2">
          <button onclick='bukaModalEditSupplier(JSON.stringify(${JSON.stringify(i).replace(/'/g, "&#39;")}))' class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
          <button onclick="konfirmasiHapus('supplier','${i.id}','${i.nama}')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </td>
      <td class="p-4 text-center" data-label="Item">
        <button onclick="toggleSupplierDetail('${i.id}')" class="inline-flex items-center gap-1.5 text-xs font-bold text-blue-600 hover:text-blue-800 py-2 px-2" title="Lihat item pricelist">
          <i class="fa-solid fa-chevron-${open ? 'up' : 'down'} text-[10px] transition-transform duration-200"></i> Detail
        </button>
      </td>
    </tr>`;
    const detailRow = open ? `<tr class="bg-slate-50"><td colspan="8" class="px-4 pb-4 pt-1">${_renderSupplierPricelistDetail(i.id)}</td></tr>` : '';
    return mainRow + detailRow;
  }).join('');
}

// ── Load data supplier ────────────────────────────────────────────
window.loadSupplier = function() {
  if (typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(function(data) {
      _cachedSupplierData = data || [];
      _supPricelistLoaded = false; _supPricelist = {}; _supOpen = {};  // refresh detail cache
      if (typeof resetSearch === 'function') resetSearch('supplier');
      _pgState.supplier.data = _cachedSupplierData;
      _pgState.supplier.page = 1;
      _injectPgBar('supplier', '#table-supplier');
      _pgRender('supplier');
    }).withFailureHandler(function(err) {
      const tbody = document.getElementById('table-supplier');
      if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-rose-400">
        <i class="fas fa-exclamation-circle mr-2"></i>Gagal memuat data supplier.</td></tr>`;
    }).getSupplierList();
  }
};

// ── Submit tambah supplier ────────────────────────────────────────
function submitTambahSupplier(event) {
  event.preventDefault();
  const form   = event.target;
  const nama   = (form.nama.value   || '').trim();
  const pic    = (form.pic.value    || '').trim();
  const telepon = (form.telepon.value || '').trim();
  const email  = (form.email.value  || '').trim();
  const alamat = (form.alamat.value || '').trim();
  const catatan = (form.catatan.value || '').trim();

  if (!nama) {
    showNotification('Nama supplier wajib diisi.', 'error');
    return;
  }

  document.getElementById('modal-supplier').classList.add('hidden');
  toggleLoader(true, 'Menyimpan supplier...');

  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(res) {
        toggleLoader(false);
        if (res && res.success === false) {
          showNotification(res.message || 'Gagal menyimpan supplier.', 'error');
        } else {
          showNotification(res && res.message ? res.message : 'Supplier berhasil disimpan.');
          form.reset();
          loadSupplier();
        }
      })
      .withFailureHandler(function(err) {
        toggleLoader(false);
        showNotification(err.message || 'Gagal menyimpan supplier.', 'error');
      })
      .simpanSupplier({ nama, pic, telepon, email, alamat, catatan, dibuatOleh: _currentUser ? _currentUser.nama : '' });
  } else {
    toggleLoader(false);
    showNotification('Tidak terhubung ke server.', 'error');
  }
}

// ── Buka modal edit supplier ──────────────────────────────────────
function bukaModalEditSupplier(supplierJson) {
  let supplier;
  try {
    supplier = typeof supplierJson === 'string' ? JSON.parse(supplierJson) : supplierJson;
  } catch (e) {
    showNotification('Gagal memuat data supplier.', 'error');
    return;
  }

  document.getElementById('edit-supplier-id').value      = supplier.id      || '';
  document.getElementById('edit-supplier-nama').value    = supplier.nama    || '';
  document.getElementById('edit-supplier-pic').value     = supplier.pic     || '';
  document.getElementById('edit-supplier-telepon').value = supplier.telepon || '';
  document.getElementById('edit-supplier-email').value   = supplier.email   || '';
  document.getElementById('edit-supplier-alamat').value  = supplier.alamat  || '';
  document.getElementById('edit-supplier-catatan').value = supplier.catatan || '';
  document.getElementById('edit-supplier-status').value  = supplier.status  || 'Aktif';

  document.getElementById('modal-edit-supplier').classList.remove('hidden');
}

// ── Submit edit supplier ──────────────────────────────────────────
function submitEditSupplier(event) {
  event.preventDefault();
  const id      = document.getElementById('edit-supplier-id').value.trim();
  const nama    = document.getElementById('edit-supplier-nama').value.trim();
  const pic     = document.getElementById('edit-supplier-pic').value.trim();
  const telepon = document.getElementById('edit-supplier-telepon').value.trim();
  const email   = document.getElementById('edit-supplier-email').value.trim();
  const alamat  = document.getElementById('edit-supplier-alamat').value.trim();
  const catatan = document.getElementById('edit-supplier-catatan').value.trim();
  const status  = document.getElementById('edit-supplier-status').value;

  if (!nama) {
    showNotification('Nama supplier wajib diisi.', 'error');
    return;
  }

  document.getElementById('modal-edit-supplier').classList.add('hidden');
  toggleLoader(true, 'Menyimpan perubahan...');

  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(res) {
        toggleLoader(false);
        if (res && res.success === false) {
          showNotification(res.message || 'Gagal menyimpan perubahan.', 'error');
        } else {
          showNotification(res && res.message ? res.message : 'Data supplier berhasil diperbarui.');
          loadSupplier();
        }
      })
      .withFailureHandler(function(err) {
        toggleLoader(false);
        showNotification(err.message || 'Gagal menyimpan perubahan.', 'error');
      })
      .editSupplier({ id, nama, pic, telepon, email, alamat, catatan, status, diubahOleh: _currentUser ? _currentUser.nama : '' });
  } else {
    toggleLoader(false);
    showNotification('Tidak terhubung ke server.', 'error');
  }
}
</script>
