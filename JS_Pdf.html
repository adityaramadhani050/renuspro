<script>
    // ============================================================
    // SISTEM EXPORT & PREVIEW QUOTATION PDF
    // ============================================================

    let _activePdfDoc  = null;
    let _activePdfName = '';

    // Variabel global untuk menyimpan PDF aktif (base64 version)
    let _activePdfBase64 = null;

    function tutupPreviewPDF() {
      document.getElementById('modal-preview-pdf').classList.add('hidden');

      const wrap    = document.getElementById('preview-pdf-canvas-wrap');
      const loading = document.getElementById('preview-pdf-loading');

      // Reset canvas wrap
      wrap.innerHTML      = '';
      wrap.style.display  = '';
      wrap.style.visibility = '';
      wrap.classList.add('hidden');

      // Reset loading ke state awal dan pastikan terlihat kembali
      loading.classList.remove('hidden');
      loading.innerHTML = `
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-300 border-t-blue-500"></div>
        <p class="text-sm font-medium">Membuat preview...</p>`;

      _activePdfDoc  = null;
      _activePdfBase64 = null
      _activePdfName = '';
    }

function exportPenawaranPDF(item) {
  // Dibuat LANGSUNG di klien (jsPDF) dari data penawaran + merge lampiran T&C.
  // Tidak lagi memakai template Google Sheets / Apps Script.
  _pdfBukaPreview('Preview — ' + item.id + ' Rev' + item.rev,
                  (item.namaProject || '') + ' · ' + (item.namaKlien || ''));
  setTimeout(function () { buatDokumenPDF(item); }, 60);
}

// Render PDF dari base64 string ke canvas
async function renderPDFDariBase64(base64String) {
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Decode base64 → ArrayBuffer
    const binaryStr = atob(base64String);
    const bytes     = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
      bytes[i] = binaryStr.charCodeAt(i);
    }

    const pdfDoc = await pdfjsLib.getDocument({ data: bytes.buffer }).promise;
    const wrap   = document.getElementById('preview-pdf-canvas-wrap');
    wrap.innerHTML    = '';
    wrap.style.display    = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.visibility = 'hidden';

    const wrapW = Math.min(wrap.clientWidth || 340, 700);

    for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
      const page     = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1 });
      const scale    = (wrapW - 16) / viewport.width;
      const vp       = page.getViewport({ scale });

      if (pdfDoc.numPages > 1) {
        const label     = document.createElement('p');
        label.innerText = `Halaman ${pageNum} / ${pdfDoc.numPages}`;
        label.style.cssText =
          'font-size:11px;color:#94a3b8;font-weight:600;text-align:center;margin:0;';
        wrap.appendChild(label);
      }

      const canvas        = document.createElement('canvas');
      canvas.width        = vp.width;
      canvas.height       = vp.height;
      canvas.style.cssText =
        'width:100%;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.5);' +
        'background:#fff;display:block;';
      wrap.appendChild(canvas);

      await page.render({
        canvasContext: canvas.getContext('2d'),
        viewport: vp
      }).promise;
    }

    wrap.style.visibility = 'visible';
    wrap.classList.remove('hidden');
    document.getElementById('preview-pdf-loading').classList.add('hidden');

  } catch(err) {
    document.getElementById('preview-pdf-loading').innerHTML = `
      <i class="fa-solid fa-circle-exclamation text-rose-400 text-2xl mb-2"></i>
      <p class="text-sm text-rose-400">Gagal render preview: ${err.message}</p>`;
  }
}

function downloadQuotationPDF() {
  // Prioritas: gunakan base64 dari server (template Sheet)
  if (_activePdfBase64) {
    const byteChars = atob(_activePdfBase64);
    const byteArr   = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteArr[i] = byteChars.charCodeAt(i);
    }
    const blob = new Blob([byteArr], { type: 'application/pdf' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = _activePdfName || 'quotation.pdf';
    a.click();
    URL.revokeObjectURL(url);
    showNotification('PDF berhasil didownload: ' + _activePdfName);
    return;
  }
  // Fallback jsPDF
  if (_activePdfDoc) {
    _activePdfDoc.save(_activePdfName);
  }
}

    async function renderPDFKeCanvas(doc) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      const pdfBytes = doc.output('arraybuffer');
      const pdfDoc   = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
      const wrap     = document.getElementById('preview-pdf-canvas-wrap');
      wrap.innerHTML = '';

      // Tampilkan wrap dulu agar clientWidth terukur, tapi masih transparan
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.visibility = 'hidden'; // tidak terlihat tapi sudah punya dimensi

      // Ambil lebar setelah wrap visible secara layout
      const wrapW = Math.min(wrap.clientWidth || 340, 700);

      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page     = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1 });
        const scale    = (wrapW - 16) / viewport.width;
        const vp       = page.getViewport({ scale });

        if (pdfDoc.numPages > 1) {
          const label     = document.createElement('p');
          label.innerText = `Halaman ${pageNum} / ${pdfDoc.numPages}`;
          label.style.cssText = 'font-size:11px;color:#94a3b8;font-weight:600;text-align:center;margin:0;';
          wrap.appendChild(label);
        }

        const canvas = document.createElement('canvas');
        canvas.width  = vp.width;
        canvas.height = vp.height;
        canvas.style.cssText = 'width:100%;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.5);background:#fff;display:block;';
        wrap.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }

      // Setelah semua halaman selesai, tampilkan dan sembunyikan loading
      wrap.style.visibility = 'visible';
      wrap.classList.remove('hidden');
      document.getElementById('preview-pdf-loading').classList.add('hidden');
    }

function buatDokumenPDF(item) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    // ── KONSTANTA ──────────────────────────────────────────────────────────
    const PW   = 210;
    const ML   = 10;
    const MR   = 10;
    const CW   = PW - ML - MR;
    const BLUE = PDF_HDR_BG;   // #0b5394 (bar seksi & header tabel)

    const rpNum = v => Math.round(Math.abs(v)).toLocaleString('id-ID');

    // Data pendukung
    const klien = (erpState.klien || []).find(k => k.id === item.klienId) || {};
    let tc = {};
    try { tc = JSON.parse(item.termConditions || '{}'); } catch (e) {}
    let kelompokList = [];
    try { kelompokList = JSON.parse(item.items || '[]'); } catch (e) {}

    // ── HEADER KIRI (logo PNG + perusahaan) — helper bersama ───────────────
    _pdfHeaderKiri(doc, ML);

    // ── HEADER KANAN: "Quotation" + info doc ──────────────────────────────
    _pdfJudulKanan(doc, 'Quotation', PW, MR, { size: PDF_FS_TITLE, color: PDF_TITLE_COL, y: 15 });
    _pdfInfoKanan(doc, [
      ['Date',        item.tanggal || ''],
      ['Quotation #', item.id || ''],
      ['Rev',         String(item.rev ?? '0')],
    ], PW, MR, 25, 4.5);

    // ── QUOTATION TO ───────────────────────────────────────────────────────
    let curY = 41;
    curY = _pdfBarSeksi(doc, 'Quotation To :', ML, CW, curY);

    doc.setFillColor(PDF_CLIENT_BG[0], PDF_CLIENT_BG[1], PDF_CLIENT_BG[2]);
    doc.rect(ML, curY, CW, 20, 'F');   // tanpa border

    const c1L = ML + 2;
    const c1V = ML + 30;
    const c2L = ML + (CW / 2) + 2;
    const c2V = PW - MR;

    const clientRows = [
      ['Name',          klien.nama      || item.namaKlien  || '',
       'Quotation valid until:', item.validUntil || '-'],
      ['Company Name',  klien.perusahaan || '',
       'Prepared by:',          item.dibuatOleh || ''],
      ['Street Address', klien.alamat   || '', '', ''],
      ['Contact',       klien.kontak    || '', '', ''],
    ];

    clientRows.forEach((r, idx) => {
      const y = curY + 3.6 + idx * 4.2;
      doc.setFontSize(PDF_FS);
      doc.setFont(PDF_FONT, 'bold');
      doc.setTextColor(0, 0, 0);
      doc.text(r[0], c1L, y);
      doc.setFont(PDF_FONT, 'normal');
      doc.setTextColor(0, 0, 0);
      doc.text(r[1], c1V, y);
      if (r[2]) {
        doc.setFont(PDF_FONT, 'bold');
        doc.setTextColor(0, 0, 0);
        doc.text(r[2], c2L + 5, y);
        doc.setFont(PDF_FONT, 'normal');
        doc.setTextColor(0, 0, 0);
        doc.text(r[3], c2L + 42, y);   // value rata kiri
      }
    });
    curY += 22;

    // ── TABEL ITEM ─────────────────────────────────────────────────────────
    // Kelompok normal + kelompok DISCOUNT (jika ada) masuk ke tabel
    const tableBody = [];

    kelompokList.forEach((k, ki) => {
      const letter = String.fromCharCode(65 + ki); // A, B, C, D...
      const isDiscount = (k.namaKelompok || '').toUpperCase().includes('DISCOUNT') ||
                         (k.namaKelompok || '').toUpperCase().includes('DISKON');

      // Baris header kelompok
      tableBody.push([
        {
          content: letter,
          styles: {
            fontStyle: 'bold',
            fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG,
            textColor: isDiscount ? [160, 0, 0] : [10, 10, 10],
            fontStyle: isDiscount ? 'bolditalic' : 'bold',
          },
        },
        {
          content: k.namaKelompok,
          styles: {
            fontStyle: isDiscount ? 'bolditalic' : 'bold',
            fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG,
            textColor: isDiscount ? [160, 0, 0] : [10, 10, 10],
          },
        },
        { content: '', styles: { fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG } },
        { content: '', styles: { fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG } },
        { content: '', styles: { fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG } },
        {
          content: isDiscount
            ? (k.subtotal < 0 ? '-' : '') + rpNum(k.subtotal)
            : rpNum(k.subtotal),
          styles: {
            halign: 'right',
            fontStyle: isDiscount ? 'bolditalic' : 'bold',
            fillColor: isDiscount ? [255, 245, 245] : PDF_GROUP_BG,
            textColor: isDiscount ? [160, 0, 0] : [10, 10, 10],
          },
        },
      ]);

      // Baris sub-item
      k.subItems.forEach((s, si) => {
        const isNeg = (s.total || 0) < 0 || (s.harga || 0) < 0;
        tableBody.push([
          { content: String(si + 1), styles: { halign: 'center', fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] } },
          { content: s.deskripsi, styles: { fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] } },
          { content: String(s.qty), styles: { halign: 'center', fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] } },
          { content: s.unit || '', styles: { halign: 'center', fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] } },
          {
            content: s.harga ? (isNeg ? '-' : '') + rpNum(s.harga) : '',
            styles: { halign: 'right', fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] },
          },
          {
            content: s.total ? (isNeg ? '-' : '') + rpNum(s.total) : '',
            styles: { halign: 'right', fontStyle: isNeg ? 'italic' : 'normal', textColor: isNeg ? [160, 0, 0] : [0, 0, 0] },
          },
        ]);
      });
    });

    doc.autoTable({
      startY: curY,
      head: [[
        { content: 'No.',          styles: { halign: 'center' } },
        { content: 'Description',  styles: { halign: 'left'   } },
        { content: 'Qty',          styles: { halign: 'center' } },
        { content: 'Unit',         styles: { halign: 'center' } },
        { content: 'Price (IDR)',  styles: { halign: 'center' } },
        { content: 'Amount (IDR)', styles: { halign: 'center' } },
      ]],
      body: tableBody,
      theme: 'grid',
      margin: { left: ML, right: MR },
      columnStyles: {
        0: { cellWidth: 10,   halign: 'center' },
        1: { cellWidth: 'auto' },
        2: { cellWidth: 14,   halign: 'center' },
        3: { cellWidth: 14,   halign: 'center' },
        4: { cellWidth: 28,   halign: 'right'  },
        5: { cellWidth: 28,   halign: 'right'  },
      },
      headStyles: {
        fillColor:  BLUE,
        textColor:  [255, 255, 255],
        fontStyle:  'bold',
        fontSize:   PDF_FS,
        lineColor:  [255, 255, 255],
        lineWidth:  0,
      },
      bodyStyles: {
        fontSize:    PDF_FS,
        textColor:   [0, 0, 0],
        fillColor:   PDF_ROW_BG,
        lineColor:   [255, 255, 255],
        lineWidth:   0,
        cellPadding: 1.1,
      },
      alternateRowStyles: { fillColor: PDF_ROW_BG },
      styles: { overflow: 'linebreak', cellPadding: 1.1, lineWidth: 0 },
      didDrawCell: function (data) {
        // Hanya border kanan tiap sel (pemisah kolom) — putih tipis.
        doc.setDrawColor(255, 255, 255);
        doc.setLineWidth(0.4);
        var rx = data.cell.x + data.cell.width;
        doc.line(rx, data.cell.y, rx, data.cell.y + data.cell.height);
      },
    });

    curY = doc.lastAutoTable.finalY;

    // ── SUMMARY: SUBTOTAL / DISKON / PPN / GRAND TOTAL (kanan bawah tabel) ─
    curY += 0;
    const colLabelX = PW - MR - 62;
    const colValX   = PW - MR;
    const rowH      = 5;
    let   sy        = curY;

    const netSub = item.subtotal - (item.diskon || 0);

    const summaryLines = [];
    summaryLines.push({ label: 'Subtotal',    value: 'Rp ' + rpNum(item.subtotal), bold: false, highlight: false });
    if (item.diskon > 0) {
      summaryLines.push({ label: 'Diskon',    value: '- Rp ' + rpNum(item.diskon), bold: false, highlight: false, red: true });
    }
    if (item.pajak > 0) {
      const pajakPct = netSub > 0 ? Math.round((item.pajak / netSub) * 100) : 11;
      summaryLines.push({ label: 'PPN ' + pajakPct + '%', value: 'Rp ' + rpNum(item.pajak), bold: false, highlight: false });
    }
    summaryLines.push({ label: 'GRAND TOTAL', value: 'Rp ' + rpNum(item.grandTotal), bold: true, highlight: true });

    const summaryBoxW  = (PW - MR) - colLabelX;
    const totalSummaryH = summaryLines.length * rowH + 2;

    summaryLines.forEach((row, idx) => {
      const ry = sy + 1 + idx * rowH;

      // Baris normal (subtotal/diskon/ppn) #f3f3f3; GRAND TOTAL #d9d9d9.
      const bg = row.highlight ? PDF_GROUP_BG : PDF_ROW_BG;
      doc.setFillColor(bg[0], bg[1], bg[2]);
      doc.rect(colLabelX, ry - 0.5, summaryBoxW, rowH + 1, 'F');

      doc.setFontSize(PDF_FS);
      if (row.bold) {
        doc.setFont(PDF_FONT, 'bold');
        doc.setTextColor(0, 0, 0);
      } else if (row.red) {
        doc.setFont(PDF_FONT, 'normal');
        doc.setTextColor(180, 0, 0);
      } else {
        doc.setFont(PDF_FONT, 'normal');
        doc.setTextColor(0, 0, 0);
      }
      doc.text(row.label, colLabelX + 3, ry + 3.4);
      doc.text(row.value,  colValX - 2,   ry + 3.4, { align: 'right' });
    });
    // pemisah kolom label|value (putih tipis)
    doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.2);
    doc.line(colValX - 34, sy + 0.5, colValX - 34, sy + 0.5 + summaryLines.length * rowH);

    curY = sy + totalSummaryH + 6;
    
        // ── NOTES (header biru + kotak abu, tinggi auto) ──────────────────
        const catatan = tc.catatan || '';
        if (catatan) {
          const catatanLines = doc.splitTextToSize(catatan, CW - 4);
          const catatanH = catatanLines.length * 4 + 4;
          if (curY + 5 + catatanH > 285) { doc.addPage(); curY = 15; }
          curY = _pdfBarSeksi(doc, 'Notes :', ML, CW, curY);
          doc.setFillColor(PDF_ROW_BG[0], PDF_ROW_BG[1], PDF_ROW_BG[2]);
          doc.rect(ML, curY, CW, catatanH, 'F');
          doc.setFontSize(PDF_FS);
          doc.setFont(PDF_FONT, 'normal');
          doc.setTextColor(0, 0, 0);
          doc.text(catatanLines, ML + 2, curY + 4);
          curY += catatanH + 4;
        }

    // ── TERM & CONDITION ───────────────────────────────────────────────────
    // Format: "Label: Value" — 2 kolom, sesuai permintaan
    // Contoh: "Material Status: Ready Stock"
    if (curY > 200) { doc.addPage(); curY = 15; }

    doc.setFillColor(...BLUE);
    doc.rect(ML, curY, CW, 6, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont(PDF_FONT, 'bold');
    doc.setFontSize(PDF_FS);
    doc.text('Term & Condition :', ML + 2, curY + 4.2);
    curY += 8;

    // Daftar T&C: { label, value }
    // Sesuaikan field key dengan struktur data tc Anda
    const tcItems = [
      { label: 'Material Status',  value: tc.material_status || '-' },
      { label: 'Delivery Time',    value: tc.delivery_time   || '-' },
      { label: 'Delivery Cond.',   value: tc.delivery_cond   || '-' },
      { label: 'Warranty',         value: tc.warranty        || '-' },
    ];
    if (tc.kontrak) {
      var _kk = tc.kontrak;
      var _garTh = function(v) { return (v || v === 0) ? (v + (Number(v) === 1 ? ' Year' : ' Years')) : '-'; };
      tcItems.push(
        { label: 'Inverter Warranty',    value: _garTh(_kk.garansiInverter) },
        { label: 'Solar Panel Warranty', value: _garTh(_kk.garansiPanel) },
        { label: 'Battery Warranty',     value: _garTh(_kk.garansiBaterai) },
        { label: 'Installation Warranty',value: _garTh(_kk.garansiInstalasi) }
      );
    }
    // Termin Pembayaran (di akhir T&C): termin pertama = DP, terakhir = Final Payment
    if (tc.kontrak && tc.kontrak.termins && tc.kontrak.termins.length) {
      var _tms = tc.kontrak.termins, _nT = _tms.length;
      _tms.forEach(function(t, i) {
        var lbl = (_nT <= 1) ? 'Final Payment' : (i === 0 ? 'Down Payment' : (i === _nT - 1 ? 'Final Payment' : 'Term ' + (i + 1)));
        tcItems.push({ label: lbl, value: (t.persen || 0) + '%' + (t.ket && t.ket !== '-' ? ' ' + t.ket : '') });
      });
    } else {
      [['Down Payment', tc.dp_status], ['Term Payment', tc.term_pay], ['Final Payment', tc.final_pay]].forEach(function(p) {
        if (p[1]) tcItems.push({ label: p[0], value: p[1] });
      });
    }

    const tcColCount = 2;
    const tcItemW    = CW / tcColCount;
    const tcRowH     = 5;
    const tcRows2    = Math.ceil(tcItems.length / tcColCount);
    const tcTotalH   = tcRows2 * tcRowH + 2;

    doc.setFillColor(PDF_ROW_BG[0], PDF_ROW_BG[1], PDF_ROW_BG[2]);
    doc.rect(ML, curY - 1.5, CW, tcTotalH, 'F');
    // pemisah 2 kolom T&C (putih tipis) — hanya area item
    doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.4);
    doc.line(ML + tcItemW, curY - 1.5, ML + tcItemW, curY - 1.5 + tcTotalH);

    tcItems.forEach((tcItem, idx) => {
      const col = idx % tcColCount;
      const row = Math.floor(idx / tcColCount);
      const x   = ML + 3 + col * tcItemW;
      const y   = curY + 3 + row * tcRowH;

      doc.setFontSize(PDF_FS);
      doc.setTextColor(0, 0, 0);

      // Label bold
      doc.setFont(PDF_FONT, 'bold');
      const labelText = tcItem.label + ': ';
      doc.text(labelText, x, y);

      // Value normal, menyambung setelah label
      const labelW = doc.getTextWidth(labelText);
      doc.setFont(PDF_FONT, 'normal');
      doc.setTextColor(0, 0, 0);

      // Wrap value jika terlalu panjang
      const maxValW = tcItemW - labelW - 5;
      const valLines = doc.splitTextToSize(tcItem.value, maxValW);
      doc.text(valLines, x + labelW, y);
    });

    curY += tcTotalH + 4;

    // ── FOOTER ─────────────────────────────────────────────────────────────
    if (curY > 255) { doc.addPage(); curY = 15; }

    doc.setDrawColor(210, 215, 230);
    doc.setLineWidth(0.3);
    doc.line(ML, curY, PW - MR, curY);
    curY += 5;

    doc.setFontSize(PDF_FS);
    doc.setFont(PDF_FONT, 'normal');
    doc.setTextColor(0, 0, 0);
    doc.text(
      'If you have any questions concerning this quotation, contact Name, Phone Number, E-mail',
      ML, curY
    );

    doc.setFont(PDF_FONT, 'bold');
    doc.setTextColor(0, 0, 0);
    doc.text('THANK YOU FOR YOUR BUSINESS!', ML, curY + 5);

    // Tanda tangan kanan
    doc.setFont(PDF_FONT, 'normal');
    doc.setTextColor(0, 0, 0);
    doc.text('Best Regard,', PW - MR, curY, { align: 'right' });

    const namaText = item.dibuatOleh || 'Sales Executive';
    const namaY    = curY + 12;
    doc.setFont(PDF_FONT, 'bold');
    doc.setTextColor(0, 0, 0);
    doc.text(namaText, PW - MR, namaY, { align: 'right' });

    // Underline nama
    const namaW = doc.getTextWidth(namaText);
    doc.setDrawColor(20, 20, 20);
    doc.setLineWidth(0.3);
    doc.line(PW - MR - namaW, namaY + 1, PW - MR, namaY + 1);

    // ── RENDER PREVIEW (+ merge lampiran T&C via pipeline bersama) ───────────
    const pdfName  = _pdfNamaFile(`Quotation_${item.id.replace(/\//g, '-')}_Rev${item.rev}`);
    _activePdfDoc  = doc;
    _pdfFinishPreview(doc, pdfName, { mergeTC: true, kelompokList: kelompokList });

  } catch (err) {
    console.error(err);
    document.getElementById('preview-pdf-loading').innerHTML =
      `<i class="fa-solid fa-circle-exclamation text-rose-400 text-2xl mb-2"></i>
      <p class="text-sm text-rose-400">Gagal membuat PDF: ${err.message}</p>`;
    showNotification('Gagal generate PDF: ' + err.message, 'error');
  }
}
</script>
