<script>
// ================================================================
//  INVENTORY — JavaScript
// ================================================================

let _cachedStokData   = [];
let _cachedMutasiData = [];
let _invActiveTab     = 'stok';

function _fmtCurrencyInv(el) {
  var raw = el.value.replace(/\D/g, '');
  el.value = raw ? parseInt(raw, 10).toLocaleString('id-ID') : '';
}
function _parseCurrencyInv(val) {
  return parseInt((val || '').toString().replace(/\D/g, ''), 10) || 0;
}

function _fmtTglInv(s) {
  if (!s) return '—';
  // Already in dd/MM/yyyy or dd/MM/yyyy HH:mm → take first 10 chars and split
  var str = s.toString().trim();
  // ISO format: 2026-06-12T18:11:00.000Z
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    var parts = str.substring(0, 10).split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  // Already dd/MM/yyyy HH:mm → strip time
  if (/^\d{2}\/\d{2}\/\d{4}/.test(str)) return str.substring(0, 10);
  return str;
}

// ── Tab switching ──────────────────────────────────────────────

function switchInvTab(tab) {
  _invActiveTab = tab;
  document.getElementById('tab-stok').classList.toggle('hidden', tab !== 'stok');
  document.getElementById('tab-penerimaan').classList.toggle('hidden', tab !== 'penerimaan');
  document.getElementById('tab-mutasi').classList.toggle('hidden', tab !== 'mutasi');

  var active   = 'px-5 py-2 rounded-lg text-sm font-bold transition bg-white text-teal-700 shadow-sm';
  var inactive = 'px-5 py-2 rounded-lg text-sm font-bold transition text-slate-500 hover:text-slate-700';
  document.getElementById('tab-btn-stok').className        = tab === 'stok'        ? active : inactive;
  document.getElementById('tab-btn-penerimaan').className  = tab === 'penerimaan'  ? active : inactive;
  document.getElementById('tab-btn-mutasi').className      = tab === 'mutasi'      ? active : inactive;

  if (tab === 'penerimaan') {
    loadPOMenungguPenerimaan();
    loadRiwayatPenerimaanInv();
  }
}

// ── Visibility helpers ─────────────────────────────────────────

function _showInvSection(sectionId) {
  ['inv-list-section','form-penerimaan-tanpa-po','form-penyesuaian-stok'].forEach(function(id) {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(sectionId).classList.remove('hidden');
}

// ── Load & Render ──────────────────────────────────────────────

window.loadInventory = function() {
  _showInvSection('inv-list-section');
  switchInvTab('stok');
  _loadStok();
  loadPOMenungguPenerimaan();
};

let _stokFilters   = {};
let _mutasiFilters = {};

function _pgFetchStok() {
  if (typeof google === 'undefined') return;
  var state = _pgState.stok;
  google.script.run.withSuccessHandler(function(res) {
    var rows = (res && res.rows) || [];
    state.total = (res && res.total) || 0;
    _cachedStokData = rows;
    _pgRenderStok(rows);
    _renderPaginationBar('stok');
    _updateTotalNilaiStok(res && res.totalNilaiStok);
  }).getStokList(Object.assign({ page: state.page, perPage: state.perPage }, _stokFilters));
}
_pgFetchers.stok = _pgFetchStok;

function _loadStok() {
  document.getElementById('table-stok').innerHTML =
    '<tr><td colspan="7" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  _stokFilters = {};
  _pgState.stok.page = 1;
  _injectPgBar('stok', '#table-stok');
  _pgFetchStok();
}

function _pgFetchMutasi() {
  if (typeof google === 'undefined') return;
  var state = _pgState.mutasi;
  google.script.run.withSuccessHandler(function(res) {
    var rows = (res && res.rows) || [];
    state.total = (res && res.total) || 0;
    _cachedMutasiData = rows;
    _pgRenderMutasi(rows);
    _renderPaginationBar('mutasi');
  }).getMutasiStokList(Object.assign({ page: state.page, perPage: state.perPage }, _mutasiFilters));
}
_pgFetchers.mutasi = _pgFetchMutasi;

function _loadMutasi() {
  document.getElementById('table-mutasi').innerHTML =
    '<tr><td colspan="9" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  _populateMutasiProdukFilter();
  _mutasiFilters = {};
  _pgState.mutasi.page = 1;
  _injectPgBar('mutasi', '#table-mutasi');
  _pgFetchMutasi();
}

function _updateTotalNilaiStok(totalNilaiStok) {
  var el = document.getElementById('inv-total-nilai');
  if (el) el.textContent = 'Rp ' + (totalNilaiStok || 0).toLocaleString('id-ID');
}

// Dropdown filter produk Mutasi disumber dari Stok (selalu sudah dimuat lebih
// dulu) — Mutasi sendiri tidak lagi membawa array lengkap di client.
function _populateMutasiProdukFilter() {
  var sel = document.getElementById('filter-mutasi-produk');
  if (!sel) return;
  var produkSet = {};
  (_cachedStokData || []).forEach(function(d) { produkSet[d.idProduk] = d.namaProduk; });
  var opts = '<option value="">Semua Produk</option>';
  Object.keys(produkSet).sort().forEach(function(id) {
    opts += '<option value="' + _escHtml(id) + '">' + _escHtml(id + ' — ' + produkSet[id]) + '</option>';
  });
  sel.innerHTML = opts;
}

// ── Render functions (called by _pgRender) ─────────────────────

function _pgRenderStok(data) {
  const tbody = document.getElementById('table-stok');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400 italic">Tidak ada data stok.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(d) {
    var lowStock = d.qtyTersedia === 0;
    var qtyClass = lowStock ? 'text-red-600 font-extrabold' : (d.qtyTersedia <= 5 ? 'text-amber-600 font-bold' : 'font-bold text-slate-800');
    var idStok = d.idStok || d.idProduk;
    var aksiBtn = '<button onclick=\'bukaFormEditStok(' + JSON.stringify(d).replace(/'/g, "&#39;") + ')\' ' +
      'class="text-teal-600 hover:text-teal-800 transition mr-2" title="Edit Nama & Satuan"><i class="fa-solid fa-pen"></i></button>' +
      '<button onclick=\'bukaRincianLot(' + JSON.stringify(idStok).replace(/'/g, "&#39;") + ', ' + JSON.stringify(d.namaProduk || '').replace(/'/g, "&#39;") + ')\' ' +
      'class="text-violet-600 hover:text-violet-800 transition" title="Lihat Rincian Lot (FIFO)"><i class="fa-solid fa-layer-group"></i></button>';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition' + (lowStock ? ' bg-red-50' : '') + '">' +
      '<td class="p-4 font-mono text-xs font-bold text-slate-500">' + _escHtml(idStok) + '</td>' +
      '<td class="p-4 font-semibold text-slate-800">' + _escHtml(d.namaProduk) + '</td>' +
      '<td class="p-4 text-right ' + qtyClass + '">' + d.qtyTersedia.toLocaleString('id-ID') +
        (lowStock ? ' <span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full ml-1">Habis</span>' : '') + '</td>' +
      '<td class="p-4 text-center text-slate-500">' + _escHtml(d.satuan) + '</td>' +
      '<td class="p-4 text-right text-slate-700">Rp ' + (d.hargaBeliTerakhir || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-4 text-right font-bold text-teal-700">Rp ' + (d.nilaiStok || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-4 text-center text-xs text-slate-400">' + _fmtTglInv(d.terakhirDiubah) + '</td>' +
      '<td class="p-4 text-center">' + aksiBtn + '</td>' +
      '</tr>';
  }).join('');
}

// ── Edit Item Stok ───────────────────────────────────────────────

function bukaFormEditStok(d) {
  document.getElementById('edit-stok-idstok').value = d.idStok || d.idProduk || '';
  document.getElementById('edit-stok-id').innerText  = d.idStok || d.idProduk || '';
  document.getElementById('edit-stok-nama').value    = d.namaProduk || '';
  document.getElementById('edit-stok-satuan').value  = d.satuan || '';
  document.getElementById('form-edit-stok').classList.remove('hidden');
}

function tutupFormEditStok() {
  document.getElementById('form-edit-stok').classList.add('hidden');
}

function submitEditStok() {
  var idStok = document.getElementById('edit-stok-idstok').value;
  var nama   = (document.getElementById('edit-stok-nama').value || '').trim();
  var satuan = (document.getElementById('edit-stok-satuan').value || '').trim();
  if (!nama)   return showNotification('Nama item wajib diisi.', 'error');
  if (!satuan) return showNotification('Satuan wajib diisi.', 'error');

  toggleLoader(true, 'Menyimpan perubahan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupFormEditStok();
        _loadStok();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .editItemStok({ idStok: idStok, nama: nama, satuan: satuan });
}

// ── Rincian Lot FIFO ─────────────────────────────────────────────

function bukaRincianLot(idStok, namaProduk) {
  document.getElementById('rincian-lot-nama').innerText = idStok + ' — ' + (namaProduk || '');
  document.getElementById('rincian-lot-list').innerHTML =
    '<p class="text-xs text-slate-400 text-center py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat...</p>';
  document.getElementById('rincian-lot-total').innerHTML = '';
  document.getElementById('modal-rincian-lot').classList.remove('hidden');

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        document.getElementById('rincian-lot-list').innerHTML =
          '<p class="text-xs text-rose-500 text-center py-4">Gagal memuat rincian lot.</p>';
        return;
      }
      _renderRincianLot(res);
    })
    .withFailureHandler(function(err) {
      document.getElementById('rincian-lot-list').innerHTML =
        '<p class="text-xs text-rose-500 text-center py-4">' + (err && err.message ? err.message : err) + '</p>';
    })
    .getRincianLotProduk(idStok);
}

function _renderRincianLot(res) {
  var listEl = document.getElementById('rincian-lot-list');
  if (!res.lots || !res.lots.length) {
    listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Tidak ada lot tersisa (stok kosong).</p>';
    document.getElementById('rincian-lot-total').innerHTML = '';
    return;
  }
  listEl.innerHTML = res.lots.map(function(lot, idx) {
    var isOldest = idx === 0;
    return '<div class="flex items-center justify-between border rounded-xl px-3 py-2.5 ' +
      (isOldest ? 'border-amber-300 bg-amber-50' : 'border-slate-200 bg-white') + '">' +
      '<div>' +
        '<span class="text-xs font-extrabold text-slate-700">Lot ' + (idx + 1) + '</span>' +
        (isOldest ? ' <span class="text-[10px] font-bold bg-amber-500 text-white px-1.5 py-0.5 rounded-md ml-1">Dipakai Duluan</span>' : '') +
        '<p class="text-[11px] text-slate-400 mt-0.5">' + lot.qty.toLocaleString('id-ID') + ' unit @ Rp ' + lot.harga.toLocaleString('id-ID') + '</p>' +
      '</div>' +
      '<div class="text-sm font-bold text-teal-700">Rp ' + lot.nilai.toLocaleString('id-ID') + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('rincian-lot-total').innerHTML =
    '<span>Total ' + (res.qtyTotal || 0).toLocaleString('id-ID') + ' unit</span>' +
    '<span>Rp ' + (res.nilaiTotal || 0).toLocaleString('id-ID') + '</span>';
}

function tutupRincianLot() {
  document.getElementById('modal-rincian-lot').classList.add('hidden');
}

function _pgRenderMutasi(data) {
  const tbody = document.getElementById('table-mutasi');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-slate-400 italic">Tidak ada riwayat mutasi.</td></tr>';
    return;
  }
  const jenisBadge = {
    'Penerimaan PO':       'bg-teal-100 text-teal-700',
    'Penerimaan Non-PO':   'bg-blue-100 text-blue-700',
    'Penerimaan Tanpa PO': 'bg-blue-100 text-blue-700',
    'Penggunaan WO':       'bg-orange-100 text-orange-700',
    'Penyesuaian +':       'bg-emerald-100 text-emerald-700',
    'Penyesuaian -':       'bg-red-100 text-red-700'
  };
  tbody.innerHTML = data.map(function(d) {
    var badge = jenisBadge[d.jenisMutasi] || 'bg-slate-100 text-slate-600';
    var aksiBtn =
      '<button onclick=\'bukaFormEditMutasi(' + JSON.stringify(d).replace(/'/g, "&#39;") + ')\' ' +
        'class="text-slate-500 hover:text-slate-800 transition mr-2" title="Edit Keterangan"><i class="fa-solid fa-pen"></i></button>' +
      '<button onclick=\'hapusMutasi(' + JSON.stringify(d.idMutasi).replace(/'/g, "&#39;") + ')\' ' +
        'class="text-red-500 hover:text-red-700 transition" title="Hapus"><i class="fa-solid fa-trash"></i></button>';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition text-xs">' +
      '<td class="p-3">' +
        '<div class="font-mono font-bold text-slate-700">' + _escHtml(d.idMutasi) + '</div>' +
        '<div class="text-slate-400 mt-0.5">' + _escHtml(d.tanggal) + '</div>' +
      '</td>' +
      '<td class="p-3 font-semibold text-slate-700">' + _escHtml(d.namaProduk) + '</td>' +
      '<td class="p-3">' +
        '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + badge + '">' + _escHtml(d.jenisMutasi) + '</span>' +
        '<div class="text-slate-400 mt-1">' + _escHtml(d.referensi || '—') + '</div>' +
      '</td>' +
      '<td class="p-3 text-right font-bold text-teal-700">' + (d.qtyMasuk ? '+' + d.qtyMasuk.toLocaleString('id-ID') : '—') + '</td>' +
      '<td class="p-3 text-right font-bold text-red-600">' + (d.qtyKeluar ? '-' + d.qtyKeluar.toLocaleString('id-ID') : '—') + '</td>' +
      '<td class="p-3 text-right text-slate-600">Rp ' + (d.hargaSatuan || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-3 text-right font-bold text-slate-800">' + (d.saldoSetelah || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-3 text-slate-500 max-w-xs truncate">' + _escHtml(d.keterangan || '—') + '</td>' +
      '<td class="p-3 text-center whitespace-nowrap">' + aksiBtn + '</td>' +
      '</tr>';
  }).join('');
}

// ── Edit / Hapus Riwayat Mutasi ──────────────────────────────────

function bukaFormEditMutasi(d) {
  document.getElementById('edit-mutasi-idmutasi').value   = d.idMutasi || '';
  document.getElementById('edit-mutasi-id').innerText      = d.idMutasi || '';
  document.getElementById('edit-mutasi-keterangan').value  = d.keterangan || '';
  document.getElementById('form-edit-mutasi').classList.remove('hidden');
}

function tutupFormEditMutasi() {
  document.getElementById('form-edit-mutasi').classList.add('hidden');
}

function submitEditMutasi() {
  var idMutasi   = document.getElementById('edit-mutasi-idmutasi').value;
  var keterangan = (document.getElementById('edit-mutasi-keterangan').value || '').trim();

  toggleLoader(true, 'Menyimpan perubahan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupFormEditMutasi();
        _loadMutasi();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .editMutasiStok({ idMutasi: idMutasi, keterangan: keterangan });
}

function hapusMutasi(idMutasi) {
  showConfirm({
    type: 'danger',
    title: 'Hapus Riwayat Mutasi?',
    message: 'Hapus riwayat mutasi ' + idMutasi + '? Saldo stok akan dihitung ulang dari riwayat yang tersisa.',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      toggleLoader(true, 'Menghapus riwayat mutasi...');
      google.script.run
        .withSuccessHandler(function(res) {
          toggleLoader(false);
          if (res.success) {
            showNotification(res.message, 'success');
            _loadMutasi();
            _loadStok();
          } else {
            showNotification(res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showNotification('Error: ' + err.message, 'error');
        })
        .hapusMutasiStok(idMutasi);
    }
  });
}

// ── Filter ─────────────────────────────────────────────────────

window.filterStok = _debounce(function() {
  _stokFilters = { search: (document.getElementById('search-stok').value || '').trim() };
  _pgState.stok.page = 1;
  _pgFetchStok();
}, 350);

window.filterMutasi = function() {
  _mutasiFilters = {
    idProduk:    (document.getElementById('filter-mutasi-produk').value || '').trim(),
    jenisMutasi: (document.getElementById('filter-mutasi-jenis').value || '').trim()
  };
  _pgState.mutasi.page = 1;
  _pgFetchMutasi();
};

// Tab mutasi lazy-load
document.getElementById('tab-btn-mutasi').addEventListener('click', function() {
  if (!_cachedMutasiData.length) _loadMutasi();
});

// ── Stok dropdown helper ───────────────────────────────────────

function _loadStokOptions(selId, selectedId) {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(data) {
    var sel  = document.getElementById(selId);
    if (!sel) return;
    var opts = '<option value="">-- Pilih Item Stok --</option>';
    (data || []).forEach(function(s) {
      var sel2 = selectedId && s.idStok === selectedId ? ' selected' : '';
      opts += '<option value="' + _escHtml(s.idStok) + '" data-satuan="' + _escHtml(s.satuan) + '"' + sel2 + '>' +
        _escHtml(s.idStok + ' — ' + s.namaProduk) + '</option>';
    });
    sel.innerHTML = opts;
  }).getStokList();
}

// Alias untuk backward compat
function _loadProdukMaterialOptions(selId) { _loadStokOptions(selId, ''); }

// ── Form Penerimaan Tanpa PO ───────────────────────────────────

function _setPtnpoMode(mode) {
  var isExisting = mode === 'existing';
  document.getElementById('ptnpo-panel-existing').classList.toggle('hidden', !isExisting);
  document.getElementById('ptnpo-panel-baru').classList.toggle('hidden', isExisting);
  var btnE = document.getElementById('ptnpo-mode-existing');
  var btnB = document.getElementById('ptnpo-mode-baru');
  var active   = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-teal-700 shadow-sm';
  var inactive = 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-700';
  btnE.className = isExisting ? active : inactive;
  btnB.className = isExisting ? inactive : active;
}

function bukaFormPenerimaanTanpaPO() {
  var tgl = new Date(); tgl = tgl.toISOString().slice(0, 10);
  document.getElementById('ptnpo-tanggal').value = tgl;
  document.getElementById('ptnpo-qty').value = '';
  document.getElementById('ptnpo-harga').value = '';
  document.getElementById('ptnpo-keterangan').value = '';
  document.getElementById('ptnpo-nama-baru').value = '';
  document.getElementById('ptnpo-satuan-baru').value = '';
  _setPtnpoMode('existing');
  _loadProdukMaterialOptions('sel-produk-ptnpo');
  document.getElementById('form-penerimaan-tanpa-po').classList.remove('hidden');
}

function tutupFormPenerimaanTanpaPO() {
  document.getElementById('form-penerimaan-tanpa-po').classList.add('hidden');
}

function _loadAkunPembayaranOptions(selId) {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(res) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    var list = (res && res.list) ? res.list : (Array.isArray(res) ? res : []);
    var opts = '<option value="">-- Kosongkan untuk Stok Awal --</option>';
    list.filter(function(a){ return a.status === 'Aktif'; }).forEach(function(a) {
      opts += '<option value="' + _escHtml(a.id) + '" data-nama="' + _escHtml(a.namaAkun) + '">' +
        _escHtml(a.namaAkun) + ' (' + _escHtml(a.tipe) + ')</option>';
    });
    sel.innerHTML = opts;
  }).withFailureHandler(function() {}).getAkunPembayaranList();
}

function submitPenerimaanTanpaPO() {
  var tanggal    = document.getElementById('ptnpo-tanggal').value;
  var qty        = parseFloat(document.getElementById('ptnpo-qty').value) || 0;
  var harga      = _parseCurrencyInv(document.getElementById('ptnpo-harga').value);
  var keterangan = document.getElementById('ptnpo-keterangan').value.trim();

  if (!tanggal)  return showNotification('Tanggal wajib diisi.', 'error');
  if (qty <= 0)  return showNotification('Qty harus lebih dari 0.', 'error');
  if (harga <= 0) return showNotification('Harga satuan harus lebih dari 0.', 'error');

  var panelBaru = document.getElementById('ptnpo-panel-baru');
  var isNewMode = !panelBaru.classList.contains('hidden');
  var idStok = '', namaBaru = '', satuanBaru = '';

  if (isNewMode) {
    namaBaru   = document.getElementById('ptnpo-nama-baru').value.trim();
    satuanBaru = document.getElementById('ptnpo-satuan-baru').value.trim();
    if (!namaBaru)   return showNotification('Nama item baru wajib diisi.', 'error');
    if (!satuanBaru) return showNotification('Satuan item baru wajib diisi.', 'error');
  } else {
    idStok = document.getElementById('sel-produk-ptnpo').value;
    if (!idStok) return showNotification('Pilih item stok atau pilih "Item Baru".', 'error');
  }

  toggleLoader(true, 'Menyimpan penerimaan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        tutupFormPenerimaanTanpaPO();
        showNotification(res.message, 'success');
        _cachedStokData = [];
        _cachedMutasiData = [];
        window.loadInventory();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .simpanPenerimaanTanpaPO({
      tanggal: tanggal, idStok: idStok,
      namaBaru: namaBaru, satuanBaru: satuanBaru,
      qty: qty, hargaSatuan: harga,
      keterangan: keterangan,
      namaUser: (_currentUser && _currentUser.nama) || ''
    });
}

// ── Form Penyesuaian Stok ──────────────────────────────────────

function bukaFormPenyesuaian() {
  document.getElementById('adj-qty').value = '';
  document.getElementById('adj-keterangan').value = '';
  document.getElementById('adj-jenis').value = '+';
  _loadProdukMaterialOptions('sel-produk-adj');
  document.getElementById('form-penyesuaian-stok').classList.remove('hidden');
}

function tutupFormPenyesuaian() {
  document.getElementById('form-penyesuaian-stok').classList.add('hidden');
}

function submitPenyesuaianStok() {
  var idProduk   = document.getElementById('sel-produk-adj').value;
  var jenis      = document.getElementById('adj-jenis').value;
  var qty        = parseFloat(document.getElementById('adj-qty').value) || 0;
  var keterangan = document.getElementById('adj-keterangan').value.trim();

  if (!idProduk)   return showNotification('Produk wajib dipilih.', 'error');
  if (qty <= 0)    return showNotification('Qty harus lebih dari 0.', 'error');
  if (!keterangan) return showNotification('Keterangan wajib diisi.', 'error');

  toggleLoader(true, 'Menyimpan penyesuaian...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        tutupFormPenyesuaian();
        showNotification(res.message, 'success');
        _cachedStokData = [];
        _cachedMutasiData = [];
        window.loadInventory();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .simpanPenyesuaianStok({
      idProduk: idProduk, idStok: idProduk, jenis: jenis, qty: qty,
      keterangan: keterangan,
      namaUser: (_currentUser && _currentUser.nama) || ''
    });
}

// ── Tab Penerimaan Barang: PO Menunggu Gudang ──────────────────

var _currentPOGudang = null; // { noPO, namaSupplier, items }

function loadPOMenungguPenerimaan() {
  var tbody = document.getElementById('table-po-gudang');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  google.script.run
    .withSuccessHandler(function(data) {
      var list = data || [];
      document.getElementById('po-gudang-count').innerText = list.length ? list.length + ' PO' : '';
      var badge = document.getElementById('inv-penerimaan-badge');
      if (badge) {
        badge.textContent = list.length;
        badge.classList.toggle('hidden', list.length === 0);
      }
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400 italic">Tidak ada PO yang menunggu penerimaan gudang.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function(po) {
        var noWO   = po.noWO || '';
        var proyek = po.namaProject || '';
        return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">' +
          '<td class="p-4">' +
            '<div class="font-mono font-bold text-teal-700 text-sm">' + _escHtmlInv(po.noPO) + '</div>' +
            '<div class="text-xs text-slate-400 mt-0.5">' + _fmtTglInv(po.tanggal) + '</div>' +
          '</td>' +
          '<td class="p-4">' +
            '<div class="text-sm font-medium text-slate-800">' + _escHtmlInv(po.peruntukan || po.namaSupplier || '—') + '</div>' +
            '<div class="text-xs text-slate-400 mt-0.5">' + _escHtmlInv(po.namaSupplier) + '</div>' +
          '</td>' +
          '<td class="p-4">' +
            (noWO
              ? '<div class="font-mono text-sm text-teal-700">' + _escHtmlInv(noWO) + '</div>' +
                (proyek ? '<div class="text-xs text-slate-400 mt-0.5">' + _escHtmlInv(proyek) + '</div>' : '')
              : '<span class="text-slate-400 text-sm">—</span>') +
          '</td>' +
          '<td class="p-4 text-center"><span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-lg text-xs font-bold">' + po.jumlahItemPending + ' item</span></td>' +
          '<td class="p-4 text-center"><button onclick="bukaProsesTerimaPOGudang(' + JSON.stringify(po).replace(/"/g,'&quot;') + ')" class="px-3 py-1.5 text-xs bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-bold transition">Proses</button></td>' +
        '</tr>';
      }).join('');
    })
    .withFailureHandler(function() {
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-red-500">Gagal memuat data.</td></tr>';
    })
    .getPOMenungguPenerimaan();
}

function _escHtmlInv(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadRiwayatPenerimaanInv() {
  var tbody = document.getElementById('table-riwayat-penerimaan');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  var modeClass = {
    'Langsung': 'bg-blue-100 text-blue-700',
    'Gudang':   'bg-amber-100 text-amber-700'
  };
  google.script.run
    .withSuccessHandler(function(res) {
      var list = (res && res.list) || [];
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400 italic">Belum ada riwayat penerimaan barang.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function(r) {
        var mc = modeClass[r.mode] || 'bg-slate-100 text-slate-600';
        var itemList = (r.items || []).map(function(it) {
          return _escHtmlInv(it.namaItem || '') + ' (' + (it.qty || 0) + (it.satuan ? ' ' + _escHtmlInv(it.satuan) : '') + ')';
        }).join('<br>');
        var catatanList = (r.items || []).map(function(it) {
          return (it.catatan || '').toString().trim();
        }).filter(function(c) { return c; }).join('<br>');
        var buktiHtml = r.buktiFileUrl
          ? '<a href="' + _escHtmlInv(r.buktiFileUrl) + '" target="_blank" class="inline-flex items-center gap-1 text-teal-600 hover:text-teal-700 font-semibold" title="Lihat bukti barang diterima"><i class="fa-solid fa-image"></i> Lihat</a>'
          : '<span class="text-slate-300">—</span>';
        return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">' +
          '<td class="p-4"><div class="font-mono font-bold text-teal-700 text-sm">' + _escHtmlInv(r.noPO) + '</div><div class="text-xs text-slate-400 mt-0.5">' + _fmtTglInv(r.tanggal) + '</div></td>' +
          '<td class="p-4"><div class="text-sm font-medium text-slate-800">' + _escHtmlInv(r.peruntukan || r.namaSupplier || '—') + '</div><div class="text-xs text-slate-400 mt-0.5">' + _escHtmlInv(r.namaSupplier) + '</div></td>' +
          '<td class="p-4 text-xs font-mono text-teal-700">' + (r.noWO ? _escHtmlInv(r.noWO) : '<span class="text-slate-400">—</span>') + '</td>' +
          '<td class="p-4 text-center"><span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ' + mc + '">' + _escHtmlInv(r.mode || '') + '</span></td>' +
          '<td class="p-4 text-xs text-slate-600">' + (itemList || '—') + '</td>' +
          '<td class="p-4 text-xs text-rose-600">' + (catatanList || '<span class="text-slate-400">—</span>') + '</td>' +
          '<td class="p-4 text-xs text-slate-500">' + _escHtmlInv(r.dibuatOleh) + '</td>' +
          '<td class="p-4 text-center">' + buktiHtml + '</td>' +
        '</tr>';
      }).join('');
    })
    .withFailureHandler(function(err) {
      tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-rose-400">Gagal memuat: ' + (err.message || '') + '</td></tr>';
    })
    .getRiwayatPenerimaanList({});
}

function _resetTerimaGudangBuktiFileField() { _removeFileField('terima-gudang-bukti-file'); }
function handleTerimaGudangBuktiFileChange(input) { _uploadSupplierFile('terima-gudang-bukti-file', input, 'uploadFileBuktiPenerimaanPO', 'teal'); }

function bukaProsesTerimaPOGudang(po) {
  _currentPOGudang = po;
  document.getElementById('terima-po-gudang-subtitle').innerText = po.noPO + ' — ' + po.namaSupplier +
    (po.ppnPersen ? ' (PPN ' + po.ppnPersen + '%)' : '');
  document.getElementById('terima-po-gudang-biaya').value = '';
  document.getElementById('terima-po-gudang-ket-biaya').value = '';
  _resetTerimaGudangBuktiFileField();
  _loadAkunPembayaranOptions('terima-po-gudang-akun');
  var tbody = document.getElementById('terima-po-gudang-items');

  // Load stok list for dropdowns
  google.script.run
    .withSuccessHandler(function(stokList) {
      var optHtml = '<option value="">— Pilih Item Stok —</option>' +
        (stokList || []).map(function(s) {
          return '<option value="' + _escHtmlInv(s.idStok) + '">' + _escHtmlInv(s.idStok) + ' — ' + _escHtmlInv(s.namaProduk) + ' (' + (s.qtyTersedia || 0) + ' ' + _escHtmlInv(s.satuan) + ')</option>';
        }).join('');

      tbody.innerHTML = (po.items || []).map(function(it) {
        var harga = it.hargaBeli ? parseInt(it.hargaBeli).toLocaleString('id-ID') : '—';
        return '<tr class="border-b border-slate-100" data-id-item="' + _escHtmlInv(it.idItem) + '">' +
          '<td class="p-4 text-sm font-medium text-slate-800">' + _escHtmlInv(it.namaItem) + '</td>' +
          '<td class="p-4 text-center text-sm text-slate-500">Rp ' + harga + '</td>' +
          '<td class="p-4 text-center text-sm font-bold text-amber-700">' + it.qtySisa + '</td>' +
          '<td class="p-4 text-center"><input type="number" class="pg-gudang-qty w-24 px-3 py-2.5 text-sm border border-slate-200 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-teal-200 focus:border-teal-400" min="0" max="' + it.qtySisa + '" value="0" data-sisa="' + it.qtySisa + '" data-nama="' + _escHtmlInv(it.namaItem) + '" data-harga="' + (it.hargaBeli || 0) + '"></td>' +
          '<td class="p-4"><select class="pg-gudang-stok w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-200 focus:border-teal-400 bg-white">' + optHtml + '</select></td>' +
          '<td class="p-4"><input type="text" class="pg-gudang-catatan w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-400" placeholder="cth: 1 unit rusak, retur ke supplier"></td>' +
        '</tr>';
      }).join('') || '<tr><td colspan="6" class="p-6 text-center text-slate-400 italic">Tidak ada item.</td></tr>';
    })
    .getStokList();

  document.getElementById('form-terima-po-gudang').classList.remove('hidden');
}

function tutupModalTerimaPOGudang() {
  document.getElementById('form-terima-po-gudang').classList.add('hidden');
  _currentPOGudang = null;
}

function submitProsesTerimaPOGudang() {
  if (!_currentPOGudang) return;
  var rows  = document.querySelectorAll('#terima-po-gudang-items tr[data-id-item]');
  var items = [];
  var hasError = false;
  rows.forEach(function(row) {
    if (hasError) return;
    var idItem   = row.getAttribute('data-id-item');
    var qtyInput = row.querySelector('.pg-gudang-qty');
    var stokSel  = row.querySelector('.pg-gudang-stok');
    var catatanInput = row.querySelector('.pg-gudang-catatan');
    if (!qtyInput) return;
    var qty      = parseFloat(qtyInput.value) || 0;
    var catatan  = (catatanInput && catatanInput.value.trim()) || '';
    if (qty <= 0 && !catatan) return;
    var namaItem = qtyInput.getAttribute('data-nama') || idItem;
    var sisa     = parseFloat(qtyInput.getAttribute('data-sisa')) || 0;
    var hargaBeli = parseFloat(qtyInput.getAttribute('data-harga')) || 0;
    var idStok   = (stokSel && stokSel.value) ? stokSel.value.trim() : '';
    if (qty > sisa) {
      showNotification('Qty melebihi sisa untuk "' + namaItem + '" (sisa: ' + sisa + ').', 'error');
      hasError = true; return;
    }
    items.push({ idItem: idItem, namaItem: namaItem, qty: qty, idStok: idStok, idProduk: idStok, hargaBeli: hargaBeli, satuan: '', catatan: catatan });
  });
  if (hasError) return;
  if (!items.length) return showNotification('Masukkan qty yang akan diterima.', 'error');

  var biayaTambahan = _parseCurrencyInv(document.getElementById('terima-po-gudang-biaya').value);
  var akunSel = document.getElementById('terima-po-gudang-akun');
  var idAkunBiaya = akunSel.value || '';
  var namaAkunBiaya = idAkunBiaya ? (akunSel.options[akunSel.selectedIndex].getAttribute('data-nama') || '') : '';
  var keteranganBiaya = (document.getElementById('terima-po-gudang-ket-biaya').value || '').trim();
  if (biayaTambahan > 0 && !idAkunBiaya) {
    return showNotification('Pilih akun pembayaran untuk biaya tambahan penerimaan.', 'error');
  }

  var buktiFileUrl = document.getElementById('terima-gudang-bukti-file-url').value;
  if (!buktiFileUrl) return showNotification('Bukti barang diterima inventory wajib dilampirkan.', 'error');
  var buktiFileId   = document.getElementById('terima-gudang-bukti-file-id').value;
  var buktiFileName = document.getElementById('terima-gudang-bukti-file-name').value;

  toggleLoader(true, 'Menyimpan penerimaan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupModalTerimaPOGudang();
        loadPOMenungguPenerimaan();
        loadInventory();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .terimaPOItems({
      noPO: _currentPOGudang.noPO,
      items: items,
      namaUser: (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) || '',
      biayaTambahan: biayaTambahan,
      idAkunBiaya: idAkunBiaya,
      namaAkunBiaya: namaAkunBiaya,
      keteranganBiaya: keteranganBiaya,
      buktiFileId: buktiFileId,
      buktiFileUrl: buktiFileUrl,
      buktiFileName: buktiFileName
    });
}

// ── Form Catat Penggunaan Stok ─────────────────────────────────

function bukaFormPenggunaanStok() {
  var tgl = new Date().toISOString().slice(0, 10);
  document.getElementById('penggunaan-tanggal').value = tgl;
  document.getElementById('penggunaan-qty').value = '';
  document.getElementById('penggunaan-keterangan').value = '';
  _loadStokOptions('sel-stok-penggunaan', '');
  _loadWOOptionsForInventory('sel-wo-penggunaan');
  document.getElementById('form-penggunaan-stok').classList.remove('hidden');
}

function tutupFormPenggunaanStok() {
  document.getElementById('form-penggunaan-stok').classList.add('hidden');
}

function _loadWOOptionsForInventory(selId) {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(data) {
    var sel = document.getElementById(selId);
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Tidak terikat WO --</option>';
    (data || []).filter(function(w) { return w.status === 'Deal'; }).forEach(function(w) {
      var opt = document.createElement('option');
      opt.value = w.noWO;
      opt.textContent = w.noWO + ' – ' + (w.namaProject || w.namaKlien || '');
      sel.appendChild(opt);
    });
  }).withFailureHandler(function() {}).getWorkOrderList();
}

function submitPenggunaanStok() {
  var idStok     = document.getElementById('sel-stok-penggunaan').value;
  var noWO       = document.getElementById('sel-wo-penggunaan').value;
  var tanggal    = document.getElementById('penggunaan-tanggal').value;
  var qty        = parseFloat(document.getElementById('penggunaan-qty').value) || 0;
  var keterangan = document.getElementById('penggunaan-keterangan').value.trim();

  if (!idStok)   return showNotification('Item stok wajib dipilih.', 'error');
  if (!tanggal)  return showNotification('Tanggal wajib diisi.', 'error');
  if (qty <= 0)  return showNotification('Qty harus lebih dari 0.', 'error');

  toggleLoader(true, 'Menyimpan penggunaan stok...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        tutupFormPenggunaanStok();
        showNotification(res.message, 'success');
        _cachedStokData = [];
        _cachedMutasiData = [];
        window.loadInventory();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .gunakanStok(noWO, idStok, qty, tanggal, keterangan,
      (_currentUser && _currentUser.nama) || '');
}
