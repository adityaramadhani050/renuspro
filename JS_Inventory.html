<script>
// ================================================================
//  INVENTORY — JavaScript
// ================================================================

let _cachedStokData   = [];
let _cachedMutasiData = [];
let _invActiveTab     = 'stok';

function _fmtCurrencyInv(el) {
  var raw = el.value.replace(/\D/g, '');
  el.value = raw ? parseInt(raw, 10).toLocaleString('id-ID') : '';
}
function _parseCurrencyInv(val) {
  return parseInt((val || '').toString().replace(/\D/g, ''), 10) || 0;
}

function _fmtTglInv(s) {
  if (!s) return '—';
  // Already in dd/MM/yyyy or dd/MM/yyyy HH:mm → take first 10 chars and split
  var str = s.toString().trim();
  // ISO format: 2026-06-12T18:11:00.000Z
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    var parts = str.substring(0, 10).split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  // Already dd/MM/yyyy HH:mm → strip time
  if (/^\d{2}\/\d{2}\/\d{4}/.test(str)) return str.substring(0, 10);
  return str;
}

// ── Tab switching ──────────────────────────────────────────────

function switchInvTab(tab) {
  _invActiveTab = tab;
  document.getElementById('tab-stok').classList.toggle('hidden', tab !== 'stok');
  document.getElementById('tab-penerimaan').classList.toggle('hidden', tab !== 'penerimaan');
  document.getElementById('tab-mutasi').classList.toggle('hidden', tab !== 'mutasi');
  var tp = document.getElementById('tab-pengiriman'); if (tp) tp.classList.toggle('hidden', tab !== 'pengiriman');

  var active   = 'px-5 py-2 rounded-lg text-sm font-bold transition bg-white text-teal-700 shadow-sm';
  var inactive = 'px-5 py-2 rounded-lg text-sm font-bold transition text-slate-500 hover:text-slate-700';
  document.getElementById('tab-btn-stok').className        = tab === 'stok'        ? active : inactive;
  document.getElementById('tab-btn-penerimaan').className  = tab === 'penerimaan'  ? active : inactive;
  document.getElementById('tab-btn-mutasi').className      = tab === 'mutasi'      ? active : inactive;
  var tpb = document.getElementById('tab-btn-pengiriman'); if (tpb) tpb.className = tab === 'pengiriman' ? active : inactive;

  if (tab === 'penerimaan') loadPenerimaanBarang();
  if (tab === 'pengiriman') loadPengirimanBarang();
}

// ── Visibility helpers ─────────────────────────────────────────

function _showInvSection(sectionId) {
  ['inv-list-section','form-penerimaan-tanpa-po','form-penyesuaian-stok'].forEach(function(id) {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(sectionId).classList.remove('hidden');
}

// ── Load & Render ──────────────────────────────────────────────

window.loadInventory = function() {
  _showInvSection('inv-list-section');
  switchInvTab('stok');
  _loadStok();
  loadPenerimaanBarang();
};

function _loadStok() {
  if (typeof google === 'undefined') return;
  document.getElementById('table-stok').innerHTML =
    '<tr><td colspan="7" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  google.script.run.withSuccessHandler(function(data) {
    _cachedStokData = data || [];
    _pgState.stok.data = data;
    _pgState.stok.page = 1;
    _injectPgBar('stok', '#table-stok');
    _pgRender('stok');
    _updateTotalNilaiStok();
  }).getStokList();
}

function _loadMutasi() {
  if (typeof google === 'undefined') return;
  document.getElementById('table-mutasi').innerHTML =
    '<tr><td colspan="9" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  google.script.run.withSuccessHandler(function(data) {
    _cachedMutasiData = data || [];
    _populateMutasiProdukFilter(data);
    _pgState.mutasi.data = data;
    _pgState.mutasi.page = 1;
    _injectPgBar('mutasi', '#table-mutasi');
    _pgRender('mutasi');
  }).getMutasiStokList({});
}

function _updateTotalNilaiStok() {
  var total = (_cachedStokData || []).reduce(function(s, d) { return s + (d.nilaiStok || 0); }, 0);
  var el = document.getElementById('inv-total-nilai');
  if (el) el.textContent = 'Rp ' + total.toLocaleString('id-ID');
}

function _populateMutasiProdukFilter(data) {
  var sel = document.getElementById('filter-mutasi-produk');
  if (!sel) return;
  var produkSet = {};
  (data || []).forEach(function(d) { produkSet[d.idProduk] = d.namaProduk; });
  var opts = '<option value="">Semua Produk</option>';
  Object.keys(produkSet).sort().forEach(function(id) {
    opts += '<option value="' + _escHtml(id) + '">' + _escHtml(id + ' — ' + produkSet[id]) + '</option>';
  });
  sel.innerHTML = opts;
}

// ── Render functions (called by _pgRender) ─────────────────────

function _pgRenderStok(data) {
  const tbody = document.getElementById('table-stok');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-slate-400 italic">Tidak ada data stok.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(d) {
    var lowStock = d.qtyTersedia === 0;
    var qtyClass = lowStock ? 'text-red-600 font-extrabold' : (d.qtyTersedia <= 5 ? 'text-amber-600 font-bold' : 'font-bold text-slate-800');
    var idStok = d.idStok || d.idProduk;
    var hold = Number(d.qtyHold) || 0;
    var reservedCell = hold > 0
      ? '<span class="font-bold text-indigo-600">' + hold.toLocaleString('id-ID') + '</span>'
      : '<span class="text-slate-300">0</span>';
    var reserveBtn = hold > 0
      ? '<button onclick=\'bukaReserveDetail(' + JSON.stringify(idStok).replace(/'/g, "&#39;") + ', ' + JSON.stringify(d.namaProduk || '').replace(/'/g, "&#39;") + ')\' ' +
        'class="text-indigo-600 hover:text-indigo-800 transition mr-2" title="Detail Reserve per WO/Proyek"><i class="fa-solid fa-list-check"></i></button>'
      : '';
    var aksiBtn = reserveBtn +
      '<button onclick=\'bukaFormEditStok(' + JSON.stringify(d).replace(/'/g, "&#39;") + ')\' ' +
      'class="text-teal-600 hover:text-teal-800 transition mr-2" title="Edit Nama & Satuan"><i class="fa-solid fa-pen"></i></button>' +
      '<button onclick=\'bukaRincianLot(' + JSON.stringify(idStok).replace(/'/g, "&#39;") + ', ' + JSON.stringify(d.namaProduk || '').replace(/'/g, "&#39;") + ')\' ' +
      'class="text-violet-600 hover:text-violet-800 transition" title="Lihat Rincian Lot (FIFO)"><i class="fa-solid fa-layer-group"></i></button>';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition' + (lowStock ? ' bg-red-50' : '') + '">' +
      '<td class="p-4 font-mono text-xs font-bold text-slate-500" data-label="ID Stok">' + _escHtml(idStok) + '</td>' +
      '<td class="p-4 font-semibold text-slate-800" data-label="Nama Item">' + _escHtml(d.namaProduk) + '</td>' +
      '<td class="p-4 text-right" data-label="Reserved">' + reservedCell + '</td>' +
      '<td class="p-4 text-right ' + qtyClass + '" data-label="Stok Tersedia">' + d.qtyTersedia.toLocaleString('id-ID') +
        (lowStock ? ' <span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full ml-1">Habis</span>' : '') + '</td>' +
      '<td class="p-4 text-center text-slate-500" data-label="Satuan">' + _escHtml(d.satuan) + '</td>' +
      '<td class="p-4 text-right text-slate-700" data-label="Harga Beli Terakhir">Rp ' + (d.hargaBeliTerakhir || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-4 text-right font-bold text-teal-700" data-label="Total Nilai Stok">Rp ' + (d.nilaiStok || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-4 text-center text-xs text-slate-400" data-label="Terakhir Diubah">' + _fmtTglInv(d.terakhirDiubah) + '</td>' +
      '<td class="p-4 text-center rp-actions">' + aksiBtn + '</td>' +
      '</tr>';
  }).join('');
}

// ── Edit Item Stok ───────────────────────────────────────────────

function bukaFormEditStok(d) {
  document.getElementById('edit-stok-idstok').value = d.idStok || d.idProduk || '';
  document.getElementById('edit-stok-id').innerText  = d.idStok || d.idProduk || '';
  document.getElementById('edit-stok-nama').value    = d.namaProduk || '';
  document.getElementById('edit-stok-satuan').value  = d.satuan || '';
  document.getElementById('form-edit-stok').classList.remove('hidden');
}

function tutupFormEditStok() {
  document.getElementById('form-edit-stok').classList.add('hidden');
}

function submitEditStok() {
  var idStok = document.getElementById('edit-stok-idstok').value;
  var nama   = (document.getElementById('edit-stok-nama').value || '').trim();
  var satuan = (document.getElementById('edit-stok-satuan').value || '').trim();
  if (!nama)   return showNotification('Nama item wajib diisi.', 'error');
  if (!satuan) return showNotification('Satuan wajib diisi.', 'error');

  toggleLoader(true, 'Menyimpan perubahan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupFormEditStok();
        _loadStok();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .editItemStok({ idStok: idStok, nama: nama, satuan: satuan });
}

// ── Rincian Lot FIFO ─────────────────────────────────────────────

function bukaRincianLot(idStok, namaProduk) {
  document.getElementById('rincian-lot-nama').innerText = idStok + ' — ' + (namaProduk || '');
  document.getElementById('rincian-lot-list').innerHTML =
    '<p class="text-xs text-slate-400 text-center py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat...</p>';
  document.getElementById('rincian-lot-total').innerHTML = '';
  document.getElementById('modal-rincian-lot').classList.remove('hidden');

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        document.getElementById('rincian-lot-list').innerHTML =
          '<p class="text-xs text-rose-500 text-center py-4">Gagal memuat rincian lot.</p>';
        return;
      }
      _renderRincianLot(res);
    })
    .withFailureHandler(function(err) {
      document.getElementById('rincian-lot-list').innerHTML =
        '<p class="text-xs text-rose-500 text-center py-4">' + (err && err.message ? err.message : err) + '</p>';
    })
    .getRincianLotProduk(idStok);
}

function _renderRincianLot(res) {
  var listEl = document.getElementById('rincian-lot-list');
  if (!res.lots || !res.lots.length) {
    listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Tidak ada lot tersisa (stok kosong).</p>';
    document.getElementById('rincian-lot-total').innerHTML = '';
    return;
  }
  listEl.innerHTML = res.lots.map(function(lot, idx) {
    var isOldest = idx === 0;
    return '<div class="flex items-center justify-between border rounded-xl px-3 py-2.5 ' +
      (isOldest ? 'border-amber-300 bg-amber-50' : 'border-slate-200 bg-white') + '">' +
      '<div>' +
        '<span class="text-xs font-extrabold text-slate-700">Lot ' + (idx + 1) + '</span>' +
        (isOldest ? ' <span class="text-[10px] font-bold bg-amber-500 text-white px-1.5 py-0.5 rounded-md ml-1">Dipakai Duluan</span>' : '') +
        '<p class="text-[11px] text-slate-400 mt-0.5">' + lot.qty.toLocaleString('id-ID') + ' unit @ Rp ' + lot.harga.toLocaleString('id-ID') + '</p>' +
      '</div>' +
      '<div class="text-sm font-bold text-teal-700">Rp ' + lot.nilai.toLocaleString('id-ID') + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('rincian-lot-total').innerHTML =
    '<span>Total ' + (res.qtyTotal || 0).toLocaleString('id-ID') + ' unit</span>' +
    '<span>Rp ' + (res.nilaiTotal || 0).toLocaleString('id-ID') + '</span>';
}

function tutupRincianLot() {
  document.getElementById('modal-rincian-lot').classList.add('hidden');
}

// ── Detail Reserve Stok per WO/Proyek ───────────────────────────
function bukaReserveDetail(idStok, namaProduk) {
  document.getElementById('reserve-detail-nama').innerText = idStok + ' — ' + (namaProduk || '');
  document.getElementById('reserve-detail-list').innerHTML =
    '<p class="text-xs text-slate-400 text-center py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Memuat...</p>';
  document.getElementById('reserve-detail-total').innerHTML = '';
  document.getElementById('modal-reserve-detail').classList.remove('hidden');
  google.script.run.withSuccessHandler(function(res) {
    var list = (res && res.success) ? (res.list || []) : [];
    var box = document.getElementById('reserve-detail-list');
    if (!list.length) {
      box.innerHTML = '<p class="text-sm text-slate-400 italic text-center py-6">Tidak ada reserve aktif untuk stok ini.</p>';
      return;
    }
    var satuan = '';
    list.forEach(function(w) { (w.items || []).forEach(function(m) { if (!satuan && m.satuan) satuan = m.satuan; }); });
    var sat = satuan ? (' ' + _escHtml(satuan)) : '';
    box.innerHTML = list.map(function(w) {
      return '<div class="border border-slate-150 rounded-xl px-3 py-2.5">'
        + '<div class="flex items-center justify-between gap-2">'
        +   '<div class="min-w-0"><div class="font-mono text-xs font-bold text-slate-700">' + _escHtml(w.noWO || '-') + '</div>'
        +     '<div class="text-[11px] text-slate-400 truncate">' + _escHtml(w.namaProject || '-') + (w.namaKlien ? ' · ' + _escHtml(w.namaKlien) : '') + '</div></div>'
        +   '<span class="text-xs font-extrabold text-indigo-600 whitespace-nowrap shrink-0">' + (Number(w.qty)||0).toLocaleString('id-ID') + sat + '</span>'
        + '</div>'
        + '</div>';
    }).join('');
    document.getElementById('reserve-detail-total').innerHTML =
      '<span>Total Reserved</span><span class="text-indigo-600">' + (Number(res.total)||0).toLocaleString('id-ID') + sat + '</span>';
  }).withFailureHandler(function() {
    document.getElementById('reserve-detail-list').innerHTML = '<p class="text-sm text-rose-400 text-center py-6">Gagal memuat detail reserve.</p>';
  }).getReserveDetailByStok(idStok);
}
function tutupReserveDetail() {
  document.getElementById('modal-reserve-detail').classList.add('hidden');
}

function _pgRenderMutasi(data) {
  const tbody = document.getElementById('table-mutasi');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-slate-400 italic">Tidak ada riwayat mutasi.</td></tr>';
    return;
  }
  const jenisBadge = {
    'Penerimaan PO':       'bg-teal-100 text-teal-700',
    'Penerimaan Non-PO':   'bg-blue-100 text-blue-700',
    'Penerimaan Tanpa PO': 'bg-blue-100 text-blue-700',
    'Penggunaan WO':       'bg-orange-100 text-orange-700',
    'Penyesuaian +':       'bg-emerald-100 text-emerald-700',
    'Penyesuaian -':       'bg-red-100 text-red-700'
  };
  tbody.innerHTML = data.map(function(d) {
    var badge = jenisBadge[d.jenisMutasi] || 'bg-slate-100 text-slate-600';
    var aksiBtn =
      '<button onclick=\'bukaFormEditMutasi(' + JSON.stringify(d).replace(/'/g, "&#39;") + ')\' ' +
        'class="text-slate-500 hover:text-slate-800 transition mr-2" title="Edit Keterangan"><i class="fa-solid fa-pen"></i></button>' +
      '<button onclick=\'hapusMutasi(' + JSON.stringify(d.idMutasi).replace(/'/g, "&#39;") + ')\' ' +
        'class="text-red-500 hover:text-red-700 transition" title="Hapus"><i class="fa-solid fa-trash"></i></button>';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition text-xs">' +
      '<td class="p-3" data-label="ID Mutasi / Tanggal">' +
        '<div class="font-mono font-bold text-slate-700">' + _escHtml(d.idMutasi) + '</div>' +
        '<div class="text-slate-400 mt-0.5">' + _escHtml(d.tanggal) + '</div>' +
      '</td>' +
      '<td class="p-3 font-semibold text-slate-700" data-label="Produk">' + _escHtml(d.namaProduk) + '</td>' +
      '<td class="p-3" data-label="Jenis / Referensi">' +
        '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ' + badge + '">' + _escHtml(d.jenisMutasi) + '</span>' +
        '<div class="text-slate-400 mt-1">' + _escHtml(d.referensi || '—') + '</div>' +
      '</td>' +
      '<td class="p-3 text-right font-bold text-teal-700" data-label="Stok Masuk">' + (d.qtyMasuk ? '+' + d.qtyMasuk.toLocaleString('id-ID') : '—') + '</td>' +
      '<td class="p-3 text-right font-bold text-red-600" data-label="Stok Keluar">' + (d.qtyKeluar ? '-' + d.qtyKeluar.toLocaleString('id-ID') : '—') + '</td>' +
      '<td class="p-3 text-right text-slate-600" data-label="Harga Satuan">Rp ' + (d.hargaSatuan || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-3 text-right font-bold text-slate-800" data-label="Stok Akhir">' + (d.saldoSetelah || 0).toLocaleString('id-ID') + '</td>' +
      '<td class="p-3 text-slate-500 max-w-xs truncate" data-label="Keterangan">' + _escHtml(d.keterangan || '—') + '</td>' +
      '<td class="p-3 text-center whitespace-nowrap rp-actions">' + aksiBtn + '</td>' +
      '</tr>';
  }).join('');
}

// ── Edit / Hapus Riwayat Mutasi ──────────────────────────────────

function bukaFormEditMutasi(d) {
  document.getElementById('edit-mutasi-idmutasi').value   = d.idMutasi || '';
  document.getElementById('edit-mutasi-id').innerText      = d.idMutasi || '';
  document.getElementById('edit-mutasi-keterangan').value  = d.keterangan || '';
  document.getElementById('form-edit-mutasi').classList.remove('hidden');
}

function tutupFormEditMutasi() {
  document.getElementById('form-edit-mutasi').classList.add('hidden');
}

function submitEditMutasi() {
  var idMutasi   = document.getElementById('edit-mutasi-idmutasi').value;
  var keterangan = (document.getElementById('edit-mutasi-keterangan').value || '').trim();

  toggleLoader(true, 'Menyimpan perubahan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupFormEditMutasi();
        _loadMutasi();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .editMutasiStok({ idMutasi: idMutasi, keterangan: keterangan });
}

function hapusMutasi(idMutasi) {
  showConfirm({
    type: 'danger',
    title: 'Hapus Riwayat Mutasi?',
    message: 'Hapus riwayat mutasi ' + idMutasi + '? Saldo stok akan dihitung ulang dari riwayat yang tersisa.',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      toggleLoader(true, 'Menghapus riwayat mutasi...');
      google.script.run
        .withSuccessHandler(function(res) {
          toggleLoader(false);
          if (res.success) {
            showNotification(res.message, 'success');
            _loadMutasi();
            _loadStok();
          } else {
            showNotification(res.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showNotification('Error: ' + err.message, 'error');
        })
        .hapusMutasiStok(idMutasi);
    }
  });
}

// ── Filter ─────────────────────────────────────────────────────

window.filterStok = function() {
  var q = (document.getElementById('search-stok').value || '').toLowerCase().trim();
  _pgState.stok.data = q
    ? _cachedStokData.filter(function(d) { return ((d.idStok || d.idProduk) + d.namaProduk).toLowerCase().includes(q); })
    : _cachedStokData;
  _pgState.stok.page = 1;
  _pgRender('stok');
};

window.filterMutasi = function() {
  var idProduk   = (document.getElementById('filter-mutasi-produk').value || '').trim();
  var jenisMutasi = (document.getElementById('filter-mutasi-jenis').value || '').trim();
  _pgState.mutasi.data = _cachedMutasiData.filter(function(d) {
    if (idProduk && d.idProduk !== idProduk) return false;
    if (jenisMutasi && d.jenisMutasi !== jenisMutasi) return false;
    return true;
  });
  _pgState.mutasi.page = 1;
  _pgRender('mutasi');
};

// Tab mutasi lazy-load
document.getElementById('tab-btn-mutasi').addEventListener('click', function() {
  if (!_cachedMutasiData.length) _loadMutasi();
});

// ── Stok dropdown helper ───────────────────────────────────────

function _loadStokOptions(selId, selectedId) {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(data) {
    var sel  = document.getElementById(selId);
    if (!sel) return;
    var opts = '<option value="">-- Pilih Item Stok --</option>';
    (data || []).forEach(function(s) {
      var sel2 = selectedId && s.idStok === selectedId ? ' selected' : '';
      opts += '<option value="' + _escHtml(s.idStok) + '" data-satuan="' + _escHtml(s.satuan) + '"' + sel2 + '>' +
        _escHtml(s.idStok + ' — ' + s.namaProduk) + '</option>';
    });
    sel.innerHTML = opts;
  }).getStokList();
}

// Alias untuk backward compat
function _loadProdukMaterialOptions(selId) { _loadStokOptions(selId, ''); }

// ── Form Penerimaan Tanpa PO ───────────────────────────────────

function _setPtnpoMode(mode) {
  var isExisting = mode === 'existing';
  document.getElementById('ptnpo-panel-existing').classList.toggle('hidden', !isExisting);
  document.getElementById('ptnpo-panel-baru').classList.toggle('hidden', isExisting);
  var btnE = document.getElementById('ptnpo-mode-existing');
  var btnB = document.getElementById('ptnpo-mode-baru');
  var active   = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-teal-700 shadow-sm';
  var inactive = 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-700';
  btnE.className = isExisting ? active : inactive;
  btnB.className = isExisting ? inactive : active;
}

function bukaFormPenerimaanTanpaPO() {
  var tgl = new Date(); tgl = tgl.toISOString().slice(0, 10);
  document.getElementById('ptnpo-tanggal').value = tgl;
  document.getElementById('ptnpo-qty').value = '';
  document.getElementById('ptnpo-harga').value = '';
  document.getElementById('ptnpo-keterangan').value = '';
  document.getElementById('ptnpo-nama-baru').value = '';
  document.getElementById('ptnpo-satuan-baru').value = '';
  _setPtnpoMode('existing');

var _penerimaanData = [];

function loadPenerimaanBarang() {

  if (typeof google === 'undefined') return;
  _penPending = null; _penRiwayat = null;
  // Satu panggilan (getPenerimaanBundle) menggantikan rantai serial
  // getPOMenungguPenerimaan → getRiwayatPenerimaanList.
  google.script.run
    .withSuccessHandler(function(res) {
      res = res || {};
      _penPending = res.pending || [];

      var badge = document.getElementById('inv-penerimaan-badge');
      if (badge) { badge.textContent = _penPending.length; badge.classList.toggle('hidden', _penPending.length === 0); }
      _penBuildAndRender();
    })
    .withFailureHandler(function() { _penPending = []; _penRiwayat = []; _penBuildAndRender(); })
    .getPenerimaanBundle();
}

function _penBuildAndRender() {
  if (_penPending === null || _penRiwayat === null) return;
  var map = {}, order = [];
  function ensure(noPO, meta) {
    if (!map[noPO]) {
      map[noPO] = { noPO: noPO, riwayat: [], po: null, status: '', jumlahItemPending: 0, terakhirTgl: '',
        tanggal: meta.tanggal || '', namaSupplier: meta.namaSupplier || '', peruntukan: meta.peruntukan || '',
        noWO: meta.noWO || '', namaProject: meta.namaProject || '' };
      order.push(noPO);
    }
    return map[noPO];
  }
  (_penPending || []).forEach(function(po) {
    var e = ensure(po.noPO, { tanggal: po.tanggal, namaSupplier: po.namaSupplier, peruntukan: po.peruntukan, noWO: po.noWO, namaProject: po.namaProject });
    e.po = po;
    e.jumlahItemPending = po.jumlahItemPending || 0;
    var anyReceived = (po.items || []).some(function(it) { return (it.qtyDiterima || 0) > 0; });
    e.status = anyReceived ? 'sebagian' : 'menunggu';
  });
  (_penRiwayat || []).forEach(function(r) {
    var e = ensure(r.noPO, { tanggal: r.tanggal, namaSupplier: r.namaSupplier, peruntukan: r.peruntukan, noWO: r.noWO });
    e.riwayat.push(r);
  });
  order.forEach(function(noPO) {
    var e = map[noPO];
    if (!e.status) e.status = 'selesai';
    if (e.riwayat.length) e.terakhirTgl = e.riwayat[0].tanggal;   // riwayat sudah urut terbaru dulu
  });
  var prio = { menunggu: 0, sebagian: 1, selesai: 2 };
  var pr = function(st) { return prio.hasOwnProperty(st) ? prio[st] : 9; };
  _penerimaanData = order.map(function(n) { return map[n]; });
  _penerimaanData.sort(function(a, b) { return pr(a.status) - pr(b.status); });
  _renderPenerimaan();
}

function _penStatusBadge(st) {
  if (st === 'menunggu') return '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700"><i class="fas fa-hourglass-half text-[9px]"></i> Menunggu</span>';
  if (st === 'sebagian') return '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700"><i class="fas fa-truck-ramp-box text-[9px]"></i> Sebagian</span>';
  return '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fas fa-circle-check text-[9px]"></i> Selesai</span>';
}

window._renderPenerimaan = function() {
  var tbody = document.getElementById('table-penerimaan');
  if (!tbody) return;
  var f = (document.getElementById('filter-penerimaan-status') || {}).value || '';
  var data = _penerimaanData.filter(function(e) {
    if (f === 'pending') return e.status !== 'selesai';
    if (f === 'selesai') return e.status === 'selesai';
    return true;
  });
  var actionable = _penerimaanData.filter(function(e) { return e.status !== 'selesai'; }).length;
  var cnt = document.getElementById('po-gudang-count');
  if (cnt) cnt.innerText = actionable ? (actionable + ' PO menunggu') : '';

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400 italic">Tidak ada data penerimaan.</td></tr>';
    return;
  }
  var modeClass = { 'Langsung': 'bg-blue-100 text-blue-700', 'Gudang': 'bg-amber-100 text-amber-700' };
  var html = '';
  data.forEach(function(e, idx) {
    var noWO = e.noWO || '';
    var penCell;
    if (e.status === 'selesai') {
      penCell = '<span class="text-slate-600">' + e.riwayat.length + ' penerimaan</span>'
        + (e.terakhirTgl ? '<div class="text-[10px] text-slate-400 mt-0.5">Terakhir: ' + _fmtTglInv(e.terakhirTgl) + '</div>' : '');
    } else {
      penCell = '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-lg text-xs font-bold">' + e.jumlahItemPending + ' item menunggu</span>'
        + (e.riwayat.length ? '<div class="text-[10px] text-slate-400 mt-0.5">' + e.riwayat.length + ' penerimaan sebelumnya</div>' : '');
    }
    var aksi = '';
    if (e.po) aksi += '<button onclick="bukaProsesTerimaPOGudang(' + JSON.stringify(e.po).replace(/"/g,'&quot;') + ')" class="px-3 py-1.5 text-xs bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-bold transition">Proses</button>';
    if (e.riwayat.length) aksi += ' <button id="pen-toggle-' + idx + '" onclick="_togglePenerimaanRiwayat(' + idx + ')" class="px-2.5 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold transition"><i class="fas fa-clock-rotate-left text-[10px]"></i> Riwayat</button>';
    if (!aksi) aksi = '<span class="text-slate-300 text-xs">—</span>';

    html += '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">'
      + '<td class="p-4"><div class="font-mono font-bold text-teal-700 text-sm">' + _escHtmlInv(e.noPO) + '</div><div class="text-xs text-slate-400 mt-0.5">' + _fmtTglInv(e.tanggal) + '</div></td>'
      + '<td class="p-4"><div class="text-sm font-medium text-slate-800">' + _escHtmlInv(e.peruntukan || e.namaSupplier || '—') + '</div><div class="text-xs text-slate-400 mt-0.5">' + _escHtmlInv(e.namaSupplier) + '</div></td>'
      + '<td class="p-4">' + (noWO ? '<div class="font-mono text-sm text-teal-700">' + _escHtmlInv(noWO) + '</div>' + (e.namaProject ? '<div class="text-xs text-slate-400 mt-0.5">' + _escHtmlInv(e.namaProject) + '</div>' : '') : '<span class="text-slate-400 text-sm">—</span>') + '</td>'
      + '<td class="p-4 text-center">' + _penStatusBadge(e.status) + '</td>'
      + '<td class="p-4">' + penCell + '</td>'
      + '<td class="p-4 text-center whitespace-nowrap">' + aksi + '</td>'
      + '</tr>';

    if (e.riwayat.length) {
      html += '<tr id="pen-detail-' + idx + '" class="hidden bg-slate-50/60"><td colspan="6" class="px-4 pb-4 pt-1">'
        + '<div class="space-y-2">'
        + e.riwayat.map(function(r) {
            var mc = modeClass[r.mode] || 'bg-slate-100 text-slate-600';
            var itemList = (r.items || []).map(function(it) { return _escHtmlInv(it.namaItem || '') + ' (' + (it.qty || 0) + (it.satuan ? ' ' + _escHtmlInv(it.satuan) : '') + ')'; }).join(', ');
            var catatanList = (r.items || []).map(function(it) { return (it.catatan || '').toString().trim(); }).filter(function(c) { return c; }).join(' · ');
            var buktiHtml = r.buktiFileUrl ? '<a href="' + _escHtmlInv(r.buktiFileUrl) + '" target="_blank" class="inline-flex items-center gap-1 text-teal-600 hover:text-teal-700 font-semibold"><i class="fa-solid fa-image"></i> Bukti</a>' : '';
            return '<div class="bg-white border border-slate-100 rounded-xl p-3 text-xs">'
              + '<div class="flex items-center justify-between gap-2 flex-wrap mb-1">'
              + '<span class="font-semibold text-slate-600"><i class="fas fa-box-open text-teal-500 mr-1"></i>' + _fmtTglInv(r.tanggal) + ' <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-full ' + mc + '">' + _escHtmlInv(r.mode || '') + '</span></span>'
              + '<span class="text-slate-400">' + _escHtmlInv(r.dibuatOleh) + (buktiHtml ? ' · ' + buktiHtml : '') + '</span>'
              + '</div>'
              + '<div class="text-slate-700">' + (itemList || '—') + '</div>'
              + (catatanList ? '<div class="text-rose-600 mt-1"><i class="fas fa-triangle-exclamation text-[10px] mr-1"></i>' + _escHtmlInv(catatanList) + '</div>' : '')
              + '</div>';
          }).join('')
        + '</div></td></tr>';
    }
  });
  tbody.innerHTML = html;
};

function submitProsesTerimaPOGudang() {
  if (!_currentPOGudang) return;
  var rows  = document.querySelectorAll('#terima-po-gudang-items tr[data-id-item]');
  var items = [];
  var hasError = false;
  rows.forEach(function(row) {
    if (hasError) return;
    var idItem   = row.getAttribute('data-id-item');
    var qtyInput = row.querySelector('.pg-gudang-qty');
    var stokSel  = row.querySelector('.pg-gudang-stok');
    var catatanInput = row.querySelector('.pg-gudang-catatan');
    if (!qtyInput) return;
    var qty      = parseFloat(qtyInput.value) || 0;
    var catatan  = (catatanInput && catatanInput.value.trim()) || '';
    if (qty <= 0 && !catatan) return;
    var namaItem = qtyInput.getAttribute('data-nama') || idItem;
    var sisa     = parseFloat(qtyInput.getAttribute('data-sisa')) || 0;
    var hargaBeli = parseFloat(qtyInput.getAttribute('data-harga')) || 0;
    var idStok   = (stokSel && stokSel.value) ? stokSel.value.trim() : '';
    if (qty > sisa) {
      showNotification('Qty melebihi sisa untuk "' + namaItem + '" (sisa: ' + sisa + ').', 'error');
      hasError = true; return;
    }
    items.push({ idItem: idItem, namaItem: namaItem, qty: qty, idStok: idStok, idProduk: idStok, hargaBeli: hargaBeli, satuan: '', catatan: catatan });
  });
  if (hasError) return;
  if (!items.length) return showNotification('Masukkan qty yang akan diterima.', 'error');

  var buktiFileUrl = document.getElementById('terima-gudang-bukti-file-url').value;  // opsional
  var buktiFileId   = document.getElementById('terima-gudang-bukti-file-id').value;
  var buktiFileName = document.getElementById('terima-gudang-bukti-file-name').value;

  toggleLoader(true, 'Menyimpan penerimaan...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message, 'success');
        tutupModalTerimaPOGudang();
        loadPenerimaanBarang();
        loadInventory();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .terimaPOItems({
      noPO: _currentPOGudang.noPO,
      items: items,
      namaUser: (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) || '',
      buktiFileId: buktiFileId,
      buktiFileUrl: buktiFileUrl,
      buktiFileName: buktiFileName
    });
}

    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .gunakanStok(noWO, idStok, qty, tanggal, keterangan,
      (_currentUser && _currentUser.nama) || '');
}

// ══ Pengiriman Barang (warehouse) ══════════════════════════════════════════
var _kirimReqs = [], _kirimSJs = [];
function _kirimUser() { return (_currentUser && _currentUser.nama) || ''; }
function _kirimRp(n) { return (Number(n) || 0).toLocaleString('id-ID'); }
// Format tanggal → dd/MM/yyyy (dari ISO YYYY-MM-DD atau string apa adanya).
function _kirimFmtTgl(raw) {
  if (!raw) return '-';
  var s = raw.toString();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  return s;
}

var _kirimBoardTab = 'proses';
var _kirimOpen = {};   // accordion: noWO → terbuka? (tampilkan surat jalan)
function _kirimToggleDetail(noWO) { _kirimOpen[noWO] = !_kirimOpen[noWO]; _kirimRenderBoard(); }
window.loadPengirimanBarang = function() {
  var box = document.getElementById('kirim-board-body');
  if (box) box.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  var done = 0;
  function ready() { if (++done >= 2) _kirimRenderBoard(); }
  google.script.run.withSuccessHandler(function(res) { _kirimReqs = (res && res.success) ? (res.list || []) : []; ready(); })
    .withFailureHandler(function() { _kirimReqs = []; ready(); }).getPengirimanRequests();
  google.script.run.withSuccessHandler(function(res) { _kirimSJs = (res && res.success) ? (res.list || []) : []; ready(); })
    .withFailureHandler(function() { _kirimSJs = []; ready(); }).getPengirimanList({});
};

function _kirimShowTab(tab) {
  _kirimBoardTab = tab;
  var on = 'px-4 py-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-600 -mb-px transition';
  var off = 'px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition';
  var p = document.getElementById('kirim-tab-proses-btn'), s = document.getElementById('kirim-tab-selesai-btn');
  if (p) p.className = (tab === 'proses') ? on : off;
  if (s) s.className = (tab === 'selesai') ? on : off;
  _kirimRenderBoard();
}

// Gabung request + surat jalan → kartu per WO.
function _kirimBuildBoard() {
  var map = {}, order = [];
  function ensure(noWO, info) {
    if (!map[noWO]) { map[noWO] = { noWO: noWO, namaProject: '', namaKlien: '', alamat: '', sisaItems: [], sjs: [] }; order.push(noWO); }
    if (info) { var w = map[noWO]; w.namaProject = w.namaProject || info.namaProject || ''; w.namaKlien = w.namaKlien || info.namaKlien || ''; w.alamat = w.alamat || info.alamat || ''; }
    return map[noWO];
  }
  (_kirimReqs || []).forEach(function(r) { var w = ensure(r.noWO, r); w.sisaItems = r.items || []; });
  (_kirimSJs || []).forEach(function(s) { var w = ensure(s.noWO, s); w.sjs.push(s); });
  return order.map(function(noWO) {
    var w = map[noWO];
    var hasSisa = (w.sisaItems || []).length > 0;
    var sjs = w.sjs || [];
    var allDiterima = sjs.length > 0 && sjs.every(function(x) { return x.status === 'Diterima'; });
    if (!sjs.length) { w.status = 'Perlu Diproses'; w.tab = 'proses'; }
    else if (hasSisa) { w.status = 'Sebagian Dikirim'; w.tab = 'proses'; }
    else if (!allDiterima) { w.status = 'Dikirim'; w.tab = 'proses'; }
    else { w.status = 'Diterima'; w.tab = 'selesai'; }
    w.hasSisa = hasSisa;
    // Jumlah material terlibat pengiriman (distinct bomItemId dari sisa + surat jalan).
    var ids = {};
    (w.sisaItems || []).forEach(function(m) { if (m.id) ids[m.id] = 1; });
    sjs.forEach(function(s) { (s.items || []).forEach(function(it) { if (it.bomItemId) ids[it.bomItemId] = 1; }); });
    w.jumlahMaterial = Object.keys(ids).length;
    return w;
  });
}

function _kirimStatusCls(st) {
  if (st === 'Diterima') return 'bg-emerald-100 text-emerald-700';
  if (st === 'Dikirim') return 'bg-sky-100 text-sky-700';
  if (st === 'Sebagian Dikirim') return 'bg-amber-100 text-amber-700';
  return 'bg-orange-100 text-orange-600';
}

function _kirimRenderBoard() {
  var box = document.getElementById('kirim-board-body');
  if (!box) return;
  var board = _kirimBuildBoard();
  var proses = board.filter(function(w) { return w.tab === 'proses'; });
  var selesai = board.filter(function(w) { return w.tab === 'selesai'; });
  var pb = document.getElementById('kirim-tab-proses-badge'); if (pb) pb.textContent = proses.length;
  var sb = document.getElementById('kirim-tab-selesai-badge'); if (sb) sb.textContent = selesai.length;
  var badge = document.getElementById('inv-pengiriman-badge');
  if (badge) { var np = proses.filter(function(w) { return w.status === 'Perlu Diproses' || w.status === 'Sebagian Dikirim'; }).length; if (np) { badge.textContent = np; badge.classList.remove('hidden'); } else badge.classList.add('hidden'); }
  var list = (_kirimBoardTab === 'selesai') ? selesai : proses;
  if (!list.length) {
    box.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-truck-arrow-right mr-2"></i>' + (_kirimBoardTab === 'selesai' ? 'Belum ada pengiriman selesai.' : 'Tidak ada pengiriman yang perlu diproses.') + '</td></tr>';
    return;
  }
  box.innerHTML = list.map(function(w) {
    var sjArr = w.sjs || [];
    var isOpen = !!_kirimOpen[w.noWO];
    // Baris detail surat jalan (accordion, dipakai saat >1 SJ).
    var sjRows = sjArr.map(function(s) {
      var act = '<button onclick="_kirimExportPDF(\'' + _escHtml(s.idKirim) + '\')" class="inline-flex items-center gap-1 text-xs font-bold text-slate-600 hover:text-slate-800" title="Export Surat Jalan"><i class="fa-solid fa-file-pdf text-rose-500"></i> PDF</button>';
      if (s.status === 'Dikirim') act += ' <button onclick="_kirimOpenTerima(\'' + _escHtml(s.idKirim) + '\',\'' + _escHtml(s.noSuratJalan) + '\')" class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 hover:text-emerald-800 ml-2" title="Barang Diterima"><i class="fa-solid fa-box-open"></i> Terima</button>';
      else if (s.buktiFileUrl) act += ' <a href="' + _escHtml(s.buktiFileUrl) + '" target="_blank" rel="noopener" class="text-xs font-bold text-emerald-600 hover:underline ml-2"><i class="fa-solid fa-image mr-0.5"></i>Bukti</a>';
      return '<div class="flex items-center gap-2 px-3 py-2 border-t border-slate-100 flex-wrap"><span class="font-mono font-bold text-slate-600 text-xs">' + _escHtml(s.noSuratJalan) + '</span><span class="text-[11px] text-slate-400">' + _escHtml(_kirimFmtTgl(s.tanggalKirim)) + ' · ' + (s.items || []).length + ' item</span><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + _kirimStatusCls(s.status) + '">' + _escHtml(s.status) + '</span><span class="ml-auto">' + act + '</span></div>';
    }).join('');
    // Kolom "Surat Jalan": jumlah surat jalan ("N Surat Jalan").
    var sjCell = sjArr.length
      ? '<span class="text-sm font-semibold text-slate-600 whitespace-nowrap">' + sjArr.length + ' Surat Jalan</span>'
      : '<span class="text-slate-300">—</span>';
    // Tombol "Detail" (accordion surat jalan) ditaruh di kolom Aksi.
    var detailBtn = sjArr.length
      ? '<button onclick="_kirimToggleDetail(\'' + _escHtml(w.noWO) + '\')" class="inline-flex items-center gap-1.5 text-xs font-bold text-blue-600 hover:text-blue-800 py-1.5 px-2" title="Lihat surat jalan"><i class="fa-solid fa-chevron-' + (isOpen ? 'up' : 'down') + ' text-[10px]"></i> Detail (' + sjArr.length + ')</button>'
      : '';
    var prosesBtn = w.hasSisa ? '<button onclick="_kirimOpenModal(\'' + _escHtml(w.noWO) + '\')" class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-truck-arrow-right"></i> Proses Kirim</button>' : '';
    var aksiInner = prosesBtn + detailBtn;
    var aksiCell = aksiInner ? ('<div class="flex items-center justify-center gap-1.5 flex-wrap">' + aksiInner + '</div>') : '<span class="text-slate-300 text-xs">—</span>';
    var mainRow = '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">' +
      '<td class="p-4 font-mono font-bold text-slate-700 whitespace-nowrap" data-label="No WO">' + _escHtml(w.noWO) + '</td>' +
      '<td class="p-4" data-label="Project / Klien"><div class="font-semibold text-slate-800">' + _escHtml(w.namaProject || '-') + '</div>' + (w.namaKlien ? '<div class="text-xs text-slate-400">' + _escHtml(w.namaKlien) + '</div>' : '') + '</td>' +
      '<td class="p-4 text-xs text-slate-500 max-w-[220px]" data-label="Alamat">' + (w.alamat ? _escHtml(w.alamat) : '<span class="text-slate-300">-</span>') + '</td>' +
      '<td class="p-4 text-center" data-label="Material"><span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded-lg whitespace-nowrap">' + (w.jumlahMaterial || 0) + ' item</span></td>' +
      '<td class="p-4 text-center" data-label="Status"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + _kirimStatusCls(w.status) + '">' + _escHtml(w.status) + '</span></td>' +
      '<td class="p-4" data-label="Surat Jalan">' + sjCell + '</td>' +
      '<td class="p-4 text-center rp-actions" data-label="Aksi">' + aksiCell + '</td>' +
    '</tr>';
    var detailRow = (sjArr.length && isOpen)
      ? '<tr class="bg-slate-50"><td colspan="7" class="px-4 pb-4 pt-1"><div class="rounded-xl border border-slate-150 overflow-hidden bg-white">' +
          sjRows + '</div></td></tr>'
      : '';
    return mainRow + detailRow;
  }).join('');
}

function _kirimOpenModal(noWO) {
  var r = _kirimReqs.filter(function(x) { return x.noWO === noWO; })[0];
  if (!r) return;
  document.getElementById('kirim-modal-nowo').value = noWO;
  document.getElementById('kirim-modal-sub').innerText = noWO + ' · ' + (r.namaProject || '');
  document.getElementById('kirim-tanggal').value = new Date().toISOString().split('T')[0];
  document.getElementById('kirim-kendaraan').value = '';
  document.getElementById('kirim-driver').value = '';
  document.getElementById('kirim-catatan').value = '';
  document.getElementById('kirim-alamat').value = r.alamat || '';
  document.getElementById('kirim-modal-items').innerHTML = (r.items || []).map(function(m) {
    return '<tr class="border-t border-slate-100" data-bom-id="' + _escHtml(m.id) + '" data-sisa="' + m.qtySisa + '">' +
      '<td class="px-3 py-2 text-slate-700">' + _escHtml(m.namaMaterial) + '</td>' +
      '<td class="px-3 py-2 text-center text-slate-500">' + _kirimRp(m.qtySisa) + ' ' + _escHtml(m.satuan || '') + '</td>' +
      '<td class="px-3 py-2 text-center"><input type="number" class="kirim-qty w-24 px-2 py-1 text-sm border border-indigo-300 rounded-lg text-center" min="0" max="' + m.qtySisa + '" value="' + m.qtySisa + '"></td>' +
    '</tr>';
  }).join('');
  document.getElementById('modal-kirim').classList.remove('hidden');
}
function _kirimCloseModal() { document.getElementById('modal-kirim').classList.add('hidden'); }
function _kirimSubmit() {
  var noWO = document.getElementById('kirim-modal-nowo').value;
  var items = [];
  document.querySelectorAll('#kirim-modal-items tr[data-bom-id]').forEach(function(row) {
    var q = parseFloat((row.querySelector('.kirim-qty') || {}).value) || 0;
    if (q <= 0) return;
    var sisa = parseFloat(row.getAttribute('data-sisa')) || 0;
    if (q > sisa) q = sisa;
    items.push({ bomItemId: row.getAttribute('data-bom-id'), qty: q });
  });
  if (!items.length) return showNotification('Isi qty kirim minimal 1 item.', 'error');
  _kirimCloseModal();
  toggleLoader(true, 'Memproses pengiriman...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    loadPengirimanBarang();
    _loadStok && _loadStok();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .prosesKirim({
      noWO: noWO,
      items: items,
      tanggal: document.getElementById('kirim-tanggal').value,
      kendaraan: document.getElementById('kirim-kendaraan').value,
      driver: document.getElementById('kirim-driver').value,
      alamat: document.getElementById('kirim-alamat').value,
      catatan: document.getElementById('kirim-catatan').value,
      oleh: _kirimUser()
    });
}

function _kirimOpenTerima(idKirim, noSJ) {
  document.getElementById('terima-kirim-id').value = idKirim;
  document.getElementById('terima-kirim-sj').innerText = noSJ;
  document.getElementById('kirim-bukti-file-id').value = '';
  document.getElementById('kirim-bukti-file-url').value = '';
  document.getElementById('kirim-bukti-file-name').value = '';
  var st = document.getElementById('kirim-bukti-file-status'); if (st) { st.classList.add('hidden'); st.innerHTML = ''; }
  var dp = document.getElementById('kirim-bukti-file-drop'); if (dp) dp.classList.remove('hidden');
  document.getElementById('modal-kirim-terima').classList.remove('hidden');
}
function _kirimCloseTerima() { document.getElementById('modal-kirim-terima').classList.add('hidden'); }
function _kirimBuktiChange(input) { _uploadSupplierFile('kirim-bukti-file', input, 'uploadFileBuktiPenerimaanPO', 'emerald'); }
function _kirimSubmitTerima() {
  var id = document.getElementById('terima-kirim-id').value;
  var url = document.getElementById('kirim-bukti-file-url').value;
  if (!url) return showNotification('Lampirkan bukti barang diterima.', 'error');
  _kirimCloseTerima();
  toggleLoader(true, 'Menyimpan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    loadPengirimanBarang();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .terimaPengiriman({
      idKirim: id, oleh: _kirimUser(),
      buktiFileId: document.getElementById('kirim-bukti-file-id').value,
      buktiFileUrl: url,
      buktiFileName: document.getElementById('kirim-bukti-file-name').value
    });
}

// Export PDF Surat Jalan.
function _kirimExportPDF(idKirim) {
  var s = _kirimSJs.filter(function(x) { return x.idKirim === idKirim; })[0];
  if (!s) return;
  if (!window.jspdf || !window.jspdf.jsPDF) return showNotification('Modul PDF belum siap. Muat ulang halaman.', 'error');
  try {
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var PW = 210, ML = 14, MR = 14;
    var DARK = [30, 41, 59], SLATE = [100, 116, 139];
    doc.setFillColor(DARK[0], DARK[1], DARK[2]); doc.rect(0, 0, PW, 22, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text('SURAT JALAN', ML, 11);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(190, 200, 220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(170, 195, 255);
    doc.text('NO. SURAT JALAN', PW - MR, 9, { align: 'right' });
    doc.setFontSize(13); doc.setTextColor(255, 255, 255);
    doc.text(String(s.noSuratJalan), PW - MR, 16, { align: 'right' });

    var y = 30;
    doc.setFontSize(9); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
    function baris(label, val, yy) { doc.setFont('helvetica', 'bold'); doc.text(label, ML, yy); doc.setFont('helvetica', 'normal'); doc.text(': ' + (val || '-'), ML + 28, yy); }
    baris('Tanggal', _kirimFmtTgl(s.tanggalKirim), y);
    baris('No. Work Order', s.noWO, y + 5);
    baris('Project', s.namaProject, y + 10);
    baris('Klien', s.namaKlien, y + 15);
    var alamatLines = doc.splitTextToSize(': ' + (s.alamat || '-'), PW - MR - (ML + 28));
    doc.setFont('helvetica', 'bold'); doc.text('Alamat Kirim', ML, y + 20); doc.setFont('helvetica', 'normal'); doc.text(alamatLines, ML + 28, y + 20);
    y += 24 + (alamatLines.length - 1) * 4.2;
    if (s.kendaraan || s.driver) { baris('Kendaraan', (s.kendaraan || '-') + (s.driver ? '  ·  Driver: ' + s.driver : ''), y); y += 6; }

    doc.autoTable({
      startY: y + 2,
      head: [['No', 'Nama Material', 'Merek', 'Satuan', 'Qty']],
      body: (s.items || []).map(function(it, i) { return [String(i + 1), it.namaMaterial || '', it.merek || '-', it.satuan || '-', _kirimRp(it.qty)]; }),
      theme: 'grid', margin: { left: ML, right: MR },
      headStyles: { fillColor: [67, 56, 202], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
      bodyStyles: { fontSize: 8, textColor: [40, 40, 40], lineColor: [210, 215, 225], lineWidth: 0.15, cellPadding: 1.8 },
      columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 34 }, 3: { cellWidth: 20, halign: 'center' }, 4: { cellWidth: 20, halign: 'center', fontStyle: 'bold' } }
    });
    var afterY = doc.lastAutoTable.finalY + 18;
    if (afterY > 250) { doc.addPage(); afterY = 40; }
    var colW = (PW - ML - MR) / 3;
    ['Disiapkan (Gudang)', 'Pengirim / Driver', 'Penerima'].forEach(function(lbl, i) {
      var cx = ML + colW * i + colW / 2;
      doc.setDrawColor(150, 150, 150); doc.line(cx - 25, afterY + 16, cx + 25, afterY + 16);
      doc.setFontSize(8); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]); doc.setFont('helvetica', 'normal');
      doc.text(lbl, cx, afterY + 21, { align: 'center' });
    });
    doc.setFontSize(7); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
    doc.text('Dokumen surat jalan — PT. Renus Global Indonesia.', ML, 290);
    var fname = 'SuratJalan_' + String(s.noSuratJalan).replace(/[\\/]/g, '-') + '.pdf';
    doc.save(fname);
    showNotification('Surat Jalan diunduh: ' + fname);
  } catch (err) {
    showNotification('Gagal membuat PDF: ' + (err && err.message ? err.message : err), 'error');
  }
}
</script>
