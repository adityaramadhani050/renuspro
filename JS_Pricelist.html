<script>
// ================================================================
//  PRICELIST SUPPLIER — daftar item (flat, paginated) + form tambah/edit.
//  Sumber item dropdown Purchase Order.
// ================================================================

let _cachedPricelist = [];      // semua item pricelist
let _pricelistSuppliers = [];   // daftar supplier (master) untuk dropdown form
let _pricelistKategori = [];    // master kategori (dropdown form + Kelola Kategori)

function _plParseRp(s) { return parseFloat((s || '').toString().replace(/[^\d]/g, '')) || 0; }
function _plFmtRp(n) { return Math.round(parseFloat(n) || 0).toLocaleString('id-ID'); }
function _plEsc(s) { return (s == null ? '' : s.toString()).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function formatPlHarga(el) { el.value = _plFmtRp(_plParseRp(el.value)); }

// ── Load ──────────────────────────────────────────────────────────
window.loadPricelist = function() {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(list) {
    _pricelistSuppliers = list || [];
    _isiPickerSupplierPl();
  }).withFailureHandler(function() {}).getSupplierList();

  google.script.run.withSuccessHandler(function(res) {
    _pricelistKategori = (res && res.success) ? (res.list || []) : [];
    _plFillKategori();
  }).withFailureHandler(function() {}).getKategoriList();

  var tb = document.getElementById('table-pricelist');
  if (tb) tb.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat pricelist...</td></tr>';
  google.script.run.withSuccessHandler(function(res) {
    _cachedPricelist = (res && res.success) ? (res.list || []) : [];
    if (typeof resetSearch === 'function') resetSearch('pricelist');
    _pgState.pricelist.data = _cachedPricelist;
    _pgState.pricelist.page = 1;
    _injectPgBar('pricelist', '#table-pricelist');
    _pgRender('pricelist');
  }).withFailureHandler(function() {
    var t = document.getElementById('table-pricelist');
    if (t) t.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-rose-400"><i class="fas fa-exclamation-circle mr-2"></i>Gagal memuat pricelist.</td></tr>';
  }).getPricelistAll();
};

window.filterPricelist = function() {
  var q = ((document.getElementById('search-pricelist') || {}).value || '').toLowerCase().trim();
  _pgState.pricelist.data = _cachedPricelist.filter(function(it) {
    if (!q) return true;
    return (it.namaMaterial + it.kategori + it.merek + it.spesifikasi + it.namaSupplier + it.satuan).toLowerCase().indexOf(q) !== -1;
  });
  _pgState.pricelist.page = 1;
  _pgRender('pricelist');
};

// ── Render tabel (dipanggil _pgRender) ───────────────────────────
function _pgRenderPricelist(data) {
  var tbody = document.getElementById('table-pricelist');
  if (!tbody) return;
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400"><i class="fa-solid fa-tags mr-2"></i>Belum ada item pricelist.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(it) {
    var merekHtml = it.merek ? '<div class="text-[10px] font-bold text-orange-500 uppercase tracking-wide">' + _plEsc(it.merek) + '</div>' : '';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">'
      + '<td class="p-4 font-semibold text-slate-700" data-label="Supplier">' + _plEsc(it.namaSupplier) + '</td>'
      + '<td class="p-4 text-slate-500" data-label="Kategori">' + _plEsc(it.kategori || '-') + '</td>'
      + '<td class="p-4" data-label="Material">' + merekHtml + '<div class="font-semibold text-slate-800">' + _plEsc(it.namaMaterial) + '</div>' + (it.spesifikasi ? '<div class="text-[10px] text-slate-400">' + _plEsc(it.spesifikasi) + '</div>' : '') + '</td>'
      + '<td class="p-4 text-center text-slate-500" data-label="Satuan">' + _plEsc(it.satuan || '-') + '</td>'
      + '<td class="p-4 text-right font-bold text-slate-800" data-label="Harga Beli">Rp ' + _plFmtRp(it.hargaBeli) + '</td>'
      + '<td class="p-4 text-slate-500 text-[11px] whitespace-nowrap" data-label="Update Terakhir">' + _plEsc(it.updateTerakhir || '-') + '</td>'
      + '<td class="p-4 text-center" data-label="Status">'
      +   '<label class="inline-flex items-center gap-1 cursor-pointer select-none" title="Material ready">'
      +     '<input type="checkbox" ' + (it.ready ? 'checked' : '') + ' onchange="togglePricelistReady(\'' + it.id + '\', this.checked)" class="accent-emerald-500">'
      +     '<span class="text-[10px] font-extrabold ' + (it.ready ? 'text-emerald-600' : 'text-slate-400') + '">READY</span>'
      +   '</label>'
      + '</td>'
      + '<td class="p-4 text-center rp-actions">'
      +   '<div class="flex items-center justify-center gap-1.5">'
      +     '<button onclick="bukaFormEditPricelist(\'' + it.id + '\')" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>'
      +     '<button onclick="hapusPricelist(\'' + it.id + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can"></i></button>'
      +   '</div>'
      + '</td></tr>';
  }).join('');
}

function togglePricelistReady(id, checked) {
  google.script.run.withSuccessHandler(function(res) {
    if (res && res.success === false) { showNotification(res.message, 'error'); loadPricelist(); return; }
    var it = _cachedPricelist.filter(function(x) { return x.id === id; })[0];
    if (it) it.ready = checked;
  }).withFailureHandler(function(err) {
    showNotification((err && err.message) || 'Gagal memperbarui status ready.', 'error');
    loadPricelist();
  }).setPricelistReady(id, checked);
}

// ── Form supplier dropdown ────────────────────────────────────────
function _isiPickerSupplierPl() {
  var sel = document.getElementById('pl-supplier');
  if (!sel) return;
  var cur = sel.value;
  var opts = '<option value="">— Pilih supplier —</option>';
  _pricelistSuppliers
    .filter(function(s) { return (s.status || 'Aktif') !== 'Non-Aktif'; })
    .forEach(function(s) { opts += '<option value="' + s.id + '">' + _plEsc(s.nama) + '</option>'; });
  sel.innerHTML = opts;
  if (cur) sel.value = cur;
}

// ── Tambah / Edit ─────────────────────────────────────────────────
function bukaFormTambahPricelist() {
  document.getElementById('pricelist-modal-title').innerText = 'Tambah Item Pricelist';
  document.getElementById('pl-id').value = '';
  ['pl-kategori','pl-merek','pl-nama','pl-spesifikasi','pl-satuan','pl-harga'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = '';
  });
  _isiPickerSupplierPl();
  _plFillKategori('');
  document.getElementById('pl-supplier').value = '';
  document.getElementById('modal-pricelist').classList.remove('hidden');
}

function bukaFormEditPricelist(id) {
  var it = _cachedPricelist.filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  document.getElementById('pricelist-modal-title').innerText = 'Edit Item Pricelist';
  document.getElementById('pl-id').value = it.id;
  _isiPickerSupplierPl();
  document.getElementById('pl-supplier').value = it.idSupplier;
  _plFillKategori(it.kategori || '');
  document.getElementById('pl-merek').value = it.merek || '';
  document.getElementById('pl-nama').value = it.namaMaterial || '';
  document.getElementById('pl-spesifikasi').value = it.spesifikasi || '';
  document.getElementById('pl-satuan').value = it.satuan || '';
  document.getElementById('pl-harga').value = _plFmtRp(it.hargaBeli);
  document.getElementById('modal-pricelist').classList.remove('hidden');
}

function simpanPricelistItem() {
  var id = document.getElementById('pl-id').value;
  var idSupplier = document.getElementById('pl-supplier').value;
  var nama = document.getElementById('pl-nama').value.trim();
  if (!idSupplier) return showNotification('Pilih supplier terlebih dahulu.', 'error');
  if (!nama) return showNotification('Nama material wajib diisi.', 'error');
  var payload = {
    idSupplier:   idSupplier,
    kategori:     document.getElementById('pl-kategori').value.trim(),
    namaMaterial: nama,
    spesifikasi:  document.getElementById('pl-spesifikasi').value.trim(),
    merek:        document.getElementById('pl-merek').value.trim(),
    satuan:       document.getElementById('pl-satuan').value.trim(),
    hargaBeli:    _plParseRp(document.getElementById('pl-harga').value)
  };
  toggleLoader(true, 'Menyimpan item...');
  var done = function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Item tersimpan.');
    document.getElementById('modal-pricelist').classList.add('hidden');
    loadPricelist();
  };
  var fail = function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menyimpan item.', 'error'); };
  if (id) google.script.run.withSuccessHandler(done).withFailureHandler(fail).updatePricelistItem(id, payload);
  else google.script.run.withSuccessHandler(done).withFailureHandler(fail).tambahPricelistItem(payload);
}

// Konfirmasi hapus pakai modal kustom aplikasi (#modal-hapus, ikon di atas
// center) — konsisten dgn hapus Invoice/Penawaran, bukan confirm() bawaan browser.
function hapusPricelist(id) {
  var it = _cachedPricelist.filter(function(x) { return x.id === id; })[0];
  var nm = it ? it.namaMaterial : id;
  var span = document.getElementById('hapus-nama-item');
  if (span) span.innerText = 'item "' + nm + '" dari pricelist';
  var btn = document.getElementById('btn-konfirmasi-hapus');
  if (btn) btn.onclick = function() { _hapusPricelistExec(id); };
  document.getElementById('modal-hapus').classList.remove('hidden');
}
function _hapusPricelistExec(id) {
  document.getElementById('modal-hapus').classList.add('hidden');
  toggleLoader(true, 'Menghapus item...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Item dihapus.');
    loadPricelist();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menghapus item.', 'error'); }).hapusPricelistItem(id);
}
// ── Master Kategori ───────────────────────────────────────────────
function _plFillKategori(selected) {
  var sel = document.getElementById('pl-kategori');
  if (!sel) return;
  var cur = (selected != null) ? selected : sel.value;
  var opts = '<option value="">— Pilih kategori —</option>';
  (_pricelistKategori || []).forEach(function(k) { opts += '<option value="' + _plEsc(k) + '">' + _plEsc(k) + '</option>'; });
  if (cur && (_pricelistKategori || []).indexOf(cur) === -1) opts += '<option value="' + _plEsc(cur) + '">' + _plEsc(cur) + ' (lama)</option>';
  sel.innerHTML = opts;
  sel.value = cur || '';
}
function _plOpenKategori() {
  document.getElementById('modal-kategori').classList.remove('hidden');
  _plRenderKatList();
}
function _plReloadKategori(cb) {
  google.script.run.withSuccessHandler(function(res) {
    _pricelistKategori = (res && res.success) ? (res.list || []) : [];
    _plFillKategori();
    if (cb) cb();
  }).withFailureHandler(function() { if (cb) cb(); }).getKategoriList();
}
function _plRenderKatList() {
  var box = document.getElementById('kat-list');
  if (!box) return;
  if (!(_pricelistKategori || []).length) { box.innerHTML = '<div class="text-xs text-slate-400 py-2 text-center">Belum ada kategori.</div>'; return; }
  box.innerHTML = _pricelistKategori.map(function(k) {
    var ke = _plEsc(k).replace(/'/g, "\\'");
    return '<div class="flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-150 bg-slate-50">'
      + '<span class="flex-1 text-sm font-semibold text-slate-700 truncate">' + _plEsc(k) + '</span>'
      + '<button onclick="_plEditKategori(\'' + ke + '\')" class="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 p-1.5 rounded" title="Ubah nama"><i class="fa-solid fa-pen text-xs"></i></button>'
      + '<button onclick="_plHapusKategori(\'' + ke + '\')" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded" title="Hapus"><i class="fa-regular fa-trash-can text-xs"></i></button>'
      + '</div>';
  }).join('');
}
function _plTambahKategori() {
  var inp = document.getElementById('kat-input');
  var nama = (inp.value || '').trim();
  if (!nama) return showNotification('Isi nama kategori.', 'error');
  toggleLoader(true, 'Menambah kategori...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Ditambahkan.');
    inp.value = '';
    _plReloadKategori(_plRenderKatList);
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .tambahKategori(nama);
}
function _plEditKategori(oldNama) {
  var newNama = window.prompt('Ubah nama kategori:', oldNama);
  if (newNama == null) return;
  newNama = newNama.trim();
  if (!newNama || newNama === oldNama) return;
  toggleLoader(true, 'Menyimpan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Diperbarui.');
    _plReloadKategori(_plRenderKatList);
    loadPricelist();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .updateKategori(oldNama, newNama);
}
function _plHapusKategori(nama) {
  showConfirm({ title: 'Hapus Kategori', message: 'Hapus kategori "' + nama + '"?', confirmText: 'Ya, Hapus', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Menghapus...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dihapus.');
      _plReloadKategori(_plRenderKatList);
    }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .hapusKategori(nama);
  }});
}
</script>
