      <section id="page-pricelist" class="page-section">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
          <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Pricelist Supplier</h2>
            <p class="text-sm text-slate-400 mt-1">Daftar harga material per supplier — jadi sumber item saat membuat Purchase Order.</p>
          </div>
          <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="relative flex-1 sm:w-56">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="search-pricelist" oninput="filterPricelist()" placeholder="Cari material, merek, supplier..."
                class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 bg-white">
            </div>
            <button onclick="bukaFormTambahPricelist()"
              class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition-all flex items-center gap-2 whitespace-nowrap">
              <i class="fas fa-plus"></i> Tambah Item
            </button>
          </div>
        </div>

        <!-- TABEL PRICELIST -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-150 overflow-x-auto">
          <table class="w-full min-w-[960px] text-left border-collapse rp-table">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="p-4">Supplier</th>
                <th class="p-4">Kategori</th>
                <th class="p-4">Material</th>
                <th class="p-4 text-center">Satuan</th>
                <th class="p-4 text-right">Harga Beli</th>
                <th class="p-4">Update Terakhir</th>
                <th class="p-4 text-center">Status</th>
                <th class="p-4 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="table-pricelist" class="text-sm">
              <tr><td colspan="8" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat pricelist...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- MODAL TAMBAH / EDIT ITEM -->
        <div id="modal-pricelist" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 px-4 py-6">
          <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center gap-3 px-6 pt-5 pb-4 border-b border-slate-100">
              <span class="bg-orange-50 text-orange-500 h-9 w-9 rounded-xl flex items-center justify-center"><i class="fa-solid fa-tags"></i></span>
              <div>
                <h3 id="pricelist-modal-title" class="text-base font-bold text-slate-800">Tambah Item Pricelist</h3>
                <p class="text-xs text-slate-400">Isi detail material & harga beli supplier</p>
              </div>
              <button onclick="document.getElementById('modal-pricelist').classList.add('hidden')" class="ml-auto text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1.5 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="px-6 py-5 space-y-4">
              <input type="hidden" id="pl-id">
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Supplier</label>
                <select id="pl-supplier" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 bg-white">
                  <option value="">— Pilih supplier —</option>
                </select>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kategori</label>
                  <select id="pl-kategori" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 bg-white">
                    <option value="">— Pilih kategori —</option>
                    <option value="Panel Surya">Panel Surya</option>
                    <option value="Inverter">Inverter</option>
                    <option value="Baterai">Baterai</option>
                    <option value="Kabel">Kabel</option>
                    <option value="PJU">PJU</option>
                    <option value="Pompa">Pompa</option>
                    <option value="Aksesoris Inverter">Aksesoris Inverter</option>
                    <option value="Portable Power Station">Portable Power Station</option>
                    <option value="Mounting Panel Surya">Mounting Panel Surya</option>
                    <option value="Panel Proteksi">Panel Proteksi</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Merek</label>
                  <input type="text" id="pl-merek" class="input-field text-sm" placeholder="Contoh: Solana, Zamdon">
                </div>
                <div class="md:col-span-2">
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nama Material</label>
                  <input type="text" id="pl-nama" required class="input-field text-sm" placeholder="Contoh: Solar Panel 625 Watt">
                </div>
                <div class="md:col-span-2">
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Spesifikasi / Tipe</label>
                  <input type="text" id="pl-spesifikasi" class="input-field text-sm" placeholder="Contoh: Panel Mono (Black), ZDTID12212-H60">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Satuan</label>
                  <input type="text" id="pl-satuan" class="input-field text-sm" placeholder="Contoh: unit, m, set">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Harga Beli (Rp)</label>
                  <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-rose-500 text-[9px] font-bold">Rp</span>
                    <input type="text" id="pl-harga" inputmode="numeric" class="input-field text-sm pl-8 text-right font-bold border-rose-200 bg-rose-50" placeholder="0" oninput="formatPlHarga(this)">
                  </div>
                </div>
              </div>
            </div>

            <div class="flex justify-end gap-3 px-6 pb-5 pt-1 border-t border-slate-100">
              <button onclick="document.getElementById('modal-pricelist').classList.add('hidden')" class="px-5 py-2.5 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">Batal</button>
              <button onclick="simpanPricelistItem()" class="px-6 py-2.5 text-sm bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold shadow-md transition flex items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
            </div>
          </div>
        </div>
      </section>
