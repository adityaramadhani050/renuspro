      <section id="page-qc" class="page-section">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Quality Control</h2>
          <span id="qc-role-hint" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500"></span>
        </div>

        <!-- HOME: ringkasan + daftar Work Order -->
        <div id="qc-home">
          <div id="qc-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>

          <!-- Antrean Review & Kinerja Tim (khusus Lead Engineer/Admin) -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-5">
            <div id="qc-review-queue-wrap" class="hidden bg-white rounded-2xl border border-slate-150 p-5"></div>
            <div id="qc-team-wrap" class="hidden bg-white rounded-2xl border border-slate-150 p-5"></div>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
            <div class="relative w-full sm:w-72">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="qc-search" oninput="_qcRenderWOList()" placeholder="Cari No WO / project / klien..."
                class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 bg-white">
            </div>
            <select id="qc-filter-se" onchange="_qcRenderWOList()" class="hidden w-full sm:w-auto text-sm border border-slate-200 rounded-xl px-3 py-2.5 bg-white font-semibold text-slate-600 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100">
              <option value="">Semua Site Engineer</option>
            </select>
            <div class="flex items-center gap-2 sm:ml-auto">
              <button id="qc-add-project-btn" onclick="_qcOpenAddProject()" class="hidden flex-1 sm:flex-none justify-center bg-orange-500 hover:bg-orange-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Project</button>
              <button id="qc-manage-btn" onclick="bukaQCManage()" class="hidden flex-1 sm:flex-none justify-center bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-list-check"></i> Kelola Checklist</button>
            </div>
          </div>
          <!-- Tab: pisahkan QC Sedang Proses vs Selesai (100%) -->
          <div class="flex items-center gap-2 mb-3 border-b border-slate-150">
            <button id="qc-tab-proses-btn" onclick="_qcSwitchTab('proses')" class="px-4 py-2 text-sm font-bold border-b-2 border-orange-500 text-orange-600 -mb-px transition">
              Proses <span id="qc-tab-proses-badge" class="ml-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-orange-100 text-orange-700">0</span>
            </button>
            <button id="qc-tab-selesai-btn" onclick="_qcSwitchTab('selesai')" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition">
              Approved <span id="qc-tab-selesai-badge" class="ml-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
            </button>
          </div>
          <div id="qc-wo-list" class="space-y-2">
            <div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>
          </div>
        </div>

        <!-- KELOLA CHECKLIST (Lead Engineer / Admin) -->
        <div id="qc-manage" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliQCHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
            <button onclick="_qcAddSection()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2"><i class="fa-solid fa-plus"></i> Tambah Item QC</button>
          </div>
          <div id="qc-manage-body" class="space-y-3"></div>
        </div>

        <!-- DETAIL: checklist per Work Order -->
        <div id="qc-detail" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliQCHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali ke daftar</button>
            <div id="qc-detail-actions"></div>
          </div>
          <div id="qc-detail-head" class="bg-white rounded-2xl border border-slate-150 p-5 mb-4"></div>
          <div id="qc-detail-body" class="space-y-5"></div>
        </div>

        <!-- MODAL: Tambah Project ke QC -->
        <div id="modal-qc-project" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-orange-100 text-orange-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-diagram-project text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tambah Project ke QC</h3>
            </div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Order</label>
            <select id="qc-project-wo" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 mb-4">
              <option value="">Memuat...</option>
            </select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tugaskan Site Engineer <span class="text-slate-300 normal-case font-semibold">(opsional)</span></label>
            <div id="qc-project-se" class="max-h-44 overflow-y-auto border border-slate-150 rounded-xl p-2 mb-5">
              <div class="text-xs text-slate-400 py-1 px-1"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat site engineer...</div>
            </div>
            <div class="flex justify-end gap-3">
              <button type="button" onclick="_qcCloseAddProject()" class="px-5 py-2.5 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">Batal</button>
              <button type="button" onclick="_qcSaveAddProject()" class="px-6 py-2.5 text-sm bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Tambah / Edit Item & Subitem QC -->
        <div id="modal-qc-item" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-orange-100 text-orange-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-list-check text-sm"></i></span>
              <h3 id="qc-item-modal-title" class="text-base font-extrabold text-slate-800">Tambah Item QC</h3>
            </div>
            <form onsubmit="_qcSaveItemModal(event)">
              <label id="qc-item-modal-label" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nama Item QC</label>
              <input type="text" id="qc-item-modal-input" autocomplete="off"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100"
                placeholder="mis. Sebelum Instalasi">
              <label id="qc-item-modal-wajib-wrap" class="hidden mt-3 flex items-center gap-2 text-sm font-semibold text-slate-600 cursor-pointer select-none">
                <input type="checkbox" id="qc-item-modal-wajib" class="accent-orange-500"> Wajib diisi
              </label>
              <div id="qc-item-modal-tipe-wrap" class="hidden mt-3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tipe Upload</label>
                <select id="qc-item-modal-tipe" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 bg-white">
                  <option value="foto">Foto (gambar)</option>
                  <option value="file">Dokumen (PDF)</option>
                </select>
              </div>
              <div id="qc-item-modal-instr-wrap" class="hidden mt-3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Instruksi untuk Site Engineer <span class="text-slate-300 normal-case font-semibold">(opsional)</span></label>
                <textarea id="qc-item-modal-instr" rows="3" placeholder="mis. Ambil foto tampak depan bangunan dari jarak ±5m, pastikan seluruh atap terlihat" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 resize-none"></textarea>
              </div>
              <div class="flex justify-end gap-3 mt-5">
                <button type="button" onclick="_qcCloseItemModal()" class="px-5 py-2.5 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">Batal</button>
                <button type="submit" class="px-6 py-2.5 text-sm bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- EDITOR: coret/anotasi foto QC (Lead Engineer). Di LUAR section (sama
           spt lightbox) + kartu ter-center vertikal, bukan toolbar dipaku ke
           top:0 — supaya saat app di-embed via iframe (sites.google.com)
           toolbar tidak terpotong chrome embed di tepi atas. -->
      <div id="modal-qc-anotasi" class="hidden fixed inset-0 z-[330] flex items-center justify-center bg-slate-900/95 px-2 sm:px-3 py-3">
        <div class="w-full max-w-4xl mx-auto flex flex-col" style="max-height:92vh">
          <div class="flex items-center justify-between gap-2 mb-2 flex-wrap shrink-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <button data-color="#ef4444" onclick="_qcAnotSetColor('#ef4444')" class="qc-anot-color h-7 w-7 rounded-full ring-2 ring-white" style="background:#ef4444" title="Merah"></button>
              <button data-color="#eab308" onclick="_qcAnotSetColor('#eab308')" class="qc-anot-color h-7 w-7 rounded-full ring-2 ring-transparent" style="background:#eab308" title="Kuning"></button>
              <button data-color="#22c55e" onclick="_qcAnotSetColor('#22c55e')" class="qc-anot-color h-7 w-7 rounded-full ring-2 ring-transparent" style="background:#22c55e" title="Hijau"></button>
              <button data-color="#111827" onclick="_qcAnotSetColor('#111827')" class="qc-anot-color h-7 w-7 rounded-full ring-2 ring-transparent" style="background:#111827" title="Hitam"></button>
              <button data-color="#ffffff" onclick="_qcAnotSetColor('#ffffff')" class="qc-anot-color h-7 w-7 rounded-full ring-2 ring-transparent border border-white/40" style="background:#ffffff" title="Putih"></button>
              <input type="range" id="qc-anot-size" min="2" max="28" value="6" oninput="_qcAnotSetSize(this.value)" class="w-20 sm:w-28 ml-1 accent-orange-500">
              <button onclick="_qcAnotUndo()" class="text-white/90 hover:text-white bg-white/10 hover:bg-white/20 text-xs font-bold px-2.5 py-1.5 rounded-lg"><i class="fa-solid fa-rotate-left mr-1"></i>Undo</button>
              <button onclick="_qcAnotClear()" class="text-white/90 hover:text-white bg-white/10 hover:bg-white/20 text-xs font-bold px-2.5 py-1.5 rounded-lg"><i class="fa-solid fa-eraser mr-1"></i>Hapus</button>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="_qcAnotClose()" class="text-white/80 hover:text-white text-xs font-bold px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20">Batal</button>
              <button onclick="_qcAnotSave()" class="text-white text-xs font-bold px-4 py-1.5 rounded-lg bg-orange-500 hover:bg-orange-600 shadow"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
            </div>
          </div>
          <div class="flex-1 min-h-0 flex items-center justify-center overflow-auto">
            <canvas id="qc-anot-canvas" class="max-w-full max-h-full rounded-lg bg-slate-800 touch-none" style="touch-action:none"></canvas>
          </div>
        </div>
      </div>

      <!-- LIGHTBOX: preview foto QC in-app. Sengaja diletakkan di LUAR section
           halaman QC (bukan nested di dalamnya) — dipakai ulang dari modul lain
           (mis. Site Survey) yang bisa aktif saat halaman QC sedang
           display:none; kalau nested, elemen ini ikut display:none walau class
           "hidden"-nya sendiri sudah dilepas. -->
      <div id="qc-photo-viewer" class="hidden fixed inset-0 z-[320] flex items-center justify-center bg-slate-900/90 px-4" onclick="_qcCloseFoto()">
        <button onclick="_qcCloseFoto()" class="absolute top-4 right-4 text-white/80 hover:text-white h-11 w-11 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-xl transition"><i class="fa-solid fa-xmark"></i></button>
        <div class="max-w-4xl max-h-[85vh] flex flex-col items-center gap-3" onclick="event.stopPropagation()">
          <div class="relative flex items-center justify-center min-h-[120px] min-w-[120px]">
            <div id="qc-photo-viewer-spinner" class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-white/80">
              <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
              <span class="text-xs font-bold">Memuat foto…</span>
            </div>
            <img id="qc-photo-viewer-img" src="" alt="Preview foto QC"
              onload="_qcFotoLoaded()"
              class="max-w-full max-h-[75vh] rounded-xl shadow-2xl object-contain bg-slate-800 opacity-0 transition-opacity duration-200">
          </div>
          <div class="flex items-center gap-4">
            <button id="qc-photo-edit-btn" onclick="event.stopPropagation();_qcEditFromViewer()" class="hidden inline-flex items-center gap-1.5 text-xs font-bold text-white bg-orange-500 hover:bg-orange-600 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-pen"></i> Tandai</button>
            <a id="qc-photo-viewer-link" href="#" target="_blank" class="text-xs font-bold text-white/70 hover:text-white"><i class="fa-solid fa-up-right-from-square mr-1"></i>Buka di Google Drive</a>
          </div>
        </div>
      </div>
