<script>
// ════════════════ PROJECT SCHEDULE (Gantt) ════════════════
let _schWOList = [];
let _schWO = null;
let _schTasks = [];
let _schSummary = {};
let _schWOStatus = '';
let _schZoom = 'minggu';   // hari | minggu | bulan

function _schEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _schRole(){ return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
function _schCanEdit(){ var r=_schRole(); return r==='projectcoordinator' || r==='leadengineer' || r==='admin'; }
function _schUserNama(){ return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _schRp(n){ return (Number(n)||0).toLocaleString('id-ID'); }

// ── Date helpers (ISO yyyy-MM-dd) ──
function _schD(iso){ return new Date((iso||'') + 'T00:00:00'); }
function _schDays(a,b){ var x=_schD(a),y=_schD(b); if(isNaN(x)||isNaN(y)) return 0; return Math.round((y-x)/86400000); }
function _schFmt(iso){ if(!iso) return '-'; var p=(''+iso).split('-'); return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso; }
function _schTodayIso(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function _schShiftIso(iso,n){ var d=_schD(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

var _SCH_BAR = {
  indigo:['bg-indigo-200','bg-indigo-600'], emerald:['bg-emerald-200','bg-emerald-600'],
  amber:['bg-amber-200','bg-amber-500'], sky:['bg-sky-200','bg-sky-600'],
  rose:['bg-rose-200','bg-rose-500'], violet:['bg-violet-200','bg-violet-600'], slate:['bg-slate-200','bg-slate-500']
};
function _schBar(warna){ return _SCH_BAR[warna] || _SCH_BAR.indigo; }

// ── HOME ──────────────────────────────────────────────────
window.loadSchedule = function() {
  document.getElementById('sch-home').classList.remove('hidden');
  document.getElementById('sch-detail').classList.add('hidden');
  var hint = document.getElementById('sch-role-hint');
  if (hint) hint.innerText = _schCanEdit() ? (_schRole()==='projectcoordinator' ? 'Project Coor' : (_schRole()==='leadengineer' ? 'Lead Engineer' : 'Admin')) : 'Lihat';
  var addBtn = document.getElementById('sch-add-project-btn');
  if (addBtn) addBtn.classList.toggle('hidden', !_schCanEdit());
  document.getElementById('sch-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  google.script.run.withSuccessHandler(function(res){
    _schWOList = (res && res.success) ? (res.list || []) : [];
    _schRenderWOList();
  }).withFailureHandler(function(){
    document.getElementById('sch-wo-list').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat data schedule.</div>';
  }).getScheduleWOList();
};

// Mini-gantt ringkasan: bar tiap tugas proporsional terhadap rentang proyek.
function _schMiniGantt(w) {
  var s = w.summary || {};
  var tasks = w.tasks || [];
  if (!tasks.length || !s.tanggalMulai || !s.tanggalSelesai) return '<div class="text-[11px] text-slate-400 italic px-1 py-2">Belum ada tugas.</div>';
  var start = s.tanggalMulai, end = s.tanggalSelesai;
  var total = _schDays(start, end) + 1; if (total < 1) total = 1;
  var todayIso = _schTodayIso();
  var todayPct = (todayIso >= start && todayIso <= end) ? (_schDays(start, todayIso) / total * 100) : -1;
  var rows = tasks.slice(0, 8).map(function(t){
    var b = _schBar(t.warna);
    var left = _schDays(start, t.mulai) / total * 100;
    var wid = (_schDays(t.mulai, t.selesai) + 1) / total * 100; if (wid < 1.5) wid = 1.5;
    return '<div class="relative h-2 my-1 rounded bg-slate-50">'
      + '<div class="absolute top-0 h-2 rounded ' + b[0] + '" style="left:' + left + '%;width:' + wid + '%">'
      +   '<div class="h-2 rounded ' + b[1] + '" style="width:' + (Number(t.progress)||0) + '%"></div>'
      + '</div></div>';
  }).join('');
  var more = tasks.length > 8 ? '<div class="text-[10px] text-slate-400">+' + (tasks.length - 8) + ' tugas lain</div>' : '';
  var todayLine = todayPct >= 0 ? '<div class="absolute top-0 bottom-0 w-px bg-rose-400/70 z-10" style="left:' + todayPct + '%"></div>' : '';
  return '<div class="relative mt-2 pt-1">' + todayLine + rows + '</div>' + more;
}

function _schRenderWOList() {
  var q = (document.getElementById('sch-search').value || '').toLowerCase().trim();
  var list = _schWOList.filter(function(w){ return !q || ((w.noWO+' '+(w.namaProject||'')+' '+(w.namaKlien||'')).toLowerCase().indexOf(q)!==-1); });
  var box = document.getElementById('sch-wo-list');
  if (!list.length) {
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-diagram-project mr-2"></i>' + (q ? 'Tidak ada project cocok.' : 'Belum ada project. Klik <b>Tambah Project</b>.') + '</div>';
    return;
  }
  box.innerHTML = list.map(function(w){
    var s = w.summary || {};
    var pct = Number(s.progress)||0;
    var pctCls = pct >= 100 ? 'bg-emerald-100 text-emerald-700' : (pct > 0 ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-500');
    var range = (s.tanggalMulai ? _schFmt(s.tanggalMulai) + ' → ' + _schFmt(s.tanggalSelesai) : 'Belum ada jadwal');
    var removeBtn = _schCanEdit()
      ? '<button onclick="event.stopPropagation();_schRemoveProject(\'' + _schEsc(w.noWO) + '\')" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Keluarkan dari Schedule"><i class="fa-regular fa-trash-can text-sm"></i></button>'
      : '';
    return '<div onclick="bukaScheduleDetail(\'' + _schEsc(w.noWO) + '\')" class="w-full text-left bg-white rounded-2xl border border-slate-150 hover:border-indigo-300 hover:shadow-sm transition p-4 cursor-pointer">'
      + '<div class="flex items-start gap-3">'
      +   '<div class="flex-1 min-w-0">'
      +     '<div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700">' + _schEsc(w.noWO) + '</span>'
      +       '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + pctCls + '">' + pct + '%</span>'
      +       '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">' + (s.jumlahTugas||0) + ' tugas</span></div>'
      +     '<div class="font-bold text-slate-800 truncate">' + _schEsc(w.namaProject || '-') + '</div>'
      +     '<div class="text-[11px] text-slate-400 truncate">' + _schEsc(w.namaKlien || '') + ' · ' + range + '</div>'
      +   '</div>'
      +   removeBtn
      +   '<i class="fa-solid fa-chevron-right text-slate-300 mt-1"></i>'
      + '</div>'
      + _schMiniGantt(w)
      + '</div>';
  }).join('');
}

// ── Tambah / keluarkan project ──
function _schOpenAddProject() {
  var sel = document.getElementById('sch-proj-wo');
  sel.innerHTML = '<option value="">Memuat WO...</option>';
  document.getElementById('sch-modal-project').classList.remove('hidden');
  google.script.run.withSuccessHandler(function(data){
    var reg = {}; _schWOList.forEach(function(w){ reg[w.noWO] = 1; });
    var opts = '<option value="">— Pilih Work Order —</option>';
    (data || []).filter(function(w){ return w.status !== 'Closed' && !reg[w.noWO]; }).forEach(function(w){
      opts += '<option value="' + _schEsc(w.noWO) + '">' + _schEsc(w.noWO) + ' — ' + _schEsc(w.namaProject || w.namaKlien || '') + '</option>';
    });
    sel.innerHTML = opts;
  }).withFailureHandler(function(){ sel.innerHTML = '<option value="">Gagal memuat WO</option>'; }).getWorkOrderList();
}
function _schCloseAddProject(){ document.getElementById('sch-modal-project').classList.add('hidden'); }
function _schSubmitAddProject() {
  var noWO = document.getElementById('sch-proj-wo').value;
  if (!noWO) return showNotification('Pilih Work Order dulu.', 'error');
  _schCloseAddProject();
  toggleLoader(true, 'Menambahkan...');
  google.script.run.withSuccessHandler(function(res){
    toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    if (res && res.success) loadSchedule();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .addScheduleProject(noWO, _schUserNama());
}
function _schRemoveProject(noWO) {
  showConfirm({ title: 'Keluarkan dari Schedule', message: 'Keluarkan WO ' + noWO + ' dari Schedule? Tugas tidak dihapus (bisa ditambahkan lagi).', confirmText: 'Ya, Keluarkan', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Memproses...');
    google.script.run.withSuccessHandler(function(res){ toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success) loadSchedule(); })
      .withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .removeScheduleProject(noWO);
  }});
}

// ── DETAIL (Gantt penuh) ──────────────────────────────────
function bukaScheduleDetail(noWO) {
  _schWO = _schWOList.filter(function(w){ return w.noWO === noWO; })[0] || { noWO: noWO, namaProject: '', namaKlien: '' };
  document.getElementById('sch-home').classList.add('hidden');
  document.getElementById('sch-detail').classList.remove('hidden');
  document.getElementById('sch-gantt').innerHTML = '<div class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  _schReloadDetail();
}
function kembaliScheduleHome(){ document.getElementById('sch-detail').classList.add('hidden'); document.getElementById('sch-home').classList.remove('hidden'); loadSchedule(); }

function _schReloadDetail() {
  if (!_schWO) return;
  google.script.run.withSuccessHandler(function(res){
    if (!res || !res.success) { document.getElementById('sch-gantt').innerHTML = '<div class="p-6 text-center text-rose-400">' + ((res && res.message) || 'Gagal memuat.') + '</div>'; return; }
    _schTasks = res.tasks || [];
    _schSummary = res.summary || {};
    _schWOStatus = res.woStatus || '';
    if (res.project) { _schWO.namaProject = res.project.namaProject; _schWO.namaKlien = res.project.namaKlien; }
    _schRenderDetail();
  }).withFailureHandler(function(){ document.getElementById('sch-gantt').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>'; })
    .getScheduleByWO(_schWO.noWO);
}

function _schRenderDetail() {
  var s = _schSummary || {};
  var pct = Number(s.progress)||0;
  var actions = document.getElementById('sch-detail-actions');
  var zoomBtn = function(z, lbl){ return '<button onclick="_schSetZoom(\'' + z + '\')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition ' + (_schZoom===z ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-500 border border-slate-200 hover:text-slate-700') + '">' + lbl + '</button>'; };
  var addBtn = _schCanEdit() ? '<button onclick="_schOpenTask()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Tugas</button>' : '';
  actions.innerHTML = '<div class="flex items-center gap-1.5 flex-wrap justify-end">' + zoomBtn('hari','Hari') + zoomBtn('minggu','Minggu') + zoomBtn('bulan','Bulan') + addBtn + '</div>';

  document.getElementById('sch-detail-head').innerHTML =
      '<div class="flex items-start justify-between gap-3 flex-wrap">'
    + '<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700 text-lg">' + _schEsc(_schWO.noWO) + '</span>'
    +   '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + (pct>=100?'bg-emerald-100 text-emerald-700':(pct>0?'bg-indigo-100 text-indigo-700':'bg-slate-100 text-slate-500')) + '">' + pct + '% selesai</span>'
    +   (_schWOStatus==='Closed' ? '<span class="text-[10px] font-bold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-0.5"></i>WO Closed</span>' : '') + '</div>'
    +   '<div class="font-bold text-slate-800">' + _schEsc(_schWO.namaProject || '-') + '</div>'
    +   '<div class="text-xs text-slate-400">' + _schEsc(_schWO.namaKlien || '') + '</div></div>'
    + '<div class="text-right text-xs text-slate-500"><div class="font-bold text-slate-700">' + (s.jumlahTugas||0) + ' tugas</div>'
    +   '<div>' + (s.tanggalMulai ? _schFmt(s.tanggalMulai) + ' → ' + _schFmt(s.tanggalSelesai) : 'Belum ada jadwal') + '</div></div>'
    + '</div>';

  _schRenderGantt();
}

function _schSetZoom(z){ _schZoom = z; _schRenderDetail(); }

function _schRenderGantt() {
  var box = document.getElementById('sch-gantt');
  if (!_schTasks.length) {
    box.innerHTML = '<div class="p-10 text-center text-slate-400"><i class="fa-solid fa-bars-staggered text-2xl mb-2 block opacity-40"></i>Belum ada tugas.' + (_schCanEdit() ? ' Klik <b>Tambah Tugas</b>.' : '') + '</div>';
    return;
  }
  var start = _schSummary.tanggalMulai, end = _schSummary.tanggalSelesai;
  start = _schShiftIso(start, -2); end = _schShiftIso(end, 2);
  var totalDays = _schDays(start, end) + 1; if (totalDays < 1) totalDays = 1;
  var ppd = _schZoom === 'hari' ? 34 : (_schZoom === 'bulan' ? 6 : 15);
  var totalPx = totalDays * ppd;
  var leftW = 210;
  var todayIso = _schTodayIso();
  var todayPx = (todayIso >= start && todayIso <= end) ? (_schDays(start, todayIso) * ppd) : -1;
  var todayLine = todayPx >= 0 ? '<div class="absolute top-0 bottom-0 w-px bg-rose-400/70 z-20" style="left:' + todayPx + 'px"></div>' : '';

  // Header ticks
  var step = _schZoom === 'hari' ? 1 : (_schZoom === 'bulan' ? 0 : 7);
  var ticks = '';
  if (_schZoom === 'bulan') {
    // tick tiap awal bulan
    var cur = _schD(start);
    for (var d = 0; d <= totalDays; d++) {
      var di = _schShiftIso(start, d);
      var dd = _schD(di);
      if (dd.getDate() === 1 || d === 0) {
        var lx = d * ppd;
        ticks += '<div class="absolute top-0 bottom-0 border-l border-slate-100" style="left:' + lx + 'px"></div><div class="absolute top-1 text-[10px] font-bold text-slate-500 whitespace-nowrap" style="left:' + (lx+3) + 'px">' + _schMonLbl(dd) + '</div>';
      }
    }
  } else {
    for (var t = 0; t <= totalDays; t += step) {
      var ti = _schShiftIso(start, t);
      var lxx = t * ppd;
      var lbl = _schZoom === 'hari' ? (''+_schD(ti).getDate()) : _schFmt(ti).slice(0,5);
      ticks += '<div class="absolute top-0 bottom-0 border-l border-slate-100" style="left:' + lxx + 'px"></div><div class="absolute top-1 text-[10px] font-bold text-slate-400 whitespace-nowrap" style="left:' + (lxx+2) + 'px">' + lbl + '</div>';
    }
  }

  var rows = _schTasks.map(function(t){
    var b = _schBar(t.warna);
    var leftPx = _schDays(start, t.mulai) * ppd;
    var wPx = (_schDays(t.mulai, t.selesai) + 1) * ppd; if (wPx < 6) wPx = 6;
    var prog = Number(t.progress)||0;
    var clickable = _schCanEdit() ? ' cursor-pointer' : '';
    var onclk = _schCanEdit() ? ' onclick="_schOpenTask(\'' + _schEsc(t.id) + '\')"' : '';
    var faseTxt = t.fase ? '<span class="text-[10px] text-slate-400"> · ' + _schEsc(t.fase) + '</span>' : '';
    return '<div class="flex border-b border-slate-100 items-stretch">'
      + '<div class="shrink-0 sticky left-0 bg-white z-10 px-3 py-2 border-r border-slate-100" style="width:' + leftW + 'px">'
      +   '<div class="text-xs font-bold text-slate-700 truncate' + clickable + '"' + onclk + '>' + _schEsc(t.namaTugas) + faseTxt + '</div>'
      +   '<div class="text-[10px] text-slate-400">' + _schFmt(t.mulai) + ' → ' + _schFmt(t.selesai) + ' · ' + prog + '%</div>'
      + '</div>'
      + '<div class="relative" style="width:' + totalPx + 'px;min-height:42px">'
      +   todayLine
      +   '<div class="absolute rounded-md ' + b[0] + clickable + ' flex items-center overflow-hidden shadow-sm" style="left:' + leftPx + 'px;width:' + wPx + 'px;top:9px;height:22px"' + onclk + ' title="' + _schEsc(t.namaTugas) + '">'
      +     '<div class="h-full ' + b[1] + '" style="width:' + prog + '%"></div>'
      +     '<span class="absolute inset-0 flex items-center px-1.5 text-[10px] font-bold text-slate-700 truncate">' + (wPx > 46 ? prog + '%' : '') + '</span>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  box.innerHTML = '<div class="overflow-x-auto"><div style="min-width:' + (leftW + totalPx) + 'px">'
    + '<div class="flex bg-slate-50 border-b border-slate-200">'
    +   '<div class="shrink-0 sticky left-0 bg-slate-50 z-10 px-3 py-2 text-[11px] font-bold text-slate-500 uppercase border-r border-slate-200" style="width:' + leftW + 'px">Tugas</div>'
    +   '<div class="relative" style="width:' + totalPx + 'px;height:24px">' + ticks + '</div>'
    + '</div>'
    + rows
    + '</div></div>';
}
function _schMonLbl(d){ var m=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return m[d.getMonth()] + ' ' + d.getFullYear(); }

// ── Tugas CRUD ──
function _schOpenTask(id) {
  if (!_schCanEdit()) return;
  var t = id ? _schTasks.filter(function(x){ return x.id === id; })[0] : null;
  document.getElementById('sch-task-title').innerText = t ? 'Edit Tugas' : 'Tambah Tugas';
  document.getElementById('sch-task-id').value = t ? t.id : '';
  document.getElementById('sch-task-nama').value = t ? t.namaTugas : '';
  document.getElementById('sch-task-fase').value = t ? t.fase : '';
  document.getElementById('sch-task-warna').value = t ? (t.warna || 'indigo') : 'indigo';
  document.getElementById('sch-task-mulai').value = t ? t.mulai : '';
  document.getElementById('sch-task-selesai').value = t ? t.selesai : '';
  document.getElementById('sch-task-progress').value = t ? t.progress : 0;
  document.getElementById('sch-task-urutan').value = t ? t.urutan : (_schTasks.length);
  document.getElementById('sch-task-catatan').value = t ? t.catatan : '';
  document.getElementById('sch-task-del').classList.toggle('hidden', !t);
  document.getElementById('sch-modal-task').classList.remove('hidden');
}
function _schCloseTask(){ document.getElementById('sch-modal-task').classList.add('hidden'); }
function _schSubmitTask() {
  var id = document.getElementById('sch-task-id').value;
  var payload = {
    id: id, noWO: _schWO.noWO,
    namaTugas: document.getElementById('sch-task-nama').value.trim(),
    fase: document.getElementById('sch-task-fase').value.trim(),
    warna: document.getElementById('sch-task-warna').value,
    mulai: document.getElementById('sch-task-mulai').value,
    selesai: document.getElementById('sch-task-selesai').value,
    progress: Number(document.getElementById('sch-task-progress').value) || 0,
    urutan: Number(document.getElementById('sch-task-urutan').value) || 0,
    catatan: document.getElementById('sch-task-catatan').value.trim(),
    oleh: _schUserNama()
  };
  if (!payload.namaTugas) return showNotification('Nama tugas wajib.', 'error');
  if (!payload.mulai || !payload.selesai) return showNotification('Tanggal mulai & selesai wajib.', 'error');
  _schCloseTask();
  toggleLoader(true, 'Menyimpan...');
  var cb = function(res){ toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success) _schReloadDetail(); };
  var fail = function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); };
  if (id) google.script.run.withSuccessHandler(cb).withFailureHandler(fail).updateScheduleTask(payload);
  else google.script.run.withSuccessHandler(cb).withFailureHandler(fail).saveScheduleTask(payload);
}
function _schDeleteTask() {
  var id = document.getElementById('sch-task-id').value;
  if (!id) return;
  showConfirm({ title: 'Hapus Tugas', message: 'Hapus tugas ini dari schedule?', confirmText: 'Ya, Hapus', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    _schCloseTask();
    toggleLoader(true, 'Menghapus...');
    google.script.run.withSuccessHandler(function(res){ toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success) _schReloadDetail(); })
      .withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .hapusScheduleTask(id);
  }});
}
</script>
