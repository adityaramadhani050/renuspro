<script>
// ════════════════ PROJECT SCHEDULE (Gantt) ════════════════
let _schWOList = [];
let _schWO = null;
let _schTasks = [];
let _schSummary = {};
let _schWOStatus = '';
let _schZoom = 'minggu';   // hari | minggu | bulan (detail)
let _schHomeZoom = 'minggu'; // hari | minggu | bulan (home gabungan)
let _schSEList = [];         // cache daftar Site Engineer

function _schEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _schRole(){ return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
function _schCanEdit(){ var r=_schRole(); return r==='projectcoordinator' || r==='admin'; }  // Lead/Site Engineer read-only
function _schUserNama(){ return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _schRp(n){ return (Number(n)||0).toLocaleString('id-ID'); }

// ── Date helpers (ISO yyyy-MM-dd) ──
function _schD(iso){ return new Date((iso||'') + 'T00:00:00'); }
function _schDays(a,b){ var x=_schD(a),y=_schD(b); if(isNaN(x)||isNaN(y)) return 0; return Math.round((y-x)/86400000); }
function _schFmt(iso){ if(!iso) return '-'; var p=(''+iso).split('-'); return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso; }
function _schTodayIso(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function _schShiftIso(iso,n){ var d=_schD(iso); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

var _SCH_BAR = {
  indigo:['bg-indigo-200','bg-indigo-600'], emerald:['bg-emerald-200','bg-emerald-600'],
  amber:['bg-amber-200','bg-amber-500'], sky:['bg-sky-200','bg-sky-600'],
  rose:['bg-rose-200','bg-rose-500'], violet:['bg-violet-200','bg-violet-600'], slate:['bg-slate-200','bg-slate-500']
};
function _schBar(warna){ return _SCH_BAR[warna] || _SCH_BAR.indigo; }

// ── HOME ──────────────────────────────────────────────────
window.loadSchedule = function(fromNav) {
  document.getElementById('sch-home').classList.remove('hidden');
  document.getElementById('sch-detail').classList.add('hidden');
  var hint = document.getElementById('sch-role-hint');
  if (hint) hint.innerText = _schCanEdit() ? (_schRole()==='projectcoordinator' ? 'Project Coor' : 'Admin') : 'Lihat';
  var addBtn = document.getElementById('sch-add-project-btn');
  if (addBtn) addBtn.classList.toggle('hidden', !_schCanEdit());
  var render = function(res) {
    _schWOList = (res && res.success) ? (res.list || []) : [];
    _schRenderWOList();
  };
  // Warm daftar Site Engineer untuk dropdown penugasan (cache sesi).
  if (!(_schSEList && _schSEList.length)) {
    google.script.run.withSuccessHandler(function(res){ _schSEList = (res && res.success) ? (res.list || []) : []; }).getSiteEngineerList();
  }
  var c = fromNav ? navCacheGet('schedule') : null;
  if (c) { render(c); return; }
  document.getElementById('sch-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  google.script.run.withSuccessHandler(function(res){
    navCacheSet('schedule', res);
    render(res);
  }).withFailureHandler(function(){
    document.getElementById('sch-wo-list').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat data schedule.</div>';
  }).getScheduleWOList();
};

function _schSetHomeZoom(z){ _schHomeZoom = z; _schRenderWOList(); }

// Bangun header ticks + garis vertikal untuk rentang tertentu (dipakai home & bisa detail).
function _schBuildTicks(start, totalDays, ppd, zoom) {
  var ticks = '';
  if (zoom === 'bulan') {
    for (var d = 0; d <= totalDays; d++) {
      var di = _schShiftIso(start, d);
      var dd = _schD(di);
      if (dd.getDate() === 1 || d === 0) {
        var lx = d * ppd;
        ticks += '<div class="absolute top-0 bottom-0 border-l border-slate-100" style="left:' + lx + 'px"></div><div class="absolute top-1 text-[10px] font-bold text-slate-500 whitespace-nowrap" style="left:' + (lx+3) + 'px">' + _schMonLbl(dd) + '</div>';
      }
    }
  } else {
    var step = zoom === 'hari' ? 1 : 7;
    for (var t = 0; t <= totalDays; t += step) {
      var ti = _schShiftIso(start, t);
      var lxx = t * ppd;
      var lbl = zoom === 'hari' ? (''+_schD(ti).getDate()) : _schFmt(ti).slice(0,5);
      ticks += '<div class="absolute top-0 bottom-0 border-l border-slate-100" style="left:' + lxx + 'px"></div><div class="absolute top-1 text-[10px] font-bold text-slate-400 whitespace-nowrap" style="left:' + (lxx+2) + 'px">' + lbl + '</div>';
    }
  }
  return ticks;
}

// Home = SATU gantt gabungan: tiap baris = 1 WO (rentang ringkasan proyek), timeline
// bersama agar bentrok jadwal antar-WO mudah terlihat. Klik baris → detail per-tugas.
function _schRenderHomeGantt(list) {
  // Rentang global dari seluruh WO yang sudah punya jadwal
  var starts = [], ends = [];
  list.forEach(function(w){ var s = w.summary || {}; if (s.tanggalMulai) starts.push(s.tanggalMulai); if (s.tanggalSelesai) ends.push(s.tanggalSelesai); });
  var hasDates = starts.length > 0;
  var start, end;
  if (hasDates) {
    start = starts.reduce(function(a,b){ return a<b?a:b; });
    end   = ends.reduce(function(a,b){ return a>b?a:b; });
  } else {
    var td = _schTodayIso(); start = _schShiftIso(td, -7); end = _schShiftIso(td, 21);
  }
  start = _schShiftIso(start, -2); end = _schShiftIso(end, 2);
  var totalDays = _schDays(start, end) + 1; if (totalDays < 1) totalDays = 1;
  var ppd = _schHomeZoom === 'hari' ? 34 : (_schHomeZoom === 'bulan' ? 6 : 15);
  var totalPx = totalDays * ppd;
  var infoW = 188, seW = 122, leftW = infoW + seW;
  var todayIso = _schTodayIso();
  var todayPx = (todayIso >= start && todayIso <= end) ? (_schDays(start, todayIso) * ppd) : -1;
  var todayLine = todayPx >= 0 ? '<div class="absolute top-0 bottom-0 w-px bg-rose-400/70 z-20" style="left:' + todayPx + 'px"></div>' : '';
  var ticks = _schBuildTicks(start, totalDays, ppd, _schHomeZoom);

  var palette = ['indigo','emerald','amber','sky','rose','violet'];
  var rows = list.map(function(w, idx){
    var s = w.summary || {};
    var pct = Number(s.progress)||0;
    var hasR = s.tanggalMulai && s.tanggalSelesai;
    var b = _schBar(palette[idx % palette.length]);
    var removeBtn = _schCanEdit()
      ? '<button onclick="event.stopPropagation();_schRemoveProject(\'' + _schEsc(w.noWO) + '\')" class="text-slate-300 hover:text-rose-500 shrink-0" title="Keluarkan dari Schedule"><i class="fa-regular fa-trash-can text-xs"></i></button>'
      : '';
    var bar;
    if (hasR) {
      var leftPx = _schDays(start, s.tanggalMulai) * ppd;
      var wPx = (_schDays(s.tanggalMulai, s.tanggalSelesai) + 1) * ppd; if (wPx < 6) wPx = 6;
      var jt = Number(s.jumlahTugas) || 0;
      var barLbl = wPx > 150 ? (_schEsc(w.noWO) + ' · ' + pct + '% · ' + jt + ' tugas')
                 : wPx > 90  ? (pct + '% · ' + jt + ' tugas')
                 : wPx > 44  ? (pct + '%')
                 : '';
      bar = '<div class="absolute rounded-md ' + b[0] + ' flex items-center overflow-hidden shadow-sm" style="left:' + leftPx + 'px;width:' + wPx + 'px;top:9px;height:22px" title="' + _schEsc(w.namaProject || w.noWO) + ' · ' + pct + '% · ' + jt + ' tugas">'
          +   '<div class="h-full ' + b[1] + '" style="width:' + pct + '%"></div>'
          +   '<span class="absolute inset-0 flex items-center px-1.5 text-[10px] font-bold text-white drop-shadow-sm truncate">' + barLbl + '</span>'
          + '</div>';
    } else {
      bar = '<div class="absolute text-[10px] text-slate-300 italic" style="left:4px;top:13px">Belum ada jadwal</div>';
    }
    return '<div onclick="bukaScheduleDetail(\'' + _schEsc(w.noWO) + '\')" class="flex border-b border-slate-100 items-stretch hover:bg-indigo-50/40 cursor-pointer">'
      + '<div class="shrink-0 sticky left-0 z-10 flex bg-white border-r border-slate-100" style="width:' + leftW + 'px">'
      +   '<div class="px-3 py-2 min-w-0 flex flex-col justify-center" style="width:' + infoW + 'px">'
      +     '<div class="flex items-center gap-1.5 min-w-0"><span class="font-mono text-xs font-extrabold text-slate-700 truncate">' + _schEsc(w.noWO) + '</span>'
      +       '<span class="text-[10px] text-slate-400 whitespace-nowrap shrink-0">' + pct + '% · ' + (s.jumlahTugas||0) + ' tugas</span></div>'
      +     '<div class="text-[11px] text-slate-600 font-semibold truncate">' + _schEsc(w.namaProject || '-') + '</div>'
      +   '</div>'
      +   '<div class="px-2 py-2 flex items-center justify-between gap-1 border-l border-slate-100 min-w-0" style="width:' + seW + 'px">'
      +     '<span class="text-[11px] text-slate-500 truncate" title="' + _schEsc(w.siteEngineer || '') + '"><i class="fa-solid fa-helmet-safety mr-1 text-slate-300"></i>' + (w.siteEngineer ? _schEsc(w.siteEngineer) : '—') + '</span>'
      +     removeBtn
      +   '</div>'
      + '</div>'
      + '<div class="relative bg-white" style="width:' + totalPx + 'px;min-height:52px">' + todayLine + bar + '</div>'
      + '</div>';
  }).join('');

  var zoomBtn = function(z, lbl){ return '<button onclick="_schSetHomeZoom(\'' + z + '\')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition ' + (_schHomeZoom===z ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-500 border border-slate-200 hover:text-slate-700') + '">' + lbl + '</button>'; };

  return '<div class="flex items-center justify-end gap-2 mb-3 flex-wrap">'
    +   '<div class="flex items-center gap-1.5">' + zoomBtn('hari','Hari') + zoomBtn('minggu','Minggu') + zoomBtn('bulan','Bulan') + '</div>'
    + '</div>'
    + '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
    +   '<div class="overflow-x-auto"><div style="min-width:' + (leftW + totalPx) + 'px">'
    +     '<div class="flex bg-slate-50 border-b border-slate-200">'
    +       '<div class="shrink-0 sticky left-0 z-10 flex bg-slate-50 border-r border-slate-200" style="width:' + leftW + 'px">'
    +         '<div class="px-3 py-2 text-[11px] font-bold text-slate-500 uppercase" style="width:' + infoW + 'px">Work Order</div>'
    +         '<div class="px-2 py-2 text-[11px] font-bold text-slate-500 uppercase border-l border-slate-200" style="width:' + seW + 'px">Site Eng.</div>'
    +       '</div>'
    +       '<div class="relative" style="width:' + totalPx + 'px;height:24px">' + ticks + '</div>'
    +     '</div>'
    +     rows
    +   '</div></div>'
    + '</div>';
}

function _schRenderWOList() {
  var q = (document.getElementById('sch-search').value || '').toLowerCase().trim();
  // Site Engineer: hanya WO yang di-assign ke dirinya.
  var isSE = _schRole() === 'siteengineer';
  var me = _schUserNama();
  var list = _schWOList.filter(function(w){
    if (isSE && (w.siteEngineer || '') !== me) return false;
    return !q || ((w.noWO+' '+(w.namaProject||'')+' '+(w.namaKlien||'')).toLowerCase().indexOf(q)!==-1);
  });
  var box = document.getElementById('sch-wo-list');
  if (!list.length) {
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-diagram-project mr-2"></i>' + (q ? 'Tidak ada project cocok.' : (isSE ? 'Belum ada project yang ditugaskan ke Anda.' : 'Belum ada project. Klik <b>Tambah Project</b>.')) + '</div>';
    return;
  }
  box.innerHTML = _schRenderHomeGantt(list);
}

// ── Tambah / keluarkan project ──
function _schSEOptions(selected){
  var opts = '<option value="">— Belum ditugaskan —</option>';
  (_schSEList || []).forEach(function(u){
    var nm = u.nama || u.username || '';
    opts += '<option value="' + _schEsc(nm) + '"' + (nm === selected ? ' selected' : '') + '>' + _schEsc(nm) + '</option>';
  });
  return opts;
}
function _schOpenAddProject() {
  var sel = document.getElementById('sch-proj-wo');
  var selSE = document.getElementById('sch-proj-se');
  sel.innerHTML = '<option value="">Memuat WO...</option>';
  selSE.innerHTML = '<option value="">Memuat...</option>';
  document.getElementById('sch-modal-project').classList.remove('hidden');
  google.script.run.withSuccessHandler(function(data){
    var reg = {}; _schWOList.forEach(function(w){ reg[w.noWO] = 1; });
    var opts = '<option value="">— Pilih Work Order —</option>';
    (data || []).filter(function(w){ return w.status !== 'Closed' && !reg[w.noWO]; }).forEach(function(w){
      opts += '<option value="' + _schEsc(w.noWO) + '">' + _schEsc(w.noWO) + ' — ' + _schEsc(w.namaProject || w.namaKlien || '') + '</option>';
    });
    sel.innerHTML = opts;
    if (typeof sdEnsure === 'function') sdEnsure('sch-proj-wo', '— Pilih Work Order —', 'Cari No WO / project...');   // data-banyak → searchable
  }).withFailureHandler(function(){ sel.innerHTML = '<option value="">Gagal memuat WO</option>'; }).getWorkOrderList();
  google.script.run.withSuccessHandler(function(res){
    _schSEList = (res && res.success) ? (res.list || []) : [];
    selSE.innerHTML = _schSEOptions('');
  }).withFailureHandler(function(){ selSE.innerHTML = '<option value="">Gagal memuat SE</option>'; }).getSiteEngineerList();
}
function _schCloseAddProject(){ document.getElementById('sch-modal-project').classList.add('hidden'); }
function _schSubmitAddProject() {
  var noWO = document.getElementById('sch-proj-wo').value;
  var se = document.getElementById('sch-proj-se').value;
  if (!noWO) return showNotification('Pilih Work Order dulu.', 'error');
  _schCloseAddProject();
  toggleLoader(true, 'Menambahkan...');
  google.script.run.withSuccessHandler(function(res){
    toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    if (res && res.success) loadSchedule();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .addScheduleProject(noWO, _schUserNama(), se);
}
function _schRemoveProject(noWO) {
  showConfirm({ title: 'Keluarkan dari Schedule', message: 'Keluarkan WO ' + noWO + ' dari Schedule? Tugas tidak dihapus (bisa ditambahkan lagi).', confirmText: 'Ya, Keluarkan', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Memproses...');
    google.script.run.withSuccessHandler(function(res){ toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success) loadSchedule(); })
      .withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .removeScheduleProject(noWO);
  }});
}

// ── DETAIL (Gantt penuh) ──────────────────────────────────
function bukaScheduleDetail(noWO) {
  _schWO = _schWOList.filter(function(w){ return w.noWO === noWO; })[0] || { noWO: noWO, namaProject: '', namaKlien: '' };
  document.getElementById('sch-home').classList.add('hidden');
  document.getElementById('sch-detail').classList.remove('hidden');
  document.getElementById('sch-gantt').innerHTML = '<div class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  _schReloadDetail();
}
function kembaliScheduleHome(){ document.getElementById('sch-detail').classList.add('hidden'); document.getElementById('sch-home').classList.remove('hidden'); loadSchedule(); }

function _schReloadDetail() {
  if (!_schWO) return;
  google.script.run.withSuccessHandler(function(res){
    if (!res || !res.success) { document.getElementById('sch-gantt').innerHTML = '<div class="p-6 text-center text-rose-400">' + ((res && res.message) || 'Gagal memuat.') + '</div>'; return; }
    _schTasks = res.tasks || [];
    _schSummary = res.summary || {};
    _schWOStatus = res.woStatus || '';
    if (res.project) { _schWO.namaProject = res.project.namaProject; _schWO.namaKlien = res.project.namaKlien; _schWO.siteEngineer = res.project.siteEngineer || ''; }
    _schRenderDetail();
  }).withFailureHandler(function(){ document.getElementById('sch-gantt').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>'; })
    .getScheduleByWO(_schWO.noWO);
}

function _schRenderDetail() {
  var s = _schSummary || {};
  var pct = Number(s.progress)||0;
  var actions = document.getElementById('sch-detail-actions');
  var zoomBtn = function(z, lbl){ return '<button onclick="_schSetZoom(\'' + z + '\')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition ' + (_schZoom===z ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-500 border border-slate-200 hover:text-slate-700') + '">' + lbl + '</button>'; };
  var addBtn = _schCanEdit() ? '<button onclick="_schOpenTask()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Tugas</button>' : '';
  var assignBtn = (_schCanEdit() && _schWOStatus !== 'Closed')
    ? '<div class="relative">'
      + '<button onclick="_schToggleAssign(event)" title="Atur Site Engineer" class="inline-flex items-center gap-2 bg-white hover:bg-indigo-50 text-indigo-600 border border-indigo-300 text-sm font-bold px-3 sm:px-4 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-user-pen"></i><span class="hidden sm:inline"> Atur Site Engineer</span><i class="fa-solid fa-chevron-down text-[10px] ml-0.5 hidden sm:inline"></i></button>'
      + '<div id="sch-assign-panel" class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-slate-150 z-40 p-4"></div>'
      + '</div>'
    : '';
  var reloadBtn = '<button onclick="_engMuatUlang(\'_schReloadDetail\', this)" title="Muat ulang" class="inline-flex items-center justify-center bg-white hover:bg-slate-50 text-slate-500 border border-slate-200 h-[38px] w-[38px] rounded-lg shadow-sm transition shrink-0"><i class="fa-solid fa-rotate-right"></i></button>';
  var bulkBtn = _schCanEdit() ? '<button onclick="_schOpenBulk()" class="inline-flex items-center gap-2 bg-white hover:bg-indigo-50 text-indigo-600 border border-indigo-300 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-bolt"></i><span class="hidden sm:inline"> Tambah Cepat</span></button>' : '';
  actions.innerHTML = '<div class="flex items-center gap-1.5 flex-wrap justify-end">' + reloadBtn + zoomBtn('hari','Hari') + zoomBtn('minggu','Minggu') + zoomBtn('bulan','Bulan') + assignBtn + bulkBtn + addBtn + '</div>';

  var se = _schWO.siteEngineer || '';
  var seBadge = se
    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600 inline-flex items-center gap-1"><i class="fa-solid fa-helmet-safety"></i>' + _schEsc(se) + '</span>'
    : '<span class="text-[11px] text-slate-400 italic">Belum ada Site Engineer</span>';

  document.getElementById('sch-detail-head').innerHTML =
      '<div class="flex items-start justify-between gap-3 flex-wrap">'
    + '<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700 text-lg">' + _schEsc(_schWO.noWO) + '</span>'
    +   '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + (pct>=100?'bg-emerald-100 text-emerald-700':(pct>0?'bg-indigo-100 text-indigo-700':'bg-slate-100 text-slate-500')) + '">' + pct + '% selesai</span>'
    +   (_schWOStatus==='Closed' ? '<span class="text-[10px] font-bold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-0.5"></i>WO Closed</span>' : '') + '</div>'
    +   '<div class="font-bold text-slate-800">' + _schEsc(_schWO.namaProject || '-') + '</div>'
    +   '<div class="text-xs text-slate-400">' + _schEsc(_schWO.namaKlien || '') + '</div>'
    +   '</div>'
    + '<div class="flex flex-col items-end gap-1.5 shrink-0 text-right">'
    +   seBadge
    +   '<div class="text-xs text-slate-500"><div class="font-bold text-slate-700">' + (s.jumlahTugas||0) + ' tugas</div>'
    +     '<div>' + (s.tanggalMulai ? _schFmt(s.tanggalMulai) + ' → ' + _schFmt(s.tanggalSelesai) : 'Belum ada jadwal') + '</div></div>'
    + '</div>'
    + '</div>';

  _schRenderGantt();
}

function _schSetZoom(z){ _schZoom = z; _schRenderDetail(); }

function _schToggleAssign(e) {
  if (e) e.stopPropagation();
  var panel = document.getElementById('sch-assign-panel');
  if (!panel) return;
  var willOpen = panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  if (!willOpen) return;
  if (!window._schAssignDocBound) {
    window._schAssignDocBound = true;
    document.addEventListener('click', function(ev) {
      var p = document.getElementById('sch-assign-panel');
      if (p && !p.classList.contains('hidden') && !p.contains(ev.target)) p.classList.add('hidden');
    });
  }
  var render = function() {
    var cur = _schWO.siteEngineer || '';
    var opt = function(val, label, italic) {
      return '<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="radio" name="sch-assign-se" value="' + _schEsc(val) + '"' + (val === cur ? ' checked' : '') + ' class="w-4 h-4 accent-indigo-600"><span class="text-sm ' + (italic ? 'text-slate-400 italic' : 'text-slate-700') + '">' + label + '</span></label>';
    };
    var rows = (_schSEList || []).map(function(u) { var nm = u.nama || u.username || ''; return opt(nm, _schEsc(nm), false); }).join('');
    panel.innerHTML = '<div class="text-[11px] font-bold text-slate-400 uppercase mb-2">Tugaskan Site Engineer</div>'
      + '<div class="max-h-56 overflow-y-auto">' + opt('', 'Tanpa Site Engineer', true) + (rows || '') + '</div>'
      + '<button onclick="_schSaveAssign()" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 rounded-lg">Simpan</button>';
  };
  if (_schSEList && _schSEList.length) render();
  else google.script.run.withSuccessHandler(function(res){ _schSEList = (res && res.success) ? (res.list || []) : []; render(); }).withFailureHandler(function(){ _schSEList = []; render(); }).getSiteEngineerList();
}
function _schSaveAssign() {
  var el = document.querySelector('input[name="sch-assign-se"]:checked');
  var nama = el ? el.value : '';
  var panel = document.getElementById('sch-assign-panel'); if (panel) panel.classList.add('hidden');
  _schSaveSE(nama);
}
function _schSaveSE(nama) {
  if (!_schWO) return;
  toggleLoader(true, 'Menyimpan...');
  google.script.run.withSuccessHandler(function(res){
    toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    if (res && res.success) { _schWO.siteEngineer = nama; _schRenderDetail(); }
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .updateScheduleSiteEngineer(_schWO.noWO, nama);
}

function _schRenderGantt() {
  var box = document.getElementById('sch-gantt');
  if (!_schTasks.length) {
    box.innerHTML = '<div class="p-10 text-center text-slate-400"><i class="fa-solid fa-bars-staggered text-2xl mb-2 block opacity-40"></i>Belum ada tugas.' + (_schCanEdit() ? ' Klik <b>Tambah Tugas</b>.' : '') + '</div>';
    return;
  }
  var start = _schSummary.tanggalMulai, end = _schSummary.tanggalSelesai;
  start = _schShiftIso(start, -2); end = _schShiftIso(end, 2);
  var totalDays = _schDays(start, end) + 1; if (totalDays < 1) totalDays = 1;
  var ppd = _schZoom === 'hari' ? 34 : (_schZoom === 'bulan' ? 6 : 15);
  var totalPx = totalDays * ppd;
  var leftW = 280;
  var todayIso = _schTodayIso();
  var todayPx = (todayIso >= start && todayIso <= end) ? (_schDays(start, todayIso) * ppd) : -1;
  var todayLine = todayPx >= 0 ? '<div class="absolute top-0 bottom-0 w-px bg-rose-400/70 z-20" style="left:' + todayPx + 'px"></div>' : '';

  // Header ticks (helper bersama dengan home)
  var ticks = _schBuildTicks(start, totalDays, ppd, _schZoom);

  var canEd = _schCanEdit();
  // Satu baris tugas (dipakai di dalam grup fase). Klik kotak tugas → modal edit tugas.
  function _schTaskRow(t){
    var b = _schBar(t.warna);
    var leftPx = _schDays(start, t.mulai) * ppd;
    var wPx = (_schDays(t.mulai, t.selesai) + 1) * ppd; if (wPx < 6) wPx = 6;
    var prog = Number(t.progress)||0;
    var clickable = canEd ? ' cursor-pointer' : '';
    var onclk = canEd ? ' onclick="_schOpenTask(\'' + _schEsc(t.id) + '\')"' : '';
    var nameInner = '<div class="text-xs font-bold text-slate-700 truncate flex-1 min-w-0">' + _schEsc(t.namaTugas) + '</div>';
    var delBtn = canEd ? '<button onclick="event.stopPropagation();_schInlineDelete(\'' + _schEsc(t.id) + '\')" title="Hapus tugas" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 shrink-0 transition px-0.5"><i class="fa-regular fa-trash-can text-[11px]"></i></button>' : '';
    var nameDiv = '<div class="flex items-center gap-1">' + nameInner + delBtn + '</div>';
    var dateTxt = _schFmt(t.mulai) + ' → ' + _schFmt(t.selesai) + ' · ' + (_schDays(t.mulai, t.selesai) + 1) + ' hari · ' + prog + '%';
    var dateDiv = '<div class="text-[10px] text-slate-400 whitespace-nowrap">' + dateTxt + '</div>';
    // Kotak tugas (info kiri) → klik untuk buka modal edit tugas.
    var boxClick = canEd ? ' cursor-pointer hover:bg-indigo-50/50' : '';
    var boxAttr = canEd ? ' onclick="_schOpenTask(\'' + _schEsc(t.id) + '\')" title="Klik untuk edit tugas"' : '';
    return '<div class="flex border-b border-slate-100 items-stretch group">'
      + '<div class="shrink-0 sticky left-0 bg-white z-10 pl-5 pr-3 py-2 border-r border-slate-100 transition-colors' + boxClick + '" style="width:' + leftW + 'px"' + boxAttr + '>'
      +   nameDiv
      +   dateDiv
      + '</div>'
      + '<div class="relative" style="width:' + totalPx + 'px;min-height:42px">'
      +   todayLine
      +   '<div class="absolute rounded-md ' + b[0] + clickable + ' flex items-center overflow-hidden shadow-sm" style="left:' + leftPx + 'px;width:' + wPx + 'px;top:9px;height:22px"' + onclk + ' title="' + _schEsc(t.namaTugas) + '">'
      +     '<div class="h-full ' + b[1] + '" style="width:' + prog + '%"></div>'
      +     '<span class="absolute inset-0 flex items-center px-1.5 text-[10px] font-bold text-slate-700 truncate">' + (wPx > 46 ? prog + '%' : '') + '</span>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  // Kelompokkan tugas berdasarkan Fase (urutan kanonik → fase lain → tanpa fase).
  var FASE_ORDER = ['Hand Over','Engineering','Pengadaan','Pengiriman','Kontruksi','Finishing'];
  var groups = {};
  _schTasks.forEach(function(t){ var f = (t.fase || '').trim(); (groups[f] = groups[f] || []).push(t); });
  var faseKeys = Object.keys(groups).sort(function(a, b){
    var ia = (a === '') ? 999 : (FASE_ORDER.indexOf(a) === -1 ? 500 : FASE_ORDER.indexOf(a));
    var ib = (b === '') ? 999 : (FASE_ORDER.indexOf(b) === -1 ? 500 : FASE_ORDER.indexOf(b));
    return ia - ib;
  });

  var rows = faseKeys.map(function(f){
    var gtasks = groups[f];
    var gmin = '', gmax = '', gdur = 0, gwp = 0;
    gtasks.forEach(function(t){
      if (t.mulai && (!gmin || t.mulai < gmin)) gmin = t.mulai;
      if (t.selesai && (!gmax || t.selesai > gmax)) gmax = t.selesai;
      var d = _schDays(t.mulai, t.selesai) + 1; if (d < 1) d = 1;
      gdur += d; gwp += (Number(t.progress)||0) * d;
    });
    var gpct = gdur ? Math.round(gwp / gdur) : 0;
    var gdays = (gmin && gmax) ? (_schDays(gmin, gmax) + 1) : 0;
    var spanBar = '';
    if (gmin && gmax) {
      var gl = _schDays(start, gmin) * ppd;
      var gw = (_schDays(gmin, gmax) + 1) * ppd; if (gw < 6) gw = 6;
      spanBar = '<div class="absolute top-1/2 -translate-y-1/2 h-1.5 rounded-full bg-slate-300/70" style="left:' + gl + 'px;width:' + gw + 'px"></div>';
    }
    var header = '<div class="flex bg-slate-50 border-b border-slate-200 items-stretch">'
      + '<div class="shrink-0 sticky left-0 bg-slate-50 z-10 px-3 py-1.5 border-r border-slate-200 flex items-center gap-1.5" style="width:' + leftW + 'px">'
      +   '<i class="fa-solid fa-layer-group text-[10px] text-slate-400"></i>'
      +   '<span class="text-[11px] font-extrabold text-slate-600 uppercase tracking-wide truncate">' + _schEsc(f || 'Tanpa Fase') + '</span>'
      +   '<span class="text-[10px] font-bold text-slate-400">(' + gtasks.length + ')</span>'
      +   '<span class="ml-auto text-[10px] font-bold text-slate-400">' + (gdays ? gdays + ' hari · ' : '') + gpct + '%</span>'
      + '</div>'
      + '<div class="relative bg-slate-50" style="width:' + totalPx + 'px;min-height:28px">' + todayLine + spanBar + '</div>'
      + '</div>';
    // Tambah tugas hanya lewat tombol "Tambah Tugas" (fungsi inline dihapus).
    return header + gtasks.map(_schTaskRow).join('');
  }).join('');

  box.innerHTML = '<div class="overflow-x-auto"><div style="min-width:' + (leftW + totalPx) + 'px">'
    + '<div class="flex bg-slate-50 border-b border-slate-200">'
    +   '<div class="shrink-0 sticky left-0 bg-slate-50 z-10 px-3 py-2 text-[11px] font-bold text-slate-500 uppercase border-r border-slate-200" style="width:' + leftW + 'px">Tugas</div>'
    +   '<div class="relative" style="width:' + totalPx + 'px;height:24px">' + ticks + '</div>'
    + '</div>'
    + rows
    + '</div></div>';
}
function _schMonLbl(d){ var m=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return m[d.getMonth()] + ' ' + d.getFullYear(); }

// ── Tambah Cepat / Template (bulk) ──
var _SCH_FASE_WARNA = { 'Hand Over':'indigo', 'Engineering':'emerald', 'Pengadaan':'amber', 'Pengiriman':'sky', 'Kontruksi':'violet', 'Finishing':'rose' };
// off = hari ke- dari tanggal mulai (0 = tanggal mulai); mendukung tugas paralel.
var _SCH_TEMPLATE = [
  { nama:'Hand Over', off:0, durasi:1, fase:'Hand Over' },
  { nama:'Detail Engineering Design', off:1, durasi:2, fase:'Engineering' },
  { nama:'Bill of Material', off:1, durasi:2, fase:'Engineering' },
  { nama:'Pengadaan', off:3, durasi:7, fase:'Pengadaan' },
  { nama:'Pengiriman Material', off:10, durasi:4, fase:'Pengiriman' },
  { nama:'Mobilisasi Tim', off:14, durasi:1, fase:'Kontruksi' },
  { nama:'Pemeriksaan Kelengkapan', off:14, durasi:1, fase:'Kontruksi' },
  { nama:'Pemasangan Mounting', off:14, durasi:2, fase:'Kontruksi' },
  { nama:'Pemasangan Panel Surya', off:15, durasi:3, fase:'Kontruksi' },
  { nama:'Pulling & Wiring Kabel DC', off:18, durasi:2, fase:'Kontruksi' },
  { nama:'Pulling & Wiring Kabel AC', off:18, durasi:2, fase:'Kontruksi' },
  { nama:'Pemasangan Inverter', off:19, durasi:1, fase:'Kontruksi' },
  { nama:'Pemasangan Proteksi PLTS', off:19, durasi:1, fase:'Kontruksi' },
  { nama:'Pemasangan Baterai', off:19, durasi:1, fase:'Kontruksi' },
  { nama:'Pemasangan Proteksi Baterai', off:19, durasi:1, fase:'Kontruksi' },
  { nama:'Pemasangan Sistem Grounding', off:19, durasi:1, fase:'Kontruksi' },
  { nama:'Test & Commissioning', off:20, durasi:1, fase:'Finishing' },
  { nama:'Dokumentasi Pekerjaan', off:20, durasi:1, fase:'Finishing' },
  { nama:'Pembersihan Area Kerja', off:20, durasi:1, fase:'Finishing' },
  { nama:'Edukasi & BAST', off:20, durasi:1, fase:'Finishing' }
];
function _schOpenBulk() {
  if (!_schCanEdit()) return;
  // default tanggal mulai: setelah tugas terakhir bila ada, else hari ini
  var base = _schTodayIso();
  if ((_schTasks || []).length) {
    var maxSel = ''; _schTasks.forEach(function(t){ if (t.selesai && (!maxSel || t.selesai > maxSel)) maxSel = t.selesai; });
    if (maxSel) base = _schShiftIso(maxSel, 1);
  }
  document.getElementById('sch-bulk-mulai').value = base;
  document.getElementById('sch-bulk-seq').checked = true;
  document.getElementById('sch-bulk-text').value = '';
  document.getElementById('sch-modal-bulk').classList.remove('hidden');
}
function _schCloseBulk(){ document.getElementById('sch-modal-bulk').classList.add('hidden'); }
function _schBulkTemplate(){
  // WO Material-only tidak melalui fase Konstruksi & Finishing → tugasnya tidak diisi.
  var materialOnly = !!(_schWO && _schWO.jenisWO === 'Material');
  var _skipFase = { 'Kontruksi': 1, 'Finishing': 1 };
  var tpl = _SCH_TEMPLATE.filter(function(t){ return !(materialOnly && _skipFase[(t.fase || '').trim()]); });
  document.getElementById('sch-bulk-text').value = tpl.map(function(t){ return t.nama + ' | ' + t.durasi + ' | ' + t.fase + ' | ' + t.off; }).join('\n');
  if (materialOnly) showNotification('WO Material saja — tugas fase Konstruksi & Finishing tidak dimasukkan ke template.', 'success');
}
function _schBulkSubmit() {
  var base = document.getElementById('sch-bulk-mulai').value;
  if (!base) return showNotification('Tanggal mulai wajib.', 'error');
  var seq = document.getElementById('sch-bulk-seq').checked;
  var lines = (document.getElementById('sch-bulk-text').value || '').split('\n');
  var urut = (_schTasks || []).length;
  var cursor = base;
  var tasks = [];
  lines.forEach(function(ln) {
    ln = ln.trim(); if (!ln) return;
    var p = ln.split('|').map(function(x){ return x.trim(); });
    var nama = p[0]; if (!nama) return;
    var durasi = Math.max(1, parseInt(p[1], 10) || 1);
    var fase = p[2] || '';
    // Kolom ke-4 opsional = "hari ke-" dari tanggal mulai (untuk tugas paralel/template).
    var hasOff = p[3] !== undefined && p[3] !== '' && !isNaN(parseInt(p[3], 10));
    var mulai;
    if (hasOff) mulai = _schShiftIso(base, Math.max(0, parseInt(p[3], 10)));
    else if (seq) mulai = cursor;
    else mulai = base;
    var selesai = _schShiftIso(mulai, durasi - 1);
    tasks.push({ namaTugas: nama, fase: fase, mulai: mulai, selesai: selesai, warna: _SCH_FASE_WARNA[fase] || 'indigo', progress: 0, urutan: urut++ });
    if (!hasOff && seq) cursor = _schShiftIso(selesai, 1);
  });
  if (!tasks.length) return showNotification('Isi minimal 1 tugas.', 'error');
  _schCloseBulk();
  showNotification('Menambahkan ' + tasks.length + ' tugas...', 'success');
  google.script.run.withSuccessHandler(function(res){ showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success && document.getElementById('sch-detail') && !document.getElementById('sch-detail').classList.contains('hidden')) _schReloadDetail(); })
    .withFailureHandler(function(err){ showNotification((err && err.message) || 'Gagal menambahkan tugas.', 'error'); })
    .saveScheduleTasksBatch({ noWO: _schWO.noWO, oleh: _schUserNama(), tasks: tasks });
}

// ── Tugas CRUD ──
function _schOpenTask(id) {
  if (!_schCanEdit()) return;
  var t = id ? _schTasks.filter(function(x){ return x.id === id; })[0] : null;
  document.getElementById('sch-task-title').innerText = t ? 'Edit Tugas' : 'Tambah Tugas';
  document.getElementById('sch-task-id').value = t ? t.id : '';
  document.getElementById('sch-task-nama').value = t ? t.namaTugas : '';
  document.getElementById('sch-task-fase').value = t ? t.fase : '';
  document.getElementById('sch-task-warna').value = t ? (t.warna || 'indigo') : 'indigo';
  document.getElementById('sch-task-mulai').value = t ? t.mulai : '';
  document.getElementById('sch-task-selesai').value = t ? t.selesai : '';
  document.getElementById('sch-task-progress').value = t ? t.progress : 0;
  document.getElementById('sch-task-urutan').value = t ? t.urutan : (_schTasks.length);
  document.getElementById('sch-task-catatan').value = t ? t.catatan : '';
  document.getElementById('sch-task-del').classList.toggle('hidden', !t);
  document.getElementById('sch-modal-task').classList.remove('hidden');
}
function _schCloseTask(){ document.getElementById('sch-modal-task').classList.add('hidden'); }
function _schSubmitTask() {
  var id = document.getElementById('sch-task-id').value;
  var payload = {
    id: id, noWO: _schWO.noWO,
    namaTugas: document.getElementById('sch-task-nama').value.trim(),
    fase: document.getElementById('sch-task-fase').value.trim(),
    warna: document.getElementById('sch-task-warna').value,
    mulai: document.getElementById('sch-task-mulai').value,
    selesai: document.getElementById('sch-task-selesai').value,
    progress: Number(document.getElementById('sch-task-progress').value) || 0,
    urutan: Number(document.getElementById('sch-task-urutan').value) || 0,
    catatan: document.getElementById('sch-task-catatan').value.trim(),
    oleh: _schUserNama()
  };
  if (!payload.namaTugas) return showNotification('Nama tugas wajib.', 'error');
  if (!payload.mulai || !payload.selesai) return showNotification('Tanggal mulai & selesai wajib.', 'error');
  _schCloseTask();
  // Simpan di background — tanpa loader layar penuh, user bisa lanjut edit/tambah tugas.
  showNotification(id ? 'Menyimpan perubahan tugas...' : 'Menambahkan tugas...', 'success');
  var cb = function(res){ showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success && document.getElementById('sch-detail') && !document.getElementById('sch-detail').classList.contains('hidden')) _schReloadDetail(); };
  var fail = function(err){ showNotification((err && err.message) || 'Gagal menyimpan tugas.', 'error'); };
  if (id) google.script.run.withSuccessHandler(cb).withFailureHandler(fail).updateScheduleTask(payload);
  else google.script.run.withSuccessHandler(cb).withFailureHandler(fail).saveScheduleTask(payload);
}
function _schDeleteTask() {
  var id = document.getElementById('sch-task-id').value;
  if (!id) return;
  _schCloseTask();  // tutup modal tugas dulu agar tidak menutupi modal konfirmasi
  showConfirm({ title: 'Hapus Tugas', message: 'Hapus tugas ini dari schedule?', confirmText: 'Ya, Hapus', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    // Hapus di background — tanpa loader layar penuh.
    showNotification('Menghapus tugas...', 'success');
    google.script.run.withSuccessHandler(function(res){ showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success && document.getElementById('sch-detail') && !document.getElementById('sch-detail').classList.contains('hidden')) _schReloadDetail(); })
      .withFailureHandler(function(err){ showNotification((err && err.message) || 'Gagal menghapus.', 'error'); })
      .hapusScheduleTask(id);
  }});
}

// Hapus tugas langsung dari baris (ikon tempat sampah saat hover), tanpa buka modal.
function _schInlineDelete(id) {
  if (!_schCanEdit()) return;
  var t = (_schTasks || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if (!t) return;
  showConfirm({ title: 'Hapus Tugas', message: 'Hapus tugas "' + (t.namaTugas || '') + '"?', confirmText: 'Ya, Hapus', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    showNotification('Menghapus tugas...', 'success');
    google.script.run.withSuccessHandler(function(res){ showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); if (res && res.success && document.getElementById('sch-detail') && !document.getElementById('sch-detail').classList.contains('hidden')) _schReloadDetail(); })
      .withFailureHandler(function(err){ showNotification((err && err.message) || 'Gagal menghapus.', 'error'); })
      .hapusScheduleTask(id);
  }});
}
</script>
