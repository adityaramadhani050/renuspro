<script>
// ── State Pagination ──────────────────────────────────────────────
// `total` = jumlah baris hasil filter di server (semua tipe kecuali 'template').
// `template` tetap memakai array `data` di memori karena sumbernya sudah
// dimuat penuh saat bootstrap (erpState.templatePaket), bukan per-load.
const _pgState = {
  penawaran:     { page: 1, perPage: 10, total: 0 },
  workorder:     { page: 1, perPage: 10, total: 0 },
  invoice:       { page: 1, perPage: 10, total: 0 },
  kwitansi:      { page: 1, perPage: 10, total: 0 },
  produk:        { page: 1, perPage: 10, total: 0 },
  template:      { page: 1, perPage: 10, data: [] },
  customer:      { page: 1, perPage: 10, total: 0 },
  supplier:      { page: 1, perPage: 10, total: 0 },
  purchaseorder: { page: 1, perPage: 10, total: 0 },
  stok:          { page: 1, perPage: 20, total: 0 },
  mutasi:        { page: 1, perPage: 20, total: 0 },
};

// Diisi oleh masing-masing modul: tipe → fungsi yang mengambil ulang
// halaman saat ini dari server (dipanggil oleh _pgGo / _pgSetPerPage).
const _pgFetchers = {};

// ── Style injeksi sekali ──────────────────────────────────────────
(function() {
  const style = document.createElement('style');
  style.textContent = `
    .pg-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #f1f5f9;
      background: #f8fafc;
      border-radius: 0 0 16px 16px;
    }
    .pg-info {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pg-info strong { color: #334155; font-weight: 700; }
    .pg-nav {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .pg-btn {
      min-width: 30px;
      height: 30px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      background: #fff;
      cursor: pointer;
      transition: all 0.12s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      line-height: 1;
    }
    .pg-btn:hover:not(:disabled):not(.pg-active) {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e40af;
    }
    .pg-btn.pg-active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
      cursor: default;
    }
    .pg-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .pg-ellipsis {
      font-size: 12px;
      color: #94a3b8;
      padding: 0 2px;
      line-height: 30px;
    }
    .pg-perpage {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .pg-perpage span {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .pg-perpage select {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 4px 6px;
      background: #fff;
      cursor: pointer;
      outline: none;
      height: 28px;
    }
    .pg-perpage select:focus {
      border-color: #3b82f6;
    }
    @media (max-width: 640px) {
      .pg-wrap { flex-wrap: wrap; }
      .pg-info { order: 1; width: 100%; }
      .pg-nav  { order: 2; }
      .pg-perpage { order: 3; margin-left: auto; }
    }
  `;
  document.head.appendChild(style);
})();

// ── Render pagination bar ─────────────────────────────────────────
function _pgTotalData(tipe) {
  const state = _pgState[tipe];
  return tipe === 'template' ? state.data.length : (state.total || 0);
}

function _renderPaginationBar(tipe) {
  const state     = _pgState[tipe];
  const totalData = _pgTotalData(tipe);
  const totalPage = Math.max(1, Math.ceil(totalData / state.perPage));
  const curPage   = Math.min(state.page, totalPage);
  state.page      = curPage;

  const bar = document.getElementById('pg-bar-' + tipe);
  if (!bar) return;

  const from  = totalData === 0 ? 0 : (curPage - 1) * state.perPage + 1;
  const to    = Math.min(curPage * state.perPage, totalData);
  const pages = _buildPageNumbers(curPage, totalPage);

  const navBtns = pages.map(p => {
    if (p === '...') return `<span class="pg-ellipsis">…</span>`;
    return `<button onclick="_pgGo('${tipe}',${p})"
      class="pg-btn${p === curPage ? ' pg-active' : ''}"
      ${p === curPage ? 'disabled' : ''}>${p}</button>`;
  }).join('');

  bar.innerHTML = `
    <span class="pg-info">
      <strong>${from}</strong>–<strong>${to}</strong>
      <span style="margin:0 3px">dari</span>
      <strong>${totalData}</strong> data
    </span>

    <div class="pg-nav">
      <button onclick="_pgGo('${tipe}',${curPage - 1})"
        class="pg-btn" ${curPage <= 1 ? 'disabled' : ''}
        title="Halaman sebelumnya">
        <i class="fa-solid fa-chevron-left" style="font-size:10px"></i>
      </button>
      ${navBtns}
      <button onclick="_pgGo('${tipe}',${curPage + 1})"
        class="pg-btn" ${curPage >= totalPage ? 'disabled' : ''}
        title="Halaman berikutnya">
        <i class="fa-solid fa-chevron-right" style="font-size:10px"></i>
      </button>
    </div>

    <div class="pg-perpage">
      <span>Baris:</span>
      <select onchange="_pgSetPerPage('${tipe}',this.value)">
        ${[10, 20, 25, 50, 100].map(n =>
          `<option value="${n}"${n === state.perPage ? ' selected' : ''}>${n}</option>`
        ).join('')}
      </select>
    </div>`;
}

function _buildPageNumbers(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  if (cur <= 4) {
    return [1, 2, 3, 4, 5, '...', total];
  } else if (cur >= total - 3) {
    return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
  } else {
    return [1, '...', cur - 1, cur, cur + 1, '...', total];
  }
}

function _pgGo(tipe, page) {
  const totalPage = Math.max(1, Math.ceil(_pgTotalData(tipe) / _pgState[tipe].perPage));
  if (page < 1 || page > totalPage) return;
  _pgState[tipe].page = page;
  if (tipe === 'template') {
    _pgRender(tipe);
  } else if (_pgFetchers[tipe]) {
    _pgFetchers[tipe]();
  }
  // Scroll ke atas tabel
  const tbl = document.getElementById('table-' + tipe);
  if (tbl) tbl.closest('.overflow-x-auto, .bg-white')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function _pgSetPerPage(tipe, val) {
  _pgState[tipe].perPage = parseInt(val);
  _pgState[tipe].page    = 1;
  if (tipe === 'template') {
    _pgRender(tipe);
  } else if (_pgFetchers[tipe]) {
    _pgFetchers[tipe]();
  }
}

// ── Render halaman saat ini (khusus Template Paket — sumber data in-memory) ──
function _pgRender(tipe) {
  if (tipe !== 'template') return;
  const state  = _pgState[tipe];
  const start  = (state.page - 1) * state.perPage;
  const sliced = state.data.slice(start, start + state.perPage);
  _pgRenderTemplate(sliced);
  _renderPaginationBar(tipe);
}

// ── Inject wrapper bar (sekali saja) ─────────────────────────────
function _injectPgBar(tipe, tbodySelector) {
  const barId = 'pg-bar-' + tipe;
  if (document.getElementById(barId)) return;

  // Cari closest .overflow-x-auto atau .bg-white pembungkus tabel
  const tbody  = document.querySelector(tbodySelector);
  if (!tbody) return;
  const tableWrap = tbody.closest('.overflow-x-auto') || tbody.closest('.bg-white.rounded-2xl');
  if (!tableWrap) return;

  const bar = document.createElement('div');
  bar.id    = barId;
  bar.className = 'pg-wrap';
  tableWrap.insertAdjacentElement('afterend', bar);
}

// ================================================================
// FUNGSI LOADER + RENDER (server-side pagination & filter)
// ================================================================

// ── PENAWARAN ─────────────────────────────────────────────────────
let _penawaranFilters = {};

function _pgFetchPenawaran() {
  if (typeof google === 'undefined') return;
  const state = _pgState.penawaran;
  google.script.run.withSuccessHandler(function(res) {
    const rows = (res && res.rows) || [];
    state.total = (res && res.total) || 0;
    _renderTabelPenawaran(rows);
    _renderPaginationBar('penawaran');

    const infoEl = document.getElementById('filter-result-info');
    const f = _penawaranFilters;
    const adaFilter = f.search || f.sales || f.status || f.bulan || f.tahun;
    if (infoEl) infoEl.innerText = adaFilter ? `Menampilkan ${state.total} penawaran sesuai filter` : '';
  }).getPenawaranList(Object.assign({ page: state.page, perPage: state.perPage }, _penawaranFilters));
}
_pgFetchers.penawaran = _pgFetchPenawaran;

window.filterPenawaran = _debounce(function() {
  _penawaranFilters = {
    search: (document.getElementById('search-penawaran').value || '').trim(),
    sales:  (document.getElementById('filter-sales').value  || '').trim(),
    status: (document.getElementById('filter-status').value || '').trim(),
    bulan:  (document.getElementById('filter-bulan').value  || '').trim(),
    tahun:  (document.getElementById('filter-tahun').value  || '').trim()
  };
  _pgState.penawaran.page = 1;
  _pgFetchPenawaran();
}, 350);

window.resetFilterPenawaran = function() {
  document.getElementById('search-penawaran').value = '';
  document.getElementById('filter-sales').value  = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-bulan').value  = '';
  document.getElementById('filter-tahun').value  = '';
  _penawaranFilters = {};
  _pgState.penawaran.page = 1;
  _pgFetchPenawaran();
  const infoEl = document.getElementById('filter-result-info');
  if (infoEl) infoEl.innerText = '';
};

window.loadPenawaran = function() {
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(opts) {
    _isiDropdownFilterPenawaran(opts);
  }).getPenawaranFilterOptions();

  _penawaranFilters = {};
  _pgState.penawaran.page = 1;
  _injectPgBar('penawaran', '#table-penawaran');
  _pgFetchPenawaran();
};

// ── PRODUK ────────────────────────────────────────────────────────
let _produkFilters = {};

function _pgRenderProduk(data) {
  const tbody = document.getElementById('table-produk');
  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">
      <i class="fas fa-search mr-2"></i>Tidak ada data produk.</td></tr>`;
    return;
  }
  const tipeBadge = { 'Material': 'bg-teal-100 text-teal-700', 'Jasa': 'bg-violet-100 text-violet-700' };
  tbody.innerHTML = data.map(i => {
    const margin = i.harga > 0 ? (((i.harga - i.hpp) / i.harga) * 100).toFixed(1) : 0;
    const mc = margin >= 25 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700';
    const tc = i.tipe ? (tipeBadge[i.tipe] || 'bg-slate-100 text-slate-600') : '';
    const tipeHtml = i.tipe
      ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${tc}">${i.tipe}</span>`
      : `<span class="text-[10px] text-slate-300">—</span>`;
    const stokHtml = i.stokId
      ? `<div class="font-mono text-[10px] text-indigo-600 font-bold">${i.stokId}</div><div class="text-[10px] text-slate-400">${(i.qtyTersedia||0).toLocaleString('id-ID')} ${i.unit}</div>`
      : `<span class="text-[10px] text-slate-300">—</span>`;
    return `<tr class="border-b border-slate-100 hover:bg-slate-50 transition">
      <td class="p-4 font-bold text-slate-600">${i.sku}</td>
      <td class="p-4 font-semibold">${i.nama}</td>
      <td class="p-4 text-slate-500 text-center">${i.unit}</td>
      <td class="p-4 text-center">${tipeHtml}</td>
      <td class="p-4 text-center">${stokHtml}</td>
      <td class="p-4 text-right font-bold text-slate-800">Rp ${i.harga.toLocaleString('id-ID')}</td>
      <td class="p-4 text-right font-medium text-rose-600">Rp ${i.hpp.toLocaleString('id-ID')}</td>
      <td class="p-4 text-right"><span class="text-xs font-extrabold px-2 py-1 rounded-lg ${mc}">${margin}%</span></td>
      <td class="p-4 text-center">
        <div class="flex items-center justify-center gap-2">
          <button onclick='bukaModalEditProduk(${JSON.stringify(i)})' class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
          <button onclick="konfirmasiHapus('produk','${i.sku}','${i.nama}')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function _pgFetchProduk() {
  if (typeof google === 'undefined') return;
  const state = _pgState.produk;
  google.script.run.withSuccessHandler(function(res) {
    const rows = (res && res.rows) || [];
    state.total = (res && res.total) || 0;
    _pgRenderProduk(rows);
    _renderPaginationBar('produk');
  }).getProdukList(Object.assign({ page: state.page, perPage: state.perPage }, _produkFilters));
}
_pgFetchers.produk = _pgFetchProduk;

window.loadProduk = function() {
  resetSearch('produk');
  _produkFilters = {};
  _pgState.produk.page = 1;
  _injectPgBar('produk', '#table-produk');
  _pgFetchProduk();
};

// ── TEMPLATE ──────────────────────────────────────────────────────
// Template Paket sudah dimuat penuh ke memori (erpState.templatePaket) saat
// bootstrap aplikasi — jumlah templatenya kecil, jadi tetap dipaginasi lokal
// tanpa perlu round-trip server tambahan per halaman.
let _cachedTemplateKeys = [];

function _pgRenderTemplate(keys) {
  const tbody = document.getElementById('table-template');
  const tpl   = erpState.templatePaket;
  if (!keys || keys.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada template paket.</td></tr>`;
    return;
  }
  tbody.innerHTML = keys.map(id => {
    const t = tpl[id];
    if (!t) return '';
    const items = t.items || [];
    const estimasi = items.reduce((s, item) => {
      const h = item.harga || ((erpState.produk || []).find(p => p.id === item.produkId) || {}).harga || 0;
      return s + (item.qty || 0) * h;
    }, 0);
    return `<tr class="border-b border-slate-100 hover:bg-slate-50 transition text-sm">
      <td class="p-4 font-bold text-teal-700">${id}</td>
      <td class="p-4 font-semibold text-slate-800">${t.nama}</td>
      <td class="p-4 text-center"><span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded-lg">${items.length} item</span></td>
      <td class="p-4 text-right font-bold text-slate-700">Rp ${estimasi.toLocaleString('id-ID')}</td>
      <td class="p-4 text-center">
        <div class="flex items-center justify-center gap-1">
          <button onclick="lihatDetailTemplate('${id}')" class="text-slate-500 hover:bg-slate-100 p-1.5 rounded-lg transition" title="Lihat Detail"><i class="fa-solid fa-eye text-sm"></i></button>
          <button onclick="bukaModalEditTemplate('${id}')" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square text-sm"></i></button>
          <button onclick="konfirmasiHapus('template','${id}','${t.nama}')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can text-sm"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

window.loadTemplate = function() {
  resetSearch('template');
  const tpl  = erpState.templatePaket;
  const keys = Object.keys(tpl).sort((a, b) => {
    return (parseInt(a.replace(/[^\d]/g,''))||0) - (parseInt(b.replace(/[^\d]/g,''))||0);
  });
  _cachedTemplateKeys    = keys;
  _pgState.template.data = keys;
  _pgState.template.page = 1;
  _injectPgBar('template', '#table-template');
  _pgRender('template');
};

// ── CUSTOMER ──────────────────────────────────────────────────────
let _customerFilters = {};

function _pgRenderCustomer(data) {
  const tbody = document.getElementById('table-customer');
  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">
      <i class="fas fa-search mr-2"></i>Tidak ada data klien.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(i => `
    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
      <td class="p-4 font-bold text-slate-600">${i.id}</td>
      <td class="p-4 font-bold text-slate-800">${i.nama}</td>
      <td class="p-4 text-slate-600">${i.perusahaan}</td>
      <td class="p-4 text-slate-500">${i.alamat}</td>
      <td class="p-4 text-slate-600 font-medium">${i.kontak}</td>
      <td class="p-4 text-center">
        <div class="flex items-center justify-center gap-2">
          <button onclick='bukaModalEditCustomer(${JSON.stringify(i)})' class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
          <button onclick="konfirmasiHapus('customer','${i.id}','${i.nama}')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </td>
    </tr>`).join('');
}

function _pgFetchCustomer() {
  if (typeof google === 'undefined') return;
  const state = _pgState.customer;
  google.script.run.withSuccessHandler(function(res) {
    const rows = (res && res.rows) || [];
    state.total = (res && res.total) || 0;
    _pgRenderCustomer(rows);
    _renderPaginationBar('customer');
  }).getCustomerList(Object.assign({ page: state.page, perPage: state.perPage }, _customerFilters));
}
_pgFetchers.customer = _pgFetchCustomer;

window.loadCustomer = function() {
  resetSearch('customer');
  _customerFilters = {};
  _pgState.customer.page = 1;
  _injectPgBar('customer', '#table-customer');
  _pgFetchCustomer();
};

// ── filterTabel (produk/template/customer/supplier) ───────────────
// Template difilter lokal (instan, tanpa server) — produk/customer/supplier
// memicu fetch ke server sehingga di-debounce agar tidak membanjiri request
// pada setiap ketikan.
const _debouncedFetchProduk    = _debounce(function() { _pgFetchProduk(); }, 350);
const _debouncedFetchCustomer  = _debounce(function() { _pgFetchCustomer(); }, 350);
const _debouncedFetchSupplier  = _debounce(function() { if (_pgFetchers.supplier) _pgFetchers.supplier(); }, 350);

window.filterTabel = function(tipe) {
  if (tipe === 'produk') {
    _produkFilters = { search: document.getElementById('search-produk').value.trim() };
    _pgState.produk.page = 1;
    _debouncedFetchProduk();
    return;
  }
  if (tipe === 'template') {
    const q = document.getElementById('search-template').value.toLowerCase().trim();
    _pgState.template.data = _cachedTemplateKeys.filter(id => {
      const t = erpState.templatePaket[id];
      return (id + (t ? t.nama : '')).toLowerCase().includes(q);
    });
    _pgState.template.page = 1;
    _pgRender('template');
    return;
  }
  if (tipe === 'customer') {
    _customerFilters = { search: document.getElementById('search-customer').value.trim() };
    _pgState.customer.page = 1;
    _debouncedFetchCustomer();
    return;
  }
  if (tipe === 'supplier') {
    _supplierFilters = { search: document.getElementById('search-supplier').value.trim() };
    _pgState.supplier.page = 1;
    _debouncedFetchSupplier();
    return;
  }
};
</script>
