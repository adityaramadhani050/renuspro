<script>
// ── Purchase Order Module ─────────────────────────────────────────────────────

let _cachedPOData   = [];
let _poFormMode     = 'new'; // 'new' | 'edit'
let _poItems        = [];
let _currentPODetail = null;
let _poSupplierProduk = []; // katalog produk supplier terpilih: [{ id, nama, unit, hargaBeli }]

// Muat katalog produk supplier terpilih → dipakai dropdown item PO
function _loadPOSupplierKatalog(idSupplier, cb) {
  idSupplier = (idSupplier || '').toString().trim();
  if (!idSupplier || typeof google === 'undefined') { _poSupplierProduk = []; if (cb) cb(); return; }
  google.script.run
    .withSuccessHandler(function(res) { _poSupplierProduk = (res && res.success) ? (res.list || []) : []; if (cb) cb(); })
    .withFailureHandler(function() { _poSupplierProduk = []; if (cb) cb(); })
    .getProdukBySupplier(idSupplier);
}

// Supplier di form PO berubah → muat katalognya lalu render ulang item
function onPOSupplierChange() {
  var id = (document.getElementById('sel-supplier-po').value || '').trim();
  _loadPOSupplierKatalog(id, function() { renderItemsPO(); });
}

// Pilih produk dari dropdown item PO → auto-isi nama/satuan/harga beli
function onPOItemSelect(idx, sel) {
  if (!_poItems[idx]) return;
  var val = sel.value;
  if (val === '__keep__') return;   // pertahankan item lama (dari PO yg diedit)
  if (!val) { _poItems[idx].produkId = ''; _poItems[idx].namaItem = ''; hitungTotalPO(); return; }
  var opt = sel.options[sel.selectedIndex];
  _poItems[idx].produkId = val;
  _poItems[idx].namaItem = opt.getAttribute('data-nama') || opt.text;
  _poItems[idx].satuan   = opt.getAttribute('data-unit') || '';
  _poItems[idx].hargaBeli = parseFloat(opt.getAttribute('data-harga')) || 0;
  _poItems[idx]._manual  = false;
  renderItemsPO();
  hitungTotalPO();
}

// Label tampilan status PO (nilai tersimpan tetap, hanya teks yang diringkas).
function _poStatusLabel(s) { return s === 'Menunggu Gudang' ? 'Tunggu Gudang' : (s || ''); }

// ── Render daftar PO sebagai kartu (pola QC/BOM) ─────────────────────────────
function _pgRenderPurchaseOrder(data) {
  var box = document.getElementById('po-card-list');
  if (!box) return;
  if (!data || data.length === 0) {
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-inbox mr-2"></i>Belum ada data Purchase Order.</div>';
    return;
  }
  var statusPOClass = {
    'Aktif': 'bg-blue-100 text-blue-700',
    'Menunggu Gudang': 'bg-amber-100 text-amber-700',
    'Menunggu Penerimaan Gudang': 'bg-amber-100 text-amber-700',
    'Diterima Sebagian': 'bg-amber-100 text-amber-700',
    'Diterima': 'bg-teal-100 text-teal-700',
    'Selesai': 'bg-emerald-100 text-emerald-700',
    'Batal': 'bg-rose-100 text-rose-600'
  };
  var statusBayarClass = {
    'Belum Dibayar': 'bg-slate-100 text-slate-600',
    'Dibayar Sebagian': 'bg-amber-100 text-amber-700',
    'Lunas': 'bg-emerald-100 text-emerald-700'
  };
  box.innerHTML = data.map(function(po) {
    var sc = statusPOClass[po.statusPO] || 'bg-slate-100 text-slate-500';
    var bc = statusBayarClass[po.statusBayar] || 'bg-slate-100 text-slate-500';
    var noPOesc = (po.noPO || '').replace(/'/g, "\\'");
    var woLine = po.noWO ? (' · <span class="font-mono text-teal-700">' + _escHtml(po.noWO) + '</span>' + (po.namaProject ? ' ' + _escHtml(po.namaProject) : '')) : '';
    return '<div onclick="bukaPODetail(\'' + noPOesc + '\')" class="bg-white rounded-2xl border border-slate-150 hover:border-orange-300 hover:shadow-md transition p-4 sm:p-5 cursor-pointer">' +
      '<div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">' +
        // Kolom 1: No PO / tanggal
        '<div class="sm:w-52 shrink-0">' +
          '<div class="font-mono font-extrabold text-slate-700">' + _escHtml(po.noPO || '') + '</div>' +
          '<p class="text-[10px] text-slate-400 mt-0.5">' + _escHtml(po.tanggal || '') + '</p>' +
        '</div>' +
        // Kolom 2: Nama order / supplier + badge status sebaris dgn nama order
        '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 flex-wrap">' +
            '<p class="font-bold text-slate-800 truncate">' + (_escHtml(po.peruntukan) || _escHtml(po.namaSupplier || po.idSupplier || '—')) + '</p>' +
            '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + sc + '">' + _poStatusLabel(po.statusPO) + '</span>' +
            '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + bc + '">' + (po.statusBayar || '—') + '</span>' +
          '</div>' +
          '<p class="text-[11px] text-slate-400 truncate mt-0.5">' + _escHtml(po.namaSupplier || po.idSupplier || '') + woLine + '</p>' +
        '</div>' +
        // Kanan: nilai order + tombol PDF
        '<div class="flex items-center justify-between sm:justify-end gap-3 shrink-0">' +
          '<div class="text-left sm:text-right whitespace-nowrap">' +
            '<p class="font-extrabold text-slate-800">Rp ' + ((po.nilaiDPP || 0).toLocaleString('id-ID')) + '</p>' +
            ((po.ppnPersen > 0) ? '<p class="text-[10px] text-slate-400">Incl. PPN Rp ' + ((po.grandTotal || 0).toLocaleString('id-ID')) + '</p>' : '') +
          '</div>' +
          '<button onclick="event.stopPropagation();exportPOPDF(\'' + noPOesc + '\')" class="text-rose-500 hover:bg-rose-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Export PDF"><i class="fa-solid fa-file-pdf text-sm"></i></button>' +
          '<i class="fa-solid fa-chevron-right text-slate-300"></i>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Load daftar PO ──────────────────────────────────────────────────────────
window.loadPurchaseOrder = function(fromNav) {
  var render = function(data) {
    _cachedPOData = (data || []).slice().reverse();
    filterPO();   // render kartu + KPI sesuai filter/pencarian aktif
  };
  var c = fromNav ? navCacheGet('purchaseorder') : null;
  if (c) { render(c); return; }
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(data) { navCacheSet('purchaseorder', data); render(data); })
    .withFailureHandler(function() {
      var b = document.getElementById('po-card-list');
      if (b) b.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-6 text-center text-rose-400">Gagal memuat data PO.</div>';
    })
    .getPOList();
};

// ── Filter PO ───────────────────────────────────────────────────────────────
window.filterPO = function() {
  var q      = (document.getElementById('search-po').value || '').toLowerCase().trim();
  var status = (document.getElementById('filter-po-status').value || '').trim();
  var filtered = _cachedPOData.filter(function(po) {
    if (q) {
      var hay = ((po.noPO || '') + (po.namaSupplier || '') + (po.noWO || '') + (po.peruntukan || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (status && po.statusPO !== status) return false;
    return true;
  });
  _pgRenderPurchaseOrder(filtered);
  _renderPOKPI(filtered);
};

// ── KPI Cards ──────────────────────────────────────────────────────────────
function _renderPOKPI(list) {
  list = list || [];
  var totalNilai    = 0;
  var outstanding   = 0;
  var jumlahAktif   = 0;
  var penerimaanCount = 0;
  var penerimaanTotal = 0;

  list.forEach(function(po) {
    var statusPO    = po.statusPO    || '';
    var statusBayar = po.statusBayar || '';
    var grandTotal  = po.grandTotal  || 0;
    var totalDibayar = po.totalDibayar || 0;

    if (statusPO !== 'Batal') totalNilai += grandTotal;
    if (statusBayar === 'Belum Dibayar' || statusBayar === 'Dibayar Sebagian') {
      outstanding += Math.max(0, grandTotal - totalDibayar);
    }
    if (statusPO !== 'Selesai' && statusPO !== 'Batal') jumlahAktif++;
    if (statusPO === 'Menunggu Gudang' || statusPO === 'Menunggu Penerimaan Gudang' || statusPO === 'Diterima Sebagian') {
      penerimaanCount++;
      penerimaanTotal += grandTotal;
    }
  });

  document.getElementById('kpi-po-total').textContent             = 'Rp ' + totalNilai.toLocaleString('id-ID');
  document.getElementById('kpi-po-outstanding').textContent       = 'Rp ' + outstanding.toLocaleString('id-ID');
  document.getElementById('kpi-po-aktif').textContent              = jumlahAktif;
  document.getElementById('kpi-po-penerimaan-count').textContent  = penerimaanCount;
  document.getElementById('kpi-po-penerimaan-total').textContent  = 'Rp ' + penerimaanTotal.toLocaleString('id-ID');
}

// ── Form Buat/Edit PO ────────────────────────────────────────────────────────
function bukaFormPO() {
  _poFormMode = 'new';
  _poItems    = [];
  _poSupplierProduk = [];
  document.getElementById('form-po-title').innerText = 'Buat Purchase Order Baru';
  document.getElementById('po-no-field').value       = 'Auto-generate...';
  document.getElementById('po-edit-nopo') && (document.getElementById('po-edit-nopo').value = '');
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('po-tanggal').value   = today;
  document.getElementById('po-peruntukan').value = '';
  document.getElementById('po-ppn-persen').value = '11';
  if (document.getElementById('po-diskon-persen'))  document.getElementById('po-diskon-persen').value  = '0';
  if (document.getElementById('po-diskon-nominal')) document.getElementById('po-diskon-nominal').value = '';
  document.getElementById('po-catatan').value    = '';
  if (document.getElementById('po-quot-no'))      document.getElementById('po-quot-no').value      = '';
  if (document.getElementById('po-quot-tanggal')) document.getElementById('po-quot-tanggal').value = '';
  _resetPOQuotFileField();
  renderItemsPO();
  hitungTotalPO();

  document.getElementById('form-po-section').classList.remove('hidden');

  // Populate dropdowns dengan loading overlay
  var _poLoadPending = 3;
  var _poLoadingEl = document.getElementById('po-form-loading');
  if (_poLoadingEl) _poLoadingEl.classList.remove('hidden');
  function _poLoadDone() { if (--_poLoadPending <= 0 && _poLoadingEl) _poLoadingEl.classList.add('hidden'); }
  _loadSupplierOptions('sel-supplier-po', '', _poLoadDone);
  _loadWOOptions('sel-wo-po', '', _poLoadDone);
  _loadPOTCDropdowns({}, _poLoadDone);
  document.getElementById('panel-po-detail').classList.add('hidden');
  document.getElementById('po-list-section').classList.add('hidden');
}

// Buka form PO baru dengan data ter-prefill (dipakai "Buat PO" dari daftar belanja BOM).
// prefill = { idSupplier, peruntukan, noWO, items:[{ produkId, namaItem, qty, satuan, hargaBeli, catatan }] }
function bukaFormPOPrefill(prefill) {
  prefill = prefill || {};
  _poFormMode = 'new';
  _poItems    = [];
  _poSupplierProduk = [];
  document.getElementById('form-po-title').innerText = 'Buat Purchase Order Baru';
  document.getElementById('po-no-field').value       = 'Auto-generate...';
  if (document.getElementById('po-edit-nopo')) document.getElementById('po-edit-nopo').value = '';
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('po-tanggal').value    = today;
  document.getElementById('po-peruntukan').value = prefill.peruntukan || '';
  document.getElementById('po-ppn-persen').value = '11';
  if (document.getElementById('po-diskon-persen'))  document.getElementById('po-diskon-persen').value  = '0';
  if (document.getElementById('po-diskon-nominal')) document.getElementById('po-diskon-nominal').value = '';
  document.getElementById('po-catatan').value    = '';
  if (document.getElementById('po-quot-no'))      document.getElementById('po-quot-no').value      = '';
  if (document.getElementById('po-quot-tanggal')) document.getElementById('po-quot-tanggal').value = '';
  _resetPOQuotFileField();
  renderItemsPO();
  hitungTotalPO();

  document.getElementById('form-po-section').classList.remove('hidden');
  document.getElementById('panel-po-detail').classList.add('hidden');
  document.getElementById('po-list-section').classList.add('hidden');

  var _poLoadingEl = document.getElementById('po-form-loading');
  if (_poLoadingEl) _poLoadingEl.classList.remove('hidden');
  var pending = 3;
  function done() { if (--pending <= 0 && _poLoadingEl) _poLoadingEl.classList.add('hidden'); }

  // Supplier ter-preselect → muat katalog supplier → isi item dari prefill.
  _loadSupplierOptions('sel-supplier-po', prefill.idSupplier || '', function() {
    _loadPOSupplierKatalog(prefill.idSupplier || '', function() {
      _poItems = (prefill.items || []).map(function(it) {
        return { namaItem: it.namaItem || '', qty: it.qty || 1, satuan: it.satuan || '', hargaBeli: it.hargaBeli || 0, catatan: it.catatan || '', produkId: it.produkId || '' };
      });
      if (!_poItems.length) _poItems = [{ namaItem: '', qty: 1, satuan: '', hargaBeli: 0, catatan: '', produkId: '' }];
      renderItemsPO();
      hitungTotalPO();
      done();
    });
  });
  _loadWOOptions('sel-wo-po', prefill.noWO || '', done);
  _loadPOTCDropdowns({}, done);
}

// ── Dropzone file-upload field (dipakai oleh File Penawaran Supplier & Invoice Supplier) ──
function _renderFileFieldState(prefix, state, data, accent) {
  accent = accent || 'orange';
  var dropEl   = document.getElementById(prefix + '-drop');
  var statusEl = document.getElementById(prefix + '-status');
  if (!dropEl || !statusEl) return;

  if (state === 'empty' || state === 'error') {
    dropEl.classList.remove('hidden');
    statusEl.classList.add('hidden');
    statusEl.innerHTML = '';
    return;
  }

  dropEl.classList.add('hidden');
  statusEl.classList.remove('hidden');

  if (state === 'uploading') {
    statusEl.innerHTML =
      '<div class="flex items-center gap-3 px-4 py-3.5 border border-slate-200 rounded-xl bg-slate-50">' +
        '<div class="w-10 h-10 rounded-full bg-' + accent + '-100 text-' + accent + '-500 flex items-center justify-center flex-shrink-0">' +
          '<i class="fa-solid fa-spinner fa-spin"></i>' +
        '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<p class="text-sm font-semibold text-slate-600 truncate">' + _escHtml(data.fileName || '') + '</p>' +
          '<p class="text-xs text-slate-400">Mengunggah...</p>' +
        '</div>' +
      '</div>';
  } else if (state === 'success') {
    statusEl.innerHTML =
      '<div class="flex items-center gap-3 px-4 py-3.5 border border-' + accent + '-200 rounded-xl bg-' + accent + '-50/60">' +
        '<div class="w-10 h-10 rounded-full bg-' + accent + '-100 text-' + accent + '-600 flex items-center justify-center flex-shrink-0">' +
          '<i class="fa-solid fa-file-circle-check"></i>' +
        '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<p class="text-sm font-semibold text-slate-700 truncate">' + _escHtml(data.fileName || '') + '</p>' +
          '<a href="' + _escHtml(data.fileUrl || '#') + '" target="_blank" class="text-xs text-' + accent + '-600 hover:underline font-medium">Lihat file</a>' +
        '</div>' +
        '<button type="button" onclick="_removeFileField(\'' + prefix + '\')" ' +
          'class="w-7 h-7 rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 flex items-center justify-center transition-colors flex-shrink-0" title="Hapus file">' +
          '<i class="fa-solid fa-xmark"></i>' +
        '</button>' +
      '</div>';
  }
}

function _removeFileField(prefix) {
  if (document.getElementById(prefix))           document.getElementById(prefix).value           = '';
  if (document.getElementById(prefix + '-id'))    document.getElementById(prefix + '-id').value    = '';
  if (document.getElementById(prefix + '-url'))   document.getElementById(prefix + '-url').value   = '';
  if (document.getElementById(prefix + '-name'))  document.getElementById(prefix + '-name').value  = '';
  _renderFileFieldState(prefix, 'empty');
}

function _uploadSupplierFile(prefix, input, serverFnName, accent) {
  var file = input.files && input.files[0];
  if (!file) return;

  var maxSize = 10 * 1024 * 1024; // 10MB
  if (file.size > maxSize) {
    showNotification('Ukuran file maksimal 10MB.', 'error');
    input.value = '';
    return;
  }

  _renderFileFieldState(prefix, 'uploading', { fileName: file.name }, accent);

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64Data = e.target.result.split(',')[1];
    if (typeof google === 'undefined') return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          document.getElementById(prefix + '-id').value   = res.fileId;
          document.getElementById(prefix + '-url').value  = res.fileUrl;
          document.getElementById(prefix + '-name').value = res.fileName;
          _renderFileFieldState(prefix, 'success', res, accent);
        } else {
          showNotification((res && res.message) || 'Gagal mengunggah file.', 'error');
          input.value = '';
          _renderFileFieldState(prefix, 'error');
        }
      })
      .withFailureHandler(function(err) {
        showNotification(err.message || 'Gagal mengunggah file.', 'error');
        input.value = '';
        _renderFileFieldState(prefix, 'error');
      })
      [serverFnName]({
        base64Data: base64Data,
        fileName:   file.name,
        mimeType:   file.type
      });
  };
  reader.readAsDataURL(file);
}

function _resetPOQuotFileField() { _removeFileField('po-quot-file'); }
function handlePOQuotFileChange(input) { _uploadSupplierFile('po-quot-file', input, 'uploadFilePOQuotationSupplier', 'orange'); }

function _resetPOInvoiceFileField() { _removeFileField('po-invoice-file'); }
function handlePOInvoiceFileChange(input) { _uploadSupplierFile('po-invoice-file', input, 'uploadFileInvoiceSupplierPO', 'violet'); }

function _resetTerimaLangsungBuktiFileField() { _removeFileField('terima-langsung-bukti-file'); }
function handleTerimaLangsungBuktiFileChange(input) { _uploadSupplierFile('terima-langsung-bukti-file', input, 'uploadFileBuktiPenerimaanPO', 'amber'); }

function tutupFormPO() {
  document.getElementById('form-po-section').classList.add('hidden');
  document.getElementById('po-list-section').classList.remove('hidden');
}

// ── Items PO ─────────────────────────────────────────────────────────────────
function tambahItemPO() {
  _poItems.push({ namaItem: '', qty: 1, satuan: '', hargaBeli: 0, catatan: '', produkId: '' });
  renderItemsPO();
}

function hapusItemPO(idx) {
  _poItems.splice(idx, 1);
  renderItemsPO();
  hitungTotalPO();
}

// Format angka ribuan → "1.234.567"
function _fmtRp(n) { return (n || 0).toLocaleString('id-ID'); }
// Parse string berformat ribuan → angka
function _parseRp(s) { return parseFloat((s || '').replace(/\./g,'').replace(',','.')) || 0; }

function renderItemsPO() {
  var tbody = document.getElementById('po-items-body');
  if (!_poItems.length) {
    tbody.innerHTML = '<tr id="po-items-empty"><td colspan="6" class="px-4 py-6 text-center text-slate-400 text-sm italic">Klik "Tambah Item" untuk menambahkan item pembelian.</td></tr>';
    return;
  }
  var supplierAda = _poSupplierProduk.length > 0;
  var selSupplierId = (document.getElementById('sel-supplier-po') || {}).value || '';
  tbody.innerHTML = _poItems.map(function(item, idx) {
    var total = (parseFloat(item.qty) || 0) * (parseFloat(item.hargaBeli) || 0);
    var hargaDisplay = item.hargaBeli ? _fmtRp(item.hargaBeli) : '';
    // Nama Item: WAJIB dipilih dari katalog pricelist supplier (tanpa input manual).
    var namaCell;
    if (!selSupplierId) {
      namaCell = '<td class="px-2 py-1.5">'
        + (item.namaItem ? '<div class="text-sm text-slate-700 font-medium">' + _escHtml(item.namaItem) + '</div>' : '')
        + '<div class="text-[11px] text-amber-600 mt-0.5">Pilih supplier dulu untuk memilih item dari pricelist.</div></td>';
    } else if (!supplierAda) {
      namaCell = '<td class="px-2 py-1.5">'
        + (item.namaItem ? '<div class="text-sm text-slate-700 font-medium">' + _escHtml(item.namaItem) + '</div>' : '')
        + '<div class="text-[11px] text-amber-600 mt-0.5">Supplier ini belum punya item pricelist. Tambahkan dulu di menu <b>Pricelist Supplier</b>.</div></td>';
    } else {
      var opts = '<option value="">— Pilih item —</option>';
      var matched = false;
      _poSupplierProduk.forEach(function(p) {
        var selAttr = (item.produkId && item.produkId === p.id) ? ' selected' : '';
        if (selAttr) matched = true;
        opts += '<option value="' + p.id + '" data-nama="' + _escHtml(p.nama) + '" data-unit="' + _escHtml(p.unit || '') + '" data-harga="' + (p.hargaBeli || 0) + '"' + selAttr + '>' + _escHtml(p.nama) + '</option>';
      });
      // Item lama (dari PO yg diedit) yg tak ada di katalog supplier ini → tetap
      // ditampilkan sbg opsi terpilih agar tak hilang; pilih ulang utk mengganti.
      if (!matched && item.namaItem) {
        opts += '<option value="__keep__" selected>' + _escHtml(item.namaItem) + ' (item lama)</option>';
      }
      namaCell = '<td class="px-2 py-1.5"><select onchange="onPOItemSelect(' + idx + ',this)" class="w-full px-2 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-orange-400 bg-white">' + opts + '</select></td>';
    }
    return '<tr class="border-b border-slate-100">' +
      namaCell +
      '<td class="px-2 py-1.5"><input type="number" value="' + (item.qty || 1) + '" min="0" step="any" oninput="_poItemChange(' + idx + ',\'qty\',this.value);hitungTotalPO()" class="w-20 px-2 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-orange-400 bg-white text-center"></td>' +
      '<td class="px-2 py-1.5"><input type="text" value="' + _escHtml(item.satuan) + '" oninput="_poItemChange(' + idx + ',\'satuan\',this.value)" placeholder="pcs" class="w-20 px-2 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-orange-400 bg-white text-center"></td>' +
      '<td class="px-2 py-1.5"><input type="text" inputmode="numeric" value="' + hargaDisplay + '" oninput="_onHargaPoInput(this,' + idx + ')" placeholder="0" class="w-full px-2 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-orange-400 bg-white text-right font-medium"></td>' +
      '<td class="px-2 py-1.5 text-right font-semibold text-slate-700 text-sm whitespace-nowrap">Rp ' + _fmtRp(total) + '</td>' +
      '<td class="px-2 py-1.5 text-center"><button onclick="hapusItemPO(' + idx + ')" class="text-rose-400 hover:text-rose-600 p-1 rounded transition"><i class="fa-solid fa-trash-can text-xs"></i></button></td>' +
    '</tr>';
  }).join('');
}

function _onHargaPoInput(el, idx) {
  var raw = _parseRp(el.value);
  _poItems[idx].hargaBeli = raw;
  var pos = el.selectionStart;
  var oldLen = el.value.length;
  el.value = raw > 0 ? _fmtRp(raw) : '';
  var newLen = el.value.length;
  el.selectionStart = el.selectionEnd = pos + (newLen - oldLen);
  hitungTotalPO();
}

function _poItemChange(idx, field, val) {
  if (!_poItems[idx]) return;
  _poItems[idx][field] = field === 'qty' || field === 'hargaBeli' ? (parseFloat(val) || 0) : val;
}

function hitungTotalPO() {
  var subtotal = _poItems.reduce(function(s, item) {
    return s + (parseFloat(item.qty) || 0) * (parseFloat(item.hargaBeli) || 0);
  }, 0);

  var diskonPct = parseFloat((document.getElementById('po-diskon-persen') || {}).value) || 0;
  var diskonNomEl = document.getElementById('po-diskon-nominal');
  var diskonNom = diskonNomEl && diskonNomEl.value ? _parseRp(diskonNomEl.value) : Math.round(subtotal * diskonPct / 100);
  if (diskonNom > subtotal) diskonNom = subtotal;
  var setelahDiskon = subtotal - diskonNom;

  var ppnPct  = parseFloat((document.getElementById('po-ppn-persen') || {}).value) || 0;
  var ppn     = Math.round(setelahDiskon * ppnPct / 100);
  var grand   = setelahDiskon + ppn;

  if (document.getElementById('po-subtotal'))    document.getElementById('po-subtotal').innerText    = _fmtRp(subtotal);
  if (document.getElementById('po-ppn-display')) document.getElementById('po-ppn-display').innerText = _fmtRp(ppn);
  if (document.getElementById('po-grandtotal'))  document.getElementById('po-grandtotal').innerText  = _fmtRp(grand);
  var rows = document.querySelectorAll('#po-items-body tr');
  _poItems.forEach(function(item, idx) {
    if (rows[idx]) {
      var totalEl = rows[idx].querySelector('td:nth-child(5)');
      if (totalEl) totalEl.innerText = 'Rp ' + _fmtRp((parseFloat(item.qty)||0) * (parseFloat(item.hargaBeli)||0));
    }
  });
}

function _onDiskonNominalInput(el) {
  var subtotal = _poItems.reduce(function(s, item) {
    return s + (parseFloat(item.qty) || 0) * (parseFloat(item.hargaBeli) || 0);
  }, 0);
  var raw = _parseRp(el.value);
  var pct = subtotal > 0 ? Math.round(raw / subtotal * 10000) / 100 : 0;
  var diskonPctEl = document.getElementById('po-diskon-persen');
  if (diskonPctEl) diskonPctEl.value = pct;
  var pos = el.selectionStart, oldLen = el.value.length;
  el.value = raw > 0 ? _fmtRp(raw) : '';
  var newLen = el.value.length;
  try { el.selectionStart = el.selectionEnd = pos + (newLen - oldLen); } catch(e){}
  hitungTotalPO();
}

// ── Submit PO ────────────────────────────────────────────────────────────────
function submitPO() {
  var idSupplier = (document.getElementById('sel-supplier-po').value || '').trim();
  if (!idSupplier) return showNotification('Pilih supplier terlebih dahulu.', 'error');
  if (!_poItems.length) return showNotification('Tambahkan minimal 1 item pembelian.', 'error');
  for (var i = 0; i < _poItems.length; i++) {
    if (!_poItems[i].namaItem) return showNotification('Nama item baris ' + (i+1) + ' tidak boleh kosong.', 'error');
  }

  var sel = document.getElementById('sel-supplier-po');
  var _optSup = sel.options[sel.selectedIndex];
  var namaSupplier = _optSup ? (_optSup.getAttribute('data-nama') || _optSup.text) : idSupplier;

  var payload = {
    tanggal:      document.getElementById('po-tanggal').value,
    idSupplier:   idSupplier,
    namaSupplier: namaSupplier,
    peruntukan:   document.getElementById('po-peruntukan').value.trim(),
    noWO:         document.getElementById('sel-wo-po').value,
    ppnPersen:    parseFloat(document.getElementById('po-ppn-persen').value) || 0,
    diskonPersen: parseFloat((document.getElementById('po-diskon-persen') || {}).value) || 0,
    diskonNominal: _parseRp((document.getElementById('po-diskon-nominal') || {}).value || ''),
    catatan:      document.getElementById('po-catatan').value.trim(),
    quotNo:       (document.getElementById('po-quot-no') || {}).value || '',
    quotTanggal:  (document.getElementById('po-quot-tanggal') || {}).value || '',
    quotFileId:   (document.getElementById('po-quot-file-id')   || {}).value || '',
    quotFileUrl:  (document.getElementById('po-quot-file-url')  || {}).value || '',
    quotFileName: (document.getElementById('po-quot-file-name') || {}).value || '',
    termConditions: (function() {
      var tc = {};
      document.querySelectorAll('[id^="po-tc-"]').forEach(function(el) {
        tc[el.id.replace('po-tc-', '')] = el.value;
      });
      return JSON.stringify(tc);
    })(),
    items:        _poItems.map(function(it) {
      return { namaItem: it.namaItem, qty: it.qty || 0, satuan: it.satuan, hargaBeli: it.hargaBeli || 0, catatan: it.catatan || '', produkId: it.produkId || '' };
    }),
    dibuatOleh: _currentUser ? _currentUser.nama : ''
  };

  if (_poFormMode === 'edit') {
    var noPOEdit = document.getElementById('po-edit-nopo') ? document.getElementById('po-edit-nopo').value : '';
    payload.noPO      = noPOEdit;
    payload.diubahOleh = payload.dibuatOleh;
  }

  toggleLoader(true, _poFormMode === 'edit' ? 'Menyimpan perubahan PO...' : 'Menyimpan PO...');
  if (typeof google === 'undefined') { toggleLoader(false); return; }

  var fn = _poFormMode === 'edit' ? 'editPO' : 'simpanPO';
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message);
        tutupFormPO();
        loadPurchaseOrder();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification(err.message || 'Gagal menyimpan PO.', 'error');
    })
    [fn](payload);
}

// ── Detail PO ────────────────────────────────────────────────────────────────
function bukaPODetail(noPO) {

function _renderPODetail(po, items, paymentRequests, riwayatPenerimaan) {

    'Menunggu Gudang': 'bg-amber-100 text-amber-700',
    'Menunggu Penerimaan Gudang': 'bg-amber-100 text-amber-700',
    'Diterima Sebagian': 'bg-amber-100 text-amber-700',
    'Diterima': 'bg-teal-100 text-teal-700',
    'Selesai': 'bg-emerald-100 text-emerald-700',
    'Batal': 'bg-rose-100 text-rose-600'
  };
  var statusBayarClass = {
    'Belum Dibayar': 'bg-slate-100 text-slate-600',
    'Dibayar Sebagian': 'bg-amber-100 text-amber-700',
    'Lunas': 'bg-emerald-100 text-emerald-700'
  };

  document.getElementById('po-detail-nopo').innerText         = po.noPO || '';
  var badge = document.getElementById('po-detail-status-badge');
  badge.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full ' + (statusPOClass[po.statusPO] || 'bg-slate-100 text-slate-600');
  badge.innerText = _poStatusLabel(po.statusPO);

  document.getElementById('po-detail-subtitle').innerText    = 'Dibuat oleh ' + (po.dibuatOleh || '—') + ' pada ' + (po.dibuatPada || '—');
  document.getElementById('po-detail-tanggal').innerText     = po.tanggal || '—';
  document.getElementById('po-detail-supplier').innerText    = po.namaSupplier || po.idSupplier || '—';
  document.getElementById('po-detail-wo').innerText          = po.noWO || '—';
  document.getElementById('po-detail-peruntukan').innerText  = po.peruntukan || '—';

  var bayarBadge = document.getElementById('po-detail-status-bayar-badge');
  bayarBadge.className = 'font-bold text-xs px-2 py-0.5 rounded-full ' + (statusBayarClass[po.statusBayar] || 'bg-slate-100 text-slate-600');
  bayarBadge.innerText = po.statusBayar || '—';

  document.getElementById('po-detail-total-dibayar').innerText = 'Rp ' + ((po.totalDibayar || 0).toLocaleString('id-ID'));

  var quotFileWrap = document.getElementById('po-detail-quotfile-wrap');
  if (quotFileWrap) {
    if (po.quotFileUrl) {
      quotFileWrap.classList.remove('hidden');
      document.getElementById('po-detail-quotfile-name').innerText = po.quotFileName || 'File Penawaran';
      document.getElementById('po-detail-quotfile-link').href      = po.quotFileUrl;
    } else {
      quotFileWrap.classList.add('hidden');
    }
  }

  var isTerminal   = po.statusPO === 'Selesai' || po.statusPO === 'Batal';
  var isAktif      = po.statusPO === 'Aktif';
  var bisaTerima   = po.statusPO === 'Aktif' || po.statusPO === 'Diterima Sebagian';
  var isDiterima   = po.statusPO === 'Diterima';
  var isLunas      = po.statusBayar === 'Lunas';

  var btnEdit        = document.getElementById('po-detail-btn-edit');
  var btnTerima      = document.getElementById('po-detail-btn-terima');
  var badgeGudang    = document.getElementById('po-detail-badge-gudang');
  var btnRequestBayar= document.getElementById('po-detail-btn-request-bayar');
  var btnSelesai     = document.getElementById('po-detail-btn-selesai');
  var btnBatal       = document.getElementById('po-detail-btn-batal');

  if (btnEdit)         btnEdit.classList.toggle('hidden', !isAktif);
  if (btnTerima)       btnTerima.classList.toggle('hidden', !bisaTerima);
  if (badgeGudang)     badgeGudang.classList.add('hidden');
  if (btnRequestBayar) btnRequestBayar.classList.toggle('hidden', isTerminal || isLunas);
  if (btnSelesai)      btnSelesai.classList.toggle('hidden', !(isDiterima && isLunas));
  if (btnBatal)        btnBatal.classList.toggle('hidden', isTerminal);

  // Items
  var tbody = document.getElementById('po-detail-items');
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="p-5 text-center text-slate-400 italic text-sm">Tidak ada item.</td></tr>';
  } else {
    tbody.innerHTML = items.map(function(it, idx) {
      var diterimaClass = it.qtyDiterima >= it.qty ? 'text-teal-600 font-bold' : (it.qtyDiterima > 0 ? 'text-amber-600 font-bold' : 'text-slate-400');
      return '<tr class="border-b border-slate-100">' +
        '<td class="px-3 py-2 text-center text-slate-400 text-xs">' + (idx + 1) + '</td>' +
        '<td class="px-3 py-2 font-medium text-slate-800">' + _escHtml(it.namaItem || '') + '</td>' +
        '<td class="px-3 py-2 text-center">' + (it.qty || 0) + '</td>' +
        '<td class="px-3 py-2 text-center ' + diterimaClass + '">' + (it.qtyDiterima || 0) + '</td>' +
        '<td class="px-3 py-2 text-center text-slate-500">' + _escHtml(it.satuan || '') + '</td>' +
        '<td class="px-3 py-2 text-right text-slate-700">Rp ' + ((it.hargaBeli || 0).toLocaleString('id-ID')) + '</td>' +
        '<td class="px-3 py-2 text-right font-bold text-slate-800">Rp ' + ((it.total || 0).toLocaleString('id-ID')) + '</td>' +
      '</tr>';
    }).join('');
  }

  // Summary
  var ppnPct = po.ppnPersen || 0;
  if (document.getElementById('po-detail-ppn-label'))    document.getElementById('po-detail-ppn-label').innerText    = ppnPct;
  if (document.getElementById('po-detail-subtotal'))     document.getElementById('po-detail-subtotal').innerText     = (po.subtotal || 0).toLocaleString('id-ID');
  if (document.getElementById('po-detail-ppn-nominal'))  document.getElementById('po-detail-ppn-nominal').innerText  = (po.ppnNominal || 0).toLocaleString('id-ID');
  if (document.getElementById('po-detail-grandtotal'))   document.getElementById('po-detail-grandtotal').innerText   = (po.grandTotal || 0).toLocaleString('id-ID');
  var diskonRow = document.getElementById('po-detail-diskon-row');
  if (diskonRow) {
    var hasDiskon = (po.diskonNominal || 0) > 0;
    diskonRow.classList.toggle('hidden', !hasDiskon);
    if (document.getElementById('po-detail-diskon-persen'))  document.getElementById('po-detail-diskon-persen').innerText  = po.diskonPersen || 0;
    if (document.getElementById('po-detail-diskon-nominal')) document.getElementById('po-detail-diskon-nominal').innerText = (po.diskonNominal || 0).toLocaleString('id-ID');
  }

  _renderPayReqs(paymentRequests);
  _renderRiwayatPenerimaan(riwayatPenerimaan);
}

function _renderRiwayatPenerimaan(list) {
  var tbody = document.getElementById('po-detail-penerimaan');
  if (!tbody) return;
  if (!list || !list.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400 italic text-xs">Belum ada penerimaan barang.</td></tr>';
    return;
  }
  var modeClass = {
    'Langsung': 'bg-blue-100 text-blue-700',
    'Gudang':   'bg-amber-100 text-amber-700'
  };
  tbody.innerHTML = list.map(function(r) {
    var mc = modeClass[r.mode] || 'bg-slate-100 text-slate-600';
    var itemList = (r.items || []).map(function(it) {
      return _escHtml(it.namaItem || '') + ' (' + (it.qty || 0) + (it.satuan ? ' ' + _escHtml(it.satuan) : '') + ')';
    }).join('<br>');
    var catatanList = (r.items || []).map(function(it) {
      return (it.catatan || '').toString().trim();
    }).filter(function(c) { return c; }).join('<br>');
    var buktiHtml = r.buktiFileUrl
      ? '<a href="' + _escHtml(r.buktiFileUrl) + '" target="_blank" class="inline-flex items-center gap-1 text-teal-600 hover:text-teal-700 font-semibold" title="Lihat bukti barang diterima"><i class="fa-solid fa-image"></i> Lihat</a>'
      : '<span class="text-slate-300">—</span>';
    return '<tr class="border-b border-slate-100">' +
      '<td class="px-3 py-2 text-xs text-slate-600 whitespace-nowrap">' + _escHtml(r.tanggal || '') + '</td>' +
      '<td class="px-3 py-2 text-center"><span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ' + mc + '">' + _escHtml(r.mode || '') + '</span></td>' +
      '<td class="px-3 py-2 text-xs text-slate-600">' + (itemList || '—') + '</td>' +
      '<td class="px-3 py-2 text-xs text-rose-600">' + (catatanList || '<span class="text-slate-400">—</span>') + '</td>' +
      '<td class="px-3 py-2 text-center">' + buktiHtml + '</td>' +
    '</tr>';
  }).join('');
}

      '<td class="px-3 py-2 text-center"><span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ' + sc + '">' + _escHtml(r.status || '') + '</span></td>' +

// ── Edit PO ──────────────────────────────────────────────────────────────────

        return { namaItem: it.namaItem || '', qty: it.qty || 0, satuan: it.satuan || '', hargaBeli: it.hargaBeli || 0, catatan: it.catatan || '', produkId: it.produkId || '', _manual: !it.produkId };

      }

      var _poLoadPendingEdit = 3;
      var _poLoadingElEdit = document.getElementById('po-form-loading');
      if (_poLoadingElEdit) _poLoadingElEdit.classList.remove('hidden');
      function _poLoadDoneEdit() { if (--_poLoadPendingEdit <= 0 && _poLoadingElEdit) _poLoadingElEdit.classList.add('hidden'); }

      _loadWOOptions('sel-wo-po', po.noWO || '', _poLoadDoneEdit);
      _loadPOTCDropdowns(po.termConditions, _poLoadDoneEdit);

      _loadPOSupplierKatalog(po.idSupplier || '', function() { renderItemsPO(); });

      document.getElementById('po-list-section').classList.add('hidden');
      document.getElementById('form-po-section').classList.remove('hidden');
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification(err.message || 'Gagal memuat PO.', 'error');
    })
    .getPODetail(noPO);
}

function _loadSupplierOptions(selId, selectedId, onDone) {
  if (typeof google === 'undefined') { if (onDone) onDone(); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      var sel = document.getElementById(selId);
      if (!sel) { if (onDone) onDone(); return; }
      sel.innerHTML = '<option value="">-- Pilih Supplier --</option>';
      (Array.isArray(res) ? res : (res.list || [])).filter(function(s){ return s.status === 'Aktif'; }).forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.setAttribute('data-nama', s.nama || '');
        opt.textContent = s.nama + (s.pic ? ' - ' + s.pic : '');
        if (s.id === selectedId) opt.selected = true;
        sel.appendChild(opt);
      });
      if (sel.dataset.sdInit === '1' && typeof sdRefresh === 'function') sdRefresh(selId);
      else if (typeof initSearchableDropdown === 'function') initSearchableDropdown(selId, { placeholder: '-- Pilih Supplier --' });
      if (onDone) onDone();
    })
    .withFailureHandler(function() { if (onDone) onDone(); })
    .getSupplierList();
}

function _loadWOOptions(selId, selectedWO, onDone) {
  if (typeof google === 'undefined') { if (onDone) onDone(); return; }
  google.script.run
    .withSuccessHandler(function(data) {
      var sel = document.getElementById(selId);
      if (!sel) { if (onDone) onDone(); return; }
      sel.innerHTML = '<option value="">-- Tidak terikat WO --</option>';
      (data || []).filter(function(w) { return w.status !== 'Closed'; }).forEach(function(w) {
        var opt = document.createElement('option');
        opt.value = w.noWO;
        opt.textContent = w.noWO + ' – ' + (w.namaProject || w.namaKlien || '');
        if (w.noWO === selectedWO) opt.selected = true;
        sel.appendChild(opt);
      });
      if (sel.dataset.sdInit === '1' && typeof sdRefresh === 'function') sdRefresh(selId);
      else if (typeof initSearchableDropdown === 'function') initSearchableDropdown(selId, { placeholder: '-- Tidak terikat WO --' });
      if (onDone) onDone();
    })
    .withFailureHandler(function() { if (onDone) onDone(); })
    .getWorkOrderList();
}

// ── Pembayaran PO (helper akun, hapus) ────────────────────────────────────────
function _loadAkunPembayaranOptions(selId) {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) {
      var sel = document.getElementById(selId);
      if (!sel) return;
      var list = (res && res.list) ? res.list : (Array.isArray(res) ? res : []);
      var aktif = list.filter(function(a){ return a.status === 'Aktif'; });
      sel.innerHTML = '<option value="">-- Pilih Akun --</option>';
      if (!aktif.length) {
        sel.innerHTML += '<option value="" disabled>Tambah akun pembayaran di Pengaturan</option>';
        return;
      }
      aktif.forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a.id;
        opt.dataset.nama = a.namaAkun;
        opt.textContent  = a.namaAkun + ' (' + a.tipe + ')';
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function(err) {
      var sel = document.getElementById(selId);
      if (sel) sel.innerHTML = '<option value="" disabled>Gagal memuat akun</option>';
    })
    .getAkunPembayaranList();
}

// ── Request Pembayaran PO ─────────────────────────────────────────────────────
function bukaFormRequestBayarPO() {
  if (!_currentPODetail) return;
  var grandTotal   = _currentPODetail.grandTotal  || 0;
  var totalDibayar = _currentPODetail.totalDibayar || 0;
  var sisa         = grandTotal - totalDibayar;

  var fmtRp = function(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); };
  var el = function(id) { return document.getElementById(id); };

  el('req-info-grandtotal').textContent = fmtRp(grandTotal);
  el('req-info-dibayar').textContent    = fmtRp(totalDibayar);
  el('req-info-sisa').textContent       = fmtRp(sisa);
  el('req-jumlah').value  = '';
  el('req-persen').value  = '';
  el('req-catatan').value = '';
  _resetPOInvoiceFileField();

  el('form-request-bayar-po').classList.remove('hidden');
  el('form-request-bayar-po').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

window._onReqJumlahInput = function(el) {
  var raw = _parseRp(el.value);
  var grandTotal = _currentPODetail ? (_currentPODetail.grandTotal || 0) : 0;
  var pct = grandTotal > 0 ? Math.round(raw / grandTotal * 10000) / 100 : 0;
  var persenEl = document.getElementById('req-persen');
  if (persenEl) persenEl.value = raw > 0 ? pct : '';
  var pos = el.selectionStart, oldLen = el.value.length;
  el.value = raw > 0 ? _fmtRp(raw) : '';
  var newLen = el.value.length;
  try { el.selectionStart = el.selectionEnd = pos + (newLen - oldLen); } catch(e){}
};

window._onReqPersenInput = function(el) {
  var pct = parseFloat(el.value) || 0;
  var grandTotal = _currentPODetail ? (_currentPODetail.grandTotal || 0) : 0;
  var nominal = Math.round(grandTotal * pct / 100);
  var jumlahEl = document.getElementById('req-jumlah');
  if (jumlahEl) jumlahEl.value = nominal > 0 ? _fmtRp(nominal) : '';
};

window.submitRequestBayarPO = function() {
  if (!_currentPODetail) return;
  var jumlah  = _parseRp(document.getElementById('req-jumlah').value);
  var catatan = (document.getElementById('req-catatan').value || '').trim();
  var invoiceFileUrl  = (document.getElementById('po-invoice-file-url')  ? document.getElementById('po-invoice-file-url').value  : '').trim();
  var invoiceFileId   = (document.getElementById('po-invoice-file-id')   ? document.getElementById('po-invoice-file-id').value   : '').trim();
  var invoiceFileName = (document.getElementById('po-invoice-file-name') ? document.getElementById('po-invoice-file-name').value : '').trim();
  if (!jumlah || jumlah <= 0) return showNotification('Masukkan nominal pembayaran.', 'error');
  if (!invoiceFileUrl) return showNotification('Lampirkan invoice dari supplier terlebih dahulu.', 'error');

  var payload = {
    noPO:            _currentPODetail.noPO,
    jumlah:          jumlah,
    catatan:         catatan,
    dibuatOleh:      _currentUser ? _currentUser.nama : '',
    invoiceFileUrl:  invoiceFileUrl,
    invoiceFileId:   invoiceFileId,
    invoiceFileName: invoiceFileName
  };

  toggleLoader(true, 'Mengirim request pembayaran...');
  if (typeof google === 'undefined') { toggleLoader(false); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message || 'Request pembayaran berhasil dikirim ke Finance.');
        document.getElementById('form-request-bayar-po').classList.add('hidden');
        bukaPODetail(_currentPODetail.noPO);
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification(err.message || 'Gagal mengirim request.', 'error');
    })
    .requestPembayaranPO(payload);
};

function _renderFormTerimaLangsung(tbody, items) {
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-400 italic">Tidak ada item yang bisa diterima.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(function(it) {
    var sisaClass = it.qtySisa <= 0 ? 'text-slate-300' : 'text-slate-700';
    // Kandidat material BOM "Tunggu Beli" yang produknya cocok dgn item PO ini.
    var cands = (_terimaBOMLinks || []).filter(function(m) { return (m.pricelistId || '') === (it.idProduk || '') && (it.idProduk || ''); });
    var bomCell;
    if (it.qtySisa <= 0) bomCell = '<span class="text-xs text-slate-300">—</span>';
    else if (!cands.length) bomCell = '<span class="text-[11px] text-slate-300 italic">tidak untuk BOM</span>';
    else {
      var opts = '<option value="">— tidak untuk BOM —</option>' + cands.map(function(m) {
        return '<option value="' + _escHtml(m.id) + '" data-menunggu="' + m.qtyMenunggu + '">' + _escHtml(m.noWO) + ' · ' + _escHtml(m.namaMaterial) + ' (mnggu ' + m.qtyMenunggu + ')</option>';
      }).join('');
      bomCell = '<select class="terima-bom-select w-full px-2 py-1 text-xs border border-violet-200 rounded-lg focus:outline-none focus:border-violet-400 bg-white">' + opts + '</select>';
    }
    return '<tr class="border-b border-teal-50" data-id-item="' + _escHtml(it.idItem) + '">' +
      '<td class="px-3 py-2 text-sm font-medium text-slate-800">' + _escHtml(it.namaItem) + '</td>' +
      '<td class="px-3 py-2 text-center text-sm">' + it.qtyPesan + '</td>' +
      '<td class="px-3 py-2 text-center text-sm text-teal-600 font-bold">' + it.qtyDiterima + '</td>' +
      '<td class="px-3 py-2 text-center text-sm ' + sisaClass + '">' + it.qtySisa + '</td>' +
      '<td class="px-3 py-2 text-center">' +
        (it.qtySisa > 0
          ? '<input type="number" class="terima-langsung-qty w-24 px-2 py-1 text-sm border border-teal-300 rounded-lg text-center focus:outline-none focus:border-teal-500" min="0" max="' + it.qtySisa + '" value="0" data-sisa="' + it.qtySisa + '">'
          : '<span class="text-xs text-slate-300">Penuh</span>') +
      '</td>' +
      '<td class="px-3 py-2">' + bomCell + '</td>' +
      '<td class="px-3 py-2">' +
        '<input type="text" class="terima-langsung-catatan w-full px-2 py-1 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-rose-400" placeholder="cth: 1 unit rusak, retur ke supplier">' +
      '</td>' +
    '</tr>';
  }).join('');
}

function _renderFormTerimaGudang(tbody, items) {

    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400 italic">Tidak ada item yang bisa diterima.</td></tr>';

// Muat material BOM "Tunggu Beli" untuk supplier PO ini, lalu render tabel langsung
// (dropdown pemenuhan BOM per item disaring by produk yang cocok).
function _loadTerimaBOMThenRender(tbodyL) {
  _terimaBOMLinks = [];
  var idSup = (_currentPODetail && _currentPODetail.idSupplier) || '';
  google.script.run.withSuccessHandler(function(res) {
    _terimaBOMLinks = (res && res.success) ? (res.list || []) : [];
    _renderFormTerimaLangsung(tbodyL, _terimaPOItems);
  }).withFailureHandler(function() {
    _terimaBOMLinks = [];
    _renderFormTerimaLangsung(tbodyL, _terimaPOItems);
  }).getBOMMenungguBL({ idSupplier: idSup });
}
// Harga satuan (net) item PO by idItem.
function _terimaPOHarga(idItem) {
  var m = (_terimaPOItems || []).filter(function(it) { return (it.idItem || '') === idItem; })[0];
  return m ? (Number(m.hargaBeli) || 0) : 0;
}

function submitTerimaPOKirimLangsung() {
  if (!_currentPODetail) return;
  var noPO = _currentPODetail.noPO;
  var rows = document.querySelectorAll('#form-terima-items-langsung tr[data-id-item]');
  var items = [];
  var bomLinks = [];
  var hasError = false;
  rows.forEach(function(row) {
    if (hasError) return;
    var idItem      = row.getAttribute('data-id-item');
    var qtyInput    = row.querySelector('.terima-langsung-qty');
    var catatanInput = row.querySelector('.terima-langsung-catatan');
    var bomSelect   = row.querySelector('.terima-bom-select');
    if (!qtyInput) return;
    var qty     = parseFloat(qtyInput.value) || 0;
    var catatan = (catatanInput && catatanInput.value.trim()) || '';
    var bomId   = (bomSelect && bomSelect.value) || '';
    var namaItem = (row.querySelector('td:first-child') || {}).innerText || idItem;
    // Jika baris ini diarahkan ke material BOM, qty terima = qty yang dipenuhi.
    if (bomId) {
      if (qty <= 0) { showNotification('Isi Qty Terima untuk item "' + namaItem + '" yang dipilih memenuhi BOM.', 'error'); hasError = true; return; }
      var opt = bomSelect.options[bomSelect.selectedIndex];
      var menunggu = parseFloat(opt.getAttribute('data-menunggu')) || 0;
      if (qty > menunggu) { showNotification('Qty (' + qty + ') melebihi kebutuhan material BOM (menunggu ' + menunggu + ') untuk "' + namaItem + '".', 'error'); hasError = true; return; }
    }
    if (qty <= 0 && !catatan) return;
    var sisa = parseFloat(qtyInput.getAttribute('data-sisa')) || 0;
    if (qty > sisa) {
      showNotification('Qty melebihi sisa untuk item "' + namaItem + '".', 'error');
      hasError = true; return;
    }
    items.push({ idItem: idItem, namaItem: namaItem, qty: qty, catatan: catatan });
    if (bomId && qty > 0) bomLinks.push({ bomItemId: bomId, qty: qty, hargaSatuan: _terimaPOHarga(idItem) });
  });
  if (hasError) return;
  if (!items.length) return showNotification('Masukkan qty yang akan diterima.', 'error');

  var buktiFileUrl  = document.getElementById('terima-langsung-bukti-file-url').value;
  if (!buktiFileUrl) return showNotification('Bukti barang diterima klien wajib dilampirkan.', 'error');
  var buktiFileId   = document.getElementById('terima-langsung-bukti-file-id').value;
  var buktiFileName = document.getElementById('terima-langsung-bukti-file-name').value;

  var namaUser = (_currentUser && _currentUser.nama) || '';
  function _selesai(msgExtra) {
    toggleLoader(false);
    showNotification('Penerimaan langsung tersimpan.' + (msgExtra || ''), 'success');
    document.getElementById('form-terima-po').classList.add('hidden');
    bukaPODetail(noPO);
  }
  toggleLoader(true, 'Menyimpan penerimaan langsung...');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) { toggleLoader(false); showNotification((res && res.message) || 'Gagal.', 'error'); return; }
      if (!bomLinks.length) { _selesai(''); return; }
      // Tautkan ke material BOM (Beli Langsung) + bukukan HPP per material.
      google.script.run
        .withSuccessHandler(function(r2) {
          var ok = r2 && r2.success ? (r2.hasil || []).filter(function(x){ return x.success; }).length : 0;
          _selesai(ok ? ' ' + ok + ' material BOM ditandai Beli Langsung.' : '');
        })
        .withFailureHandler(function(err) { toggleLoader(false); showNotification('Penerimaan tersimpan, tapi gagal link BOM: ' + err.message, 'error'); document.getElementById('form-terima-po').classList.add('hidden'); bukaPODetail(noPO); })
        .linkBeliLangsung(bomLinks, noPO, namaUser);
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .terimaPOKirimLangsung({
      noPO: noPO,
      items: items,
      namaUser: namaUser,
      buktiFileId: buktiFileId,
      buktiFileUrl: buktiFileUrl,
      buktiFileName: buktiFileName
    });
}

  exportPOPDF(po.noPO);
}

function _loadPOTCDropdowns(selectedTC, onDone) {
  var tc = {};
  if (selectedTC) {
    try { tc = typeof selectedTC === 'string' ? JSON.parse(selectedTC) : selectedTC; } catch(e) {}
  }
  var loadEl = document.getElementById('po-tc-loading');
  if (loadEl) loadEl.classList.remove('hidden');
  if (typeof google === 'undefined') {
    if (loadEl) loadEl.classList.add('hidden');
    if (onDone) onDone();
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (loadEl) loadEl.classList.add('hidden');
      var wrap = document.getElementById('po-tc-fields-wrap');
      if (!wrap) { if (onDone) onDone(); return; }
      if (!res || !res.success) { if (onDone) onDone(); return; }
      wrap.innerHTML = res.fields.map(function(f) {
        var opts = res.options[f.key] || ['-'];
        return '<div>' +
          '<label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">' + f.label + '</label>' +
          '<select id="po-tc-' + f.key + '" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 bg-white">' +
          opts.map(function(o) {
            return '<option value="' + (o || '').replace(/"/g,'&quot;') + '"' +
              (tc[f.key] === o ? ' selected' : '') + '>' +
              (o || '').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</option>';
          }).join('') +
          '</select></div>';
      }).join('');
      if (onDone) onDone();
    })
    .withFailureHandler(function() {
      var el = document.getElementById('po-tc-loading');
      if (el) el.classList.add('hidden');
      if (onDone) onDone();
    })
    .getPOTCOptions();
}

if (typeof _escHtml === 'undefined') {
  window._escHtml = function(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  };
}
</script>
