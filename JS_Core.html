<script>
    // --- STATE MANAGEMENT ---
    let erpState = { klien: [], produk: [], templatePaket: {}, nextNo: "" };
    let kalkulasiGlobalState = { subtotalSemua: 0, diskonNominal: 0, pajakNominal: 0, grandTotal: 0, totalHpp: 0, profitInternal: 0, marginPersen: 0 };
    // --- SISTEM NOTIFIKASI & LOADER ---
    function showNotification(message, type = "success") {
      const toast = document.getElementById('globalNotification');
      const icon = document.getElementById('globalNotifIcon');
      toast.className = "fixed top-6 right-6 z-[110] transform transition-all duration-300 ease-out bg-white p-4 rounded-xl shadow-xl border flex items-center gap-3 max-w-sm ";
      if (type === "success") { toast.classList.add("border-emerald-200", "bg-emerald-50"); icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>'; } 
      else { toast.classList.add("border-rose-200", "bg-rose-50"); icon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-500 text-xl"></i>'; }
      document.getElementById('globalNotifMessage').innerText = message;
      toast.classList.remove('hidden'); setTimeout(() => toast.classList.remove('translate-x-full'), 50);
      setTimeout(() => { toast.classList.add('translate-x-full'); setTimeout(() => toast.classList.add('hidden'), 300); }, 3500);
    }
    
    function toggleLoader(show, text = "Memuat...") {
      const l = document.getElementById('appLoader');
      document.getElementById('loaderText').innerText = text;
      show ? l.classList.remove('hidden') : l.classList.add('hidden');
    }

    // --- MODAL KONFIRMASI GLOBAL (pengganti window.confirm) ---
    let _konfirmasiGlobalCallback = null;
    const _konfirmasiGlobalColors = {
      danger:  { bg: 'bg-rose-100',  text: 'text-rose-600',  btn: 'bg-rose-600 hover:bg-rose-700' },
      warning: { bg: 'bg-amber-100', text: 'text-amber-600', btn: 'bg-amber-500 hover:bg-amber-600' },
      info:    { bg: 'bg-teal-100',  text: 'text-teal-600',  btn: 'bg-teal-600 hover:bg-teal-700' }
    };
    function showConfirm(opts) {
      if (typeof opts === 'string') opts = { message: opts };
      const type = opts.type || 'danger';
      const c = _konfirmasiGlobalColors[type] || _konfirmasiGlobalColors.danger;
      const icon = opts.icon || (type === 'danger' ? 'fa-trash' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-question');

      document.getElementById('konfirmasi-global-title').innerText = opts.title || 'Konfirmasi';
      document.getElementById('konfirmasi-global-message').innerText = opts.message || 'Apakah Anda yakin?';
      document.getElementById('konfirmasi-global-cancel-text').innerText = opts.cancelText || 'Batal';
      document.getElementById('konfirmasi-global-confirm-text').innerText = opts.confirmText || 'Ya, Lanjutkan';

      const iconSpan = document.getElementById('konfirmasi-global-icon');
      iconSpan.className = c.bg + ' ' + c.text + ' h-10 w-10 rounded-xl flex items-center justify-center shrink-0';
      iconSpan.innerHTML = '<i class="fas ' + icon + ' text-sm"></i>';

      const btn = document.getElementById('konfirmasi-global-confirm-btn');
      btn.className = 'px-6 py-2.5 text-sm ' + c.btn + ' text-white rounded-xl font-bold shadow-md transition';

      _konfirmasiGlobalCallback = (typeof opts.onConfirm === 'function') ? opts.onConfirm : null;
      document.getElementById('modal-konfirmasi-global').classList.remove('hidden');
    }
    function _tutupKonfirmasiGlobal() {
      document.getElementById('modal-konfirmasi-global').classList.add('hidden');
      _konfirmasiGlobalCallback = null;
    }
    function _konfirmasiGlobalConfirm() {
      const cb = _konfirmasiGlobalCallback;
      document.getElementById('modal-konfirmasi-global').classList.add('hidden');
      _konfirmasiGlobalCallback = null;
      if (cb) cb();
    }

    // --- NAVIGASI DASHBOARD ---
    function navigate(pageId) {
      // Tutup semua modal floating sebelum pindah halaman
      ['panel-po-detail','form-po-section','form-penerimaan-tanpa-po','form-penyesuaian-stok','form-penggunaan-stok','form-terima-po-gudang','modal-exp-langsung','modal-exp-hapus'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      document.getElementById('nav-' + pageId).classList.add('active');
      if(pageId === 'dashboard') loadDashboard();
      if(pageId === 'penawaran') { loadPenawaran(); toggleFormPenawaran(false); if(!erpState.klien.length) muatSeluruhDataAwal(true); }
      if(pageId === 'workorder') loadWorkOrder();
      if(pageId === 'invoice') loadInvoice();
      if(pageId === 'kwitansi') loadKwitansi();
      if(pageId === 'produk') loadProduk();
      if(pageId === 'template') loadTemplate();
      if(pageId === 'customer') loadCustomer();
      if(pageId === 'users') loadUsers();
      if(pageId === 'laporanfinance') {
        _frUpdatePeriodLabel();
        loadFinanceReport();
      }
      if(pageId === 'settings') loadSettings();
      if(pageId === 'supplier') loadSupplier();
      if(pageId === 'purchaseorder') {
        // Reset ke list view setiap navigasi masuk
        var formPO   = document.getElementById('form-po-section');
        var detailPO = document.getElementById('panel-po-detail');
        var listPO   = document.getElementById('po-list-section');
        if (formPO)   formPO.classList.add('hidden');
        if (detailPO) detailPO.classList.add('hidden');
        if (listPO)   listPO.classList.remove('hidden');
        loadPurchaseOrder();
      }
      if(pageId === 'inventory') {
        var listInv = document.getElementById('inv-list-section');
        if (listInv) listInv.classList.remove('hidden');
        loadInventory();
      }
      if(pageId === 'pengeluaran') loadPengeluaran();
      if(pageId === 'laporanprofitabilitas') {
        _lpUpdatePeriodLabel();
        loadLaporanProfitabilitas();
      }
    }

    function toggleFormUmum(formId) { document.getElementById(formId).classList.toggle('hidden'); }
</script>
