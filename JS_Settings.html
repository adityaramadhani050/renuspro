<script>
// ── Settings Page ────────────────────────────────────────────────────────────

function showToast(msg, type) { showNotification(msg, type || 'success'); }

var _tcData    = {};   // { field_key: [option, ...] }
var _bankData  = [];   // [ { id, label, detail }, ... ]

function loadSettings() {
  _loadWAConfig();
  _loadWAReminderSchedule();
  _loadTCOptions();
  _loadPOTCOptions();
  _loadBankAccounts();
  _loadDocSign();
  _loadKategoriPengeluaran();
}

// ═══════════════════════════════════════════════════════
// KATEGORI PENGELUARAN (non-project)
// ═══════════════════════════════════════════════════════
var _kategoriPengData = [];

function _loadKategoriPengeluaran() {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) {
      _kategoriPengData = (res && res.list) ? res.list : [];
      _renderKategoriPengList();
    })
    .withFailureHandler(function() {})
    .getKategoriPengeluaran();
}

function _renderKategoriPengList() {
  var container = document.getElementById('kategori-peng-list');
  if (!container) return;
  if (!_kategoriPengData.length) {
    container.innerHTML = '<div class="text-xs text-slate-400 italic">Belum ada kategori. Klik "Tambah Kategori".</div>';
    return;
  }
  container.innerHTML = '';
  _kategoriPengData.forEach(function(k, idx) {
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    row.innerHTML =
      '<input type="text" value="' + _escHtml(k) + '" oninput="_onKategoriPengInput(' + idx + ', this.value)" ' +
        'class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">' +
      '<button onclick="deleteKategoriPengeluaran(' + idx + ')" class="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition shrink-0" title="Hapus">' +
        '<i class="fa-solid fa-trash-can text-xs"></i></button>';
    container.appendChild(row);
  });
}

function _onKategoriPengInput(idx, val) {
  if (idx >= 0 && idx < _kategoriPengData.length) _kategoriPengData[idx] = val;
}

function addKategoriPengeluaran() {
  _kategoriPengData.push('');
  _renderKategoriPengList();
  var container = document.getElementById('kategori-peng-list');
  if (container) {
    var inputs = container.querySelectorAll('input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }
}

function deleteKategoriPengeluaran(idx) {
  if (idx < 0 || idx >= _kategoriPengData.length) return;
  _kategoriPengData.splice(idx, 1);
  _renderKategoriPengList();
}

function simpanKategoriPengeluaran() {
  // Ambil nilai terkini dari input (jaga-jaga)
  var container = document.getElementById('kategori-peng-list');
  if (container) {
    var inputs = container.querySelectorAll('input');
    _kategoriPengData = Array.prototype.map.call(inputs, function(i) { return i.value; });
  }
  var btn = document.getElementById('kategori-peng-save-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Kategori'; }
      if (res && res.success) {
        _kategoriPengData = res.list || _kategoriPengData;
        _renderKategoriPengList();
      }
      showToast((res && res.message) || (res && res.success ? 'Tersimpan.' : 'Gagal.'), res && res.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Kategori'; }
      showToast('Error: ' + e.message, 'error');
    })
    .saveKategoriPengeluaran(_kategoriPengData);
}

// ═══════════════════════════════════════════════════════
// WA BOT
// ═══════════════════════════════════════════════════════

function _loadWAConfig() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      document.getElementById('wa-enabled').checked  = !!r.enabled;
      document.getElementById('wa-endpoint').value   = r.endpoint || '';
      document.getElementById('wa-target').value     = r.target   || '';
      document.getElementById('wa-token').value      = r.token    || '';
      var qcEl = document.getElementById('wa-qc-notif'); if (qcEl) qcEl.checked = (r.qcNotif !== false);
      var tn = document.getElementById('wa-test-number'); if (tn) tn.value = r.testNumber || '';
      var tg = document.getElementById('wa-test-group'); if (tg) tg.value = r.testGroup || '';
      _waRenderTestButtons();
      _updateWAEnabledLabel(!!r.enabled);
    })
    .withFailureHandler(function() {})
    .getWAConfig();
}

// ── Uji Notifikasi WA: tombol per jenis notifikasi ──────────────────────────
var _WA_TEST_JENIS = [
  { k: 'qc_lead', l: 'QC: Review Baru' }, { k: 'qc_site', l: 'QC: Hasil Review' },
  { k: 'ded_lead', l: 'DED: Review Baru' }, { k: 'ded_site', l: 'DED: Hasil Review' },
  { k: 'bom_ajukan', l: 'BOM: Diajukan' }, { k: 'bom_hasil', l: 'BOM: Hasil Review' },
  { k: 'assign', l: 'Penugasan Engineer' }, { k: 'po_gudang', l: 'PO: Kirim ke Gudang' },
  { k: 'barang_diterima', l: 'PO: Barang Diterima' }, { k: 'req_bayar', l: 'Request Pembayaran' },
  { k: 'hasil_bayar', l: 'Hasil Pembayaran' }, { k: 'reminder_expired', l: 'Reminder Expired' },
  { k: 'remind_engineer', l: 'Reminder Engineer' }
];
function _waRenderTestButtons() {
  var box = document.getElementById('wa-test-buttons'); if (!box) return;
  box.innerHTML = _WA_TEST_JENIS.map(function(j) {
    return '<button onclick="testWANotifSample(\'' + j.k + '\')" class="px-3 py-2 text-xs bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg font-bold transition text-left flex items-center gap-1.5"><i class="fa-brands fa-whatsapp text-emerald-500"></i> ' + j.l + '</button>';
  }).join('');
}
function testWANotifSample(jenis) {
  var nomor  = (document.getElementById('wa-test-number').value || '').trim();
  var grupId = (document.getElementById('wa-test-group').value  || '').trim();
  if (!nomor && !grupId) return showNotification('Isi Nomor atau Grup ID pengujian dulu.', 'error');
  toggleLoader(true, 'Mengirim contoh notifikasi...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    })
    .withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal mengirim.', 'error'); })
    .testWANotifSample({ jenis: jenis, nomor: nomor, grupId: grupId });
}

function _updateWAEnabledLabel(enabled) {
  var label = document.getElementById('wa-enabled-label');
  var knob  = document.getElementById('wa-toggle-knob');
  if (!label) return;
  if (enabled) {
    label.textContent = 'Aktif';
    label.className   = 'text-xs font-bold text-emerald-500';
    if (knob) knob.style.transform = 'translateX(20px)';
  } else {
    label.textContent = 'Nonaktif';
    label.className   = 'text-xs font-bold text-slate-400';
    if (knob) knob.style.transform = '';
  }
}

function onWAEnabledChange() {
  _updateWAEnabledLabel(document.getElementById('wa-enabled').checked);
}

function simpanWAConfig() {
  var enabled  = document.getElementById('wa-enabled').checked;
  var endpoint = (document.getElementById('wa-endpoint').value || '').trim();
  var target   = (document.getElementById('wa-target').value   || '').trim();
  var token    = (document.getElementById('wa-token').value    || '').trim();
  if (!endpoint || !target) { showToast('Server URL dan Group JID wajib diisi.', 'error'); return; }
  var btn = document.querySelector('[onclick="simpanWAConfig()"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Menyimpan...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> Simpan'; }
      showToast((r && r.message) || (r && r.success ? 'Tersimpan.' : 'Gagal menyimpan.'), r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> Simpan'; }
      showToast('Error: ' + e.message, 'error');
    })
    .saveWAConfig({ enabled: enabled, endpoint: endpoint, target: target, token: token, qcNotif: (document.getElementById('wa-qc-notif') || {}).checked, testNumber: (document.getElementById('wa-test-number') || {}).value, testGroup: (document.getElementById('wa-test-group') || {}).value, reminderHour: parseInt((document.getElementById('wa-reminder-hour') || {}).value, 10), reminderInterval: parseInt((document.getElementById('wa-reminder-interval') || {}).value, 10) });
}

function testWAConfig() {
  var endpoint = (document.getElementById('wa-endpoint').value || '').trim();
  var target   = (document.getElementById('wa-target').value   || '').trim();
  var token    = (document.getElementById('wa-token').value    || '').trim();
  if (!endpoint || !target) { showToast('Isi Server URL dan Group JID terlebih dahulu.', 'error'); return; }
  var btn = document.getElementById('wa-test-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i> Mengirim...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-brands fa-whatsapp text-sm"></i> Kirim Test'; }
      showToast((r && r.message) || (r && r.success ? 'Terkirim!' : 'Gagal.'), r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-brands fa-whatsapp text-sm"></i> Kirim Test'; }
      showToast('Error: ' + e.message, 'error');
    })
    .testWANotif({ endpoint: endpoint, target: target, token: token });
}

function _populateReminderHourOptions() {
  var sel = document.getElementById('wa-reminder-hour');
  if (!sel || sel.options.length) return;
  for (var h = 0; h < 24; h++) {
    var opt = document.createElement('option');
    opt.value = h;
    opt.textContent = (h < 10 ? '0' + h : h) + ':00';
    sel.appendChild(opt);
  }
}

function _loadWAReminderSchedule() {
  _populateReminderHourOptions();
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      document.getElementById('wa-reminder-hour').value     = r.jam;
      document.getElementById('wa-reminder-interval').value = r.intervalHari;
    })
    .withFailureHandler(function() {})
    .getWAReminderScheduleConfig();
}

function simpanJadwalReminder() {
  var jam          = parseInt(document.getElementById('wa-reminder-hour').value, 10);
  var intervalHari = parseInt(document.getElementById('wa-reminder-interval').value, 10);
  if (isNaN(intervalHari) || intervalHari < 1) { showToast('Selang hari reminder ulang minimal 1.', 'error'); return; }
  var btn = document.getElementById('wa-jadwal-save-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Menyimpan...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-clock text-xs"></i> Simpan Jadwal Reminder'; }
      showToast((r && r.message) || (r && r.success ? 'Tersimpan.' : 'Gagal.'), r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-clock text-xs"></i> Simpan Jadwal Reminder'; }
      showToast('Error: ' + e.message, 'error');
    })
    .saveWAReminderScheduleConfig({ jam: jam, intervalHari: intervalHari });
}

function kirimReminderManual() {
  var btn = document.getElementById('wa-reminder-manual-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i> Mengirim...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bell text-sm"></i> Kirim Reminder Manual'; }
      showToast((r && r.message) || (r && r.success ? 'Selesai.' : 'Gagal.'), r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bell text-sm"></i> Kirim Reminder Manual'; }
      showToast('Error: ' + e.message, 'error');
    })
    .kirimReminderExpiredManual();
}

// ═══════════════════════════════════════════════════════
// SYARAT & KETENTUAN
// ═══════════════════════════════════════════════════════

function _loadTCOptions() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      _tcData = r.options;
      _renderTCFields(r.fields, r.options);
    })
    .withFailureHandler(function() {})
    .getTCOptions();
}

function _renderTCFields(fields, options) {
  var container = document.getElementById('tc-fields-container');
  if (!container) return;
  container.innerHTML = '';
  fields.forEach(function(f) {
    var opts = options[f.key] || [];
    var html = '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
      '<div class="bg-slate-50 px-4 py-2.5 flex items-center justify-between border-b border-slate-200">' +
        '<span class="text-xs font-bold text-slate-600 uppercase tracking-wide">' + f.label + '</span>' +
        '<button onclick="addTCOption(\'' + f.key + '\')" class="text-blue-600 hover:text-blue-800 text-xs font-bold flex items-center gap-1">' +
          '<i class="fa-solid fa-plus text-[10px]"></i> Tambah</button>' +
      '</div>' +
      '<div class="divide-y divide-slate-100" id="tc-list-' + f.key + '">';
    opts.forEach(function(opt, idx) {
      html += _tcOptionRow(f.key, idx, opt);
    });
    if (opts.length === 0) {
      html += '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
    }
    html += '</div></div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function _tcOptionRow(key, idx, val) {
  return '<div class="flex items-center gap-2 px-4 py-2" id="tc-row-' + key + '-' + idx + '">' +
    '<input type="text" value="' + _escHtml(val) + '" onchange="_tcUpdateValue(\'' + key + '\',' + idx + ',this.value)" ' +
      'class="flex-1 px-2 py-1 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-blue-400 bg-white">' +
    '<button onclick="deleteTCOption(\'' + key + '\',' + idx + ')" class="text-red-400 hover:text-red-600 shrink-0">' +
      '<i class="fa-solid fa-trash-can text-xs"></i></button>' +
  '</div>';
}

function _escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _tcUpdateValue(key, idx, val) {
  if (!_tcData[key]) return;
  _tcData[key][idx] = val;
}

function addTCOption(key) {
  if (!_tcData[key]) _tcData[key] = [];
  var idx  = _tcData[key].length;
  _tcData[key].push('');
  var list = document.getElementById('tc-list-' + key);
  if (!list) return;
  // Remove "belum ada opsi" placeholder if exists
  var empty = list.querySelector('.italic');
  if (empty) empty.parentNode.removeChild(empty);
  list.insertAdjacentHTML('beforeend', _tcOptionRow(key, idx, ''));
  var newInput = document.getElementById('tc-row-' + key + '-' + idx);
  if (newInput) newInput.querySelector('input').focus();
}

function deleteTCOption(key, idx) {
  if (!_tcData[key]) return;
  _tcData[key].splice(idx, 1);
  // Re-render hanya section ini
  var list = document.getElementById('tc-list-' + key);
  if (!list) return;
  var opts = _tcData[key];
  list.innerHTML = '';
  opts.forEach(function(opt, i) { list.insertAdjacentHTML('beforeend', _tcOptionRow(key, i, opt)); });
  if (opts.length === 0) list.innerHTML = '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
}

function simpanTCOptions() {
  // Sync nilai input ke _tcData sebelum simpan
  Object.keys(_tcData).forEach(function(key) {
    (_tcData[key] || []).forEach(function(_, idx) {
      var row = document.getElementById('tc-row-' + key + '-' + idx);
      if (row) {
        var inp = row.querySelector('input');
        if (inp) _tcData[key][idx] = inp.value;
      }
    });
  });
  var btn = document.querySelector('[onclick="simpanTCOptions()"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Menyimpan...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> Simpan Syarat & Ketentuan'; }
      showToast((r && r.message) || 'Tersimpan.', r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> Simpan Syarat & Ketentuan'; }
      showToast('Error: ' + e.message, 'error');
    })
    .saveTCOptions(_tcData);
}

// ═══════════════════════════════════════════════════════
// SYARAT & KETENTUAN — PURCHASE ORDER (app_config TC_PO_OPTIONS)
// ═══════════════════════════════════════════════════════
var _poTcData = {};

function _loadPOTCOptions() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      _poTcData = r.options;
      _renderPOTCFields(r.fields, r.options);
    })
    .withFailureHandler(function() {})
    .getPOTCOptions();
}

function _potcRow(key, idx, val) {
  return '<div class="flex items-center gap-2 px-4 py-2" id="potc-row-' + key + '-' + idx + '">' +
    '<input type="text" value="' + _escHtml(val) + '" onchange="_potcUpdate(\'' + key + '\',' + idx + ',this.value)" ' +
      'class="flex-1 px-2 py-1 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-amber-400 bg-white">' +
    '<button onclick="deletePOTCOption(\'' + key + '\',' + idx + ')" class="text-red-400 hover:text-red-600 shrink-0">' +
      '<i class="fa-solid fa-trash-can text-xs"></i></button>' +
  '</div>';
}

function _renderPOTCFields(fields, options) {
  var container = document.getElementById('potc-fields-container');
  if (!container) return;
  container.innerHTML = '';
  fields.forEach(function(f) {
    var opts = options[f.key] || [];
    var html = '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
      '<div class="bg-slate-50 px-4 py-2.5 flex items-center justify-between border-b border-slate-200">' +
        '<span class="text-xs font-bold text-slate-600 uppercase tracking-wide">' + f.label + '</span>' +
        '<button onclick="addPOTCOption(\'' + f.key + '\')" class="text-amber-600 hover:text-amber-800 text-xs font-bold flex items-center gap-1">' +
          '<i class="fa-solid fa-plus text-[10px]"></i> Tambah</button>' +
      '</div>' +
      '<div class="divide-y divide-slate-100" id="potc-list-' + f.key + '">';
    opts.forEach(function(opt, idx) { html += _potcRow(f.key, idx, opt); });
    if (opts.length === 0) html += '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
    html += '</div></div>';
    container.insertAdjacentHTML('beforeend', html);
  });
}

function _potcUpdate(key, idx, val) { if (!_poTcData[key]) return; _poTcData[key][idx] = val; }

function addPOTCOption(key) {
  if (!_poTcData[key]) _poTcData[key] = [];
  var idx = _poTcData[key].length;
  _poTcData[key].push('');
  var list = document.getElementById('potc-list-' + key);
  if (!list) return;
  var empty = list.querySelector('.italic');
  if (empty) empty.parentNode.removeChild(empty);
  list.insertAdjacentHTML('beforeend', _potcRow(key, idx, ''));
  var newInput = document.getElementById('potc-row-' + key + '-' + idx);
  if (newInput) newInput.querySelector('input').focus();
}

function deletePOTCOption(key, idx) {
  if (!_poTcData[key]) return;
  _poTcData[key].splice(idx, 1);
  var list = document.getElementById('potc-list-' + key);
  if (!list) return;
  var opts = _poTcData[key];
  list.innerHTML = '';
  opts.forEach(function(opt, i) { list.insertAdjacentHTML('beforeend', _potcRow(key, i, opt)); });
  if (opts.length === 0) list.innerHTML = '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
}

function simpanPOTCOptions() {
  Object.keys(_poTcData).forEach(function(key) {
    (_poTcData[key] || []).forEach(function(_, idx) {
      var row = document.getElementById('potc-row-' + key + '-' + idx);
      if (row) { var inp = row.querySelector('input'); if (inp) _poTcData[key][idx] = inp.value; }
    });
  });
  var btn = document.querySelector('[onclick="simpanPOTCOptions()"]');
  var _lbl = '<i class="fa-solid fa-floppy-disk text-xs"></i> Simpan S&K Purchase Order';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Menyimpan...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = _lbl; }
      showToast((r && r.message) || 'Tersimpan.', r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = _lbl; }
      showToast('Error: ' + e.message, 'error');
    })
    .savePOTCOptions(_poTcData);
}

// ═══════════════════════════════════════════════════════
// MODAL "ATUR S&K" — dipakai dari Form Penawaran & Form PO
// Modal mandiri (ID sendiri) agar tak bentrok dgn container di halaman
// Pengaturan. Mode 'penawaran' → getTCOptions/saveTCOptions; mode 'po' →
// getPOTCOptions/savePOTCOptions. onSaved: callback utk reload dropdown form.
// ═══════════════════════════════════════════════════════
var _snkMode = null;       // 'penawaran' | 'po'
var _snkData = {};
var _snkOnSaved = null;

function _snkAccent() { return _snkMode === 'po' ? 'amber' : 'blue'; }

function bukaAturSNK(mode, onSaved) {
  _snkMode = (mode === 'po') ? 'po' : 'penawaran';
  _snkOnSaved = (typeof onSaved === 'function') ? onSaved : null;
  var m = document.getElementById('modal-atur-snk'); if (!m) return;
  var isPO = _snkMode === 'po';
  var titleEl = document.getElementById('snk-modal-title');
  var iconEl  = document.getElementById('snk-modal-icon');
  var saveBtn = document.getElementById('snk-modal-save-btn');
  if (titleEl) titleEl.textContent = isPO ? 'Atur S&K Purchase Order' : 'Atur S&K Penawaran';
  if (iconEl)  iconEl.className = 'fa-solid fa-sliders ' + (isPO ? 'text-amber-600' : 'text-blue-600');
  if (saveBtn) {
    saveBtn.className = 'px-5 py-2 text-sm font-bold text-white rounded-xl shadow-sm transition flex items-center gap-2 ' +
      (isPO ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700');
    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan';
    saveBtn.disabled = false;
  }
  var cont = document.getElementById('snk-modal-container');
  if (cont) cont.innerHTML = '<div class="text-xs text-slate-400 italic px-1 py-3">Memuat data...</div>';
  m.classList.remove('hidden');
  var fn = isPO ? 'getPOTCOptions' : 'getTCOptions';
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) { if (cont) cont.innerHTML = '<div class="text-xs text-rose-500 px-1 py-3">Gagal memuat S&K.</div>'; return; }
      _snkData = r.options || {};
      _snkRenderFields(r.fields || [], _snkData);
    })
    .withFailureHandler(function(e) { if (cont) cont.innerHTML = '<div class="text-xs text-rose-500 px-1 py-3">Gagal memuat: ' + ((e && e.message) || e) + '</div>'; })
    [fn]();
}

function tutupAturSNK() { var m = document.getElementById('modal-atur-snk'); if (m) m.classList.add('hidden'); }

function _snkRenderFields(fields, options) {
  var cont = document.getElementById('snk-modal-container'); if (!cont) return;
  var accent = _snkAccent();
  cont.innerHTML = '';
  if (!fields.length) { cont.innerHTML = '<div class="text-xs text-slate-400 italic px-1 py-3">Tidak ada field S&K.</div>'; return; }
  fields.forEach(function(f) {
    var opts = options[f.key] || [];
    var html = '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
      '<div class="bg-slate-50 px-4 py-2.5 flex items-center justify-between border-b border-slate-200">' +
        '<span class="text-xs font-bold text-slate-600 uppercase tracking-wide">' + f.label + '</span>' +
        '<button onclick="_snkAddOption(\'' + f.key + '\')" class="text-' + accent + '-600 hover:text-' + accent + '-800 text-xs font-bold flex items-center gap-1">' +
          '<i class="fa-solid fa-plus text-[10px]"></i> Tambah</button>' +
      '</div>' +
      '<div class="divide-y divide-slate-100" id="snk-list-' + f.key + '">';
    opts.forEach(function(opt, idx) { html += _snkRow(f.key, idx, opt); });
    if (opts.length === 0) html += '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
    html += '</div></div>';
    cont.insertAdjacentHTML('beforeend', html);
  });
}

function _snkRow(key, idx, val) {
  var accent = _snkAccent();
  return '<div class="flex items-center gap-2 px-4 py-2" id="snk-row-' + key + '-' + idx + '">' +
    '<input type="text" value="' + _escHtml(val) + '" onchange="_snkUpdate(\'' + key + '\',' + idx + ',this.value)" ' +
      'class="flex-1 px-2 py-1 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-' + accent + '-400 bg-white">' +
    '<button onclick="_snkDeleteOption(\'' + key + '\',' + idx + ')" class="text-red-400 hover:text-red-600 shrink-0">' +
      '<i class="fa-solid fa-trash-can text-xs"></i></button>' +
  '</div>';
}

function _snkUpdate(key, idx, val) { if (!_snkData[key]) return; _snkData[key][idx] = val; }

function _snkAddOption(key) {
  if (!_snkData[key]) _snkData[key] = [];
  var idx = _snkData[key].length;
  _snkData[key].push('');
  var list = document.getElementById('snk-list-' + key); if (!list) return;
  var empty = list.querySelector('.italic'); if (empty) empty.parentNode.removeChild(empty);
  list.insertAdjacentHTML('beforeend', _snkRow(key, idx, ''));
  var nr = document.getElementById('snk-row-' + key + '-' + idx); if (nr) nr.querySelector('input').focus();
}

function _snkDeleteOption(key, idx) {
  if (!_snkData[key]) return;
  _snkData[key].splice(idx, 1);
  var list = document.getElementById('snk-list-' + key); if (!list) return;
  var opts = _snkData[key];
  list.innerHTML = '';
  opts.forEach(function(opt, i) { list.insertAdjacentHTML('beforeend', _snkRow(key, i, opt)); });
  if (opts.length === 0) list.innerHTML = '<div class="px-4 py-3 text-xs text-slate-400 italic">Belum ada opsi.</div>';
}

function simpanAturSNK() {
  // Sync nilai input terakhir ke _snkData sebelum simpan.
  Object.keys(_snkData).forEach(function(key) {
    (_snkData[key] || []).forEach(function(_, idx) {
      var row = document.getElementById('snk-row-' + key + '-' + idx);
      if (row) { var inp = row.querySelector('input'); if (inp) _snkData[key][idx] = inp.value; }
    });
  });
  var isPO = _snkMode === 'po';
  var btn = document.getElementById('snk-modal-save-btn');
  var lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...'; }
  var fn = isPO ? 'savePOTCOptions' : 'saveTCOptions';
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      showNotification((r && r.message) || 'Syarat & Ketentuan tersimpan.', (r && r.success) ? 'success' : 'error');
      if (r && r.success) {
        if (_snkOnSaved) { try { _snkOnSaved(); } catch (e) {} }
        tutupAturSNK();
      }
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      showNotification('Gagal menyimpan: ' + ((e && e.message) || e), 'error');
    })
    [fn](_snkData);
}

function _loadBankAccounts() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      _bankData = r.accounts || [];
      _renderBankList();
    })
    .withFailureHandler(function() {})
    .getBankAccounts();
}

function _renderBankList() {
  var container = document.getElementById('bank-list-container');
  if (!container) return;
  if (_bankData.length === 0) {
    container.innerHTML = '<div class="text-xs text-slate-400 italic">Belum ada bank account. Klik Tambah untuk menambahkan.</div>';

  _bankData.forEach(function(acc, idx) {

        '<i class="fa-solid fa-building-columns text-sm"></i></div>' +
      '<div class="flex-1 min-w-0">' +
        '<p class="text-sm font-bold text-slate-700">' + _escHtml(acc.label) + '</p>' +

      '</div>' +

  });

function showAddBankModal() {
  document.getElementById('bank-modal-title').textContent = 'Tambah Bank Account';
  document.getElementById('bank-edit-id').value = '';
  document.getElementById('bank-label').value  = '';
  document.getElementById('bank-detail').value = '';
  document.getElementById('modal-bank').classList.remove('hidden');
  document.getElementById('bank-label').focus();
}

function showEditBankModal(idx) {
  var acc = _bankData[idx];
  if (!acc) return;
  document.getElementById('bank-modal-title').textContent = 'Edit Bank Account';
  document.getElementById('bank-edit-id').value  = String(idx);
  document.getElementById('bank-label').value    = acc.label  || '';
  document.getElementById('bank-detail').value   = acc.detail || '';
  document.getElementById('modal-bank').classList.remove('hidden');
  document.getElementById('bank-label').focus();
}

function closeBankModal() {
  document.getElementById('modal-bank').classList.add('hidden');
}

function saveBankAccount() {
  var label  = (document.getElementById('bank-label').value  || '').trim();
  var detail = (document.getElementById('bank-detail').value || '').trim();
  if (!label || !detail) { showToast('Nama bank dan detail rekening wajib diisi.', 'error'); return; }
  var editId = document.getElementById('bank-edit-id').value;
  if (editId !== '') {
    _bankData[parseInt(editId)] = { id: _bankData[parseInt(editId)].id, label: label, detail: detail };
  } else {
    _bankData.push({ id: Date.now().toString(), label: label, detail: detail });
  }
  _persistBankAccounts();
}

function deleteBankAccount(idx) {
  showConfirm({
    type: 'danger',
    title: 'Hapus Bank Account?',
    message: 'Hapus bank account "' + (_bankData[idx] && _bankData[idx].label) + '"?',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      _bankData.splice(idx, 1);
      _persistBankAccounts();
    }
  });
}

function _persistBankAccounts() {
  google.script.run
    .withSuccessHandler(function(r) {
      closeBankModal();
      _renderBankList();
      showToast((r && r.message) || 'Tersimpan.', r && r.success ? 'success' : 'error');
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message, 'error');
    })
    .saveBankAccounts(_bankData);
}

var _signBase64Pending = null; // base64 baru yang belum disimpan

function _loadDocSign() {
  google.script.run
    .withSuccessHandler(function(cfg) {
      var enableEl = document.getElementById('sign-enabled');
      if (enableEl) enableEl.checked = cfg.sigEnabled !== false;
      if (cfg.sigBase64) {
        _showSignPreview('data:image/png;base64,' + cfg.sigBase64);
      }
    })
    .withFailureHandler(function(e) { showToast('Gagal load konfigurasi tanda tangan: ' + e.message, 'error'); })
    .getDocSignConfig();
}

function _showSignPreview(dataUrl) {
  var wrap = document.getElementById('sign-preview-wrap');
  var img  = document.getElementById('sign-preview');
  var clrBtn = document.getElementById('sign-clear-btn');
  if (wrap) { wrap.classList.remove('hidden'); wrap.style.display = 'flex'; }
  if (img)  img.src = dataUrl;
  if (clrBtn) { clrBtn.classList.remove('hidden'); clrBtn.style.display = 'flex'; }
}

window.onSignFileChange = function(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    _signBase64Pending = e.target.result; // data:image/...;base64,...
    _showSignPreview(_signBase64Pending);
  };
  reader.readAsDataURL(file);
};

window.clearSignature = function() {
  showConfirm({
    type: 'danger',
    title: 'Hapus Tanda Tangan?',
    message: 'Hapus gambar tanda tangan?',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      _signBase64Pending = null;
      var wrap   = document.getElementById('sign-preview-wrap');
      var img    = document.getElementById('sign-preview');
      var clrBtn = document.getElementById('sign-clear-btn');
      if (wrap)   { wrap.classList.add('hidden'); wrap.style.display = ''; }
      if (img)    img.src = '';
      if (clrBtn) { clrBtn.classList.add('hidden'); clrBtn.style.display = ''; }
      document.getElementById('sign-file-input').value = '';
      google.script.run
        .withSuccessHandler(function() { showToast('Tanda tangan dihapus.', 'success'); })
        .clearSignatureImage();
    }
  });
};

var _akunPembayaranData = [];

function _loadAkunPembayaranList() {
  if (typeof google === 'undefined') return;

    .withSuccessHandler(function(res) {
      if (!res || !res.success) return;
      _akunPembayaranData = res.list || [];
      _renderAkunPembayaranList();
    })
    .withFailureHandler(function() {})
    .getAkunPembayaranList();
}

function _renderAkunPembayaranList() {
  var container = document.getElementById('akun-pembayaran-list');
  if (!container) return;

      '<div class="flex-1 min-w-0">' +
        '<p class="text-sm font-bold text-slate-700">' + _escHtml(akun.namaAkun) + ' <span class="text-xs font-semibold text-slate-400">(' + _escHtml(akun.tipe) + ')</span>' +
          (locked ? ' <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold ml-1">TERKUNCI</span>' : '') +
        '</p>' +
        '<p class="text-xs text-slate-400">' + _escHtml(akun.keterangan || '') + '</p>' +
      '</div>' +
      '<div class="flex gap-1 shrink-0">' +

        (!locked ? '<button onclick="hapusAkunPembayaranUI(\'' + akun.id + '\')" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>' : '') +
      '</div>' +
    '</div>';
    container.insertAdjacentHTML('beforeend', html);

function bukaModalTambahAkunPembayaran() {

  document.getElementById('akun-nama').value = '';

function simpanAkunPembayaranModal() {
  var id         = document.getElementById('akun-edit-id').value.trim();
  var namaAkun   = document.getElementById('akun-nama').value.trim();
  var tipe       = document.getElementById('akun-tipe').value;
  var keterangan = document.getElementById('akun-keterangan').value.trim();
  var detail     = (document.getElementById('akun-detail') || {}).value ? document.getElementById('akun-detail').value.trim() : '';
  var status     = id ? document.getElementById('akun-status').value : 'Aktif';

  if (!namaAkun) { showToast('Nama akun wajib diisi.', 'error'); return; }

  document.getElementById('modal-akun-pembayaran').classList.add('hidden');
  toggleLoader(true, 'Menyimpan akun...');
  if (typeof google === 'undefined') { toggleLoader(false); return; }

  var fn      = id ? 'editAkunPembayaran' : 'simpanAkunPembayaran';
  var payload = id
    ? { id: id, namaAkun: namaAkun, tipe: tipe, keterangan: keterangan, detail: detail, status: status }
    : { namaAkun: namaAkun, tipe: tipe, keterangan: keterangan, detail: detail, dibuatOleh: _currentUser ? _currentUser.nama : '' };

  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      showToast((res && res.message) || 'Tersimpan.', res && res.success ? 'success' : 'error');
      if (res && res.success) _loadAkunPembayaranList();
    })
    .withFailureHandler(function(e) {
      toggleLoader(false);
      showToast('Error: ' + e.message, 'error');
    })
    [fn](payload);
}

function hapusAkunPembayaranUI(id) {
  var akun = _akunPembayaranData.find(function(a){ return a.id === id; });
  showConfirm({
    type: 'danger',
    title: 'Hapus Akun Pembayaran?',
    message: 'Hapus akun "' + (akun ? akun.namaAkun : id) + '"?',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      toggleLoader(true, 'Menghapus akun...');
      if (typeof google === 'undefined') { toggleLoader(false); return; }
      google.script.run
        .withSuccessHandler(function(res) {
          toggleLoader(false);
          showToast((res && res.message) || 'Terhapus.', res && res.success ? 'success' : 'error');
          if (res && res.success) _loadAkunPembayaranList();
        })
        .withFailureHandler(function(e) {
          toggleLoader(false);
          showToast('Error: ' + e.message, 'error');
        })
        .hapusAkunPembayaran(id);
    }
  });
}

window.simpanDocSign = function() {
  var enabled = document.getElementById('sign-enabled').checked;
  var payload = { sigEnabled: enabled };
  if (typeof google === 'undefined') { showToast('Backend tidak tersedia.', 'error'); return; }
  toggleLoader(true, 'Menyimpan tanda tangan...');
  var _done = function() {
    toggleLoader(false);
    showToast('Pengaturan tanda tangan disimpan.', 'success');
  };
  var _fail = function(e) {
    toggleLoader(false);
    showToast('Gagal simpan: ' + ((e && e.message) || e), 'error');
  };
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success === false) { _fail({ message: r.message || 'Gagal menyimpan.' }); return; }
      if (_signBase64Pending) {
        google.script.run
          .withSuccessHandler(function(r2) {
            if (r2 && r2.success === false) { _fail({ message: r2.message || 'Gagal simpan gambar.' }); return; }
            _signBase64Pending = null;
            _done();
          })
          .withFailureHandler(_fail)
          .saveSignatureImage(_signBase64Pending);
      } else {
        _done();
      }
    })
    .withFailureHandler(_fail)
    .saveDocSignConfig(payload);
};
