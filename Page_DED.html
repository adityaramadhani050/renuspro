      <section id="page-ded" class="page-section">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Detail Engineering Design</h2>
          <span id="ded-role-hint" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500"></span>
        </div>

        <!-- HOME: ringkasan + daftar Work Order -->
        <div id="ded-home">
          <div id="ded-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>

          <!-- Antrean Review (khusus Lead Engineer/Admin) -->
          <div id="ded-review-queue-wrap" class="hidden bg-white rounded-2xl border border-slate-150 p-5 mb-5"></div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
            <div class="relative w-full sm:w-72">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="ded-search" oninput="_dedRenderWOList()" placeholder="Cari No WO / project / klien..."
                class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <select id="ded-filter-se" onchange="_dedRenderWOList()" class="hidden w-full sm:w-auto text-sm border border-slate-200 rounded-xl px-3 py-2.5 bg-white font-semibold text-slate-600 focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100">
              <option value="">Semua Site Engineer</option>
            </select>
            <div class="flex items-center gap-2 sm:ml-auto">
              <button onclick="_engMuatUlang('loadDED', this)" title="Muat ulang data" class="inline-flex items-center justify-center bg-white hover:bg-slate-50 text-slate-500 border border-slate-200 h-[42px] w-[42px] rounded-xl shadow-sm transition shrink-0"><i class="fa-solid fa-rotate-right"></i></button>
              <button id="ded-add-project-btn" onclick="_dedOpenAddProject()" class="hidden flex-1 sm:flex-none justify-center bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Project</button>
              <button id="ded-manage-btn" onclick="bukaDEDManage()" class="hidden flex-1 sm:flex-none justify-center bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-list-check"></i> Kelola Checklist</button>
            </div>
          </div>
          <!-- Tab: Sedang Proses vs Selesai -->
          <div class="flex items-center gap-2 mb-3 border-b border-slate-150">
            <button id="ded-tab-proses-btn" onclick="_dedSwitchTab('proses')" class="px-4 py-2 text-sm font-bold border-b-2 border-teal-500 text-teal-600 -mb-px transition">
              Proses <span id="ded-tab-proses-badge" class="ml-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-teal-100 text-teal-700">0</span>
            </button>
            <button id="ded-tab-selesai-btn" onclick="_dedSwitchTab('selesai')" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition">
              Approved <span id="ded-tab-selesai-badge" class="ml-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
            </button>
          </div>
          <div id="ded-wo-list" class="space-y-2">
            <div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>
          </div>
        </div>

        <!-- KELOLA CHECKLIST (Lead Engineer / Admin) -->
        <div id="ded-manage" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliDEDHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
            <button onclick="_dedAddItem()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2"><i class="fa-solid fa-plus"></i> Tambah Dokumen</button>
          </div>
          <div id="ded-manage-body" class="space-y-2"></div>
        </div>

        <!-- DETAIL: dokumen per Work Order -->
        <div id="ded-detail" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliDEDHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali ke daftar</button>
            <div id="ded-detail-actions"></div>
          </div>
          <div id="ded-detail-head" class="bg-white rounded-2xl border border-slate-150 p-5 mb-4"></div>
          <div id="ded-detail-body" class="space-y-3"></div>
        </div>

        <!-- MODAL: Tambah Project ke DED -->
        <div id="modal-ded-project" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-teal-100 text-teal-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-diagram-project text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tambah Project ke DED</h3>
            </div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Order</label>
            <select id="ded-project-wo" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 mb-4">
              <option value="">Memuat...</option>
            </select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tugaskan Site Engineer <span class="text-slate-300 normal-case font-semibold">(opsional)</span></label>
            <div id="ded-project-se" class="max-h-44 overflow-y-auto border border-slate-150 rounded-xl p-2 mb-5">
              <div class="text-xs text-slate-400 py-1 px-1"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat site engineer...</div>
            </div>
            <div class="flex justify-end gap-3">
              <button type="button" onclick="_dedCloseAddProject()" class="px-5 py-2.5 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">Batal</button>
              <button type="button" onclick="_dedSaveAddProject()" class="px-6 py-2.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Tambah / Edit jenis dokumen -->
        <div id="modal-ded-item" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-teal-100 text-teal-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-file-lines text-sm"></i></span>
              <h3 id="ded-item-modal-title" class="text-base font-extrabold text-slate-800">Tambah Dokumen</h3>
            </div>
            <form onsubmit="_dedSaveItemModal(event)">
              <input type="hidden" id="ded-item-modal-kode">
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nama Dokumen</label>
              <input type="text" id="ded-item-modal-input" autocomplete="off"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100"
                placeholder="mis. Single Line Diagram (SLD)">
              <label class="mt-3 flex items-center gap-2 text-sm font-semibold text-slate-600 cursor-pointer select-none">
                <input type="checkbox" id="ded-item-modal-wajib" class="accent-teal-600"> Wajib diisi
              </label>
              <div class="mt-3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Instruksi untuk Site Engineer <span class="text-slate-300 normal-case font-semibold">(opsional)</span></label>
                <textarea id="ded-item-modal-instr" rows="3" placeholder="mis. Sertakan revisi terakhir yang sudah di-approve konsultan" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 resize-none"></textarea>
              </div>
              <div class="flex justify-end gap-3 mt-5">
                <button type="button" onclick="_dedCloseItemModal()" class="px-5 py-2.5 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold transition">Batal</button>
                <button type="submit" class="px-6 py-2.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </section>
