<script>
function toggleSidebar() {
  var sidebar = document.getElementById('main-sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var icon    = document.getElementById('hamburger-icon');

  if (!sidebar) {
    console.warn('[RenusPro] #main-sidebar tidak ditemukan. Pastikan id="main-sidebar" sudah ditambahkan ke tag <aside>.');
    return;
  }

  var isOpen = sidebar.classList.contains('sidebar-open');

  if (isOpen) {
    // Tutup sidebar
    sidebar.classList.remove('sidebar-open');
    if (overlay) overlay.classList.remove('open');
    if (icon) icon.className = 'fas fa-bars text-base';
  } else {
    // Buka sidebar
    sidebar.classList.add('sidebar-open');
    if (overlay) overlay.classList.add('open');
    if (icon) icon.className = 'fas fa-times text-base';
  }
}

function closeSidebar() {
  var sidebar = document.getElementById('main-sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var icon    = document.getElementById('hamburger-icon');

  if (!sidebar) return;
  sidebar.classList.remove('sidebar-open');
  if (overlay) overlay.classList.remove('open');
  if (icon) icon.className = 'fas fa-bars text-base';
}

// Auto-close sidebar saat nav item diklik di mobile
(function() {
  function _attachNavClosers() {
    document.querySelectorAll('.nav-item').forEach(function(btn) {
      // Hindari attach listener duplikat
      if (btn.dataset.sidebarClose) return;
      btn.dataset.sidebarClose = '1';
      btn.addEventListener('click', function() {
        if (window.innerWidth < 768) closeSidebar();
      });
    });
  }
  // Attach saat DOM siap
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _attachNavClosers);
  } else {
    _attachNavClosers();
  }
})();

// Tutup sidebar saat tombol Escape ditekan
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSidebar();
});

function _detectPenawaranType(kelompokList) {
  const keywords = ['jasa', 'instalasi', 'komisioning', 'commissioning', 'pemasangan', 'pasang', 'instal', 'install'];
  for (const k of kelompokList) {
    const namaK = (k.namaKelompok || '').toLowerCase();
    if (keywords.some(kw => namaK.includes(kw))) return 'jasa';
    for (const si of (k.subItems || [])) {
      const desc = (si.deskripsi || '').toLowerCase();
      if (keywords.some(kw => desc.includes(kw))) return 'jasa';
    }
  }
  return 'only';
}

async function _mergePdfDenganTC(mainPdfBytes, kelompokList) {
  const { PDFDocument } = PDFLib;
  const tipe = _detectPenawaranType(kelompokList);

  // T&C base64 di-inline di frontend (TC_Assets.html) → sepenuhnya sisi klien,
  // TIDAK bergantung ke Apps Script sama sekali.
  const tcB64 = (tipe === 'jasa') ? window.TC_PDF_JASA_B64 : window.TC_PDF_MATERIAL_B64;
  if (!tcB64) throw new Error('Aset T&C (' + tipe + ') tidak tersedia di build ini.');

  const tcBinary = atob(tcB64);
  const tcBytes  = new Uint8Array(tcBinary.length);
  for (let i = 0; i < tcBinary.length; i++) tcBytes[i] = tcBinary.charCodeAt(i);

  const mainDoc = await PDFDocument.load(mainPdfBytes);
  const tcDoc   = await PDFDocument.load(tcBytes);

  // T&C Jasa memiliki halaman kosong di akhir — skip halaman terakhirnya
  const totalTcPages = tcDoc.getPageCount();
  const pageIndices  = tipe === 'jasa'
    ? Array.from({ length: totalTcPages - 1 }, (_, i) => i)
    : tcDoc.getPageIndices();

  const tcPages = await mainDoc.copyPages(tcDoc, pageIndices);
  tcPages.forEach(page => mainDoc.addPage(page));

  return await mainDoc.save();
}

function _initSelectProdukDiBaris(kontainer) {
  // kontainer bisa berupa div kelompok atau tr baris
  const selects = kontainer.querySelectorAll
    ? kontainer.querySelectorAll('.select-produk:not([data-sd-init])')
    : [];

  selects.forEach(function(sel) {
    if (sel.dataset.sdInit) return;
    const uid = 'sd-produk-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    sel.id = uid;
    initSearchableDropdown(uid, {
      placeholder: '-- Pilih Item --',
      searchPlaceholder: 'Cari produk/jasa...',
      onChange: function() {
        onItemSelectChanged(sel);
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  KONTEKS WORK ORDER (read-only) — dipakai Site Engineer di BOM/DED/QC.
//  Menyatukan detail item Material/Jasa, budget, catatan customer, site
//  survey, & MoM Hand Over dalam satu modal. Data via getWOContextByWO.
// ═══════════════════════════════════════════════════════════════════════════
function _woCtxEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tutupWOContext(){ var m=document.getElementById('modal-wo-context'); if(m) m.classList.add('hidden'); }
function openWOContext(noWO){
  var modal = document.getElementById('modal-wo-context');
  var body = document.getElementById('wo-ctx-body');
  var title = document.getElementById('wo-ctx-title');
  if (!modal || !body) return;
  if (title) title.innerText = 'Info Work Order - ' + noWO;
  body.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat konteks WO...</div>';
  modal.classList.remove('hidden');
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res){ _renderWOContext(res); })
    .withFailureHandler(function(err){ body.innerHTML = '<div class="p-6 text-center text-rose-400 text-sm">Gagal memuat: ' + ((err&&err.message)||err) + '</div>'; })
    .getWOContextByWO(noWO);
}
function _woCtxInfoRow(label, val){
  return '<div class="flex gap-2"><span class="font-bold text-slate-500 w-28 shrink-0">' + label + '</span><span class="text-slate-800 min-w-0">: ' + val + '</span></div>';
}
function _woCtxSumRow(label, val, cls){
  return '<div class="flex items-center justify-between px-3 py-1.5 border-b border-slate-100 ' + (cls||'') + '"><span>' + label + '</span><span>' + val + '</span></div>';
}
// Tabel item per-kelompok (gaya Lihat WO), hanya kolom HPP — tanpa nilai jual/margin.
function _woCtxItemTable(kelompok){
  var esc = _woCtxEsc;
  var rp = function(v){ return Math.round(Math.abs(v||0)).toLocaleString('id-ID'); };
  var rows = '';
  (kelompok||[]).forEach(function(k, ki){
    var letter = String.fromCharCode(65+ki);
    rows += '<tr class="bg-slate-100"><td colspan="6" class="px-2 py-1.5 font-bold text-slate-700 text-xs">' + esc(letter + '. ' + (k.nama||'').toUpperCase()) + '</td></tr>';
    (k.items||[]).forEach(function(s, si){
      rows += '<tr class="border-b border-slate-100">'
        + '<td class="px-2 py-1.5 text-center text-slate-500">' + (si+1) + '</td>'
        + '<td class="px-2 py-1.5">' + esc(s.deskripsi||'') + '</td>'
        + '<td class="px-2 py-1.5 text-center">' + (s.qty||0) + '</td>'
        + '<td class="px-2 py-1.5 text-center">' + esc(s.unit||'') + '</td>'
        + '<td class="px-2 py-1.5 text-right bg-rose-50 text-rose-700 font-semibold">' + rp(s.hpp) + '</td>'
        + '<td class="px-2 py-1.5 text-right bg-rose-50 text-rose-700 font-semibold">' + rp(s.totalHpp) + '</td>'
        + '</tr>';
    });
  });
  if (!rows) rows = '<tr><td colspan="6" class="px-2 py-4 text-center text-slate-400">Tidak ada item.</td></tr>';
  return '<div class="overflow-x-auto rounded-xl border border-slate-200 mb-4"><table class="w-full text-xs min-w-[520px]">'
    + '<thead><tr class="bg-blue-700 text-white text-[11px]"><th class="px-2 py-2 font-bold">No</th><th class="px-2 py-2 font-bold text-left">Deskripsi Produk / Jasa</th><th class="px-2 py-2 font-bold">Qty</th><th class="px-2 py-2 font-bold">Unit</th><th class="px-2 py-2 font-bold text-right bg-rose-800">HPP Satuan</th><th class="px-2 py-2 font-bold text-right bg-rose-800">Total HPP</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}
function _renderWOContext(res){
  var body = document.getElementById('wo-ctx-body'); if (!body) return;
  if (!res || !res.success){ body.innerHTML = '<div class="p-6 text-center text-rose-400 text-sm">' + ((res&&res.message)||'Gagal memuat.') + '</div>'; return; }
  window._woCtxData = res;   // untuk Export PDF Info WO
  var esc = _woCtxEsc;
  var rp = function(v){ return Math.round(v||0).toLocaleString('id-ID'); };
  var b = res.budget || {};
  var html = '';
  // Tombol Export PDF Info WO dipindah ke footer modal (lihat Modals.html).
  // Header — gaya info-grid Lihat WO.
  html += '<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1.5 text-xs mb-4">'
    + _woCtxInfoRow('No Penawaran', esc(res.id||'-') + (res.rev!==''&&res.rev!=null ? ' (Rev ' + esc(String(res.rev)) + ')' : ''))
    + _woCtxInfoRow('Klien', esc(res.namaKlien||'-'))
    + _woCtxInfoRow('Tanggal', esc(res.tanggal||'-'))
    + _woCtxInfoRow('Project', esc(res.namaProject||'-'))
    + _woCtxInfoRow('Sales / PIC', esc(res.dibuatOleh||'-'))
    + _woCtxInfoRow('Jenis WO', esc(res.jenisWO||'-'))
    + '</div>';
  // Catatan (2 kolom: kiri Customer, kanan MoM HO) DI ATAS tabel item —
  // agar Site Engineer membaca catatan dulu sebelum melihat item.
  var noteCust = '<div class="rounded-xl border border-amber-200 bg-amber-50 p-3"><div class="text-[11px] font-bold text-amber-700 mb-1"><i class="fa-solid fa-comment-dots mr-1"></i>Catatan Customer</div><div class="text-xs text-amber-900 whitespace-pre-wrap">' + (res.catatanCustomer ? esc(res.catatanCustomer) : '<span class="text-amber-400">Tidak ada catatan.</span>') + '</div></div>';
  var noteHO = '<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-3"><div class="text-[11px] font-bold text-emerald-700 mb-1"><i class="fa-solid fa-handshake mr-1"></i>Catatan Hasil Hand Over (MoM)</div><div class="text-xs text-emerald-900 whitespace-pre-wrap">' + ((res.ho && res.ho.mom) ? esc(res.ho.mom) : '<span class="text-emerald-400">Belum ada MoM.</span>') + '</div></div>';
  html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">' + noteCust + noteHO + '</div>';
  // Detail item per-kelompok (HPP only).
  html += _woCtxItemTable(res.kelompok || []);
  var surv = res.surveys || [];
  html += '<div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-map-location-dot mr-1 text-blue-400"></i>Site Survey (' + surv.length + ')</div>';
  if (!surv.length) html += '<div class="text-xs text-slate-400">Belum ada site survey tertaut.</div>';
  else html += surv.map(function(s){
    var meta = [s.namaPIC, s.alamat, s.tanggalSurvey].filter(Boolean).join(' · ');
    var detailBtn = (typeof bukaDetailSiteSurvey === 'function')
      ? '<button onclick="tutupWOContext();bukaDetailSiteSurvey(\'' + esc(s.id) + '\', {readOnly:true})" class="text-[11px] font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg shrink-0"><i class="fa-solid fa-eye mr-1"></i>Detail</button>'
      : '';
    // Tombol PDF per-survey dihapus — laporan site survey kini terlampir otomatis
    // di dalam Export PDF Info WO (footer modal).
    return '<div class="flex items-center justify-between gap-2 border border-slate-150 rounded-xl px-3 py-2 mb-1.5">'
      + '<div class="min-w-0"><div class="text-xs font-bold text-slate-700 truncate">' + esc(s.namaSite||s.id) + '</div><div class="text-[10px] text-slate-400 truncate">' + esc(meta) + '</div></div>'
      + '<div class="flex items-center gap-1.5 shrink-0">' + detailBtn + '</div></div>';
  }).join('');
  body.innerHTML = html;
}
</script>
