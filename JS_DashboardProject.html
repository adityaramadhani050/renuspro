<script>
// ═══════════════════════════════════════════════════════════════════════════
//  DASHBOARD PROJECT (owner/admin) — data dari RPC dashboard_project()
//  Chart.js dimuat LAZY (hanya saat halaman ini dibuka) agar ringan.
// ═══════════════════════════════════════════════════════════════════════════
var _dpChartTren = null, _dpChartHO = null, _dpChartLib = null;

function _dpRp(n) { return 'Rp ' + (Math.round(Number(n) || 0)).toLocaleString('id-ID'); }
function _dpEsc(s) { return (typeof _escHtml === 'function') ? _escHtml(s == null ? '' : String(s)) : String(s == null ? '' : s); }
function _dpSet(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }

function _dpChartJs() {
  if (_dpChartLib) return Promise.resolve(_dpChartLib);
  return import('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/auto/+esm')
    .then(function(mod) { _dpChartLib = mod.default || mod.Chart || mod; return _dpChartLib; });
}

window.loadDashboardProject = function() {
  if (typeof google === 'undefined') return;
  document.getElementById('dp-risiko-body').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.success) {
      document.getElementById('dp-risiko-body').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-rose-400">' + _dpEsc((res && res.message) || 'Gagal memuat.') + '</td></tr>';
      return;
    }
    _dpRender(res.data || {});
  }).withFailureHandler(function(err) {
    document.getElementById('dp-risiko-body').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-rose-400">Gagal: ' + _dpEsc((err && err.message) || err) + '</td></tr>';
  }).getDashboardProject();
};

function _dpRender(d) {
  var wo = d.wo || {}, ho = d.handOver || {}, sch = d.schedule || {}, qc = d.qc || {}, ded = d.ded || {}, bom = d.bom || {}, mtn = d.maintenance || {};
  // KPI
  _dpSet('dp-kpi-aktif', wo.aktif || 0);
  _dpSet('dp-kpi-selesai', wo.selesai || 0);
  _dpSet('dp-kpi-kontrak', _dpRp(wo.nilaiKontrakAktif));
  _dpSet('dp-kpi-margin', (wo.marginAvg || 0) + '%');
  // Schedule
  var prog = Math.round(sch.progressRata || 0);
  _dpSet('dp-sch-prog', prog + '%');
  var bar = document.getElementById('dp-sch-bar'); if (bar) bar.style.width = prog + '%';
  _dpSet('dp-sch-total', sch.terjadwal || 0);
  _dpSet('dp-sch-telat', sch.telat || 0);
  // QC
  _dpSet('dp-qc-appr', qc.approved || 0); _dpSet('dp-qc-pend', qc.pending || 0); _dpSet('dp-qc-rej', qc.rejected || 0); _dpSet('dp-qc-worej', qc.woRejected || 0);
  // DED/BOM
  _dpSet('dp-ded-appr', ded.approved || 0); _dpSet('dp-ded-pend', ded.pending || 0); _dpSet('dp-ded-rej', ded.rejected || 0);
  _dpSet('dp-bom-appr', bom.approved || 0); _dpSet('dp-bom-pend', bom.pending || 0); _dpSet('dp-bom-rej', bom.rejected || 0);
  // Maintenance
  _dpSet('dp-mtn-diajukan', mtn.diajukan || 0); _dpSet('dp-mtn-dijadwalkan', mtn.dijadwalkan || 0); _dpSet('dp-mtn-dikerjakan', mtn.dikerjakan || 0); _dpSet('dp-mtn-selesai', mtn.selesai || 0);

  // Tabel Project berisiko
  var risiko = Array.isArray(d.risiko) ? d.risiko : [];
  var rb = document.getElementById('dp-risiko-body');
  if (rb) rb.innerHTML = risiko.length ? risiko.map(function(r) {
    return '<tr class="hover:bg-slate-50">'
      + '<td class="p-3"><div class="font-semibold text-slate-700 text-xs">' + _dpEsc(r.namaProject || r.noWO) + '</div><div class="text-[10px] text-slate-400 font-mono">' + _dpEsc(r.noWO) + '</div></td>'
      + '<td class="p-3 text-center"><span class="text-xs font-bold ' + ((r.progress || 0) < 50 ? 'text-rose-600' : 'text-slate-600') + '">' + (r.progress || 0) + '%</span></td>'
      + '<td class="p-3 text-center">' + (r.tugasTelat > 0 ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">' + r.tugasTelat + '</span>' : '<span class="text-slate-300">—</span>') + '</td>'
      + '<td class="p-3 text-center">' + (r.qcRejected > 0 ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">' + r.qcRejected + '</span>' : '<span class="text-slate-300">—</span>') + '</td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="4" class="p-6 text-center text-emerald-500"><i class="fa-solid fa-circle-check mr-1"></i>Tidak ada project berisiko.</td></tr>';

  // Tabel kinerja tim
  var se = Array.isArray(d.kinerjaSE) ? d.kinerjaSE : [];
  var sb = document.getElementById('dp-se-body');
  if (sb) sb.innerHTML = se.length ? se.map(function(x) {
    return '<tr class="hover:bg-slate-50">'
      + '<td class="p-3 font-semibold text-slate-700 text-xs">' + _dpEsc(x.nama) + '</td>'
      + '<td class="p-3 text-center text-xs font-bold text-slate-600">' + (x.item || 0) + '</td>'
      + '<td class="p-3 text-center text-xs font-bold text-emerald-600">' + (x.approved || 0) + '</td>'
      + '<td class="p-3 text-center text-xs font-bold text-amber-600">' + (x.pending || 0) + '</td>'
      + '<td class="p-3 text-center text-xs font-bold text-rose-600">' + (x.rejected || 0) + '</td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada data.</td></tr>';

  // Grafik (lazy Chart.js)
  _dpChartJs().then(function(Chart) {
    var tren = Array.isArray(d.trenDeal) ? d.trenDeal : [];
    var labels = tren.map(function(t) { return t.bln; });
    var data = tren.map(function(t) { return t.jml; });
    var ctxT = document.getElementById('dp-chart-tren');
    if (ctxT) {
      if (_dpChartTren) _dpChartTren.destroy();
      _dpChartTren = new Chart(ctxT, {
        type: 'line',
        data: { labels: labels, datasets: [{ label: 'Project', data: data, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.12)', fill: true, tension: 0.35, pointRadius: 3 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }
    var ctxH = document.getElementById('dp-chart-ho');
    if (ctxH) {
      if (_dpChartHO) _dpChartHO.destroy();
      _dpChartHO = new Chart(ctxH, {
        type: 'doughnut',
        data: { labels: ['Selesai', 'Dijadwalkan', 'Diminta', 'Belum'], datasets: [{ data: [ho.selesai || 0, ho.dijadwalkan || 0, ho.diminta || 0, ho.belum || 0], backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#cbd5e1'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
      });
    }
  }).catch(function() { /* Chart gagal dimuat — angka & tabel tetap tampil */ });
}
</script>
