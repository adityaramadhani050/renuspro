<script>
// ================================================================
//  LAPORAN PROFITABILITAS PROJECT — JavaScript (Modul 3 Fase 4)
// ================================================================

var _lpData      = null;
var _lpActiveTab = 'profit';
var _lpFilter    = { mode: 'thisMonth', from: null, to: null };

function _fmtRpLP(n) {
  n = parseFloat(n) || 0;
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function _fmtPctLP(n) {
  if (n === null || n === undefined) return '—';
  return parseFloat(n).toFixed(1) + '%';
}

// ── Filter preset ────────────────────────────────────────────────

window.setLPPreset = function(mode) {
  _lpFilter.mode = mode;
  document.querySelectorAll('.lp-preset-btn').forEach(function(b) {
    b.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600');
    b.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
  });
  var active = document.getElementById('lp-preset-' + mode);
  if (active) {
    active.classList.add('active', 'bg-blue-600', 'text-white', 'border-blue-600');
    active.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
  }
  var customRange = document.getElementById('lp-custom-range');
  if (mode === 'custom') {
    customRange.classList.remove('hidden');
    customRange.style.display = 'flex';
    return;
  }
  customRange.classList.add('hidden');

  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if (mode === 'thisMonth') {
    _lpFilter.from = new Date(y, m, 1);
    _lpFilter.to   = new Date(y, m + 1, 0);
  } else if (mode === 'lastMonth') {
    var lm = m === 0 ? 11 : m - 1, ly = m === 0 ? y - 1 : y;
    _lpFilter.from = new Date(ly, lm, 1);
    _lpFilter.to   = new Date(ly, lm + 1, 0);
  } else if (mode === 'thisYear') {
    _lpFilter.from = new Date(y, 0, 1);
    _lpFilter.to   = new Date(y, 11, 31);
  } else { // all
    _lpFilter.from = null;
    _lpFilter.to   = null;
  }
  _lpUpdatePeriodLabel();
  loadLaporanProfitabilitas();
};

window.applyLPCustomFilter = function() {
  var fromVal = document.getElementById('lp-date-from').value;
  var toVal   = document.getElementById('lp-date-to').value;
  if (!fromVal || !toVal) { showNotification('Pilih tanggal mulai dan akhir.', 'error'); return; }
  _lpFilter.from = new Date(fromVal);
  _lpFilter.to   = new Date(toVal);
  _lpFilter.to.setHours(23, 59, 59);
  _lpUpdatePeriodLabel();
  loadLaporanProfitabilitas();
};

function _lpUpdatePeriodLabel() {
  var el = document.getElementById('lp-period-label');
  if (!el) return;
  var f = _lpFilter;
  if (!f.from && !f.to) { el.textContent = 'Semua Periode'; return; }
  var opts = { day: '2-digit', month: 'short', year: 'numeric' };
  var from = f.from ? f.from.toLocaleDateString('id-ID', opts) : '';
  var to   = f.to   ? f.to.toLocaleDateString('id-ID', opts)   : '';
  el.textContent = from + (to && to !== from ? ' – ' + to : '');
}

function _lpBuildParams() {
  var fmt = function(d) {
    return d.getFullYear() + '-'
      + ('0' + (d.getMonth() + 1)).slice(-2) + '-'
      + ('0' + d.getDate()).slice(-2);
  };
  return {
    tanggalDari:   _lpFilter.from ? fmt(_lpFilter.from) : '',
    tanggalSampai: _lpFilter.to   ? fmt(_lpFilter.to)   : ''
  };
}

// ── Load ─────────────────────────────────────────────────────────

window.loadLaporanProfitabilitas = function() {
  var params = _lpBuildParams();

  document.getElementById('lp-table-profit').innerHTML =
    '<tr><td colspan="8" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  document.getElementById('lp-table-akun').innerHTML =
    '<tr><td colspan="2" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';

  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showNotification(res.message || 'Gagal memuat laporan.', 'error');
        return;
      }
      _lpData = res;
      _lpUpdatePeriodLabel();
      _renderLaporanProfit(res);
    })
    .withFailureHandler(function(err) {
      showNotification('Error: ' + err.message, 'error');
    })
    .getLaporanProfitabilitas(params);
};

function _renderLaporanProfit(res) {
  // Summary cards
  var s = res.summary || {};
  document.getElementById('lp-card-kontrak').textContent = _fmtRpLP(s.totalKontrak);
  document.getElementById('lp-card-hpp').textContent     = _fmtRpLP(s.totalRealisasiHPP);
  document.getElementById('lp-card-margin').textContent  = s.rataMarginRealisasi !== null ? _fmtPctLP(s.rataMarginRealisasi) : '—';

  // Tabel profitabilitas
  var rows = res.rows || [];
  if (rows.length === 0) {
    document.getElementById('lp-table-profit').innerHTML =
      '<tr><td colspan="8" class="p-8 text-center text-slate-400">Tidak ada data untuk periode ini.</td></tr>';
  } else {
    var html = '';
    rows.forEach(function(r) {
      var overBudget = r.isOverBudget;
      var rowClass   = overBudget ? 'bg-rose-50 hover:bg-rose-100' : 'hover:bg-slate-50';
      var selisihCls = r.selisih >= 0 ? 'text-emerald-600' : 'text-rose-600';
      html += '<tr class="' + rowClass + ' transition-colors">';

      // Kolom 1: No WO + Tanggal
      html += '<td class="p-4 whitespace-nowrap">';
      html += '<span class="inline-flex items-center bg-emerald-50 text-emerald-700 font-extrabold px-2 py-0.5 rounded-lg border border-emerald-100 text-xs">';
      html += '<i class="fa-solid fa-clipboard-check mr-1 text-[10px]"></i>' + _escLP(r.noWO);
      html += '</span>';
      html += '<div class="text-[10px] text-slate-400 mt-1">' + _escLP(r.tanggal) + '</div>';
      html += '</td>';

      // Kolom 2: Customer + Project + Sales
      html += '<td class="p-4 max-w-[220px]">';
      html += '<div class="text-[11px] text-slate-400 truncate">' + _escLP(r.namaKlien) + '</div>';
      html += '<div class="text-xs font-semibold text-slate-700 truncate mt-0.5">' + _escLP(r.namaProject) + '</div>';
      if (r.namaSales) {
        html += '<div class="text-[10px] text-slate-400 mt-0.5">' + _escLP(r.namaSales) + '</div>';
      }
      html += '</td>';

      html += '<td class="p-4 text-right text-xs font-semibold text-slate-700">' + _fmtRpLP(r.nilaiKontrak) + '</td>';
      html += '<td class="p-4 text-right text-xs text-slate-600">' + _fmtRpLP(r.estimasiHPP) + '</td>';
      html += '<td class="p-4 text-right text-xs font-bold text-slate-800">' + _fmtRpLP(r.realisasiHPP) + '</td>';
      html += '<td class="p-4 text-right text-xs font-semibold ' + selisihCls + '">' + (r.selisih >= 0 ? '+' : '') + _fmtRpLP(r.selisih) + '</td>';
      html += '<td class="p-4 text-right text-xs text-slate-500">' + _fmtPctLP(r.marginEstimasi) + '</td>';
      html += '<td class="p-4 text-right text-xs font-bold ' + (overBudget ? 'text-rose-600' : 'text-emerald-600') + '">' + _fmtPctLP(r.marginRealisasi) + '</td>';
      html += '</tr>';
    });
    document.getElementById('lp-table-profit').innerHTML = html;
  }

  // Tabel rekap akun
  var akunRows = res.rekapAkun || [];
  if (akunRows.length === 0) {
    document.getElementById('lp-table-akun').innerHTML =
      '<tr><td colspan="2" class="p-8 text-center text-slate-400">Tidak ada data.</td></tr>';
  } else {
    var htmlA = '';
    akunRows.forEach(function(a) {
      htmlA += '<tr class="hover:bg-slate-50">';
      htmlA += '<td class="p-4 text-sm text-slate-700">' + _escLP(a.namaAkun) + '</td>';
      htmlA += '<td class="p-4 text-right font-bold text-slate-800">' + _fmtRpLP(a.total) + '</td>';
      htmlA += '</tr>';
    });
    document.getElementById('lp-table-akun').innerHTML = htmlA;
  }
}

function _escLP(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.switchLPTab = function(tab) {
  _lpActiveTab = tab;
  var active   = 'px-5 py-2 rounded-lg text-sm font-bold transition bg-white text-violet-700 shadow-sm';
  var inactive = 'px-5 py-2 rounded-lg text-sm font-bold transition text-slate-500 hover:text-slate-700';
  document.getElementById('lp-tab-profit-btn').className = tab === 'profit' ? active : inactive;
  document.getElementById('lp-tab-akun-btn').className   = tab === 'akun'   ? active : inactive;
  document.getElementById('lp-tab-profit').classList.toggle('hidden', tab !== 'profit');
  document.getElementById('lp-tab-akun').classList.toggle('hidden',   tab !== 'akun');
};

window.resetFilterLP = function() {
  setLPPreset('thisMonth');
};

// ── Export PDF ─────────────────────────────────────────────────

window.exportLaporanProfitPDF = function() {
  if (!_lpData) { showNotification('Muat data terlebih dahulu.', 'error'); return; }
  try {
    var doc  = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    var PW = 297, PH = 210, ML = 14, MR = 14, CW = PW - ML - MR;
    var DARK   = [30,41,59],  SLATE  = [100,116,139], BLUE  = [30,64,175];
    var GREEN  = [5,150,105], RED    = [190,30,45],   WHITE = [255,255,255];
    var VIOLET = [109,40,217];
    var rp  = function(v) { return 'Rp ' + Math.round(v||0).toLocaleString('id-ID'); };
    var pct = function(v) { return (v == null || v === undefined) ? '—' : parseFloat(v).toFixed(1) + '%'; };

    var rows     = _lpData.rows      || [];
    var s        = _lpData.summary   || {};
    var akunRows = _lpData.rekapAkun || [];
    var periodLabel = document.getElementById('lp-period-label');
    var periodText  = periodLabel ? periodLabel.textContent : '';
    var tglCetak    = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });

    // ── Dark header ──────────────────────────────────────────────
    doc.setFillColor(DARK[0], DARK[1], DARK[2]);
    doc.rect(0, 0, PW, 24, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text('LAPORAN PROFIT', ML, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(190,200,220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(170,195,255);
    doc.text('Periode:', PW - MR, 10, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text(periodText || '-', PW - MR, 15, { align:'right' });
    doc.setFontSize(7); doc.setTextColor(190,200,220);
    doc.text('Dicetak: ' + tglCetak, PW - MR, 20, { align:'right' });

    var y = 30;

    // ── KPI boxes ─────────────────────────────────────────────────
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);
    doc.text('RINGKASAN PROFITABILITAS', ML, y); y += 5;
    var kpiItems = [
      { label:'Total Nilai Kontrak',    value: rp(s.totalKontrak),         color: DARK  },
      { label:'Total Realisasi HPP',    value: rp(s.totalRealisasiHPP),    color: RED   },
      { label:'Rata-rata Margin Real.', value: pct(s.rataMarginRealisasi), color: GREEN }
    ];
    var boxW = (CW - 5) / 3, boxH = 14, gap = 2.5;
    kpiItems.forEach(function(k, i) {
      var bx = ML + i * (boxW + gap), by = y;
      doc.setFillColor(248,250,252); doc.setDrawColor(226,232,240);
      doc.roundedRect(bx, by, boxW, boxH, 2, 2, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
      doc.text(k.label.toUpperCase(), bx + 3, by + 4.5);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(k.color[0],k.color[1],k.color[2]);
      doc.text(k.value, bx + 3, by + 10.5);
    });
    y += boxH + 8;

    // ── Tabel profitabilitas ───────────────────────────────────────
    doc.setFillColor(VIOLET[0],VIOLET[1],VIOLET[2]);
    doc.roundedRect(ML, y, CW, 8, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text('PROFITABILITAS PER WORK ORDER  (' + rows.length + ' WO)', ML + 3, y + 5.5);
    y += 10;

    var tableBody = rows.map(function(r) {
      return [
        (r.noWO || '') + '\n' + (r.tanggal || ''),
        (r.namaKlien || '') + '\n' + (r.namaProject || '') + (r.namaSales ? '\n' + r.namaSales : ''),
        rp(r.nilaiKontrak),
        rp(r.estimasiHPP),
        rp(r.realisasiHPP),
        (r.selisih >= 0 ? '+' : '') + rp(r.selisih),
        pct(r.marginEstimasi),
        pct(r.marginRealisasi)
      ];
    });

    doc.autoTable({
      startY: y, margin: { left: ML, right: MR },
      head: [['No WO / Tgl', 'Customer / Project / Sales', 'Nilai Kontrak', 'Est. HPP', 'Real. HPP', 'Selisih', 'Margin Est.', 'Margin Real.']],
      body: tableBody,
      theme: 'grid',
      styles:     { fontSize: 7, cellPadding: 2, font:'helvetica', textColor: DARK },
      headStyles: { fillColor: [51,65,85], textColor: WHITE, fontStyle:'bold', fontSize: 7 },
      tableWidth: CW,
      columnStyles: {
        0: { cellWidth: 26 },
        1: { cellWidth: 71 },
        2: { halign:'right', cellWidth: 32 },
        3: { halign:'right', cellWidth: 28 },
        4: { halign:'right', cellWidth: 28 },
        5: { halign:'right', cellWidth: 30 },
        6: { halign:'right', cellWidth: 26 },
        7: { halign:'right', cellWidth: 28, fontStyle:'bold' }
      },
      alternateRowStyles: { fillColor: [248,250,252] },
      didParseCell: function(d) {
        if (d.section !== 'body') return;
        var r = rows[d.row.index];
        if (!r) return;
        if (d.column.index === 5) d.cell.styles.textColor = r.isOverBudget ? RED : GREEN;
        if (d.column.index === 7) d.cell.styles.textColor = r.isOverBudget ? RED : GREEN;
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    // ── Rekap Akun ────────────────────────────────────────────────
    if (akunRows.length > 0) {
      if (y > 160) { doc.addPage(); y = 14; }
      doc.setFillColor(DARK[0],DARK[1],DARK[2]);
      doc.roundedRect(ML, y, 120, 8, 1.5, 1.5, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
      doc.text('REKAP PENGELUARAN PER AKUN', ML + 3, y + 5.5);
      y += 10;
      doc.autoTable({
        startY: y, margin: { left: ML, right: MR },
        head: [['Akun Pembayaran', 'Total Pengeluaran']],
        body: akunRows.map(function(a) { return [a.namaAkun, rp(a.total)]; }),
        theme: 'grid',
        styles:     { fontSize: 8, cellPadding: 2.5, font:'helvetica', textColor: DARK },
        headStyles: { fillColor: [51,65,85], textColor: WHITE, fontStyle:'bold', fontSize: 8 },
        columnStyles: { 1: { halign:'right', fontStyle:'bold' } },
        alternateRowStyles: { fillColor: [248,250,252] },
        tableWidth: 120
      });
    }

    // ── Page numbers ──────────────────────────────────────────────
    var totalPages = doc.internal.getNumberOfPages();
    for (var p = 1; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
      doc.text('Halaman ' + p + ' / ' + totalPages, PW / 2, PH - 5, { align:'center' });
      doc.text('PT. RENUS GLOBAL INDONESIA — KONFIDENSIAL', ML, PH - 5);
    }

    var fname = 'LaporanProfit_' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.pdf';
    doc.save(fname);
    showNotification('PDF berhasil diunduh!');
  } catch(e) {
    showNotification('Gagal export PDF: ' + e.message, 'error');
  }
};
</script>
