<script>
    // ================================================================
    // FITUR WORK ORDER — Dashboard terintegrasi dengan Invoice
    // ================================================================

    let _cachedWorkOrderData = [];
    let _woDetailCurrent     = null;
    let _woSurveys           = [];   // survey tertaut ke WO yg sedang dibuka
    let _woAllSurveys        = [];   // semua survey (utk modal picker tautkan)

    // ── Status badge helper ──
    function _woBadge(status) {
      const map = {
        'Belum Ditagih': 'bg-slate-100 text-slate-500',
        'Ditagih':       'bg-blue-100 text-blue-700',
        'Lunas Sebagian':'bg-amber-100 text-amber-700',
        'Lunas':         'bg-emerald-100 text-emerald-800'
      };
      return map[status] || 'bg-slate-100 text-slate-500';
    }

    // Badge status Hand Over untuk kartu WO.
    function _woHoBadge(st) {
      const map = {
        'Diminta':     'bg-amber-100 text-amber-700',
        'Dijadwalkan': 'bg-indigo-100 text-indigo-700',
        'Selesai':     'bg-emerald-100 text-emerald-700',
        'Batal':       'bg-slate-100 text-slate-400'
      };
      const cls = st ? (map[st] || 'bg-slate-100 text-slate-500') : 'bg-slate-100 text-slate-400';
      const label = st ? ('HO: ' + st) : 'Belum HO';
      const icon = (st === 'Selesai') ? 'fa-handshake' : 'fa-handshake-angle';
      return `<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full ${cls}"><i class="fa-solid ${icon}"></i>${label}</span>`;
    }

    // ── Render daftar WO sbg card (klik utk buka detail) ──
    function _pgRenderWorkOrder(data) {
      const box = document.getElementById('table-workorder');
      if (!data || data.length === 0) {
        box.innerHTML = `<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400">
          <i class="fas fa-clipboard-list mr-2"></i>Belum ada Work Order. WO terbit otomatis saat penawaran berstatus <b>Deal</b>.
        </div>`;
        return;
      }
      box.innerHTML = data.map(i => {
        const itemJson = JSON.stringify(i).replace(/'/g, "&#39;");
        const rp = v => Math.round(v || 0).toLocaleString('id-ID');
        const ditagihFmt = i.totalDitagihDpp > 0
          ? `<span class="text-blue-600">Rp ${rp(i.totalDitagihDpp)}</span>`
          : `<span class="text-slate-300">—</span>`;
        // Aging: cari invoice belum lunas dengan aging terlama
        const maxAging = (i.invoices || []).filter(inv => inv.statusBayar !== 'Lunas')
          .reduce((m, inv) => { const d = typeof _agingDays === 'function' ? _agingDays(inv.tanggal) : null; return d !== null && d > m ? d : m; }, -1);
        const agingBadgeWO = maxAging > 0 && typeof _agingBadge === 'function' ? _agingBadge(maxAging) : '';

        // Card, bukan baris tabel — border+hover+chevron menandakan bisa diklik.
        return `<div onclick='bukaDetailWO(${itemJson})'
              class="bg-white rounded-2xl border border-slate-150 hover:border-blue-300 hover:shadow-md transition p-4 sm:p-5 cursor-pointer">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
            <div class="sm:w-44 shrink-0">
              <span class="inline-flex items-center bg-emerald-50 text-emerald-700 font-extrabold px-2.5 py-1 rounded-lg border border-emerald-100 text-sm"><i class="fa-solid fa-clipboard-check mr-1.5 text-xs"></i>${i.noWO}</span>
              <p class="text-[11px] text-blue-600 font-semibold mt-1.5">${i.id} <span class="text-slate-400 font-normal">Rev${i.rev}</span></p>
              <p class="text-[10px] text-slate-400">${i.tanggal || ''}</p>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-[11px] text-slate-400 truncate">${i.namaKlien}</p>
              <p class="font-bold text-slate-800 truncate">${i.namaProject}</p>
              <p class="text-[10px] text-slate-400 truncate mt-0.5">${i.dibuatOleh || ''}</p>
            </div>
            <div class="sm:w-36 sm:text-right shrink-0">
              <p class="text-[10px] text-slate-400 uppercase font-semibold tracking-wider">Nilai Kontrak</p>
              <p class="font-extrabold text-slate-800">Rp ${rp(i.nilaiKontrak)}</p>
              ${i.ppnRate > 0 ? `<p class="text-[10px] text-slate-400">Incl. PPN Rp ${rp(i.grandTotal)}</p>` : ''}
            </div>
            <div class="sm:w-44 shrink-0">
              <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>${i.invoices.length} invoice</span>
                <span>${i.pctLunas}% lunas</span>
              </div>
              <div class="h-2 bg-slate-100 rounded-full overflow-hidden relative">
                <div class="absolute inset-y-0 left-0 bg-blue-200 rounded-full" style="width:${i.pctDitagih}%"></div>
                <div class="absolute inset-y-0 left-0 bg-emerald-500 rounded-full" style="width:${i.pctLunas}%"></div>
              </div>
              <p class="text-[10px] text-slate-400 mt-1">${ditagihFmt} ditagih</p>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 sm:w-36">
              <div class="text-left sm:text-right">
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${_woBadge(i.paymentStatus)}">${i.paymentStatus}</span>
                ${agingBadgeWO ? `<div class="mt-1">${agingBadgeWO}</div>` : ''}
                <div class="mt-1">${_woHoBadge(i.hoStatus)}</div>
              </div>
              <i class="fa-solid fa-chevron-right text-slate-300"></i>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // ── Update summary cards ──
    function _updateWOSummary(summary) {
      const rp = v => 'Rp ' + Math.round(v || 0).toLocaleString('id-ID');
      const el = id => document.getElementById(id);
      if (!summary) return;
      el('wo-sum-count').innerText       = summary.totalWO || 0;
      el('wo-sum-kontrak').innerText     = rp(summary.totalKontrak);
      el('wo-sum-ditagih').innerText     = rp(summary.totalDitagih);
      el('wo-sum-lunas').innerText       = rp(summary.totalLunas);
      var outstandingEl = el('wo-sum-outstanding');
      if (outstandingEl) outstandingEl.innerText = rp((summary.totalKontrak || 0) - (summary.totalLunas || 0));
    }

    // ── Load ──
    window.loadWorkOrder = function(fromNav) {
      // Selalu mulai dari daftar (bila sebelumnya user tinggalkan di halaman detail).
      var detailView = document.getElementById('wo-detail-view');
      var listView = document.getElementById('wo-list-view');
      if (detailView) detailView.classList.add('hidden');
      if (listView) listView.classList.remove('hidden');
      var render = function(res) {
        const data = (res && res.woList) ? res.woList : (Array.isArray(res) ? res : []);
        _cachedWorkOrderData = data;
        if (res && res.summary) _updateWOSummary(res.summary);
        const search = document.getElementById('search-workorder');
        if (search) search.value = '';
        const filterEl = document.getElementById('filter-wo-status');
        if (filterEl) filterEl.value = '';
        _pgState.workorder.data = _cachedWorkOrderData;
        _pgState.workorder.page = 1;
        _injectPgBar('workorder', '#table-workorder');
        _pgRender('workorder');
      };
      var c = fromNav ? navCacheGet('workorder') : null;
      if (c) { render(c); return; }
      const tbody = document.getElementById('table-workorder');
      if (tbody) tbody.innerHTML = `<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat data work order...</div>`;
      if (typeof google !== 'undefined') {
        google.script.run.withSuccessHandler(function(res) { navCacheSet('workorder', res); render(res); }).getWorkOrderDashboard();
      }
    };

    window.filterWorkOrder = function() {
      const q       = (document.getElementById('search-workorder').value || '').toLowerCase().trim();
      const status  = (document.getElementById('filter-wo-status') || {}).value || '';
      _pgState.workorder.data = _cachedWorkOrderData.filter(d => {
        const matchQ = !q || (d.noWO + d.id + d.namaProject + d.namaKlien + d.dibuatOleh).toLowerCase().includes(q);
        const matchS = !status || d.paymentStatus === status;
        return matchQ && matchS;
      });
      _pgState.workorder.page = 1;
      _pgRender('workorder');
    };

    // ── Modal Detail WO ──
    window.bukaDetailWO = function(item) {
      _woDetailCurrent = item;
      const rp = v => 'Rp ' + Math.round(v || 0).toLocaleString('id-ID');
      const el = id => document.getElementById(id);

      el('wo-detail-nowo').innerText    = 'WO ' + item.noWO;
      el('wo-detail-subtitle').innerText = item.namaProject;
      el('wo-detail-id').innerText      = item.id + ' (Rev' + item.rev + ')';
      el('wo-detail-klien').innerText   = item.namaKlien;
      el('wo-detail-sales').innerText   = item.dibuatOleh || '-';

      const badge = el('wo-detail-status-badge');
      badge.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full ' + _woBadge(item.paymentStatus);
      badge.innerText = item.paymentStatus;

      // Keuangan
      const ditagihTotal = item.totalDitagihDpp + Math.round(item.totalDitagihDpp * (item.ppnRate || 0) / 100);
      el('wo-fin-kontrak').innerText = rp(item.nilaiKontrak);
      el('wo-fin-ditagih').innerText = rp(ditagihTotal);
      el('wo-fin-lunas').innerText   = rp(item.totalLunasTotal);
      el('wo-fin-sisa').innerText    = rp(item.sisaDpp > 0 ? item.sisaDpp + Math.round(item.sisaDpp * (item.ppnRate||0)/100) : 0);
      el('wo-fin-pct').innerText     = item.pctLunas + '% lunas · ' + item.pctDitagih + '% ditagih';
      el('wo-bar-ditagih').style.width = item.pctDitagih + '%';
      el('wo-bar-lunas').style.width   = item.pctLunas + '%';

      // Invoice list
      const invCont = el('wo-invoice-list');
      if (!item.invoices || item.invoices.length === 0) {
        invCont.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm bg-slate-50 rounded-xl">
          <i class="fa-solid fa-file-invoice text-2xl mb-2 opacity-30 block"></i>
          Belum ada invoice untuk WO ini.
        </div>`;
      } else {
        invCont.innerHTML = item.invoices.map(inv => {
          const isPaid = inv.statusBayar === 'Lunas';
          const kwBtn  = inv.kwitansiId
            ? `<button onclick="_exportKwDariWODetail('${inv.kwitansiId}')"
                 class="inline-flex items-center gap-1.5 text-[11px] font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg transition" title="${inv.kwitansiId}">
                 <i class="fa-solid fa-receipt"></i> Kwitansi
               </button>`
            : '';
          const invJsonStr = JSON.stringify(inv).replace(/'/g, "&#39;");
          const invPdfBtn = `<button onclick='_exportInvDariWODetail(${invJsonStr})'
               class="inline-flex items-center gap-1.5 text-[11px] font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1.5 rounded-lg transition" title="Export PDF Invoice">
               <i class="fa-solid fa-file-invoice"></i> Invoice
             </button>`;
          const agingDays  = !isPaid && typeof _agingDays === 'function' ? _agingDays(inv.tanggal) : null;
          const agingLabel = agingDays !== null && agingDays >= 0 ? (typeof _agingBadge === 'function' ? _agingBadge(agingDays) : '') : '';
          // Nominal & status di baris atas (jelas & mudah dipindai); tombol aksi
          // di baris bawah dipisah garis, tidak lagi berdesakan dgn nominal/status.
          return `<div class="bg-slate-50 rounded-xl border border-slate-100 p-3.5 text-xs">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="font-bold text-blue-700 truncate">${inv.id}</p>
                <p class="text-slate-400 mt-0.5">${inv.tanggal} · ${inv.jenis}${inv.persen > 0 ? ' ' + inv.persen + '%' : ''}</p>
              </div>
              <div class="text-right shrink-0">
                <p class="font-extrabold text-slate-800 text-sm whitespace-nowrap">Rp ${Math.round(inv.total||0).toLocaleString('id-ID')}</p>
                <span class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-600'}">${inv.statusBayar}</span>
              </div>
            </div>
            ${agingLabel ? `<div class="mt-2">${agingLabel}</div>` : ''}
            <div class="flex items-center justify-end gap-2 mt-3 pt-2.5 border-t border-slate-200/70">
              ${invPdfBtn}
              ${kwBtn}
            </div>
          </div>`;
        }).join('');
      }

      // HPP panel: reset and trigger async load
      var hppLoading = el('wo-hpp-loading');
      var hppContent = el('wo-hpp-content');
      if (hppLoading) {
        hppLoading.classList.remove('hidden');
        hppLoading.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat data HPP...';
      }
      if (hppContent) hppContent.classList.add('hidden');

      // Export laporan button — hanya finance/admin
      var btnExportLap = el('wo-btn-export-lap');
      if (btnExportLap) {
        if (typeof _isFinanceOrAdmin === 'function' && _isFinanceOrAdmin()) btnExportLap.classList.remove('hidden');
        else btnExportLap.classList.add('hidden');
      }

      document.getElementById('wo-list-view').classList.add('hidden');
      document.getElementById('wo-detail-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      var scrollHost = document.getElementById('wo-detail-view').closest('.overflow-y-auto');
      if (scrollHost) scrollHost.scrollTop = 0;
      _loadRealisasiHPP(item.noWO);
      _woLoadSurveys(item.noWO);
      _woLoadQC(item.noWO);
      _woLoadDokumen(item.noWO);
      if (typeof _hoLoad === 'function') _hoLoad(item.noWO);
      _woLoadTimeline(item.noWO);
      _woLoadBomDed(item.noWO);
    };

    // ── Ringkasan BoM & DED (lintas divisi, read-only) ──
    function _woLoadBomDed(noWO) {
      ['wo-bom-summary','wo-ded-summary'].forEach(function(id){ var el=document.getElementById(id); if(el) el.innerHTML='<div class="text-center py-4 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat...</div>'; });
      if (typeof google === 'undefined') return;
      google.script.run.withSuccessHandler(function(r){ _woRenderBom((r && r.success) ? r.summary : null); }).withFailureHandler(function(){ _woRenderBom(undefined); }).getBOMSummaryByWO(noWO);
      google.script.run.withSuccessHandler(function(r){ _woRenderDed(r && r.success ? r : null); }).withFailureHandler(function(){ _woRenderDed(undefined); }).getDEDSummaryByWO(noWO);
    }
    function _woProgBar(pct, done) {
      return '<div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ' + (done ? 'bg-emerald-500' : 'bg-indigo-500') + '" style="width:' + (pct||0) + '%"></div></div>';
    }
    function _woRenderBom(s) {
      var el = document.getElementById('wo-bom-summary'); if (!el) return;
      if (s === undefined) { el.innerHTML = '<div class="text-center py-3 text-rose-400 text-xs">Gagal memuat BoM.</div>'; return; }
      if (!s) { el.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-slate-50 rounded-xl"><i class="fa-solid fa-list-check text-2xl mb-2 opacity-30 block"></i>Belum terdaftar di BoM.</div>'; return; }
      var badge = ' <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ' + (s.bomStatus === 'Final' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500') + '">' + s.bomStatus + '</span>';
      var p = s.proc || { base:0 };
      var procRow = p.base
        ? '<div class="mt-3 pt-3 border-t border-slate-100">'
          + '<div class="flex items-center justify-between mb-1"><span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Procurement</span><span class="text-xs font-extrabold text-slate-800">' + (p.pct||0) + '%</span></div>'
          + _woProgBar(p.pct, (p.pct>=100))
          + '<div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] font-bold mt-1">'
          +   '<span class="text-emerald-700">' + p.reserved + ' Reserved</span>'
          +   '<span class="text-violet-600">' + p.direct + ' Direct</span>'
          +   '<span class="text-amber-600">' + p.perluBeli + ' Perlu Beli</span>'
          +   (p.tunggu ? '<span class="text-violet-500">' + p.tunggu + ' Tunggu Beli</span>' : '')
          +   '<span class="text-sky-600">' + p.dikirim + ' Dikirim</span>'
          + '</div></div>'
        : '';
      el.innerHTML =
          '<div class="flex items-center justify-between mb-1"><span class="text-xs font-bold text-slate-600">Approval' + badge + '</span><span class="text-xs font-extrabold text-slate-800">' + (s.pct||0) + '%</span></div>'
        + _woProgBar(s.pct, (s.pct>=100))
        + '<div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] font-bold mt-1">'
        +   '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + (s.approved||0) + ' Approved</span>'
        +   '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + (s.pending||0) + ' Pending</span>'
        +   '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + (s.rejected||0) + ' Rejected</span>'
        +   '<span class="text-slate-400">' + (s.total||0) + ' item</span>'
        + '</div>' + procRow;
    }
    function _woRenderDed(res) {
      var el = document.getElementById('wo-ded-summary'); if (!el) return;
      if (res === undefined) { el.innerHTML = '<div class="text-center py-3 text-rose-400 text-xs">Gagal memuat DED.</div>'; return; }
      var s = res ? res.summary : null;
      if (!s) { el.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-slate-50 rounded-xl"><i class="fa-solid fa-file-pen text-2xl mb-2 opacity-30 block"></i>Belum terdaftar di DED.</div>'; return; }
      var docs = (res.approvedDocs || []);
      var docHtml = '';
      if (docs.length) {
        docHtml = '<div class="mt-3 pt-3 border-t border-slate-100"><p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Dokumen Approved</p><div class="space-y-1.5">'
          + docs.map(function(d){
              return d.files.map(function(f){
                return '<a href="' + _escHtmlWO(f.fileUrl) + '" target="_blank" rel="noopener" class="flex items-center gap-2 text-xs text-rose-600 hover:text-rose-700 bg-rose-50 rounded-lg px-2.5 py-1.5"><i class="fa-solid fa-file-pdf shrink-0"></i><span class="truncate">' + _escHtmlWO(d.label) + '</span></a>';
              }).join('');
            }).join('')
          + '</div></div>';
      }
      el.innerHTML =
          '<div class="flex items-center justify-between mb-1"><span class="text-xs font-bold text-slate-600">Progress</span><span class="text-xs font-extrabold text-slate-800">' + (s.pct||0) + '%</span></div>'
        + _woProgBar(s.pct, (s.pct>=100))
        + '<div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] font-bold mt-1">'
        +   '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + (s.approved||0) + ' Approved</span>'
        +   '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + (s.pending||0) + ' Pending</span>'
        +   '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + (s.rejected||0) + ' Rejected</span>'
        +   '<span class="text-slate-400">' + (s.belum||0) + ' Belum</span>'
        + '</div>' + docHtml;
    }
    function _escHtmlWO(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // ── Timeline Project (live dari Project Schedule WO) ──
    var _WO_TL_FASE = [
      { nama: 'Hand Over',  icon: 'fa-handshake' },
      { nama: 'Engineering', icon: 'fa-ruler-combined' },
      { nama: 'Pengadaan',  icon: 'fa-cart-shopping' },
      { nama: 'Pengiriman', icon: 'fa-truck' },
      { nama: 'Kontruksi',  icon: 'fa-screwdriver-wrench' },
      { nama: 'Finishing',  icon: 'fa-flag-checkered' }
    ];
    function _woTlDays(a, b) {
      var x = new Date((a || '') + 'T00:00:00'), y = new Date((b || '') + 'T00:00:00');
      if (isNaN(x) || isNaN(y)) return 1;
      return Math.max(1, Math.round((y - x) / 86400000) + 1);
    }
    function _woTlProg(arr) { var d = 0, w = 0; arr.forEach(function(t){ var dd = _woTlDays(t.mulai, t.selesai); d += dd; w += (Number(t.progress) || 0) * dd; }); return d ? Math.round(w / d) : 0; }
    function _woLoadTimeline(noWO) {
      _woRenderTimeline(null);
      if (typeof google === 'undefined') return;
      google.script.run.withSuccessHandler(function(res) {
        _woRenderTimeline((res && res.success) ? res : null);
      }).withFailureHandler(function() { _woRenderTimeline(null); }).getScheduleByWO(noWO);
    }
    function _woRenderTimeline(res) {
      var grid = document.getElementById('wo-timeline-grid'); if (!grid) return;
      var barEl = document.getElementById('wo-timeline-bar');
      var pctEl = document.getElementById('wo-timeline-pct');
      var tasks = (res && res.tasks) || [];
      var byFase = {}; tasks.forEach(function(t){ var f = (t.fase || '').trim(); (byFase[f] = byFase[f] || []).push(t); });
      var overall = (res && res.summary && res.summary.progress != null) ? Number(res.summary.progress) : (tasks.length ? _woTlProg(tasks) : 0);
      if (barEl) barEl.style.width = (tasks.length ? overall : 0) + '%';
      if (barEl) barEl.className = 'h-full rounded-full transition-all duration-500 ' + (overall >= 100 ? 'bg-emerald-500' : 'bg-indigo-500');
      if (pctEl) pctEl.textContent = tasks.length ? (overall + '% selesai') : 'Belum ada jadwal';
      grid.innerHTML = _WO_TL_FASE.map(function(f) {
        var arr = byFase[f.nama] || [];
        var has = arr.length > 0;
        var pct = has ? _woTlProg(arr) : 0;
        var done = has && pct >= 100;
        var active = has && pct > 0 && pct < 100;
        var ring = done ? 'bg-emerald-500 text-white ring-emerald-200'
                 : active ? 'bg-indigo-500 text-white ring-indigo-200'
                 : has ? 'bg-slate-200 text-slate-500 ring-slate-200'
                 : 'bg-slate-100 text-slate-300 ring-slate-200';
        var barColor = done ? 'bg-emerald-500' : 'bg-indigo-500';
        return '<div class="text-center">'
          + '<div class="h-9 w-9 mx-auto rounded-full border-2 border-white ring-1 ' + ring + ' flex items-center justify-center mb-1.5"><i class="fa-solid ' + f.icon + '"></i></div>'
          + '<p class="text-xs font-bold text-slate-600">' + f.nama + '</p>'
          + (has
              ? '<div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mt-1 mx-auto max-w-[80px]"><div class="h-full ' + barColor + ' rounded-full" style="width:' + pct + '%"></div></div>'
                + '<p class="text-[10px] font-bold text-slate-500 mt-0.5">' + pct + '% · ' + arr.length + ' tugas</p>'
              : '<p class="text-[10px] text-slate-300 mt-0.5">Belum tersedia</p>')
          + '</div>';
      }).join('');

    // Kembali dari detail WO (halaman penuh) ke daftar.
    window.kembaliListWO = function() {
      document.getElementById('wo-detail-view').classList.add('hidden');
      document.getElementById('wo-list-view').classList.remove('hidden');
      _woDetailCurrent = null;
    };
    window.tutupModalDetailWO = window.kembaliListWO; // alias kompatibilitas

    // ================================================================
    // SITE SURVEY TERKAIT (panel read-only di detail WO)
    // ================================================================
    // Menautkan/melepas survey: admin/lead sales/sales (reuse _canEditCatatanWO).
    // Tampil survey milik semua divisi yg buka WO — tapi hanya lihat (modal
    // detail Site Survey dibuka dgn readOnly, tanpa tombol Export/Edit/Hapus).
    function _woEsc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function _woLoadSurveys(noWO) {
      var cont = document.getElementById('wo-survey-list');
      var linkBtn = document.getElementById('wo-survey-link-btn');
      if (linkBtn) linkBtn.classList.toggle('hidden', !_canEditCatatanWO());
      if (cont) cont.innerHTML = '<div class="text-center py-3 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat...</div>';
      google.script.run.withSuccessHandler(function(res) {
        _woSurveys = (res && res.success) ? (res.list || []) : [];
        _woRenderSurveyList();
      }).withFailureHandler(function() {
        if (cont) cont.innerHTML = '<div class="text-center py-3 text-rose-400 text-xs">Gagal memuat survey.</div>';
      }).getSiteSurveysByWO(noWO);
    }

    function _woRenderSurveyList() {
      var cont = document.getElementById('wo-survey-list');
      if (!cont) return;
      var canManage = _canEditCatatanWO();
      if (!_woSurveys.length) {
        cont.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-slate-50 rounded-xl">'
          + '<i class="fa-solid fa-map-location-dot text-2xl mb-2 opacity-30 block"></i>'
          + 'Belum ada Site Survey tertaut.' + (canManage ? '<br>Klik <b>Tautkan</b> untuk menautkan.' : '') + '</div>';
        return;
      }
      cont.innerHTML = _woSurveys.map(function(s) {
        var lepasBtn = canManage
          ? '<button onclick="_woLepasTautanSurvey(\'' + s.id + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Lepas tautan"><i class="fa-solid fa-link-slash text-xs"></i></button>'
          : '';
        return '<div class="bg-slate-50 rounded-xl border border-slate-100 p-3 text-xs">'
          + '<div class="flex items-start justify-between gap-2">'
          +   '<div class="min-w-0">'
          +     '<p class="font-bold text-slate-800 truncate">' + _woEsc(s.namaSite || '-') + '</p>'
          +     '<p class="text-slate-400 mt-0.5 truncate">' + _woEsc(s.id) + (s.namaPIC ? ' · ' + _woEsc(s.namaPIC) : '') + (s.telepon ? ' · ' + _woEsc(s.telepon) : '') + '</p>'
          +     '<p class="text-slate-400 mt-0.5">' + _woEsc(s.tanggalSurvey || '') + (s.dibuatOleh ? ' · ' + _woEsc(s.dibuatOleh) : '') + '</p>'
          +   '</div>'
          +   '<div class="flex items-center gap-1 shrink-0">'
          +     '<button onclick="bukaDetailSiteSurvey(\'' + s.id + '\', {readOnly:true})" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Lihat Detail"><i class="fa-solid fa-eye text-xs"></i></button>'
          +     lepasBtn
          +   '</div>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    window._woBukaLinkSurvey = function() {
      if (!_woDetailCurrent) return;
      if (!_canEditCatatanWO()) { showNotification('Anda tidak berhak menautkan survey.', 'error'); return; }
      document.getElementById('wo-link-survey-nowo').innerText = 'WO ' + _woDetailCurrent.noWO;
      var search = document.getElementById('wo-link-survey-search'); if (search) search.value = '';
      document.getElementById('wo-link-survey-list').innerHTML = '<div class="text-center py-4 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat daftar survey...</div>';
      document.getElementById('modal-wo-link-survey').classList.remove('hidden');
      google.script.run.withSuccessHandler(function(res) {
        _woAllSurveys = (res && res.success) ? (res.list || []) : [];
        _woRenderLinkSurveyList();
      }).withFailureHandler(function() {
        document.getElementById('wo-link-survey-list').innerHTML = '<div class="text-center py-4 text-rose-400 text-xs">Gagal memuat daftar survey.</div>';
      }).getSiteSurveyList();
    };

    window._woTutupLinkSurvey = function() {
      document.getElementById('modal-wo-link-survey').classList.add('hidden');
    };

    window._woRenderLinkSurveyList = function() {
      var box = document.getElementById('wo-link-survey-list');
      if (!box || !_woDetailCurrent) return;
      var noWO = _woDetailCurrent.noWO;
      var q = ((document.getElementById('wo-link-survey-search') || {}).value || '').toLowerCase().trim();
      // Sembunyikan survey yg sudah tertaut ke WO ini; sisanya bisa ditautkan.
      var rows = _woAllSurveys.filter(function(s) {
        if ((s.noWO || '') === noWO) return false;
        if (!q) return true;
        return ((s.namaSite || '') + (s.namaPIC || '') + (s.alamat || '') + (s.id || '')).toLowerCase().indexOf(q) !== -1;
      });
      if (!rows.length) {
        box.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">' + (q ? 'Tidak ada survey cocok.' : 'Tidak ada survey lain untuk ditautkan.') + '</div>';
        return;
      }
      box.innerHTML = rows.map(function(s) {
        var linkedNote = (s.noWO && s.noWO !== noWO)
          ? '<span class="inline-block mt-1 text-[10px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">Tertaut: ' + _woEsc(s.noWO) + '</span>'
          : '';
        return '<div class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl border border-slate-100 p-3">'
          + '<div class="min-w-0 text-xs">'
          +   '<p class="font-bold text-slate-800 truncate">' + _woEsc(s.namaSite || '-') + '</p>'
          +   '<p class="text-slate-400 mt-0.5 truncate">' + _woEsc(s.id) + (s.namaPIC ? ' · ' + _woEsc(s.namaPIC) : '') + '</p>'
          +   linkedNote
          + '</div>'
          + '<button onclick="_woTautkanSurvey(\'' + s.id + '\')" class="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-bold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-link text-[10px]"></i> Tautkan</button>'
          + '</div>';
      }).join('');
    };

    window._woTautkanSurvey = function(surveyId) {
      if (!_woDetailCurrent) return;
      toggleLoader(true, 'Menautkan survey...');
      google.script.run.withSuccessHandler(function(res) {
        toggleLoader(false);
        if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal menautkan.', 'error'); return; }
        showNotification(res.message || 'Survey ditautkan.');
        _woTutupLinkSurvey();
        _woLoadSurveys(_woDetailCurrent.noWO);
      }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menautkan.', 'error'); })
        .linkSiteSurveyToWO(surveyId, _woDetailCurrent.noWO);
    };

    window._woLepasTautanSurvey = function(surveyId) {
      if (!_woDetailCurrent) return;
      showConfirm({ title: 'Lepas Tautan Survey', message: 'Lepas tautan survey ' + surveyId + ' dari WO ini? Survey tidak dihapus, hanya tautannya dilepas.', confirmText: 'Ya, Lepas', onConfirm: function() {
        toggleLoader(true, 'Melepas tautan...');
        google.script.run.withSuccessHandler(function(res) {
          toggleLoader(false);
          if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal melepas tautan.', 'error'); return; }
          showNotification(res.message || 'Tautan dilepas.');
          _woLoadSurveys(_woDetailCurrent.noWO);
        }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal melepas tautan.', 'error'); })
          .unlinkSiteSurveyFromWO(surveyId);
      } });
    };

    // ================================================================
    // RINGKASAN QC LAPANGAN (read-only) + engineer ditugaskan di header WO
    // ================================================================
    function _woLoadQC(noWO) {
      var engEl = document.getElementById('wo-detail-engineer');
      var sumEl = document.getElementById('wo-qc-summary');
      if (engEl) engEl.innerText = '…';
      if (sumEl) sumEl.innerHTML = '<div class="text-center py-4 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat...</div>';
      google.script.run.withSuccessHandler(function(res) {
        var assigned = (res && res.success) ? (res.assigned || []) : [];
        if (engEl) engEl.innerText = assigned.length ? assigned.map(function(a) { return a.nama; }).join(', ') : 'Belum ditugaskan';
        _woRenderQCSummary((res && res.success) ? res.summary : null);
      }).withFailureHandler(function() {
        if (engEl) engEl.innerText = '-';
        if (sumEl) sumEl.innerHTML = '<div class="text-center py-3 text-rose-400 text-xs">Gagal memuat QC.</div>';
      }).getQCSummaryByWO(noWO);
    }

    function _woRenderQCSummary(s) {
      var el = document.getElementById('wo-qc-summary');
      if (!el) return;
      // "Belum ada aktivitas" bila belum ada item yg diproses (semua masih Belum).
      var activity = s ? ((s.approved||0) + (s.pending||0) + (s.rejected||0) + (s.na||0)) : 0;
      if (!s || !activity) {
        el.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-slate-50 rounded-xl">'
          + '<i class="fa-solid fa-clipboard-check text-2xl mb-2 opacity-30 block"></i>Belum ada aktivitas QC.</div>';
        return;
      }
      var pct = s.pct || 0;
      var barColor = pct >= 100 ? 'bg-emerald-500' : 'bg-orange-400';
      el.innerHTML =
          '<div class="flex items-center gap-2 mb-2">'
        +   '<div class="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-2.5 ' + barColor + '" style="width:' + pct + '%"></div></div>'
        +   '<span class="text-sm font-extrabold text-slate-800 shrink-0">' + pct + '%</span>'
        + '</div>'
        + '<div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] font-bold">'
        +   '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + (s.approved||0) + ' Approved</span>'
        +   '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + (s.pending||0) + ' Pending</span>'
        +   '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + (s.rejected||0) + ' Rejected</span>'
        +   '<span class="text-slate-400"><i class="fa-regular fa-circle"></i> ' + (s.belum||0) + ' Belum</span>'
        +   '<span class="text-slate-400">N/A ' + (s.na||0) + '</span>'
        + '</div>';

    // ================================================================
    // DOKUMEN PROJECT (Kontrak manual + BAST/Garansi/Commissioning dari QC)
    // ================================================================
    // Kontrak: generate (menyusul) + upload versi bertandatangan. Boleh
    // upload/hapus: admin/lead sales/sales (reuse _canEditCatatanWO).
    // BAST/Garansi/Commissioning: read-only, ditarik dari item QC H1/H2/H3.
    let _woDok = null;
    var _WO_QC_DOC_ICONS = { bast: 'fa-file-signature', garansi: 'fa-shield-halved', commissioning: 'fa-plug-circle-check' };
    var _WO_QC_DOC_ORDER = ['bast', 'garansi', 'commissioning'];

    function _woLoadDokumen(noWO) {
      var cont = document.getElementById('wo-doc-content');
      if (cont) cont.innerHTML = '<div class="text-center py-4 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat...</div>';
      google.script.run.withSuccessHandler(function(res) {
        _woDok = (res && res.success) ? res : { kontrak: null, qc: {} };
        _woRenderDokumen();
      }).withFailureHandler(function() {
        if (cont) cont.innerHTML = '<div class="text-center py-3 text-rose-400 text-xs">Gagal memuat dokumen.</div>';
      }).getWODokumen(noWO);
    }

    function _woQCStatusBadge(st) {
      var m = ({
        'Approved':     { c: 'bg-emerald-100 text-emerald-700', t: 'Approved' },
        'Pending':      { c: 'bg-amber-100 text-amber-700', t: 'Pending' },
        'Rejected':     { c: 'bg-rose-100 text-rose-700', t: 'Rejected' },
        'NA':           { c: 'bg-slate-100 text-slate-500', t: 'N/A' },
        'Belum Upload': { c: 'bg-slate-100 text-slate-400', t: 'Belum ada' }
      })[st] || { c: 'bg-slate-100 text-slate-400', t: 'Belum ada' };
      return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ' + m.c + '">' + m.t + '</span>';
    }

    // Kartu file PDF kecil (ikon PDF + nama/keterangan + tombol Buka). aksiHtml
    // = tombol tambahan (ganti/hapus) opsional.
    // Normalisasi tanggal dokumen ke "DD/MM/YYYY HH:mm". Nilai yang sudah
    // berformat dd/MM/yyyy (mis. dari QC) dibiarkan; string Date mentah lama
    // (mis. "Tue Jul 21 2026 ...") di-parse & diformat ulang.
    function _woFmtTgl(v) {
      if (!v) return '';
      v = v.toString().trim();
      if (/^\d{2}\/\d{2}\/\d{4}/.test(v)) return v;
      var d = new Date(v);
      if (isNaN(d.getTime())) return v;
      var p = function(n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function _woDocFileCard(fileUrl, fileName, meta, aksiHtml) {
      return '<div class="flex items-center gap-2 mt-2">'
        + '<a href="' + _woEsc(fileUrl) + '" target="_blank" class="flex items-center justify-center h-10 w-10 rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 transition shrink-0" title="Buka dokumen"><i class="fa-solid fa-file-pdf text-rose-500 text-lg"></i></a>'
        + '<div class="min-w-0 flex-1 leading-tight">'
        +   (fileName ? '<p class="text-[11px] font-semibold text-slate-600 truncate" title="' + _woEsc(fileName) + '">' + _woEsc(fileName) + '</p>' : '')
        +   '<p class="text-[10px] text-slate-400 truncate">' + _woEsc(meta || '') + '</p>'
        + '</div>'
        + (aksiHtml || '')
        + '</div>';
    }

    function _woRenderDokumen() {
      var cont = document.getElementById('wo-doc-content');
      if (!cont || !_woDok) return;
      var canManage = _canEditCatatanWO();
      var k = _woDok.kontrak;

      // ── Kontrak (manual) ──
      var kontrakBody;
      if (k && k.fileId) {
        var aksi = canManage
          ? '<button onclick="document.getElementById(\'wo-kontrak-input\').click()" class="text-[11px] font-bold text-blue-600 hover:bg-blue-50 px-2 py-1 rounded-lg transition shrink-0" title="Ganti"><i class="fa-solid fa-arrows-rotate"></i></button>'
            + '<button onclick="_woHapusKontrak()" class="text-[11px] font-bold text-rose-500 hover:bg-rose-50 px-2 py-1 rounded-lg transition shrink-0" title="Hapus"><i class="fa-regular fa-trash-can"></i></button>'
          : '';
        var genBtn = '<button onclick="_woGenerateKontrak()" class="text-[11px] font-bold text-blue-600 hover:bg-blue-50 px-2 py-1 rounded-lg transition shrink-0" title="Generate draft ulang"><i class="fa-solid fa-file-arrow-down"></i></button>';
        kontrakBody = '<div class="flex items-center justify-between gap-2">'
          + '<span class="text-sm font-semibold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-file-contract text-slate-400"></i> Kontrak</span>'
          + '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 shrink-0"><i class="fa-solid fa-circle-check text-[9px] mr-0.5"></i>Tersimpan</span>'
          + '</div>'
          + _woDocFileCard(k.fileUrl, k.fileName, (k.by ? k.by + ' · ' : '') + _woFmtTgl(k.at), genBtn + aksi);
      } else {
        kontrakBody = '<div class="flex items-center justify-between gap-2">'
          + '<span class="text-sm font-semibold text-slate-500 flex items-center gap-2"><i class="fa-solid fa-file-contract text-slate-300"></i> Kontrak</span>'
          + '<span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full shrink-0">Belum ada</span>'
          + '</div>'
          + '<div class="flex items-center gap-2 mt-2 flex-wrap">'
          +   '<button onclick="_woGenerateKontrak()" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-100 px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-file-arrow-down"></i> Draft Kontrak</button>'
          +   (canManage
                ? '<button onclick="document.getElementById(\'wo-kontrak-input\').click()" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-white bg-orange-500 hover:bg-orange-600 px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-file-arrow-up"></i> Upload Bertandatangan</button>'
                : '<span class="text-[11px] text-slate-300 italic self-center">Belum diupload</span>')
          + '</div>';
      }

      // ── Dari QC (BAST / Garansi / Commissioning) ──
      var qc = _woDok.qc || {};
      var qcRows = _WO_QC_DOC_ORDER.map(function(key) {
        var d = qc[key]; if (!d) return '';
        var icon = _WO_QC_DOC_ICONS[key] || 'fa-file';
        var body = '<div class="flex items-center justify-between gap-3">'
          + '<span class="text-sm font-semibold text-slate-600 flex items-center gap-2 min-w-0"><i class="fa-solid ' + icon + ' text-slate-300 shrink-0"></i><span class="truncate">' + _woEsc(d.label) + '</span></span>'
          + _woQCStatusBadge(d.status)
          + '</div>';
        if (d.file && d.file.fileId) {
          body += _woDocFileCard(d.file.fileUrl, d.file.fileName, (d.by ? d.by + ' · ' : '') + _woFmtTgl(d.at) + (d.status === 'Approved' ? '' : ' · (belum disetujui)'), '');
        } else {
          body += '<p class="text-[11px] text-slate-300 italic mt-1">Belum ada dokumen di QC (' + _woEsc(d.kode) + ').</p>';
        }
        // BAST & Surat Garansi bisa dibuat draft-nya (mirip Kontrak) lalu
        // ditandatangani & diupload kembali ke QC.
        if (key === 'bast' || key === 'garansi') {
          var genFn = key === 'bast' ? '_woGenerateBAST' : '_woGenerateGaransi';
          var genLabel = key === 'bast' ? 'Draft BAST' : 'Draft Garansi';
          body += '<div class="mt-2 pt-2 border-t border-slate-100">'
            + '<button onclick="' + genFn + '()" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-100 px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-file-arrow-down"></i> ' + genLabel + '</button>'
            + '</div>';
        }
        return '<div class="bg-slate-50 rounded-xl border border-slate-100 px-3.5 py-2.5">' + body + '</div>';
      }).join('');

      cont.innerHTML =
          '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Dibuat &amp; Ditandatangani</p>'
        + '<div class="bg-slate-50 rounded-xl border border-slate-100 px-3.5 py-3 mb-3">' + kontrakBody + '</div>'
        + '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Otomatis dari QC <span class="normal-case font-semibold text-slate-300">(item H1/H2/H3)</span></p>'
        + '<div class="space-y-2">' + qcRows + '</div>';
    }

    window._woUploadKontrak = function(input) {
      var f = (input.files || [])[0];
      input.value = '';
      if (!f) return;
      if (!_woDetailCurrent) return;
      if (!_canEditCatatanWO()) { showNotification('Anda tidak berhak mengupload dokumen.', 'error'); return; }
      var isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
      if (!isPdf) { showNotification('Hanya file PDF yang diperbolehkan.', 'error'); return; }
      if (f.size > 15 * 1024 * 1024) { showNotification('Ukuran dokumen maksimal 15MB.', 'error'); return; }
      toggleLoader(true, 'Mengupload kontrak...');
      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result || '';
        var base64 = dataUrl.indexOf(',') !== -1 ? dataUrl.split(',')[1] : '';
        if (!base64) { toggleLoader(false); showNotification('Gagal membaca file.', 'error'); return; }
        google.script.run.withSuccessHandler(function(res) {
          toggleLoader(false);
          if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal upload.', 'error'); return; }
          showNotification('Kontrak tersimpan.');
          _woLoadDokumen(_woDetailCurrent.noWO);
        }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal upload.', 'error'); })
          .uploadWODokumen({ noWO: _woDetailCurrent.noWO, jenis: 'kontrak', base64Data: base64, fileName: f.name || 'kontrak.pdf', mimeType: 'application/pdf', oleh: (typeof _currentUser !== 'undefined' && _currentUser ? _currentUser.nama : '') });
      };
      reader.onerror = function() { toggleLoader(false); showNotification('Gagal membaca file.', 'error'); };
      reader.readAsDataURL(f);
    };

    window._woHapusKontrak = function() {
      if (!_woDetailCurrent) return;
      showConfirm({ title: 'Hapus Kontrak', message: 'Hapus dokumen kontrak dari WO ini?', confirmText: 'Ya, Hapus', onConfirm: function() {
        toggleLoader(true, 'Menghapus...');
        google.script.run.withSuccessHandler(function(res) {
          toggleLoader(false);

    function _kTerbilang(n) {
      n = Math.floor(Math.abs(Number(n) || 0));
      var sat = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
      function t(x) {
        if (x < 12) return sat[x];
        if (x < 20) return t(x - 10) + ' belas';
        if (x < 100) return t(Math.floor(x / 10)) + ' puluh' + (x % 10 ? ' ' + t(x % 10) : '');
        if (x < 200) return 'seratus' + (x % 100 ? ' ' + t(x % 100) : '');
        if (x < 1000) return t(Math.floor(x / 100)) + ' ratus' + (x % 100 ? ' ' + t(x % 100) : '');
        if (x < 2000) return 'seribu' + (x % 1000 ? ' ' + t(x % 1000) : '');
        if (x < 1000000) return t(Math.floor(x / 1000)) + ' ribu' + (x % 1000 ? ' ' + t(x % 1000) : '');
        if (x < 1000000000) return t(Math.floor(x / 1000000)) + ' juta' + (x % 1000000 ? ' ' + t(x % 1000000) : '');
        if (x < 1000000000000) return t(Math.floor(x / 1000000000)) + ' miliar' + (x % 1000000000 ? ' ' + t(x % 1000000000) : '');
        return t(Math.floor(x / 1000000000000)) + ' triliun' + (x % 1000000000000 ? ' ' + t(x % 1000000000000) : '');
      }
      if (n === 0) return 'nol';
      return t(n).replace(/\s+/g, ' ').trim();
    }

    function _woBuildKontrakPDF(d) {

    // ================================================================
    // EXPORT PDF WORK ORDER (INTERNAL — jsPDF)
    // ================================================================
    window.exportWorkOrderPDF = function(item) {
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        const PW = 297, PH = 210, ML = 12, MR = 12;
        const DARK  = [30, 41, 59];
        const SLATE = [100, 116, 139];
        const GREEN = [5, 150, 105];
        const RED   = [190, 30, 30];
        const BLUE  = [30, 64, 175];
        const rp = v => Math.round(Math.abs(v || 0)).toLocaleString('id-ID');

        let tc = {};            try { tc = JSON.parse(item.termConditions || '{}'); } catch (e) {}
        let kelompokList = [];  try { kelompokList = JSON.parse(item.items || '[]'); } catch (e) {}

        doc.setFillColor(DARK[0], DARK[1], DARK[2]);
        doc.rect(0, 0, PW, 22, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
        doc.text('WORK ORDER', ML, 11);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
        doc.setTextColor(190, 200, 220);
        doc.text('DOKUMEN INTERNAL — ACUAN PELAKSANAAN PROJECT (RAHASIA)', ML, 17);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
        doc.setTextColor(170, 195, 255);
        doc.text('NO. WORK ORDER', PW - MR, 9, { align: 'right' });
        doc.setFontSize(18); doc.setTextColor(255, 255, 255);
        doc.text(String(item.noWO), PW - MR, 17, { align: 'right' });

        let y = 30;
        const infoLeft  = [['No Penawaran', item.id + '  (Rev ' + item.rev + ')'], ['Tanggal', item.tanggal || '-'], ['Sales / PIC', item.dibuatOleh || '-']];
        const infoRight = [['Klien', item.namaKlien || '-'], ['Project', item.namaProject || '-'], ['Status', item.status || 'Deal']];
        doc.setFontSize(8);
        infoLeft.forEach((r, i) => { const yy = y + i * 5; doc.setFont('helvetica', 'bold'); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]); doc.text(r[0], ML, yy); doc.setFont('helvetica', 'normal'); doc.setTextColor(DARK[0],DARK[1],DARK[2]); doc.text(': ' + r[1], ML + 26, yy); });
        infoRight.forEach((r, i) => { const yy = y + i * 5; doc.setFont('helvetica', 'bold'); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]); doc.text(r[0], PW / 2, yy); doc.setFont('helvetica', 'normal'); doc.setTextColor(DARK[0],DARK[1],DARK[2]); doc.text(': ' + r[1], PW / 2 + 26, yy); });
        y += 18;

        const catatanCust = (item.catatanCustomer || '').trim();
        if (catatanCust) {
          const AMBER_BG = [255,247,224], AMBER_LINE = [217,119,6];
          const boxFullW = PW - ML - MR;
          const custLines = doc.splitTextToSize(catatanCust, boxFullW - 10);
          const headH = 5.5, bodyH = custLines.length * 4.2 + 3.5;
          doc.setFillColor(AMBER_BG[0],AMBER_BG[1],AMBER_BG[2]); doc.setDrawColor(AMBER_LINE[0],AMBER_LINE[1],AMBER_LINE[2]); doc.setLineWidth(0.3);
          doc.rect(ML, y, boxFullW, headH + bodyH, 'FD');
          doc.setFillColor(AMBER_LINE[0],AMBER_LINE[1],AMBER_LINE[2]); doc.rect(ML, y, 1.5, headH + bodyH, 'F');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(146,64,14);
          doc.text('CATATAN DARI CUSTOMER', ML + 5, y + 4.2);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(60,50,40);
          doc.text(custLines, ML + 5, y + headH + 3.2);
          y += headH + bodyH + 5;
        }

        const body = [];
        kelompokList.forEach((k, ki) => {
          const letter = k.kelompok || String.fromCharCode(65 + ki);
          body.push([{ content: letter + '. ' + (k.namaKelompok || '').toUpperCase(), colSpan: 9, styles: { fillColor: [226, 232, 240], textColor: DARK, fontStyle: 'bold', halign: 'left' } }]);
          (k.subItems || []).forEach((s, si) => {
            const qty = s.qty||0, harga = s.harga||0, hpp = s.hpp||0;
            const totalJual = (s.total != null) ? s.total : qty * harga;
            const totalHpp  = qty * hpp;
            const margin    = totalJual > 0 ? ((totalJual - totalHpp) / totalJual * 100) : 0;
            const mColor    = margin >= 25 ? GREEN : RED;
            body.push([String(si+1), s.deskripsi||'', String(qty), s.unit||'', rp(harga), rp(hpp), rp(totalJual), rp(totalHpp), { content: margin.toFixed(1)+'%', styles: { textColor: mColor, fontStyle: 'bold', halign: 'center' } }]);
          });
        });

        doc.autoTable({
          startY: y,
          head: [['No', 'Deskripsi Produk / Jasa', 'Qty', 'Unit', 'Harga Jual', 'HPP Satuan', 'Total Jual', 'Total HPP', 'Margin']],
          body: body, theme: 'grid',
          margin: { left: ML, right: MR },
          headStyles: { fillColor: BLUE, textColor: [255,255,255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
          bodyStyles: { fontSize: 7.5, textColor: [40,40,40], lineColor: [210,215,225], lineWidth: 0.15, cellPadding: 1.6 },
          columnStyles: { 0:{cellWidth:10,halign:'center'}, 1:{cellWidth:'auto'}, 2:{cellWidth:14,halign:'center'}, 3:{cellWidth:16,halign:'center'}, 4:{cellWidth:28,halign:'right'}, 5:{cellWidth:28,halign:'right'}, 6:{cellWidth:30,halign:'right'}, 7:{cellWidth:30,halign:'right'}, 8:{cellWidth:18,halign:'center'} },
          styles: { overflow: 'linebreak' },
          didParseCell: function(data) {
            if (data.column.index === 5 || data.column.index === 7) {
              if (data.section === 'head') { data.cell.styles.fillColor = [153,27,27]; data.cell.styles.textColor = [255,255,255]; }
              else if (data.section === 'body') { data.cell.styles.fillColor = [254,235,235]; data.cell.styles.textColor = [190,30,30]; data.cell.styles.fontStyle = 'bold'; }
            }
          },
        });

        // ── Hidden Cost (Internal) — itemized. Sudah termasuk dalam Total HPP
        //    (bukan biaya tambahan / bukan realisasi terpisah). Dokumen internal. ──
        const hcList = Array.isArray(tc.hiddenCosts) ? tc.hiddenCosts : [];
        if (hcList.length) {
          const hcBody = hcList.map(function(h, i) {
            const q = h.qty || 0, hpp = h.hpp || 0, tot = (h.total != null) ? h.total : q * hpp;
            return [String(i + 1), h.deskripsi || '', String(q), h.unit || '', rp(hpp), rp(tot)];
          });
          const hcTotal = hcList.reduce(function(a, h) { return a + ((h.total != null) ? h.total : (h.qty || 0) * (h.hpp || 0)); }, 0);
          hcBody.push([
            { content: 'Total Hidden Cost', colSpan: 5, styles: { fontStyle: 'bold', halign: 'right', fillColor: [254, 235, 235], textColor: [190, 30, 30] } },
            { content: rp(hcTotal), styles: { fontStyle: 'bold', halign: 'right', fillColor: [254, 235, 235], textColor: [190, 30, 30] } }
          ]);
          let hcY = doc.lastAutoTable.finalY + 5;
          if (hcY + 20 > PH - 14) { doc.addPage(); hcY = 20; }
          doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(153, 27, 27);
          doc.text('HIDDEN COST (INTERNAL)', ML, hcY);
          doc.autoTable({
            startY: hcY + 2,
            head: [['No', 'Deskripsi (Internal)', 'Qty', 'Unit', 'HPP Satuan', 'HPP Total']],
            body: hcBody, theme: 'grid',
            margin: { left: ML, right: MR },
            headStyles: { fillColor: [153, 27, 27], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
            bodyStyles: { fontSize: 7.5, textColor: [120, 40, 40], lineColor: [220, 200, 200], lineWidth: 0.15, cellPadding: 1.6 },
            columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 14, halign: 'center' }, 3: { cellWidth: 16, halign: 'center' }, 4: { cellWidth: 30, halign: 'right' }, 5: { cellWidth: 30, halign: 'right' } },
            styles: { overflow: 'linebreak' }
          });
        }

        let curY = doc.lastAutoTable.finalY + 5;
        const netSub    = (item.subtotal||0) - (item.diskon||0);
        // Fallback: hitung dari items JSON jika kolom hpp belum tersimpan (data lama/migrasi)
        let totalHppAll = item.hpp || 0;
        if (!totalHppAll) {
          try {
            JSON.parse(item.items || '[]').forEach(function(k) {
              (k.subItems || []).forEach(function(s) { totalHppAll += (s.qty||0) * (s.hpp||0); });
            });
          } catch(e) {}
        }
        const profit    = (item.profit != null && item.profit !== 0) ? item.profit : (netSub - totalHppAll);
        const marginAll = (item.marginPersen != null && item.marginPersen !== 0) ? item.marginPersen : (netSub > 0 ? (profit / netSub * 100) : 0);

        const sumLines = [];
        sumLines.push(['Subtotal (Jual)', 'Rp ' + rp(item.subtotal||0), false, DARK]);
        if ((item.diskon||0) > 0) sumLines.push(['Diskon', '- Rp ' + rp(item.diskon), false, RED]);
        if ((item.pajak||0) > 0) { const pct = netSub > 0 ? Math.round(item.pajak/netSub*100) : 11; sumLines.push(['PPN ' + pct + '%', 'Rp ' + rp(item.pajak), false, DARK]); }
        sumLines.push(['GRAND TOTAL', 'Rp ' + rp(item.grandTotal||0), true, BLUE]);
        sumLines.push(['Total HPP', 'Rp ' + rp(totalHppAll), false, RED]);
        sumLines.push(['Estimasi Profit', 'Rp ' + rp(profit), true, GREEN]);
        sumLines.push(['Margin', Number(marginAll).toFixed(1) + '%', true, GREEN]);

        const boxW = 90, boxX = PW - MR - boxW, rowH = 6;
        if (curY + sumLines.length * rowH > PH - 14) { doc.addPage(); curY = 20; }
        doc.setDrawColor(210,215,230); doc.setLineWidth(0.2);
        doc.rect(boxX, curY, boxW, sumLines.length * rowH);
        sumLines.forEach((r, i) => {
          const ry = curY + i * rowH;
          if (r[2]) { doc.setFillColor(245,247,250); doc.rect(boxX, ry, boxW, rowH, 'F'); }
          doc.setFontSize(8); doc.setFont('helvetica', r[2] ? 'bold' : 'normal');
          doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]); doc.text(r[0], boxX + 3, ry + 4);
          doc.setFont('helvetica', 'bold'); doc.setTextColor(r[3][0],r[3][1],r[3][2]);
          doc.text(r[1], boxX + boxW - 3, ry + 4, { align: 'right' });
        });

        const tcPairs = [['Material', tc.material_status], ['Delivery Time', tc.delivery_time], ['Delivery Cond.', tc.delivery_cond], ['Warranty', tc.warranty], ['Bonus', tc.bonus]].filter(p => p[1]);
        const catatan = tc.catatan || '';
        let ly = curY;
        if (tcPairs.length || catatan) {
          doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(DARK[0],DARK[1],DARK[2]);
          doc.text('Catatan Project:', ML, ly + 4); ly += 9;
          doc.setFont('helvetica', 'normal'); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]); doc.setFontSize(7.5);
          tcPairs.forEach(p => { doc.text('• ' + p[0] + ': ' + p[1], ML, ly); ly += 4.5; });
          if (catatan) { const lines = doc.splitTextToSize(catatan, boxX - ML - 6); doc.text(lines, ML, ly); ly += lines.length * 4.5; }
        }

        doc.setFontSize(7); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
        doc.text('Dokumen internal PT. Renus Global Indonesia — dilarang diberikan ke pelanggan.', ML, PH - 8);

        const fname = 'WO_' + String(item.noWO) + '_' + (item.namaProject || '').replace(/[\\/]/g, '-') + '.pdf';
        doc.save(fname);
        showNotification('PDF Work Order diunduh: ' + fname);
      } catch (err) {
        console.error(err);
        showNotification('Gagal membuat PDF Work Order: ' + (err.message || err), 'error');
      }
    };

    window._loadRealisasiHPP = function(noWO) {
      if (!noWO) return;
      var loading = document.getElementById('wo-hpp-loading');
      var content = document.getElementById('wo-hpp-content');
      if (loading) {
        loading.classList.remove('hidden');
        loading.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1 text-slate-400"></i> <span class="text-slate-400">Memuat data HPP...</span>';
      }
      if (content) content.classList.add('hidden');
      if (typeof google === 'undefined') return;
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            if (loading) {
              loading.classList.remove('hidden');
              loading.innerHTML = '<p class="text-rose-400 text-xs"><i class="fa-solid fa-circle-exclamation mr-1"></i>' + ((res && res.message) || 'Gagal memuat.') + '</p>';
            }
            return;
          }
          if (loading) loading.classList.add('hidden');
          if (content) content.classList.remove('hidden');
          _renderRealisasiHPP(res);
        })
        .withFailureHandler(function(err) {
          if (loading) {
            loading.classList.remove('hidden');
            loading.innerHTML = '<p class="text-rose-400 text-xs"><i class="fa-solid fa-circle-exclamation mr-1"></i>' + (err.message || err) + '</p>';
          }
        })
        .getRealisasiHPP(noWO);
    };

    function _renderRealisasiHPP(res) {
      var rp = function(v) { return 'Rp ' + Math.round(Math.abs(v || 0)).toLocaleString('id-ID'); };
      var el = function(id) { return document.getElementById(id); };

      el('wo-hpp-kontrak').innerText = rp(res.nilaiKontrak);
      el('wo-hpp-est').innerText     = (res.estimasiHPP > 0) ? rp(res.estimasiHPP) : '—';
      el('wo-hpp-real').innerText    = rp(res.realisasiHPP);

      // Selisih card
      var isOver = (res.selisih || 0) < 0;
      el('wo-hpp-selisih-card').className = 'rounded-xl p-3 text-center border ' + (isOver ? 'bg-rose-50 border-rose-100' : 'bg-emerald-50 border-emerald-100');
      el('wo-hpp-selisih-label').className = 'text-[10px] uppercase font-semibold mb-1 ' + (isOver ? 'text-rose-500' : 'text-emerald-600');
      el('wo-hpp-selisih-label').innerText = isOver ? 'Over Budget' : 'Hemat';
      el('wo-hpp-selisih').className = 'text-base font-extrabold ' + (isOver ? 'text-rose-600' : 'text-emerald-700');
      el('wo-hpp-selisih').innerText = (isOver ? '- ' : '') + rp(Math.abs(res.selisih || 0));
      el('wo-hpp-selisih-pct').className = 'text-[10px] mt-0.5 ' + (isOver ? 'text-rose-400' : 'text-emerald-500');
      el('wo-hpp-selisih-pct').innerText = (res.selisihPersen !== null && res.selisihPersen !== undefined)
        ? Math.abs(res.selisihPersen) + '% dari est. HPP' : '—';

      // Margin cards
      var margEst  = res.marginEstimasi;
      var margReal = res.marginRealisasi;
      el('wo-hpp-marg-est').innerText = (margEst !== null && margEst !== undefined) ? margEst.toFixed(1) + '%' : '—';
      var isLower = (margReal !== null && margReal !== undefined && margEst !== null && margEst !== undefined && margReal < margEst);
      el('wo-hpp-marg-real-card').className = 'rounded-xl p-3 text-center border ' + (isLower ? 'bg-rose-50 border-rose-100' : 'bg-emerald-50 border-emerald-100');
      el('wo-hpp-marg-real-label').className = 'text-[10px] uppercase font-semibold mb-1 ' + (isLower ? 'text-rose-500' : 'text-emerald-600');
      el('wo-hpp-marg-real').className = 'text-base font-extrabold ' + (isLower ? 'text-rose-600' : 'text-emerald-700');
      el('wo-hpp-marg-real').innerText = (margReal !== null && margReal !== undefined) ? margReal.toFixed(1) + '%' : '—';

      // Breakdown per akun (zebra + baris total)
      var akunTbody = el('wo-hpp-akun-tbody');
      if (!res.breakdownAkun || res.breakdownAkun.length === 0) {
        akunTbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-300">Belum ada pengeluaran</td></tr>';
      } else {
        var totAkun = res.breakdownAkun.reduce(function(s, a) { return s + (a.total || 0); }, 0);
        akunTbody.innerHTML = res.breakdownAkun.map(function(a, i) {
          return '<tr class="' + (i % 2 ? 'bg-slate-50/50 ' : '') + 'border-b border-slate-50">'
            + '<td class="p-2 text-slate-700 font-medium">' + _escWO(a.namaAkun) + '</td>'
            + '<td class="p-2 text-right text-slate-800 font-bold whitespace-nowrap">' + rp(a.total) + '</td>'
            + '<td class="p-2 text-right text-slate-400 whitespace-nowrap">' + a.persen + '%</td>'
            + '</tr>';
        }).join('')
          + '<tr class="border-t-2 border-slate-200 bg-slate-50">'
          + '<td class="p-2 font-bold text-slate-600">Total</td>'
          + '<td class="p-2 text-right font-extrabold text-slate-800 whitespace-nowrap">' + rp(totAkun) + '</td>'
          + '<td class="p-2 text-right text-slate-400">100%</td>'
          + '</tr>';
      }

      // Breakdown per sumber (zebra + baris total)
      var sumberTbody = el('wo-hpp-sumber-tbody');
      var sClr = { 'Pembayaran PO': 'text-blue-700', 'Penggunaan Stok': 'text-amber-700', 'Langsung': 'text-emerald-700' };
      if (!res.breakdownSumber || res.breakdownSumber.length === 0) {
        sumberTbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-slate-300">—</td></tr>';
      } else {
        var totSumber = res.breakdownSumber.reduce(function(s, x) { return s + (x.total || 0); }, 0);
        sumberTbody.innerHTML = res.breakdownSumber.map(function(s, i) {
          return '<tr class="' + (i % 2 ? 'bg-slate-50/50 ' : '') + 'border-b border-slate-50">'
            + '<td class="p-2 font-medium ' + (sClr[s.sumber] || 'text-slate-600') + '">' + _escWO(s.sumber) + '</td>'
            + '<td class="p-2 text-right text-slate-800 font-bold whitespace-nowrap">' + rp(s.total) + '</td>'
            + '<td class="p-2 text-right text-slate-400 whitespace-nowrap">' + s.persen + '%</td>'
            + '</tr>';
        }).join('')
          + '<tr class="border-t-2 border-slate-200 bg-slate-50">'
          + '<td class="p-2 font-bold text-slate-600">Total</td>'
          + '<td class="p-2 text-right font-extrabold text-slate-800 whitespace-nowrap">' + rp(totSumber) + '</td>'
          + '<td class="p-2 text-right text-slate-400">100%</td>'
          + '</tr>';
      }

      // Daftar pengeluaran
      var expTbody = el('wo-hpp-exp-tbody');
      var sBadge   = function(s) {
        var cls = { 'Pembayaran PO': 'bg-blue-50 text-blue-700', 'Penggunaan Stok': 'bg-amber-50 text-amber-700', 'Langsung': 'bg-emerald-50 text-emerald-700' };
        return '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold ' + (cls[s] || 'bg-slate-100 text-slate-500') + '">' + _escWO(s) + '</span>';
      };
      if (!res.pengeluaranList || res.pengeluaranList.length === 0) {
        expTbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-300">Belum ada pengeluaran untuk WO ini.</td></tr>';
      } else {
        expTbody.innerHTML = res.pengeluaranList.map(function(p) {
          return '<tr class="border-b border-slate-50 hover:bg-slate-50/50">'
            + '<td class="p-2 text-slate-400 whitespace-nowrap">' + (p.tanggal || '—') + '</td>'
            + '<td class="p-2 whitespace-nowrap">' + sBadge(p.sumber) + '</td>'
            + '<td class="p-2 text-slate-700 max-w-[140px] truncate" title="' + _escWO(p.deskripsi) + '">'
            + _escWO(p.deskripsi)
            + (p.noPO ? ' <span class="text-slate-400 text-[10px]">· ' + _escWO(p.noPO) + '</span>' : '')
            + '</td>'
            + '<td class="p-2 text-slate-500 whitespace-nowrap max-w-[80px] truncate" title="' + _escWO(p.namaAkun) + '">' + _escWO(p.namaAkun) + '</td>'
            + '<td class="p-2 text-right font-bold text-slate-800 whitespace-nowrap">' + rp(p.total) + '</td>'
            + '</tr>';
        }).join('');
      }

      // PO Terkait
      var poCont = el('wo-hpp-po-content');
      if (!res.poTerkait || res.poTerkait.length === 0) {
        poCont.innerHTML = '<p class="text-xs text-slate-300 text-center py-4">Tidak ada PO yang terkait dengan WO ini.</p>';
      } else {
        poCont.innerHTML = '<div class="space-y-2">'
          + res.poTerkait.map(function(po) {
            var lunas = po.statusBayar === 'Lunas';
            return '<div class="bg-slate-50 rounded-xl p-3 text-xs flex items-start justify-between gap-2">'
              + '<div class="flex-1 min-w-0">'
              + '<p class="font-bold text-blue-700">' + _escWO(po.noPO) + '</p>'
              + '<p class="text-slate-500 truncate">' + _escWO(po.namaSupplier) + '</p>'
              + '</div>'
              + '<div class="text-right shrink-0">'
              + '<p class="font-bold text-slate-800">' + rp(po.grandTotal) + '</p>'
              + (po.sisaTagihan > 0 ? '<p class="text-rose-500 text-[10px]">Sisa: ' + rp(po.sisaTagihan) + '</p>' : '<p class="text-emerald-500 text-[10px]">Lunas</p>')
              + '</div>'
              + '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full shrink-0 whitespace-nowrap '
              + (lunas ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700')
              + '">' + _escWO(po.statusBayar) + '</span>'
              + '</div>';
          }).join('')
          + '</div>';
      }
    }

    function _escWO(s) {
      return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Export Laporan Pengeluaran per WO (Fase 4) ─────────────────
    window.exportLaporanPengeluaranWO = function(noWO) {
      noWO = noWO || (_woDetailCurrent && _woDetailCurrent.noWO);
      if (!noWO) return;
      toggleLoader(true, 'Menyiapkan laporan pengeluaran...');
      google.script.run
        .withSuccessHandler(function(res) {
          toggleLoader(false);
          if (!res || !res.success) { showNotification((res && res.message) || 'Gagal mengambil data.', 'error'); return; }
          _generateLaporanPengeluaranPDF(res);
        })
        .withFailureHandler(function(err) {
          toggleLoader(false);
          showNotification('Gagal: ' + (err.message || err), 'error');
        })
        .getExportPengeluaranWO(noWO);
    };

    function _generateLaporanPengeluaranPDF(data) {
      try {
        var jsPDF = window.jspdf.jsPDF;
        var doc   = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        var PW = 210, ML = 14, MR = 14;
        var DARK  = [30, 41, 59];
        var SLATE = [100, 116, 139];
        var BLUE  = [30, 64, 175];
        var rp    = function(v) { return Math.round(Math.abs(v || 0)).toLocaleString('id-ID'); };

        // ── Header ──
        doc.setFillColor(DARK[0], DARK[1], DARK[2]);
        doc.rect(0, 0, PW, 22, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text('LAPORAN PENGELUARAN PROJECT', ML, 11);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
        doc.setTextColor(190, 200, 220);
        doc.text('PT. Renus Global Indonesia', ML, 17);
        doc.setFont('helvetica', 'bold'); doc.setTextColor(170, 195, 255);
        doc.text('WO ' + data.header.noWO, PW - MR, 10, { align: 'right' });
        doc.setFont('helvetica', 'normal'); doc.setTextColor(190, 200, 220);
        doc.text('Cetak: ' + data.header.tanggalCetak, PW - MR, 16, { align: 'right' });

        var y = 28;
        doc.setFontSize(8); doc.setFont('helvetica', 'bold'); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
        doc.text('Project', ML, y);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
        doc.text(': ' + (data.header.namaProject || '—'), ML + 22, y); y += 5;
        doc.setFont('helvetica', 'bold'); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
        doc.text('Customer', ML, y);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
        doc.text(': ' + (data.header.namaKlien || '—'), ML + 22, y); y += 8;

        // ── A. Ringkasan ──
        var r = data.ringkasan;
        var isOver   = (r.selisih || 0) < 0;
        var margEst  = (r.marginEstimasi  !== null && r.marginEstimasi  !== undefined) ? r.marginEstimasi.toFixed(1)  + '%' : '—';
        var margReal = (r.marginRealisasi !== null && r.marginRealisasi !== undefined) ? r.marginRealisasi.toFixed(1) + '%' : '—';

        doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
        doc.text('A. RINGKASAN', ML, y); y += 4;

        doc.autoTable({
          startY: y,
          body: [
            ['Nilai Kontrak (excl. PPN)', 'Rp ' + rp(r.nilaiKontrak), '', ''],
            ['Estimasi HPP', 'Rp ' + rp(r.estimasiHPP), 'Estimasi Margin', margEst],
            ['Realisasi HPP', 'Rp ' + rp(r.realisasiHPP), 'Realisasi Margin', margReal],
            [(isOver ? 'Over Budget' : 'Hemat') + ' vs Estimasi', (isOver ? '- ' : '') + 'Rp ' + rp(Math.abs(r.selisih || 0)), '', '']
          ],
          theme: 'plain',
          margin: { left: ML, right: MR },
          bodyStyles: { fontSize: 8, cellPadding: 2, textColor: DARK },
          columnStyles: {
            0: { fontStyle: 'bold', textColor: SLATE, cellWidth: 52 },
            1: { cellWidth: 38 },
            2: { fontStyle: 'bold', textColor: SLATE, cellWidth: 36 },
            3: { cellWidth: 30 }
          }
        });
        y = doc.lastAutoTable.finalY + 7;

        // ── B. Rekap per akun ──
        doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
        doc.text('B. REKAP PER AKUN PEMBAYARAN', ML, y); y += 4;

        var rekapRows = (data.rekapAkun || []).map(function(a) {
          return [a.namaAkun || '', 'Rp ' + rp(a.total), (a.persen || 0) + '%'];
        });
        rekapRows.push(['TOTAL REALISASI HPP', 'Rp ' + rp(r.realisasiHPP), '100%']);

        doc.autoTable({
          startY: y,
          head: [['Akun Pembayaran', 'Total', '%']],
          body: rekapRows,
          theme: 'grid',
          margin: { left: ML, right: MR },
          headStyles: { fillColor: BLUE, textColor: [255, 255, 255], fontSize: 8, fontStyle: 'bold', halign: 'center' },
          bodyStyles: { fontSize: 8, textColor: DARK, cellPadding: 2 },
          columnStyles: { 0: { cellWidth: 'auto' }, 1: { halign: 'right', cellWidth: 40 }, 2: { halign: 'right', cellWidth: 16 } },
          didParseCell: function(d) {
            if (d.section === 'body' && d.row.index === rekapRows.length - 1) {
              d.cell.styles.fontStyle = 'bold';
              d.cell.styles.fillColor = [226, 232, 240];
            }
          }
        });
        y = doc.lastAutoTable.finalY + 7;

        // ── C. Rincian per akun ──
        doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
        doc.text('C. RINCIAN PENGELUARAN PER AKUN', ML, y); y += 4;

        (data.detailPerAkun || []).forEach(function(grp) {
          var itemRows = grp.items.map(function(it) {
            return [
              it.tanggal || '—',
              it.sumber  || '',
              it.noPO    || '—',
              it.deskripsi || '',
              (it.qty || 1) + (it.satuan ? ' ' + it.satuan : ''),
              'Rp ' + rp(it.hargaSatuan),
              'Rp ' + rp(it.total)
            ];
          });
          itemRows.push(['', '', '', 'Subtotal ' + (grp.namaAkun || ''), '', '', 'Rp ' + rp(grp.subtotal)]);

          doc.autoTable({
            startY: y,
            head: [
              [{ content: grp.namaAkun || '', colSpan: 7, styles: { fillColor: [226, 232, 240], textColor: DARK, fontStyle: 'bold', halign: 'left' } }],
              ['Tgl', 'Sumber', 'No PO', 'Deskripsi', 'Qty', 'Harga Sat.', 'Total']
            ],
            body: itemRows,
            theme: 'grid',
            margin: { left: ML, right: MR },
            headStyles: { fillColor: [241, 245, 249], textColor: SLATE, fontSize: 7.5, fontStyle: 'bold' },
            bodyStyles: { fontSize: 7.5, textColor: DARK, cellPadding: 1.8 },
            columnStyles: {
              0: { cellWidth: 18 },
              1: { cellWidth: 26 },
              2: { cellWidth: 18 },
              3: { cellWidth: 'auto' },
              4: { halign: 'right', cellWidth: 16 },
              5: { halign: 'right', cellWidth: 24 },
              6: { halign: 'right', cellWidth: 24 }
            },
            didParseCell: function(d) {
              if (d.section === 'body' && d.row.index === itemRows.length - 1) {
                d.cell.styles.fontStyle = 'bold';
                d.cell.styles.fillColor = [241, 245, 249];
              }
            }
          });
          y = doc.lastAutoTable.finalY + 4;
        });

        // ── Footer per halaman ──
        var pageCount = doc.internal.getNumberOfPages();
        for (var pg = 1; pg <= pageCount; pg++) {
          doc.setPage(pg);
          doc.setFontSize(7); doc.setFont('helvetica', 'normal'); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
          doc.text('Laporan Pengeluaran WO ' + data.header.noWO + ' — PT. Renus Global Indonesia', ML, 293);
          doc.text('Hal ' + pg + ' / ' + pageCount, PW - MR, 293, { align: 'right' });
        }

        var fname = 'LaporanPengeluaran_WO' + data.header.noWO + '_' + (data.header.namaProject || '').replace(/[\\/\s:*?"<>|]/g, '-') + '.pdf';
        doc.save(fname);
        showNotification('Laporan pengeluaran berhasil diunduh: ' + fname);
      } catch (err) {
        console.error(err);
        showNotification('Gagal membuat PDF: ' + (err.message || err), 'error');
      }
    }

</script>
