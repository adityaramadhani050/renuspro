<script>
// ================================================================
//  QUALITY CONTROL (QC) — dokumentasi foto lapangan per Work Order.
//  Site Engineer upload; SPV approve/reject; dashboard ringkasan.
// ================================================================

// Kompres/resize foto di browser sebelum diupload — foto kamera HP modern
// bisa 3-8MB; dipangkas ke maks 1600px sisi terpanjang + JPEG ~80% supaya
// upload jauh lebih cepat tanpa terlihat bedanya di thumbnail.
function _qcResizeImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxDim = 1280;
      var w = img.naturalWidth || 800, h = img.naturalHeight || 600;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.72); }
      catch (err) { cb(null); return; }
      cb(dataUrl);
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

let _qcWOList = [];      // daftar Work Order
let _qcTab    = 'proses';// tab daftar: 'proses' (pct<100) | 'selesai' (pct=100)
let _qcDash   = null;    // ringkasan dashboard
let _qcWO     = null;    // WO yang sedang dibuka
let _qcItems  = [];      // checklist item WO terbuka
let _qcSiteEngineers = null; // cache daftar site engineer (untuk penugasan)
let _qcSectionOpen = {};     // accordion: section terbuka di detail
let _qcGroups = {};          // cache grup item per section (untuk lazy render)

function _qcUserNama() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _qcRole() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
function _qcUserId() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.id) ? _currentUser.id : ''; }
function _qcCanUpload() { var r = _qcRole(); return r === 'siteengineer' || r === 'admin'; }
function _qcCanReview() { var r = _qcRole(); return r === 'leadengineer' || r === 'admin'; }
function _qcCanAssign() { var r = _qcRole(); return r === 'leadengineer' || r === 'admin'; }
function _qcEsc(s) { return (s == null ? '' : s.toString()).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function _qcThumb(fileId, fileUrl, sz) { return _fotoDisplaySrc(fileId, fileUrl, sz || 'w200'); }  // Supabase pakai fileUrl, Drive lama pakai thumbnail fileId
function _qcJs(s) { return _qcEsc(JSON.stringify(s == null ? '' : s)); }  // aman utk arg string di dalam onclick="..."

var _QC_STATUS = {
  'Approved':     { c: 'bg-emerald-100 text-emerald-700', t: 'Approved' },
  'Pending':      { c: 'bg-amber-100 text-amber-700',     t: 'Pending' },
  'Rejected':     { c: 'bg-rose-100 text-rose-700',       t: 'Rejected' },
  'NA':           { c: 'bg-slate-200 text-slate-500',     t: 'N/A' },
  'Belum Upload': { c: 'bg-slate-100 text-slate-400',     t: 'Belum Upload' }
};
function _qcBadge(st) { var m = _QC_STATUS[st] || _QC_STATUS['Belum Upload']; return '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ' + m.c + '">' + m.t + '</span>'; }

// ── Load ──────────────────────────────────────────────────────────
window.loadQC = function(fromNav) {
  var hint = document.getElementById('qc-role-hint');
  if (hint) hint.innerText = (_qcCanUpload() && _qcCanReview()) ? 'Admin' : (_qcCanReview() ? 'Lead Engineer' : (_qcCanUpload() ? 'Site Engineer' : 'Lihat'));
  document.getElementById('qc-detail').classList.add('hidden');
  document.getElementById('qc-manage').classList.add('hidden');
  document.getElementById('qc-home').classList.remove('hidden');
  var mbtn = document.getElementById('qc-manage-btn'); if (mbtn) mbtn.classList.toggle('hidden', !_qcCanAssign());
  var abtn = document.getElementById('qc-add-project-btn'); if (abtn) abtn.classList.toggle('hidden', !_qcCanAssign());
  if (typeof google === 'undefined') return;
  var render = function(res) {
    _qcDash = (res && res.success) ? res : { global: {}, perWO: [] };
    _qcWOList = _qcDash.perWO || [];
    _qcRenderCards();
    _qcRenderReviewQueue();
    _qcRenderTeamStats();
    _qcPopulateFilter();
    _qcRenderWOList();
  };
  var c = fromNav ? navCacheGet('qc') : null;
  if (c) { render(c); return; }
  document.getElementById('qc-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  // Site engineer hanya melihat WO yang di-assign; admin/lead lihat semua.
  var arg = (_qcRole() === 'siteengineer') ? { siteUserId: _qcUserId() } : {};
  google.script.run.withSuccessHandler(function(res) {
    navCacheSet('qc', res);
    render(res);
  }).withFailureHandler(function() {
    document.getElementById('qc-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-rose-400">Gagal memuat data QC.</div>';
  }).getQCDashboard(arg);
};

function _qcCard(label, val, cls, icon) {
  return '<div class="bg-white rounded-2xl border border-slate-150 p-4">'
    + '<div class="flex items-center gap-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid ' + icon + ' ' + cls + '"></i>' + label + '</div>'
    + '<div class="text-2xl font-extrabold text-slate-800">' + val + '</div></div>';
}
function _qcRenderCards() {
  var g = (_qcDash && _qcDash.global) || {};
  document.getElementById('qc-cards').innerHTML =
      _qcCard('Work Order', g.totalWO || 0, 'text-blue-500', 'fa-clipboard-check')
    + _qcCard('Approved', g.approved || 0, 'text-emerald-500', 'fa-circle-check')
    + _qcCard('Pending', g.pending || 0, 'text-amber-500', 'fa-clock')
    + _qcCard('Rejected', g.rejected || 0, 'text-rose-500', 'fa-circle-xmark');
}

// Umur pending → label & warna (semakin lama semakin merah).
function _qcAgeLabel(d) {
  if (d == null) return { txt: '-', cls: 'text-slate-400 bg-slate-100' };
  if (d <= 0) return { txt: 'hari ini', cls: 'text-emerald-700 bg-emerald-50' };
  if (d === 1) return { txt: '1 hari', cls: 'text-amber-700 bg-amber-50' };
  if (d <= 3) return { txt: d + ' hari', cls: 'text-amber-700 bg-amber-50' };
  return { txt: d + ' hari', cls: 'text-rose-700 bg-rose-50' };
}

// ── Antrean Review + Umur Pending (Lead Engineer/Admin) ────────────────────
function _qcRenderReviewQueue() {
  var wrap = document.getElementById('qc-review-queue-wrap');
  if (!wrap) return;
  if (!_qcCanReview()) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  var q = (_qcDash && _qcDash.reviewQueue) || [];
  var head = '<div class="flex items-center justify-between mb-3">'
    + '<p class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-list-check text-amber-500 text-[11px]"></i> Antrean Review</p>'
    + '<span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ' + (q.length ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700') + '">' + q.length + ' menunggu</span>'
    + '</div>';
  if (!q.length) {
    wrap.innerHTML = head + '<div class="text-center py-6 text-slate-400 text-xs"><i class="fa-solid fa-circle-check text-2xl mb-2 opacity-30 block text-emerald-400"></i>Tidak ada item menunggu review.</div>';
    return;
  }
  var LIMIT = 12;
  var rows = q.slice(0, LIMIT).map(function(it) {
    var a = _qcAgeLabel(it.ageDays);
    return '<button onclick="bukaQCDetail(\'' + _qcEsc(it.noWO) + '\')" title="Buka & review di detail WO" class="group w-full text-left flex items-center gap-2 bg-slate-50 hover:bg-amber-50 border border-slate-100 rounded-xl px-3 py-2 transition">'
      + '<div class="min-w-0 flex-1">'
      +   '<p class="text-xs font-semibold text-slate-700 truncate"><span class="font-mono text-[10px] text-slate-400 mr-1">' + _qcEsc(it.kode) + '</span>' + _qcEsc(it.label) + '</p>'
      +   '<p class="text-[10px] text-slate-400 truncate">' + _qcEsc(it.noWO) + (it.namaProject ? ' · ' + _qcEsc(it.namaProject) : '') + (it.uploadedBy ? ' · ' + _qcEsc(it.uploadedBy) : '') + '</p>'
      + '</div>'
      + '<span class="shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-lg ' + a.cls + '">' + a.txt + '</span>'
      + '<i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-amber-500 text-[11px] shrink-0 transition"></i>'
      + '</button>';
  }).join('');
  var more = q.length > LIMIT ? '<p class="text-[11px] text-slate-400 text-center mt-2">dan ' + (q.length - LIMIT) + ' item lainnya…</p>' : '';
  wrap.innerHTML = head + '<div class="space-y-1.5 max-h-80 overflow-y-auto">' + rows + '</div>' + more;
}

// ── Kinerja & Beban Tim per Site Engineer (Lead Engineer/Admin) ────────────
function _qcRenderTeamStats() {
  var wrap = document.getElementById('qc-team-wrap');
  if (!wrap) return;
  if (!_qcCanReview()) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  var team = (_qcDash && _qcDash.teamStats) || [];
  var head = '<div class="flex items-center justify-between mb-3">'
    + '<p class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-users-gear text-indigo-500 text-[11px]"></i> Kinerja &amp; Beban Tim</p>'
    + '<span class="text-[11px] font-bold text-slate-400">' + team.length + ' engineer</span>'
    + '</div>';
  if (!team.length) {
    wrap.innerHTML = head + '<div class="text-center py-6 text-slate-400 text-xs"><i class="fa-solid fa-user-helmet-safety text-2xl mb-2 opacity-30 block"></i>Belum ada aktivitas tim.</div>';
    return;
  }
  var rows = team.map(function(t) {
    var ftr = t.ftrPct == null ? '—' : t.ftrPct + '%';
    var rej = t.rejectRatePct == null ? '—' : t.rejectRatePct + '%';
    var ftrCls = t.ftrPct == null ? 'text-slate-400' : (t.ftrPct >= 80 ? 'text-emerald-600' : (t.ftrPct >= 50 ? 'text-amber-600' : 'text-rose-600'));
    var rejCls = 'text-rose-600';
    return '<div class="bg-slate-50 border border-slate-100 rounded-xl px-3 py-2.5">'
      + '<div class="flex items-center justify-between gap-2 mb-1.5">'
      +   '<p class="text-xs font-bold text-slate-700 truncate"><i class="fa-solid fa-user-helmet-safety text-indigo-300 mr-1"></i>' + _qcEsc(t.nama) + '</p>'
      +   '<span class="text-[10px] font-bold text-slate-400 shrink-0">' + t.items + ' item · ' + t.woCount + ' WO</span>'
      + '</div>'
      + '<div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] font-bold">'
      +   '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + t.approved + '</span>'
      +   '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + t.pending + '</span>'
      +   '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + t.rejected + '</span>'
      +   '<span class="ml-auto ' + ftrCls + '" title="FTR (First-Time-Right) — disetujui pada review pertama tanpa revisi">FTR ' + ftr + '</span>'
      +   '<span class="' + rejCls + '" title="RR (Rework Rate) — tingkat item yang ditolak/perlu revisi">RR ' + rej + '</span>'
      + '</div>'
      + '</div>';
  }).join('');
  wrap.innerHTML = head + '<div class="space-y-1.5 max-h-80 overflow-y-auto">' + rows + '</div>';
}

// ── Tambah Project ke QC (Lead Engineer / Admin) ──────────────────────────
function _qcOpenAddProject() {
  document.getElementById('modal-qc-project').classList.remove('hidden');
  var woSel = document.getElementById('qc-project-wo');
  var seBox = document.getElementById('qc-project-se');
  woSel.innerHTML = '<option value="">Memuat...</option>';
  seBox.innerHTML = '<div class="text-xs text-slate-400 py-1 px-1"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat site engineer...</div>';
  // WO yang belum terdaftar di QC
  google.script.run.withSuccessHandler(function(res) {
    var list = (res && res.success) ? (res.list || []) : [];
    if (!list.length) { woSel.innerHTML = '<option value="">Semua WO sudah terdaftar / tidak ada WO</option>'; return; }
    woSel.innerHTML = '<option value="">-- Pilih Work Order --</option>' + list.map(function(w) {
      return '<option value="' + _qcEsc(w.noWO) + '">' + _qcEsc(w.noWO) + ' — ' + _qcEsc(w.namaProject || '-') + (w.namaKlien ? ' (' + _qcEsc(w.namaKlien) + ')' : '') + '</option>';
    }).join('');
  }).withFailureHandler(function() { woSel.innerHTML = '<option value="">Gagal memuat WO</option>'; }).getAvailableWOForQC();
  // Daftar site engineer (checkbox, opsional)
  var renderSE = function() {
    var rows = (_qcSiteEngineers || []).map(function(u) {
      return '<label class="flex items-center gap-2 py-1.5 px-1 cursor-pointer">'
        + '<input type="checkbox" value="' + u.id + '" class="accent-orange-500 qc-project-se-cb">'
        + '<span class="text-sm text-slate-700">' + _qcEsc(u.nama) + '</span></label>';
    }).join('') || '<div class="text-xs text-slate-400 italic py-1 px-1">Belum ada user Site Engineer.</div>';
    seBox.innerHTML = rows;
  };
  if (_qcSiteEngineers) { renderSE(); return; }
  google.script.run.withSuccessHandler(function(res) { _qcSiteEngineers = (res && res.success) ? (res.list || []) : []; renderSE(); })
    .withFailureHandler(function() { _qcSiteEngineers = []; renderSE(); }).getSiteEngineerList();
}
function _qcCloseAddProject() { document.getElementById('modal-qc-project').classList.add('hidden'); }
function _qcSaveAddProject() {
  var noWO = (document.getElementById('qc-project-wo').value || '').trim();
  if (!noWO) return showNotification('Pilih Work Order dulu.', 'error');
  var ids = [];
  Array.prototype.forEach.call(document.querySelectorAll('.qc-project-se-cb'), function(cb) { if (cb.checked) ids.push(cb.value); });
  _qcCloseAddProject();              // tutup modal dulu agar tak menutupi loader
  toggleLoader(true, 'Menambahkan project...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Project ditambahkan.');
    loadQC();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menambahkan project.', 'error'); })
    .addQCProject(noWO, ids, _qcUserNama());
}

// Keluarkan project dari daftar QC.
function _qcRemoveProject(noWO) {
  showConfirm({ title: 'Keluarkan dari QC', message: 'Keluarkan WO ' + noWO + ' dari daftar QC? Foto & penugasan tetap tersimpan.', confirmText: 'Ya, Keluarkan', onConfirm: function() {
    toggleLoader(true, 'Memproses...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dikeluarkan dari QC.');
      kembaliQCHome();
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .removeQCProject(noWO);
  } });
}

// Filter site engineer (hanya utk Lead/Admin yg melihat banyak WO).
function _qcPopulateFilter() {
  var sel = document.getElementById('qc-filter-se');
  if (!sel) return;
  if (!_qcCanAssign()) { sel.classList.add('hidden'); return; }
  sel.classList.remove('hidden');
  var seen = {}, opts = [];
  _qcWOList.forEach(function(w) { (w.assigned || []).forEach(function(a) { if (!seen[a.id]) { seen[a.id] = 1; opts.push(a); } }); });
  opts.sort(function(a, b) { return (a.nama || '').localeCompare(b.nama || ''); });
  var prev = sel.value;
  sel.innerHTML = '<option value="">Semua Site Engineer</option>'
    + '<option value="__none__">Belum Ditugaskan</option>'
    + opts.map(function(a) { return '<option value="' + _qcEsc(a.id) + '">' + _qcEsc(a.nama) + '</option>'; }).join('');
  sel.value = prev;                    // pertahankan pilihan bila masih ada
  if (sel.value !== prev) sel.value = '';
}

function _qcSwitchTab(tab) {
  _qcTab = (tab === 'selesai') ? 'selesai' : 'proses';
  var on  = 'px-4 py-2 text-sm font-bold border-b-2 border-orange-500 text-orange-600 -mb-px transition';
  var off = 'px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition';
  var pBtn = document.getElementById('qc-tab-proses-btn');
  var sBtn = document.getElementById('qc-tab-selesai-btn');
  if (pBtn) pBtn.className = (_qcTab === 'proses') ? on : off;
  if (sBtn) sBtn.className = (_qcTab === 'selesai') ? on : off;
  _qcRenderWOList();
}

function _qcRenderWOList() {
  var box = document.getElementById('qc-wo-list');
  if (!box) return;
  var q = ((document.getElementById('qc-search') || {}).value || '').toLowerCase().trim();
  var fsel = document.getElementById('qc-filter-se');
  var fval = fsel ? fsel.value : '';
  var list = _qcWOList.filter(function(w) {
    if (q && ((w.noWO || '') + (w.namaProject || '') + (w.namaKlien || '')).toLowerCase().indexOf(q) === -1) return false;
    if (fval) {
      var asg = w.assigned || [];
      if (fval === '__none__') { if (asg.length) return false; }
      else if (!asg.some(function(a) { return a.id === fval; })) return false;
    }
    return true;
  });
  // Pisahkan per tab: Selesai (pct 100%) vs Sedang Proses (pct < 100%). Badge
  // mengikuti hasil pencarian/filter yang sedang aktif.
  var _qcIsSelesai = function(w) { return w.pct === 100 || w.selesaiManual; };
  var selesai = list.filter(_qcIsSelesai);
  var proses  = list.filter(function(w) { return !_qcIsSelesai(w); });
  var pb = document.getElementById('qc-tab-proses-badge');  if (pb) pb.textContent = proses.length;
  var sb = document.getElementById('qc-tab-selesai-badge'); if (sb) sb.textContent = selesai.length;
  var shown = (_qcTab === 'selesai') ? selesai : proses;
  if (!shown.length) {
    var emptyMsg = (q || fval) ? 'Tidak ada WO cocok.'
      : (_qcTab === 'selesai' ? 'Belum ada QC yang Approved (100%).'
      : (_qcRole() === 'siteengineer' ? 'Belum ada Work Order yang ditugaskan ke Anda. Hubungi Lead Engineer.' : 'Belum ada project QC. Klik <b>Tambah Project</b> untuk menambahkan Work Order.'));
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-clipboard-list mr-2"></i>' + emptyMsg + '</div>';
    return;
  }
  box.innerHTML = shown.map(function(w) {
    var badge = (w.pending + w.rejected) === 0 && w.pct === 100 ? 'bg-emerald-100 text-emerald-700'
      : (w.rejected ? 'bg-rose-100 text-rose-700' : (w.pending ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'));
    var barCls = w.pct >= 100 ? 'bg-emerald-500' : (w.pct > 0 ? 'bg-orange-400' : 'bg-slate-200');
    var asg = w.assigned || [];
    var seBadges = asg.length
      ? asg.map(function(a) { return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">' + _qcEsc(a.nama) + '</span>'; }).join('')
      : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-400">Belum ditugaskan</span>';
    var removeBtn = _qcCanAssign()
      ? '<button onclick="event.stopPropagation();_qcRemoveProject(\'' + _qcEsc(w.noWO) + '\')" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Keluarkan dari QC"><i class="fa-regular fa-trash-can text-sm"></i></button>'
      : '';
    var selesaiBtn = (_qcCanAssign() && !(w.selesaiManual || w.pct === 100))
      ? '<button onclick="event.stopPropagation();_qcCardTandaiSelesai(\'' + _qcEsc(w.noWO) + '\')" class="text-emerald-500 hover:text-emerald-700 hover:bg-emerald-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Tandai QC Approved"><i class="fa-regular fa-circle-check text-sm"></i></button>'
      : '';
    var remindBtn = ((_qcCanAssign() || _qcCanUpload()) && !(w.selesaiManual || w.pct === 100))
      ? '<button onclick="event.stopPropagation();_qcCardRemind(\'' + _qcEsc(w.noWO) + '\')" class="text-amber-500 hover:text-amber-700 hover:bg-amber-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Kirim reminder WhatsApp"><i class="fa-regular fa-bell text-sm"></i></button>'
      : '';
    return '<div onclick="bukaQCDetail(\'' + _qcEsc(w.noWO) + '\')" class="w-full text-left bg-white rounded-2xl border border-slate-150 hover:border-orange-300 hover:shadow-sm transition p-4 flex flex-col sm:flex-row sm:items-center gap-3 cursor-pointer">'
      + '<div class="flex-1 min-w-0">'
      +   '<div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700">' + _qcEsc(w.noWO) + '</span>'
      +     '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ' + badge + '">' + w.pct + '%</span>'
      +     (w.selesaiManual && w.pct !== 100 ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-700"><i class="fa-solid fa-circle-check mr-0.5"></i>Ditandai selesai</span>' : '') + '</div>'
      +   '<div class="font-bold text-slate-800 truncate">' + _qcEsc(w.namaProject || '-') + '</div>'
      +   '<div class="text-[11px] text-slate-400 truncate">' + _qcEsc(w.namaKlien || '') + '</div>'
      + '</div>'
      + '<div class="flex items-center gap-3 w-full sm:w-auto">'
      +   '<div class="flex flex-row sm:flex-col items-center sm:items-end gap-2 sm:gap-1.5 flex-1 sm:flex-none w-full sm:w-auto">'
      +     '<div class="flex flex-wrap gap-1 flex-1 min-w-0 sm:flex-none sm:justify-end">' + seBadges + '</div>'
      +     '<div class="shrink-0 text-right">'

// Helper: data URL → Uint8Array (bytes PDF) untuk pdf-lib.
function _qcDataUrlToBytes(dataUrl) {
  try {
    var b64 = String(dataUrl || '').split(',')[1] || '';
    if (!b64) return null;
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  } catch (e) { return null; }
}
// Helper: unduh bytes sebagai file PDF.
function _qcDownloadBytes(bytes, fileName) {
  var blob = new Blob([bytes], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fileName || 'laporan.pdf';
  document.body.appendChild(a); a.click();
  setTimeout(function() { try { document.body.removeChild(a); } catch (e) {} URL.revokeObjectURL(url); }, 1000);
}

async function _qcBuildPDF(d) {
  var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var _qcPdfAttach = [];   // dokumen PDF → di-merge halaman penuhnya di akhir
  var PW = 210, PH = 297, ML = 14, MR = 14, CW = PW - ML - MR;
  var DARK = [30,41,59], SLATE = [100,116,139], BLUE = [30,64,175], WHITE = [255,255,255];
  var BOTTOM = 284;
  function stColor(st) {
    return ({ Approved:[5,150,105], Pending:[217,119,6], Rejected:[225,29,72], NA:[100,116,139], 'Belum Upload':[148,163,184] })[st] || [148,163,184];
  }
  function header() {
    doc.setFillColor.apply(doc, DARK); doc.rect(0, 0, PW, 24, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor.apply(doc, WHITE);
    doc.text('LAPORAN QUALITY CONTROL', ML, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(190,200,220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(170,195,255);
    doc.text('No WO:', PW - MR, 9, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setTextColor.apply(doc, WHITE);
    doc.text(d.noWO || '-', PW - MR, 14, { align:'right' });
    doc.setFontSize(7); doc.setTextColor(190,200,220);
    doc.text('Dicetak: ' + (d.tglExport || ''), PW - MR, 19, { align:'right' });
  }
  // Kop gelap hanya di halaman pertama; halaman berikutnya mulai dari margin atas.
  function newPage() { doc.addPage(); y = 16; }
  function ensure(h) { if (y + h > BOTTOM) { newPage(); } }

  header();
  var y = 30;
  var s = d.summary || {};

  // Info project
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor.apply(doc, DARK);
  doc.text(d.namaProject || '-', ML, y); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, SLATE);
  doc.text('Klien: ' + (d.namaKlien || '-'), ML, y); y += 4;
  var seLine = doc.splitTextToSize('Site Engineer: ' + (d.assigned && d.assigned.length ? d.assigned.join(', ') : '-'), CW);
  doc.text(seLine, ML, y); y += seLine.length * 4 + 3;

  // Ringkasan: progress bar + KPI boxes
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, BLUE);
  doc.text('RINGKASAN', ML, y); y += 4;
  var pct = s.pct || 0;
  var barW = CW - 14;   // sisakan ~14mm untuk teks persentase tepat di samping bar
  doc.setFillColor(226,232,240); doc.roundedRect(ML, y, barW, 5, 1.2, 1.2, 'F');
  var fillW = Math.max(0, Math.min(1, pct / 100)) * barW;
  if (fillW > 0) { doc.setFillColor.apply(doc, pct >= 100 ? [5,150,105] : [249,115,22]); doc.roundedRect(ML, y, fillW, 5, 1.2, 1.2, 'F'); }
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, DARK);
  doc.text(pct + '%', ML + barW + 2, y + 4);
  y += 9;

  var kpis = [
    { label:'APPROVED', val: s.approved || 0, color:[5,150,105] },
    { label:'PENDING',  val: s.pending  || 0, color:[217,119,6] },
    { label:'REJECTED', val: s.rejected || 0, color:[225,29,72] },
    { label:'BELUM',    val: s.belum    || 0, color:[100,116,139] },
    { label:'N/A',      val: s.na       || 0, color:[100,116,139] }
  ];
  var kbW = (CW - 4 * 2.5) / 5, kbH = 15;
  kpis.forEach(function(k, i) {
    var bx = ML + i * (kbW + 2.5);
    doc.setFillColor(248,250,252); doc.setDrawColor(226,232,240);
    doc.roundedRect(bx, y, kbW, kbH, 2, 2, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor.apply(doc, SLATE);
    doc.text(k.label, bx + 2.5, y + 5);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor.apply(doc, k.color);
    doc.text(String(k.val), bx + 2.5, y + 12);
  });
  y += kbH + 8;

  // Sections & items
  (d.sections || []).forEach(function(sec) {
    ensure(14);
    doc.setFillColor(51,65,85); doc.roundedRect(ML, y, CW, 7, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, WHITE);
    doc.text((sec.kode || '') + '. ' + (sec.label || ''), ML + 3, y + 4.8);
    y += 10;

    (sec.items || []).forEach(function(it) {
      ensure(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, DARK);
      var labelLines = doc.splitTextToSize(it.kode + ' — ' + it.label + (it.wajib ? '' : ' (opsional)'), CW - 32);
      doc.text(labelLines, ML, y + 3);
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor.apply(doc, stColor(it.status));
      doc.text(it.statusLabel || '', PW - MR, y + 3, { align:'right' });
      y += labelLines.length * 4 + 1;

      // Catatan Lead tidak ditampilkan di PDF: laporan dibuat setelah semua
      // item Approved, jadi catatan revisi tak lagi relevan di laporan akhir.

      // Klasifikasi berdasarkan ISI (magic bytes di base64), bukan label:
      //   %PDF → base64 diawali 'JVBER'; JPEG → '/9j/'; PNG → 'iVBOR'.
      // File yang benar2 PDF → di-merge; selain itu diperlakukan sbg gambar
      // (mime dinormalkan bila salah label) agar addImage tak gagal.
      var _files = (it.foto || []).filter(function(f) { return f && f.dataUrl; });
      var foto = [], _pdfs = [];
      _files.forEach(function(f) {
        var _b64 = String(f.dataUrl).split(',')[1] || '';
        if (_b64.indexOf('JVBER') === 0) { _pdfs.push(f); return; }   // PDF asli (%PDF) → merge
        // Selain PDF → gambar (mime dinormalkan bila salah label) → render inline.
        var _im = _b64.indexOf('/9j/') === 0 ? 'image/jpeg' : (_b64.indexOf('iVBOR') === 0 ? 'image/png' : '');
        foto.push((_im && f.dataUrl.indexOf('data:' + _im) !== 0) ? { dataUrl: 'data:' + _im + ';base64,' + _b64 } : f);
      });
      if (foto.length) {
        // Layout foto menjaga rasio asli (tidak dipaksa tinggi), grid rapi:
        // 1 foto → setengah lebar; 2 → 2 kolom; ≥3 → 3 kolom. Potret ditengahkan.
        var perRow = foto.length === 1 ? 1 : (foto.length === 2 ? 2 : 3);
        var gap = 3;
        var boxW = perRow === 1 ? Math.min(90, CW) : (CW - (perRow - 1) * gap) / perRow;
        var maxH = perRow === 1 ? 62 : (perRow === 2 ? 56 : 42);
        for (var fi = 0; fi < foto.length; fi += perRow) {
          var rowItems = foto.slice(fi, fi + perRow);
          var cells = rowItems.map(function(f) {
            var iw = 4, ih = 3;
            try { var pr = doc.getImageProperties(f.dataUrl); iw = pr.width || 4; ih = pr.height || 3; } catch (e) {}
            var w = boxW, h = w * (ih / iw);
            if (h > maxH) { h = maxH; w = h * (iw / ih); }   // jaga rasio: batasi tinggi, lebar menyesuaikan
            return { f: f, w: w, h: h };
          });
          var rowH = cells.reduce(function(mx, c) { return Math.max(mx, c.h); }, 0);
          if (y + rowH > BOTTOM) { newPage(); }
          cells.forEach(function(c, ci) {
            var cellX = ML + ci * (boxW + gap);
            var drawX = cellX + (boxW - c.w) / 2;   // tengahkan foto potret dalam sel
            try { doc.addImage(c.f.dataUrl, drawX, y, c.w, c.h); } catch (e) {}
            doc.setDrawColor(226, 232, 240); doc.rect(drawX, y, c.w, c.h);
          });
          y += rowH + gap;
        }
        y += 1;
      }
      // Dokumen PDF: catat sebagai lampiran; halaman penuhnya digabung di akhir.
      if (_pdfs.length) {
        _pdfs.forEach(function(pf) {
          ensure(7);
          doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(30,64,175);
          var _ln = doc.splitTextToSize('Lampiran PDF: ' + (pf.fileName || 'dokumen.pdf') + ' (halaman lengkap terlampir di akhir laporan)', CW);
          doc.text(_ln, ML, y + 3); y += _ln.length * 4 + 1;
          _qcPdfAttach.push(pf);
        });
      }
      if (!foto.length && !_pdfs.length && it.status !== 'NA') {
        doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(148,163,184);
        doc.text('(Belum ada foto)', ML, y + 2); y += 5;
      }
      y += 3;
    });
  });

  // Footer halaman
  var totalPages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor.apply(doc, SLATE);
    doc.text('Halaman ' + p + ' / ' + totalPages, PW / 2, 292, { align:'center' });
    doc.text('PT. RENUS GLOBAL INDONESIA — KONFIDENSIAL', ML, 292);
  }

  var _fname = 'Laporan-QC-' + (d.noWO || '') + '.pdf';
  // Gabungkan seluruh halaman tiap lampiran PDF ke akhir laporan (pdf-lib).
  if (_qcPdfAttach.length) {
    var _PDFLib = window.PDFLib || (typeof PDFLib !== 'undefined' ? PDFLib : null);
    if (!_PDFLib || !_PDFLib.PDFDocument) {
      throw new Error('Modul PDF (pdf-lib) belum termuat. Muat ulang halaman lalu coba lagi.');
    }
    var _PDFDocument = _PDFLib.PDFDocument;
    var _mainBytes = _qcDataUrlToBytes(doc.output('datauristring')) || doc.output('arraybuffer');
    var _merged = await _PDFDocument.load(_mainBytes);
    for (var _ai = 0; _ai < _qcPdfAttach.length; _ai++) {
      try {
        var _b = _qcDataUrlToBytes(_qcPdfAttach[_ai].dataUrl);
        if (!_b || !_b.length) continue;
        var _src = await _PDFDocument.load(_b, { ignoreEncryption: true });
        var _pgs = await _merged.copyPages(_src, _src.getPageIndices());
        _pgs.forEach(function(pg) { _merged.addPage(pg); });
      } catch (e) { /* file bukan PDF valid → lewati (sudah difilter magic bytes) */ }
    }
    _qcDownloadBytes(await _merged.save(), _fname);
  } else {
    doc.save(_fname);
  }
}

    // Export PDF: tersedia untuk Lead/Admin & Site Engineer.
    var exportBtn = (canManage || _qcCanUpload())
      ? '<button onclick="_qcExportPDF()" title="Export PDF" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-file-pdf text-rose-500"></i><span class="hidden sm:inline"> Export PDF</span></button>'
      : '';
    // Tandai Approved & Atur Site Engineer: hanya Lead Engineer / Admin.
    var manageBtns = canManage
      ? selesaiBtn
        + '<div class="relative">'
        +   '<button onclick="_qcToggleAssign(event)" title="Atur Site Engineer" class="inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold px-3 sm:px-4 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-user-pen"></i><span class="hidden sm:inline"> Atur Site Engineer</span><i class="fa-solid fa-chevron-down text-[10px] ml-0.5 hidden sm:inline"></i></button>'
        +   '<div id="qc-assign-panel" class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-slate-150 z-40 p-4"></div>'
        + '</div>'
      : '';
    var reloadBtn = '<button onclick="_engMuatUlang(\'_qcReloadDetail\', this)" title="Muat ulang" class="inline-flex items-center justify-center bg-white hover:bg-slate-50 text-slate-500 border border-slate-200 h-[42px] w-[42px] rounded-xl shadow-sm transition shrink-0"><i class="fa-solid fa-rotate-right"></i></button>'
      + '<button onclick="openWOContext(_qcWO.noWO)" title="Info Work Order: item jasa/material, budget, catatan customer, site survey, MoM Hand Over" class="inline-flex items-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-100 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-circle-info"></i><span class="hidden sm:inline"> Info WO</span></button>';
    actions.innerHTML = '<div class="flex items-center gap-2 flex-wrap justify-end">' + reloadBtn + draftBtns + remindBtns + exportBtn + manageBtns + '</div>';
  }
  _qcRenderHead(summary);
  _qcRenderDetailBody();
}

// Header ringkasan (progress + chips + badge site engineer). Dipisah dari
// _qcRenderDetail agar bisa di-refresh sendiri (tanpa render ulang body) setelah
// aksi approve/reject/upload per-item — sehingga item lain tak terganggu.
function _qcRenderHead(summary) {
  summary = summary || {};
  var head = document.getElementById('qc-detail-head');
  if (!head) return;
  var pct = summary.pct || 0;
  var assigned = _qcWO.assigned || [];
  var assignedHtml = assigned.length
    ? assigned.map(function(a) { return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600 inline-block">' + _qcEsc(a.nama) + '</span>'; }).join(' ')
    : '<span class="text-[11px] text-slate-400 italic">Belum ditugaskan</span>';

  head.innerHTML = '<div class="flex items-start justify-between gap-3">'
    + '<div class="min-w-0">'
    +   '<div class="flex items-center gap-2"><span class="font-mono font-extrabold text-slate-700 text-lg">' + _qcEsc(_qcWO.noWO) + '</span></div>'
    +   '<div class="font-bold text-slate-800">' + _qcEsc(_qcWO.namaProject || '-') + '</div>'
    +   '<div class="text-xs text-slate-400">' + _qcEsc(_qcWO.namaKlien || '') + '</div>'
    + '</div>'
    + '<div class="flex flex-wrap justify-end gap-1 shrink-0 max-w-[45%]">' + assignedHtml + '</div>'
    + '</div>'
    + '<div class="flex items-center gap-2 mt-3">'
    +   '<div class="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-2.5 ' + (pct >= 100 ? 'bg-emerald-500' : 'bg-orange-400') + '" style="width:' + pct + '%"></div></div>'
    +   '<span class="text-base font-extrabold text-slate-800 shrink-0 w-12 text-right">' + pct + '%</span>'
    + '</div>'
    + '<div class="flex flex-wrap gap-3 mt-3 text-[11px] font-bold">'
    +   '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + (summary.approved || 0) + ' Approved</span>'
    +   '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + (summary.pending || 0) + ' Pending</span>'
    +   '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + (summary.rejected || 0) + ' Rejected</span>'
    +   '<span class="text-slate-400"><i class="fa-regular fa-circle"></i> ' + (summary.belum || 0) + ' Belum</span>'
    +   '<span class="text-slate-400">N/A ' + (summary.na || 0) + '</span>'
    + '</div>';
}

// Hitung ulang ringkasan dari data lokal (_qcItems). Meniru _qcCountSummary di
// server (pct = item wajib yang Approved / total item wajib).
function _qcComputeSummary() {
  var s = { total: 0, approved: 0, pending: 0, rejected: 0, belum: 0, na: 0, wajibTotal: 0, wajibSelesai: 0 };
  (_qcItems || []).forEach(function(it) {
    s.total++;
    if (it.status === 'Approved') s.approved++;
    else if (it.status === 'Pending') s.pending++;
    else if (it.status === 'Rejected') s.rejected++;
    else if (it.status === 'NA') s.na++;
    else s.belum++;
    if (it.wajib) { s.wajibTotal++; if (it.status === 'Approved') s.wajibSelesai++; }
  });
  s.pct = s.wajibTotal ? Math.round((s.wajibSelesai / s.wajibTotal) * 100) : 0;
  return s;
}
function _qcRefreshHead() { try { _qcRenderHead(_qcComputeSummary()); } catch (e) {} }

// Badge ringkasan per section (semua tuntas → "Approved" hijau; selain itu
// chips hitungan). Dipakai saat render awal & saat refresh live.
function _qcSectionBadgeHtml(g) {
  var ap = 0, rej = 0, pen = 0, bel = 0;
  g.items.forEach(function(it) {
    if (it.status === 'Approved') ap++;
    else if (it.status === 'Rejected') rej++;
    else if (it.status === 'Pending') pen++;
    else if (it.status === 'Belum Upload') bel++;
  });
  var allDone = g.items.length > 0 && g.items.every(function(it) { return it.status === 'Approved' || it.status === 'NA'; });
  return allDone
    ? '<span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full"><i class="fa-solid fa-circle-check mr-0.5"></i>Approved</span>'
    : '<span class="inline-flex items-center gap-1.5 text-[10px] font-bold">' + _qcCountChips(ap, pen, rej, bel) + '</span>';
}
// Refresh badge 1 section (tanpa render ulang isinya).
function _qcRefreshSection(sec) {
  var g = _qcGroups[sec]; if (!g) return;
  var el = document.getElementById('qc-sec-badge-' + sec);
  if (el) el.innerHTML = _qcSectionBadgeHtml(g);
}

// Download draft BAST / Surat Garansi utk WO yg sedang dibuka di QC. Memakai
// generator yang sama dengan panel Dokumen Project (detail Work Order).
function _qcDraftBAST() {
  var no = _qcWO && _qcWO.noWO; if (!no) return;
  if (typeof window._woGenerateBAST === 'function') window._woGenerateBAST(no);
  else showNotification('Modul dokumen belum siap. Muat ulang halaman.', 'error');
}
function _qcDraftGaransi() {
  var no = _qcWO && _qcWO.noWO; if (!no) return;
  if (typeof window._woGenerateGaransi === 'function') window._woGenerateGaransi(no);
  else showNotification('Modul dokumen belum siap. Muat ulang halaman.', 'error');
}

// Reminder WA (dengan konfirmasi). Backend menangani cooldown & hitungan.
function _qcRemindSite() {
  var no = _qcWO && _qcWO.noWO; if (!no) return;
  showConfirm({ title: 'Ingatkan Site Engineer', message: 'Kirim reminder WhatsApp ke Site Engineer WO ini untuk melengkapi QC yang belum upload / ditolak?', confirmText: 'Ya, Kirim', icon: 'fa-bell', onConfirm: function() {
    toggleLoader(true, 'Mengirim reminder...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal mengirim reminder.', 'error'); })
      .qcRemindSiteEngineer(no, _qcUserNama());
  } });
}
function _qcRemindLead() {
  var no = _qcWO && _qcWO.noWO; if (!no) return;
  showConfirm({ title: 'Ingatkan Lead Engineer', message: 'Kirim reminder WhatsApp ke Lead Engineer untuk mereview QC yang telah terupload (Pending)?', confirmText: 'Ya, Kirim', icon: 'fa-bell', onConfirm: function() {
    toggleLoader(true, 'Mengirim reminder...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false); showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal mengirim reminder.', 'error'); })
      .qcRemindLeadEngineer(no, _qcUserNama());
  } });
}

// Chips hitungan status (Approved selalu tampil; Pending/Rejected/Belum hanya
// bila >0). Dipakai bersama di header accordion section & list card QC.
function _qcCountChips(ap, pen, rej, bel) {
  var out = '<span class="text-emerald-600" title="Approved"><i class="fa-solid fa-circle-check"></i> ' + (ap || 0) + '</span>';
  if (pen) out += '<span class="text-amber-600" title="Pending — perlu direview"><i class="fa-solid fa-clock"></i> ' + pen + '</span>';
  if (rej) out += '<span class="text-rose-600" title="Rejected"><i class="fa-solid fa-circle-xmark"></i> ' + rej + '</span>';
  if (bel) out += '<span class="text-slate-400" title="Belum diupload"><i class="fa-regular fa-circle"></i> ' + bel + '</span>';
  return out;
}

// Body checklist = accordion per section (Item QC). Klik header buka/tutup detail.
function _qcRenderDetailBody() {
  var groups = [];
  var idx = {};
  _qcItems.forEach(function(it) {
    if (idx[it.section] == null) { idx[it.section] = groups.length; groups.push({ section: it.section, label: it.sectionLabel, items: [] }); }
    groups[idx[it.section]].items.push(it);
  });
  _qcGroups = {};
  groups.forEach(function(g) { _qcGroups[g.section] = g; });
  document.getElementById('qc-detail-body').innerHTML = groups.map(function(g) {
    // Badge dibungkus span ber-id agar bisa di-refresh live (tanpa render ulang
    // isi section) setelah approve/reject/upload per-item.
    var mini = '<span id="qc-sec-badge-' + g.section + '" class="ml-2 inline-flex items-center">' + _qcSectionBadgeHtml(g) + '</span>';
    return '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
      + '<button onclick="_qcToggleSection(\'' + g.section + '\')" class="w-full flex items-center gap-1 px-5 py-3.5 hover:bg-slate-50 transition text-left">'
      +   '<span class="font-extrabold text-sm text-slate-700">' + _qcEsc(g.section) + '. ' + _qcEsc(g.label) + '</span>' + mini
      +   '<i id="qc-chev-' + g.section + '" class="fa-solid fa-chevron-down text-slate-400 ml-auto"></i>'
      + '</button>'
      + '<div id="qc-sec-body-' + g.section + '" class="hidden divide-y divide-slate-100 border-t border-slate-100"></div>'
      + '</div>';
  }).join('');
  // Buka kembali section yang sebelumnya terbuka (render ulang isinya).
  Object.keys(_qcSectionOpen).forEach(function(sec) { if (_qcSectionOpen[sec]) _qcOpenSection(sec); });
}

// Lazy: isi & foto section hanya dirender saat pertama dibuka; toggle section
// lain tidak menyentuh (tidak fetch ulang) section yang sudah terbuka.
function _qcToggleSection(sec) {
  if (_qcSectionOpen[sec]) _qcCloseSection(sec); else _qcOpenSection(sec);
}
function _qcOpenSection(sec) {
  var body = document.getElementById('qc-sec-body-' + sec);
  if (!body) return;
  if (!body.getAttribute('data-rendered')) {
    var g = _qcGroups[sec];
    if (g) body.innerHTML = g.items.map(_qcItemHtml).join('');
    body.setAttribute('data-rendered', '1');
  }
  body.classList.remove('hidden');
  var ch = document.getElementById('qc-chev-' + sec);
  if (ch) { ch.classList.remove('fa-chevron-down'); ch.classList.add('fa-chevron-up'); }
  _qcSectionOpen[sec] = true;
}
function _qcCloseSection(sec) {
  var body = document.getElementById('qc-sec-body-' + sec);
  if (body) body.classList.add('hidden');
  var ch = document.getElementById('qc-chev-' + sec);
  if (ch) { ch.classList.remove('fa-chevron-up'); ch.classList.add('fa-chevron-down'); }
  _qcSectionOpen[sec] = false;
}

function _qcItemHtml(it) {
  var canUp = _qcCanUpload(), canRev = _qcCanReview();
  var isAdmin = _qcRole() === 'admin';
  var isFile = it.tipeUpload === 'file';   // item minta upload dokumen (PDF), bukan foto
  var foto = it.foto || [];
  var thumbs = foto.map(function(f) {
    // Item Approved biasanya terkunci (tak bisa hapus foto), KECUALI admin —
    // admin tetap boleh hapus (mis. utk membersihkan data percobaan).
    var del = (canUp && it.status !== 'NA' && (it.status !== 'Approved' || isAdmin)) ? '<button onclick="event.stopPropagation();_qcHapusFoto(\'' + it.kode + '\',\'' + f.fileId + '\')" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white h-5 w-5 rounded-full text-[10px] shadow flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>' : '';
    var editedMark = f.editedBy ? '<span class="absolute bottom-0.5 left-0.5 bg-orange-500 text-white text-[8px] font-bold px-1 py-0.5 rounded" title="Diberi coretan oleh ' + _qcEsc(f.editedBy) + '"><i class="fa-solid fa-pen"></i></span>' : '';
    // Info singkat tiap file/foto: pengupload + tanggal (format sama spt di sheet).
    var cap = (f.by || f.at)
      ? '<p class="text-[9px] text-slate-400 mt-0.5 leading-tight break-words">' + (f.by ? '<span class="font-semibold text-slate-500">' + _qcEsc(f.by) + '</span>' : '') + (f.by && f.at ? ' · ' : '') + (f.at ? _qcEsc(f.at) : '') + '</p>'
      : '';
    if (isFile) {
      // Dokumen (PDF): cukup ikon PDF (tanpa memuat thumbnail Drive yg lambat);
      // klik = buka file PDF di tab baru. Pratinjau halaman pertama tetap di
      // PDF laporan (server-side), bukan di sini.
      return '<div class="w-20">'
        + '<div class="relative">'
        +   '<a href="' + _qcEsc(f.fileUrl) + '" target="_blank" class="flex items-center justify-center h-20 w-20 rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 transition">'
        +     '<i class="fa-solid fa-file-pdf text-rose-500 text-3xl"></i>'
        +   '</a>' + del
        + '</div>' + cap
        + '</div>';
    }
    return '<div class="w-20">'
      + '<div class="relative">'
      +   '<button type="button" onclick="_qcViewFoto(\'' + f.fileId + '\', ' + _qcJs(f.fileUrl) + ', \'' + it.kode + '\')" class="block h-20 w-20 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 cursor-zoom-in">'
      +     '<img src="' + _qcThumb(f.fileId, f.fileUrl) + '" alt="foto" loading="lazy" class="h-full w-full object-cover" onerror="this.style.display=&#39;none&#39;"></button>' + editedMark + del
      + '</div>' + cap
      + '</div>';
  }).join('');

  var rejectNote = (it.status === 'Rejected' && it.catatanSPV)
    ? '<div class="mt-2 text-[11px] bg-rose-50 border border-rose-200 text-rose-700 rounded-lg px-3 py-2"><i class="fa-solid fa-circle-exclamation mr-1"></i><b>Revisi Lead:</b> ' + _qcEsc(it.catatanSPV) + '</div>' : '';
  var approvedNote = (it.status === 'Approved' && it.catatanSPV)
    ? '<div class="mt-2 text-[11px] text-emerald-600"><i class="fa-solid fa-comment mr-1"></i>' + _qcEsc(it.catatanSPV) + '</div>' : '';

  // Upload / N/A (site engineer). Item yang sudah Approved terkunci — tak bisa
  // hapus foto / upload ulang / ubah N/A.
  // Pola batch: foto/dokumen dipilih dulu (staging) → tampil sbg "Menunggu
  // upload", lalu satu klik "Upload" mengirim semua & memicu 1 notif ke Lead.
  var uploadCtrl = '';
  var locked = (it.status === 'Approved');
  if (canUp && it.status !== 'NA' && !locked) {
    if (isFile) {
      uploadCtrl += '<label class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition"><i class="fa-solid fa-file-circle-plus"></i> Pilih Dokumen (PDF)'
        + '<input type="file" accept="application/pdf,.pdf" multiple class="hidden" onchange="_qcStage(\'' + it.kode + '\', this, true)"></label>';
    } else {
      uploadCtrl += '<label class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition"><i class="fa-solid fa-camera"></i> Kamera'
        + '<input type="file" accept="image/*" capture="environment" class="hidden" onchange="_qcStage(\'' + it.kode + '\', this)"></label>'
        + '<label class="inline-flex items-center gap-2 ml-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition"><i class="fa-regular fa-images"></i> Galeri'
        + '<input type="file" accept="image/*" multiple class="hidden" onchange="_qcStage(\'' + it.kode + '\', this)"></label>';
    }
  }
  if (canUp && !it.wajib && !locked) {
    var naOn = it.status === 'NA';
    uploadCtrl += '<label class="inline-flex items-center gap-1.5 ml-2 text-xs font-semibold text-slate-500 cursor-pointer select-none"><input type="checkbox" ' + (naOn ? 'checked' : '') + ' onchange="_qcToggleNA(\'' + it.kode + '\', this.checked)" class="accent-slate-500"> Tidak Ada (N/A)</label>';
  }

  // Tray "Menunggu upload": preview lokal foto/dokumen yg dipilih (belum dikirim).
  var pendHtml = '';
  var pend = (typeof _qcPending !== 'undefined' && _qcPending[it.kode]) ? _qcPending[it.kode] : [];
  if (pend.length && !locked) {
    var noun2 = isFile ? 'dokumen' : 'foto';
    var pthumbs = pend.map(function(p) {
      var inner = p.isFile
        ? '<div class="flex items-center justify-center h-20 w-20 rounded-lg border border-rose-200 bg-white"><i class="fa-solid fa-file-pdf text-rose-500 text-2xl"></i></div>'
        : '<img src="' + p.preview + '" class="h-20 w-20 object-cover rounded-lg border border-orange-200">';
      return '<div class="w-20"><div class="relative">' + inner
        + '<button onclick="_qcUnstage(\'' + it.kode + '\',' + p.localId + ')" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white h-5 w-5 rounded-full text-[10px] shadow flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>'
        + '</div></div>';
    }).join('');
    pendHtml = '<div class="mt-3 bg-orange-50 border border-orange-100 rounded-xl px-3 py-2.5">'
      + '<div class="flex items-center justify-between gap-2 mb-2">'
      +   '<span class="text-[11px] font-extrabold text-orange-600 uppercase tracking-wider"><i class="fa-solid fa-hourglass-half mr-1"></i>Menunggu upload (' + pend.length + ')</span>'
      +   '<button onclick="_qcUploadStaged(\'' + it.kode + '\')" class="inline-flex items-center gap-1.5 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-cloud-arrow-up"></i> Upload ' + pend.length + ' ' + noun2 + '</button>'
      + '</div>'
      + '<div class="flex flex-wrap gap-2">' + pthumbs + '</div>'
      + '</div>';
  }

  // Review (SPV) — hanya saat item menunggu keputusan (Pending). Setelah
  // Approve/Reject tombol hilang; muncul lagi jika site engineer re-upload (Pending).
  var reviewCtrl = '';
  if (canRev && it.status === 'Pending') {
    reviewCtrl = '<div class="mt-3 border-t border-slate-100 pt-3">'
      + '<textarea id="qc-note-' + it.kode + '" rows="2" placeholder="Catatan / instruksi revisi (opsional)..." class="w-full text-xs border border-slate-200 rounded-lg px-2.5 py-2 resize-none focus:outline-none focus:border-orange-400">' + _qcEsc(it.catatanSPV || '') + '</textarea>'
      + '<div class="flex gap-2 mt-2">'
      +   '<button onclick="_qcReview(\'' + it.kode + '\', \'Approved\')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-lg"><i class="fa-solid fa-check mr-1"></i>Approve</button>'
      +   '<button onclick="_qcReview(\'' + it.kode + '\', \'Rejected\')" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-2 rounded-lg"><i class="fa-solid fa-xmark mr-1"></i>Reject</button>'
      + '</div></div>';
  }

  // Batalkan Approve (SPV/Lead) — kembalikan item Approved ke Pending utk direview ulang.
  var cancelCtrl = '';
  if (canRev && it.status === 'Approved') {
    cancelCtrl = '<div class="mt-3 border-t border-slate-100 pt-3 flex justify-end">'
      + '<button onclick="_qcCancelApprove(\'' + it.kode + '\')" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-rotate-left"></i> Batalkan Approve</button>'
      + '</div>';
  }

  // Panduan foto dari Lead Engineer: instruksi + foto contoh (agar site engineer tahu foto yang benar).
  var contoh = it.contohFoto || [];
  var contohThumbs = contoh.map(function(f) {
    return '<button type="button" onclick="_qcViewFoto(\'' + f.fileId + '\', ' + _qcJs(f.fileUrl) + ')" class="block h-16 w-16 rounded-lg overflow-hidden border border-sky-200 bg-white cursor-zoom-in"><img src="' + _qcThumb(f.fileId, f.fileUrl) + '" alt="contoh" loading="lazy" class="h-full w-full object-cover"></button>';
  }).join('');
  var panduan = (it.instruksi || contoh.length)
    ? '<div class="mt-2 bg-sky-50 border border-sky-100 rounded-xl px-3 py-2.5">'
      + '<div class="text-[11px] font-extrabold text-sky-700 uppercase tracking-wider"><i class="fa-solid fa-circle-info mr-1"></i>Panduan Foto</div>'
      + (contoh.length ? '<div class="flex flex-wrap gap-2 mt-2">' + contohThumbs + '</div>' : '')
      + (it.instruksi ? '<div class="text-[12px] text-sky-800 mt-2 whitespace-pre-line">' + _qcEsc(it.instruksi) + '</div>' : '')
      + '</div>'
    : '';

  var metaHtml = _qcActivityHtml(it);

  // Loading per-item (tanpa layar penuh): saat item sedang diproses, kontrol
  // upload/review-nya diganti spinner inline agar item ini terkunci, sementara
  // item lain tetap bisa dikerjakan.
  var busy = (typeof _qcBusy !== 'undefined' && _qcBusy[it.kode]) ? _qcBusy[it.kode] : '';
  var uploadArea, reviewArea;
  if (busy === 'upload') {
    var upThumbs = pend.map(function(p) {
      return '<div class="w-20">' + (p.isFile
        ? '<div class="flex items-center justify-center h-20 w-20 rounded-lg border border-rose-200 bg-white opacity-70"><i class="fa-solid fa-file-pdf text-rose-500 text-2xl"></i></div>'
        : '<img src="' + p.preview + '" class="h-20 w-20 object-cover rounded-lg border border-orange-200 opacity-70">') + '</div>';
    }).join('');
    uploadArea = '<div class="mt-3 bg-orange-50 border border-orange-100 rounded-xl px-3 py-2.5">'
      + '<div class="flex items-center gap-2 mb-2 text-[11px] font-extrabold text-orange-600 uppercase tracking-wider"><i class="fa-solid fa-spinner fa-spin"></i> Mengupload…</div>'
      + (upThumbs ? '<div class="flex flex-wrap gap-2">' + upThumbs + '</div>' : '')
      + '</div>';
  } else {
    uploadArea = ((uploadCtrl) ? '<div class="mt-3 flex items-center flex-wrap">' + uploadCtrl + '</div>' : '') + pendHtml;
  }
  reviewArea = (busy === 'review')
    ? '<div class="mt-3 border-t border-slate-100 pt-3 inline-flex items-center gap-2 text-[12px] font-bold text-emerald-600"><i class="fa-solid fa-spinner fa-spin"></i> Menyimpan keputusan…</div>'
    : reviewCtrl;

  return '<div id="qc-item-' + it.kode + '" class="px-5 py-3">'
    + '<div class="flex items-start justify-between gap-3">'
    +   '<div class="flex-1 min-w-0"><span class="font-mono text-[10px] font-bold text-slate-400 mr-1">' + it.kode + '</span><span class="text-sm font-semibold text-slate-700">' + _qcEsc(it.label) + '</span>'
    +     (it.wajib ? '' : '<span class="ml-1 text-[9px] font-bold text-slate-400">(opsional)</span>') + '</div>'
    +   _qcBadge(it.status)
    + '</div>'
    + panduan
    + (thumbs ? '<div class="flex flex-wrap gap-2 mt-3">' + thumbs + '</div>' : '')
    + rejectNote + approvedNote
    + metaHtml
    + uploadArea
    + reviewArea
    + cancelCtrl
    + '</div>';
}

// Riwayat aktivitas per item: timeline event (upload/reject/approve/na) dgn
// nama pelaku + waktu (format sama spt di sheet). Komentar reject selalu merah,
// approve hijau — walau item sekarang sudah Approved, jejak reject tetap merah.
function _qcActConfig(type) {
  switch (type) {
    case 'upload':  return { icon: 'fa-cloud-arrow-up', iconCls: 'text-slate-300',   textCls: 'text-slate-500',   noteCls: 'text-slate-400',              verb: 'mengunggah foto' };
    case 'reject':  return { icon: 'fa-circle-xmark',   iconCls: 'text-rose-500',    textCls: 'text-rose-600',    noteCls: 'text-rose-600 font-medium',   verb: 'menolak (revisi)' };
    case 'approve': return { icon: 'fa-circle-check',   iconCls: 'text-emerald-500', textCls: 'text-emerald-600', noteCls: 'text-emerald-600',            verb: 'menyetujui' };
    case 'cancel':  return { icon: 'fa-rotate-left',    iconCls: 'text-amber-500',   textCls: 'text-amber-600',   noteCls: 'text-amber-600',              verb: 'membatalkan persetujuan' };
    case 'na':      return { icon: 'fa-ban',            iconCls: 'text-slate-300',   textCls: 'text-slate-500',   noteCls: 'text-slate-400',              verb: 'menandai Tidak Ada (N/A)' };
    default:        return { icon: 'fa-circle',         iconCls: 'text-slate-300',   textCls: 'text-slate-500',   noteCls: 'text-slate-400',              verb: type || '-' };
  }
}
function _qcActivityHtml(it) {
  var acts = (it && it.activity) || [];
  if (!acts.length) return '';
  var rows = acts.map(function(ev) {
    var c = _qcActConfig(ev.type);
    var note = ev.note ? '<span class="' + c.noteCls + '"> — ' + _qcEsc(ev.note) + '</span>' : '';
    return '<div class="flex items-start gap-2">'
      + '<i class="fa-solid ' + c.icon + ' ' + c.iconCls + ' text-[10px] w-3 text-center mt-0.5"></i>'
      + '<div class="flex-1 min-w-0 leading-snug">'
      +   '<span class="' + c.textCls + '">' + (ev.by ? '<b class="font-semibold">' + _qcEsc(ev.by) + '</b> ' : '') + c.verb + '</span>' + note
      +   '<span class="text-slate-300 ml-1 whitespace-nowrap">· ' + _qcEsc(ev.at || '') + '</span>'
      + '</div></div>';
  }).join('');
  return '<div class="mt-3 border-t border-slate-100 pt-2.5">'
    + '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Riwayat Aktivitas</p>'
    + '<div class="space-y-1 text-[11px]">' + rows + '</div>'
    + '</div>';
}

// ── Aksi ──────────────────────────────────────────────────────────
// isFile=true → item bertipe Dokumen: hanya PDF, dikirim apa adanya (tanpa
// resize/kompresi gambar). isFile=false → foto: di-resize dulu spt biasa.
// ── Staging upload (pilih/foto banyak dulu, upload sekali klik) ────────────
var _qcPending = {};     // kode → [{localId, isFile, base64, fileName, mimeType, preview}]
var _qcLocalSeq = 0;
var _qcBusy = {};        // kode → 'upload' | 'review' (item sedang diproses, kunci per-item)

function _qcFindItem(kode) {
  var found = null;
  Object.keys(_qcGroups).forEach(function(sec) {
    (_qcGroups[sec].items || []).forEach(function(it) { if (it.kode === kode) found = it; });
  });
  return found;
}
function _qcRerenderItem(kode) {
  var it = _qcFindItem(kode); if (!it) return;
  var el = document.getElementById('qc-item-' + kode);
  if (el) el.outerHTML = _qcItemHtml(it);
}

// Pilih foto/dokumen → simpan sbg "pending" (preview lokal), BELUM diupload.
function _qcStage(kode, input, isFile) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  if (!files.length) return;
  var noun = isFile ? 'dokumen' : 'foto';
  var MAX = 15 * 1024 * 1024;
  for (var k = 0; k < files.length; k++) {
    if (files[k].size > MAX) return showNotification('Ukuran ' + noun + ' maksimal 15MB: ' + files[k].name, 'error');
    if (isFile) {
      var isPdf = files[k].type === 'application/pdf' || /\.pdf$/i.test(files[k].name || '');
      if (!isPdf) return showNotification('Hanya file PDF yang diperbolehkan: ' + files[k].name, 'error');
    }
  }
  if (!_qcPending[kode]) _qcPending[kode] = [];
  var remaining = files.length;
  toggleLoader(true, 'Memproses ' + files.length + ' ' + noun + '...');
  function fin() { if (--remaining <= 0) { toggleLoader(false); _qcRerenderItem(kode); } }
  files.forEach(function(f) {
    if (isFile) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result || '';
        var base64 = dataUrl.indexOf(',') !== -1 ? dataUrl.split(',')[1] : '';
        if (base64) _qcPending[kode].push({ localId: ++_qcLocalSeq, isFile: true, base64: base64, fileName: (f.name || 'dokumen').replace(/\.[a-zA-Z0-9]+$/, '') + '.pdf', mimeType: 'application/pdf', preview: '' });
        fin();
      };
      reader.onerror = function() { fin(); };
      reader.readAsDataURL(f);
    } else {
      _qcResizeImage(f, function(dataUrl) {
        if (dataUrl) _qcPending[kode].push({ localId: ++_qcLocalSeq, isFile: false, base64: dataUrl.split(',')[1], fileName: (f.name || 'foto').replace(/\.[a-zA-Z0-9]+$/, '') + '.jpg', mimeType: 'image/jpeg', preview: dataUrl });
        fin();
      });
    }
  });
}
function _qcUnstage(kode, localId) {
  if (!_qcPending[kode]) return;
  _qcPending[kode] = _qcPending[kode].filter(function(p) { return p.localId !== localId; });
  _qcRerenderItem(kode);
}
// Kirim semua pending sekaligus → 1 kali set Pending + 1 notif ke Lead.
function _qcUploadStaged(kode) {
  if (_qcBusy[kode]) return;   // item ini sedang diupload — kunci per-item
  var pend = _qcPending[kode] || [];
  if (!pend.length) return;
  var files = pend.map(function(p) { return { base64Data: p.base64, fileName: p.fileName, mimeType: p.mimeType }; });
  _qcBusy[kode] = 'upload';
  _qcRerenderItem(kode);   // spinner inline di area item, tanpa layar penuh
  google.script.run.withSuccessHandler(function(res) {
    delete _qcBusy[kode];
    if (res && res.success === false) { showNotification(res.message, 'error'); _qcRerenderItem(kode); return; }
    _qcPending[kode] = [];
    var it = _qcFindItem(kode);
    if (it) { it.status = res && res.status ? res.status : 'Pending'; if (res && res.foto_list) it.foto = res.foto_list; it.uploadedBy = _qcUserNama(); }
    _qcRerenderItem(kode);
    _qcRefreshHead();
    if (it) _qcRefreshSection(it.section);
    showNotification((res && res.count ? res.count : files.length) + ' file terupload.');
  }).withFailureHandler(function(err) { delete _qcBusy[kode]; _qcRerenderItem(kode); showNotification((err && err.message) || 'Gagal upload.', 'error'); })
    .uploadQCFotoBatch({ noWO: _qcWO.noWO, kode: kode, oleh: _qcUserNama(), files: files });
}

function _qcHapusFoto(kode, fileId) {
  showConfirm({ title: 'Hapus Foto', message: 'Hapus foto ini?', confirmText: 'Ya, Hapus', onConfirm: function() {
    toggleLoader(true, 'Menghapus foto...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      _qcReloadDetail();
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menghapus.', 'error'); })
      .hapusQCFoto(_qcWO.noWO, kode, fileId);
  } });
}

// ── Editor coret/anotasi foto (Lead Engineer) ─────────────────────
var _qcAnot = null;
function _qcAnotOpen(fileId, noWO, kode) {
  toggleLoader(true, 'Memuat gambar untuk diedit...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (!res || res.success === false || !res.dataUrl) { showNotification((res && res.message) || 'Gagal memuat gambar.', 'error'); return; }
    _qcAnotInit(res.dataUrl, fileId, noWO, kode);
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal memuat gambar.', 'error'); })
    .getQCFotoBesar(fileId);
}
function _qcAnotInit(dataUrl, fileId, noWO, kode) {
  var canvas = document.getElementById('qc-anot-canvas');
  var img = new Image();
  img.onload = function() {
    var maxDim = 1600, w = img.naturalWidth || 800, h = img.naturalHeight || 600;
    var sc = Math.min(1, maxDim / Math.max(w, h));
    canvas.width = Math.round(w * sc); canvas.height = Math.round(h * sc);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    _qcAnot = { fileId: fileId, noWO: noWO, kode: kode, img: img, canvas: canvas, ctx: ctx, color: '#ef4444', size: 6, strokes: [], drawing: false, cur: null };
    _qcAnotSetColor('#ef4444');
    var sz = document.getElementById('qc-anot-size'); if (sz) { sz.value = 6; }
    // Mouse + touch (lebih andal daripada pointer event di iframe GAS)
    canvas.onmousedown = _qcAnotDown;
    canvas.onmousemove = _qcAnotMove;
    canvas.onmouseup = _qcAnotUp;
    canvas.onmouseleave = _qcAnotUp;
    canvas.addEventListener('touchstart', _qcAnotDown, { passive: false });
    canvas.addEventListener('touchmove', _qcAnotMove, { passive: false });
    canvas.addEventListener('touchend', _qcAnotUp, { passive: false });
    canvas.addEventListener('touchcancel', _qcAnotUp, { passive: false });
    document.getElementById('modal-qc-anotasi').classList.remove('hidden');
  };
  img.onerror = function() { showNotification('Gagal memuat gambar untuk diedit.', 'error'); };
  img.src = dataUrl;
}
function _qcAnotSetColor(c) {
  if (_qcAnot) _qcAnot.color = c;
  Array.prototype.forEach.call(document.querySelectorAll('.qc-anot-color'), function(b) {
    var on = b.getAttribute('data-color') === c;
    b.classList.toggle('ring-white', on);
    b.classList.toggle('ring-transparent', !on);
  });
}
function _qcAnotSetSize(v) { if (_qcAnot) _qcAnot.size = parseInt(v, 10) || 6; }
function _qcAnotPos(e) {
  var r = _qcAnot.canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return { x: (cx - r.left) * (_qcAnot.canvas.width / r.width), y: (cy - r.top) * (_qcAnot.canvas.height / r.height) };
}
function _qcAnotDown(e) {
  if (!_qcAnot) return; e.preventDefault();
  _qcAnot.drawing = true;
  _qcAnot.cur = { color: _qcAnot.color, size: _qcAnot.size, pts: [_qcAnotPos(e)] };
}
function _qcAnotMove(e) {
  if (!_qcAnot || !_qcAnot.drawing) return; e.preventDefault();
  _qcAnot.cur.pts.push(_qcAnotPos(e));
  var pts = _qcAnot.cur.pts, n = pts.length;
  if (n < 2) return;
  var ctx = _qcAnot.ctx;
  ctx.strokeStyle = _qcAnot.cur.color; ctx.lineWidth = _qcAnot.cur.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[n - 2].x, pts[n - 2].y); ctx.lineTo(pts[n - 1].x, pts[n - 1].y); ctx.stroke();
}
function _qcAnotUp() {
  if (!_qcAnot || !_qcAnot.drawing) return;
  _qcAnot.drawing = false;
  if (_qcAnot.cur && _qcAnot.cur.pts.length) {
    if (_qcAnot.cur.pts.length === 1) { // titik tunggal → dot
      var p = _qcAnot.cur.pts[0], ctx = _qcAnot.ctx;
      ctx.fillStyle = _qcAnot.cur.color; ctx.beginPath(); ctx.arc(p.x, p.y, _qcAnot.cur.size / 2, 0, Math.PI * 2); ctx.fill();
    }
    _qcAnot.strokes.push(_qcAnot.cur);
  }
  _qcAnot.cur = null;
}
function _qcAnotRedraw() {
  if (!_qcAnot) return;
  var ctx = _qcAnot.ctx, c = _qcAnot.canvas;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(_qcAnot.img, 0, 0, c.width, c.height);
  _qcAnot.strokes.forEach(function(s) {
    var pts = s.pts; if (!pts.length) return;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    if (pts.length === 1) { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, s.size / 2, 0, Math.PI * 2); ctx.fill(); }
  });
}
function _qcAnotUndo() { if (_qcAnot && _qcAnot.strokes.length) { _qcAnot.strokes.pop(); _qcAnotRedraw(); } }
function _qcAnotClear() { if (_qcAnot) { _qcAnot.strokes = []; _qcAnotRedraw(); } }
function _qcAnotClose() { document.getElementById('modal-qc-anotasi').classList.add('hidden'); _qcAnot = null; }
function _qcAnotSave() {
  if (!_qcAnot) return;
  if (!_qcAnot.strokes.length) { showNotification('Belum ada coretan. Tambahkan dulu atau tekan Batal.', 'error'); return; }
  var base64;
  try { base64 = _qcAnot.canvas.toDataURL('image/jpeg', 0.9).split(',')[1]; }
  catch (e) { showNotification('Gagal memproses gambar.', 'error'); return; }
  var payload = { noWO: _qcAnot.noWO, kode: _qcAnot.kode, fileId: _qcAnot.fileId, base64Data: base64, mimeType: 'image/jpeg', oleh: _qcUserNama() };
  _qcAnotClose();
  toggleLoader(true, 'Menyimpan gambar...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal menyimpan.', 'error'); return; }
    showNotification(res.message || 'Gambar tersimpan dengan coretan.');
    _qcReloadDetail();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menyimpan.', 'error'); })
    .simpanQCFotoAnotasi(payload);
}

function _qcToggleNA(kode, checked) {
  toggleLoader(true, 'Menyimpan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    _qcReloadDetail();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .setQCItemNA(_qcWO.noWO, kode, checked, _qcUserNama());
}

function _qcReview(kode, keputusan) {
  if (_qcBusy[kode]) return;   // item ini sedang diproses — kunci per-item
  var ta = document.getElementById('qc-note-' + kode);
  var catatan = ta ? ta.value.trim() : '';
  if (keputusan === 'Rejected' && !catatan) return showNotification('Isi catatan revisi untuk menolak item.', 'error');
  _qcBusy[kode] = 'review';
  _qcRerenderItem(kode);   // spinner inline di area tombol, tanpa layar penuh
  google.script.run.withSuccessHandler(function(res) {
    delete _qcBusy[kode];
    if (res && res.success === false) { showNotification(res.message, 'error'); _qcRerenderItem(kode); return; }
    var it = _qcFindItem(kode);
    if (it) { it.status = keputusan; it.catatanSPV = catatan; }
    _qcRerenderItem(kode);
    _qcRefreshHead();
    if (it) _qcRefreshSection(it.section);
    showNotification(res && res.message ? res.message : 'Tersimpan.');
  }).withFailureHandler(function(err) { delete _qcBusy[kode]; _qcRerenderItem(kode); showNotification((err && err.message) || 'Gagal review.', 'error'); })
    .reviewQCItem(_qcWO.noWO, kode, keputusan, catatan, _qcUserNama());
}

function _qcCancelApprove(kode) {
  showConfirm({
    title: 'Batalkan Approve',
    message: 'Batalkan persetujuan item ' + kode + '? Item akan kembali ke status Pending untuk direview ulang.',
    confirmText: 'Ya, Batalkan',
    type: 'warning',
    icon: 'fa-rotate-left',
    onConfirm: function() {
      toggleLoader(true, 'Membatalkan approve...');
      google.script.run.withSuccessHandler(function(res) {
        toggleLoader(false);
        if (res && res.success === false) { showNotification(res.message, 'error'); return; }
        showNotification(res && res.message ? res.message : 'Approve dibatalkan.');
        _qcReloadDetail();
      }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal membatalkan.', 'error'); })
        .cancelQCApproval(_qcWO.noWO, kode, _qcUserNama());
    }
  });
}
