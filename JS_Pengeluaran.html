<script>
// ================================================================
//  PENGELUARAN PROJECT — JavaScript (Modul 3 Fase 1)
// ================================================================

var _expData       = [];
var _expWOList     = [];
var _expAkunList   = [];
var _expEditMode   = false;
var _expActiveTab  = 'mutasi';

// ── Tab Switching ──────────────────────────────────────────────

window.switchExpTab = function(tab) {
  _expActiveTab = tab;
  var active   = 'px-5 py-2 rounded-xl text-sm font-bold transition bg-emerald-600 text-white shadow-sm';
  var inactive = 'px-5 py-2 rounded-xl text-sm font-bold transition text-slate-500 hover:text-slate-700';
  var mBtn = document.getElementById('exp-tab-mutasi-btn');
  var pBtn = document.getElementById('exp-tab-payreq-btn');
  if (mBtn) mBtn.className = tab === 'mutasi' ? active : inactive;
  if (pBtn) pBtn.className = tab === 'payreq' ? active : inactive;
  var mTab = document.getElementById('exp-tab-mutasi');
  var pTab = document.getElementById('exp-tab-payreq');
  if (mTab) mTab.classList.toggle('hidden', tab !== 'mutasi');
  if (pTab) pTab.classList.toggle('hidden', tab !== 'payreq');
  if (tab === 'mutasi' && typeof loadMutasi === 'function') loadMutasi();
  if (tab === 'payreq') loadPaymentRequestList();
};

// ── Format helpers ─────────────────────────────────────────────

function _fmtRpExp(n) {
  n = parseFloat(n) || 0;
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function _fmtCurrencyExp(el) {
  var raw = el.value.replace(/\D/g, '');
  el.value = raw ? parseInt(raw, 10).toLocaleString('id-ID') : '';
}

function _parseCurrencyExp(val) {
  return parseInt((val || '').toString().replace(/\D/g, ''), 10) || 0;
}

function _fmtTglExp(s) {
  if (!s) return '—';
  var str = s.toString().trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    var p = str.substring(0, 10).split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  return str.substring(0, 10);
}

// ── Load utama ─────────────────────────────────────────────────

window.loadPengeluaran = function() {
  // Skeleton loader per panel sambil menunggu 1 panggilan agregator.
  var tbMut = document.getElementById('table-mutasi-kas');
  if (tbMut && typeof _mutSkeletonRows === 'function') tbMut.innerHTML = _mutSkeletonRows(5);
  var tbPr = document.getElementById('table-payreq');
  if (tbPr) tbPr.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  if (typeof google === 'undefined') return;
  // Satu round-trip menggantikan ~10 panggilan (payment request, WO, akun,
  // kategori, saldo, + 3 list mutasi) dan duplikat getPaymentRequestList/getBankAccounts.
  google.script.run
    .withSuccessHandler(function(res) {
      res = res || {};
      _cmApplyPaymentRequests(res.paymentRequests || []);
      _fillWOOptionsExp('exp-wo', '', res.workOrders || []);
      _fillAkunOptionsExp('exp-akun', '', res.bankAccounts || []);
      _fillKategoriFromList(res.kategori || [], '');
      if (res.saldo) _renderSaldoPanel(res.saldo);
      if (typeof _fillInAkunFromAccounts === 'function') _fillInAkunFromAccounts(res.bankAccounts || []);
      _inData  = res.pemasukan   || [];
      _expData = res.pengeluaran || [];
      _buildMutasi(res.pemasukan || [], res.pengeluaran || [], res.ayatSilang || []);
    })
    .withFailureHandler(function() {
      // Fallback ke loader individual bila agregator gagal.
      loadPaymentRequestList();
      _loadWOOptionsExp('exp-wo', '');
      _loadAkunOptionsExp('exp-akun', '');
      _loadKategoriPengeluaranOptions('');
      if (typeof loadSaldoPanel === 'function') loadSaldoPanel();
      if (typeof loadMutasi === 'function') loadMutasi();
    })
    .getCashManagerBootstrap();
};

// Render daftar payment request + badge "Menunggu" (dari data agregator).
function _cmApplyPaymentRequests(list) {
  list = list || [];
  _renderPaymentRequestList(list);
  var menungguCount = list.filter(function(r) { return r.status === 'Menunggu'; }).length;
  var badge = document.getElementById('exp-payreq-badge');
  if (badge) {
    if (menungguCount > 0) { badge.textContent = menungguCount; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
}

// Dipakai oleh handler simpan/hapus pengeluaran → segarkan mutasi + saldo
function _loadExpData() {
  if (typeof loadMutasi === 'function') loadMutasi();
  if (typeof loadSaldoPanel === 'function') loadSaldoPanel();
}

// Isi dropdown WO dari data (dipakai fetch tunggal & agregator bootstrap).
function _fillWOOptionsExp(selId, selectedVal, data) {
  var sel = document.getElementById(selId);
  if (!sel) return;
  var isFilter = selId.startsWith('filter-');
  var placeholder = isFilter ? '<option value="">Semua WO</option>' : '<option value="">-- Tanpa Project (Operasional) --</option>';
  sel.innerHTML = placeholder;
  _expWOList = (data || []).filter(function(w) { return w.status === 'Deal'; });
  _expWOList.forEach(function(w) {
    var opt = document.createElement('option');
    opt.value = w.noWO;
    opt.textContent = w.noWO + ' – ' + (w.namaProject || w.namaKlien || '');
    if (w.noWO === selectedVal) opt.selected = true;
    sel.appendChild(opt);
  });
}
function _loadWOOptionsExp(selId, selectedVal) {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(data) { _fillWOOptionsExp(selId, selectedVal, data); })
    .withFailureHandler(function() {})
    .getWorkOrderList();
}

// Isi dropdown akun (bank) dari daftar accounts.
function _fillAkunOptionsExp(selId, selectedVal, accounts) {
  var sel = document.getElementById(selId);
  if (!sel) return;
  var isFilter = selId.startsWith('filter-');
  sel.innerHTML = isFilter ? '<option value="">Semua Akun</option>' : '<option value="">-- Pilih Akun --</option>';
  _expAkunList = accounts || [];
  _expAkunList.forEach(function(a) {
    var opt = document.createElement('option');
    opt.value = a.id;
    opt.dataset.nama = a.label;
    opt.textContent = a.label;
    if (a.id === selectedVal) opt.selected = true;
    sel.appendChild(opt);
  });
}
function _loadAkunOptionsExp(selId, selectedVal) {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) { _fillAkunOptionsExp(selId, selectedVal, (res && res.accounts) ? res.accounts : []); })
    .withFailureHandler(function() {})
    .getBankAccounts();
}

// ── Render table ───────────────────────────────────────────────

function _renderPengeluaran(list) {
  var tbody = document.getElementById('table-pengeluaran');
  _renderExpKPI(list);

  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400">Belum ada data pengeluaran.</td></tr>';
    document.getElementById('exp-total-badge').textContent = '0 entri';
    return;
  }

  var html = '';
  list.forEach(function(r) {
    var sumberBadge = _sumberBadge(r.sumber);
    var isOtomatis  = (r.sumber === 'Pembayaran PO' || r.sumber === 'Penggunaan Stok');
    html += '<tr class="hover:bg-slate-50 transition-colors">';
    html += '<td class="p-4" data-label="ID / Tanggal"><div class="font-mono text-xs text-slate-500">' + r.id + '</div><div class="text-xs text-slate-400 mt-0.5">' + (r.tanggal || '—') + '</div></td>';
    if (r.noWO) {
      html += '<td class="p-4" data-label="No WO / Project"><div class="font-bold text-slate-800 text-xs">' + r.noWO + '</div><div class="text-xs text-slate-500 mt-0.5 truncate max-w-[160px]">' + (r.namaProject || r.namaKlien || '—') + '</div></td>';
    } else {
      html += '<td class="p-4" data-label="No WO / Project"><span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-violet-100 text-violet-700"><i class="fas fa-building text-[10px]"></i>Non-Project</span><div class="text-xs text-slate-500 mt-0.5 truncate max-w-[160px]">' + (r.kategori || '—') + '</div></td>';
    }
    html += '<td class="p-4 text-center" data-label="Sumber">' + sumberBadge + '</td>';
    html += '<td class="p-4 text-xs text-slate-600" data-label="No PO">' + (r.noPO || '—') + '</td>';
    html += '<td class="p-4 text-xs text-slate-600 max-w-[120px] truncate" data-label="Akun" title="' + r.namaAkun + '">' + r.namaAkun + '</td>';
    html += '<td class="p-4 text-sm text-slate-700 max-w-[180px]" data-label="Deskripsi"><div class="truncate" title="' + _esc(r.deskripsi) + '">' + _esc(r.deskripsi) + '</div></td>';
    html += '<td class="p-4 text-right text-xs text-slate-600" data-label="Qty">' + (r.qty || 0) + ' ' + (r.satuan || '') + '</td>';
    html += '<td class="p-4 text-right text-xs text-slate-600" data-label="Harga">' + _fmtRpExp(r.hargaSatuan) + '</td>';
    html += '<td class="p-4 text-right font-bold text-slate-800" data-label="Total">' + _fmtRpExp(r.total) + '</td>';
    html += '<td class="p-4 text-center rp-actions">';
    if (isOtomatis) {
      html += '<span class="text-slate-400 text-xs" title="Kelola dari sumbernya"><i class="fas fa-lock text-xs"></i></span>';
    } else {
      html += '<div class="flex justify-center gap-1.5">';
      html += '<button onclick="editPengeluaran(\'' + r.id + '\')" class="w-7 h-7 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-500 flex items-center justify-center transition" title="Edit"><i class="fas fa-pen text-xs"></i></button>';
      html += '<button onclick="bukaModalHapusExp(\'' + r.id + '\',\'' + _esc(r.sumber) + '\')" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-500 flex items-center justify-center transition" title="Hapus"><i class="fas fa-trash text-xs"></i></button>';
      html += '</div>';
    }
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  document.getElementById('exp-total-badge').textContent = list.length + ' entri';
}

function _renderExpKPI(list) {
  list = list || [];
  var total = 0, perSumber = { 'Pembayaran PO': 0, 'Penggunaan Stok': 0, 'Langsung': 0 };
  list.forEach(function(r) {
    total += r.total || 0;
    if (perSumber.hasOwnProperty(r.sumber)) perSumber[r.sumber] += r.total || 0;
  });
  document.getElementById('kpi-exp-total').textContent          = _fmtRpExp(total);
  document.getElementById('kpi-exp-count').textContent           = list.length;
  document.getElementById('kpi-exp-sumber-po').textContent       = _fmtRpExp(perSumber['Pembayaran PO']);
  document.getElementById('kpi-exp-sumber-stok').textContent     = _fmtRpExp(perSumber['Penggunaan Stok']);
  document.getElementById('kpi-exp-sumber-langsung').textContent = _fmtRpExp(perSumber['Langsung']);
}

function _sumberBadge(sumber) {
  var cfg = {
    'Pembayaran PO':   ['bg-blue-100 text-blue-700',   'fa-file-invoice-dollar', 'Pembayaran PO'],
    'Penggunaan Stok': ['bg-amber-100 text-amber-700',  'fa-boxes-stacked',       'Penggunaan Stok'],
    'Langsung':        ['bg-emerald-100 text-emerald-700','fa-money-bill-wave',   'Langsung']
  };
  var c = cfg[sumber] || ['bg-slate-100 text-slate-600','fa-circle-question', sumber];
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold ' + c[0] + '"><i class="fas ' + c[1] + ' text-[10px]"></i>' + c[2] + '</span>';
}

function _esc(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Filter ─────────────────────────────────────────────────────

window.filterPengeluaran = function() {
  var noWO    = document.getElementById('filter-exp-wo').value;
  var sumber  = document.getElementById('filter-exp-sumber').value;
  var idAkun  = document.getElementById('filter-exp-akun').value;
  var dari    = document.getElementById('filter-exp-dari').value;
  var sampai  = document.getElementById('filter-exp-sampai').value;
  var noPO    = document.getElementById('filter-exp-nopo').value.trim().toLowerCase();

  var filtered = _expData.filter(function(r) {
    if (noWO   && r.noWO   !== noWO)   return false;
    if (sumber && r.sumber !== sumber)  return false;
    if (idAkun && r.idAkun !== idAkun)  return false;
    if (noPO   && (r.noPO || '').toLowerCase().indexOf(noPO) === -1) return false;
    if (dari || sampai) {
      var tp = (r.tanggal || '').split('/');
      if (tp.length === 3) {
        var ms = new Date(parseInt(tp[2]), parseInt(tp[1])-1, parseInt(tp[0])).getTime();
        if (dari) {
          var fp = dari.split('-');
          if (ms < new Date(parseInt(fp[0]), parseInt(fp[1])-1, parseInt(fp[2])).getTime()) return false;
        }
        if (sampai) {
          var sp = sampai.split('-');
          if (ms > new Date(parseInt(sp[0]), parseInt(sp[1])-1, parseInt(sp[2])).getTime()) return false;
        }
      }
    }
    return true;
  });
  _renderPengeluaran(filtered);
};

window.resetFilterPengeluaran = function() {
  ['filter-exp-wo','filter-exp-sumber','filter-exp-akun','filter-exp-nopo'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  ['filter-exp-dari','filter-exp-sampai'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  _renderPengeluaran(_expData);
};

// ── Form Pengeluaran Langsung ──────────────────────────────────

window.bukaFormPengeluaranLangsung = function(preNoWO) {
  _expEditMode = false;
  document.getElementById('exp-form-title').textContent   = 'Tambah Pengeluaran Langsung';
  document.getElementById('exp-submit-label').textContent = 'Simpan';
  document.getElementById('exp-id-field').value    = '';
  document.getElementById('exp-wo').value          = preNoWO || '';
  document.getElementById('exp-tanggal').value     = new Date().toISOString().slice(0, 10);
  document.getElementById('exp-akun').value        = '';
  document.getElementById('exp-nopo').value        = '';
  document.getElementById('exp-deskripsi').value   = '';
  document.getElementById('exp-qty').value         = '';
  document.getElementById('exp-satuan').value      = '';
  document.getElementById('exp-harga').value       = '';
  document.getElementById('exp-catatan').value     = '';
  document.getElementById('exp-total-display').textContent = 'Rp 0';

  _loadWOOptionsExp('exp-wo', preNoWO || '');
  _loadAkunOptionsExp('exp-akun', '');
  _loadKategoriPengeluaranOptions('');
  _onExpWOChange();
  document.getElementById('modal-exp-langsung').classList.remove('hidden');
};

function _onExpWOChange() {
  var noWO = document.getElementById('exp-wo').value;
  document.getElementById('exp-kategori-wrap').classList.toggle('hidden', !!noWO);
}

// ── Kategori pengeluaran (dinamis dari Settings) ───────────────
var _expKategoriList = [];
function _fillKategoriFromList(list, selectedVal) {
  _expKategoriList = list || [];
  _fillKategoriSelect(selectedVal);
}
function _loadKategoriPengeluaranOptions(selectedVal) {
  if (typeof google === 'undefined') { _fillKategoriSelect(selectedVal); return; }
  google.script.run
    .withSuccessHandler(function(res) { _fillKategoriFromList((res && res.list) ? res.list : [], selectedVal); })
    .withFailureHandler(function() { _fillKategoriSelect(selectedVal); })
    .getKategoriPengeluaran();
}
function _fillKategoriSelect(selectedVal) {
  var sel = document.getElementById('exp-kategori');
  if (!sel) return;
  var val = (selectedVal != null && selectedVal !== '') ? selectedVal : (sel.value || '');
  var opts = '<option value="">-- Pilih Kategori --</option>';
  var found = false;
  _expKategoriList.forEach(function(k) {
    if (k === val) found = true;
    opts += '<option value="' + _esc(k) + '">' + _esc(k) + '</option>';
  });
  // Kategori lama pada record yang sudah dihapus dari master → tetap tampilkan
  if (val && !found) opts += '<option value="' + _esc(val) + '">' + _esc(val) + ' (lama)</option>';
  sel.innerHTML = opts;
  sel.value = val;
}

window.tutupFormPengeluaranLangsung = function() {
  document.getElementById('modal-exp-langsung').classList.add('hidden');
};

function _hitungTotalExp() {
  var qty   = parseFloat(document.getElementById('exp-qty').value) || 0;
  var harga = _parseCurrencyExp(document.getElementById('exp-harga').value);
  document.getElementById('exp-total-display').textContent = _fmtRpExp(qty * harga);
}

function _onExpAkunChange() {
  // Tidak ada logika khusus untuk Fase 1; placeholder untuk Fase 2
}

window.submitPengeluaranLangsung = function() {
  var noWO    = document.getElementById('exp-wo').value;
  var tanggal = document.getElementById('exp-tanggal').value;
  var idAkun  = document.getElementById('exp-akun').value;
  var noPO    = document.getElementById('exp-nopo').value.trim();
  var desk    = document.getElementById('exp-deskripsi').value.trim();
  var qty     = parseFloat(document.getElementById('exp-qty').value) || 0;
  var satuan  = document.getElementById('exp-satuan').value.trim();
  var harga   = _parseCurrencyExp(document.getElementById('exp-harga').value);
  var catatan = document.getElementById('exp-catatan').value.trim();
  var kategori = document.getElementById('exp-kategori').value;

  if (!tanggal) return showNotification('Tanggal wajib diisi.', 'error');
  if (!idAkun)  return showNotification('Akun pembayaran wajib dipilih.', 'error');
  if (!desk)    return showNotification('Deskripsi wajib diisi.', 'error');
  if (qty <= 0) return showNotification('Qty harus lebih dari 0.', 'error');
  if (harga <= 0) return showNotification('Harga satuan harus lebih dari 0.', 'error');
  if (!noWO && !kategori) return showNotification('Kategori pengeluaran wajib dipilih untuk pengeluaran non-project.', 'error');

  // Ambil namaAkun dari option
  var akunSel = document.getElementById('exp-akun');
  var namaAkun = akunSel.options[akunSel.selectedIndex] ? (akunSel.options[akunSel.selectedIndex].dataset.nama || '') : '';

  // Format tanggal ke dd/MM/yyyy
  var tParts   = tanggal.split('-');
  var tanggalFmt = tParts[2] + '/' + tParts[1] + '/' + tParts[0];

  var payload = {
    noWO:        noWO,
    tanggal:     tanggalFmt,
    idAkun:      idAkun,
    namaAkun:    namaAkun,
    noPO:        noPO,
    deskripsi:   desk,
    qty:         qty,
    satuan:      satuan,
    hargaSatuan: harga,
    catatan:     catatan,
    kategori:    noWO ? '' : kategori,
    dibuatOleh:  (_currentUser && _currentUser.nama) || ''
  };

  toggleLoader(true, _expEditMode ? 'Menyimpan perubahan...' : 'Menyimpan pengeluaran...');

  if (_expEditMode) {
    payload.id       = document.getElementById('exp-id-field').value;
    payload.diubahOleh = (_currentUser && _currentUser.nama) || '';
    google.script.run
      .withSuccessHandler(function(res) {
        toggleLoader(false);
        if (res.success) {
          showNotification(res.message);
          tutupFormPengeluaranLangsung();
          _loadExpData();
        } else {
          showNotification(res.message || 'Gagal menyimpan.', 'error');
        }
      })
      .withFailureHandler(function(err) { toggleLoader(false); showNotification('Error: ' + err.message, 'error'); })
      .editPengeluaranLangsung(payload);
  } else {
    google.script.run
      .withSuccessHandler(function(res) {
        toggleLoader(false);
        if (res.success) {
          showNotification(res.message);
          tutupFormPengeluaranLangsung();
          _loadExpData();
        } else {
          showNotification(res.message || 'Gagal menyimpan.', 'error');
        }
      })
      .withFailureHandler(function(err) { toggleLoader(false); showNotification('Error: ' + err.message, 'error'); })
      .simpanPengeluaranLangsung(payload);
  }
};

// ── Edit ───────────────────────────────────────────────────────

window.editPengeluaran = function(id) {
  var r = _expData.find(function(e) { return e.id === id; });
  if (!r) return showNotification('Data tidak ditemukan.', 'error');
  if (r.sumber !== 'Langsung') {
    showNotification('Pengeluaran bersumber "' + r.sumber + '" tidak bisa diedit di sini.', 'error');
    return;
  }

  _expEditMode = true;
  document.getElementById('exp-form-title').textContent   = 'Edit Pengeluaran Langsung';
  document.getElementById('exp-submit-label').textContent = 'Perbarui';
  document.getElementById('exp-id-field').value    = r.id;
  document.getElementById('exp-tanggal').value     = _tglToInput(r.tanggal);
  document.getElementById('exp-nopo').value        = r.noPO || '';
  document.getElementById('exp-deskripsi').value   = r.deskripsi || '';
  document.getElementById('exp-qty').value         = r.qty || '';
  document.getElementById('exp-satuan').value      = r.satuan || '';
  document.getElementById('exp-harga').value       = r.hargaSatuan ? r.hargaSatuan.toLocaleString('id-ID') : '';
  document.getElementById('exp-catatan').value     = r.catatan || '';
  document.getElementById('exp-total-display').textContent = _fmtRpExp(r.total);
  _loadKategoriPengeluaranOptions(r.kategori || '');

  _loadWOOptionsExp('exp-wo', r.noWO);
  _loadAkunOptionsExp('exp-akun', r.idAkun);
  _onExpWOChange();
  document.getElementById('modal-exp-langsung').classList.remove('hidden');
};

function _tglToInput(tgl) {
  if (!tgl) return '';
  var p = tgl.split('/');
  if (p.length === 3) return p[2] + '-' + p[1] + '-' + p[0];
  return tgl;
}

// ── Hapus ──────────────────────────────────────────────────────

window.bukaModalHapusExp = function(id, sumber) {
  document.getElementById('exp-hapus-id').value = id;
  var info = 'ID: ' + id;
  if (sumber === 'Penggunaan Stok') info += ' — stok akan dikembalikan.';
  document.getElementById('exp-hapus-info').textContent = info;
  document.getElementById('modal-exp-hapus').classList.remove('hidden');
};

window.tutupModalHapusExp = function() {
  document.getElementById('modal-exp-hapus').classList.add('hidden');
};

window.konfirmasiHapusExp = function() {
  var id = document.getElementById('exp-hapus-id').value;
  if (!id) return;
  tutupModalHapusExp();
  toggleLoader(true, 'Menghapus pengeluaran...');
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message);
        _loadExpData();
      } else {
        showNotification(res.message || 'Gagal menghapus.', 'error');
      }
    })
    .withFailureHandler(function(err) { toggleLoader(false); showNotification('Error: ' + err.message, 'error'); })
    .hapusPengeluaran(id);
};

// ── Permintaan Pembayaran PO (Tab Finance) ─────────────────────

window.loadPaymentRequestList = function() {
  if (typeof google === 'undefined') return;
  var status = '';
  var selEl = document.getElementById('filter-payreq-status');
  if (selEl) status = selEl.value;
  var tbody = document.getElementById('table-payreq');
  if (tbody) {
    tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  }
  google.script.run
    .withSuccessHandler(function(res) {
      var list = (res && res.list) ? res.list : [];
      _renderPaymentRequestList(list);
      // Update badge count untuk status Menunggu
      var menungguCount = list.filter(function(r) { return r.status === 'Menunggu'; }).length;
      var badge = document.getElementById('exp-payreq-badge');
      if (badge) {
        if (menungguCount > 0 && status !== 'Menunggu') {
          badge.textContent = menungguCount;
          badge.classList.remove('hidden');
        } else if (status === 'Menunggu') {
          badge.textContent = list.length;
          badge.classList.toggle('hidden', list.length === 0);
        } else {
          badge.classList.add('hidden');
        }
      }
    })
    .withFailureHandler(function(err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-rose-400">Gagal memuat: ' + (err.message || '') + '</td></tr>';
    })
    .getPaymentRequestList({ status: status });
};

function _renderPaymentRequestList(list) {
  list = list || [];

  // KPI ringkas (dari data yang tampil)
  var _tot = 0, _pending = 0;
  list.forEach(function(r) { _tot += (r.jumlah || 0); if (r.status === 'Menunggu') _pending++; });
  var _k;
  _k = document.getElementById('kpi-payreq-count');   if (_k) _k.textContent = list.length;
  _k = document.getElementById('kpi-payreq-total');   if (_k) _k.textContent = _fmtRpExp(_tot);
  _k = document.getElementById('kpi-payreq-pending'); if (_k) _k.textContent = _pending;

  var tbody = document.getElementById('table-payreq');
  if (!tbody) return;
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400">Tidak ada data.</td></tr>';
    return;
  }
  var statusClass = {
    'Menunggu':  'bg-amber-100 text-amber-700',
    'Disetujui': 'bg-emerald-100 text-emerald-700',
    'Ditolak':   'bg-rose-100 text-rose-600'
  };
  var html = '';
  list.forEach(function(r) {
    var sc = statusClass[r.status] || 'bg-slate-100 text-slate-600';
    var pct = r.persentase != null ? parseFloat(r.persentase).toFixed(1) + '%' : '—';
    var aksiHtml = '';
    if (r.status === 'Menunggu') {
      aksiHtml =
        '<button onclick="bukaApprovePayReq(\'' + _esc(r.idReq) + '\',' + (r.jumlah || 0) + ',\'' + _esc(r.noPO) + '\')" ' +
          'class="px-2.5 py-1 text-xs bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-bold transition">Setujui</button> ' +
        '<button onclick="tolakPayReq(\'' + _esc(r.idReq) + '\')" ' +
          'class="px-2.5 py-1 text-xs bg-rose-100 hover:bg-rose-200 text-rose-600 rounded-lg font-bold transition">Tolak</button>';
    }
    html += '<tr class="hover:bg-slate-50 transition-colors">';
    var invoiceHtml = r.invoiceFileUrl
      ? '<a href="' + _esc(r.invoiceFileUrl) + '" target="_blank" class="inline-flex items-center gap-1 text-rose-500 hover:text-rose-600 font-semibold" title="Lihat invoice supplier"><i class="fa-solid fa-file-invoice"></i> Invoice</a>'
      : '<span class="text-slate-300">Tanpa invoice</span>';
    html += '<td class="p-4"><div class="font-mono text-xs text-slate-600">' + _esc(r.idReq || '') + '</div><div class="text-xs text-slate-400 mt-0.5">' + _esc(r.tanggalRequest || '') + '</div></td>';
    html += '<td class="p-4"><div class="font-mono text-xs font-bold text-slate-700">' + _esc(r.noPO || '') + '</div><div class="text-xs text-slate-400 mt-0.5 truncate max-w-[160px]">' + _esc(r.namaSupplier || '') + '</div></td>';
    html += '<td class="p-4 text-xs font-mono text-teal-700">' + _esc(r.noWO || '—') + '</td>';
    html += '<td class="p-4 text-right text-xs text-slate-600">Rp ' + ((r.grandTotalPO || 0).toLocaleString('id-ID')) + '</td>';
    html += '<td class="p-4 text-right font-bold text-slate-800 text-sm">Rp ' + ((r.jumlah || 0).toLocaleString('id-ID')) + '</td>';
    html += '<td class="p-4 text-center text-xs text-slate-500">' + pct + '</td>';
    html += '<td class="p-4 text-xs text-slate-500 max-w-[140px]"><div class="truncate" title="' + _esc(r.catatan) + '">' + _esc(r.catatan || '—') + '</div></td>';
    html += '<td class="p-4 text-xs text-center">' + invoiceHtml + '</td>';
    var catatanTolakHtml = (r.status === 'Ditolak' && r.catatanTolak)
      ? '<div class="text-[10px] text-rose-500 mt-1 max-w-[140px] truncate" title="' + _esc(r.catatanTolak) + '">' + _esc(r.catatanTolak) + '</div>'
      : '';
    var buktiHtml = (r.status === 'Disetujui' && r.buktiFileUrl)
      ? '<a href="' + _esc(r.buktiFileUrl) + '" target="_blank" class="inline-flex items-center gap-1 text-emerald-600 hover:text-emerald-700 font-semibold text-[10px] mt-1" title="Lihat bukti transaksi"><i class="fa-solid fa-receipt"></i> Bukti Bayar</a>'
      : '';
    html += '<td class="p-4 text-center"><span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ' + sc + '">' + _esc(r.status || '') + '</span>' + catatanTolakHtml + (buktiHtml ? '<div>' + buktiHtml + '</div>' : '') + '</td>';
    html += '<td class="p-4 text-center">' + (aksiHtml || '<span class="text-xs text-slate-300">—</span>') + '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function _resetApproveBuktiFileField() { _removeFileField('approve-bukti-file'); }
function handleApproveBuktiFileChange(input) { _uploadSupplierFile('approve-bukti-file', input, 'uploadFileBuktiBayarPO', 'violet'); }

window.bukaApprovePayReq = function(idReq, jumlah, noPO) {
  document.getElementById('approve-payreq-id').value     = idReq;
  document.getElementById('approve-payreq-jumlah').value = jumlah;
  document.getElementById('approve-payreq-nopo').value   = noPO;
  document.getElementById('approve-payreq-info').textContent =
    noPO + ' — Rp ' + Math.round(jumlah).toLocaleString('id-ID');
  document.getElementById('approve-payreq-akun').value    = '';
  document.getElementById('approve-payreq-catatan').value = '';
  document.getElementById('approve-payreq-tanggal').value = new Date().toISOString().slice(0, 10);
  _resetApproveBuktiFileField();
  _loadAkunOptionsExp('approve-payreq-akun', '');
  document.getElementById('modal-approve-payreq').classList.remove('hidden');
};

window.submitApprovePayReq = function() {
  var idReq    = document.getElementById('approve-payreq-id').value;
  var jumlah   = parseFloat(document.getElementById('approve-payreq-jumlah').value) || 0;
  var noPO     = document.getElementById('approve-payreq-nopo').value;
  var idAkun   = document.getElementById('approve-payreq-akun').value;
  var tglInput = document.getElementById('approve-payreq-tanggal').value;
  var catatan  = (document.getElementById('approve-payreq-catatan').value || '').trim();
  var buktiFileId   = document.getElementById('approve-bukti-file-id').value;
  var buktiFileUrl  = document.getElementById('approve-bukti-file-url').value;
  var buktiFileName = document.getElementById('approve-bukti-file-name').value;

  if (!idAkun) return showNotification('Pilih akun pembayaran.', 'error');
  if (!tglInput) return showNotification('Tanggal bayar wajib diisi.', 'error');
  if (!buktiFileUrl) return showNotification('Bukti transaksi pembayaran wajib dilampirkan.', 'error');

  var akunSel = document.getElementById('approve-payreq-akun');
  var namaAkun = akunSel.options[akunSel.selectedIndex]
    ? (akunSel.options[akunSel.selectedIndex].dataset.nama || akunSel.options[akunSel.selectedIndex].textContent)
    : '';
  var tglParts = tglInput.split('-');
  var tanggalBayar = tglParts[2] + '/' + tglParts[1] + '/' + tglParts[0];

  var payload = {
    idReq:          idReq,
    noPO:           noPO,
    jumlah:         jumlah,
    idAkun:         idAkun,
    namaAkun:       namaAkun,
    tanggalBayar:   tanggalBayar,
    catatan:        catatan,
    approvedBy:     (_currentUser && _currentUser.nama) || '',
    buktiFileId:    buktiFileId,
    buktiFileUrl:   buktiFileUrl,
    buktiFileName:  buktiFileName
  };

  document.getElementById('modal-approve-payreq').classList.add('hidden');
  toggleLoader(true, 'Menyetujui pembayaran...');
  if (typeof google === 'undefined') { toggleLoader(false); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message || 'Pembayaran disetujui dan dicatat.');
        loadPaymentRequestList();   // sekaligus perbarui badge Menunggu
        _loadExpData();
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .approvePembayaranPO(payload);
};

window.tolakPayReq = function(idReq) {
  if (!idReq) return;
  document.getElementById('tolak-payreq-id').value      = idReq;
  document.getElementById('tolak-payreq-info').textContent = idReq;
  document.getElementById('tolak-payreq-catatan').value  = '';
  document.getElementById('modal-tolak-payreq').classList.remove('hidden');
};

window.submitTolakPayReq = function() {
  var idReq   = document.getElementById('tolak-payreq-id').value;
  var catatan = (document.getElementById('tolak-payreq-catatan').value || '').trim();
  if (!catatan) return showNotification('Catatan penolakan wajib diisi.', 'error');

  var namaUser = (_currentUser && _currentUser.nama) || '';
  document.getElementById('modal-tolak-payreq').classList.add('hidden');
  toggleLoader(true, 'Menolak request...');
  if (typeof google === 'undefined') { toggleLoader(false); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res.success) {
        showNotification(res.message || 'Request ditolak.');
        loadPaymentRequestList();   // sekaligus perbarui badge Menunggu
      } else {
        showNotification(res.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      toggleLoader(false);
      showNotification('Error: ' + err.message, 'error');
    })
    .tolakRequestPembayaranPO(idReq, namaUser, catatan);
};
</script>
