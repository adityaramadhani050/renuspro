<script>
// ================================================================
//  LAPORAN KEUANGAN (Keuntungan Bulanan) — JavaScript
// ================================================================

var _lkData = null;

function _lkInitTahunSelect() {
  var sel = document.getElementById('lk-tahun');
  var thisYear = new Date().getFullYear();
  sel.innerHTML = '';
  for (var y = thisYear; y >= thisYear - 4; y--) {
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    sel.appendChild(opt);
  }
}

window.loadLaporanKeuangan = function() {
  if (!document.getElementById('lk-tahun').options.length) _lkInitTahunSelect();
  var tahun = parseInt(document.getElementById('lk-tahun').value, 10) || new Date().getFullYear();

  document.getElementById('lk-table-bulan').innerHTML =
    '<tr><td colspan="5" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  document.getElementById('lk-table-kategori').innerHTML =
    '<tr><td colspan="2" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';

  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showNotification(res.message || 'Gagal memuat laporan.', 'error');
        return;
      }
      _lkData = res;
      _renderLaporanKeuangan(res);
    })
    .withFailureHandler(function(err) {
      showNotification('Error: ' + err.message, 'error');
    })
    .getLaporanKeuntunganBulanan({ tahun: tahun });
};

function _renderLaporanKeuangan(res) {
  var s = res.summary || {};
  document.getElementById('lk-card-invoice').textContent        = _fmtRpLP(s.totalInvoiceDPP);
  document.getElementById('lk-card-exp-project').textContent    = _fmtRpLP(s.totalPengeluaranProject);
  document.getElementById('lk-card-exp-nonproject').textContent = _fmtRpLP(s.totalPengeluaranNonProject);
  document.getElementById('lk-card-keuntungan').textContent     = _fmtRpLP(s.totalKeuntungan);
  document.getElementById('lk-card-keuntungan').className = 'text-2xl font-extrabold ' + (s.totalKeuntungan >= 0 ? 'text-emerald-600' : 'text-rose-600');

  var rows = res.rows || [];
  var html = '';
  rows.forEach(function(r) {
    var kCls = r.keuntungan >= 0 ? 'text-emerald-600' : 'text-rose-600';
    html += '<tr class="hover:bg-slate-50 transition-colors">';
    html += '<td class="p-4 text-sm font-semibold text-slate-700">' + r.bulan + '</td>';
    html += '<td class="p-4 text-right text-xs text-slate-600">' + _fmtRpLP(r.invoiceDPP) + '</td>';
    html += '<td class="p-4 text-right text-xs text-slate-600">' + _fmtRpLP(r.pengeluaranProject) + '</td>';
    html += '<td class="p-4 text-right text-xs text-slate-600">' + _fmtRpLP(r.pengeluaranNonProject) + '</td>';
    html += '<td class="p-4 text-right text-xs font-bold ' + kCls + '">' + _fmtRpLP(r.keuntungan) + '</td>';
    html += '</tr>';
  });
  document.getElementById('lk-table-bulan').innerHTML = html;

  var kategoriRows = res.kategoriBreakdown || [];
  if (kategoriRows.length === 0) {
    document.getElementById('lk-table-kategori').innerHTML =
      '<tr><td colspan="2" class="p-8 text-center text-slate-400">Tidak ada pengeluaran non-project pada periode ini.</td></tr>';
  } else {
    var htmlK = '';
    kategoriRows.forEach(function(k) {
      htmlK += '<tr class="hover:bg-slate-50">';
      htmlK += '<td class="p-4 text-sm text-slate-700">' + _escLP(k.kategori) + '</td>';
      htmlK += '<td class="p-4 text-right font-bold text-slate-800">' + _fmtRpLP(k.total) + '</td>';
      htmlK += '</tr>';
    });
    document.getElementById('lk-table-kategori').innerHTML = htmlK;
  }
}

// ── Export PDF ─────────────────────────────────────────────────

window.exportLaporanKeuanganPDF = function() {
  if (!_lkData) { showNotification('Muat data terlebih dahulu.', 'error'); return; }
  try {
    var doc  = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var PW = 210, ML = 14, MR = 14, CW = PW - ML - MR;
    var DARK  = [30,41,59],  SLATE = [100,116,139], BLUE  = [30,64,175];
    var GREEN = [5,150,105], RED   = [190,30,45],   WHITE = [255,255,255];
    var rp = function(v) { return 'Rp ' + Math.round(v||0).toLocaleString('id-ID'); };

    var s        = _lkData.summary          || {};
    var rows     = _lkData.rows             || [];
    var kategori = _lkData.kategoriBreakdown || [];
    var tahun    = document.getElementById('lk-tahun').value;
    var tglCetak = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });

    // ── Dark header ──────────────────────────────────────────────
    doc.setFillColor(DARK[0], DARK[1], DARK[2]); doc.rect(0, 0, PW, 24, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text('LAPORAN KEUANGAN', ML, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(190,200,220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(170,195,255);
    doc.text('Tahun:', PW - MR, 10, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
    doc.text(tahun || '-', PW - MR, 15, { align:'right' });
    doc.setFontSize(7); doc.setTextColor(190,200,220);
    doc.text('Dicetak: ' + tglCetak, PW - MR, 20, { align:'right' });

    var y = 30;

    // ── KPI boxes ────────────────────────────────────────────────
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);
    doc.text('RINGKASAN KEUANGAN', ML, y); y += 5;
    var kpiItems = [
      { label:'Total Invoice (DPP)',       value: rp(s.totalInvoiceDPP),            color: DARK  },
      { label:'Pengeluaran Project',       value: rp(s.totalPengeluaranProject),    color: RED   },
      { label:'Pengeluaran Non-Project',   value: rp(s.totalPengeluaranNonProject), color: RED   },
      { label:'Total Keuntungan',          value: rp(s.totalKeuntungan),            color: GREEN }
    ];
    var boxW = (CW - 7.5) / 4, boxH = 14, gap = 2.5;
    kpiItems.forEach(function(k, i) {
      var bx = ML + i * (boxW + gap), by = y;
      doc.setFillColor(248,250,252); doc.setDrawColor(226,232,240);
      doc.roundedRect(bx, by, boxW, boxH, 2, 2, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
      doc.text(k.label.toUpperCase(), bx + 3, by + 4.5);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(k.color[0],k.color[1],k.color[2]);
      doc.text(k.value, bx + 3, by + 10.5);
    });
    y += boxH + 8;

    // ── Tabel bulanan ────────────────────────────────────────────
    doc.autoTable({
      startY: y, margin: { left: ML, right: MR },
      head: [['Bulan', 'Invoice (DPP)', 'Peng. Project', 'Peng. Non-Project', 'Keuntungan']],
      body: rows.map(function(r) {
        return [r.bulan, rp(r.invoiceDPP), rp(r.pengeluaranProject), rp(r.pengeluaranNonProject), rp(r.keuntungan)];
      }),
      theme: 'grid',
      styles:     { fontSize: 8, cellPadding: 2.5, font:'helvetica', textColor: DARK },
      headStyles: { fillColor: [51,65,85], textColor: WHITE, fontStyle:'bold' },
      columnStyles: {
        1: { halign:'right' }, 2: { halign:'right' }, 3: { halign:'right' }, 4: { halign:'right', fontStyle:'bold' }
      },
      alternateRowStyles: { fillColor: [248,250,252] },
      didParseCell: function(d) {
        if (d.section === 'body' && d.column.index === 4) {
          var r = rows[d.row.index];
          d.cell.styles.textColor = (r && r.keuntungan < 0) ? RED : GREEN;
        }
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    // ── Rincian kategori ─────────────────────────────────────────
    if (kategori.length > 0) {
      if (y > 250) { doc.addPage(); y = 14; }
      doc.setFillColor(DARK[0],DARK[1],DARK[2]);
      doc.roundedRect(ML, y, 120, 8, 1.5, 1.5, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
      doc.text('RINCIAN KATEGORI PENGELUARAN NON-PROJECT', ML + 3, y + 5.5);
      y += 10;
      doc.autoTable({
        startY: y, margin: { left: ML, right: MR },
        head: [['Kategori', 'Total']],
        body: kategori.map(function(k) { return [k.kategori, rp(k.total)]; }),
        theme: 'grid',
        styles:     { fontSize: 8, cellPadding: 2.5, font:'helvetica', textColor: DARK },
        headStyles: { fillColor: [51,65,85], textColor: WHITE, fontStyle:'bold', fontSize: 8 },
        columnStyles: { 1: { halign:'right', fontStyle:'bold' } },
        alternateRowStyles: { fillColor: [248,250,252] },
        tableWidth: 120
      });
    }

    // ── Page numbers ──────────────────────────────────────────────
    var totalPages = doc.internal.getNumberOfPages();
    for (var p = 1; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
      doc.text('Halaman ' + p + ' / ' + totalPages, PW / 2, 292, { align:'center' });
      doc.text('PT. RENUS GLOBAL INDONESIA — KONFIDENSIAL', ML, 292);
    }

    doc.save('Laporan_Keuangan_' + tahun + '.pdf');
    showNotification('PDF berhasil diunduh!');
  } catch(e) {
    showNotification('Gagal export PDF: ' + e.message, 'error');
  }
};
</script>
