<script>
// ================================================================
//  CASH MANAGER — Pemasukan & Saldo (JavaScript)
// ================================================================

var _inData     = [];
var _inAkunList = [];

// ── Helpers ────────────────────────────────────────────────────
function _escIn(s) {
  return (s == null ? '' : s.toString())
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function _inTglToMs(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  var p = ddmmyyyy.split('/');
  if (p.length !== 3) return null;
  return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0])).getTime();
}
function _inCurrentUserName() {
  return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : '';
}

// ── Load utama (Mutasi Kas gabungan pemasukan + pengeluaran) ───
var _mutData = [];

window.loadPemasukan = function() { loadMutasi(); };   // alias utk pemanggil lama

window.loadMutasi = function() {
  var tb = document.getElementById('table-mutasi');
  if (tb) tb.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</td></tr>';
  _loadInAkunOptions();
  if (typeof google === 'undefined') return;
  // Ambil pemasukan → lalu pengeluaran (berurutan, deterministik)
  google.script.run
    .withSuccessHandler(function(rp) {
      var pem = (rp && rp.success) ? (rp.list || []) : [];
      _inData = pem;
      _fetchPengeluaranThenBuild(pem);
    })
    .withFailureHandler(function() { _inData = []; _fetchPengeluaranThenBuild([]); })
    .getPemasukanList({});
};

function _fetchPengeluaranThenBuild(pem) {
  if (typeof google === 'undefined') { _buildMutasi(pem, []); return; }
  google.script.run
    .withSuccessHandler(function(re) {
      var eng = (re && re.success) ? (re.list || []) : [];
      _expData = eng;
      _buildMutasi(pem, eng);
    })
    .withFailureHandler(function(err) {
      _expData = [];
      _buildMutasi(pem, []);
      if (!pem.length) {
        var tb = document.getElementById('table-mutasi');
        if (tb) tb.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-rose-400">Gagal memuat data: ' + (err && err.message ? err.message : '') + '</td></tr>';
      }
    })
    .getPengeluaranList({});
}

function _buildMutasi(pem, eng) {
  _mutData = [];
  (pem || []).forEach(function(p) {
    _mutData.push({ tipe:'masuk', id:p.id, tanggal:p.tanggal, jumlah:p.jumlah || 0,
      deskripsi:p.deskripsi, sumber:p.sumber, kategori:p.kategori, idAkun:p.idAkun,
      namaAkun:p.namaAkun, ref:(p.noRef || ''), editable:(p.sumber === 'Langsung') });
  });
  (eng || []).forEach(function(e) {
    _mutData.push({ tipe:'keluar', id:e.id, tanggal:e.tanggal, jumlah:e.total || 0,
      deskripsi:e.deskripsi, sumber:e.sumber,
      kategori:(e.noWO ? (e.namaProject || e.noWO) : (e.kategori || '')),
      idAkun:e.idAkun, namaAkun:e.namaAkun, ref:(e.noPO || ''), editable:(e.sumber === 'Langsung') });
  });
  filterMutasi();
}

// ── Saldo panel ────────────────────────────────────────────────
window.loadSaldoPanel = function() {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(_renderSaldoPanel)
    .withFailureHandler(function() {})
    .getSaldoAkun();
};

function _renderSaldoPanel(res) {
  var container = document.getElementById('cm-saldo-panel');
  if (!container) return;
  if (!res || !res.success) {
    container.innerHTML = '<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 text-xs text-rose-500">Gagal memuat saldo.</div>';
    return;
  }
  var html = '';
  // Kartu total
  html += '<div class="bg-gradient-to-br from-emerald-600 to-emerald-700 rounded-2xl shadow-sm p-4 text-white">'
    + '<p class="text-[10px] font-bold uppercase tracking-wider opacity-80 mb-1"><i class="fa-solid fa-sack-dollar mr-1"></i>Total Uang Saat Ini</p>'
    + '<p class="text-2xl font-extrabold">' + _fmtRpExp(res.totalSaldo) + '</p>'
    + '<p class="text-[11px] opacity-80 mt-1">Masuk ' + _fmtRpExp(res.totalMasuk) + ' &middot; Keluar ' + _fmtRpExp(res.totalKeluar) + '</p>'
    + '</div>';
  // Kartu per akun
  (res.akun || []).forEach(function(a) {
    var neg = a.saldo < 0;
    html += '<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">'
      + '<div class="flex items-center gap-2 mb-1">'
      + '<span class="bg-slate-100 text-slate-500 h-6 w-6 rounded-lg flex items-center justify-center text-[11px]"><i class="fa-solid fa-' + (a.tipe === 'Kas' ? 'wallet' : 'building-columns') + '"></i></span>'
      + '<p class="text-xs font-bold text-slate-600 truncate">' + _escIn(a.nama) + '</p>'
      + (a.status && a.status !== 'Aktif' ? '<span class="text-[9px] bg-slate-100 text-slate-400 px-1 py-0.5 rounded font-bold">' + _escIn(a.status) + '</span>' : '')
      + '</div>'
      + '<p class="text-xl font-extrabold ' + (neg ? 'text-rose-600' : 'text-slate-800') + '">' + _fmtRpExp(a.saldo) + '</p>'
      + '<p class="text-[11px] text-slate-400 mt-1"><span class="text-emerald-600 font-semibold">+' + _fmtRpExp(a.masuk) + '</span> &middot; <span class="text-rose-500 font-semibold">-' + _fmtRpExp(a.keluar) + '</span></p>'
      + '</div>';
  });
  if (!(res.akun || []).length) {
    html += '<div class="bg-white rounded-2xl shadow-sm border border-dashed border-slate-200 p-4 text-xs text-slate-400 flex items-center">Belum ada akun kas. Tambah di Pengaturan → Akun Pembayaran.</div>';
  }
  container.innerHTML = html;
}

// ── Akun options (filter + form) ───────────────────────────────
function _loadInAkunOptions() {
  if (typeof google === 'undefined') return;
  google.script.run
    .withSuccessHandler(function(res) {
      // Akun = Bank Account (data yang sama dengan invoice)
      var list = (res && res.accounts) ? res.accounts : [];
      _inAkunList = list.map(function(b) { return { id: b.id, namaAkun: b.label }; });
      _fillInAkunSelect('filter-mut-akun', '', true);
      _fillInAkunSelect('in-akun', '', false);
    })
    .withFailureHandler(function() {})
    .getBankAccounts();
}

function _fillInAkunSelect(selId, selectedVal, withAll) {
  var sel = document.getElementById(selId);
  if (!sel) return;
  var opts = withAll ? '<option value="">Semua Akun</option>' : '<option value="">— Pilih Akun —</option>';
  _inAkunList.forEach(function(a) {
    var s = (a.id === selectedVal) ? ' selected' : '';
    opts += '<option value="' + a.id + '" data-nama="' + _escIn(a.namaAkun) + '"' + s + '>' + _escIn(a.namaAkun) + '</option>';
  });
  sel.innerHTML = opts;
  if (selectedVal) sel.value = selectedVal;
}

// ── Render mutasi + KPI + saldo berjalan ───────────────────────
function _tipeBadgeMut(m) {
  if (m.tipe === 'masuk') {
    var lblIn = (m.sumber === 'Invoice') ? 'Invoice' : (m.kategori || 'Pemasukan');
    return '<span class="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700"><i class="fas fa-arrow-down text-[9px]"></i> ' + _escIn(lblIn) + '</span>';
  }
  var cfg = { 'Pembayaran PO':'bg-blue-100 text-blue-700', 'Penggunaan Stok':'bg-amber-100 text-amber-700', 'Langsung':'bg-rose-100 text-rose-700' };
  var cls = cfg[m.sumber] || 'bg-rose-100 text-rose-700';
  var lbl = (m.sumber === 'Langsung') ? (m.kategori || 'Pengeluaran') : m.sumber;
  return '<span class="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded ' + cls + '"><i class="fas fa-arrow-up text-[9px]"></i> ' + _escIn(lbl) + '</span>';
}

function _renderMutasi(list) {
  _renderMutKPI(list);
  var tbody = document.getElementById('table-mutasi');
  if (!tbody) return;

  // Saldo berjalan hanya bila tepat 1 akun dipilih (dihitung atas seluruh riwayat akun tsb)
  var akunFilter = (document.getElementById('filter-mut-akun') || {}).value || '';
  var showSaldo = !!akunFilter;
  var saldoMap = {};
  if (showSaldo) {
    var acctAll = _mutData.filter(function(m){ return m.idAkun === akunFilter; }).slice()
      .sort(function(a, b){ return (_inTglToMs(a.tanggal) || 0) - (_inTglToMs(b.tanggal) || 0); });
    var run = 0;
    acctAll.forEach(function(m){ run += (m.tipe === 'masuk' ? m.jumlah : -m.jumlah); saldoMap[m.id] = run; });
  }

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-sm text-slate-400 py-10">Belum ada mutasi pada filter ini.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(function(m) {
    var isMasuk = m.tipe === 'masuk';
    var aksi;
    if (!m.editable) {
      aksi = '<span class="text-slate-300 p-1.5 inline-flex" title="Otomatis — kelola dari sumbernya"><i class="fas fa-lock text-xs"></i></span>';
    } else if (isMasuk) {
      aksi = '<button onclick="editPemasukan(\'' + _escIn(m.id) + '\')" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fas fa-pen-to-square"></i></button>'
           + '<button onclick="hapusPemasukanUI(\'' + _escIn(m.id) + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fas fa-trash-can"></i></button>';
    } else {
      aksi = '<button onclick="editPengeluaran(\'' + _escIn(m.id) + '\')" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fas fa-pen-to-square"></i></button>'
           + '<button onclick="bukaModalHapusExp(\'' + _escIn(m.id) + '\',\'' + _escIn(m.sumber) + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fas fa-trash-can"></i></button>';
    }
    var akunTxt = m.namaAkun || (m.idAkun ? _escIn(m.idAkun) : '<span class="text-amber-500 text-[11px]">— belum terpetakan —</span>');
    var masukCol  = isMasuk  ? '<span class="font-bold text-emerald-600">' + _fmtRpExp(m.jumlah) + '</span>' : '<span class="text-slate-300">—</span>';
    var keluarCol = !isMasuk ? '<span class="font-bold text-rose-600">'    + _fmtRpExp(m.jumlah) + '</span>' : '<span class="text-slate-300">—</span>';
    var saldoCol  = showSaldo ? '<span class="font-semibold text-slate-700">' + _fmtRpExp(saldoMap[m.id]) + '</span>' : '<span class="text-slate-300">—</span>';
    return '<tr class="hover:bg-slate-50 transition border-b border-slate-50">'
      + '<td class="p-4 whitespace-nowrap" data-label="Tanggal"><div class="text-xs font-semibold text-slate-700">' + _fmtTglExp(m.tanggal) + '</div><div class="text-[10px] text-slate-400 font-mono mt-0.5">' + _escIn(m.id) + '</div></td>'
      + '<td class="p-4" data-label="Keterangan"><div class="text-xs text-slate-700">' + _escIn(m.deskripsi || '—') + '</div><div class="mt-1 flex items-center gap-1 flex-wrap">' + _tipeBadgeMut(m) + (m.ref ? '<span class="text-[10px] text-slate-400">Ref: ' + _escIn(m.ref) + '</span>' : '') + '</div></td>'
      + '<td class="p-4 text-xs text-slate-600" data-label="Akun">' + akunTxt + '</td>'
      + '<td class="p-4 text-right whitespace-nowrap" data-label="Masuk">' + masukCol + '</td>'
      + '<td class="p-4 text-right whitespace-nowrap" data-label="Keluar">' + keluarCol + '</td>'
      + '<td class="p-4 text-right whitespace-nowrap" data-label="Saldo">' + saldoCol + '</td>'
      + '<td class="p-4 text-center rp-actions"><div class="flex items-center justify-center gap-1">' + aksi + '</div></td>'
      + '</tr>';
  }).join('');
}

function _renderMutKPI(list) {
  var masuk = 0, keluar = 0;
  list.forEach(function(m){ if (m.tipe === 'masuk') masuk += m.jumlah || 0; else keluar += m.jumlah || 0; });
  var net = masuk - keluar, e;
  e = document.getElementById('kpi-mut-masuk');  if (e) e.innerText = _fmtRpExp(masuk);
  e = document.getElementById('kpi-mut-keluar'); if (e) e.innerText = _fmtRpExp(keluar);
  e = document.getElementById('kpi-mut-net');    if (e) { e.innerText = _fmtRpExp(net); e.className = 'text-xl font-extrabold ' + (net < 0 ? 'text-rose-600' : 'text-slate-800'); }
  e = document.getElementById('kpi-mut-count');  if (e) e.innerText = list.length;
}

// ── Filter mutasi (client-side) ────────────────────────────────
function _applyMutFilter(data) {
  var akun   = (document.getElementById('filter-mut-akun')   || {}).value || '';
  var tipe   = (document.getElementById('filter-mut-tipe')   || {}).value || '';
  var dari   = (document.getElementById('filter-mut-dari')   || {}).value || '';
  var sampai = (document.getElementById('filter-mut-sampai') || {}).value || '';
  var cari   = ((document.getElementById('filter-mut-cari')  || {}).value || '').toLowerCase();
  var dariMs   = dari   ? new Date(dari + 'T00:00:00').getTime()   : null;
  var sampaiMs = sampai ? new Date(sampai + 'T23:59:59').getTime() : null;
  var out = data.filter(function(m) {
    if (akun && m.idAkun !== akun) return false;
    if (tipe && m.tipe !== tipe) return false;
    if (cari) {
      var hay = ((m.deskripsi || '') + ' ' + (m.ref || '') + ' ' + (m.id || '') + ' ' + (m.kategori || '')).toLowerCase();
      if (hay.indexOf(cari) === -1) return false;
    }
    if (dariMs || sampaiMs) {
      var ms = _inTglToMs(m.tanggal);
      if (ms == null) return false;
      if (dariMs && ms < dariMs) return false;
      if (sampaiMs && ms > sampaiMs) return false;
    }
    return true;
  });
  out.sort(function(a, b){ return (_inTglToMs(b.tanggal) || 0) - (_inTglToMs(a.tanggal) || 0); });  // terbaru dulu
  return out;
}

window.filterMutasi = function() { _renderMutasi(_applyMutFilter(_mutData)); };
window.resetFilterMutasi = function() {
  ['filter-mut-akun','filter-mut-tipe','filter-mut-dari','filter-mut-sampai','filter-mut-cari'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = '';
  });
  _renderMutasi(_applyMutFilter(_mutData));
};

// ── Form ───────────────────────────────────────────────────────
window.bukaFormPemasukan = function() {
  document.getElementById('in-modal-title').innerText = 'Tambah Pemasukan';
  document.getElementById('in-id-field').value  = '';
  document.getElementById('in-tanggal').value   = _todayInput();
  document.getElementById('in-kategori').value  = 'Pendapatan Lain';
  document.getElementById('in-deskripsi').value = '';
  document.getElementById('in-noref').value     = '';
  document.getElementById('in-jumlah').value    = '';
  document.getElementById('in-catatan').value   = '';
  _fillInAkunSelect('in-akun', '', false);
  document.getElementById('modal-in-langsung').classList.remove('hidden');
};

window.tutupFormPemasukan = function() {
  document.getElementById('modal-in-langsung').classList.add('hidden');
};

function _todayInput() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function _inputToTgl(v) {
  if (!v) return '';
  var p = v.split('-');
  return (p.length === 3) ? (p[2] + '/' + p[1] + '/' + p[0]) : v;
}

window.editPemasukan = function(id) {
  var it = _inData.filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  if (it.sumber !== 'Langsung') { showNotification('Pemasukan otomatis dari invoice tidak bisa diedit.', 'error'); return; }
  document.getElementById('in-modal-title').innerText = 'Edit Pemasukan';
  document.getElementById('in-id-field').value  = it.id;
  document.getElementById('in-tanggal').value   = _tglToInputIn(it.tanggal);
  _fillInAkunSelect('in-akun', it.idAkun, false);
  document.getElementById('in-kategori').value  = it.kategori || 'Pendapatan Lain';
  document.getElementById('in-deskripsi').value = it.deskripsi || '';
  document.getElementById('in-noref').value     = it.noRef || '';
  document.getElementById('in-jumlah').value    = it.jumlah ? Math.round(it.jumlah).toLocaleString('id-ID') : '';
  document.getElementById('in-catatan').value   = it.catatan || '';
  document.getElementById('modal-in-langsung').classList.remove('hidden');
};

function _tglToInputIn(tgl) {
  if (!tgl) return _todayInput();
  var p = tgl.split('/');
  return (p.length === 3) ? (p[2] + '-' + p[1] + '-' + p[0]) : _todayInput();
}

window.submitPemasukan = function() {
  var id       = document.getElementById('in-id-field').value.trim();
  var akunSel  = document.getElementById('in-akun');
  var idAkun   = akunSel.value;
  var namaAkun = idAkun ? (akunSel.options[akunSel.selectedIndex].getAttribute('data-nama') || '') : '';
  var payload = {
    id:         id,
    tanggal:    _inputToTgl(document.getElementById('in-tanggal').value),
    kategori:   document.getElementById('in-kategori').value,
    idAkun:     idAkun,
    namaAkun:   namaAkun,
    noRef:      document.getElementById('in-noref').value.trim(),
    deskripsi:  document.getElementById('in-deskripsi').value.trim(),
    jumlah:     _parseCurrencyExp(document.getElementById('in-jumlah').value),
    catatan:    document.getElementById('in-catatan').value.trim()
  };
  if (!payload.idAkun)   { showNotification('Akun penerima wajib dipilih.', 'error'); return; }
  if (!payload.deskripsi){ showNotification('Deskripsi wajib diisi.', 'error'); return; }
  if (payload.jumlah <= 0){ showNotification('Jumlah harus lebih dari 0.', 'error'); return; }

  var btn = document.getElementById('in-submit-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> Menyimpan...'; }

  var done = function(res) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-floppy-disk text-xs"></i> Simpan'; }
    if (res && res.success) {
      showNotification(res.message || 'Tersimpan.');
      tutupFormPemasukan();
      loadPemasukan();
      loadSaldoPanel();
    } else {
      showNotification((res && res.message) || 'Gagal menyimpan.', 'error');
    }
  };
  var fail = function(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-floppy-disk text-xs"></i> Simpan'; }
    showNotification('Error: ' + (e && e.message ? e.message : e), 'error');
  };

  if (id) {
    payload.diubahOleh = _inCurrentUserName();
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).editPemasukanLangsung(payload);
  } else {
    payload.dibuatOleh = _inCurrentUserName();
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).simpanPemasukanLangsung(payload);
  }
};

window.hapusPemasukanUI = function(id) {
  showConfirm({
    type: 'danger',
    title: 'Hapus Pemasukan?',
    message: 'Yakin menghapus pemasukan ' + id + '? Saldo akun akan menyesuaikan.',
    confirmText: 'Ya, Hapus',
    onConfirm: function() {
      google.script.run
        .withSuccessHandler(function(res) {
          showNotification((res && res.message) || 'Terhapus.', res && res.success ? 'success' : 'error');
          loadPemasukan();
          loadSaldoPanel();
        })
        .withFailureHandler(function(e) { showNotification('Error: ' + (e && e.message ? e.message : e), 'error'); })
        .hapusPemasukan(id);
    }
  });
};
</script>
