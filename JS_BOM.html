<script>
// ================================================================
//  BILL OF MATERIAL (BOM) — daftar material per Work Order.
//  Item diambil dari pricelist supplier; dikelompokkan per kategori.
//  Lead assign Site Engineer; Lead bisa Finalkan (kunci). Tanpa harga.
// ================================================================

let _bomWOList = [];      // dashboard perWO
let _bomWO     = null;    // WO yang sedang dibuka {noWO, namaProject, namaKlien, status}
let _bomItems  = [];      // item material WO terbuka
let _bomStatus = 'Draft'; // Draft | Final
let _bomWOStatus = '';    // status WO (Closed?)
let _bomAssigned = [];    // [{id, nama}]
let _bomPricelist = null; // cache katalog pricelist
let _bomKategori = null;  // cache master kategori (untuk dropdown blok)
let _bomSiteEngineers = null;
let _bomPlInited = false;

function _bomRole()     { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
function _bomUserNama() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _bomUserId()   { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.id) ? _currentUser.id : ''; }
function _bomCanManage(){ var r = _bomRole(); return r === 'leadengineer' || r === 'admin'; }  // assign site engineer
function _bomCanReview(){ var r = _bomRole(); return r === 'leadengineer' || r === 'admin'; }  // approve/reject material
function _bomIsAssigned(){ var id = _bomUserId(); return (_bomAssigned || []).some(function(a){ return a.id === id; }); }
// Hanya Site Engineer yang di-assign (& Admin) yang bisa tambah/edit/hapus material.
function _bomCanEdit()  {
  if (_bomWOStatus === 'Closed') return false;
  var r = _bomRole();
  if (r === 'admin') return true;
  if (r === 'siteengineer') return _bomIsAssigned();
  return false;
}
function _bomEsc(s){ return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _bomRp(n){ return (Number(n)||0).toLocaleString('id-ID'); }

// ── HOME ────────────────────────────────────────────────────────
window.loadBOM = function() {
  // Selalu ambil ulang katalog & kategori saat masuk menu BOM agar kategori/
  // material yang baru dibuat di menu Pricelist langsung muncul (tanpa reload).
  _bomPricelist = null;
  _bomKategori = null;
  document.getElementById('bom-home').classList.remove('hidden');
  document.getElementById('bom-detail').classList.add('hidden');
  var hint = document.getElementById('bom-role-hint');
  if (hint) hint.innerText = _bomCanManage() ? (_bomRole() === 'admin' ? 'Admin' : 'Lead Engineer') : (_bomRole() === 'siteengineer' ? 'Site Engineer' : 'Lihat');
  var addBtn = document.getElementById('bom-add-project-btn');
  if (addBtn) addBtn.classList.toggle('hidden', !_bomCanManage());

  document.getElementById('bom-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  var arg = (_bomRole() === 'siteengineer') ? { siteUserId: _bomUserId() } : {};
  google.script.run.withSuccessHandler(function(res) {
    _bomWOList = (res && res.success) ? (res.perWO || []) : [];
    _bomRenderCards((res && res.global) || {});
    _bomRenderWOList();
  }).withFailureHandler(function() {
    document.getElementById('bom-wo-list').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat data BOM.</div>';
  }).getBOMDashboard(arg);
};

function _bomCard(label, val, cls) {
  return '<div class="bg-white rounded-2xl border border-slate-150 p-4">'
    + '<div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">' + label + '</div>'
    + '<div class="text-2xl font-extrabold ' + (cls || 'text-slate-800') + ' mt-1">' + val + '</div></div>';
}
function _bomRenderCards(g) {
  document.getElementById('bom-cards').innerHTML =
      _bomCard('Project (WO)', g.jumlahWO || 0, 'text-indigo-700')
    + _bomCard('Total Material', g.jumlahItem || 0, 'text-slate-800')
    + _bomCard('Draft', g.jumlahDraft || 0, 'text-amber-600')
    + _bomCard('Final', g.jumlahFinal || 0, 'text-emerald-600');
}

function _bomStatusBadge(status) {
  return status === 'Final'
    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-lock text-[9px] mr-0.5"></i>Final</span>'
    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-pen text-[9px] mr-0.5"></i>Draft</span>';
}

// Indikator jumlah material & kategori (pakai icon) — dipakai di card list & detail.
function _bomCountHtml(nMat, nKat) {
  return '<div class="flex items-center justify-end gap-3 text-[11px] font-bold text-slate-500 whitespace-nowrap">'
    + '<span title="Jumlah material"><i class="fa-solid fa-cubes-stacked text-slate-400 mr-1"></i>' + (nMat || 0) + ' Material</span>'
    + '<span title="Jumlah kategori"><i class="fa-solid fa-layer-group text-slate-400 mr-1"></i>' + (nKat || 0) + ' Kategori</span>'
    + '</div>';
}

function _bomRenderWOList() {
  var q = (document.getElementById('bom-search').value || '').toLowerCase().trim();
  var list = _bomWOList.filter(function(w) {
    return !q || ((w.noWO + ' ' + (w.namaProject||'') + ' ' + (w.namaKlien||'')).toLowerCase().indexOf(q) !== -1);
  });
  var box = document.getElementById('bom-wo-list');
  if (!list.length) {
    var emptyMsg = q ? 'Tidak ada WO cocok.'
      : (_bomRole() === 'siteengineer' ? 'Belum ada Work Order yang ditugaskan ke Anda. Hubungi Lead Engineer.' : 'Belum ada project BOM. Klik <b>Tambah Project ke BOM</b>.');
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-cubes-stacked mr-2"></i>' + emptyMsg + '</div>';
    return;
  }
  box.innerHTML = list.map(function(w) {
    var asg = w.assigned || [];
    var seBadges = asg.length
      ? asg.map(function(a) { return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">' + _bomEsc(a.nama) + '</span>'; }).join('')
      : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-400">Belum ditugaskan</span>';
    var removeBtn = _bomCanManage()
      ? '<button onclick="event.stopPropagation();_bomRemoveProject(\'' + _bomEsc(w.noWO) + '\')" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Keluarkan dari BOM"><i class="fa-regular fa-trash-can text-sm"></i></button>'
      : '';
    return '<div onclick="bukaBOMDetail(\'' + _bomEsc(w.noWO) + '\')" class="w-full text-left bg-white rounded-2xl border border-slate-150 hover:border-indigo-300 hover:shadow-sm transition p-4 flex flex-col sm:flex-row sm:items-center gap-3 cursor-pointer">'
      + '<div class="flex-1 min-w-0">'
      +   '<div class="flex items-center gap-2"><span class="font-mono font-extrabold text-slate-700">' + _bomEsc(w.noWO) + '</span>' + _bomStatusBadge(w.status) + '</div>'
      +   '<div class="font-bold text-slate-800 truncate">' + _bomEsc(w.namaProject || '-') + '</div>'
      +   '<div class="text-[11px] text-slate-400 truncate">' + _bomEsc(w.namaKlien || '') + '</div>'
      + '</div>'
      + '<div class="flex items-center gap-3 w-full sm:w-auto">'
      +   '<div class="flex flex-row sm:flex-col items-center sm:items-end gap-2 sm:gap-1.5 flex-1 sm:flex-none w-full sm:w-auto">'
      +     '<div class="flex flex-wrap gap-1 flex-1 min-w-0 sm:flex-none sm:justify-end">' + seBadges + '</div>'
      +     _bomCountHtml(w.jumlahItem || 0, w.jumlahKategori || 0)
      +   '</div>'
      +   removeBtn
      +   '<i class="fa-solid fa-chevron-right text-slate-300"></i>'
      + '</div></div>';
  }).join('');
}

function _bomRemoveProject(noWO) {
  showConfirm({ title: 'Keluarkan dari BOM', message: 'Keluarkan WO ' + noWO + ' dari daftar BOM? Material tidak dihapus.', confirmText: 'Ya, Keluarkan', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Memproses...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dikeluarkan.');
      loadBOM();
    }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .removeBOMProject(noWO);
  }});
}

// ── DETAIL ──────────────────────────────────────────────────────
function bukaBOMDetail(noWO) {
  _bomWO = _bomWOList.filter(function(w){ return w.noWO === noWO; })[0] || { noWO: noWO, namaProject: '', namaKlien: '', status: 'Draft' };
  document.getElementById('bom-home').classList.add('hidden');
  document.getElementById('bom-detail').classList.remove('hidden');
  document.getElementById('bom-detail-body').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat material...</div>';
  document.getElementById('bom-detail-actions').innerHTML = '';
  _bomReloadDetail();
}

function kembaliBOMHome() {
  document.getElementById('bom-detail').classList.add('hidden');
  document.getElementById('bom-home').classList.remove('hidden');
  loadBOM();
}

function _bomReloadDetail() {
  if (!_bomWO) return;
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.success) { document.getElementById('bom-detail-body').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>'; return; }
    _bomItems = res.items || [];
    _bomStatus = res.status || 'Draft';
    _bomWOStatus = res.woStatus || '';
    _bomAssigned = res.assigned || [];
    if (_bomWO) _bomWO.status = _bomStatus;
    _bomRenderDetail();
  }).withFailureHandler(function() {
    document.getElementById('bom-detail-body').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>';
  }).getBOMByWO(_bomWO.noWO);
}

function _bomRenderDetail() {
  // Actions bar — urutan: Export PDF · Atur Site Engineer · Finalkan
  var actions = document.getElementById('bom-detail-actions');
  var btns = '';
  btns += '<button onclick="_bomExportPDF()" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-file-pdf text-rose-500"></i><span class="hidden sm:inline"> Export PDF</span></button>';
  if (_bomCanManage()) {
    btns += '<div class="relative"><button onclick="_bomToggleAssign(event)" title="Atur Site Engineer" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-user-pen"></i><span class="hidden sm:inline"> Atur Site Engineer</span></button>'
      + '<div id="bom-assign-panel" class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-slate-150 z-40 p-4"></div></div>';
  }
  if (_bomCanEdit()) btns += '<button onclick="_bomOpenItemModal()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-plus"></i><span class="hidden sm:inline"> Tambah Material</span></button>';
  actions.innerHTML = '<div class="flex items-center gap-2 flex-wrap justify-end">' + btns + '</div>';

  // Head — judul + status; badge Site Engineer di kanan; ringkasan review di bawah.
  var assignedHtml = (_bomAssigned || []).length
    ? _bomAssigned.map(function(a){ return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">' + _bomEsc(a.nama) + '</span>'; }).join('')
    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-400">Belum ditugaskan</span>';
  var katSet = {}, cA = 0, cP = 0, cR = 0;
  _bomItems.forEach(function(it){ katSet[it.kategori || 'Lainnya'] = true; if (it.status === 'Approved') cA++; else if (it.status === 'Rejected') cR++; else cP++; });
  var lockNote = (_bomWOStatus === 'Closed') ? '<span class="ml-1 text-[10px] font-bold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-0.5"></i>WO Closed</span>' : '';
  document.getElementById('bom-detail-head').innerHTML =
      '<div class="flex items-start justify-between gap-3">'
    + '<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700 text-lg">' + _bomEsc(_bomWO.noWO) + '</span>' + _bomStatusBadge(_bomStatus) + lockNote + '</div>'
    +   '<div class="font-bold text-slate-800">' + _bomEsc(_bomWO.namaProject || '-') + '</div>'
    +   '<div class="text-xs text-slate-400">' + _bomEsc(_bomWO.namaKlien || '') + '</div></div>'
    + '<div class="flex flex-col items-end gap-1.5 shrink-0 max-w-[55%]">'
    +   '<div class="flex flex-wrap justify-end gap-1">' + assignedHtml + '</div>'
    +   _bomCountHtml(_bomItems.length, Object.keys(katSet).length)
    + '</div>'
    + '</div>'
    + (_bomItems.length ? ('<div class="flex flex-wrap gap-4 mt-3 pt-3 border-t border-slate-100 text-[11px] font-bold">'
        + '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + cA + ' Approved</span>'
        + '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + cP + ' Pending</span>'
        + '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + cR + ' Rejected</span>'
        + '</div>') : '');

  _bomRenderBody();
}

function _bomStatusItemBadge(status) {
  if (status === 'Approved') return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check mr-0.5"></i>Approved</span>';
  if (status === 'Rejected') return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700"><i class="fa-solid fa-xmark mr-0.5"></i>Rejected</span>';
  return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-clock mr-0.5"></i>Pending</span>';
}

function _bomRenderBody() {
  var body = document.getElementById('bom-detail-body');
  _bomLoadPricelist(function(){});   // pra-muat katalog utk modal tambah/edit
  if (!_bomItems.length) {
    body.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-cubes-stacked text-2xl mb-2 block opacity-40"></i>Belum ada material.' + (_bomCanEdit() ? ' Klik "Tambah Material".' : '') + '</div>';
    return;
  }
  var canEdit = _bomCanEdit(), canReview = _bomCanReview(), showAksi = canEdit || canReview;
  var groups = {}, order = [];
  _bomItems.forEach(function(it) { var k = it.kategori || 'Lainnya'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
  body.innerHTML = order.map(function(kat) {
    var rows = groups[kat].map(function(it, i) {
      var cat = it.catatan ? '<div class="text-[10px] text-slate-400 italic mt-0.5">' + _bomEsc(it.catatan) + '</div>' : '';
      var rej = (it.status === 'Rejected' && it.catatanReview) ? '<div class="mt-1 text-[10px] bg-rose-50 border border-rose-200 text-rose-700 rounded px-2 py-1"><i class="fa-solid fa-circle-exclamation mr-1"></i><b>Revisi:</b> ' + _bomEsc(it.catatanReview) + '</div>' : '';
      var aksi = '';
      if (showAksi) {
        var acts = '';
        if (canReview) {
          if (it.status === 'Approved') acts += '<button onclick="_bomCancelApprove(\'' + _bomEsc(it.id) + '\')" class="text-amber-600 hover:bg-amber-50 p-1.5 rounded-md" title="Batalkan Approve"><i class="fa-solid fa-rotate-left text-xs"></i></button>';
          else acts += '<button onclick="_bomApprove(\'' + _bomEsc(it.id) + '\')" class="text-emerald-600 hover:bg-emerald-50 p-1.5 rounded-md" title="Approve"><i class="fa-solid fa-check text-sm"></i></button>'
            + '<button onclick="_bomOpenReject(\'' + _bomEsc(it.id) + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-md" title="Reject"><i class="fa-solid fa-xmark text-sm"></i></button>';
        }
        if (canEdit && it.status !== 'Approved') acts += '<button onclick="_bomOpenItemModal(\'' + _bomEsc(it.id) + '\')" class="text-indigo-500 hover:bg-indigo-50 p-1.5 rounded-md" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>'
          + '<button onclick="_bomHapusItem(\'' + _bomEsc(it.id) + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-md" title="Hapus"><i class="fa-regular fa-trash-can text-xs"></i></button>';
        aksi = '<td class="p-2 text-center col-aksi" data-label="Aksi"><div class="flex items-center justify-center gap-0.5">' + (acts || '<span class="text-slate-300 text-xs">—</span>') + '</div></td>';
      }
      return '<tr class="border-b border-slate-100 baris-kartu">'
        + '<td class="p-2 text-center text-xs font-bold text-slate-400 col-no">' + (i + 1) + '</td>'
        + '<td class="p-2 col-desk" data-label="Nama Material"><div class="text-sm font-semibold text-slate-700">' + _bomEsc(it.namaMaterial) + '</div>' + cat + rej + '</td>'
        + '<td class="p-2 col-merek" data-label="Merek"><span class="text-xs text-slate-600">' + (_bomEsc(it.merek) || '-') + '</span></td>'
        + '<td class="p-2 col-supplier" data-label="Supplier"><span class="text-xs text-slate-600">' + (_bomEsc(it.supplier) || '-') + '</span></td>'
        + '<td class="p-2 text-center col-satuan" data-label="Satuan"><span class="text-xs text-slate-500">' + (_bomEsc(it.satuan) || '-') + '</span></td>'
        + '<td class="p-2 text-center col-qty" data-label="Qty"><span class="text-sm font-extrabold text-indigo-700">' + _bomRp(it.qty) + '</span></td>'
        + '<td class="p-2 text-center col-status" data-label="Status">' + _bomStatusItemBadge(it.status) + '</td>'
        + aksi
        + '</tr>';
    }).join('');
    var addBtn = canEdit ? '<button onclick="_bomOpenItemModal(\'\',\'' + _bomEsc(kat).replace(/'/g, "\\'") + '\')" class="text-indigo-600 text-[11px] font-bold hover:bg-indigo-50 px-2 py-1 rounded whitespace-nowrap"><i class="fa-solid fa-plus mr-0.5"></i>Tambah Item</button>' : '';
    var aksiHead = showAksi ? '<th class="p-2 w-24 text-center">Aksi</th>' : '';
    return '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
      + '<div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex items-center justify-between gap-2"><span class="font-extrabold text-sm text-slate-700 truncate"><i class="fa-solid fa-layer-group text-slate-400 mr-1.5"></i>' + _bomEsc(kat) + '</span><span class="flex items-center gap-2 shrink-0"><span class="text-[10px] font-bold text-slate-400">' + groups[kat].length + ' item</span>' + addBtn + '</span></div>'
      + '<div class="overflow-x-auto tabel-item-wrap"><table class="w-full text-left border-collapse tabel-item-penawaran"><thead><tr class="bg-slate-100 border-b border-slate-200 text-[10px] font-bold text-slate-500 uppercase"><th class="p-2 w-10 text-center">No</th><th class="p-2">Nama Material</th><th class="p-2 w-28">Merek</th><th class="p-2 w-32">Supplier</th><th class="p-2 w-20 text-center">Satuan</th><th class="p-2 w-16 text-center">Qty</th><th class="p-2 w-24 text-center">Status</th>' + aksiHead + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '</div>';
  }).join('');
}

// ── Katalog pricelist (lazy) ────────────────────────────────────
function _bomLoadPricelist(cb) {
  if (_bomPricelist && _bomKategori) { cb(); return; }
  var need = 0, done = function() { if (--need <= 0) cb(); };
  if (!_bomPricelist) { need++; google.script.run.withSuccessHandler(function(res) { _bomPricelist = (res && res.success) ? (res.list || []) : []; done(); }).withFailureHandler(function() { _bomPricelist = []; done(); }).getPricelistAll(); }
  if (!_bomKategori) { need++; google.script.run.withSuccessHandler(function(res) { _bomKategori = (res && res.success) ? (res.list || []) : []; done(); }).withFailureHandler(function() { _bomKategori = []; done(); }).getKategoriList(); }
  if (need === 0) cb();
}

// ── Blok kategori + material (mirip sub-paket penawaran) ────────
// Opsi <option> untuk dropdown kategori blok (dari master kategori).
function _bomCatSelectOptions(selected) {
  var opts = '<option value="">-- Pilih kategori --</option>';
  var has = false;
  (_bomKategori || []).forEach(function(k) {
    var sel = (k === selected) ? ' selected' : '';
    if (k === selected) has = true;
    opts += '<option value="' + _bomEsc(k) + '"' + sel + '>' + _bomEsc(k) + '</option>';
  });
  if (selected && !has) opts += '<option value="' + _bomEsc(selected) + '" selected>' + _bomEsc(selected) + ' (lama)</option>';
  return opts;
}
// Opsi <option> material yang HANYA berisi kategori terpilih (+ Input Manual).
function _bomOptsForCat(kat) {
  var k = (kat || '').trim().toLowerCase();
  var list = k ? (_bomPricelist || []).filter(function(p){ return (p.kategori || '').trim().toLowerCase() === k; }) : [];
  list.sort(function(a, b){ return a.namaMaterial.localeCompare(b.namaMaterial, 'id'); });
  var opts = '<option value="">-- Pilih material --</option>';
  list.forEach(function(p){
    // Label = nama material saja (+ spesifikasi bila ada). Merek & supplier
    // sudah punya kolom sendiri, jadi tak diulang di sini.
    var lbl = p.namaMaterial + (p.spesifikasi ? ' (' + p.spesifikasi + ')' : '');
    opts += '<option value="' + _bomEsc(p.id) + '" data-nama="' + _bomEsc(p.namaMaterial) + '" data-merek="' + _bomEsc(p.merek) + '" data-supplier="' + _bomEsc(p.namaSupplier) + '" data-satuan="' + _bomEsc(p.satuan) + '">' + _bomEsc(lbl) + '</option>';
  });
  opts += '<option value="__manual__">— Input Manual —</option>';
  return opts;
}
// ── Tambah/Edit Material (modal) ────────────────────────────────
// id kosong = tambah baru; presetKat = kategori awal (dari tombol "Tambah Item" per kategori).
function _bomOpenItemModal(id, presetKat) {
  if (!_bomCanEdit()) return;
  _bomLoadPricelist(function() {
    var modal = document.getElementById('bom-modal-item');
    var item = id ? _bomItems.filter(function(x){ return x.id === id; })[0] : null;
    document.getElementById('bom-item-id').value = id || '';
    document.getElementById('bom-item-title').innerText = id ? 'Edit Material' : 'Tambah Material';
    // Kategori
    var katSel = document.getElementById('bom-item-kat');
    var kat = item ? (item.kategori || '') : (presetKat || '');
    katSel.innerHTML = _bomCatSelectOptions(kat);
    katSel.value = kat;
    // Material dropdown (filter kategori)
    _bomModalKatChange();
    var plSel = document.getElementById('bom-item-pl');
    if (item) {
      var plExists = item.pricelistId && plSel.querySelector('option[value="' + item.pricelistId + '"]');
      plSel.value = plExists ? item.pricelistId : '__manual__';
      _bomModalPick();
      document.getElementById('bom-item-merek').value = item.merek || '';
      document.getElementById('bom-item-supplier').value = item.supplier || '';
      document.getElementById('bom-item-satuan').value = item.satuan || '';
      if (!plExists) document.getElementById('bom-item-nama').value = item.namaMaterial || '';
      document.getElementById('bom-item-qty').value = (item.qty || item.qty === 0) ? item.qty : 1;
      document.getElementById('bom-item-catatan').value = item.catatan || '';
    } else {
      plSel.value = '';
      _bomModalPick();
      document.getElementById('bom-item-nama').value = '';
      document.getElementById('bom-item-merek').value = '';
      document.getElementById('bom-item-supplier').value = '';
      document.getElementById('bom-item-satuan').value = '';
      document.getElementById('bom-item-qty').value = 1;
      document.getElementById('bom-item-catatan').value = '';
    }
    modal.classList.remove('hidden');
  });
}
function _bomCloseItemModal() { document.getElementById('bom-modal-item').classList.add('hidden'); }

// Ganti kategori di modal → rebuild dropdown material (filter kategori baru).
function _bomModalKatChange() {
  var kat = document.getElementById('bom-item-kat').value.trim();
  var plSel = document.getElementById('bom-item-pl');
  var cur = plSel.value;
  plSel.innerHTML = _bomOptsForCat(kat);
  if (cur && (cur === '__manual__' || plSel.querySelector('option[value="' + cur + '"]'))) plSel.value = cur;
  else plSel.value = '';
  _bomModalPick();
}

// Pilih material → auto-isi merek/supplier/satuan (read-only bila dari pricelist).
function _bomModalPick() {
  var sel = document.getElementById('bom-item-pl');
  var opt = sel.options[sel.selectedIndex];
  var manual = document.getElementById('bom-item-manual-wrap');
  var mk = document.getElementById('bom-item-merek'), sp = document.getElementById('bom-item-supplier'), st = document.getElementById('bom-item-satuan');
  var ro = function(el, on) { el.readOnly = on; el.classList.toggle('bg-slate-100', on); el.classList.toggle('text-slate-500', on); };
  if (opt && opt.value === '__manual__') {
    manual.classList.remove('hidden');
    ro(mk, false); ro(sp, false); ro(st, false);
  } else if (opt && opt.value) {
    manual.classList.add('hidden');
    mk.value = opt.getAttribute('data-merek') || '';
    sp.value = opt.getAttribute('data-supplier') || '';
    st.value = opt.getAttribute('data-satuan') || '';
    ro(mk, true); ro(sp, true); ro(st, true);
  } else {
    manual.classList.add('hidden');
    mk.value = ''; sp.value = ''; st.value = '';
    ro(mk, true); ro(sp, true); ro(st, true);
  }
}

function _bomSubmitItem() {
  var id = document.getElementById('bom-item-id').value;
  var kat = document.getElementById('bom-item-kat').value.trim();
  var plSel = document.getElementById('bom-item-pl');
  var v = plSel.value;
  if (!kat) return showNotification('Pilih kategori dulu.', 'error');
  if (!v) return showNotification('Pilih material dulu.', 'error');
  var nama, pricelistId;
  if (v === '__manual__') { pricelistId = ''; nama = document.getElementById('bom-item-nama').value.trim(); }
  else { var opt = plSel.options[plSel.selectedIndex]; pricelistId = v; nama = opt.getAttribute('data-nama'); }
  if (!nama) return showNotification('Nama material wajib diisi.', 'error');
  var qty = parseFloat(document.getElementById('bom-item-qty').value) || 0;
  if (qty <= 0) return showNotification('Qty harus lebih dari 0.', 'error');
  var payload = {
    noWO: _bomWO.noWO, kategori: kat, pricelistId: pricelistId, namaMaterial: nama,
    merek: document.getElementById('bom-item-merek').value.trim(),
    supplier: document.getElementById('bom-item-supplier').value.trim(),
    satuan: document.getElementById('bom-item-satuan').value.trim(),
    qty: qty, catatan: document.getElementById('bom-item-catatan').value.trim(), oleh: _bomUserNama()
  };
  _bomCloseItemModal();
  toggleLoader(true, 'Menyimpan material...');
  var handler = function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Tersimpan.');
    _bomReloadDetail();
  };
  var fail = function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal menyimpan.', 'error'); };
  if (id) google.script.run.withSuccessHandler(handler).withFailureHandler(fail).updateBOMItem(id, payload);
  else google.script.run.withSuccessHandler(handler).withFailureHandler(fail).addBOMItem(payload);
}

function _bomHapusItem(id) {
  var item = _bomItems.filter(function(x){ return x.id === id; })[0];
  showConfirm({ title: 'Hapus Material', message: 'Hapus material "' + ((item && item.namaMaterial) || '') + '" dari BOM?', confirmText: 'Ya, Hapus', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Menghapus...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dihapus.');
      _bomReloadDetail();
    }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .hapusBOMItem(id);
  }});
}

// ── Review material (Lead Engineer) ─────────────────────────────
function _bomApprove(id) {
  toggleLoader(true, 'Menyetujui...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Disetujui.');
    _bomReloadDetail();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .reviewBOMItem(id, 'Approved', '', _bomUserNama());
}
function _bomCancelApprove(id) {
  showConfirm({ title: 'Batalkan Approve', message: 'Batalkan persetujuan material ini? Material kembali ke status Pending dan bisa diedit Site Engineer.', confirmText: 'Ya, Batalkan', icon: 'fa-rotate-left', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Membatalkan...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dibatalkan.');
      _bomReloadDetail();
    }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .cancelBOMApproval(id, _bomUserNama());

}
function _bomOpenReject(id) {
  document.getElementById('bom-reject-id').value = id;
  document.getElementById('bom-reject-catatan').value = '';
  var item = _bomItems.filter(function(x){ return x.id === id; })[0];
  document.getElementById('bom-reject-nama').innerText = (item && item.namaMaterial) || '';
  document.getElementById('bom-modal-reject').classList.remove('hidden');
}
function _bomCloseReject() { document.getElementById('bom-modal-reject').classList.add('hidden'); }
function _bomSubmitReject() {
  var id = document.getElementById('bom-reject-id').value;
  var catatan = document.getElementById('bom-reject-catatan').value.trim();
  if (!catatan) return showNotification('Catatan revisi wajib diisi.', 'error');
  _bomCloseReject();
  toggleLoader(true, 'Menyimpan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Ditolak.');
    _bomReloadDetail();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .reviewBOMItem(id, 'Rejected', catatan, _bomUserNama());
}

// ── Penugasan Site Engineer (panel dropdown) ────────────────────
function _bomToggleAssign(e) {
  if (e) e.stopPropagation();
  var panel = document.getElementById('bom-assign-panel');
  if (!panel) return;
  if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  if (!window._bomAssignDocBound) {
    window._bomAssignDocBound = true;
    document.addEventListener('click', function(ev) {
      var actions = document.getElementById('bom-detail-actions');
      var p = document.getElementById('bom-assign-panel');
      if (!p || p.classList.contains('hidden')) return;
      if (actions && actions.contains(ev.target)) return;
      p.classList.add('hidden');
    });
  }
  panel.innerHTML = '<div class="text-xs text-slate-400 py-1"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat...</div>';
  var render = function() {
    var assignedIds = (_bomAssigned || []).map(function(a){ return a.id; });
    var rows = (_bomSiteEngineers || []).map(function(u) {
      return '<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="checkbox" value="' + _bomEsc(u.id) + '" ' + (assignedIds.indexOf(u.id) !== -1 ? 'checked' : '') + ' class="bom-assign-cb w-4 h-4 accent-indigo-600"><span class="text-sm text-slate-700">' + _bomEsc(u.nama) + '</span></label>';
    }).join('') || '<div class="text-xs text-slate-400 py-2">Belum ada Site Engineer.</div>';
    panel.innerHTML = '<div class="text-[11px] font-bold text-slate-400 uppercase mb-2">Tugaskan Site Engineer</div><div class="max-h-56 overflow-y-auto">' + rows + '</div>'
      + '<button onclick="_bomSaveAssign()" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 rounded-lg">Simpan</button>';
  };
  if (_bomSiteEngineers) render();
  else google.script.run.withSuccessHandler(function(res){ _bomSiteEngineers = (res && res.success) ? (res.list || []) : []; render(); }).withFailureHandler(function(){ _bomSiteEngineers = []; render(); }).getSiteEngineerList();
}
function _bomSaveAssign() {
  var ids = Array.prototype.slice.call(document.querySelectorAll('.bom-assign-cb:checked')).map(function(cb){ return cb.value; });
  toggleLoader(true, 'Menyimpan penugasan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Tersimpan.');
    var p = document.getElementById('bom-assign-panel'); if (p) p.classList.add('hidden');
    _bomReloadDetail();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .setBOMAssignment(_bomWO.noWO, ids, _bomUserNama());
}

// ── Tambah Project ke BOM ───────────────────────────────────────
function _bomOpenAddProject() {
  document.getElementById('bom-modal-project').classList.remove('hidden');
  var woSel = document.getElementById('bom-proj-wo');
  woSel.innerHTML = '<option value="">Memuat WO...</option>';
  google.script.run.withSuccessHandler(function(res) {
    var list = (res && res.success) ? (res.list || []) : [];
    woSel.innerHTML = list.length ? (['<option value="">-- Pilih Work Order --</option>'].concat(list.map(function(w){ return '<option value="' + _bomEsc(w.noWO) + '">' + _bomEsc(w.noWO) + ' — ' + _bomEsc(w.namaProject || '-') + (w.namaKlien ? ' (' + _bomEsc(w.namaKlien) + ')' : '') + '</option>'; })).join('')) : '<option value="">Semua WO sudah ada di BOM</option>';
  }).withFailureHandler(function(){ woSel.innerHTML = '<option value="">Gagal memuat</option>'; }).getAvailableWOForBOM();

  var seWrap = document.getElementById('bom-proj-se');
  seWrap.innerHTML = 'Memuat...';
  var render = function() {
    seWrap.innerHTML = (_bomSiteEngineers || []).length
      ? _bomSiteEngineers.map(function(u){ return '<label class="flex items-center gap-2 py-1 cursor-pointer"><input type="checkbox" value="' + _bomEsc(u.id) + '" class="bom-proj-cb w-4 h-4 accent-indigo-600"><span class="text-sm text-slate-700">' + _bomEsc(u.nama) + '</span></label>'; }).join('')
      : '<div class="text-xs text-slate-400">Belum ada Site Engineer.</div>';
  };
  if (_bomSiteEngineers) render();
  else google.script.run.withSuccessHandler(function(res){ _bomSiteEngineers = (res && res.success) ? (res.list || []) : []; render(); }).withFailureHandler(function(){ _bomSiteEngineers = []; render(); }).getSiteEngineerList();
}
function _bomCloseAddProject(){ document.getElementById('bom-modal-project').classList.add('hidden'); }
function _bomSubmitAddProject() {
  var noWO = document.getElementById('bom-proj-wo').value;
  if (!noWO) return showNotification('Pilih Work Order dulu.', 'error');
  var ids = Array.prototype.slice.call(document.querySelectorAll('.bom-proj-cb:checked')).map(function(cb){ return cb.value; });
  _bomCloseAddProject();   // tutup modal dulu agar tak menutupi loading screen
  toggleLoader(true, 'Menambahkan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Ditambahkan.');
    loadBOM();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .addBOMProject(noWO, ids, _bomUserNama());
}

// ── Export PDF (dikelompokkan per kategori, tanpa harga) ─────────
function _bomExportPDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) return showNotification('Modul PDF belum siap. Muat ulang halaman.', 'error');
  try {
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var PW = 210, ML = 12, MR = 12;
    var DARK = [30, 41, 59], SLATE = [100, 116, 139], INDIGO = [67, 56, 202];
    doc.setFillColor(DARK[0], DARK[1], DARK[2]); doc.rect(0, 0, PW, 22, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text('BILL OF MATERIAL', ML, 11);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(190, 200, 220);
    doc.text('DOKUMEN INTERNAL — DAFTAR MATERIAL PROJECT', ML, 17);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(170, 195, 255);
    doc.text('NO. WORK ORDER', PW - MR, 9, { align: 'right' });
    doc.setFontSize(15); doc.setTextColor(255, 255, 255);
    doc.text(String(_bomWO.noWO), PW - MR, 16, { align: 'right' });

    var y = 30;
    doc.setFontSize(9); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
    doc.setFont('helvetica', 'bold'); doc.text('Project', ML, y); doc.setFont('helvetica', 'normal'); doc.text(': ' + (_bomWO.namaProject || '-'), ML + 20, y);
    doc.setFont('helvetica', 'bold'); doc.text('Klien', ML, y + 5); doc.setFont('helvetica', 'normal'); doc.text(': ' + (_bomWO.namaKlien || '-'), ML + 20, y + 5);
    doc.setFont('helvetica', 'bold'); doc.text('Status', ML, y + 10); doc.setFont('helvetica', 'normal'); doc.text(': ' + _bomStatus, ML + 20, y + 10);
    var engNames = (_bomAssigned || []).map(function(a){ return a.nama; }).filter(Boolean).join(', ') || '-';
    doc.setFont('helvetica', 'bold'); doc.text('Engineer', ML, y + 15); doc.setFont('helvetica', 'normal');
    var engLines = doc.splitTextToSize(': ' + engNames, PW - MR - (ML + 20));
    doc.text(engLines, ML + 20, y + 15);
    y += 21 + (engLines.length - 1) * 4.2;

    if (!_bomItems.length) { doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]); doc.text('Belum ada material.', ML, y); }
    else {
      var groups = {}, order = [];
      _bomItems.forEach(function(it){ var k = it.kategori || 'Lainnya'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
      order.forEach(function(kat) {
        var bodyRows = groups[kat].map(function(it, i){ return [String(i + 1), it.namaMaterial || '', it.merek || '-', it.supplier || '-', it.satuan || '-', _bomRp(it.qty)]; });
        doc.autoTable({
          startY: y,
          head: [[{ content: kat.toUpperCase() + '  (' + groups[kat].length + ' item)', colSpan: 6, styles: { halign: 'left', fillColor: [226, 232, 240], textColor: DARK, fontStyle: 'bold' } }],
                 ['No', 'Nama Material', 'Merek', 'Supplier', 'Satuan', 'Qty']],
          body: bodyRows, theme: 'grid',
          margin: { left: ML, right: MR },
          headStyles: { fillColor: INDIGO, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
          bodyStyles: { fontSize: 8, textColor: [40, 40, 40], lineColor: [210, 215, 225], lineWidth: 0.15, cellPadding: 1.6 },
          columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 30 }, 3: { cellWidth: 34 }, 4: { cellWidth: 18, halign: 'center' }, 5: { cellWidth: 18, halign: 'center', fontStyle: 'bold' } },
          styles: { overflow: 'linebreak' }
        });
        y = doc.lastAutoTable.finalY + 5;
      });
    }
    doc.setFontSize(7); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
    doc.text('Dokumen internal PT. Renus Global Indonesia — daftar material project.', ML, 290);
    var fname = 'BOM_' + String(_bomWO.noWO) + '_' + (_bomWO.namaProject || '').replace(/[\\/]/g, '-') + '.pdf';
    doc.save(fname);
    showNotification('PDF BOM diunduh: ' + fname);
  } catch (err) {
    showNotification('Gagal membuat PDF: ' + (err && err.message ? err.message : err), 'error');
  }
}
