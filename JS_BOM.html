<script>
// ================================================================
//  BILL OF MATERIAL (BOM) — daftar material per Work Order.
//  Item diambil dari pricelist supplier; dikelompokkan per kategori.
//  Lead assign Site Engineer; Lead bisa Finalkan (kunci). Tanpa harga.
// ================================================================

let _bomWOList = [];      // dashboard perWO
let _bomWO     = null;    // WO yang sedang dibuka {noWO, namaProject, namaKlien, status}
let _bomItems  = [];      // item material WO terbuka
let _bomStatus = 'Draft'; // Draft | Final
let _bomWOStatus = '';    // status WO (Closed?)
let _bomAssigned = [];    // [{id, nama}]
let _bomPricelist = null; // cache katalog pricelist
let _bomKategori = null;  // cache master kategori (untuk dropdown blok)
let _bomSupplierList = null; // cache master supplier (untuk dropdown supplier per item)
let _bomSiteEngineers = null;
let _bomPlInited = false;
let _bomBusyIds = {};     // id material yang sedang di-approve/reject/proses (loading inline)
let _bomFinalizedBy = ''; // pemfinalisasi (saat semua material Approved)
let _bomFinalizedAt = '';
let _bomKirimReq = '';    // status request pengiriman WO ('Diminta'/'Selesai'/'')
let _bomKirimReqMap = {}; // bomItemId → target (batas dikirim absolut) request aktif
let _bomStokList = null;   // cache getStokList untuk modal procurement
let _bomNeedList = null;   // cache daftar "Perlu Dibelanjakan"
let _bomHomeTab = 'proses';// tab home: 'proses' | 'approved' | 'need'

function _bomRole()     { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
// Dropdown supplier (pilih supplier mana material dibeli) hanya untuk
// procurement (+ admin). Role lain melihat supplier sebagai teks read-only.
function _bomSupplierEditable() { var r = _bomRole(); return r === 'procurement' || r === 'admin'; }
function _bomUserNama() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _bomUserId()   { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.id) ? _currentUser.id : ''; }
function _bomCanManage(){ var r = _bomRole(); return r === 'leadengineer' || r === 'admin'; }  // assign site engineer
function _bomCanRequestKirim(){ var r = _bomRole(); return r === 'projectcoordinator' || r === 'admin'; }  // request pengiriman
function _bomCanReview(){ var r = _bomRole(); return r === 'leadengineer' || r === 'admin'; }  // approve/reject material
function _bomCanReserve(){ var r = _bomRole(); return r === 'warehouse' || r === 'admin'; }  // reserve/alokasi dari stok (warehouse)
function _bomCanBelanja(){ var r = _bomRole(); return r === 'warehouse' || r === 'procurement' || r === 'admin'; }  // lihat tab Perlu Dibelanjakan (warehouse & procurement)
function _bomCanBuatPO(){ var r = _bomRole(); return r === 'procurement' || r === 'admin'; }  // tombol "Buat PO" pada item Tunggu Beli (procurement)
function _bomIsAssigned(){ var id = _bomUserId(); return (_bomAssigned || []).some(function(a){ return a.id === id; }); }
// Hanya Site Engineer yang di-assign (& Admin) yang bisa tambah/edit/hapus material.
function _bomCanEdit()  {
  if (_bomWOStatus === 'Closed') return false;
  var r = _bomRole();
  if (r === 'admin') return true;
  if (r === 'siteengineer') return _bomIsAssigned();
  return false;
}
function _bomEsc(s){ return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _bomRp(n){ return (Number(n)||0).toLocaleString('id-ID'); }

// ── HOME ────────────────────────────────────────────────────────
window.loadBOM = function(fromNav) {
  // Selalu ambil ulang katalog & kategori saat masuk menu BOM agar kategori/
  // material yang baru dibuat di menu Pricelist langsung muncul (tanpa reload).
  _bomPricelist = null;
  _bomKategori = null;
  _bomSupplierList = null;
  _bomNeedList = null;   // paksa muat ulang daftar belanja saat masuk menu
  document.getElementById('bom-home').classList.remove('hidden');
  document.getElementById('bom-detail').classList.add('hidden');
  var hint = document.getElementById('bom-role-hint');
  if (hint) hint.innerText = _bomCanManage() ? (_bomRole() === 'admin' ? 'Admin' : 'Lead Engineer') : (_bomRole() === 'siteengineer' ? 'Site Engineer' : (_bomRole() === 'warehouse' ? 'Warehouse' : (_bomRole() === 'procurement' ? 'Procurement' : 'Lihat')));
  var addBtn = document.getElementById('bom-add-project-btn');
  if (addBtn) addBtn.classList.toggle('hidden', !_bomCanManage());
  // Tab "Perlu Dibelanjakan" hanya untuk procurement / admin (bukan Lead Engineer).
  var needBtn = document.getElementById('bom-tabbtn-need');
  if (needBtn) needBtn.classList.toggle('hidden', !_bomCanBelanja());
  _bomShowHomeTab(_bomHomeTab === 'need' ? 'proses' : _bomHomeTab);

  var render = function(res) {
    _bomWOList = (res && res.success) ? (res.perWO || []) : [];
    _bomRenderCards((res && res.global) || {});
    _bomRenderWOList();
    _bomRefreshNeedBadge();
  };
  // Cache navigasi: pindah masuk menu instan; Muat Ulang / setelah aksi → fresh.
  var c = fromNav ? navCacheGet('bom') : null;
  if (c) { render(c); return; }
  document.getElementById('bom-wo-list').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  var arg = (_bomRole() === 'siteengineer') ? { siteUserId: _bomUserId() } : {};
  google.script.run.withSuccessHandler(function(res) {
    navCacheSet('bom', res);
    render(res);
  }).withFailureHandler(function() {
    document.getElementById('bom-wo-list').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat data BOM.</div>';
  }).getBOMDashboard(arg);
};

function _bomCard(label, val, cls) {
  return '<div class="bg-white rounded-2xl border border-slate-150 p-4">'
    + '<div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">' + label + '</div>'
    + '<div class="text-2xl font-extrabold ' + (cls || 'text-slate-800') + ' mt-1">' + val + '</div></div>';
}
function _bomRenderCards(g) {
  document.getElementById('bom-cards').innerHTML =
      _bomCard('Project (WO)', g.jumlahWO || 0, 'text-indigo-700')
    + _bomCard('Total Material', g.jumlahItem || 0, 'text-slate-800')
    + _bomCard('Draft', g.jumlahDraft || 0, 'text-amber-600')
    + _bomCard('Approved', g.jumlahFinal || 0, 'text-emerald-600');
}

function _bomStatusBadge(status) {
  return status === 'Final'
    ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-circle-check text-[9px] mr-0.5"></i>Approved</span>'
    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-pen text-[9px] mr-0.5"></i>Draft</span>';
}

// Indikator jumlah material & kategori (pakai icon) — dipakai di card list & detail.
function _bomCountHtml(nMat, nKat) {
  return '<div class="flex items-center justify-end gap-3 text-[11px] font-bold text-slate-500 whitespace-nowrap">'
    + '<span title="Jumlah material"><i class="fa-solid fa-cubes-stacked text-slate-400 mr-1"></i>' + (nMat || 0) + ' Material</span>'
    + '<span title="Jumlah kategori"><i class="fa-solid fa-layer-group text-slate-400 mr-1"></i>' + (nKat || 0) + ' Kategori</span>'
    + '</div>';
}

// Progres procurement per WO: berapa material Approved yang sudah diproses
// warehouse dari total Approved. Ditampilkan ke semua role agar semua bisa
// memantau BOM yang sedang diproses.
function _bomWOProcProgress(w) {
  var total = w.approved || 0;
  if (total <= 0) return '';
  var done = w.procDone || 0;
  var cls = (done >= total) ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-500';
  return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + cls + ' whitespace-nowrap" title="Material Approved yang diproses warehouse"><i class="fa-solid fa-clipboard-check text-[9px] mr-0.5"></i>WH ' + done + '/' + total + '</span>';
}

// WO masuk tab "Approved" HANYA bila semua item sudah Approved (status Final)
// DAN seluruhnya sudah diproses warehouse (procDone >= approved). Jika ada item
// Approved yang belum diproses warehouse, WO tetap di tab "Proses" agar warehouse
// tahu WO mana yang belum diproses.
function _bomWODone(w) {
  var appr = Number(w.approved) || 0;
  return w.status === 'Final' && appr > 0 && (Number(w.procDone) || 0) >= appr;
}

function _bomRenderWOList() {
  var q = (document.getElementById('bom-search').value || '').toLowerCase().trim();
  // Hitung jumlah per tab & set badge.
  var proses = _bomWOList.filter(function(w) { return !_bomWODone(w); }).length;
  var approved = _bomWOList.filter(function(w) { return _bomWODone(w); }).length;
  var cpEl = document.getElementById('bom-tabcount-proses'); if (cpEl) cpEl.textContent = proses;
  var caEl = document.getElementById('bom-tabcount-approved'); if (caEl) caEl.textContent = approved;
  var list = _bomWOList.filter(function(w) {
    var tabOk = (_bomHomeTab === 'approved') ? _bomWODone(w) : !_bomWODone(w);
    return tabOk && (!q || ((w.noWO + ' ' + (w.namaProject||'') + ' ' + (w.namaKlien||'')).toLowerCase().indexOf(q) !== -1));
  });
  var box = document.getElementById('bom-wo-list');
  if (!list.length) {
    var emptyMsg = q ? 'Tidak ada WO cocok.'
      : (_bomHomeTab === 'approved' ? 'Belum ada BOM yang selesai (Approved & sudah diproses warehouse).'
      : (_bomRole() === 'siteengineer' ? 'Belum ada Work Order yang ditugaskan ke Anda. Hubungi Lead Engineer.' : 'Belum ada project BOM sedang proses.'));
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-cubes-stacked mr-2"></i>' + emptyMsg + '</div>';
    return;
  }
  box.innerHTML = list.map(function(w) {
    var asg = w.assigned || [];
    var seBadges = asg.length
      ? asg.map(function(a) { return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">' + _bomEsc(a.nama) + '</span>'; }).join('')
      : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-400">Belum ditugaskan</span>';
    var removeBtn = _bomCanManage()
      ? '<button onclick="event.stopPropagation();_bomRemoveProject(\'' + _bomEsc(w.noWO) + '\')" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Keluarkan dari BOM"><i class="fa-regular fa-trash-can text-sm"></i></button>'
      : '';
    // Reminder WA agregat (Site: Ajukan Review · Lead: Kirim Hasil Review).
    var remindBtn = (_bomCanReview() || _bomRole() === 'siteengineer')
      ? '<button onclick="event.stopPropagation();_bomCardRemind(\'' + _bomEsc(w.noWO) + '\')" class="text-amber-500 hover:text-amber-700 hover:bg-amber-50 h-8 w-8 rounded-lg flex items-center justify-center transition shrink-0" title="Kirim notifikasi WhatsApp"><i class="fa-regular fa-bell text-sm"></i></button>'
      : '';
    return '<div onclick="bukaBOMDetail(\'' + _bomEsc(w.noWO) + '\')" class="w-full text-left bg-white rounded-2xl border border-slate-150 hover:border-indigo-300 hover:shadow-sm transition p-4 flex flex-col sm:flex-row sm:items-center gap-3 cursor-pointer">'
      + '<div class="flex-1 min-w-0">'
      +   '<div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700">' + _bomEsc(w.noWO) + '</span>' + _bomStatusBadge(w.status) + _bomWOProcProgress(w) + '</div>'
      +   '<div class="font-bold text-slate-800 truncate">' + _bomEsc(w.namaProject || '-') + '</div>'
      +   '<div class="text-[11px] text-slate-400 truncate">' + _bomEsc(w.namaKlien || '') + '</div>'
      + '</div>'
      + '<div class="flex items-center gap-3 w-full sm:w-auto">'
      +   '<div class="flex flex-row sm:flex-col items-center sm:items-end gap-2 sm:gap-1.5 flex-1 sm:flex-none w-full sm:w-auto">'
      +     '<div class="flex flex-wrap gap-1 flex-1 min-w-0 sm:flex-none sm:justify-end">' + seBadges + '</div>'
      +     _bomCountHtml(w.jumlahItem || 0, w.jumlahKategori || 0)
      +   '</div>'
      +   remindBtn + removeBtn
      +   '<i class="fa-solid fa-chevron-right text-slate-300"></i>'
      + '</div></div>';
  }).join('');
}

function _bomRemoveProject(noWO) {
  showConfirm({ title: 'Keluarkan dari BOM', message: 'Keluarkan WO ' + noWO + ' dari daftar BOM? Material tidak dihapus.', confirmText: 'Ya, Keluarkan', icon: 'fa-trash-can', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Memproses...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (res && res.success === false) { showNotification(res.message, 'error'); return; }
      showNotification(res && res.message ? res.message : 'Dikeluarkan.');
      loadBOM();
    }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .removeBOMProject(noWO);
  }});
}

// Reminder cepat dari kartu list BOM (tanpa membuka detail). Backend memvalidasi
// isi (pending/reviewed) & mengirim 1 notif agregat.
function _bomCardRemind(noWO) {
  var isLead = _bomCanReview();  // lead/admin → kirim hasil review; site → ajukan review
  var title = isLead ? 'Kirim Hasil Review' : 'Ajukan Review';
  var msg = isLead
    ? 'Kirim notifikasi hasil review BOM WO ' + noWO + ' ke Site Engineer?'
    : 'Ajukan BOM WO ' + noWO + ' ke Lead Engineer untuk direview?';
  showConfirm({ title: title, message: msg, confirmText: 'Ya, Kirim', icon: 'fa-paper-plane', onConfirm: function() {
    showNotification('Mengirim...', 'success');
    var run = google.script.run.withSuccessHandler(function(res){ showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error'); })
      .withFailureHandler(function(err){ showNotification((err && err.message) || 'Gagal mengirim.', 'error'); });
    if (isLead) run.kirimHasilReviewBOM(noWO, _bomUserNama());
    else run.ajukanReviewBOM(noWO, _bomUserNama());
  }});
}

// ── TAB: PERLU DIBELANJAKAN ─────────────────────────────────────
function _bomShowHomeTab(tab) {
  _bomHomeTab = tab;
  var isNeed = (tab === 'need');
  document.getElementById('bom-tab-projects').classList.toggle('hidden', isNeed);
  document.getElementById('bom-tab-need').classList.toggle('hidden', !isNeed);
  // Baris pencarian/tombol yang sesuai (di atas tab) ikut ditampilkan/disembunyikan.
  var pc = document.getElementById('bom-proj-controls');
  var nc = document.getElementById('bom-need-controls');
  if (pc) { pc.classList.toggle('hidden', isNeed); pc.classList.toggle('flex', !isNeed); }
  if (nc) { nc.classList.toggle('hidden', !isNeed); nc.classList.toggle('flex', isNeed); }
  var on  = 'whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-600 -mb-px transition';
  var off = 'whitespace-nowrap px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition';
  var bpr = document.getElementById('bom-tabbtn-proses');
  var bap = document.getElementById('bom-tabbtn-approved');
  var bn  = document.getElementById('bom-tabbtn-need');
  if (bpr) bpr.className = (tab === 'proses') ? on : off;
  if (bap) bap.className = (tab === 'approved') ? on : off;
  if (bn) bn.className = (isNeed ? on : off) + (_bomCanBelanja() ? '' : ' hidden');
  if (isNeed) _bomLoadNeedPurchase();   // selalu muat ulang agar status stok terkini
  else _bomRenderWOList();
}

function _bomLoadNeedPurchase() {
  var box = document.getElementById('bom-need-list');
  box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>';
  _bomStokList = null;   // paksa stok terbaru agar status "Siap reserve" akurat
  google.script.run.withSuccessHandler(function(res) {
    _bomNeedList = (res && res.success) ? (res.list || []) : [];
    // Muat stok agar bisa tampil status "Siap reserve / Menunggu stok".
    _bomLoadStok(function() { _bomRenderNeedPurchase(); });
  }).withFailureHandler(function() {
    _bomNeedList = [];
    box.innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat daftar belanja.</div>';
  }).getBOMNeedPurchase();
}

// Perbarui badge jumlah "Perlu Dibelanjakan" saat home load (tanpa merender
// daftar), agar angkanya akurat sebelum tab dibuka. Hanya untuk peran yg bisa
// melihat tab (warehouse/procurement/admin).
function _bomRefreshNeedBadge() {
  var cnEl = document.getElementById('bom-tabcount-need');
  if (!cnEl || !_bomCanBelanja()) return;
  google.script.run.withSuccessHandler(function(res) {
    var list = (res && res.success) ? (res.list || []) : [];
    _bomNeedList = list;
    cnEl.textContent = list.length;
  }).withFailureHandler(function() {}).getBOMNeedPurchase();
}

// Stok yang bisa dialokasikan (available = saldo − hold); null bila belum tertaut.
function _bomStokTersedia(idStok) {
  if (!idStok) return null;
  var s = (_bomStokList || []).filter(function(x) { return x.idStok === idStok; })[0];
  return s ? (Number(s.qtyAvailable) || 0) : 0;
}
// Badge kesiapan stok untuk item Perlu Dibelanjakan.
function _bomStokStatusBadge(it) {
  var av = _bomStokTersedia(it.idStok);
  // Hold material ini sendiri boleh dipakai untuk top-up reserve-nya.
  var tersedia = (av === null) ? null : (av + (Number(it.qtyReserved) || 0));
  var butuh = Number(it.qtyBeli) || 0;
  if (tersedia === null) return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 whitespace-nowrap"><i class="fa-regular fa-hand-pointer text-[9px] mr-0.5"></i>Pilih stok manual</span>';
  if (tersedia >= butuh) return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 whitespace-nowrap"><i class="fa-solid fa-circle-check text-[9px] mr-0.5"></i>Siap reserve (' + _bomRp(tersedia) + ')</span>';
  return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 whitespace-nowrap"><i class="fa-regular fa-clock text-[9px] mr-0.5"></i>Tunggu stok (' + _bomRp(tersedia) + '/' + _bomRp(butuh) + ')</span>';
}

function _bomRenderNeedPurchase() {
  var box = document.getElementById('bom-need-list');
  var cnEl = document.getElementById('bom-tabcount-need'); if (cnEl) cnEl.textContent = (_bomNeedList || []).length;
  var q = (document.getElementById('bom-need-search').value || '').toLowerCase().trim();
  var list = (_bomNeedList || []).filter(function(it) {
    return !q || ((it.namaMaterial + ' ' + it.merek + ' ' + it.noWO + ' ' + it.namaProject + ' ' + it.supplier).toLowerCase().indexOf(q) !== -1);
  });
  if (!list.length) {
    box.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-cart-shopping mr-2"></i>' + (q ? 'Tidak ada material cocok.' : 'Tidak ada material yang perlu dibelanjakan.') + '</div>';
    return;
  }
  // Kelompokkan per supplier
  var groups = {}, order = [];
  list.forEach(function(it) { var k = it.supplier || '(tanpa supplier)'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
  order.sort();
  box.innerHTML = order.map(function(sup) {
    var rows = groups[sup].map(function(it) {
      var isTunggu = (Number(it.qtyMenunggu) || 0) > 0;   // sudah ditandai beli langsung
      var qtyShow = isTunggu ? it.qtyMenunggu : it.qtyBeli;
      var linkedBadge = (!isTunggu && it.idStok) ? '<i class="fa-solid fa-link text-[9px] text-emerald-500 ml-1" title="Tertaut item stok ' + _bomEsc(it.idStok) + '"></i>' : '';
      // Kolom status stok: undecided → kesiapan stok; tunggu beli → badge ungu.
      var statusStok = isTunggu
        ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-100 text-violet-700 whitespace-nowrap"><i class="fa-regular fa-clock text-[9px] mr-0.5"></i>Tunggu Beli</span>'
        : _bomStokStatusBadge(it);
      var aksi;
      // Belum diputuskan: Reserve + Direct KHUSUS warehouse (hindari bentrok dua
      // peran pada item sama). Sudah "Tunggu Beli": warehouse bisa Batal,
      // procurement dapat tombol "Buat PO" (buka form PO langsung).
      if (!_bomCanBelanja()) aksi = '<span class="text-slate-300 text-xs">—</span>';
      else if (isTunggu) {
        var partsT = [];
        if (_bomCanReserve()) partsT.push('<button onclick="_bomBatalBeliLangsung(\'' + _bomEsc(it.id) + '\')" class="inline-flex items-center gap-1.5 bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm transition whitespace-nowrap" title="Batalkan tanda beli langsung"><i class="fa-solid fa-rotate-left"></i> Batal</button>');
        if (_bomCanBuatPO()) partsT.push('<button onclick="_bomBuatPODariBelanja(\'' + _bomEsc(it.id) + '\')" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm transition whitespace-nowrap" title="Buat Purchase Order untuk item ini"><i class="fa-solid fa-file-invoice"></i> Buat PO</button>');
        aksi = partsT.length ? '<div class="flex items-center justify-center gap-1.5">' + partsT.join('') + '</div>' : '<span class="text-slate-300 text-xs">—</span>';
      }
      else {
        aksi = _bomCanReserve()
          ? '<div class="flex items-center justify-center gap-1.5">'
            + '<button onclick="_bomReserveBeli(\'' + _bomEsc(it.id) + '\')" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm transition whitespace-nowrap" title="Stok diterima — reserve dari stok"><i class="fa-solid fa-warehouse"></i> Reserve</button>'
            + '<button onclick="_bomBeliLangsung(\'' + _bomEsc(it.id) + '\')" class="inline-flex items-center gap-1.5 bg-violet-600 hover:bg-violet-700 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg shadow-sm transition whitespace-nowrap" title="Beli & kirim langsung ke lokasi (tanpa gudang)"><i class="fa-solid fa-truck-fast"></i> Direct</button>'
            + '</div>'
          : '<span class="text-slate-300 text-xs">—</span>';
      }
      return '<tr class="border-t border-slate-100">'
        + '<td class="px-3 py-2 font-mono text-[11px] text-slate-500 whitespace-nowrap">' + _bomEsc(it.noWO) + '</td>'
        + '<td class="px-3 py-2"><div class="font-bold text-slate-700">' + _bomEsc(it.namaMaterial) + linkedBadge + '</div><div class="text-[11px] text-slate-400">' + _bomEsc(it.kategori) + (it.namaProject ? ' · ' + _bomEsc(it.namaProject) : '') + '</div></td>'
        + '<td class="px-3 py-2 text-slate-600">' + _bomEsc(it.merek || '-') + '</td>'
        + '<td class="px-3 py-2 text-center font-bold text-amber-700 whitespace-nowrap">' + _bomRp(qtyShow) + ' ' + _bomEsc(it.satuan || '') + '</td>'
        + '<td class="px-3 py-2 text-center">' + statusStok + '</td>'
        + '<td class="px-3 py-2 text-center" id="bom-beliact-' + _bomEsc(it.id) + '">' + aksi + '</td>'
        + '</tr>';
    }).join('');
    return '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
      + '<div class="flex items-center gap-2 px-4 py-3 bg-slate-50 border-b border-slate-150">'
      +   '<span class="bg-amber-100 text-amber-600 h-7 w-7 rounded-lg flex items-center justify-center shrink-0"><i class="fa-solid fa-truck-field text-xs"></i></span>'
      +   '<span class="font-extrabold text-slate-700">' + _bomEsc(sup) + '</span>'
      +   '<span class="text-[11px] font-bold text-slate-400">' + groups[sup].length + ' item</span>'
      + '</div>'
      + '<div class="overflow-x-auto"><table class="w-full text-sm">'
      +   '<thead><tr class="text-[11px] uppercase tracking-wider text-slate-400"><th class="px-3 py-2 text-left font-bold">No WO</th><th class="px-3 py-2 text-left font-bold">Material</th><th class="px-3 py-2 text-left font-bold">Merek</th><th class="px-3 py-2 text-center font-bold">Qty Beli</th><th class="px-3 py-2 text-center font-bold">Status Stok</th><th class="px-3 py-2 text-center font-bold">Aksi</th></tr></thead>'
      +   '<tbody>' + rows + '</tbody>'
      + '</table></div></div>';
  }).join('');
}

// ── Reserve dari stok untuk item Perlu Dibelanjakan (stok sudah diterima) ──
// Hybrid: 1 klik bila material sudah tertaut item stok & stok cukup; selain itu buka modal pilih stok.
function _bomBeliSetBusy(id) {
  var el = document.getElementById('bom-beliact-' + id);
  if (el) el.innerHTML = '<i class="fas fa-spinner fa-spin text-slate-400"></i>';
}
function _bomReserveBeli(id) {
  if (_bomBusyIds[id]) return;               // cegah klik ganda saat memuat
  var it = (_bomNeedList || []).filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  var cell = document.getElementById('bom-beliact-' + id);
  var saved = cell ? cell.innerHTML : null;  // simpan tombol untuk dipulihkan
  _bomBusyIds[id] = true;
  _bomBeliSetBusy(id);                        // ganti tombol dengan spinner
  _bomLoadStok(function() {
    delete _bomBusyIds[id];
    if (cell && saved != null) cell.innerHTML = saved;
    var stok = (_bomStokList || []).filter(function(s) { return s.idStok === it.idStok; })[0];
    // Available + hold material ini sendiri (top-up boleh pakai hold-nya).
    var tersedia = (stok ? (Number(stok.qtyAvailable) || 0) : 0) + (Number(it.qtyReserved) || 0);
    if (it.idStok && (Number(it.qtyBeli) || 0) > 0 && tersedia >= (Number(it.qtyBeli) || 0)) {
      // 1 klik: material tertaut stok & stok cukup untuk sisa beli → alokasikan penuh.
      showConfirm({ title: 'Reserve dari Stok', message: 'Alokasikan sisa ' + _bomRp(it.qtyBeli) + ' ' + (it.satuan || '') + ' "' + it.namaMaterial + '" dari stok ' + it.idStok + '? Material jadi Reserved penuh (stok keluar saat dikirim).', confirmText: 'Ya, Reserve', icon: 'fa-warehouse', onConfirm: function() {
        _bomDoReserveBeli(id, it.idStok, (Number(it.qtyReserved) || 0) + (Number(it.qtyBeli) || 0));
      } });
    } else {
      _bomOpenBeliModal(id);
    }
  });
}
function _bomDoReserveBeli(id, idStok, qtyReservedNew) {
  _bomBeliSetBusy(id);
  google.script.run.withSuccessHandler(function(res) {
    if (res && res.success === false) { showNotification(res.message, 'error'); _bomLoadNeedPurchase(); return; }
    showNotification((res && res.message) || 'Ter-reserve dari stok.');
    _bomLoadNeedPurchase();
  }).withFailureHandler(function(err) { showNotification((err && err.message) || 'Gagal.', 'error'); _bomLoadNeedPurchase(); })
    .prosesBOMProcurement(id, { idStok: idStok, qtyReserved: qtyReservedNew, oleh: _bomUserNama() });
}
function _bomOpenBeliModal(id) {
  var it = (_bomNeedList || []).filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  _bomLoadStok(function() {
    document.getElementById('bom-beli-id').value = id;
    document.getElementById('bom-beli-nama').innerText = it.namaMaterial;
    document.getElementById('bom-beli-info').innerText = it.noWO + (it.namaProject ? ' · ' + it.namaProject : '') + ' · Sisa beli ' + _bomRp(it.qtyBeli) + ' ' + (it.satuan || '');
    var sel = document.getElementById('bom-beli-stok');
    var opts = '<option value="">— Pilih item stok —</option>';
    (_bomStokList || []).forEach(function(s) {
      opts += '<option value="' + _bomEsc(s.idStok) + '" data-tersedia="' + (s.qtyAvailable || 0) + '">' + _bomEsc(s.idStok) + ' — ' + _bomEsc(s.namaProduk) + ' (tersedia ' + _bomRp(s.qtyAvailable || 0) + ' ' + _bomEsc(s.satuan || '') + ')</option>';
    });
    sel.innerHTML = opts;
    if (it.idStok) sel.value = it.idStok;
    var qtyEl = document.getElementById('bom-beli-qty');
    var tersedia = sel.value ? (Number(sel.options[sel.selectedIndex].getAttribute('data-tersedia')) || 0) : 0;
    qtyEl.value = Math.min(Number(it.qtyBeli) || 0, tersedia);
    qtyEl.disabled = !sel.value;
    document.getElementById('bom-modal-beli').classList.remove('hidden');
    _bomBeliRecalc();
  });
}
function _bomCloseBeli() { document.getElementById('bom-modal-beli').classList.add('hidden'); }
function _bomBeliStokChange() {
  var sel = document.getElementById('bom-beli-stok');
  var it = (_bomNeedList || []).filter(function(x) { return x.id === document.getElementById('bom-beli-id').value; })[0] || { qtyBeli: 0 };
  var qtyEl = document.getElementById('bom-beli-qty');
  if (sel.value) {
    var tersedia = (Number(sel.options[sel.selectedIndex].getAttribute('data-tersedia')) || 0) + ((sel.value === it.idStok) ? (Number(it.qtyReserved) || 0) : 0);
    qtyEl.disabled = false;
    qtyEl.value = Math.min(Number(it.qtyBeli) || 0, tersedia);
  } else { qtyEl.disabled = true; qtyEl.value = 0; }
  _bomBeliRecalc();
}
function _bomBeliRecalc() {
  var sel = document.getElementById('bom-beli-stok');
  var it = (_bomNeedList || []).filter(function(x) { return x.id === document.getElementById('bom-beli-id').value; })[0] || { qtyBeli: 0 };
  var sisa = Number(it.qtyBeli) || 0;
  var qtyEl = document.getElementById('bom-beli-qty');
  var tersedia = sel.value ? ((Number(sel.options[sel.selectedIndex].getAttribute('data-tersedia')) || 0) + ((sel.value === it.idStok) ? (Number(it.qtyReserved) || 0) : 0)) : 0;
  var qty = Number(qtyEl.value) || 0;
  var maxAmbil = sel.value ? Math.min(sisa, tersedia) : 0;
  if (qty > maxAmbil) { qty = maxAmbil; qtyEl.value = maxAmbil; }
  if (qty < 0) { qty = 0; qtyEl.value = 0; }
  var sisaBeli = Math.max(0, sisa - qty);
  document.getElementById('bom-beli-summary').innerHTML = 'Reserve dari stok: <b class="text-emerald-700">' + _bomRp(qty) + '</b> · Sisa masih perlu dibeli: <b class="text-amber-700">' + _bomRp(sisaBeli) + '</b>';
}
function _bomSubmitBeli() {
  var id = document.getElementById('bom-beli-id').value;
  var it = (_bomNeedList || []).filter(function(x) { return x.id === id; })[0];
  if (!it) { _bomCloseBeli(); return; }
  var idStok = document.getElementById('bom-beli-stok').value || '';
  var ambil = Number(document.getElementById('bom-beli-qty').value) || 0;
  if (!idStok || ambil <= 0) return showNotification('Pilih item stok dan qty lebih dari 0.', 'error');
  _bomCloseBeli();
  _bomDoReserveBeli(id, idStok, (Number(it.qtyReserved) || 0) + ambil);
}

// Tandai item "perlu dibeli" menjadi "beli langsung" (menunggu penerimaan PO).
function _bomBeliLangsung(id) {
  if (_bomBusyIds[id]) return;
  _bomBusyIds[id] = true; _bomBeliSetBusy(id);
  google.script.run.withSuccessHandler(function(res) {
    delete _bomBusyIds[id];
    if (res && res.success === false) { showNotification(res.message, 'error'); _bomLoadNeedPurchase(); return; }
    showNotification((res && res.message) || 'Ditandai beli langsung.');
    _bomLoadNeedPurchase();
  }).withFailureHandler(function(err) { delete _bomBusyIds[id]; showNotification((err && err.message) || 'Gagal.', 'error'); _bomLoadNeedPurchase(); })
    .tandaiBeliLangsung(id, _bomUserNama());
}
// Batalkan tanda beli langsung (belum diterima) → kembali "perlu dibeli".
function _bomBatalBeliLangsung(id) {
  if (_bomBusyIds[id]) return;
  _bomBusyIds[id] = true; _bomBeliSetBusy(id);
  google.script.run.withSuccessHandler(function(res) {
    delete _bomBusyIds[id];
    if (res && res.success === false) { showNotification(res.message, 'error'); _bomLoadNeedPurchase(); return; }
    showNotification((res && res.message) || 'Dibatalkan.');
    _bomLoadNeedPurchase();
  }).withFailureHandler(function(err) { delete _bomBusyIds[id]; showNotification((err && err.message) || 'Gagal.', 'error'); _bomLoadNeedPurchase(); })
    .batalTandaiBeliLangsung(id, _bomUserNama());
}

// Procurement: buka form PO ter-prefill untuk item "Tunggu Beli" (beli langsung).
// Navigasi ke menu Purchase Order lalu buka form baru dengan supplier + item + WO.
function _bomBuatPODariBelanja(id) {
  var it = (_bomNeedList || []).filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  if (typeof navigate !== 'function' || typeof bukaFormPOPrefill !== 'function') {
    return showNotification('Form Purchase Order tidak tersedia.', 'error');
  }
  var prefill = {
    idSupplier: it.idSupplier || '',
    peruntukan: it.namaProject ? ('Beli Langsung — ' + it.namaProject) : ('Beli Langsung — WO ' + (it.noWO || '')),
    noWO: it.noWO || '',
    items: [{
      // produkId = pricelistId agar cocok dgn pemenuhan BOM saat terima langsung
      // (match: bom_item.pricelist_id === po_item.id_produk).
      produkId: it.pricelistId || '', namaItem: it.namaMaterial || '',
      qty: Number(it.qtyMenunggu) || 0, satuan: it.satuan || '',
      hargaBeli: Number(it.hargaBeli) || 0, catatan: 'Beli langsung BOM ' + it.id
    }]
  };
  navigate('purchaseorder');
  bukaFormPOPrefill(prefill);
}

// ── Request Pengiriman (Project Coordinator) — pilih material (parsial) ────────
function _bomRequestKirim() {
  if (!_bomWO) return;
  var tambahMode = (_bomKirimReq === 'Diminta');
  // Tampilkan material Approved yang masih punya reserved BELUM diminta kirim.
  var reserved = (_bomItems || []).filter(function(it) {
    return it.status === 'Approved' && _bomAddable(it) > 0;
  });
  if (!reserved.length) return showNotification(tambahMode ? 'Tidak ada material untuk ditambahkan.' : 'Belum ada material Reserved untuk dikirim.', 'error');
  var titleEl = document.getElementById('bom-kirim-title');
  if (titleEl) titleEl.innerText = tambahMode ? 'Tambah Material Kirim' : 'Request Pengiriman';
  var box = document.getElementById('bom-kirim-list');
  box.innerHTML = reserved.map(function(it) {
    var sisa = _bomAddable(it);   // maksimum qty yang bisa diminta kirim sekarang
    return '<div class="flex items-center gap-3 border border-slate-150 rounded-xl px-3 py-2.5">'
      + '<input type="checkbox" checked class="bom-kirim-cb w-4 h-4 accent-indigo-600 shrink-0" data-sisa="' + sisa + '" onchange="_bomKirimToggleRow(this)">'
      + '<div class="min-w-0 flex-1"><div class="text-sm font-bold text-slate-700 truncate">' + _bomEsc(it.namaMaterial) + '</div>'
      +   '<div class="text-[11px] text-slate-400 truncate">' + _bomEsc(it.merek || '-') + ' · Sisa reserve ' + _bomRp(sisa) + ' ' + _bomEsc(it.satuan || '') + '</div></div>'
      + '<input type="number" min="1" max="' + sisa + '" value="' + sisa + '" class="bom-kirim-qty w-20 px-2 py-1.5 text-sm text-center border border-slate-200 rounded-lg shrink-0" data-id="' + _bomEsc(it.id) + '">'
      + '</div>';
  }).join('');
  document.getElementById('bom-modal-kirim').classList.remove('hidden');
}
function _bomKirimToggleRow(cb) {
  var q = cb.parentElement.querySelector('.bom-kirim-qty');
  if (q) { q.disabled = !cb.checked; q.classList.toggle('opacity-40', !cb.checked); }
}
function _bomKirimSelectAll(on) {
  Array.prototype.forEach.call(document.querySelectorAll('#bom-kirim-list .bom-kirim-cb'), function(cb) {
    cb.checked = !!on; _bomKirimToggleRow(cb);
  });
}
function _bomCloseKirim() { document.getElementById('bom-modal-kirim').classList.add('hidden'); }
function _bomSubmitKirimRequest() {
  var items = [];
  Array.prototype.forEach.call(document.querySelectorAll('#bom-kirim-list .bom-kirim-cb'), function(cb) {
    if (!cb.checked) return;
    var sisa = Number(cb.getAttribute('data-sisa')) || 0;
    var qEl = cb.parentElement.querySelector('.bom-kirim-qty');
    var id = qEl ? qEl.getAttribute('data-id') : '';
    var qty = qEl ? (Number(qEl.value) || 0) : sisa;
    if (qty <= 0) qty = sisa;
    if (qty > sisa) qty = sisa;
    if (id) items.push({ bomItemId: id, qty: qty });
  });
  if (!items.length) return showNotification('Pilih minimal 1 material.', 'error');
  _bomCloseKirim();
  toggleLoader(true, 'Mengirim request...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
    _bomReloadDetail();
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .requestPengiriman(_bomWO.noWO, _bomUserNama(), items);
}
function _bomBatalRequestKirim() {
  if (!_bomWO) return;
  showConfirm({ title: 'Batalkan Request Pengiriman', message: 'Batalkan request pengiriman WO ' + _bomWO.noWO + '?', confirmText: 'Ya, Batalkan', icon: 'fa-rotate-left', type: 'warning', onConfirm: function() {
    toggleLoader(true, 'Membatalkan...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      showNotification((res && res.message) || 'Selesai.', (res && res.success) ? 'success' : 'error');
      _bomReloadDetail();
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .batalRequestPengiriman(_bomWO.noWO, _bomUserNama());
  } });
}

// ── DETAIL ──────────────────────────────────────────────────────
function bukaBOMDetail(noWO) {
  _bomWO = _bomWOList.filter(function(w){ return w.noWO === noWO; })[0] || { noWO: noWO, namaProject: '', namaKlien: '', status: 'Draft' };
  document.getElementById('bom-home').classList.add('hidden');
  document.getElementById('bom-detail').classList.remove('hidden');
  document.getElementById('bom-detail-body').innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat material...</div>';
  document.getElementById('bom-detail-actions').innerHTML = '';
  _bomReloadDetail();
}

function kembaliBOMHome() {
  document.getElementById('bom-detail').classList.add('hidden');
  document.getElementById('bom-home').classList.remove('hidden');
  loadBOM();
}

function _bomReloadDetail() {
  if (!_bomWO) return;
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.success) { document.getElementById('bom-detail-body').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>'; return; }
    _bomItems = res.items || [];
    _bomStatus = res.status || 'Draft';
    _bomWOStatus = res.woStatus || '';
    _bomAssigned = res.assigned || [];
    _bomFinalizedBy = res.finalizedBy || '';
    _bomFinalizedAt = res.finalizedAt || '';
    _bomKirimReq = res.kirimRequest || '';
    _bomKirimReqMap = res.kirimReqMap || {};
    if (_bomWO) _bomWO.status = _bomStatus;
    _bomRenderDetail();
  }).withFailureHandler(function() {
    document.getElementById('bom-detail-body').innerHTML = '<div class="p-6 text-center text-rose-400">Gagal memuat.</div>';
  }).getBOMByWO(_bomWO.noWO);
}

function _bomRenderDetail() {
  // Actions bar — urutan: Export PDF · Atur Site Engineer · Finalkan
  var actions = document.getElementById('bom-detail-actions');
  var btns = '';
  btns += '<button onclick="_engMuatUlang(\'_bomReloadDetail\', this)" title="Muat ulang" class="inline-flex items-center justify-center bg-white hover:bg-slate-50 text-slate-500 border border-slate-200 h-[42px] w-[42px] rounded-xl shadow-sm transition shrink-0"><i class="fa-solid fa-rotate-right"></i></button>';
  btns += '<button onclick="openWOContext(_bomWO.noWO)" title="Info Work Order: item jasa/material, budget, catatan customer, site survey, MoM Hand Over" class="inline-flex items-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-100 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-circle-info"></i><span class="hidden sm:inline"> Info WO</span></button>';
  // Reminder WA agregat (Ajukan Review / Kirim Hasil Review) — slot sama seperti QC.
  var _bomPend = (_bomItems || []).filter(function(it){ return it.status !== 'Approved' && it.status !== 'Rejected'; }).length;
  var _bomRev  = (_bomItems || []).filter(function(it){ return it.status === 'Approved' || it.status === 'Rejected'; }).length;
  var _bomIsSite = (_bomRole() === 'siteengineer' && _bomIsAssigned()) || _bomRole() === 'admin';
  if (_bomIsSite && _bomPend > 0 && _bomWOStatus !== 'Closed') btns += '<button onclick="_bomAjukanReview()" title="Ajukan BOM ke Lead untuk direview" class="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-paper-plane"></i><span class="hidden sm:inline"> Ajukan Review</span></button>';
  if (_bomCanReview() && _bomRev > 0) btns += '<button onclick="_bomKirimHasilReview()" title="Kirim hasil review ke Site Engineer" class="inline-flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-paper-plane"></i><span class="hidden sm:inline"> Kirim Hasil Review</span></button>';
  btns += '<button onclick="_bomExportPDF()" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-file-pdf text-rose-500"></i><span class="hidden sm:inline"> Export PDF</span></button>';
  if (_bomCanManage()) {
    btns += '<div class="relative"><button onclick="_bomToggleAssign(event)" title="Atur Site Engineer" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 sm:px-4 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-user-pen"></i><span class="hidden sm:inline"> Atur Site Engineer</span></button>'
      + '<div id="bom-assign-panel" class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-slate-150 z-40 p-4"></div></div>';
  }
  // Request Pengiriman (Project Coordinator/Admin) — PARSIAL: pilih material Reserved.
  // Selama request masih aktif ('Diminta'), material baru bisa ditambah (digabung).
  if (_bomCanRequestKirim()) {
    var adaApproved = false, anyDikirim = false, adaKirim = false;
    _bomItems.forEach(function(it) {
      if (it.status !== 'Approved') return;
      adaApproved = true;
      if (_bomAddable(it) > 0) adaKirim = true;   // masih ada reserved yang belum diminta kirim
      if ((it.qtyDikirim || 0) > 0) anyDikirim = true;
    });
    if (_bomKirimReq === 'Diminta') {
      if (adaKirim) btns += '<button onclick="_bomRequestKirim()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-md transition whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Material Kirim</button>';
      if (!anyDikirim) btns += '<button onclick="_bomBatalRequestKirim()" class="inline-flex items-center gap-2 bg-white hover:bg-amber-50 text-amber-700 border border-amber-200 text-sm font-bold px-3 sm:px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-rotate-left"></i><span class="hidden sm:inline"> Batalkan Req. Kirim</span></button>';

  actions.innerHTML = '<div class="flex items-center gap-2 flex-wrap justify-end">' + btns + '</div>';

  // Head — judul + status; badge Site Engineer di kanan; ringkasan review di bawah.
  var assignedHtml = (_bomAssigned || []).length
    ? _bomAssigned.map(function(a){ return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600">' + _bomEsc(a.nama) + '</span>'; }).join('')
    : '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-400">Belum ditugaskan</span>';
  var katSet = {}, cA = 0, cP = 0, cR = 0;
  _bomItems.forEach(function(it){
    katSet[it.kategori || 'Lainnya'] = true;
    if (it.status === 'Approved') cA++;
    else if (it.status === 'Rejected') cR++; else cP++;
  });
  var lockNote = (_bomWOStatus === 'Closed') ? '<span class="ml-1 text-[10px] font-bold text-rose-600"><i class="fa-solid fa-triangle-exclamation mr-0.5"></i>WO Closed</span>' : '';
  document.getElementById('bom-detail-head').innerHTML =
      '<div class="flex items-start justify-between gap-3">'
    + '<div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-mono font-extrabold text-slate-700 text-lg">' + _bomEsc(_bomWO.noWO) + '</span>' + _bomStatusBadge(_bomStatus) + lockNote + '</div>'
    +   '<div class="font-bold text-slate-800">' + _bomEsc(_bomWO.namaProject || '-') + '</div>'
    +   '<div class="text-xs text-slate-400">' + _bomEsc(_bomWO.namaKlien || '') + '</div></div>'
    + '<div class="flex flex-col items-end gap-1.5 shrink-0 max-w-[55%]">'
    +   '<div class="flex flex-wrap justify-end gap-1">' + assignedHtml + '</div>'
    +   _bomCountHtml(_bomItems.length, Object.keys(katSet).length)
    + '</div>'
    + '</div>'
    + (_bomItems.length ? ('<div class="flex flex-wrap gap-4 mt-3 pt-3 border-t border-slate-100 text-[11px] font-bold">'
        + '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> ' + cA + ' Approved</span>'
        + '<span class="text-amber-600"><i class="fa-solid fa-clock"></i> ' + cP + ' Pending</span>'
        + '<span class="text-rose-600"><i class="fa-solid fa-circle-xmark"></i> ' + cR + ' Rejected</span>'
        + '</div>') : '')
    + ((_bomStatus === 'Final' && _bomFinalizedBy) ? ('<div class="mt-2 text-[11px] text-emerald-700 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i>Disetujui final oleh <b>' + _bomEsc(_bomFinalizedBy) + '</b>' + (_bomFinalizedAt ? ' · ' + _bomEsc(_bomFinalizedAt) : '') + '</div>') : '');

  _bomRenderBody();
}

function _bomStatusItemBadge(status) {
  if (status === 'Approved') return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check mr-0.5"></i>Approved</span>';
  if (status === 'Rejected') return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700"><i class="fa-solid fa-xmark mr-0.5"></i>Rejected</span>';

// Site Engineer/Admin (canEdit) → tabel editable inline (input/edit/hapus).
// Lead Engineer → tampilan read-only + approve/reject.

// Muat daftar supplier saja (untuk dropdown supplier di tampilan review).
function _bomLoadSupplierList(cb) {

    .withFailureHandler(function() { _bomSupplierList = []; cb(); }).getSupplierList();

// Sisa reserved material yang BELUM di-request kirim (bisa ditambah ke request).
function _bomAddable(it) {
  var sisaReserved = (Number(it.qtyReserved) || 0) - (Number(it.qtyDikirim) || 0);
  if (sisaReserved <= 0) return 0;
  var dik = Number(it.qtyDikirim) || 0;
  var target = Number(_bomKirimReqMap[it.id]) || 0;
  var reqRem = target > dik ? Math.min(target - dik, sisaReserved) : 0;
  return sisaReserved - reqRem;
}

// ── Tampilan read-only + approve/reject (Lead Engineer) ─────────
// Badge status procurement per material — komposisi dari 4 bucket qty.
// Sub-badge Reserved dipecah: Diterima / Dikirim / Req. Kirim (yang diminta) /
// Reserved (masih dialokasi, belum diminta kirim).
function _bomReservedBadge(it) {
  var r = Number(it.qtyReserved) || 0;
  var dik = Number(it.qtyDikirim) || 0;
  var dit = Number(it.qtyDiterima) || 0;
  var parts = [];
  if (dit > 0) parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-600 text-white whitespace-nowrap">Diterima (' + _bomRp(dit) + ')</span>');
  var dikirimBelum = dik - dit;
  if (dikirimBelum > 0) parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 whitespace-nowrap">Dikirim (' + _bomRp(dikirimBelum) + ')</span>');
  var sisaReserved = r - dik;
  if (sisaReserved > 0) {
    var target = Number(_bomKirimReqMap[it.id]) || 0;
    var reqRem = target > dik ? Math.min(target - dik, sisaReserved) : 0;
    if (reqRem > 0) parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 whitespace-nowrap">Req. Kirim (' + _bomRp(reqRem) + ')</span>');
    var notReq = sisaReserved - reqRem;
    if (notReq > 0) parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 whitespace-nowrap">Reserved (' + _bomRp(notReq) + ')</span>');
  }
  return parts.join(' ');
}
function _bomProcBadge(it) {
  var parts = [];
  if ((it.qtyReserved || 0) > 0)     parts.push(_bomReservedBadge(it));
  if ((it.qtyBeli || 0) > 0)         parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 whitespace-nowrap">Beli (' + _bomRp(it.qtyBeli) + ')</span>');
  if ((it.qtyMenungguBL || 0) > 0)   parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 whitespace-nowrap">Tunggu Beli (' + _bomRp(it.qtyMenungguBL) + ')</span>');
  if ((it.qtyBeliLangsung || 0) > 0) parts.push('<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-violet-600 text-white whitespace-nowrap">Direct (' + _bomRp(it.qtyBeliLangsung) + ')</span>');
  if (!parts.length) {
    if (it.status === 'Approved') return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-600 whitespace-nowrap"><i class="fa-regular fa-clock text-[9px] mr-0.5"></i>Perlu diproses</span>';
    return '<span class="text-[10px] text-slate-300">—</span>';
  }
  if (parts.length === 1) return parts[0];
  return '<div class="flex flex-col gap-0.5 items-center">' + parts.join('') + '</div>';
}

// Sel supplier di tampilan review. Procurement/admin (WO belum Closed) →
// dropdown untuk memilih/mengganti supplier (langsung tersimpan). Role lain →
// teks read-only.
function _bomReviewSupplierCell(it) {
  if (_bomSupplierEditable() && _bomWOStatus !== 'Closed') {
    return '<select onchange="_bomSetSupplier(\'' + _bomEsc(it.id) + '\', this)" data-prev="' + _bomEsc(it.supplier || '') + '" '
      + 'class="bom-sup-sel w-full max-w-[9rem] px-2 py-1.5 border border-slate-300 rounded-md text-xs bg-white">'
      + _bomSupplierOptions(it.supplier || '') + '</select>';
  }
  return '<span class="text-xs text-slate-600">' + (_bomEsc(it.supplier) || '-') + '</span>';
}
// Simpan perubahan supplier item BOM (procurement).
function _bomSetSupplier(id, sel) {
  var val = sel.value;
  var prev = sel.getAttribute('data-prev') || '';
  if (val === prev) return;
  sel.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      sel.disabled = false;
      if (res && res.success === false) { sel.value = prev; showNotification(res.message || 'Gagal memperbarui supplier.', 'error'); return; }
      sel.setAttribute('data-prev', val);
      var it = (_bomItems || []).filter(function(x){ return x.id === id; })[0];
      if (it) it.supplier = val;
      showNotification('Supplier diperbarui.', 'success');
    })
    .withFailureHandler(function(err) { sel.disabled = false; sel.value = prev; showNotification((err && err.message) || 'Gagal memperbarui supplier.', 'error'); })
    .updateBOMItemSupplier(id, val, _bomUserNama());
}

function _bomRenderReview() {
  var body = document.getElementById('bom-detail-body');
  var canReview = _bomCanReview();
  var canProcure = _bomCanReserve();  // reserve/alokasi item Approved di detail = warehouse
  // Project Coordinator boleh melihat status procurement (read-only), tanpa aksi.
  var canViewProc = canProcure || _bomRole() === 'projectcoordinator';
  var showAksi = canReview || canProcure;
  if (!_bomItems.length) {
    body.innerHTML = '<div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fa-solid fa-cubes-stacked text-2xl mb-2 block opacity-40"></i>Belum ada material.</div>';
    return;
  }
  var groups = {}, order = [];
  _bomItems.forEach(function(it) { var k = it.kategori || 'Lainnya'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
  body.innerHTML = order.map(function(kat) {
    var rows = groups[kat].map(function(it, i) {
      var cat = it.catatan ? '<div class="text-[10px] text-slate-400 italic mt-0.5">' + _bomEsc(it.catatan) + '</div>' : '';
      var rej = (it.status === 'Rejected' && it.catatanReview) ? '<div class="mt-1 text-[10px] bg-rose-50 border border-rose-200 text-rose-700 rounded px-2 py-1"><i class="fa-solid fa-circle-exclamation mr-1"></i><b>Revisi:</b> ' + _bomEsc(it.catatanReview) + '</div>' : '';
      var procCell = canViewProc ? ('<td class="p-2 text-center col-status" data-label="Warehouse">' + _bomProcBadge(it) + '</td>') : '';
      var aksi = '';
      if (showAksi) {
        var inner = '';
        if (_bomBusyIds[it.id]) {
          inner = '<i class="fas fa-spinner fa-spin text-slate-400 text-sm"></i>';
        } else {
          if (canReview) {
            if (it.status === 'Approved') inner += '<button onclick="_bomCancelApprove(\'' + _bomEsc(it.id) + '\')" class="text-amber-600 hover:bg-amber-50 p-1.5 rounded-md" title="Batalkan Approve"><i class="fa-solid fa-rotate-left text-xs"></i></button>';
            else inner += '<button onclick="_bomApprove(\'' + _bomEsc(it.id) + '\')" class="text-emerald-600 hover:bg-emerald-50 p-1.5 rounded-md" title="Approve"><i class="fa-solid fa-check text-sm"></i></button>'
              + '<button onclick="_bomOpenReject(\'' + _bomEsc(it.id) + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-md" title="Reject"><i class="fa-solid fa-xmark text-sm"></i></button>';
          }
          if (canProcure && it.status === 'Approved') {
            if (it.procStatus) inner += '<button onclick="_bomBatalProcure(\'' + _bomEsc(it.id) + '\')" class="text-amber-600 hover:bg-amber-50 p-1.5 rounded-md" title="Batalkan proses warehouse"><i class="fa-solid fa-rotate-left text-xs"></i></button>';
            else inner += '<button onclick="_bomOpenProcure(\'' + _bomEsc(it.id) + '\')" class="text-teal-600 hover:bg-teal-50 p-1.5 rounded-md" title="Proses (reserve / need purchase)"><i class="fa-solid fa-clipboard-check text-sm"></i></button>';
          }
        }
        if (!inner) inner = '<span class="text-slate-300 text-xs">—</span>';
        aksi = '<td class="p-2 text-center col-aksi" data-label="Aksi" id="bom-act-' + _bomEsc(it.id) + '"><div class="flex items-center justify-center gap-0.5">' + inner + '</div></td>';
      }
      return '<tr class="border-b border-slate-100 baris-kartu">'
        + '<td class="p-2 text-center text-xs font-bold text-slate-400 col-no">' + (i + 1) + '</td>'
        + '<td class="p-2 col-desk" data-label="Nama Material"><div class="text-sm font-semibold text-slate-700">' + _bomEsc(it.namaMaterial) + '</div>' + cat + rej + '</td>'
        + '<td class="p-2 col-merek" data-label="Merek"><span class="text-xs text-slate-600">' + (_bomEsc(it.merek) || '-') + '</span></td>'
        + '<td class="p-2 col-supplier" data-label="Supplier">' + _bomReviewSupplierCell(it) + '</td>'
        + '<td class="p-2 text-center col-satuan" data-label="Satuan"><span class="text-xs text-slate-500">' + (_bomEsc(it.satuan) || '-') + '</span></td>'
        + '<td class="p-2 text-center col-qty" data-label="Qty"><span class="text-sm font-extrabold text-indigo-700">' + _bomRp(it.qty) + '</span></td>'
        + '<td class="p-2 text-center col-status" data-label="Status">' + _bomStatusItemBadge(it.status) + '</td>'
        + procCell
        + aksi
        + '</tr>';
    }).join('');
    var procHead = canViewProc ? '<th class="p-2 w-28 text-center">Warehouse</th>' : '';
    var aksiHead = showAksi ? '<th class="p-2 w-24 text-center">Aksi</th>' : '';
    return '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
      + '<div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex items-center justify-between gap-2"><span class="font-extrabold text-sm text-slate-700 truncate"><i class="fa-solid fa-layer-group text-slate-400 mr-1.5"></i>' + _bomEsc(kat) + '</span><span class="text-[10px] font-bold text-slate-400">' + groups[kat].length + ' item</span></div>'
      + '<div class="overflow-x-auto tabel-item-wrap"><table class="w-full text-left border-collapse tabel-item-penawaran"><thead><tr class="bg-slate-100 border-b border-slate-200 text-[10px] font-bold text-slate-500 uppercase"><th class="p-2 w-10 text-center">No</th><th class="p-2">Nama Material</th><th class="p-2 w-28">Merek</th><th class="p-2 w-32">Supplier</th><th class="p-2 w-20 text-center">Satuan</th><th class="p-2 w-16 text-center">Qty</th><th class="p-2 w-24 text-center">Status</th>' + procHead + aksiHead + '</tr></thead><tbody>' + rows + '</tbody></table></div>'

// ── Procurement: proses (reserve/need purchase) & batalkan ──────
function _bomLoadStok(cb) {
  if (_bomStokList) { cb(); return; }
  google.script.run.withSuccessHandler(function(list) { _bomStokList = list || []; cb(); })
    .withFailureHandler(function() { _bomStokList = []; cb(); }).getStokList();
}
function _bomOpenProcure(id) {
  if (_bomBusyIds[id]) return;               // cegah klik ganda saat memuat
  var it = _bomItems.filter(function(x) { return x.id === id; })[0];
  if (!it) return;
  var cell = document.getElementById('bom-act-' + id);
  var saved = cell ? cell.innerHTML : null;  // simpan tombol untuk dipulihkan
  _bomBusyIds[id] = true;
  _bomSetActBusy(id);                         // ganti tombol dengan spinner
  _bomLoadStok(function() {
    delete _bomBusyIds[id];
    if (cell && saved != null) cell.innerHTML = saved;
    document.getElementById('bom-proc-id').value = id;
    document.getElementById('bom-proc-nama').innerText = it.namaMaterial;
    document.getElementById('bom-proc-info').innerText = (it.merek ? it.merek + ' · ' : '') + (it.supplier || '-') + ' · Qty ' + _bomRp(it.qty) + ' ' + (it.satuan || '');
    var sel = document.getElementById('bom-proc-stok');
    var opts = '<option value="">— Tidak dari stok (semua dibeli) —</option>';
    (_bomStokList || []).forEach(function(s) {
      opts += '<option value="' + _bomEsc(s.idStok) + '" data-tersedia="' + (s.qtyAvailable || 0) + '">' + _bomEsc(s.idStok) + ' — ' + _bomEsc(s.namaProduk) + ' (tersedia ' + _bomRp(s.qtyAvailable || 0) + ' ' + _bomEsc(s.satuan || '') + ')</option>';
    });
    sel.innerHTML = opts;
    if (it.idStok) sel.value = it.idStok;
    var qtyEl = document.getElementById('bom-proc-qty');
    qtyEl.value = it.qtyReserved || 0;
    qtyEl.disabled = !sel.value;
    document.getElementById('bom-modal-proc').classList.remove('hidden');
    _bomProcRecalc();
  });
}
function _bomCloseProc() { document.getElementById('bom-modal-proc').classList.add('hidden'); }
function _bomProcStokChange() {
  var sel = document.getElementById('bom-proc-stok');
  var it = _bomItems.filter(function(x) { return x.id === document.getElementById('bom-proc-id').value; })[0] || { qty: 0 };
  var Q = Number(it.qty) || 0;
  var qtyEl = document.getElementById('bom-proc-qty');
  if (sel.value) {
    var tersedia = (Number(sel.options[sel.selectedIndex].getAttribute('data-tersedia')) || 0) + ((sel.value === it.idStok) ? (Number(it.qtyReserved) || 0) : 0);
    qtyEl.disabled = false;
    qtyEl.value = Math.min(Q, tersedia);   // saran: reserve sebanyak yang tersedia
  } else { qtyEl.disabled = true; qtyEl.value = 0; }
  _bomProcRecalc();
}
function _bomProcRecalc() {
  var sel = document.getElementById('bom-proc-stok');
  var it = _bomItems.filter(function(x) { return x.id === document.getElementById('bom-proc-id').value; })[0] || { qty: 0 };
  var Q = Number(it.qty) || 0;
  var qtyEl = document.getElementById('bom-proc-qty');
  var tersedia = sel.value ? ((Number(sel.options[sel.selectedIndex].getAttribute('data-tersedia')) || 0) + ((sel.value === it.idStok) ? (Number(it.qtyReserved) || 0) : 0)) : 0;
  var qty = Number(qtyEl.value) || 0;
  var maxAmbil = sel.value ? Math.min(Q, tersedia) : 0;
  if (qty > maxAmbil) { qty = maxAmbil; qtyEl.value = maxAmbil; }
  if (qty < 0) { qty = 0; qtyEl.value = 0; }
  var beli = Math.max(0, Q - qty);
  document.getElementById('bom-proc-summary').innerHTML = 'Reserve dari stok: <b class="text-emerald-700">' + _bomRp(qty) + '</b> · Perlu dibeli: <b class="text-amber-700">' + _bomRp(beli) + '</b>';
}
function _bomSubmitProcure() {
  var id = document.getElementById('bom-proc-id').value;
  var sel = document.getElementById('bom-proc-stok');
  var idStok = sel.value || '';
  var qty = Number(document.getElementById('bom-proc-qty').value) || 0;
  if (!idStok || qty <= 0) { idStok = ''; qty = 0; }   // tidak dari stok → semua dibeli
  _bomCloseProc();
  if (_bomBusyIds[id]) return;
  _bomBusyIds[id] = true; _bomSetActBusy(id);
  google.script.run.withSuccessHandler(function(res) {
    delete _bomBusyIds[id];
    if (res && res.success === false) { showNotification(res.message, 'error'); _bomReloadDetail(); return; }
    showNotification((res && res.message) || 'Diproses.');
    _bomReloadDetail();
  }).withFailureHandler(function(err) { delete _bomBusyIds[id]; showNotification((err && err.message) || 'Gagal.', 'error'); _bomReloadDetail(); })
    .prosesBOMProcurement(id, { idStok: idStok, qtyReserved: qty, oleh: _bomUserNama() });
}
function _bomBatalProcure(id) {
  showConfirm({ title: 'Batalkan Proses Warehouse', message: 'Batalkan proses material ini? Bila ada reserve, stok akan dikembalikan & pengeluaran otomatis dihapus.', confirmText: 'Ya, Batalkan', icon: 'fa-rotate-left', type: 'warning', onConfirm: function() {
    if (_bomBusyIds[id]) return;
    _bomBusyIds[id] = true; _bomSetActBusy(id);
    google.script.run.withSuccessHandler(function(res) {
      delete _bomBusyIds[id];
      if (res && res.success === false) { showNotification(res.message, 'error'); _bomReloadDetail(); return; }
      showNotification((res && res.message) || 'Dibatalkan.');
      _bomReloadDetail();
    }).withFailureHandler(function(err) { delete _bomBusyIds[id]; showNotification((err && err.message) || 'Gagal.', 'error'); _bomReloadDetail(); })
      .batalkanBOMProcurement(id, _bomUserNama());
  } });
}

// ── Editable per-kategori (blok "sub-paket", pola form penawaran) ──
// Site Engineer/Admin menyusun material dikelompokkan per blok kategori:
// tiap blok punya dropdown kategori + tabel material (dropdown material
// difilter kategori blok) + "Tambah Item"; "Tambah Kategori" menambah blok;
// "Simpan Perubahan" sync (diff by ID). Material Approved terkunci.
function _bomRenderEditable() {
  var body = document.getElementById('bom-detail-body');

    google.script.run.withSuccessHandler(function(res) { _bomReviewDone(id, res, 'Pending'); })
      .withFailureHandler(function(err){ _bomReviewFail(id, err); })
      .cancelBOMApproval(id, _bomUserNama());
  }});
}
function _bomOpenReject(id) {
  document.getElementById('bom-reject-id').value = id;
  document.getElementById('bom-reject-catatan').value = '';
  var item = _bomItems.filter(function(x){ return x.id === id; })[0];
  document.getElementById('bom-reject-nama').innerText = (item && item.namaMaterial) || '';
  document.getElementById('bom-modal-reject').classList.remove('hidden');
}
function _bomCloseReject() { document.getElementById('bom-modal-reject').classList.add('hidden'); }
function _bomSubmitReject() {
  var id = document.getElementById('bom-reject-id').value;
  var catatan = document.getElementById('bom-reject-catatan').value.trim();
  if (!catatan) return showNotification('Catatan revisi wajib diisi.', 'error');
  _bomCloseReject();
  if (_bomBusyIds[id]) return;
  _bomBusyIds[id] = true;
  _bomSetActBusy(id);
  google.script.run.withSuccessHandler(function(res) { _bomReviewDone(id, res, 'Rejected', catatan); })
    .withFailureHandler(function(err){ _bomReviewFail(id, err); })
    .reviewBOMItem(id, 'Rejected', catatan, _bomUserNama());
}

// ── Penugasan Site Engineer (panel dropdown) ────────────────────
function _bomToggleAssign(e) {
  if (e) e.stopPropagation();
  var panel = document.getElementById('bom-assign-panel');
  if (!panel) return;
  if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  if (!window._bomAssignDocBound) {
    window._bomAssignDocBound = true;
    document.addEventListener('click', function(ev) {
      var actions = document.getElementById('bom-detail-actions');
      var p = document.getElementById('bom-assign-panel');
      if (!p || p.classList.contains('hidden')) return;
      if (actions && actions.contains(ev.target)) return;
      p.classList.add('hidden');
    });
  }
  panel.innerHTML = '<div class="text-xs text-slate-400 py-1"><i class="fas fa-spinner fa-spin mr-1"></i>Memuat...</div>';
  var render = function() {
    var assignedIds = (_bomAssigned || []).map(function(a){ return a.id; });
    var rows = (_bomSiteEngineers || []).map(function(u) {
      return '<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="checkbox" value="' + _bomEsc(u.id) + '" ' + (assignedIds.indexOf(u.id) !== -1 ? 'checked' : '') + ' class="bom-assign-cb w-4 h-4 accent-indigo-600"><span class="text-sm text-slate-700">' + _bomEsc(u.nama) + '</span></label>';
    }).join('') || '<div class="text-xs text-slate-400 py-2">Belum ada Site Engineer.</div>';
    panel.innerHTML = '<div class="text-[11px] font-bold text-slate-400 uppercase mb-2">Tugaskan Site Engineer</div><div class="max-h-56 overflow-y-auto">' + rows + '</div>'
      + '<button onclick="_bomSaveAssign()" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 rounded-lg">Simpan</button>';
  };
  if (_bomSiteEngineers) render();
  else google.script.run.withSuccessHandler(function(res){ _bomSiteEngineers = (res && res.success) ? (res.list || []) : []; render(); }).withFailureHandler(function(){ _bomSiteEngineers = []; render(); }).getSiteEngineerList();
}
function _bomSaveAssign() {
  var ids = Array.prototype.slice.call(document.querySelectorAll('.bom-assign-cb:checked')).map(function(cb){ return cb.value; });
  toggleLoader(true, 'Menyimpan penugasan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Tersimpan.');
    var p = document.getElementById('bom-assign-panel'); if (p) p.classList.add('hidden');
    _bomReloadDetail();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .setBOMAssignment(_bomWO.noWO, ids, _bomUserNama());
}

// ── Tambah Project ke BOM ───────────────────────────────────────
function _bomOpenAddProject() {
  document.getElementById('bom-modal-project').classList.remove('hidden');
  var woSel = document.getElementById('bom-proj-wo');
  woSel.innerHTML = '<option value="">Memuat WO...</option>';
  google.script.run.withSuccessHandler(function(res) {
    var list = (res && res.success) ? (res.list || []) : [];
    woSel.innerHTML = list.length ? (['<option value="">-- Pilih Work Order --</option>'].concat(list.map(function(w){ return '<option value="' + _bomEsc(w.noWO) + '">' + _bomEsc(w.noWO) + ' — ' + _bomEsc(w.namaProject || '-') + (w.namaKlien ? ' (' + _bomEsc(w.namaKlien) + ')' : '') + '</option>'; })).join('')) : '<option value="">Semua WO sudah ada di BOM</option>';
    if (typeof sdEnsure === 'function') sdEnsure('bom-proj-wo', '-- Pilih Work Order --', 'Cari No WO / project...');   // data-banyak → searchable
  }).withFailureHandler(function(){ woSel.innerHTML = '<option value="">Gagal memuat</option>'; }).getAvailableWOForBOM();

  var seWrap = document.getElementById('bom-proj-se');
  seWrap.innerHTML = 'Memuat...';
  var render = function() {
    seWrap.innerHTML = (_bomSiteEngineers || []).length
      ? _bomSiteEngineers.map(function(u){ return '<label class="flex items-center gap-2 py-1 cursor-pointer"><input type="checkbox" value="' + _bomEsc(u.id) + '" class="bom-proj-cb w-4 h-4 accent-indigo-600"><span class="text-sm text-slate-700">' + _bomEsc(u.nama) + '</span></label>'; }).join('')
      : '<div class="text-xs text-slate-400">Belum ada Site Engineer.</div>';
  };
  if (_bomSiteEngineers) render();
  else google.script.run.withSuccessHandler(function(res){ _bomSiteEngineers = (res && res.success) ? (res.list || []) : []; render(); }).withFailureHandler(function(){ _bomSiteEngineers = []; render(); }).getSiteEngineerList();
}
function _bomCloseAddProject(){ document.getElementById('bom-modal-project').classList.add('hidden'); }
function _bomSubmitAddProject() {
  var noWO = document.getElementById('bom-proj-wo').value;
  if (!noWO) return showNotification('Pilih Work Order dulu.', 'error');
  var ids = Array.prototype.slice.call(document.querySelectorAll('.bom-proj-cb:checked')).map(function(cb){ return cb.value; });
  _bomCloseAddProject();   // tutup modal dulu agar tak menutupi loading screen
  toggleLoader(true, 'Menambahkan...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (res && res.success === false) { showNotification(res.message, 'error'); return; }
    showNotification(res && res.message ? res.message : 'Ditambahkan.');
    loadBOM();
  }).withFailureHandler(function(err){ toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
    .addBOMProject(noWO, ids, _bomUserNama());
}

// ── Export PDF (dikelompokkan per kategori, tanpa harga) ─────────
function _bomExportPDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) return showNotification('Modul PDF belum siap. Muat ulang halaman.', 'error');
  try {
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var PW = 210, ML = 12, MR = 12;
    var DARK = [30, 41, 59], SLATE = [100, 116, 139], INDIGO = [67, 56, 202];
    doc.setFillColor(DARK[0], DARK[1], DARK[2]); doc.rect(0, 0, PW, 22, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text('BILL OF MATERIAL', ML, 11);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(190, 200, 220);
    doc.text('DOKUMEN INTERNAL — DAFTAR MATERIAL PROJECT', ML, 17);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(170, 195, 255);
    doc.text('NO. WORK ORDER', PW - MR, 9, { align: 'right' });
    doc.setFontSize(15); doc.setTextColor(255, 255, 255);
    doc.text(String(_bomWO.noWO), PW - MR, 16, { align: 'right' });

    var y = 30;
    doc.setFontSize(9); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
    doc.setFont('helvetica', 'bold'); doc.text('Project', ML, y); doc.setFont('helvetica', 'normal'); doc.text(': ' + (_bomWO.namaProject || '-'), ML + 20, y);
    doc.setFont('helvetica', 'bold'); doc.text('Klien', ML, y + 5); doc.setFont('helvetica', 'normal'); doc.text(': ' + (_bomWO.namaKlien || '-'), ML + 20, y + 5);
    doc.setFont('helvetica', 'bold'); doc.text('Status', ML, y + 10); doc.setFont('helvetica', 'normal'); doc.text(': ' + (_bomStatus === 'Final' ? 'Approved' : 'Draft'), ML + 20, y + 10);
    var engNames = (_bomAssigned || []).map(function(a){ return a.nama; }).filter(Boolean).join(', ') || '-';
    doc.setFont('helvetica', 'bold'); doc.text('Engineer', ML, y + 15); doc.setFont('helvetica', 'normal');
    var engLines = doc.splitTextToSize(': ' + engNames, PW - MR - (ML + 20));
    doc.text(engLines, ML + 20, y + 15);
    y += 21 + (engLines.length - 1) * 4.2;

    if (!_bomItems.length) { doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]); doc.text('Belum ada material.', ML, y); }
    else {
      var groups = {}, order = [];
      _bomItems.forEach(function(it){ var k = it.kategori || 'Lainnya'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
      order.forEach(function(kat) {
        var bodyRows = groups[kat].map(function(it, i){ return [String(i + 1), it.namaMaterial || '', it.merek || '-', it.supplier || '-', it.satuan || '-', _bomRp(it.qty)]; });
        doc.autoTable({
          startY: y,
          head: [[{ content: kat.toUpperCase() + '  (' + groups[kat].length + ' item)', colSpan: 6, styles: { halign: 'left', fillColor: [226, 232, 240], textColor: DARK, fontStyle: 'bold' } }],
                 ['No', 'Nama Material', 'Merek', 'Supplier', 'Satuan', 'Qty']],
          body: bodyRows, theme: 'grid',
          margin: { left: ML, right: MR },
          headStyles: { fillColor: INDIGO, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
          bodyStyles: { fontSize: 8, textColor: [40, 40, 40], lineColor: [210, 215, 225], lineWidth: 0.15, cellPadding: 1.6 },
          columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 30 }, 3: { cellWidth: 34 }, 4: { cellWidth: 18, halign: 'center' }, 5: { cellWidth: 18, halign: 'center', fontStyle: 'bold' } },
          styles: { overflow: 'linebreak' }
        });
        y = doc.lastAutoTable.finalY + 5;
      });
    }
    doc.setFontSize(7); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
    doc.text('Dokumen internal PT. Renus Global Indonesia — daftar material project.', ML, 290);
    var fname = 'BOM_' + String(_bomWO.noWO) + '_' + (_bomWO.namaProject || '').replace(/[\\/]/g, '-') + '.pdf';
    doc.save(fname);
    showNotification('PDF BOM diunduh: ' + fname);
  } catch (err) {
    showNotification('Gagal membuat PDF: ' + (err && err.message ? err.message : err), 'error');
  }
}
</script>
