<script>
// ================================================================
//  JS_Dashboard.html — RenusPro (Merged Dashboard + Sales Report)
// ================================================================

// ── State ──────────────────────────────────────────────────────
var _dbRawCache   = null;  // getDashboardRawData result (cached)
var _dbResultCache = null; // { key, raw, sales, at } — cache re-nav dashboard (TTL pendek)
var _DB_NAV_TTL   = 60000; // 60 dtk: buka kembali dashboard dalam rentang ini tak fetch ulang
var _dbPeriodMode = 'mtd';
var _dbTrendChart   = null;
var _dbDonutChart   = null;
var _dbChannelChart = null;
var _dbWinChart     = null;
var _dbLostChart    = null;
var _dbSalesFactorCharts = {}; // idx → { win, lost } chart instances per sales

// Palet warna slice pie faktor Win (hijau) & Lost (merah)
var _DB_WIN_PALETTE  = ['#059669','#10B981','#34D399','#6EE7B7','#14B8A6','#22C55E','#84CC16','#2DD4BF'];
var _DB_LOST_PALETTE = ['#DC2626','#EF4444','#F87171','#FB7185','#F43F5E','#FB923C','#F97316','#FBBF24'];

// ── Formatting helpers ─────────────────────────────────────────
function _rp(n) {
  if (!n && n !== 0) return 'Rp 0';
  return 'Rp ' + Math.round(Number(n)).toLocaleString('id-ID');
}
// Format ringkas 1 baris: Rp 78,98Jt / Rp 2,52M / Rp 1,20T
function _rpShort(n) {
  var v = Number(n) || 0;
  var abs = Math.abs(v);
  var fmt = function(x, suf) {
    return 'Rp ' + x.toFixed(2).replace(/\.?0+$/, '').replace('.', ',') + suf;
  };
  if (abs >= 1e12) return fmt(v / 1e12, 'T');
  if (abs >= 1e9)  return fmt(v / 1e9,  'M');
  if (abs >= 1e6)  return fmt(v / 1e6,  'Jt');
  if (abs >= 1e3)  return fmt(v / 1e3,  'Rb');
  return 'Rp ' + Math.round(v).toLocaleString('id-ID');
}
function _pct(n) {
  if (n === null || n === undefined) return '—';
  return Number(n).toFixed(1) + '%';
}
function _fmtDate(dt) {
  var d = String(dt.getDate()).padStart(2, '0');
  var m = String(dt.getMonth() + 1).padStart(2, '0');
  return d + '/' + m + '/' + dt.getFullYear();
}
function _htmlDateToObj(str) {
  if (!str) return null;
  var p = str.split('-');
  if (p.length !== 3) return null;
  return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
}
function _ddmmToInputVal(s) {
  if (!s) return '';
  var p = s.split('/');
  if (p.length !== 3) return '';
  return p[2] + '-' + p[1] + '-' + p[0];
}
function _esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Badge helpers ──────────────────────────────────────────────
function _statusBadge(status) {
  var map = { 'Deal':'bg-emerald-100 text-emerald-700', 'On-Progress':'bg-blue-100 text-blue-700', 'Fail':'bg-rose-100 text-rose-700' };
  var cls = map[status] || 'bg-slate-100 text-slate-600';
  return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + cls + ' whitespace-nowrap">' + (status || '—') + '</span>';
}
function _achieveBadge(achievement) {
  if (achievement === null || achievement === undefined) {
    return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 whitespace-nowrap">No Target</span>';
  }
  var cls, label;
  if (achievement >= 100)      { cls = 'bg-emerald-100 text-emerald-700'; label = '✓ Tercapai'; }
  else if (achievement >= 75)  { cls = 'bg-blue-100 text-blue-700';       label = _pct(achievement); }
  else if (achievement >= 50)  { cls = 'bg-amber-100 text-amber-700';     label = _pct(achievement); }
  else                         { cls = 'bg-rose-100 text-rose-700';       label = _pct(achievement); }
  return '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full ' + cls + ' whitespace-nowrap">' + label + '</span>';
}
function _rankBadge(rank) {
  if (rank === 1) return '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-extrabold bg-amber-100 text-amber-700">' + rank + '</span>';
  if (rank === 2) return '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-extrabold bg-slate-100 text-slate-600">' + rank + '</span>';
  if (rank === 3) return '<span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-extrabold bg-orange-100 text-orange-700">' + rank + '</span>';
  return '<span class="text-xs font-bold text-slate-400">' + rank + '</span>';
}

// ── Period helpers ─────────────────────────────────────────────
function _dbGetPeriodParams() {
  var today = new Date();
  var from, to;
  if (_dbPeriodMode === 'mtd') {
    from = new Date(today.getFullYear(), today.getMonth(), 1);
    to   = new Date(today.getFullYear(), today.getMonth() + 1, 0); // hari terakhir bulan ini
  } else if (_dbPeriodMode === 'lastmonth') {
    from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    to   = new Date(today.getFullYear(), today.getMonth(), 0);
  } else if (_dbPeriodMode === 'ytd') {
    from = new Date(today.getFullYear(), 0, 1);
    to   = today;
  } else {
    from = _htmlDateToObj(document.getElementById('db-date-from').value);
    to   = _htmlDateToObj(document.getElementById('db-date-to').value);
    if (!from || !to) return null;
  }
  var isAdmin = _currentUser && (_currentUser.role === 'admin' || _currentUser.role === 'owner');
  return {
    dateFrom: _fmtDate(from),
    dateTo:   _fmtDate(to),
    isAdmin:  isAdmin,
    namaUser: _currentUser ? _currentUser.nama : ''
  };
}

function _dbPeriodToMs(params) {
  var p = params.dateFrom.split('/');
  var fromMs = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0])).getTime();
  var q = params.dateTo.split('/');
  var toMs   = new Date(parseInt(q[2]), parseInt(q[1])-1, parseInt(q[0]), 23, 59, 59, 999).getTime();
  return { fromMs: fromMs, toMs: toMs };
}

// Compute prev period KPIs from raw cache
function _dbPrevKPI(items, fromMs, toMs) {
  // Hitung prev period berdasarkan mode — bukan sekadar geser durasi
  var prevFromMs, prevToMs;
  var today = new Date();

  if (_dbPeriodMode === 'mtd') {
    // Bulan Ini (full month) → prev = bulan lalu full month
    var pFrom  = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    var pTo    = new Date(today.getFullYear(), today.getMonth(), 0, 23, 59, 59, 999);
    prevFromMs = pFrom.getTime();
    prevToMs   = pTo.getTime();
  } else if (_dbPeriodMode === 'lastmonth') {
    // Bulan Lalu → 2 bulan lalu (full month)
    var pFrom2 = new Date(today.getFullYear(), today.getMonth() - 2, 1);
    var pTo2   = new Date(today.getFullYear(), today.getMonth() - 1, 0, 23, 59, 59, 999);
    prevFromMs = pFrom2.getTime();
    prevToMs   = pTo2.getTime();
  } else if (_dbPeriodMode === 'ytd') {
    // YTD → periode sama tahun lalu
    var fromDtY = new Date(fromMs);
    var toDtY   = new Date(toMs);
    prevFromMs  = new Date(fromDtY.getFullYear() - 1, 0, 1).getTime();
    prevToMs    = new Date(toDtY.getFullYear() - 1, toDtY.getMonth(), toDtY.getDate(), 23, 59, 59, 999).getTime();
  } else {
    // Custom → geser durasi ke belakang
    var duration = toMs - fromMs;
    prevToMs   = fromMs - 1;
    prevFromMs = prevToMs - duration;
  }

  var prevRevenue = 0, prevDeals = 0;
  items.forEach(function(item) {
    if (item.status !== 'Deal') return;
    var ts = item.tanggalDeal || item.tanggal;
    if (ts && ts >= prevFromMs && ts <= prevToMs) {
      prevRevenue += (item.nilaiKontrak !== undefined ? item.nilaiKontrak : item.grandTotal);
      prevDeals++;
    }
  });
  return { prevRevenue: prevRevenue, prevDeals: prevDeals };
}

// ── Period toggle ──────────────────────────────────────────────
function _dbSetPeriod(mode) {
  _dbPeriodMode = mode;
  var active   = 'db-period-btn px-3 py-1 rounded-lg text-[11px] font-bold border transition bg-blue-600 text-white border-blue-600';
  var inactive = 'db-period-btn px-3 py-1 rounded-lg text-[11px] font-bold border transition bg-white text-slate-600 border-slate-200 hover:border-blue-400 hover:text-blue-600';
  ['mtd','lastmonth','ytd','custom'].forEach(function(m) {
    var btn = document.getElementById('db-period-' + m);
    if (btn) btn.className = m === mode ? active : inactive;
  });
  var customRange = document.getElementById('db-custom-range');
  if (mode === 'custom') {
    customRange.classList.remove('hidden');
    customRange.style.display = 'flex';
    var today = new Date();
    var fi = document.getElementById('db-date-from');
    var ti = document.getElementById('db-date-to');
    if (!fi.value) fi.value = _ddmmToInputVal(_fmtDate(new Date(today.getFullYear(), today.getMonth(), 1)));
    if (!ti.value) ti.value = _ddmmToInputVal(_fmtDate(today));
  } else {
    customRange.classList.add('hidden');
    _dbLoad();
  }
}

// ── Entry point ────────────────────────────────────────────────
window.loadDashboard = function(forceRefresh) {
  if (forceRefresh) { _dbRawCache = null; _dbResultCache = null; }
  // Buka kembali dashboard (nav) dalam TTL & periode sama → render dari cache,
  // tanpa round-trip. Ganti periode / force refresh selalu fetch (via _dbLoad).
  if (!forceRefresh && _dbResultCache && (Date.now() - _dbResultCache.at) < _DB_NAV_TTL
      && _dbResultCache.key === _dbPeriodKey()) {
    document.getElementById('db-loading').classList.add('hidden');
    document.getElementById('db-main-content').classList.remove('hidden');
    _dbRenderAll(_dbResultCache.raw, _dbResultCache.sales);
    return;
  }
  _dbLoad();
};

function _dbPeriodKey() {
  try { var p = _dbGetPeriodParams(); return p ? JSON.stringify(p) : ''; } catch (e) { return ''; }
}

function _dbLoad() {
  // Show loading
  document.getElementById('db-loading').classList.remove('hidden');
  document.getElementById('db-main-content').classList.add('hidden');
  if (typeof _updatePeriodLabel === 'function') _updatePeriodLabel();

  var params = _dbGetPeriodParams();
  if (!params) {
    document.getElementById('db-loading').classList.add('hidden');
    return;
  }

  // Attach user context
  if (typeof _currentUser !== 'undefined' && _currentUser) {
    params.isAdmin  = (_currentUser.role === 'admin' || _currentUser.role === 'owner');
    params.namaUser = _currentUser.nama  || '';
    params.role     = _currentUser.role  || 'sales';
    params.userId   = _currentUser.id    || '';
  } else {
    params.isAdmin  = true;
    params.namaUser = '';
    params.role     = 'admin';
    params.userId   = '';
  }

  if (typeof google === 'undefined') {
    _dbRenderAll({ success: true, items: [], isAdmin: params.isAdmin }, _dbMockSalesData(params));
    return;
  }

  // Single combined call — halves server round trips
  google.script.run
    .withSuccessHandler(function(result) {
      var raw   = (result && result.raw)   ? result.raw   : { success: false, items: [], isAdmin: params.isAdmin };
      var sales = (result && result.sales) ? result.sales : { success: false };
      _dbRawCache = raw.success ? raw : { success: false, items: [], isAdmin: params.isAdmin };
      _dbResultCache = { key: _dbPeriodKey(), raw: raw, sales: sales, at: Date.now() };
      _dbRenderAll(raw, sales);
    })
    .withFailureHandler(function(e) { _dbShowError(e.message || 'Error'); })
    .getDashboardData(params);
}

function _dbShowError(msg) {
  var el = document.getElementById('db-loading');
  el.innerHTML = '<div class="flex flex-col items-center gap-3 py-24">'
    + '<i class="fa-solid fa-circle-exclamation text-3xl text-rose-400"></i>'
    + '<p class="text-sm text-slate-500 font-medium">Gagal memuat dashboard</p>'
    + '<p class="text-xs text-slate-400 max-w-xs text-center">' + (msg || '') + '</p>'
    + '<button onclick="_dbLoad()" class="mt-2 text-xs font-bold bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Coba Lagi</button>'
    + '</div>';
  el.classList.remove('hidden');
}

// ── Main render ────────────────────────────────────────────────
function _dbRenderAll(rawData, salesData) {
  var isAdmin = (typeof _currentUser !== 'undefined' && _currentUser && (_currentUser.role === 'admin' || _currentUser.role === 'owner'));
  var isLeadSales = (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role === 'leadsales');

  // Dashboard title
  var titleEl = document.getElementById('dashboard-title');
  if (titleEl) {
    titleEl.textContent = isAdmin
      ? 'Ringkasan Performa Tim Sales'
      : isLeadSales
        ? 'Ringkasan Performa Tim ' + (_currentUser ? _currentUser.nama : '')
        : 'Ringkasan Performa ' + (_currentUser ? _currentUser.nama : '');
  }

  // Export button (admin or leadsales)
  var expBtn = document.getElementById('db-export-btn');
  if (expBtn) {
    expBtn.classList.toggle('hidden', !(isAdmin || isLeadSales));
    expBtn.classList.toggle('flex', isAdmin || isLeadSales);
  }

  // Admin/leadsales sections
  document.getElementById('db-leaderboard-section').classList.toggle('hidden', !(isAdmin || isLeadSales));
  var winlossSection = document.getElementById('db-winloss-section');
  if (winlossSection) winlossSection.classList.toggle('hidden', !(isAdmin || isLeadSales));

  // Detail per sales: accordion (admin/leadsales) atau flat (sales) — tampil untuk semua
  document.getElementById('db-detail-section').classList.remove('hidden');
  var detailTitle = document.getElementById('db-detail-title');
  if (detailTitle) detailTitle.textContent = (isAdmin || isLeadSales) ? 'Detail Per Sales' : 'Detail Penawaran Saya';

  var items   = (rawData && rawData.items) ? rawData.items : [];
  var summary = (salesData && salesData.summary) ? salesData.summary : {};
  var salesList = (salesData && salesData.salesList) ? salesData.salesList : [];
  var trend   = (salesData && salesData.trend) ? salesData.trend : { labels: [], values: [] };

  // Compute period timestamps for prev comparison
  var params = _dbGetPeriodParams();
  var ms = params ? _dbPeriodToMs(params) : { fromMs: null, toMs: null };
  var prev = (ms.fromMs && ms.toMs) ? _dbPrevKPI(items, ms.fromMs, ms.toMs) : { prevRevenue: 0, prevDeals: 0 };

  // Target tahunan:
  // - admin      → target perusahaan penuh (Rp 25 M)
  // - lead sales → target perusahaan ÷ jumlah lead sales aktif
  // - sales      → target bulanannya sendiri × 12
  var annualTarget;
  if (isAdmin) {
    annualTarget = DB_TARGET_TAHUNAN;
  } else if (isLeadSales) {
    var _lsCount = (summary.leadSalesCount && summary.leadSalesCount > 0) ? summary.leadSalesCount : 1;
    annualTarget = DB_TARGET_TAHUNAN / _lsCount;
  } else {
    annualTarget = (summary.teamTarget || 0) * 12;
  }

  _dbRenderKPIs(summary, prev, salesList, items, ms);
  _dbRenderTargetBar(summary, items, annualTarget);
  _dbRenderKonversi(summary);
  _dbRenderTrend(items);
  _dbRenderDonut(items, ms.fromMs, ms.toMs);
  _dbRenderChannel(items, ms.fromMs, ms.toMs);
  if (isAdmin || isLeadSales) {
    _dbRenderLeaderboard(salesList);
    _dbRenderDetailAccordion(salesList);
    _dbRenderWinLossFactors(salesList);
  } else {
    // Sales: detail penawaran sendiri, tampilan flat tanpa accordion
    _dbRenderSalesOwnDetail(salesList);
  }
  _dbRenderPipelineHealth(salesData ? salesData.pipelineHealth : null, annualTarget, _dbYtdRevenue(items));

  document.getElementById('db-loading').classList.add('hidden');
  document.getElementById('db-main-content').classList.remove('hidden');

  // Cache for PDF
  window._dbLastSalesData = salesData;
}

// ── KPI Cards ──────────────────────────────────────────────────
// Deal DALAM PERIODE dipecah berdasarkan kapan penawarannya dibuat:
// - fromThis: penawaran dibuat DALAM periode yang deal dalam periode (kohort)
// - fromLast: penawaran dibuat SEBELUM periode yang deal dalam periode
// Mengikuti periode filter yang dipilih (bukan bulan berjalan).
function _dbDealCohortSplit(items, fromMs, toMs) {
  var fromThis = 0, fromLast = 0;
  (items || []).forEach(function(it) {
    if (it.status !== 'Deal') return;
    var d = it.tanggalDeal || it.tanggal;          // tanggal deal
    if (!d || d < fromMs || d > toMs) return;      // deal harus dalam periode
    var c = it.tanggal;                             // tanggal penawaran dibuat
    if (c == null || c >= fromMs) fromThis++;       // dibuat dalam periode (c<=d<=toMs)
    else fromLast++;                                // dibuat sebelum periode
  });
  return { fromThis: fromThis, fromLast: fromLast };
}

function _dbRenderKPIs(summary, prev, salesList, items, ms) {
  var curRevenue = summary.teamRevenue || 0;
  var curDeals   = summary.teamDealCount || 0;
  var prevRevenue = prev.prevRevenue || 0;
  var prevDeals   = prev.prevDeals || 0;

  // Revenue
  var revChangePct = prevRevenue > 0 ? ((curRevenue - prevRevenue) / prevRevenue * 100) : (curRevenue > 0 ? 100 : 0);
  var el = document.getElementById('db-kpi-revenue');
  if (el) el.textContent = _rp(curRevenue);
  var revBadge = document.getElementById('db-kpi-revenue-badge');
  if (revBadge) {
    revBadge.textContent = (revChangePct >= 0 ? '▲ ' : '▼ ') + Math.abs(revChangePct).toFixed(1) + '%';
    revBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1 ' +
      (revChangePct >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700');
  }
  var revSub = document.getElementById('db-kpi-revenue-sub');
  if (revSub) revSub.textContent = 'Periode lalu: ' + _rp(prevRevenue);

  // Penawaran
  var penEl = document.getElementById('db-kpi-penawaran');
  if (penEl) penEl.textContent = summary.teamPenawaran != null ? summary.teamPenawaran : '—';

  // Deals
  var dealEl = document.getElementById('db-kpi-deal');
  if (dealEl) dealEl.textContent = curDeals != null ? curDeals : '—';
  var dealBadge = document.getElementById('db-kpi-deal-badge');
  var dealDiff  = curDeals - prevDeals;
  if (dealBadge) {
    dealBadge.textContent = (dealDiff >= 0 ? '▲ ' : '▼ ') + Math.abs(dealDiff) + ' vs lalu';
    dealBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1 ' +
      (dealDiff >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700');
  }
  // Rincian deal DALAM PERIODE menurut kapan penawarannya dibuat
  // (dibuat dalam periode vs sebelum periode) — ikut filter periode.
  var _now = new Date();
  var pFrom = (ms && ms.fromMs) ? ms.fromMs : new Date(_now.getFullYear(), _now.getMonth(), 1).getTime();
  var pTo   = (ms && ms.toMs)   ? ms.toMs   : new Date(_now.getFullYear(), _now.getMonth() + 1, 0, 23, 59, 59, 999).getTime();
  var split = _dbDealCohortSplit(items, pFrom, pTo);
  var dealSub = document.getElementById('db-kpi-deal-sub');
  if (dealSub) dealSub.textContent = 'Penawaran periode ini: ' + split.fromThis + '. sebelumnya: ' + split.fromLast;

  // Pipeline
  var pipEl = document.getElementById('db-kpi-pipeline');
  if (pipEl) pipEl.textContent = _rp(summary.teamPipelineValue || 0);
  var pipSub = document.getElementById('db-kpi-pipeline-sub');
  if (pipSub) pipSub.textContent = (summary.teamPipelineCount || 0) + ' penawaran';

  // Margin Deal (nilai + %) — cohort SAMA dengan Revenue Deal (status Deal &
  // tanggal deal dalam periode). Nilai margin = Σ (nilaiKontrak − HPP) exclude
  // PPN; persentase = nilai margin ÷ revenue deal (definisi margin konsisten
  // dengan Statistik Konversi & kolom Margin per penawaran).
  var marginValue = 0, revBasis = 0;
  (items || []).forEach(function(it) {
    if (it.status !== 'Deal') return;
    var d = it.tanggalDeal || it.tanggal;
    if (!d || d < pFrom || d > pTo) return;
    var nilai = (it.nilaiKontrak !== undefined ? it.nilaiKontrak : it.grandTotal) || 0;
    var hpp = Number(it.totalHpp) || 0;
    marginValue += (nilai - hpp);
    revBasis += nilai;
  });
  var marginPct = revBasis > 0 ? (marginValue / revBasis * 100) : 0;
  var margEl = document.getElementById('db-kpi-margin');
  if (margEl) margEl.textContent = _rp(Math.round(marginValue));
  var margBadge = document.getElementById('db-kpi-margin-badge');
  if (margBadge) {
    margBadge.textContent = _pct(marginPct);
    margBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1 bg-violet-100 text-violet-700';
  }
  var margSub = document.getElementById('db-kpi-margin-sub');
  if (margSub) margSub.textContent = 'Estimasi keuntungan (excl. PPN)';
}

// ── Target progress bar ────────────────────────────────────────
// Target tahunan (fixed company-wide target) — dipakai bersama oleh
// Capaian Target Tahunan & Pipeline Coverage.
var DB_TARGET_TAHUNAN = 25000000000;

// Total revenue deal tahun berjalan (YTD) dari raw cache.
function _dbYtdRevenue(items) {
  var now = new Date();
  var fromMs = new Date(now.getFullYear(), 0, 1).getTime();
  var toMs   = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999).getTime();
  var rev = 0;
  (items || []).forEach(function(item) {
    if (item.status !== 'Deal') return;
    var ts = item.tanggalDeal || item.tanggal;
    if (ts && ts >= fromMs && ts <= toMs) rev += (item.nilaiKontrak !== undefined ? item.nilaiKontrak : item.grandTotal);
  });
  return rev;
}

function _dbRenderTargetBar(summary, items, annualTarget) {
  var rev    = summary.teamRevenue || 0;
  var target = summary.teamTarget  || 0;
  var pct    = target > 0 ? Math.min((rev / target) * 100, 100) : 0;
  var rawPct = target > 0 ? (rev / target) * 100 : 0;

  var pctEl = document.getElementById('db-target-pct');
  if (pctEl) pctEl.textContent = _pct(rawPct);
  var bar = document.getElementById('db-target-bar');
  if (bar) bar.style.width = pct + '%';
  var txt = document.getElementById('db-target-text');
  if (txt) txt.textContent = _rp(rev) + ' / ' + _rp(target);

  // YTD revenue vs target tahunan (default target perusahaan jika tak diberi)
  var ytdRev = _dbYtdRevenue(items);
  var targetTahunan = (annualTarget != null && annualTarget > 0) ? annualTarget : DB_TARGET_TAHUNAN;
  var ytdPct    = targetTahunan > 0 ? (ytdRev / targetTahunan * 100) : 0;
  var ytdBarPct = Math.min(ytdPct, 100);

  var ytdPctEl = document.getElementById('db-ytd-pct');
  if (ytdPctEl) ytdPctEl.textContent = _pct(ytdPct);
  var ytdBar = document.getElementById('db-ytd-bar');
  if (ytdBar) ytdBar.style.width = ytdBarPct + '%';
  var ytdTxt = document.getElementById('db-ytd-text');
  if (ytdTxt) ytdTxt.textContent = _rp(ytdRev) + ' / ' + _rp(targetTahunan);
}

// ── Statistik Konversi ─────────────────────────────────────────
function _dbRenderKonversi(summary) {
  // Win rate berbasis KOHORT (deal dari penawaran yang dibuat periode ini /
  // total penawaran dibuat periode ini) — konsisten dgn win rate per-sales &
  // menghindari inflasi dari deal penawaran bulan lalu. Dihitung di backend.
  var winRate = (summary.teamWinRate != null) ? summary.teamWinRate : 0;
  var dealCount = summary.teamDealCount || 0;
  var revenue   = summary.teamRevenue || 0;
  var avgDeal   = dealCount > 0 ? Math.round(revenue / dealCount) : 0;

  var wrEl = document.getElementById('db-stat-winrate');
  if (wrEl) wrEl.textContent = _pct(winRate);
  var avgEl = document.getElementById('db-stat-avgdeal');
  if (avgEl) avgEl.textContent = avgDeal > 0 ? _rpShort(avgDeal) : '—';
  var avgMarginEl = document.getElementById('db-stat-avgmargin');
  if (avgMarginEl) avgMarginEl.textContent = dealCount > 0 ? _pct(summary.teamAvgMarginDeal) : '—';
  var avgCycleEl = document.getElementById('db-stat-avgcycle');
  if (avgCycleEl) avgCycleEl.textContent = (summary.teamAvgSalesCycle != null) ? (Math.round(summary.teamAvgSalesCycle) + ' hari') : '—';
}

// ── Trend Chart (line, Jan–Des tahun berjalan) ─────────────────
function _dbRenderTrend(items) {
  var canvas = document.getElementById('db-trend-chart');
  if (!canvas) return;
  if (_dbTrendChart) { _dbTrendChart.destroy(); _dbTrendChart = null; }

  var isAdmin = _currentUser && (_currentUser.role === 'admin' || _currentUser.role === 'owner');
  var now = new Date();
  var yr  = now.getFullYear();
  var mon = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var buckets = [];
  for (var mo = 0; mo < 12; mo++) {
    buckets.push({
      label: mon[mo],
      fromMs: new Date(yr, mo, 1).getTime(),
      toMs:   new Date(yr, mo + 1, 0, 23, 59, 59, 999).getTime(),
      rev: 0
    });
  }

  items.forEach(function(item) {
    if (item.status !== 'Deal') return;
    var ts = item.tanggalDeal || item.tanggal;
    if (!ts) return;
    buckets.forEach(function(b) {
      if (ts >= b.fromMs && ts <= b.toMs) b.rev += (item.nilaiKontrak !== undefined ? item.nilaiKontrak : item.grandTotal);
    });
  });

  var divisor = isAdmin ? 1e9 : 1e6;
  var unit    = isAdmin ? 'M' : 'Jt';
  var target  = isAdmin ? 2000000000 : 300000000;

  _dbTrendChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: buckets.map(function(b) { return b.label; }),
      datasets: [
        {
          label: 'Revenue',
          data: buckets.map(function(b) { return +(b.rev / divisor).toFixed(2); }),
          borderColor: '#3B82F6', backgroundColor: 'rgba(59,130,246,0.08)',
          fill: true, tension: 0.4,
          pointBackgroundColor: '#3B82F6', pointRadius: 3, borderWidth: 2
        },
        {
          label: 'Target',
          data: buckets.map(function() { return +(target / divisor).toFixed(2); }),
          borderColor: '#FB923C', borderDash: [5,4], borderWidth: 1.5,
          pointRadius: 0, fill: false
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) {
          return ' ' + ctx.dataset.label + ': Rp ' + ctx.parsed.y.toLocaleString('id-ID') + unit;
        }}}
      },
      scales: {
        x: { ticks: { font: { size: 10 }, color: '#94a3b8' }, grid: { display: false }, border: { display: false } },
        y: {
          ticks: { font: { size: 10 }, color: '#94a3b8', callback: function(v) { return 'Rp ' + v.toLocaleString('id-ID') + unit; } },
          grid: { color: 'rgba(148,163,184,0.15)' }, border: { display: false }
        }
      }
    }
  });
}

// ── Status Penawaran Donut (period-filtered) ───────────────────
function _dbRenderDonut(items, fromMs, toMs) {
  var counts = { 'On-Progress': 0, 'Deal': 0, 'Fail': 0 };
  var _inPeriode = function(ts) {
    if (fromMs && ts && ts < fromMs) return false;
    if (toMs   && ts && ts > toMs)   return false;
    return true;
  };
  items.forEach(function(item) {
    var st = item.status;
    if (counts[st] === undefined) return;
    // Deal dihitung berdasarkan TANGGAL DEAL agar konsisten dgn KPI "Total Deal"
    // & Revenue Deal. On-Progress/Fail tetap berdasarkan tanggal penawaran dibuat.
    var ts = (st === 'Deal') ? (item.tanggalDeal || item.tanggal) : item.tanggal;
    if (!_inPeriode(ts)) return;
    counts[st]++;
  });
  var onProg = counts['On-Progress'], won = counts['Deal'], fail = counts['Fail'];
  var total  = onProg + won + fail;
  var pct    = function(v) { return total > 0 ? Math.round(v / total * 100) : 0; };

  var canvas = document.getElementById('db-donut-chart');
  if (canvas) {
    if (_dbDonutChart) _dbDonutChart.destroy();
    _dbDonutChart = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: ['On-Progress', 'Deal', 'Fail'],
        datasets: [{ data: [onProg, won, fail],
          backgroundColor: ['#3B82F6','#10B981','#EF4444'],
          borderWidth: 0, hoverOffset: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function(ctx) { return ' ' + ctx.label + ': ' + ctx.raw + ' (' + pct(ctx.raw) + '%)'; } } }
        }
      }
    });
  }

  var legendData = [
    { label: 'On-Progress', count: onProg, color: '#3B82F6', bg: 'bg-blue-100',    text: 'text-blue-700'    },
    { label: 'Deal',        count: won,    color: '#10B981', bg: 'bg-emerald-100',  text: 'text-emerald-800' },
    { label: 'Fail',        count: fail,   color: '#EF4444', bg: 'bg-rose-100',     text: 'text-rose-700'    },
  ];
  var legendEl = document.getElementById('db-donut-legend');
  if (legendEl) {
    legendEl.innerHTML = legendData.map(function(l) {
      return '<div class="flex items-center justify-between text-xs">'
        + '<div class="flex items-center gap-2">'
        + '<span class="w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:' + l.color + '"></span>'
        + '<span class="text-slate-600">' + l.label + '</span></div>'
        + '<div class="flex items-center gap-2">'
        + '<span class="font-bold text-slate-800">' + l.count + '</span>'
        + '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ' + l.bg + ' ' + l.text + '">' + pct(l.count) + '%</span>'
        + '</div></div>';
    }).join('');
  }
}

// ── Channel Marketing Bar Chart ───────────────────────────────
var _CHANNEL_COLORS = {
  'Website':   '#6366F1',
  'Instagram': '#EC4899',
  'Tokopedia': '#10B981',
  'Relasi':    '#F59E0B',
  'Repeat':    '#3B82F6',
  'Lainnya':   '#94A3B8'
};
var _CHANNELS_ORDER = ['Website','Instagram','Tokopedia','Relasi','Repeat','Lainnya'];

// Status penawaran dipecah di chart channel: warna sama seperti chart status.
var _CH_STATUS = [
  { key: 'On-Progress', color: '#3B82F6' },
  { key: 'Deal',        color: '#10B981' },
  { key: 'Fail',        color: '#EF4444' }
];

function _dbRenderChannel(items, fromMs, toMs) {
  // Hitung jumlah penawaran per channel DIPECAH per status pada periode aktif.
  var counts = {};   // channel -> { 'On-Progress':n, 'Deal':n, 'Fail':n }
  (items || []).forEach(function(item) {
    var st = (item.status || 'On-Progress').toString();
    if (st !== 'Deal' && st !== 'Fail') st = 'On-Progress';
    // Deal berdasarkan tanggal deal (konsisten dgn KPI & pie Status Penawaran);
    // On-Progress/Fail berdasarkan tanggal penawaran dibuat.
    var ts = (st === 'Deal') ? (item.tanggalDeal || item.tanggal) : item.tanggal;
    if (fromMs && ts && ts < fromMs) return;
    if (toMs   && ts && ts > toMs)   return;
    var ch = (item.channelMarketing || '').trim() || 'Lainnya';
    if (!_CHANNELS_ORDER.includes(ch)) ch = 'Lainnya';
    if (!counts[ch]) counts[ch] = { 'On-Progress': 0, 'Deal': 0, 'Fail': 0 };
    counts[ch][st] += 1;
  });
  var _chTotal = function(c) { var o = counts[c] || {}; return (o['On-Progress'] || 0) + (o['Deal'] || 0) + (o['Fail'] || 0); };

  var labels = _CHANNELS_ORDER.filter(function(c) { return _chTotal(c) > 0; });
  var total  = labels.reduce(function(s, c) { return s + _chTotal(c); }, 0);

  var canvas = document.getElementById('db-channel-chart');
  if (canvas) {
    if (_dbChannelChart) { _dbChannelChart.destroy(); _dbChannelChart = null; }
    _dbChannelChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: _CH_STATUS.map(function(s) {
          return {
            label: s.key,
            data: labels.map(function(c) { return (counts[c] || {})[s.key] || 0; }),
            backgroundColor: s.color,
            borderRadius: 4,
            borderSkipped: false,
            barThickness: 22,
            stack: 'ch'
          };
        })
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                var chTot = _chTotal(ctx.label);
                var pct = chTot > 0 ? Math.round(ctx.raw / chTot * 100) : 0;
                return ' ' + ctx.dataset.label + ': ' + ctx.raw + ' (' + pct + '%)';
              },
              footer: function(items) {
                if (!items || !items.length) return '';
                return 'Total: ' + _chTotal(items[0].label) + ' penawaran';
              }
            }
          }
        },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 }, stepSize: 1, precision: 0 }, border: { display: false } },
          y: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 } }, border: { display: false } }
        }
      }
    });
  }

  var legendEl = document.getElementById('db-channel-legend');
  if (legendEl) {
    if (!labels.length) {
      legendEl.innerHTML = '<p class="text-xs text-slate-400 text-center">Tidak ada data</p>';
    } else {
      // Baris kunci warna status.
      var key = '<div class="flex items-center gap-3 flex-wrap pb-1.5 mb-1 border-b border-slate-100">'
        + _CH_STATUS.map(function(s) {
            return '<div class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm" style="background:' + s.color + '"></span>'
              + '<span class="text-[11px] text-slate-500">' + s.key + '</span></div>';
          }).join('')
        + '</div>';
      // Per channel: total + rincian per status.
      var rows = labels.map(function(c) {
        var o = counts[c] || {}, t = _chTotal(c);
        var pct = total > 0 ? Math.round(t / total * 100) : 0;
        var det = _CH_STATUS.map(function(s) {
          return '<span style="color:' + s.color + '">' + (o[s.key] || 0) + '</span>';
        }).join('<span class="text-slate-300">·</span>');
        return '<div class="flex items-center justify-between text-xs">'
          + '<span class="text-slate-600">' + c + '</span>'
          + '<span class="flex items-center gap-2"><span class="font-semibold">' + det + '</span>'
          + '<span class="font-bold text-slate-700 w-14 text-right">' + t + ' <span class="text-slate-400 font-normal">(' + pct + '%)</span></span></span>'
          + '</div>';
      }).join('');
      legendEl.innerHTML = key + rows;
    }
  }
}

// ── Faktor Win / Lost (kode + keterangan) ─────────────────────
function _dbAggWinLoss(salesList) {
  var win = {}, lost = {};
  (salesList || []).forEach(function(s) {
    var one = _dbAggWinLossOne(s);
    Object.keys(one.win).forEach(function(k) { win[k] = (win[k] || 0) + one.win[k]; });
    Object.keys(one.lost).forEach(function(k) { lost[k] = (lost[k] || 0) + one.lost[k]; });
  });
  return { win: win, lost: lost };
}

// Agregasi faktor Win/Lost untuk 1 sales
function _dbAggWinLossOne(s) {
  var win = {}, lost = {};
  ((s && s.penawaran) || []).forEach(function(p) {
    if (p.status === 'Deal' && p.kodeWin)  win[p.kodeWin]   = (win[p.kodeWin]   || 0) + 1;
    if (p.status === 'Fail' && p.kodeLost) lost[p.kodeLost] = (lost[p.kodeLost] || 0) + 1;
  });
  return { win: win, lost: lost };
}

// Render pie faktor win & lost untuk 1 sales (dipanggil saat detail terlihat)
function _dbRenderSalesFactorPie(idx, sales) {
  if (!sales) {
    var d = window._dbLastSalesData;
    sales = (d && d.salesList) ? d.salesList[idx] : null;
  }
  if (!sales) return;
  if (!document.getElementById('db-sfw-' + idx)) return; // blok faktor tidak dirender
  var agg = _dbAggWinLossOne(sales);
  if (!_dbSalesFactorCharts[idx]) _dbSalesFactorCharts[idx] = { win: null, lost: null };
  var st = _dbSalesFactorCharts[idx];
  _dbRenderFactorChart('db-sfw-' + idx, 'db-sfw-legend-' + idx, agg.win,
    (typeof KODE_WIN_LIST !== 'undefined' ? KODE_WIN_LIST : []), _DB_WIN_PALETTE,
    function(c) { if (st.win) { st.win.destroy(); st.win = null; } if (c) st.win = c; });
  _dbRenderFactorChart('db-sfl-' + idx, 'db-sfl-legend-' + idx, agg.lost,
    (typeof KODE_LOST_LIST !== 'undefined' ? KODE_LOST_LIST : []), _DB_LOST_PALETTE,
    function(c) { if (st.lost) { st.lost.destroy(); st.lost = null; } if (c) st.lost = c; });
}

function _dbRenderFactorChart(canvasId, legendId, counts, kodeList, palette, setChart) {
  palette = (palette && palette.length) ? palette : ['#64748B'];
  var rows = (kodeList || [])
    .filter(function(k) { return counts[k.kode] > 0; })
    .map(function(k) { return { kode: k.kode, label: k.label, count: counts[k.kode] }; })
    .sort(function(a, b) { return b.count - a.count; });
  var total = rows.reduce(function(s, r) { return s + r.count; }, 0);
  var sliceColors = rows.map(function(r, i) { return palette[i % palette.length]; });

  var canvas = document.getElementById(canvasId);
  if (canvas) {
    setChart(null, canvas);  // destroy previous instance
    if (rows.length) {
      var chart = new Chart(canvas, {
        type: 'pie',
        data: {
          labels: rows.map(function(r) { return r.kode; }),
          datasets: [{ data: rows.map(function(r) { return r.count; }),
            backgroundColor: sliceColors, borderColor: '#fff', borderWidth: 2 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: function(ctx) {
              var r = rows[ctx.dataIndex];
              var pct = total > 0 ? Math.round(r.count / total * 100) : 0;
              return ' ' + r.label + ': ' + r.count + ' (' + pct + '%)';
            }}}
          }
        }
      });
      setChart(chart, canvas);
    }
  }

  var legendEl = document.getElementById(legendId);
  if (legendEl) {
    if (!rows.length) {
      legendEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Belum ada data pada periode ini.</p>';
    } else {
      legendEl.innerHTML = rows.map(function(r, i) {
        var c = sliceColors[i];
        var pct = total > 0 ? Math.round(r.count / total * 100) : 0;
        return '<div class="flex items-center justify-between text-xs gap-2">'
          + '<div class="flex items-center gap-1.5 min-w-0">'
          + '<span class="w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:' + c + '"></span>'
          + '<span class="font-mono font-bold text-[10px] px-1.5 py-0.5 rounded flex-shrink-0" style="background:' + c + '22;color:' + c + '">' + r.kode + '</span>'
          + '<span class="text-slate-600 truncate">' + _esc(r.label) + '</span></div>'
          + '<span class="font-bold text-slate-700 flex-shrink-0">' + r.count + ' <span class="text-slate-400 font-normal">(' + pct + '%)</span></span>'
          + '</div>';
      }).join('');
    }
  }
}

function _dbRenderWinLossFactors(salesList) {

      + '<td class="px-3 py-2 text-xs text-slate-600 whitespace-nowrap text-center">' + (p.salesCycleDays != null ? (p.salesCycleDays + ' hari') : '—') + '</td>'
      + '</tr>';
  }).join('');
}

function _dbMiniKPI(label, val, cls) {

    + '<p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">' + label + '</p>'

function _dbToggleDetail(id) {
  var el   = document.getElementById(id);
  var icon = document.getElementById(id + '-icon');
  if (!el) return;
  var hidden = el.classList.toggle('hidden');
  if (icon) icon.style.transform = hidden ? '' : 'rotate(180deg)';
  // Detail per sales dibuka → render pie faktor win/lost (canvas kini punya ukuran)
  if (!hidden) {
    var mDet = id.match(/^db-detail-(\d+)$/);
    if (mDet) _dbRenderSalesFactorPie(parseInt(mDet[1], 10));
  }
}

// Warna badge umur sesuai klasifikasi aging (0-30 emerald, 31-60 blue,
// 61-90 amber, >90 rose) — konsisten dengan kartu Aging Pipeline.
function _dbAgingBadgeCls(umur) {
  if (umur <= 30) return 'bg-emerald-100 text-emerald-700';
  if (umur <= 60) return 'bg-blue-100 text-blue-700';
  if (umur <= 90) return 'bg-amber-100 text-amber-700';
  return 'bg-rose-100 text-rose-700';
}

// ── Pipeline Health (coverage + aging + stale) ─────────────────
// annualTarget & yearRevenue → coverage & sisa target berbasis TAHUNAN.
function _dbRenderPipelineHealth(ph, annualTarget, yearRevenue) {
  var section = document.getElementById('db-pipeline-health-section');
  if (!section) return;
  if (!ph) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');

  // Coverage & sisa target dihitung dari target tahunan − revenue tahun berjalan
  var sisaTarget     = Math.max(0, (annualTarget || 0) - (yearRevenue || 0));
  var targetTercapai = (annualTarget || 0) > 0 && sisaTarget <= 0;
  var coverage       = sisaTarget > 0 ? ((ph.pipelineValue || 0) / sisaTarget) : null;

  // --- Coverage ---
  var covVal  = document.getElementById('db-ph-coverage-val');
  var covSub  = document.getElementById('db-ph-coverage-sub');
  var covCard = document.getElementById('db-ph-coverage');
  var baseCard = 'rounded-xl p-4 border flex flex-col justify-between min-h-[92px] ';
  if (targetTercapai) {
    if (covVal) { covVal.textContent = 'Tercapai'; covVal.className = 'text-2xl font-extrabold leading-none my-1 text-emerald-600'; }
    if (covSub) covSub.textContent = 'target tahunan sudah terpenuhi';
    if (covCard) covCard.className = baseCard + 'bg-emerald-50/70 border-emerald-100/70';
  } else if (coverage == null) {
    if (covVal) { covVal.textContent = '—'; covVal.className = 'text-2xl font-extrabold leading-none my-1 tabular-nums text-slate-700'; }
    if (covSub) covSub.textContent = 'pipeline / sisa target tahunan';
    if (covCard) covCard.className = baseCard + 'bg-slate-50 border-slate-100';
  } else {
    var cov = coverage, color, bg, note;
    if (cov >= 3)        { color = 'text-emerald-600'; bg = 'bg-emerald-50/70 border-emerald-100/70'; note = 'sehat (≥3×)'; }
    else if (cov >= 1.5) { color = 'text-amber-600';   bg = 'bg-amber-50/70 border-amber-100/70';     note = 'cukup'; }
    else                 { color = 'text-rose-600';    bg = 'bg-rose-50/70 border-rose-100/70';       note = 'kurang (<1,5×)'; }
    if (covVal) { covVal.textContent = cov.toFixed(1).replace('.', ',') + '×'; covVal.className = 'text-2xl font-extrabold leading-none my-1 tabular-nums ' + color; }
    if (covSub) covSub.textContent = 'pipeline / sisa target tahunan — ' + note;
    if (covCard) covCard.className = baseCard + bg;
  }

  var pvEl = document.getElementById('db-ph-pipeline-val');
  if (pvEl) pvEl.textContent = _rpShort(ph.pipelineValue || 0);
  var pcEl = document.getElementById('db-ph-pipeline-count');
  if (pcEl) pcEl.textContent = (ph.pipelineCount || 0) + ' penawaran On-Progress';
  var stEl = document.getElementById('db-ph-sisatarget');
  if (stEl) stEl.textContent = targetTercapai ? 'Rp 0' : _rpShort(sisaTarget);

  // --- Aging buckets ---
  var agingWrap = document.getElementById('db-ph-aging');
  if (agingWrap) {
    var colorByIdx = ['text-emerald-600', 'text-blue-600', 'text-amber-600', 'text-rose-600'];
    var bgByIdx    = ['bg-emerald-50/60', 'bg-blue-50/60', 'bg-amber-50/60', 'bg-rose-50/60'];
    agingWrap.innerHTML = (ph.aging || []).map(function(b, i) {
      return '<div class="rounded-xl p-3 border border-slate-100 ' + (bgByIdx[i] || 'bg-slate-50') + '">'
        + '<p class="text-[10px] font-semibold text-slate-500 mb-1">' + b.label + '</p>'
        + '<p class="text-xl font-extrabold leading-none ' + (colorByIdx[i] || 'text-slate-700') + '">' + b.count + '</p>'
        + '<p class="text-[10px] text-slate-400 mt-1 leading-tight whitespace-nowrap">' + _rpShort(b.value || 0) + '</p>'
        + '</div>';
    }).join('');
  }

  // --- Stale / expired offers ---
  var head = document.getElementById('db-ph-stale-head');
  if (head) head.textContent = '(> ' + ph.staleDays + ' hari) — ' + (ph.staleCount || 0) + ' penawaran · ' + _rpShort(ph.staleValue || 0);
  var body = document.getElementById('db-ph-stale-body');
  if (body) {
    if (!ph.staleOffers || !ph.staleOffers.length) {
      body.innerHTML = '<div class="text-center text-xs text-slate-400 py-6 italic bg-slate-50 rounded-xl"><i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i>Tidak ada penawaran stale — pipeline sehat.</div>';
    } else {
      // Kelompokkan per sales
      var groups = {}, order = [];
      ph.staleOffers.forEach(function(o) {
        var key = o.sales || '(Tanpa sales)';
        if (!groups[key]) { groups[key] = { sales: key, offers: [], total: 0 }; order.push(key); }
        groups[key].offers.push(o);
        groups[key].total += (o.nilai || 0);
      });
      // Urutkan grup berdasarkan total nilai stale terbesar
      order.sort(function(a, b) { return groups[b].total - groups[a].total; });

      // Akun sales: tampilkan statis (tanpa accordion) agar konsisten dgn
      // "Detail Penawaran Saya". Admin/lead sales: tetap accordion per sales.
      var _role = (typeof _currentUser !== 'undefined' && _currentUser) ? (_currentUser.role || '') : '';
      var isSalesView = (_role !== 'admin' && _role !== 'owner' && _role !== 'leadsales');

      body.innerHTML = order.map(function(key, gi) {
        var g = groups[key];
        var accId = 'db-stale-' + gi;
        var open = isSalesView || (gi === 0); // sales: selalu terbuka; lainnya: grup teratas
        var rows = g.offers.map(function(o) {
          var umurCls = _dbAgingBadgeCls(o.umurHari);
          return '<tr class="hover:bg-slate-50 transition">'
            + '<td class="px-3 py-2 text-xs"><div class="font-mono text-slate-600">' + _esc(o.id) + '</div><div class="text-slate-400 mt-0.5">' + (o.tanggal || '—') + '</div></td>'
            + '<td class="px-3 py-2 text-xs"><div class="text-slate-400">' + _esc(o.klien || '-') + '</div><div class="text-slate-700 font-medium">' + _esc(o.project || '-') + '</div></td>'
            + '<td class="px-3 py-2 text-xs text-right text-slate-600 whitespace-nowrap">' + _rp(o.nilai || 0) + '</td>'
            + '<td class="px-3 py-2 text-center whitespace-nowrap"><span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ' + umurCls + '">' + o.umurHari + ' hari</span></td>'
            + '</tr>';
        }).join('');
        var headerInner = '<span class="text-xs font-bold text-slate-700 truncate"><i class="fa-solid fa-user text-[10px] text-slate-400 mr-1.5"></i>' + _esc(g.sales) + '</span>'
          + '<span class="flex items-center gap-2 flex-shrink-0">'
          + '<span class="text-[10px] font-semibold text-slate-400 whitespace-nowrap">' + g.offers.length + ' penawaran · ' + _rpShort(g.total) + '</span>'
          + (isSalesView ? '' : '<i id="' + accId + '-icon" class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform"' + (open ? ' style="transform:rotate(180deg)"' : '') + '></i>')
          + '</span>';
        var header = isSalesView
          ? '<div class="w-full flex items-center justify-between gap-2 px-4 py-2.5 bg-slate-50/70">' + headerInner + '</div>'
          : '<button type="button" onclick="_dbToggleDetail(\'' + accId + '\')" class="w-full flex items-center justify-between gap-2 px-4 py-2.5 text-left bg-slate-50/70 hover:bg-slate-100 transition focus:outline-none">' + headerInner + '</button>';
        return '<div class="border border-slate-150 rounded-xl overflow-hidden">'
          + header
          + '<div id="' + accId + '" class="' + (open ? '' : 'hidden ') + 'border-t border-slate-100 overflow-x-auto">'
          + '<table class="w-full text-left border-collapse">'
          + '<thead class="bg-slate-50 border-b border-slate-100"><tr>'
          + '<th class="text-xs font-bold text-slate-500 uppercase tracking-wider px-3 py-2 whitespace-nowrap">No Penawaran</th>'
          + '<th class="text-xs font-bold text-slate-500 uppercase tracking-wider px-3 py-2 whitespace-nowrap">Klien / Project</th>'
          + '<th class="text-xs font-bold text-slate-500 uppercase tracking-wider px-3 py-2 text-right whitespace-nowrap">Nilai</th>'
          + '<th class="text-xs font-bold text-slate-500 uppercase tracking-wider px-3 py-2 text-center whitespace-nowrap">Umur</th>'
          + '</tr></thead>'
          + '<tbody class="divide-y divide-slate-50">' + rows + '</tbody>'
          + '</table></div></div>';
      }).join('');
    }
  }
}

// ── Export PDF ─────────────────────────────────────────────────
window.exportDashboardPDF = function() {
  var data = window._dbLastSalesData;
  if (!data) { showNotification('Muat data terlebih dahulu.', 'error'); return; }
  try {
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var s = data.summary || {}, list = data.salesList || [];
    var PW = 210, ML = 14, MR = 14, CW = PW - ML - MR;
    var DARK  = [30,41,59], SLATE = [100,116,139], BLUE = [30,64,175];
    var GREEN = [5,150,105], AMBER = [180,120,20], RED = [190,30,45], WHITE = [255,255,255];
    var rp = function(v) { return 'Rp ' + Math.round(v||0).toLocaleString('id-ID'); };
    var pct= function(v) { return v != null ? Number(v).toFixed(1)+'%' : '-'; };

    // Label kode Win/Lost (dari master di JS_Form_Penawaran)
    var _winLbl = {}, _lostLbl = {};
    (typeof KODE_WIN_LIST  !== 'undefined' ? KODE_WIN_LIST  : []).forEach(function(k){ _winLbl[k.kode]  = k.label; });
    (typeof KODE_LOST_LIST !== 'undefined' ? KODE_LOST_LIST : []).forEach(function(k){ _lostLbl[k.kode] = k.label; });
    var _cycleDays = function(p, isWin) {
      var parse = function(d){ if(!d) return null; var x=d.toString().split('/'); if(x.length!==3) return null; var dt=new Date(+x[2],+x[1]-1,+x[0]); return isNaN(dt)?null:dt; };
      var a = parse(p.tanggal), b = parse(isWin ? p.tanggalDeal : p.tanggalFail);
      if (!a || !b) return '-';
      var days = Math.round((b - a) / 86400000);
      return (days >= 0 ? days : 0) + ' hari';
    };
    var _analisaTable = function(title, rows, isWin) {
      if (y > 248) { doc.addPage(); y = 14; }
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...(isWin?GREEN:RED));
      doc.text(title, ML+3, y); y += 2.5;
      doc.autoTable({
        startY: y, margin: { left:ML, right:MR },
        head: [['No','Project','Nilai','Sales Cycle', isWin?'Root Cause Win':'Root Cause Lost','Lesson Learned','Action']],
        body: rows.map(function(p, i) {
          var rc = isWin ? (_winLbl[p.kodeWin]||p.kodeWin||'-') : (_lostLbl[p.kodeLost]||p.kodeLost||'-');
          return [i+1, p.namaProject||'-', rp(p.nilaiKontrak!==undefined?p.nilaiKontrak:p.grandTotal), _cycleDays(p, isWin), rc, p.lessonLearned||'-', p.action||'-'];
        }),
        theme:'grid',
        headStyles: { fillColor: isWin?GREEN:RED, textColor:WHITE, fontStyle:'bold', fontSize:6.5, halign:'center' },
        bodyStyles: { fontSize:6.5, textColor:DARK, valign:'top' },
        columnStyles: { 0:{halign:'center',cellWidth:7}, 1:{cellWidth:24,fontStyle:'bold'}, 2:{halign:'right',cellWidth:22}, 3:{halign:'center',cellWidth:14}, 4:{cellWidth:24}, 5:{cellWidth:'auto'}, 6:{cellWidth:'auto'} },
        alternateRowStyles: { fillColor:[248,250,252] }
      });
      y = doc.lastAutoTable.finalY + 5;
    };

    // Header
    doc.setFillColor(30,41,59); doc.rect(0,0,PW,24,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text('LAPORAN PERFORMA SALES', ML, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(190,200,220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(170,195,255);
    doc.text('Periode:', PW-MR, 10, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setTextColor(255,255,255);
    doc.text((data.dateFrom||'') + ' s/d ' + (data.dateTo||''), PW-MR, 15, { align:'right' });
    doc.setFontSize(7); doc.setTextColor(190,200,220);
    doc.text('Dicetak: ' + _fmtDate(new Date()), PW-MR, 20, { align:'right' });

    var y = 30;

    // KPI Summary
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
    doc.text('RINGKASAN TIM', ML, y); y += 5;
    var kpiData = [
      { label:'Revenue Deal',     value:rp(s.teamRevenue),           color:GREEN },
      { label:'Penawaran Dibuat', value:String(s.teamPenawaran||0),  color:BLUE  },
      { label:'Total Deal',       value:String(s.teamDealCount||0),  color:DARK  },
      { label:'Win Rate Tim',     value:pct(s.teamWinRate),          color:DARK  },
      { label:'Pipeline Aktif',   value:rp(s.teamPipelineValue),     color:AMBER },
      { label:'Target Tim',       value:rp(s.teamTarget),            color:SLATE },
    ];
    var boxW = (CW-5)/3, boxH = 14, gap = 2.5;
    kpiData.forEach(function(k, i) {
      var col = i%3, row = Math.floor(i/3);
      var bx = ML + col*(boxW+gap), by = y + row*(boxH+gap);
      doc.setFillColor(248,250,252); doc.setDrawColor(226,232,240);
      doc.roundedRect(bx,by,boxW,boxH,2,2,'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...SLATE);
      doc.text(k.label.toUpperCase(), bx+3, by+4.5);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...k.color);
      doc.text(k.value, bx+3, by+10.5);
    });
    y += 2*(boxH+gap)+4;

    // Target bar
    var pctVal = s.teamTarget > 0 ? Math.min((s.teamRevenue/s.teamTarget)*100, 100) : 0;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...DARK);
    doc.text('Capaian Target Tim: ' + pct(s.teamTarget>0?(s.teamRevenue/s.teamTarget*100):0), ML, y);
    y += 3;
    doc.setFillColor(226,232,240); doc.roundedRect(ML,y,CW,4,1,1,'F');
    if (pctVal > 0) { doc.setFillColor(...GREEN); doc.roundedRect(ML,y,CW*pctVal/100,4,1,1,'F'); }
    y += 8;

    // Leaderboard
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
    doc.text('LEADERBOARD SALES', ML, y); y += 3;
    doc.autoTable({
      startY: y, margin: { left:ML, right:MR },
      head: [['#','Nama Sales','Penawaran','Nilai Total','Deal','Revenue Deal','Win Rate','Target','Capaian']],
      body: list.map(function(s, i) {
        return [i+1, s.nama, s.totalPenawaran, rp(s.totalNilaiPenawaran), s.dealCount, rp(s.dealRevenue), pct(s.winRate), s.targetBulanan>0?rp(s.targetBulanan):'-', s.achievement!=null?pct(s.achievement):'No Target'];
      }),
      theme:'grid',
      headStyles: { fillColor:BLUE, textColor:WHITE, fontStyle:'bold', fontSize:7, halign:'center' },
      bodyStyles: { fontSize:7, textColor:DARK },
      columnStyles: { 0:{halign:'center',cellWidth:8}, 1:{fontStyle:'bold',cellWidth:32}, 2:{halign:'center',cellWidth:18}, 3:{halign:'right',cellWidth:28}, 4:{halign:'center',cellWidth:12}, 5:{halign:'right',fontStyle:'bold',cellWidth:28}, 6:{halign:'center',cellWidth:16}, 7:{halign:'right',cellWidth:24}, 8:{halign:'center',cellWidth:18} },
      alternateRowStyles: { fillColor:[248,250,252] },
      didParseCell: function(d) {
        if (d.section==='body' && d.column.index===8 && d.row.index<list.length) {
          var ach = list[d.row.index].achievement;
          if (ach>=100) d.cell.styles.textColor=GREEN; else if (ach>=50) d.cell.styles.textColor=BLUE; else if (ach!=null) d.cell.styles.textColor=RED;
        }
        if (d.section==='body' && d.column.index===5) d.cell.styles.textColor=GREEN;
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    // Per-sales detail
    list.forEach(function(sales) {
      if (y > 250) { doc.addPage(); y = 14; }
      doc.setFillColor(241,245,249); doc.setDrawColor(226,232,240);
      doc.roundedRect(ML,y,CW,10,2,2,'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...DARK);
      doc.text(sales.nama, ML+3, y+6.5);
      var rt = rp(sales.dealRevenue) + '   WR ' + pct(sales.winRate) + (sales.achievement!=null? '   Capaian ' + pct(sales.achievement) : '');
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...SLATE);
      doc.text(rt, ML+CW-2, y+6.5, { align:'right' }); y += 12;

      if (!sales.penawaran || !sales.penawaran.length) {
        doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(...SLATE);
        doc.text('Tidak ada penawaran dalam periode ini.', ML+3, y); y += 6; return;
      }
      doc.autoTable({
        startY: y, margin: { left:ML, right:MR },
        head: [['No Penawaran','Klien','Project','Nilai','Margin','Tanggal','Status','Tgl Deal']],
        body: sales.penawaran.map(function(p) { return [p.id, p.namaKlien||'-', p.namaProject||'-', rp(p.nilaiKontrak !== undefined ? p.nilaiKontrak : p.grandTotal), pct(p.marginPersen), p.tanggal||'-', p.status, p.tanggalDeal||'-']; }),
        theme:'grid',
        headStyles: { fillColor:[51,65,85], textColor:WHITE, fontStyle:'bold', fontSize:6.5, halign:'center' },
        bodyStyles: { fontSize:6.5, textColor:DARK },
        columnStyles: { 0:{cellWidth:30}, 1:{cellWidth:20}, 2:{cellWidth:40}, 3:{halign:'right',cellWidth:24}, 4:{halign:'center',cellWidth:16}, 5:{halign:'center',cellWidth:18}, 6:{halign:'center',cellWidth:18}, 7:{halign:'center',cellWidth:18} },
        alternateRowStyles: { fillColor:[248,250,252] },
        didParseCell: function(d) {
          if (d.section==='body' && d.column.index===6) {
            var st = d.cell.raw;
            d.cell.styles.textColor = st==='Deal'?GREEN : st==='Fail'?RED : BLUE;
            d.cell.styles.fontStyle = 'bold';
          }
          if (d.section==='body' && d.column.index===4) {
            d.cell.styles.textColor = (d.cell.raw && parseFloat(d.cell.raw) < 25) ? RED : GREEN;
            d.cell.styles.fontStyle = 'bold';
          }
        }
      });
      y = doc.lastAutoTable.finalY + 5;
    });

    // ── Analisa Win & Lost (section tersendiri di bagian akhir) ──
    var adaAnalisa = list.some(function(s){ return (s.penawaran||[]).some(function(p){ return (p.status==='Deal'&&p.kodeWin)||(p.status==='Fail'&&p.kodeLost); }); });
    if (adaAnalisa) {
      y += 8;
      if (y > 255) { doc.addPage(); y = 14; }   // lanjut di halaman yang sama, pindah hanya bila mepet bawah
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...DARK);
      doc.text('ANALISA WIN & LOST', ML, y); y += 6;
      list.forEach(function(sales) {
        var pw = sales.penawaran || [];
        var winRows  = pw.filter(function(p){ return p.status==='Deal' && p.kodeWin; });
        var lostRows = pw.filter(function(p){ return p.status==='Fail' && p.kodeLost; });
        if (winRows.length)  _analisaTable('ANALISA WIN — ' + sales.nama,  winRows,  true);
        if (lostRows.length) _analisaTable('ANALISA LOST — ' + sales.nama, lostRows, false);
      });
    }

    var totalPages = doc.internal.getNumberOfPages();
    for (var i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...SLATE);
      doc.text('Halaman ' + i + ' / ' + totalPages, PW/2, 292, { align:'center' });
      doc.text('PT. RENUS GLOBAL INDONESIA — KONFIDENSIAL', ML, 292);
    }
    var fname = 'Dashboard_Sales_' + (data.dateFrom||'').replace(/\//g,'') + '-' + (data.dateTo||'').replace(/\//g,'') + '.pdf';
    doc.save(fname);
    showNotification('PDF berhasil diunduh!');
  } catch(e) {
    showNotification('Gagal export PDF: ' + e.message, 'error');
  }
};

// ── Tooltip for KPI info icons ─────────────────────────────────
document.addEventListener('mouseover', function(e) {
  var trigger = e.target.closest('.db-tooltip-trigger');
  var tip = document.getElementById('db-tooltip');
  if (!trigger || !tip) return;
  tip.innerText = trigger.dataset.tip || '';
  tip.classList.remove('hidden');
});
document.addEventListener('mousemove', function(e) {
  var tip = document.getElementById('db-tooltip');
  if (!tip || tip.classList.contains('hidden')) return;
  var x = e.clientX + 12, y = e.clientY + 12;
  tip.style.left = (x + 260 > window.innerWidth ? e.clientX - 270 : x) + 'px';
  tip.style.top  = y + 'px';
});
document.addEventListener('mouseout', function(e) {
  var trigger = e.target.closest('.db-tooltip-trigger');
  var tip = document.getElementById('db-tooltip');
  if (trigger && tip) tip.classList.add('hidden');
});
</script>
