      <section id="page-laporanprofitabilitas" class="page-section">

        <!-- ── Header ── -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 gap-4">
          <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Laporan Profit Project</h2>
          </div>
          <button onclick="exportLaporanProfitPDF()" title="Export PDF"
            class="flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition whitespace-nowrap">
            <i class="fa-solid fa-file-pdf text-xs"></i> Export PDF
          </button>
        </div>

        <!-- ── Filter Tahun ── -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-150 px-4 py-3 mb-5 flex items-center gap-3">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">
            <i class="fa-solid fa-calendar mr-1 text-blue-500"></i> Tahun
          </span>
          <select id="lp-tahun" onchange="loadLaporanProfitabilitas()"
            class="text-sm border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white"></select>
        </div>

        <!-- ── Summary Cards ── -->
        <div id="lp-summary-cards" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Nilai Kontrak</p>
            <p id="lp-card-kontrak" class="text-2xl font-extrabold text-slate-800">—</p>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Realisasi HPP</p>
            <p id="lp-card-hpp" class="text-2xl font-extrabold text-slate-800">—</p>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Rata-rata Margin Realisasi</p>
            <p id="lp-card-margin" class="text-2xl font-extrabold text-slate-800">—</p>
          </div>
        </div>

        <!-- Tabel Profitabilitas per WO -->
        <div id="lp-tab-profit" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse" style="min-width:900px">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                  <th class="p-4">No WO / Tanggal</th>
                  <th class="p-4">Customer / Project</th>
                  <th class="p-4 text-right">Nilai Kontrak</th>
                  <th class="p-4 text-right">Est. HPP</th>
                  <th class="p-4 text-right">Real. HPP</th>
                  <th class="p-4 text-right">Selisih</th>
                  <th class="p-4 text-right">Margin Est.</th>
                  <th class="p-4 text-right">Margin Real.</th>
                  <th class="p-4 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="lp-table-profit" class="text-sm divide-y divide-slate-100">
                <tr><td colspan="9" class="p-8 text-center text-slate-400">Muat data untuk melihat laporan.</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>
