<script>
// ============================================================================
//  GENERATOR PDF SISI KLIEN — Quotation / Invoice / Kwitansi / PO
//  Render langsung dari data Supabase memakai jsPDF (+autoTable), TANPA template
//  Google Sheets / Apps Script. Layout & warna mengikuti spesifikasi template.
// ============================================================================

// Logo RENUS (data URI PNG) — disuntik build.mjs dari assets/renus-logo.png.
// Kalau file belum diupload, token tetap literal → dipakai fallback vektor.
window.RENUS_LOGO_B64 = '__RENUS_LOGO_DATA_URI__';

// Identitas perusahaan — sumber: template terbaru.
var PDF_PERUSAHAAN = {
  nama:    'PT. RENUS GLOBAL INDONESIA',
  alamat1: 'Penjaringan Asri X PS1 H/5, Kel. Penjaringan Sari',
  alamat2: 'Kec. Rungkut, Kota Surabaya 60293',
  email:   'Email : admin@renergynusantara | renergynusantara@gmail.com',
  telp:    'Telp : 0853-8555-8025 | 0814-1225-0644'
};

// ── Palet & tipografi (spesifikasi user) ──
var PDF_FONT       = 'Roboto';   // Google Sans → Roboto (subset, di PdfFont_Roboto.html)
var PDF_FS         = 8;             // seluruh teks (compact)
var PDF_FS_TITLE   = 26;            // judul "Quotation"/"INVOICE" dst
var PDF_FS_COMPANY = 12;            // "PT. RENUS GLOBAL INDONESIA"
var PDF_TEXT       = [0, 0, 0];     // #000000 teks utama
var PDF_TITLE_COL  = [102, 102, 102]; // #666666 judul kanan
var PDF_LINK       = [17, 85, 204]; // #1155cc teks link (email)
var PDF_WHITE      = [255, 255, 255];
var PDF_HDR_BG     = [11, 83, 148]; // #0b5394 bar "Quotation To"/"Invoice to"/header tabel
var PDF_CLIENT_BG  = [243, 243, 243]; // #f3f3f3 area data klien
var PDF_GROUP_BG   = [217, 217, 217]; // #d9d9d9 header grup item & header T&C item
var PDF_ROW_BG     = [243, 243, 243]; // #f3f3f3 baris item & T&C item
var PDF_BLUE       = PDF_HDR_BG;     // alias kompatibilitas

function _pdfRp(v) { return Math.round(Math.abs(Number(v) || 0)).toLocaleString('id-ID'); }
function _pdfNamaFile(s) { return String(s || 'dokumen').replace(/[\\/:*?"<>|]+/g, '-') + '.pdf'; }

// Tanggal panjang Indonesia: "01 Januari 2026". Terima dd/MM/yyyy | yyyy-MM-dd.
function _pdfTglPanjang(v) {
  if (!v) return '';
  var s = String(v).trim(), d, m, y;
  var a = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  var b = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (a) { d = +a[1]; m = +a[2]; y = +a[3]; }
  else if (b) { d = +b[3]; m = +b[2]; y = +b[1]; }
  else { return s; }
  var B = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  if (m < 1 || m > 12) return s;
  return (d < 10 ? '0' + d : '' + d) + ' ' + B[m - 1] + ' ' + y;
}

// Logo: pakai PNG bila tersedia (jaga rasio), else fallback vektor panel surya.
function _pdfDrawLogo(doc, x, y) {
  var b = window.RENUS_LOGO_B64;
  if (b && String(b).indexOf('data:image') === 0) {
    try {
      var p = doc.getImageProperties(b);
      var w = 46, h = w * (p.height / p.width);
      doc.addImage(b, 'PNG', x, y, w, h);
      return;
    } catch (e) { console.warn('[pdf] logo PNG gagal, pakai vektor:', e); }
  }
  // Fallback vektor: 2 kolom × 3 baris sel jajar-genjang navy + wordmark "RENUS".
  var cellW = 3.6, cellH = 3.6, shear = 1.5, gapX = 1.0, gapY = 1.0;
  doc.setFillColor(32, 45, 92);
  for (var r = 0; r < 3; r++) {
    for (var c = 0; c < 2; c++) {
      var cx = x + c * (cellW + gapX) + (2 - r) * (shear * 0.5);
      var cy = y + r * (cellH + gapY);
      doc.lines([[cellW, 0], [-shear, cellH], [-cellW, 0]], cx, cy, [1, 1], 'F', true);
    }
  }
  doc.setTextColor(30, 136, 229);
  doc.setFont(PDF_FONT, 'bold');
  doc.setFontSize(24);
  doc.text('RENUS', x + 2 * cellW + shear + gapX + 3, y + 2 * cellH + 1);
}

// Header kiri: logo + blok perusahaan. Balikan: y setelah blok (mm).
function _pdfHeaderKiri(doc, ML) {
  _pdfDrawLogo(doc, ML, 7);
  doc.setTextColor(0, 0, 0);
  doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS_COMPANY);
  doc.text(PDF_PERUSAHAAN.nama, ML, 20);
  doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS);
  doc.text(PDF_PERUSAHAAN.alamat1, ML, 25);
  doc.text(PDF_PERUSAHAAN.alamat2, ML, 29);
  doc.setTextColor(PDF_LINK[0], PDF_LINK[1], PDF_LINK[2]);
  doc.text(PDF_PERUSAHAAN.email, ML, 33);
  doc.setTextColor(0, 0, 0);
  doc.text(PDF_PERUSAHAAN.telp, ML, 37);
  return 41;
}

// Judul besar kanan-atas.
function _pdfJudulKanan(doc, teks, PW, MR, opt) {
  opt = opt || {};
  var col = opt.color || PDF_TITLE_COL;
  doc.setTextColor(col[0], col[1], col[2]);
  doc.setFont(PDF_FONT, opt.style || 'bold');
  doc.setFontSize(opt.size || PDF_FS_TITLE);
  doc.text(teks, PW - MR, opt.y || 22, { align: 'right' });
}

// Baris info kanan (label bold + value), rata kanan.
function _pdfInfoKanan(doc, rows, PW, MR, startY, gap) {
  gap = gap || 4.0;
  var sx = PW - MR - 36;   // titik pisah: label rata kanan di sx, value rata kiri dari sx (mepet kanan)
  rows.forEach(function (r, i) {
    var y = startY + i * gap;
    doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
    doc.setFont(PDF_FONT, 'bold');
    doc.text(String(r[0]), sx - 2, y, { align: 'right' });
    doc.setFont(PDF_FONT, 'normal');
    doc.text(String(r[1] == null ? '' : r[1]), sx + 2, y, { align: 'left' });
  });
}

// Bar judul seksi (mis. "Invoice to") latar #0b5394 teks putih.
function _pdfBarSeksi(doc, teks, ML, CW, y) {
  doc.setFillColor(PDF_HDR_BG[0], PDF_HDR_BG[1], PDF_HDR_BG[2]);
  doc.rect(ML, y, CW, 5, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
  doc.text(teks, ML + 2, y + 3.4);
  return y + 5;
}

function _pdfKlien(id) {
  return (((window.erpState && erpState.klien) || []).filter(function (k) { return k.id === id; })[0]) || {};
}

// Normalisasi rincian item (grouped ATAU flat) → baris autoTable.
function _pdfBarisItem(rincian) {
  var body = [], groups = Array.isArray(rincian) ? rincian : [];
  var isGroup = groups.some(function (g) { return g && (g.subItems || g.items) && (g.namaKelompok || g.nama); });
  function baris(no, s) {
    var desk = s.deskripsi || s.nama || s.namaItem || s.description || '';
    var qty = s.qty != null ? s.qty : '';
    var unit = s.unit || s.satuan || '';
    var harga = s.harga != null ? s.harga : (s.hargaSatuan != null ? s.hargaSatuan : (s.price != null ? s.price : 0));
    var total = s.total != null ? s.total : (s.amount != null ? s.amount : (s.jumlah != null ? s.jumlah : (Number(harga) * Number(qty || 0))));
    return [
      { content: no == null ? '' : String(no), styles: { halign: 'center' } },
      { content: String(desk) },
      { content: qty === '' ? '' : String(qty), styles: { halign: 'center' } },
      { content: String(unit), styles: { halign: 'center' } },
      { content: harga ? _pdfRp(harga) : '', styles: { halign: 'right' } },
      { content: total ? _pdfRp(total) : '', styles: { halign: 'right' } }
    ];
  }
  if (isGroup) {
    groups.forEach(function (g, gi) {
      var sub = g.subItems || g.items || [];
      var gh = { fillColor: PDF_GROUP_BG, textColor: PDF_TEXT, fontStyle: 'bold' };
      body.push([
        { content: String.fromCharCode(65 + gi), styles: gh },
        { content: g.namaKelompok || g.nama || '', styles: gh },
        { content: '', styles: { fillColor: PDF_GROUP_BG } },
        { content: '', styles: { fillColor: PDF_GROUP_BG } },
        { content: '', styles: { fillColor: PDF_GROUP_BG } },
        { content: g.subtotal ? _pdfRp(g.subtotal) : '', styles: { fillColor: PDF_GROUP_BG, textColor: PDF_TEXT, fontStyle: 'bold', halign: 'right' } }
      ]);
      sub.forEach(function (s, si) { body.push(baris(si + 1, s)); });
    });
  } else {
    groups.forEach(function (s, i) { body.push(baris(i + 1, s)); });
  }
  return body;
}

// Tabel item standar (No/Description/Qty/Unit/Price/Amount).
function _pdfTabelItem(doc, startY, rincian, ML, MR) {
  doc.autoTable({
    startY: startY,
    head: [[
      { content: 'No.', styles: { halign: 'center' } },
      { content: 'Description', styles: { halign: 'left' } },
      { content: 'Qty', styles: { halign: 'center' } },
      { content: 'Unit', styles: { halign: 'center' } },
      { content: 'Price (IDR)', styles: { halign: 'center' } },
      { content: 'Amount (IDR)', styles: { halign: 'center' } }
    ]],
    body: _pdfBarisItem(rincian),
    theme: 'grid',
    margin: { left: ML, right: MR },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' },
      2: { cellWidth: 14, halign: 'center' }, 3: { cellWidth: 14, halign: 'center' },
      4: { cellWidth: 30, halign: 'right' }, 5: { cellWidth: 30, halign: 'right' }
    },
    headStyles: { fillColor: PDF_HDR_BG, textColor: PDF_WHITE, fontStyle: 'bold', fontSize: PDF_FS, lineColor: PDF_WHITE, lineWidth: 0 },
    bodyStyles: { fontSize: PDF_FS, textColor: PDF_TEXT, fillColor: PDF_ROW_BG, lineColor: [255, 255, 255], lineWidth: 0, cellPadding: 1.1 },
    styles: { overflow: 'linebreak', cellPadding: 1.1, lineWidth: 0 },
    didDrawCell: function (data) {
      // Hanya border kanan tiap sel (pemisah kolom) — putih tipis.
      doc.setDrawColor(255, 255, 255);
      doc.setLineWidth(0.4);
      var rx = data.cell.x + data.cell.width;
      doc.line(rx, data.cell.y, rx, data.cell.y + data.cell.height);
    }
  });
  return doc.lastAutoTable.finalY;
}

// Blok ringkasan (DPP/PPN/Total) kanan bawah.
function _pdfRingkasan(doc, startY, lines, PW, MR) {
  var colLabelX = PW - MR - 60, colValX = PW - MR, rowH = 5;
  var boxW = (PW - MR) - colLabelX, totalH = lines.length * rowH + 1.5, sy = startY;
  lines.forEach(function (row, idx) {
    var ry = sy + idx * rowH;
    var bg = row.highlight ? PDF_GROUP_BG : PDF_ROW_BG;   // grand total #d9d9d9, lain #f3f3f3
    doc.setFillColor(bg[0], bg[1], bg[2]);
    doc.rect(colLabelX, ry, boxW, rowH, 'F');
    doc.setFontSize(PDF_FS);
    doc.setFont(PDF_FONT, row.bold ? 'bold' : 'normal');
    doc.setTextColor(0, 0, 0);
    doc.text(row.label, colLabelX + 2.5, ry + 3.4);
    doc.text(row.value, colValX - 2, ry + 3.4, { align: 'right' });
  });
  return sy + totalH + 3;
}

// Pipeline akhir: doc → bytes → (opsional merge T&C) → preview + simpan aktif.
async function _pdfFinishPreview(doc, fileName, opts) {
  opts = opts || {};
  try {
    var bytes = new Uint8Array(doc.output('arraybuffer'));
    if (opts.mergeTC && Array.isArray(opts.kelompokList) && typeof _mergePdfDenganTC === 'function') {
      try { bytes = await _mergePdfDenganTC(bytes, opts.kelompokList); }
      catch (e) {
        console.warn('[pdf] merge T&C gagal:', e);
        if (typeof showNotification === 'function') showNotification('Lampiran T&C gagal dimuat — PDF tampil tanpa T&C.', 'error');
      }
    }
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    _activePdfBase64 = btoa(bin);
    _activePdfName = fileName;
    renderPDFDariBase64(_activePdfBase64);
  } catch (err) {
    console.error('[pdf] gagal:', err);
    var l = document.getElementById('preview-pdf-loading');
    if (l) l.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-400 text-2xl mb-2"></i>' +
      '<p class="text-sm text-rose-400 text-center px-4">Gagal membuat PDF: ' + ((err && err.message) || err) + '</p>' +
      '<button onclick="tutupPreviewPDF()" class="mt-4 px-4 py-2 bg-slate-200 rounded-xl text-sm font-bold text-slate-600">Tutup</button>';
  }
}

function _pdfBukaPreview(judul, subjudul) {
  var t = document.getElementById('preview-pdf-title'); if (t) t.innerText = judul || 'Preview';
  var s = document.getElementById('preview-pdf-subtitle'); if (s) s.innerText = subjudul || '';
  var l = document.getElementById('preview-pdf-loading');
  if (l) { l.classList.remove('hidden'); l.innerHTML = '<div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-300 border-t-blue-500"></div><p class="text-sm font-medium">Membuat preview...</p>'; }
  var w = document.getElementById('preview-pdf-canvas-wrap'); if (w) { w.classList.add('hidden'); w.innerHTML = ''; }
  var m = document.getElementById('modal-preview-pdf'); if (m) m.classList.remove('hidden');
}

// ── INVOICE: keterangan pembayaran + tabel item (billing + deskripsi scope) ──
function _pdfKetInvoice(item, nilaiKontrak) {
  var totalKontrakStr = 'Rp ' + _pdfRp(nilaiKontrak);
  var jenis = (item.jenis || 'Penuh').toString();
  var persen = Number(item.persen) || 0;
  if (jenis === 'Pelunasan') return 'Pelunasan dari total kontrak ' + totalKontrakStr;
  if (jenis === 'Penuh') return 'Pembayaran penuh dari total kontrak ' + totalKontrakStr;
  var label = (jenis === 'DP') ? 'DP' : 'Termin';
  var persenStr = persen > 0 ? (' ' + persen + '%') : '';
  return label + persenStr + ' dari total kontrak ' + totalKontrakStr;
}

// Tabel item invoice: baris A (tagihan) + keterangan termin + "Deskripsi:" +
// scope per-kelompok (nama biru) dgn item (qty/unit, tanpa harga).
function _pdfTabelInvoice(doc, startY, item, ML, MR) {
  var meta = {};
  try { meta = JSON.parse(item.items || '{}'); } catch (e) { meta = {}; }
  if (Array.isArray(meta)) meta = { scope: meta, nilaiKontrak: 0 };
  var scope = Array.isArray(meta.scope) ? meta.scope : [];
  var BLUE_K = [26, 58, 143];
  var body = [];

  body.push([
    { content: 'A', styles: { fontStyle: 'bold', halign: 'center' } },
    { content: item.namaProject || '', styles: { fontStyle: 'bold' } },
    { content: '1', styles: { halign: 'center' } },
    { content: 'Ls', styles: { halign: 'center' } },
    { content: _pdfRp(item.dpp), styles: { halign: 'right' } },
    { content: _pdfRp(item.dpp), styles: { halign: 'right' } }
  ]);
  body.push([{ content: '' }, { content: _pdfKetInvoice(item, Number(meta.nilaiKontrak) || 0), colSpan: 5 }]);
  body.push([{ content: '', colSpan: 6, styles: { minCellHeight: 1.5, fillColor: PDF_ROW_BG } }]);
  body.push([{ content: '' }, { content: 'Deskripsi:', colSpan: 5, styles: { fontStyle: 'bold' } }]);
  var _spacer = function () { return [{ content: '', colSpan: 6, styles: { minCellHeight: 2.6, fillColor: PDF_ROW_BG } }]; };
  scope.forEach(function (k) {
    var namaK = (k.namaKelompok || k.nama || '').toString();
    if (namaK) {
      body.push([{ content: '' }, { content: namaK.toUpperCase(), colSpan: 5, styles: { fontStyle: 'bold', textColor: BLUE_K } }]);
    }
    (k.subItems || k.items || []).forEach(function (s) {
      body.push([
        { content: '' },
        { content: s.deskripsi || s.nama || '' },
        { content: (s.qty != null && s.qty !== '') ? String(s.qty) : '', styles: { halign: 'center' } },
        { content: s.unit || s.satuan || '', styles: { halign: 'center' } },
        { content: '' },
        { content: '' }
      ]);
    });
  });

  // Jarak 1 baris di atas (setelah header) dan di bawah (sebelum garis tutup kotak).
  body.unshift(_spacer());
  body.push(_spacer());

  // Batas kolom internal (absolut) untuk garis pemisah putih full atas-bawah.
  var tableW = 210 - ML - MR;
  var autoW  = tableW - (10 + 14 + 14 + 30 + 30);
  var bx = [ML + 10, ML + 10 + autoW, ML + 10 + autoW + 14, ML + 10 + autoW + 28, ML + 10 + autoW + 58];

  doc.autoTable({
    startY: startY,
    head: [[
      { content: 'No', styles: { halign: 'center' } },
      { content: 'Description', styles: { halign: 'left' } },
      { content: 'Qty', styles: { halign: 'center' } },
      { content: 'Unit', styles: { halign: 'center' } },
      { content: 'Price (IDR)', styles: { halign: 'center' } },
      { content: 'Amount (IDR)', styles: { halign: 'center' } }
    ]],
    body: body,
    theme: 'grid',
    margin: { left: ML, right: MR },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 'auto' },
      2: { cellWidth: 14, halign: 'center' }, 3: { cellWidth: 14, halign: 'center' },
      4: { cellWidth: 30, halign: 'right' }, 5: { cellWidth: 30, halign: 'right' }
    },
    headStyles: { fillColor: PDF_HDR_BG, textColor: PDF_WHITE, fontStyle: 'bold', fontSize: PDF_FS, lineColor: PDF_WHITE, lineWidth: 0 },
    bodyStyles: { fontSize: PDF_FS, textColor: PDF_TEXT, fillColor: PDF_ROW_BG, lineWidth: 0, cellPadding: { top: 0.7, right: 1.1, bottom: 0.7, left: 1.1 } },
    styles: { overflow: 'linebreak', cellPadding: 1.1, lineWidth: 0 },
    didDrawCell: function (data) {
      // Garis pemisah kolom putih TIPIS & FULL: tiap sel gambar setiap batas kolom
      // yang jatuh dalam rentang-x sel ini (menutup sel biasa & sel colSpan),
      // sepanjang tinggi sel → sambung antar-baris, tak putus di baris colSpan.
      doc.setDrawColor(255, 255, 255);
      doc.setLineWidth(0.3);
      var x0 = data.cell.x - 0.4, x1 = data.cell.x + data.cell.width + 0.4;
      for (var i = 0; i < bx.length; i++) {
        if (bx[i] >= x0 && bx[i] <= x1) {
          doc.line(bx[i], data.cell.y, bx[i], data.cell.y + data.cell.height);
        }
      }
    }
  });
  return doc.lastAutoTable.finalY;
}

// Kotak 2 kolom (Notes | Bank Account) khusus invoice: header biru (spt header
// item) + isi latar abu (spt baris item), dgn pemisah kolom putih tipis.
function _pdfNoteBankInvoice(doc, y, noteText, bankText, ML, CW) {
  var BLUE = PDF_HDR_BG, half = CW / 2, pad = 2, headH = 5, lineH = 4;
  // Header
  doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]);
  doc.rect(ML, y, CW, headH, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
  doc.text('Notes', ML + pad, y + 3.4);
  doc.text('Bank Account', ML + half + pad, y + 3.4);
  doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.3);
  doc.line(ML + half, y, ML + half, y + headH);
  y += headH;
  // Isi
  var noteLines = noteText ? doc.splitTextToSize(String(noteText), half - pad * 2) : [];
  var bankLines = bankText ? doc.splitTextToSize(String(bankText), half - pad * 2) : [];
  var rows = Math.max(noteLines.length, bankLines.length, 1);
  var bodyH = rows * lineH + 3;
  doc.setFillColor(PDF_ROW_BG[0], PDF_ROW_BG[1], PDF_ROW_BG[2]);
  doc.rect(ML, y, CW, bodyH, 'F');
  doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.3);
  doc.line(ML + half, y, ML + half, y + bodyH);
  doc.setTextColor(0, 0, 0); doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS);
  if (noteLines.length) doc.text(noteLines, ML + pad, y + 3.4);
  if (bankLines.length) doc.text(bankLines, ML + half + pad, y + 3.4);
  return y + bodyH;
}

// Blok tanda tangan kanan-bawah: "Hormat kami," + gambar ttd (dari setting) +
// nama (bold, garis bawah) + jabatan. Gambar & flag aktif dari getDocSignConfig.
function _pdfTtdInvoice(doc, y, PW, MR) {
  var cfg = window._pdfSignCfg || {};
  if (cfg.sigEnabled === false) return y;
  var rightX = PW - MR;
  y += 6;
  doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
  doc.text('Hormat kami,', rightX, y, { align: 'right' });
  var imgH = 0;
  if (cfg.sigBase64) {
    try {
      var dataUri = String(cfg.sigBase64).indexOf('data:') === 0 ? cfg.sigBase64 : ('data:image/png;base64,' + cfg.sigBase64);
      var p = doc.getImageProperties(dataUri);
      var h = 20, w = h * (p.width / p.height);
      if (w > 55) { w = 55; h = w * (p.height / p.width); }
      doc.addImage(dataUri, 'PNG', rightX - w, y + 2, w, h);
      imgH = h;
    } catch (e) { console.warn('[pdf] ttd invoice gagal:', e); }
  }
  var nameY = y + 2 + (imgH || 16) + 4;
  var nama = 'Nur Ashri Kurnia F';
  doc.setFont(PDF_FONT, 'bold'); doc.setTextColor(0, 0, 0);
  doc.text(nama, rightX, nameY, { align: 'right' });
  var nw = doc.getTextWidth(nama);
  doc.setDrawColor(20, 20, 20); doc.setLineWidth(0.3);
  doc.line(rightX - nw, nameY + 1, rightX, nameY + 1);
  doc.setFont(PDF_FONT, 'italic');
  doc.text('Direktur', rightX, nameY + 4.5, { align: 'right' });
  doc.setFont(PDF_FONT, 'normal');
  return nameY + 6;
}

// ── INVOICE ─────────────────────────────────────────────────────────────────
function buatInvoicePDF(item) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var PW = 210, ML = 10, MR = 10, CW = PW - ML - MR;

  _pdfHeaderKiri(doc, ML);
  _pdfJudulKanan(doc, 'INVOICE', PW, MR, { size: PDF_FS_TITLE, color: PDF_TITLE_COL, y: 15 });
  _pdfInfoKanan(doc, [
    ['No.', item.id || ''],
    ['Date', _pdfTglPanjang(item.tanggal)],
    ['No. PO', item.noPO || ''],
    // Tgl. PO: pakai tgl PO bila diinput; jika tidak, fallback ke tanggal penawaran.
    ['Tgl. PO', _pdfTglPanjang(item.tglPO || (item.noPO ? (item.tglPenawaran || item.tanggal) : ''))]
  ], PW, MR, 25, 4.5);

  // ── INVOICE TO ──
  var klien = _pdfKlien(item.klienId);
  var curY = 45;
  curY = _pdfBarSeksi(doc, 'Invoice to', ML, CW, curY);
  var c1L = ML + 2, c2L = ML + (CW / 2) + 2;
  // Value dimulai tepat setelah label terlebar tiap kolom + gap kecil (rapat, konsisten).
  doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
  var c1V = c1L + Math.max(doc.getTextWidth('Name'), doc.getTextWidth('Address')) + 3;
  var c2V = c2L + Math.max(doc.getTextWidth('Company'), doc.getTextWidth('Contact')) + 3;
  function _row(lx, vx, y, label, val) {
    doc.setFont(PDF_FONT, 'bold'); doc.setTextColor(PDF_TEXT[0], PDF_TEXT[1], PDF_TEXT[2]); doc.setFontSize(PDF_FS);
    doc.text(label, lx, y);
    doc.setFont(PDF_FONT, 'normal'); doc.setTextColor(PDF_TEXT[0], PDF_TEXT[1], PDF_TEXT[2]);
    doc.text(String(val == null ? '' : val), vx, y);
  }
  // Alamat dibungkus dalam LEBAR KOLOM KIRI (berhenti sebelum kolom kanan) agar
  // tidak terkesan melewati data Perusahaan/No.Telp.
  var _alamatInv = String(item.alamatKlien || klien.alamat || '');
  doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS);
  var _addrMaxInv = c2L - c1V - 3;                       // batas: mepet sebelum kolom kanan
  var _addrLinesInv = _alamatInv ? doc.splitTextToSize(_alamatInv, _addrMaxInv) : [''];
  var _rH = 4.5, _tPad = 4;
  // Kolom kiri: Name (baris 1) + Alamat (baris 2..n). Kolom kanan: Perusahaan + No.Telp.
  var _boxHInv = _tPad + _rH * (1 + _addrLinesInv.length) + 1.5;
  doc.setFillColor(PDF_CLIENT_BG[0], PDF_CLIENT_BG[1], PDF_CLIENT_BG[2]); doc.rect(ML, curY, CW, _boxHInv, 'F');   // tanpa border
  // Utamakan detail yg dibawa record invoice (dari getInvoiceList), fallback ke erpState.
  _row(c1L, c1V, curY + _tPad, 'Name', item.namaKlien || klien.nama || '');
  _row(c2L, c2V, curY + _tPad, 'Company', item.perusahaanKlien || klien.perusahaan || '');
  _row(c2L, c2V, curY + _tPad + _rH, 'Contact', item.kontakKlien || klien.kontak || '');
  var _yAInv = curY + _tPad + _rH;
  doc.setFont(PDF_FONT, 'bold'); doc.setTextColor(PDF_TEXT[0], PDF_TEXT[1], PDF_TEXT[2]); doc.setFontSize(PDF_FS);
  doc.text('Address', c1L, _yAInv);
  doc.setFont(PDF_FONT, 'normal');
  _addrLinesInv.forEach(function (ln, i) { doc.text(ln, c1V, _yAInv + i * _rH); });
  curY += _boxHInv + 0.5;

  // ── TABEL ITEM (tagihan + keterangan termin + deskripsi scope) ──
  curY = _pdfTabelInvoice(doc, curY, item, ML, MR);

  // ── RINGKASAN ── (pemisah tipis dari kotak tabel: garis putih setipis pemisah kolom)
  curY += 0.5;
  var ppnP = Number(item.ppnPersen) || (Number(item.ppnNominal) > 0 ? 11 : 0);
  var lines = [
    { label: 'Subtotal', value: _pdfRp(item.dpp), bold: false },
    { label: 'PPN' + (ppnP ? ' ' + ppnP + '%' : ''), value: _pdfRp(item.ppnNominal || 0), bold: false },
    { label: 'GRAND TOTAL', value: _pdfRp(item.total), bold: true, highlight: true }
  ];
  curY = _pdfRingkasan(doc, curY, lines, PW, MR) + 4;

  // ── NOTES | BANK ACCOUNT (kotak 2 kolom) ──
  var bankText = item.bankAccount || '';
  var noteText = item.catatan || '';
  if (bankText || noteText) {
    var estH = Math.max(1, doc.splitTextToSize(String(noteText || ''), CW / 2 - 4).length,
                           doc.splitTextToSize(String(bankText || ''), CW / 2 - 4).length) * 4 + 8;
    if (curY + estH > 285) { doc.addPage(); curY = 15; }
    curY = _pdfNoteBankInvoice(doc, curY, noteText, bankText, ML, CW);
  }

  // ── TANDA TANGAN (gambar dari setting) ──
  if (curY + 40 > 292) { doc.addPage(); curY = 15; }
  curY = _pdfTtdInvoice(doc, curY, PW, MR);

  return doc;
}

// ── KWITANSI ────────────────────────────────────────────────────────────────
// Terbilang Indonesia (Title Case tiap kata), tanpa kata "Rupiah".
function _pdfTerbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'Nol';
  var satuan = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  function konv(x) {
    if (x < 12) return satuan[x];
    if (x < 20) return konv(x - 10) + ' belas';
    if (x < 100) return satuan[Math.floor(x / 10)] + ' puluh' + (x % 10 ? ' ' + konv(x % 10) : '');
    if (x < 200) return 'seratus' + (x % 100 ? ' ' + konv(x % 100) : '');
    if (x < 1000) return satuan[Math.floor(x / 100)] + ' ratus' + (x % 100 ? ' ' + konv(x % 100) : '');
    if (x < 2000) return 'seribu' + (x % 1000 ? ' ' + konv(x % 1000) : '');
    if (x < 1000000) return konv(Math.floor(x / 1000)) + ' ribu' + (x % 1000 ? ' ' + konv(x % 1000) : '');
    if (x < 1000000000) return konv(Math.floor(x / 1000000)) + ' juta' + (x % 1000000 ? ' ' + konv(x % 1000000) : '');
    if (x < 1000000000000) return konv(Math.floor(x / 1000000000)) + ' miliar' + (x % 1000000000 ? ' ' + konv(x % 1000000000) : '');
    return konv(Math.floor(x / 1000000000000)) + ' triliun' + (x % 1000000000000 ? ' ' + konv(x % 1000000000000) : '');
  }
  var s = konv(n).replace(/\s+/g, ' ').trim();
  return s.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

// Kwitansi/Receipt — header (logo+perusahaan, judul, nomor) konsisten dgn
// Invoice/Quotation. Data: getKwitansiForPdf → { id, noInvoice, tanggal,
// terimaDari, jumlah, untuk, metode, bankAccount }.
function buatKwitansiPDF(d) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var PW = 210, ML = 10, MR = 10, CW = PW - ML - MR;

  _pdfHeaderKiri(doc, ML);
  // Judul kanan — posisi & warna sama seperti INVOICE.
  _pdfJudulKanan(doc, 'KWITANSI', PW, MR, { size: PDF_FS_TITLE, color: PDF_TITLE_COL, y: 15 });
  _pdfInfoKanan(doc, [
    ['Nomor', d.id || ''],
    ['Pembayaran', d.metode || 'Transfer'],
    ['No. Invoice', d.noInvoice || '']
  ], PW, MR, 25, 4.5);

  var curY = 45;

  // ── Kotak detail penerimaan (border tipis) ──
  var boxH = 30;
  doc.setDrawColor(120, 120, 120); doc.setLineWidth(0.3);
  doc.rect(ML, curY, CW, boxH);
  var labelX = ML + 4, colonX = ML + 62, valX = ML + 66;
  function _kwRow(y, label, val, bold, italic) {
    doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
    doc.setFont(PDF_FONT, 'normal');
    doc.text(label, labelX, y);
    var lw = doc.getTextWidth(label);
    doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.2);
    doc.line(labelX, y + 1, labelX + lw, y + 1); // garis bawah label
    doc.text(':', colonX, y);
    doc.setFont(PDF_FONT, bold ? 'bold' : (italic ? 'italic' : 'normal'));
    var vLines = doc.splitTextToSize(String(val || ''), (ML + CW) - valX - 2);
    doc.text(vLines, valX, y);
  }
  _kwRow(curY + 8, 'Telah Terima Dari', d.terimaDari || '', true, false);
  _kwRow(curY + 16, 'Terbilang', _pdfTerbilang(d.jumlah) + ' Rupiah', false, true);
  _kwRow(curY + 24, 'Sebagai Pembayaran', d.untuk || '', true, false);
  curY += boxH;

  // ── Kotak nominal (kiri) — sebaris dgn blok tanda tangan (kanan) ──
  curY += 5;
  var amtTopY = curY;
  var amtW = 62, amtH = 12, amtX = ML;
  // Isian: garis horizontal abu tipis putus-putus (mirip pola cek).
  doc.setDrawColor(155, 155, 155); doc.setLineWidth(0.15);
  doc.setLineDashPattern([0.5, 0.8], 0);
  for (var _yy = amtTopY + 2; _yy < amtTopY + amtH - 1; _yy += 1.6) {
    doc.line(amtX + 1, _yy, amtX + amtW - 1, _yy);
  }
  doc.setLineDashPattern([], 0);
  // Garis tebal (double) di atas & bawah.
  doc.setDrawColor(30, 30, 30); doc.setLineWidth(0.5);
  doc.line(amtX, amtTopY, amtX + amtW, amtTopY);
  doc.line(amtX, amtTopY + 0.8, amtX + amtW, amtTopY + 0.8);
  doc.line(amtX, amtTopY + amtH, amtX + amtW, amtTopY + amtH);
  doc.line(amtX, amtTopY + amtH - 0.8, amtX + amtW, amtTopY + amtH - 0.8);
  // Nominal center (horizontal & vertikal).
  doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(14); doc.setTextColor(0, 0, 0);
  doc.text('Rp' + _pdfRp(d.jumlah), amtX + amtW / 2, amtTopY + amtH / 2 + 1.5, { align: 'center' });

  // ── Tanggal + tanda tangan (kanan), sejajar kotak nominal ──
  doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
  doc.text('Surabaya, ' + _pdfTglPanjang(d.tanggal), PW - MR, amtTopY + 2, { align: 'right' });
  _pdfTtdInvoice(doc, amtTopY, PW, MR);

  // ── Note (kiri), di bawah kotak nominal ──
  var noteY = amtTopY + amtH + 8;
  doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
  doc.text('Note:', ML, noteY);
  doc.setFont(PDF_FONT, 'normal');
  var noteLines = ['Kwitansi ini dianggap sah apabila dana telah masuk ke'];
  var bank = (d.bankAccount || '').toString();
  if (bank) noteLines = noteLines.concat(doc.splitTextToSize(bank, 95));
  doc.text(noteLines, ML, noteY + 4.5);

  return doc;
}

// Tampilkan error di area loading modal preview.
function _pdfPreviewError(msg) {
  var l = document.getElementById('preview-pdf-loading');
  if (l) l.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-400 text-2xl mb-2"></i>' +
    '<p class="text-sm text-rose-400 text-center px-4">' + (msg || 'Gagal membuat PDF') + '</p>' +
    '<button onclick="tutupPreviewPDF()" class="mt-4 px-4 py-2 bg-slate-200 rounded-xl text-sm font-bold text-slate-600">Tutup</button>';
}

// Pipeline export Kwitansi (dipakai halaman Invoice & Kwitansi): muat cfg ttd,
// ambil data kwitansi (+ bank dari invoice terkait), render PDF sisi klien.
function exportKwitansiPDFClient(kwitansiId, subtitle) {
  _pdfBukaPreview('Kwitansi — ' + kwitansiId, subtitle || '');
  var _run = function () {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data) { _pdfPreviewError((res && res.message) || 'Kwitansi tidak ditemukan.'); return; }
        setTimeout(function () {
          try {
            var d = res.data;
            var doc = buatKwitansiPDF(d);
            var fn = String(d.id || 'kwitansi').replace(/\//g, '-') + ' - ' + (d.untuk || '') + ' - ' + (d.terimaDari || '');
            _pdfFinishPreview(doc, _pdfNamaFile(fn), {});
          } catch (e) { _pdfPreviewError((e && e.message) || e); }
        }, 30);
      })
      .withFailureHandler(function (err) { _pdfPreviewError((err && err.message) || err); })
      .getKwitansiForPdf(kwitansiId);
  };
  if (window._pdfSignCfg) { _run(); return; }
  google.script.run
    .withSuccessHandler(function (cfg) { window._pdfSignCfg = cfg || {}; _run(); })
    .withFailureHandler(function () { window._pdfSignCfg = {}; _run(); })
    .getDocSignConfig();
}

// ── PURCHASE ORDER ──────────────────────────────────────────────────────────
// Header/no dokumen, tabel item, summary, dan T&C memakai gaya yang sama dgn
// Invoice/Quotation. Data: getPOForPdf → { po, items, supplier, tc }.
function buatPOPDF(data) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var PW = 210, ML = 10, MR = 10, CW = PW - ML - MR;
  var BLUE = PDF_HDR_BG;
  var po = data.po || {}, items = data.items || [], sup = data.supplier || {}, tc = data.tc || {};

  // ── Header (logo + perusahaan) + judul + blok nomor (konsisten Invoice) ──
  _pdfHeaderKiri(doc, ML);
  _pdfJudulKanan(doc, 'PURCHASE ORDER', PW, MR, { size: 21, color: PDF_TITLE_COL, y: 16 });
  _pdfInfoKanan(doc, [
    ['No.', po.noPO || ''],
    ['Date', _pdfTglPanjang(po.tanggal)],
    ['No. Quot', po.quotNo || ''],
    ['Tgl. Quot', _pdfTglPanjang(po.quotTanggal)]
  ], PW, MR, 25, 4.5);

  var curY = 45;

  // ── SUPPLIER INFORMATION ──
  curY = _pdfBarSeksi(doc, 'SUPPLIER INFORMATION', ML, CW, curY);
  var c1 = ML + 2, c2 = ML + (CW / 2) + 2, valW = (CW / 2) - 4, lh = 3.6;
  // Wrap semua nilai agar teks panjang (mis. alamat) turun ke bawah, tak keluar kotak.
  var nmL = doc.splitTextToSize(String(sup.nama || po.namaSupplier || ''), valW);
  var adL = doc.splitTextToSize(String(sup.alamat || ''), valW);
  var ctL = doc.splitTextToSize(String(sup.telepon || sup.pic || ''), valW);
  var emL = doc.splitTextToSize(String(sup.email || ''), valW);
  var rowTopN = Math.max(nmL.length, adL.length, 1), rowBotN = Math.max(ctL.length, emL.length, 1);
  var yLabelA = curY + 4, yValA = yLabelA + 4;
  var yLabelC = yValA + (rowTopN - 1) * lh + 5, yValC = yLabelC + 4;
  var supH = (yValC + (rowBotN - 1) * lh + 3) - curY;
  doc.setFillColor(PDF_CLIENT_BG[0], PDF_CLIENT_BG[1], PDF_CLIENT_BG[2]); doc.rect(ML, curY, CW, supH, 'F');
  function _supLabel(x, y, t) {
    doc.setFont(PDF_FONT, 'italic'); doc.setFontSize(7); doc.setTextColor(120, 120, 120);
    doc.text(t, x, y);
  }
  function _supVal(x, y, lines, bold) {
    doc.setFont(PDF_FONT, bold ? 'bold' : 'normal'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
    doc.text(lines, x, y, { lineHeightFactor: 1.15 });
  }
  _supLabel(c1, yLabelA, 'SUPPLIER NAME'); _supLabel(c2, yLabelA, 'ADDRESS');
  _supVal(c1, yValA, nmL, true); _supVal(c2, yValA, adL, false);
  _supLabel(c1, yLabelC, 'CONTACT'); _supLabel(c2, yLabelC, 'EMAIL');
  _supVal(c1, yValC, ctL, false); _supVal(c2, yValC, emL, false);
  curY += supH + 4;

  // ── Tabel item (No/Details/Unit/Qty/Unit price/Total) ──
  var tableW = PW - ML - MR;
  var autoW = tableW - (12 + 16 + 14 + 34 + 34);
  var bx = [ML + 12, ML + 12 + autoW, ML + 12 + autoW + 16, ML + 12 + autoW + 30, ML + 12 + autoW + 64];
  var body = items.map(function (it, i) {
    return [
      { content: String(i + 1), styles: { halign: 'center' } },
      { content: it.namaItem || '' },
      { content: it.satuan || '', styles: { halign: 'center' } },
      { content: (it.qty != null && it.qty !== '') ? String(it.qty) : '', styles: { halign: 'center' } },
      { content: it.hargaBeli ? _pdfRp(it.hargaBeli) : '', styles: { halign: 'right' } },
      { content: it.total ? _pdfRp(it.total) : '', styles: { halign: 'right' } }
    ];
  });
  doc.autoTable({
    startY: curY,
    head: [[
      { content: 'No.', styles: { halign: 'center' } },
      { content: 'Details', styles: { halign: 'left' } },
      { content: 'Unit', styles: { halign: 'center' } },
      { content: 'Qty', styles: { halign: 'center' } },
      { content: 'Unit price (IDR)', styles: { halign: 'center' } },
      { content: 'Total (IDR)', styles: { halign: 'center' } }
    ]],
    body: body.length ? body : [[{ content: '', colSpan: 6, styles: { minCellHeight: 6 } }]],
    theme: 'grid',
    margin: { left: ML, right: MR },
    columnStyles: {
      0: { cellWidth: 12, halign: 'center' }, 1: { cellWidth: 'auto' },
      2: { cellWidth: 16, halign: 'center' }, 3: { cellWidth: 14, halign: 'center' },
      4: { cellWidth: 34, halign: 'right' }, 5: { cellWidth: 34, halign: 'right' }
    },
    headStyles: { fillColor: BLUE, textColor: PDF_WHITE, fontStyle: 'bold', fontSize: PDF_FS, lineColor: PDF_WHITE, lineWidth: 0 },
    bodyStyles: { fontSize: PDF_FS, textColor: PDF_TEXT, fillColor: PDF_ROW_BG, lineWidth: 0, cellPadding: { top: 0.7, right: 1.1, bottom: 0.7, left: 1.1 } },
    styles: { overflow: 'linebreak', cellPadding: 1.1, lineWidth: 0 },
    didDrawCell: function (dt) {
      doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.3);
      var x0 = dt.cell.x - 0.4, x1 = dt.cell.x + dt.cell.width + 0.4;
      for (var i = 0; i < bx.length; i++) {
        if (bx[i] >= x0 && bx[i] <= x1) doc.line(bx[i], dt.cell.y, bx[i], dt.cell.y + dt.cell.height);
      }
    }
  });
  curY = doc.lastAutoTable.finalY;

  // ── Notes (kiri) + Summary (kanan) — gaya konsisten Invoice/Quotation ──
  curY += 0.6;   // garis pemisah tipis di atas summary (spt Invoice)
  var sumX = ML + 12 + autoW + 30;   // batas kanan kolom Qty
  var rowH = 5;
  var lines = [
    { label: 'Subtotal', value: _pdfRp(po.subtotal), bold: false, highlight: false },
    { label: (Number(po.diskonNominal) > 0 && Number(po.diskonPersen) > 0) ? ('Diskon (' + po.diskonPersen + '%)') : 'Diskon',
      value: Number(po.diskonNominal) > 0 ? _pdfRp(po.diskonNominal) : '-', bold: false, highlight: false },
    { label: 'PPN ' + (po.ppnPersen || 11) + '%', value: Number(po.ppnNominal) > 0 ? _pdfRp(po.ppnNominal) : '-', bold: false, highlight: false },
    { label: 'GRAND TOTAL', value: _pdfRp(po.grandTotal), bold: true, highlight: true }
  ];
  var NS = lines.length, summaryH = NS * rowH;
  // Notes: tinggi kotak fleksibel mengikuti jumlah baris catatan.
  var noteLines = po.catatan ? doc.splitTextToSize(String(po.catatan), sumX - ML - 4) : [];
  var notesTextH = noteLines.length * 3.6 + 2.5;
  var notesGrayH = Math.max(summaryH - rowH, notesTextH);
  var blockH = rowH + notesGrayH;
  // Notes: bar biru + isi abu (kiri).
  doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]); doc.rect(ML, curY, sumX - ML, rowH, 'F');
  doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS); doc.setTextColor(255, 255, 255);
  doc.text('Notes :', ML + 2, curY + 3.4);
  doc.setFillColor(PDF_ROW_BG[0], PDF_ROW_BG[1], PDF_ROW_BG[2]); doc.rect(ML, curY + rowH, sumX - ML, notesGrayH, 'F');
  if (noteLines.length) {
    doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
    doc.text(noteLines, ML + 2, curY + rowH + 3.4);
  }
  // Summary (kanan) — warna & gaya sama Invoice/Quotation (teks hitam, grand total abu).
  lines.forEach(function (row, i) {
    var ry = curY + i * rowH;
    var bg = row.highlight ? PDF_GROUP_BG : PDF_ROW_BG;
    doc.setFillColor(bg[0], bg[1], bg[2]); doc.rect(sumX, ry, (PW - MR) - sumX, rowH, 'F');
    doc.setFont(PDF_FONT, row.bold ? 'bold' : 'normal'); doc.setFontSize(PDF_FS);
    doc.setTextColor(0, 0, 0);
    doc.text(row.label, sumX + 2.5, ry + 3.4);
    doc.text(row.value, (PW - MR) - 2, ry + 3.4, { align: 'right' });
  });
  curY += blockH + 5;

  // ── Term & Condition (gaya Quotation: bar biru + kotak 2 kolom) ──
  var _tv = function (k) { var x = tc[k]; if (Array.isArray(x)) x = x[0]; return (x == null ? '' : String(x)); };
  var tcItems = [
    { label: 'Material Status', value: _tv('po_material_status') },
    { label: 'Down Payment', value: _tv('po_down_payment') },
    { label: 'Balance Payment', value: _tv('po_balance_pay') },
    { label: 'Delivery Condition', value: _tv('po_delivery_cond') },
    { label: 'Warranty', value: _tv('po_warranty') },
    { label: 'Documents', value: _tv('po_documents') }
  ].filter(function (t) { return t.value && t.value !== '-'; });

  if (tcItems.length) {
    if (curY > 240) { doc.addPage(); curY = 15; }
    doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]); doc.rect(ML, curY, CW, 6, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
    doc.text('Term & Condition :', ML + 2, curY + 4.2);
    curY += 8;
    var tcItemW = CW / 2, tcRowH = 5, tcRows = Math.ceil(tcItems.length / 2), tcTotalH = tcRows * tcRowH + 2;
    doc.setFillColor(PDF_ROW_BG[0], PDF_ROW_BG[1], PDF_ROW_BG[2]); doc.rect(ML, curY - 1.5, CW, tcTotalH, 'F');
    doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.4);
    doc.line(ML + tcItemW, curY - 1.5, ML + tcItemW, curY - 1.5 + tcTotalH);
    tcItems.forEach(function (t, idx) {
      var col = idx % 2, r = Math.floor(idx / 2), x = ML + 3 + col * tcItemW, y = curY + 3 + r * tcRowH;
      doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
      doc.setFont(PDF_FONT, 'bold'); var lt = t.label + ': '; doc.text(lt, x, y);
      var lw = doc.getTextWidth(lt); doc.setFont(PDF_FONT, 'normal');
      doc.text(doc.splitTextToSize(t.value, tcItemW - lw - 5), x + lw, y);
    });
    curY += tcTotalH + 5;
  }

  // ── Tanda tangan (Customer | Supplier) ──
  if (curY > 250) { doc.addPage(); curY = 15; }
  var halfW = CW / 2;
  doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]); doc.rect(ML, curY, CW, 6, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
  doc.text('Customer', ML + 2, curY + 4.2);
  doc.text('Supplier', ML + halfW + 2, curY + 4.2);
  curY += 6;
  doc.setTextColor(0, 0, 0); doc.setFont(PDF_FONT, 'bold'); doc.setFontSize(PDF_FS);
  doc.text(doc.splitTextToSize('PT. RENUS GLOBAL INDONESIA', halfW - 4), ML + 2, curY + 5);
  doc.text(doc.splitTextToSize(String(sup.nama || po.namaSupplier || ''), halfW - 4), ML + halfW + 2, curY + 5);
  curY += 26;
  doc.setFont(PDF_FONT, 'normal'); doc.setFontSize(PDF_FS); doc.setTextColor(0, 0, 0);
  doc.text('(' + (po.dibuatOleh || 'Procurement') + ')', ML + 2, curY);
  doc.text('(............................................)', ML + halfW + 2, curY);

  return doc;
}

// Pipeline export Purchase Order (dipakai halaman Purchase Order).
function exportPOPDFClient(noPO, subtitle) {
  _pdfBukaPreview('Purchase Order — ' + noPO, subtitle || '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success || !res.data) { _pdfPreviewError((res && res.message) || 'PO tidak ditemukan.'); return; }
      setTimeout(function () {
        try {
          var d = res.data, po = d.po || {};
          var doc = buatPOPDF(d);
          var fn = String(po.noPO || 'PO').replace(/\//g, '-') + ' - ' + (po.peruntukan || '') + ' - ' + (po.namaSupplier || '');
          _pdfFinishPreview(doc, _pdfNamaFile(fn), {});
        } catch (e) { _pdfPreviewError((e && e.message) || e); }
      }, 30);
    })
    .withFailureHandler(function (err) { _pdfPreviewError((err && err.message) || err); })
    .getPOForPdf(noPO);
}

// ── INFO WORK ORDER (untuk tim engineer di BOM/DED/QC) ──────────────────────
// Desain/layout mengikuti PDF WORK ORDER internal di detail Work Order
// (potret, header navy, tabel HPP biru dgn kolom HPP merah) — TANPA kolom
// Harga Jual / Total Jual / Margin, dan Catatan Customer + MoM sebagai 2 kolom.
// Footer TIDAK digambar di sini: laporan Site Survey terkait dilampirkan setelah
// halaman ini (oleh exportWOInfoPDF), lalu footer gabungan digambar sekali.
// data: getWOContextByWO.
function buatWOInfoPDF(res) {
  var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var PW = 210, PH = 297, ML = 14, MR = 14;
  var DARK = [30, 41, 59], SLATE = [100, 116, 139], BLUE = [30, 64, 175];
  var rp = function (v) { return Math.round(Math.abs(Number(v) || 0)).toLocaleString('id-ID'); };

  // ── Header navy ──
  doc.setFillColor(DARK[0], DARK[1], DARK[2]);
  doc.rect(0, 0, PW, 22, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('WORK ORDER', ML, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
  doc.setTextColor(190, 200, 220);
  doc.text('DOKUMEN INTERNAL — INFORMASI WORK ORDER', ML, 17);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
  doc.setTextColor(170, 195, 255);
  doc.text('NO. WORK ORDER', PW - MR, 9, { align: 'right' });
  doc.setFontSize(15); doc.setTextColor(255, 255, 255);
  doc.text(String(res.noWO || '-'), PW - MR, 17, { align: 'right' });

  // ── Info 2 kolom ──
  var y = 30;
  var noPen = (res.id || '-') + ((res.rev !== '' && res.rev != null) ? '  (Rev ' + res.rev + ')' : '');
  var hoTxt = (res.ho && (res.ho.status || res.ho.tglJadwal))
    ? ((res.ho.status || '-') + (res.ho.tglJadwal ? ' · ' + res.ho.tglJadwal + (res.ho.waktu ? ' ' + res.ho.waktu : '') : ''))
    : '-';
  var colGap = 4, half = (PW - ML - MR - colGap) / 2, rightX = ML + half + colGap;
  var infoLeft = [['No Penawaran', noPen], ['Tanggal', res.tanggal || '-'], ['Sales / PIC', res.dibuatOleh || '-'], ['Jenis WO', res.jenisWO || '-']];
  var infoRight = [['Klien', res.namaKlien || '-'], ['Project', res.namaProject || '-'], ['Status', res.status || '-'], ['Hand Over', hoTxt]];
  doc.setFontSize(8);
  function _infoCol(rows, x, labelW, valW) {
    rows.forEach(function (r, i) {
      var yy = y + i * 5;
      doc.setFont('helvetica', 'bold'); doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]); doc.text(r[0], x, yy);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(DARK[0], DARK[1], DARK[2]);
      var v = doc.splitTextToSize(': ' + r[1], valW)[0];
      doc.text(v, x + labelW, yy);
    });
  }
  _infoCol(infoLeft, ML, 24, half - 24);
  _infoCol(infoRight, rightX, 22, half - 22);
  y += 23;

  // ── Catatan Customer + Catatan Hasil Hand Over (MoM) — 2 kolom sejajar ──
  var boxFullW = PW - ML - MR, gap = 6, colW = (boxFullW - gap) / 2;
  var custTxt = (res.catatanCustomer || '').trim() || '-';
  var momTxt = (res.ho && res.ho.mom ? String(res.ho.mom).trim() : '') || '-';
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
  var custLines = doc.splitTextToSize(custTxt, colW - 10);
  var momLines = doc.splitTextToSize(momTxt, colW - 10);
  var headH = 5.5;
  var bodyH = Math.max(custLines.length, momLines.length) * 4.2 + 3.5;
  var boxH = headH + bodyH;
  if (y + boxH + 5 > PH - 14) { doc.addPage(); y = 20; }

  // Kotak kiri (amber) — Catatan Customer
  var AMBER_BG = [255, 247, 224], AMBER_LINE = [217, 119, 6];
  doc.setFillColor(AMBER_BG[0], AMBER_BG[1], AMBER_BG[2]); doc.setDrawColor(AMBER_LINE[0], AMBER_LINE[1], AMBER_LINE[2]); doc.setLineWidth(0.3);
  doc.rect(ML, y, colW, boxH, 'FD');
  doc.setFillColor(AMBER_LINE[0], AMBER_LINE[1], AMBER_LINE[2]); doc.rect(ML, y, 1.5, boxH, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(146, 64, 14);
  doc.text('CATATAN DARI CUSTOMER', ML + 5, y + 4.2);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(60, 50, 40);
  doc.text(custLines, ML + 5, y + headH + 3.2);

  // Kotak kanan (emerald) — Catatan Hasil Hand Over (MoM)
  var rx = ML + colW + gap;
  var MOM_BG = [236, 253, 245], MOM_LINE = [5, 150, 105];
  doc.setFillColor(MOM_BG[0], MOM_BG[1], MOM_BG[2]); doc.setDrawColor(MOM_LINE[0], MOM_LINE[1], MOM_LINE[2]); doc.setLineWidth(0.3);
  doc.rect(rx, y, colW, boxH, 'FD');
  doc.setFillColor(MOM_LINE[0], MOM_LINE[1], MOM_LINE[2]); doc.rect(rx, y, 1.5, boxH, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(6, 78, 59);
  doc.text('CATATAN HASIL HAND OVER (MoM)', rx + 5, y + 4.2);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(40, 60, 50);
  doc.text(momLines, rx + 5, y + headH + 3.2);
  y += boxH + 6;

  // ── Detail item pekerjaan (HPP) — tanpa Harga Jual / Total Jual / Margin ──
  var body = [];
  (res.kelompok || []).forEach(function (k, ki) {
    var letter = String.fromCharCode(65 + ki);
    body.push([{ content: letter + '. ' + (k.nama || '').toUpperCase(), colSpan: 6, styles: { fillColor: [226, 232, 240], textColor: DARK, fontStyle: 'bold', halign: 'left' } }]);
    (k.items || []).forEach(function (s, si) {
      body.push([String(si + 1), s.deskripsi || '', (s.qty != null ? String(s.qty) : ''), s.unit || '', rp(s.hpp), rp(s.totalHpp)]);
    });
  });
  if (!body.length) body.push([{ content: 'Tidak ada item.', colSpan: 6, styles: { halign: 'center', textColor: [120, 120, 120] } }]);
  doc.autoTable({
    startY: y,
    head: [['No', 'Deskripsi Produk / Jasa', 'Qty', 'Unit', 'HPP Satuan', 'Total HPP']],
    body: body, theme: 'grid', margin: { left: ML, right: MR },
    headStyles: { fillColor: BLUE, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8, halign: 'center' },
    bodyStyles: { fontSize: 7.5, textColor: [40, 40, 40], lineColor: [210, 215, 225], lineWidth: 0.15, cellPadding: 1.6 },
    columnStyles: { 0: { cellWidth: 9, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 13, halign: 'center' }, 3: { cellWidth: 16, halign: 'center' }, 4: { cellWidth: 30, halign: 'right' }, 5: { cellWidth: 32, halign: 'right' } },
    styles: { overflow: 'linebreak' },
    didParseCell: function (data) {
      // Kolom HPP (HPP Satuan=4, Total HPP=5) disorot merah.
      if (data.column.index === 4 || data.column.index === 5) {
        if (data.section === 'head') { data.cell.styles.fillColor = [153, 27, 27]; data.cell.styles.textColor = [255, 255, 255]; }
        else if (data.section === 'body') { data.cell.styles.fillColor = [254, 235, 235]; data.cell.styles.textColor = [190, 30, 30]; data.cell.styles.fontStyle = 'bold'; }
      }
    }
  });
  return doc;
}

// Gambar footer seragam (nomor halaman) pada SEMUA halaman `doc` — dipanggil
// setelah info WO + lampiran laporan site survey selesai dirangkai.
function _woInfoFooter(doc) {
  var PW = 210, PH = 297, ML = 14, MR = 14;
  var tp = doc.internal.getNumberOfPages();
  for (var p = 1; p <= tp; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(150, 150, 150);
    doc.text('PT. RENUS GLOBAL INDONESIA — Dokumen Internal', ML, PH - 6);
    doc.text('Hal ' + p + ' / ' + tp, PW - MR, PH - 6, { align: 'right' });
    doc.setTextColor(0, 0, 0);
  }
}

// Export langsung (download) dari data konteks WO yang sudah dimuat di modal
// Info WO. Laporan site survey terkait (lengkap dengan foto) dilampirkan setelah
// halaman info WO sebagai satu berkas PDF. Embed foto bersifat async → tampilkan
// loader + indikator jumlah foto (bila tersedia).
function exportWOInfoPDF() {
  var res = window._woCtxData;
  if (!res || !res.success) { if (typeof showNotification === 'function') showNotification('Data WO belum siap.', 'error'); return; }
  var surv = (res.surveys || []).filter(function (s) { return s && s.id; });
  var namaFile = _pdfNamaFile('Info WO ' + (res.noWO || '') + (res.namaProject ? ' - ' + res.namaProject : ''));

  var doc;
  try { doc = buatWOInfoPDF(res); }
  catch (e) { if (typeof showNotification === 'function') showNotification('Gagal membuat PDF: ' + ((e && e.message) || e), 'error'); return; }

  // Tanpa survey / helper survey tak tersedia → langsung simpan.
  if (!surv.length || typeof google === 'undefined' || !google.script || !google.script.run || typeof _ssRenderReport !== 'function') {
    _woInfoFooter(doc);
    doc.save(namaFile);
    return;
  }

  if (typeof toggleLoader === 'function') toggleLoader(true, 'Menyiapkan PDF Info WO + laporan site survey...');
  var _stopProg = (typeof _pdfPhotoProgressPoll === 'function') ? _pdfPhotoProgressPoll() : function () {};

  var i = 0;
  function finish() {
    _stopProg();
    if (typeof toggleLoader === 'function') toggleLoader(false);
    try { _woInfoFooter(doc); doc.save(namaFile); if (typeof showNotification === 'function') showNotification('PDF Info WO berhasil diunduh.'); }
    catch (e) { if (typeof showNotification === 'function') showNotification('Gagal menyimpan PDF: ' + ((e && e.message) || e), 'error'); }
  }
  function next() {
    if (i >= surv.length) { finish(); return; }
    var s = surv[i++];
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.success !== false && r.survey) { try { _ssRenderReport(doc, r.survey, { firstPage: false }); } catch (e) {} }
        next();
      })
      .withFailureHandler(function () { next(); })
      .getSiteSurveyReportData(s.id);
  }
  next();
}
</script>
