<script>
// ================================================================
//  SITE SURVEY — form lapangan Tim Sales (5 bagian, multi-step).
//  Standalone (tanpa tautan ke Customer/Penawaran/WO), submit = final.
//  Peta pakai Leaflet+OSM; anotasi foto (kotak/garis) pakai canvas vanilla.
//  Lightbox foto pakai ulang modal QC (_qcViewFoto / _qcJs sudah global).
// ================================================================

let _ssCurrentId  = null;   // ID survey yang sedang diisi (dipesan saat form dibuka)
let _ssStep       = 1;
let _ssPhotos     = {};     // fieldKey -> {fileId, fileUrl}
let _ssLatLng     = null;   // {lat, lng}
let _ssMap        = null;   // instance Leaflet
let _ssMarker     = null;
let _ssListData   = [];
let _ssDetailCurrent = null;
let _ssEditMode   = false;  // true = form sedang mengedit survey lama, bukan buat baru
let _ssEditOriginalTanggal = ''; // Tanggal Survey asli dipertahankan saat edit (bukan tanggal hari ini)
let _ssEditOriginalDibuatOlehId = ''; // id pembuat asli dipertahankan saat edit (bukan id user yg sedang edit)
let _ssPendingFotoDeletes = []; // fileId foto lama yg dihapus user saat edit — ditrash setelah Simpan berhasil
let _ssDetailReadOnly = false;  // true = modal detail dibuka murni utk dilihat (mis. dari detail WO), tanpa tombol aksi

var _SS_STEP_DEFS = [
  { n: 1, label: 'Umum' },
  { n: 2, label: 'Kelistrikan' },
  { n: 3, label: 'BoS' },
  { n: 4, label: 'Atap' },
  { n: 5, label: 'Jalur Kabel' }
];

function _ssUserNama() { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.nama) ? _currentUser.nama : ''; }
function _ssUserId()   { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.id) ? _currentUser.id : ''; }
function _ssRole()     { return (typeof _currentUser !== 'undefined' && _currentUser && _currentUser.role) ? _currentUser.role : ''; }
// Hapus: Admin, Lead Sales, atau sales pembuat record itu sendiri.
function _ssCanDelete(survey){
  var r = _ssRole();
  if (r === 'admin' || r === 'leadsales') return true;
  return _ssCanEditRecord(survey); // sales pembuat (via id/nama) boleh hapus miliknya
}
// Hanya Admin atau sales yang membuat record itu sendiri yang boleh mengedit.
// Dibandingkan via id user (stabil) bukan nama (bisa berubah kalau admin
// mengganti nama akun) — fallback ke nama utk record lama sblm dibuatOlehId ada.
function _ssCanEditRecord(survey) {
  if (!survey) return false;
  if (_ssRole() === 'admin') return true;
  var uid = _ssUserId();
  if (uid && survey.dibuatOlehId) return uid === survey.dibuatOlehId;
  var nama = _ssUserNama();
  return !!(nama && survey.dibuatOleh && nama === survey.dibuatOleh);
}
function _ssEsc(s) { return (s == null ? '' : s.toString()).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// Format tanggal manual (bukan toLocaleDateString) agar separator "/" konsisten
// di semua browser/locale, tak bergantung data ICU yg bisa beda-beda.
function _ssTodayDDMMYYYY() {
  var d = new Date();
  var dd = ('0' + d.getDate()).slice(-2);
  var mm = ('0' + (d.getMonth() + 1)).slice(-2);
  return dd + '/' + mm + '/' + d.getFullYear();
}

// Kompres/resize foto di browser sebelum diupload — foto kamera HP modern
// bisa 3-8MB; dipangkas ke maks 1600px sisi terpanjang + JPEG ~80% supaya
// upload jauh lebih cepat tanpa terlihat bedanya di thumbnail/laporan.
function _ssResizeImage(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxDim = 1600;
      var w = img.naturalWidth || 800, h = img.naturalHeight || 600;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.8); }
      catch (err) { cb(null); return; }
      cb(dataUrl);
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

var _ssLocalIdSeq = 0;
function _ssNextLocalId() { return 'L' + (++_ssLocalIdSeq); }
function _ssFotoKey(f) { return f.fileId || f._localId; }

// Marker icon default Leaflet via CDN unpkg butuh URL eksplisit (dikenal broken
// bila tak di-set manual saat memakai CDN langsung, bukan bundler).
if (typeof L !== 'undefined') {
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
  });
}

// Delegasi klik thumbnail foto (form-view & modal detail) ke lightbox QC.
// Dipasang sekali di document — tak perlu re-attach tiap kali innerHTML
// dirender ulang, dan menghindari onclick inline yg rawan bug escaping kutip.
document.addEventListener('click', function(ev) {
  var btn = ev.target.closest ? ev.target.closest('.ss-foto-view') : null;
  if (!btn) return;
  var fileId = btn.getAttribute('data-fileid');
  var fileUrl = btn.getAttribute('data-fileurl');
  if (fileId && typeof _qcViewFoto === 'function') _qcViewFoto(fileId, fileUrl);
});

// ── Load daftar (tabel + pagination) ────────────────────────────────
window.loadSiteSurvey = function() {
  document.getElementById('ss-form-view').classList.add('hidden');
  document.getElementById('ss-list-view').classList.remove('hidden');
  var tbody = document.getElementById('table-sitesurvey');
  if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat data survey...</td></tr>';
  if (typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(res) {
    _ssListData = (res && res.success) ? (res.list || []) : [];
    var search = document.getElementById('ss-search'); if (search) search.value = '';
    _pgState.sitesurvey.data = _ssListData;
    _pgState.sitesurvey.page = 1;
    _injectPgBar('sitesurvey', '#table-sitesurvey');
    _pgRender('sitesurvey');
  }).withFailureHandler(function() {
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-rose-400">Gagal memuat data survey.</td></tr>';
  }).getSiteSurveyList();
};

function _ssFilterList() {
  var q = ((document.getElementById('ss-search') || {}).value || '').toLowerCase().trim();
  _pgState.sitesurvey.data = _ssListData.filter(function(s) {
    if (!q) return true;
    return ((s.namaSite || '') + (s.namaPIC || '') + (s.alamat || '')).toLowerCase().indexOf(q) !== -1;
  });
  _pgState.sitesurvey.page = 1;
  _pgRender('sitesurvey');
}

function _pgRenderSiteSurvey(data) {
  var tbody = document.getElementById('table-sitesurvey');
  if (!tbody) return;
  if (!data || !data.length) {
    var q = ((document.getElementById('ss-search') || {}).value || '').trim();
    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-map-location-dot mr-2"></i>'
      + (q ? 'Tidak ada survey cocok.' : 'Belum ada Site Survey. Klik <b>Tambah Survey</b> untuk memulai.') + '</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(s) {
    var editBtn = _ssCanEditRecord(s)
      ? '<button onclick="event.stopPropagation();bukaEditSiteSurvey(\'' + s.id + '\')" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-lg transition" title="Edit"><i class="fa-solid fa-pen-to-square text-sm"></i></button>'
      : '';
    var pdfBtn = '<button onclick="event.stopPropagation();_ssExportPDFById(\'' + s.id + '\')" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition" title="Export PDF"><i class="fa-solid fa-file-pdf text-sm"></i></button>';
    var delBtn = _ssCanDelete(s)
      ? '<button onclick="event.stopPropagation();_ssHapusSurvey(\'' + s.id + '\')" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Hapus"><i class="fa-regular fa-trash-can text-sm"></i></button>'
      : '';
    return '<tr class="border-b border-slate-100 hover:bg-slate-50/80 transition cursor-pointer" onclick="bukaDetailSiteSurvey(\'' + s.id + '\')">'
      + '<td class="p-4 font-mono text-xs font-bold text-slate-500" data-label="ID">' + s.id + '</td>'
      + '<td class="p-4 max-w-[220px]" data-label="Nama Site"><div class="font-semibold text-slate-800 truncate">' + _ssEsc(s.namaSite || '-') + '</div>'
      +   (s.noWO ? '<div class="mt-1"><span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-700 whitespace-nowrap" title="Site survey ini sudah tertaut ke Work Order"><i class="fa-solid fa-link text-[9px]"></i> Tertaut WO ' + _ssEsc(s.noWO) + '</span></div>' : '')
      + '</td>'
      + '<td class="p-4" data-label="PIC / Telepon"><p class="text-slate-700">' + _ssEsc(s.namaPIC || '-') + '</p><p class="text-[11px] text-slate-400">' + _ssEsc(s.telepon || '') + '</p></td>'
      + '<td class="p-4 max-w-[220px] truncate text-slate-500" data-label="Alamat">' + _ssEsc(s.alamat || '-') + '</td>'
      + '<td class="p-4 whitespace-nowrap text-slate-500" data-label="Tanggal">' + _ssEsc(s.tanggalSurvey || '') + '</td>'
      + '<td class="p-4 font-semibold text-slate-600" data-label="Sales">' + _ssEsc(s.dibuatOleh || '-') + '</td>'
      + '<td class="p-4 text-center rp-actions" onclick="event.stopPropagation()" data-label="Aksi">'
      +   '<div class="flex items-center justify-center gap-1">'
      +     '<button onclick="bukaDetailSiteSurvey(\'' + s.id + '\')" class="text-slate-500 hover:bg-slate-100 p-1.5 rounded-lg transition" title="Lihat Detail"><i class="fa-solid fa-eye text-sm"></i></button>'
      +     editBtn
      +     pdfBtn
      +     delBtn
      +   '</div>'
      + '</td>'
      + '</tr>';
  }).join('');
}

// ── Form: buka / batal / reset ─────────────────────────────────────
function bukaFormSiteSurvey() {
  _ssResetForm();
  document.getElementById('ss-list-view').classList.add('hidden');
  document.getElementById('ss-form-view').classList.remove('hidden');
  _ssGotoStep(1);
  _ssInitMap(); // panggil setelah kontainer #ss-map terlihat (bukan display:none)
  _ssCheckGeoPermission();
  toggleLoader(true, 'Menyiapkan form survey...');
  google.script.run.withSuccessHandler(function(res) {
    toggleLoader(false);
    if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal menyiapkan ID survey.', 'error'); _ssDoBatalForm(); return; }
    _ssCurrentId = res.id;
  }).withFailureHandler(function(err) {
    toggleLoader(false);
    showNotification((err && err.message) || 'Gagal menyiapkan form.', 'error');
    _ssDoBatalForm();
  }).getNextSiteSurveyId();
}

  'ss-bosLokasi', 'ss-bosLebar', 'ss-bosTinggi', 'ss-bosJenisTembok', 'ss-bosJarakInterkoneksi',
  'ss-atapJenis', 'ss-atapArah', 'ss-atapRangka', 'ss-atapMounting',
  'ss-panjangPV', 'ss-panjangAC', 'ss-latitude', 'ss-longitude'];
var _SS_FOTO_FIELDS = ['fotoBangunan', 'fotoKwh', 'fotoPHB', 'bosFoto', 'fotoAtap', 'fotoRangka', 'fotoAkses', 'fotoPV', 'fotoAC'];

// Tabel standar Daya PLN → Rate Ampere MCB (PLN, sesuai jenis phase). Dipakai
// utk mengisi opsi dropdown Daya PLN & Rating Breaker/MCB Ampere sesuai Phase
// Listrik yang dipilih — KEDUANYA dipilih manual, tidak saling auto-fill.
var _SS_PLN_TABLE = {
  '1 Phase': [
    { va: 450, a: 2 }, { va: 900, a: 4 }, { va: 1300, a: 6 }, { va: 2200, a: 10 },
    { va: 3500, a: 16 }, { va: 4400, a: 20 }, { va: 5500, a: 25 }, { va: 7700, a: 35 }, { va: 11000, a: 50 }
  ],
  '3 Phase': [
    { va: 6600, a: 10 }, { va: 10600, a: 16 }, { va: 13200, a: 20 }, { va: 16500, a: 25 },
    { va: 23000, a: 35 }, { va: 33000, a: 50 }, { va: 41500, a: 63 }, { va: 53000, a: 80 }
  ]
};
function _ssFillSelectOptions(sel, opts, valueKey, unitLabel, placeholderEmpty) {
  sel.innerHTML = (opts.length ? '<option value="">-- Pilih --</option>' : '<option value="">' + placeholderEmpty + '</option>')
    + opts.map(function (o) { return '<option value="' + o[valueKey] + '">' + o[valueKey] + ' ' + unitLabel + '</option>'; }).join('');
  sel.disabled = !opts.length;
}
function _ssOnPhaseChange() {
  var phase = document.getElementById('ss-phase').value;
  var opts = _SS_PLN_TABLE[phase] || [];
  _ssFillSelectOptions(document.getElementById('ss-dayaPLN'), opts, 'va', 'VA', '-- Pilih Phase Listrik dahulu --');
  _ssFillSelectOptions(document.getElementById('ss-ratingBreaker'), opts, 'a', 'A', '-- Pilih Phase Listrik dahulu --');
}

function _ssResetForm() {
  _ssCurrentId = null; _ssStep = 1; _ssPhotos = {}; _ssLatLng = null;
  _ssEditMode = false; _ssEditOriginalTanggal = ''; _ssEditOriginalDibuatOlehId = ''; _ssPendingFotoDeletes = [];
  _SS_TEXT_FIELDS.forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('ss-dayaPLN').innerHTML = '<option value="">-- Pilih Phase Listrik dahulu --</option>';
  document.getElementById('ss-dayaPLN').disabled = true;
  document.getElementById('ss-ratingBreaker').innerHTML = '<option value="">-- Pilih Phase Listrik dahulu --</option>';
  document.getElementById('ss-ratingBreaker').disabled = true;
  var jEl = document.getElementById('ss-atapJumlah');
  if (jEl) {
    // Buang opsi tambahan >8 yg mungkin tersisa dari edit sebelumnya.
    Array.prototype.slice.call(jEl.options).forEach(function(o) { if ((parseInt(o.value, 10) || 0) > 8) jEl.removeChild(o); });
    jEl.value = '1';
  }
  _ssRenderAtapUkuran([]);
  _SS_FOTO_FIELDS.forEach(_ssRenderFotoSlot);
  var koorEl = document.getElementById('ss-koor-text'); if (koorEl) koorEl.innerText = 'Belum ada koordinat — klik di peta atau isi manual di bawah.';
  if (_ssMap) { _ssMap.remove(); _ssMap = null; _ssMarker = null; }
  var submitBtn = document.getElementById('ss-btn-submit');
  if (submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Submit Survey';
}

function _ssBatalForm() {
  var hasData = (document.getElementById('ss-namaSite').value || '').trim() || Object.keys(_ssPhotos).length;
  if (hasData) {
    showConfirm({ title: 'Batalkan Survey', message: 'Keluar dari form? Data yang sudah diisi akan hilang.', confirmText: 'Ya, Keluar', onConfirm: _ssDoBatalForm });
  } else {
    _ssDoBatalForm();
  }
}
function _ssDoBatalForm() {
  document.getElementById('ss-form-view').classList.add('hidden');
  document.getElementById('ss-list-view').classList.remove('hidden');
  loadSiteSurvey();
}

// ── Navigasi step ────────────────────────────────────────────────
function _ssRenderSteps() {
  var box = document.getElementById('ss-steps');
  if (!box) return;
  box.innerHTML = _SS_STEP_DEFS.map(function(s) {
    var active = s.n === _ssStep;
    var done = s.n < _ssStep;
    var circleCls = active ? 'bg-blue-600 text-white' : (done ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400');
    return '<div class="flex items-center gap-1.5 shrink-0">'
      + '<div class="h-7 w-7 rounded-full flex items-center justify-center text-xs font-bold ' + circleCls + '">' + (done ? '<i class="fa-solid fa-check text-[10px]"></i>' : s.n) + '</div>'
      + '<span class="text-[11px] font-bold ' + (active ? 'text-slate-700' : 'text-slate-400') + ' hidden sm:inline">' + s.label + '</span>'
      + (s.n < 5 ? '<div class="w-4 sm:w-8 h-0.5 ' + (done ? 'bg-emerald-400' : 'bg-slate-200') + ' mx-1"></div>' : '')
      + '</div>';
  }).join('');
}

function _ssGotoStep(n) {
  _ssStep = n;
  document.querySelectorAll('.ss-step').forEach(function(el, i) { el.classList.toggle('hidden', (i + 1) !== n); });
  document.getElementById('ss-btn-prev').classList.toggle('hidden', n === 1);
  document.getElementById('ss-btn-next').classList.toggle('hidden', n === 5);
  document.getElementById('ss-btn-submit').classList.toggle('hidden', n !== 5);
  _ssRenderSteps();
  var host = document.getElementById('ss-form-view');
  if (host) host.scrollIntoView({ block: 'start' });
}

// Semua field per-langkah wajib diisi sebelum lanjut/submit.
var _SS_STEP_REQUIRED = {
  1: {
    fields: [
      { id: 'ss-namaSite', label: 'Nama Site' },
      { id: 'ss-namaPIC', label: 'Nama PIC Site' },
      { id: 'ss-telepon', label: 'No. Telepon' },
      { id: 'ss-alamat', label: 'Alamat' },
      { id: 'ss-arahBangunan', label: 'Arah Hadap Bangunan' },
      { id: 'ss-tinggiBangunan', label: 'Tinggi Bangunan' }
    ],
    coords: true,
    fotos: [{ key: 'fotoBangunan', label: 'Foto Bangunan Tampak Depan' }]
  },
  2: {
    fields: [
      { id: 'ss-idPelangganPLN', label: 'ID Pelanggan PLN' },
      { id: 'ss-phase', label: 'Phase Listrik' },
      { id: 'ss-dayaPLN', label: 'Daya PLN' },
      { id: 'ss-ratingBreaker', label: 'Rating Breaker Utama' }
    ],
    fotos: [{ key: 'fotoKwh', label: 'Foto kWh Meter' }, { key: 'fotoPHB', label: 'Foto Panel Hubung Bagi (PHB)' }]
  },
  3: {
    fields: [
      { id: 'ss-bosLokasi', label: 'Lokasi Penempatan BoS' },
      { id: 'ss-bosLebar', label: 'Lebar Area BoS' },
      { id: 'ss-bosTinggi', label: 'Tinggi Area BoS' },
      { id: 'ss-bosJenisTembok', label: 'Jenis Tembok' },
      { id: 'ss-bosJarakInterkoneksi', label: 'Jarak BoS ke Titik Interkoneksi' }
    ],
    fotos: [{ key: 'bosFoto', label: 'Foto Area BoS' }]
  },
  4: {
    fields: [
      { id: 'ss-atapJenis', label: 'Jenis Atap' },
      { id: 'ss-atapArah', label: 'Arah Hadap Atap' },
      { id: 'ss-atapRangka', label: 'Rangka Atap' },
      { id: 'ss-atapMounting', label: 'Jenis Mounting' }
    ],
    custom: function() {
      var jEl = document.getElementById('ss-atapJumlah');
      var n = jEl ? parseInt(jEl.value, 10) : 0;

      for (var i = 0; i < n; i++) {

      }
      return null;
    },
    fotos: [{ key: 'fotoAtap', label: 'Foto Atap' }, { key: 'fotoRangka', label: 'Foto Rangka Atap' }, { key: 'fotoAkses', label: 'Foto Akses ke Atap' }]

    ],
    fotos: [{ key: 'fotoPV', label: 'Foto Jalur Kabel PV' }, { key: 'fotoAC', label: 'Foto Jalur Kabel AC' }]
  }
};

// Return pesan error field pertama yang kosong, atau null bila step n sudah lengkap.
function _ssValidateStep(n) {
  var cfg = _SS_STEP_REQUIRED[n];
  if (!cfg) return null;
  for (var i = 0; i < cfg.fields.length; i++) {
    var el = document.getElementById(cfg.fields[i].id);
    if (!el || !(el.value || '').trim()) return cfg.fields[i].label + ' wajib diisi.';
  }
  if (cfg.coords && !_ssLatLng) return 'Titik Koordinat wajib diisi (ambil lokasi, klik di peta, atau isi manual).';
  if (typeof cfg.custom === 'function') { var cErr = cfg.custom(); if (cErr) return cErr; }
  for (var j = 0; j < cfg.fotos.length; j++) {
    var arr = _ssPhotos[cfg.fotos[j].key];
    if (!arr || !arr.length) return cfg.fotos[j].label + ' wajib diupload.';
  }
  return null;
}

// ── Ukuran atap dinamis (multi-roof) ────────────────────────────────
// Normalisasi ukuran atap ke array [{panjang,lebar}] — dukung data lama yg
// hanya punya panjang/lebar tunggal.
function _ssAtapUkuranArr(atap) {
  atap = atap || {};
  if (Array.isArray(atap.ukuran) && atap.ukuran.length) return atap.ukuran;
  if (atap.panjang || atap.lebar) return [{ panjang: atap.panjang || 0, lebar: atap.lebar || 0 }];
  return [];
}
// Baca nilai panjang/lebar tiap atap yg sedang tampil (utk preserve saat jumlah
// diubah, dan saat submit).
function _ssCollectAtapUkuran() {
  var wrap = document.getElementById('ss-atapUkuranWrap');
  var arr = [];
  if (!wrap) return arr;
  var pEls = wrap.querySelectorAll('[id^="ss-atapP-"]');
  Array.prototype.forEach.call(pEls, function(pEl) {
    var idx = pEl.id.replace('ss-atapP-', '');
    var lEl = document.getElementById('ss-atapL-' + idx);
    arr.push({ panjang: pEl.value !== '' ? Number(pEl.value) : '', lebar: (lEl && lEl.value !== '') ? Number(lEl.value) : '' });
  });
  return arr;
}
// Set nilai select Jumlah Atap; tambah opsi bila n melebihi opsi bawaan (mis.
// data lama/hasil edit sheet manual dgn >8 atap) supaya tak ada atap hilang.
function _ssSetAtapJumlah(n) {
  var jEl = document.getElementById('ss-atapJumlah');
  if (!jEl) return;
  n = Math.max(1, parseInt(n, 10) || 1);
  if (!jEl.querySelector('option[value="' + n + '"]')) {

// Render N baris input panjang x lebar sesuai #ss-atapJumlah. `sizes` opsional

// Upload foto pending milik step yang sedang ditinggalkan sebelum benar-benar

function _ssStepNext() {

// ── Peta (Leaflet + Geolocation + input manual) ─────────────────────
var SS_DEFAULT_CENTER = [-2.5, 118]; // tengah Indonesia
var SS_DEFAULT_ZOOM = 5;

function _ssInitMap() {
  if (_ssMap || typeof L === 'undefined') return;
  _ssMap = L.map('ss-map').setView(SS_DEFAULT_CENTER, SS_DEFAULT_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(_ssMap);
  // Klik langsung di peta = salah satu cara memilih titik koordinat.
  _ssMap.on('click', function(e) { _ssSetLatLng(e.latlng.lat, e.latlng.lng, { recenter: false }); });
  setTimeout(function() { if (_ssMap) _ssMap.invalidateSize(); }, 200);
}

function _ssGeoErrMsg(err) {
  if (err.code === err.PERMISSION_DENIED) return 'Izin lokasi ditolak — aktifkan izin lokasi untuk browser/perangkat ini.';
  if (err.code === err.POSITION_UNAVAILABLE) return 'Lokasi tidak tersedia (sinyal GPS/jaringan lemah).';
  if (err.code === err.TIMEOUT) return 'Waktu tunggu habis.';
  return err.message || 'Kesalahan tidak diketahui.';
}

// Strategi berjenjang biar andal walau sinyal GPS lemah / dalam ruangan.
// Urutan sengaja: mulai dari yg PALING mungkin berhasil cepat (terima fix
// yg baru saja tersimpan / akurasi longgar) baru naik ke presisi tinggi.
// Ini menghindari "timeout" beruntun saat menunggu fix GPS baru yg lambat —
// penyebab umum error "gagal mendapatkan lokasi" padahal izin sudah aktif.
var _SS_GEO_ATTEMPTS = [
  { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }, // cepat: terima fix s/d 10 menit terakhir
  { enableHighAccuracy: true,  timeout: 15000, maximumAge: 0 },      // presisi tinggi (fix baru)
  { enableHighAccuracy: false, timeout: 25000, maximumAge: 30000 }   // longgar & sabar (fallback terakhir)
];

// opts.silent = true: dipanggil otomatis di background (cek izin saat form
// dibuka) — tak menampilkan loader/notifikasi error, cukup diam2 gagal & cukup
// 1 percobaan cepat (tak usah eskalasi supaya tidak menahan lama di background).
function _ssAmbilLokasi(opts) {
  opts = opts || {};
  if (!navigator.geolocation) { if (!opts.silent) showNotification('Geolocation tidak didukung perangkat ini.', 'error'); return; }
  var attempts = opts.silent ? [_SS_GEO_ATTEMPTS[0]] : _SS_GEO_ATTEMPTS;
  if (!opts.silent) toggleLoader(true, 'Mengambil lokasi...');
  var i = 0;
  function tryNext() {
    var cfg = attempts[i];
    navigator.geolocation.getCurrentPosition(function(pos) {
      if (!opts.silent) toggleLoader(false);
      _ssSetLatLng(pos.coords.latitude, pos.coords.longitude, { zoom: cfg.enableHighAccuracy ? 18 : 16 });
    }, function(err) {
      // Izin ditolak = final; retry percuma. Beri arahan yg jelas.
      if (err.code === err.PERMISSION_DENIED) {
        if (!opts.silent) {
          toggleLoader(false);
          showNotification('Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser, muat ulang halaman, lalu coba lagi — atau pilih titik langsung di peta / isi manual.', 'error');
        }
        return;
      }
      // Timeout / posisi tak tersedia → coba konfigurasi berikutnya.
      i++;
      if (i < attempts.length) {
        if (!opts.silent) toggleLoader(true, 'Mencoba lagi (' + (i + 1) + '/' + attempts.length + ')...');
        tryNext();
        return;
      }
      if (!opts.silent) {
        toggleLoader(false);
        showNotification('Gagal mengambil lokasi: ' + _ssGeoErrMsg(err) + '. Coba lagi, atau pilih titik langsung di peta / isi manual.', 'error');
      }
    }, cfg);
  }
  tryNext();
}

// Cek status izin lokasi tiap kali form dibuka. Kalau belum pernah
// ditentukan ("prompt") atau sudah diizinkan ("granted"), otomatis picu
// permintaan lokasi (native browser akan memunculkan dialog izin bila
// perlu) — user tak perlu klik tombol dulu. Kalau ditolak ("denied"), tak
// dipicu otomatis (hindari notifikasi error tiap buka form); user tetap
// bisa coba manual via tombol "Lokasi Saat Ini" setelah mengaktifkan izin.
function _ssCheckGeoPermission() {
  if (!navigator.geolocation) return;
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(status) {
      if (status.state === 'granted' || status.state === 'prompt') _ssAmbilLokasi({ silent: true });
    }).catch(function() { _ssAmbilLokasi({ silent: true }); });
  } else {
    _ssAmbilLokasi({ silent: true });
  }
}

// Input manual Latitude/Longitude — memindahkan pin juga.
function _ssLatLngManualChange() {
  var lat = parseFloat((document.getElementById('ss-latitude').value || '').trim());
  var lng = parseFloat((document.getElementById('ss-longitude').value || '').trim());
  if (isNaN(lat) || isNaN(lng)) return;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) { showNotification('Koordinat tidak valid.', 'error'); return; }
  _ssSetLatLng(lat, lng, { recenter: true });
}

// opts.recenter (default true) = geser tampilan peta ke titik ini; false dipakai
// saat klik peta/drag pin agar tampilan tak melompat dari yg sudah dipilih user.
function _ssSetLatLng(lat, lng, opts) {
  opts = opts || {};
  _ssLatLng = { lat: lat, lng: lng };
  document.getElementById('ss-koor-text').innerText = lat.toFixed(6) + ', ' + lng.toFixed(6);
  var latEl = document.getElementById('ss-latitude'), lngEl = document.getElementById('ss-longitude');
  if (latEl) latEl.value = lat.toFixed(6);
  if (lngEl) lngEl.value = lng.toFixed(6);

  if (!_ssMap) _ssInitMap();
  if (!_ssMap) { showNotification('Modul peta belum siap, muat ulang halaman.', 'error'); return; }

  if (opts.recenter !== false) _ssMap.setView([lat, lng], opts.zoom || Math.max(_ssMap.getZoom(), 16));
  if (!_ssMarker) {
    _ssMarker = L.marker([lat, lng], { draggable: true }).addTo(_ssMap);
    _ssMarker.on('dragend', function() {
      var p = _ssMarker.getLatLng();
      _ssSetLatLng(p.lat, p.lng, { recenter: false });
    });
  } else {
    _ssMarker.setLatLng([lat, lng]);
  }
}

// ── Slot foto (Kamera/Galeri, atau buka editor anotasi) ─────────────
function _ssFotoAnotMode(fieldKey) {
  var box = document.getElementById('ss-foto-' + fieldKey);
  return box ? (box.getAttribute('data-anot') || null) : null;
}

// Setiap field foto menyimpan ARRAY foto (bisa lebih dari 1). Foto yang baru
// dipilih disimpan sbg "pending" (preview lokal, belum diupload) — upload
// sungguhan baru terjadi sekaligus saat Submit Survey (lihat
// _ssUploadPendingInFields), bukan seketika saat dipilih, agar memilih foto
// terasa instan. Setelah terupload, entry berubah jadi {fileId, fileUrl, caption}.
function _ssRenderFotoSlot(fieldKey) {
  var box = document.getElementById('ss-foto-' + fieldKey);
  if (!box) return;
  var arr = _ssPhotos[fieldKey] || [];
  var anotMode = box.getAttribute('data-anot');

  var thumbsHtml = arr.map(function(f) {
    var key = _ssFotoKey(f);
    var thumbInner = f.pending
      ? '<div class="relative h-24 w-24 rounded-lg overflow-hidden border border-amber-300 bg-slate-50">'
        + '<img src="' + f.localPreview + '" class="h-full w-full object-cover">'
        + '<span class="absolute bottom-0 inset-x-0 bg-amber-500/90 text-white text-[9px] font-bold text-center py-0.5">Menunggu upload</span>'
        + '</div>'
      : '<button type="button" class="ss-foto-view block h-24 w-24 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 cursor-zoom-in" data-fileid="' + _ssEsc(f.fileId) + '" data-fileurl="' + _ssEsc(f.fileUrl || '') + '">'
        +   '<img src="https://drive.google.com/thumbnail?id=' + f.fileId + '&sz=w200" class="h-full w-full object-cover" loading="lazy"></button>';
    return '<div class="inline-block align-top w-32">'
      + '<div class="relative inline-block">'
      +   thumbInner
      +   '<button type="button" onclick="_ssHapusFotoSlot(\'' + fieldKey + '\', \'' + key + '\')" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white h-5 w-5 rounded-full text-[10px] shadow flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>'
      + '</div>'
      + '<input type="text" value="' + _ssEsc(f.caption || '') + '" placeholder="Keterangan foto..." onchange="_ssFotoCaptionChange(\'' + fieldKey + '\', \'' + key + '\', this.value)" class="mt-1.5 w-full px-2 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100">'
      + '</div>';
  }).join('');

  var uploadBtns = '<div class="flex items-center gap-2 mt-2">'
    + '<label class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition"><i class="fa-solid fa-camera"></i> Kamera'
    +   '<input type="file" accept="image/*" capture="environment" class="hidden" onchange="_ssHandleFotoInput(\'' + fieldKey + '\', this)"></label>'
    + '<label class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition"><i class="fa-regular fa-images"></i> Galeri'
    +   '<input type="file" accept="image/*"' + (anotMode ? '' : ' multiple') + ' class="hidden" onchange="_ssHandleFotoInput(\'' + fieldKey + '\', this)"></label>'
    + '</div>';

  box.innerHTML = (thumbsHtml ? '<div class="flex flex-wrap gap-3">' + thumbsHtml + '</div>' : '') + uploadBtns;
}

// Field beranotasi (kotak/garis) hanya proses 1 foto per pilih (perlu digambar
// manual); field biasa boleh pilih banyak foto sekaligus, diupload berurutan.
function _ssHandleFotoInput(fieldKey, inputEl) {
  var files = Array.prototype.slice.call(inputEl.files || []);
  inputEl.value = '';
  if (!files.length) return;
  for (var i = 0; i < files.length; i++) {
    if (files[i].size > 15 * 1024 * 1024) { showNotification('Ukuran foto maksimal 15MB: ' + files[i].name, 'error'); return; }
  }
  var anotMode = _ssFotoAnotMode(fieldKey);
  if (anotMode) {
    var reader1 = new FileReader();
    reader1.onload = function(e) { _ssAnotOpen(anotMode, fieldKey, e.target.result, files[0].type); };
    reader1.onerror = function() { showNotification('Gagal membaca file.', 'error'); };
    reader1.readAsDataURL(files[0]);
    return;
  }
  // Resize/kompres di browser lalu simpan sbg "pending" (preview lokal saja,
  // TIDAK langsung upload) — upload sungguhan baru terjadi sekaligus saat
  // Submit Survey (lihat _ssUploadPendingInFields), supaya memilih foto
  // terasa instan di sepanjang pengisian form.
  files.forEach(function(file) {
    _ssResizeImage(file, function(dataUrl) {
      if (!dataUrl) { showNotification('Gagal memproses foto: ' + file.name, 'error'); return; }
      if (!_ssPhotos[fieldKey]) _ssPhotos[fieldKey] = [];
      _ssPhotos[fieldKey].push({
        _localId: _ssNextLocalId(), pending: true, localPreview: dataUrl,
        base64: dataUrl.split(',')[1], fileName: (file.name || 'foto').replace(/\.[a-zA-Z0-9]+$/, '') + '.jpg',
        mimeType: 'image/jpeg', caption: ''

      _ssRenderFotoSlot(fieldKey);
    });
  });
}

function _ssFotoCaptionChange(fieldKey, key, value) {
  var arr = _ssPhotos[fieldKey] || [];
  var f = arr.filter(function(x) { return _ssFotoKey(x) === key; })[0];
  if (f) f.caption = value;
}

function _ssHapusFotoSlot(fieldKey, key) {
  var arr = _ssPhotos[fieldKey] || [];
  var idx = -1;
  for (var i = 0; i < arr.length; i++) { if (_ssFotoKey(arr[i]) === key) { idx = i; break; } }
  if (idx === -1) return;
  var f = arr[idx];
  arr.splice(idx, 1);
  _ssRenderFotoSlot(fieldKey);
  if (!f.pending && f.fileId) {
    // Mode edit: baris sheet masih menunjuk ke foto ini sampai "Simpan
    // Perubahan" berhasil — jangan trash filenya sekarang, cukup antre.
    // Kalau edit dibatalkan, file lama tetap utuh (tak ada perubahan nyata).
    if (_ssEditMode) _ssPendingFotoDeletes.push(f.fileId);
    else google.script.run.withFailureHandler(function() {}).hapusSiteSurveyFoto(f.fileId);
  }
}

// ── Upload foto pending — dipicu SEKALIGUS saat Submit Survey, bukan saat
// foto dipilih atau pindah step. Hanya entry berstatus pending yg diupload.
function _ssUploadPendingInFields(fieldKeys, onDone) {
  var pending = [];
  fieldKeys.forEach(function(key) {
    (_ssPhotos[key] || []).forEach(function(f) { if (f.pending) pending.push({ fieldKey: key, foto: f }); });
  });
  if (!pending.length) { onDone(true); return; }
  if (!_ssCurrentId) { showNotification('Sesi form belum siap, coba buka ulang form.', 'error'); onDone(false); return; }
  var idx = 0;
  toggleLoader(true, 'Mengupload foto (0/' + pending.length + ')...');
  function next() {
    if (idx >= pending.length) { toggleLoader(false); onDone(true); return; }
    toggleLoader(true, 'Mengupload foto (' + (idx + 1) + '/' + pending.length + ')...');
    var item = pending[idx];
    google.script.run.withSuccessHandler(function(res) {
      if (!res || res.success === false) { toggleLoader(false); showNotification((res && res.message) || 'Gagal upload foto.', 'error'); onDone(false); return; }
      item.foto.fileId = res.foto.fileId;
      item.foto.fileUrl = res.foto.fileUrl;
      delete item.foto.pending;
      delete item.foto.base64;
      delete item.foto.localPreview;
      _ssRenderFotoSlot(item.fieldKey);
      idx++; next();
    }).withFailureHandler(function(err) {
      toggleLoader(false); showNotification((err && err.message) || 'Gagal upload foto.', 'error'); onDone(false);
    }).uploadSiteSurveyFoto({ surveyId: _ssCurrentId, fieldKey: item.fieldKey, base64Data: item.foto.base64, fileName: item.foto.fileName, mimeType: item.foto.mimeType });
  }
  next();
}

// ── Editor anotasi foto (kotak utk BoS, garis utk jalur kabel) ──────
var _ssAnot = null; // { mode, fieldKey, img, canvas, ctx, color, size, shapes:[], drawing, start }

function _ssAnotOpen(mode, fieldKey, dataUrl, mimeType) {
  var canvas = document.getElementById('ss-anot-canvas');
  var img = new Image();
  img.onload = function() {
    var maxDim = 1600, w = img.naturalWidth || 800, h = img.naturalHeight || 600;
    var sc = Math.min(1, maxDim / Math.max(w, h));
    canvas.width = Math.round(w * sc); canvas.height = Math.round(h * sc);
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    _ssAnot = { mode: mode, fieldKey: fieldKey, img: img, canvas: canvas, ctx: ctx, color: '#ef4444', size: 4, shapes: [], drawing: false, start: null, mimeType: mimeType || 'image/jpeg' };
    _ssAnotSetColor('#ef4444');
    var sz = document.getElementById('ss-anot-size'); if (sz) sz.value = 4;
    var lbl = document.getElementById('ss-anot-mode-label');
    if (lbl) lbl.innerText = mode === 'rect' ? 'Tandai Area (kotak)' : 'Tandai Jalur (garis)';

    canvas.onmousedown = _ssAnotDown; canvas.onmousemove = _ssAnotMove;
    canvas.onmouseup = _ssAnotUp; canvas.onmouseleave = _ssAnotUp;
    canvas.addEventListener('touchstart', _ssAnotDown, { passive: false });
    canvas.addEventListener('touchmove', _ssAnotMove, { passive: false });
    canvas.addEventListener('touchend', _ssAnotUp, { passive: false });
    canvas.addEventListener('touchcancel', _ssAnotUp, { passive: false });

    document.getElementById('modal-ss-anotasi').classList.remove('hidden');
  };
  img.onerror = function() { showNotification('Gagal memuat foto.', 'error'); };
  img.src = dataUrl;
}

function _ssAnotPos(e) {
  var r = _ssAnot.canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return { x: (cx - r.left) * (_ssAnot.canvas.width / r.width), y: (cy - r.top) * (_ssAnot.canvas.height / r.height) };
}

function _ssAnotDrawShape(ctx, s) {
  ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (s.type === 'rect') {
    ctx.strokeRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1));
  } else {
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
}

function _ssAnotRedraw() {
  if (!_ssAnot) return;
  var ctx = _ssAnot.ctx, c = _ssAnot.canvas;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(_ssAnot.img, 0, 0, c.width, c.height);
  _ssAnot.shapes.forEach(function(s) { _ssAnotDrawShape(ctx, s); });
}

function _ssAnotDown(e) {
  if (!_ssAnot) return; e.preventDefault();
  _ssAnot.drawing = true;
  _ssAnot.start = _ssAnotPos(e);
}
function _ssAnotMove(e) {
  if (!_ssAnot || !_ssAnot.drawing) return; e.preventDefault();
  var p = _ssAnotPos(e);
  _ssAnotRedraw();
  _ssAnotDrawShape(_ssAnot.ctx, { type: _ssAnot.mode, x1: _ssAnot.start.x, y1: _ssAnot.start.y, x2: p.x, y2: p.y, color: _ssAnot.color, size: _ssAnot.size });
}
function _ssAnotUp(e) {
  if (!_ssAnot || !_ssAnot.drawing) return;
  _ssAnot.drawing = false;
  if (e && e.type === 'touchcancel') { _ssAnot.start = null; _ssAnotRedraw(); return; }
  var p = _ssAnotPos(e);
  var dx = p.x - _ssAnot.start.x, dy = p.y - _ssAnot.start.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
    _ssAnot.shapes.push({ type: _ssAnot.mode, x1: _ssAnot.start.x, y1: _ssAnot.start.y, x2: p.x, y2: p.y, color: _ssAnot.color, size: _ssAnot.size });
  }
  _ssAnot.start = null;
  _ssAnotRedraw();
}

function _ssAnotSetColor(c) {
  if (_ssAnot) _ssAnot.color = c;
  Array.prototype.forEach.call(document.querySelectorAll('.ss-anot-color'), function(b) {
    var on = b.getAttribute('data-color') === c;
    b.classList.toggle('ring-white', on);
    b.classList.toggle('ring-transparent', !on);
  });
}
function _ssAnotSetSize(v) { if (_ssAnot) _ssAnot.size = parseInt(v, 10) || 4; }
function _ssAnotUndo() { if (_ssAnot && _ssAnot.shapes.length) { _ssAnot.shapes.pop(); _ssAnotRedraw(); } }
function _ssAnotClear() { if (_ssAnot) { _ssAnot.shapes = []; _ssAnotRedraw(); } }
function _ssAnotCancel() { document.getElementById('modal-ss-anotasi').classList.add('hidden'); _ssAnot = null; }

function _ssAnotSave() {
  if (!_ssAnot) return;
  var dataUrl;
  try { dataUrl = _ssAnot.canvas.toDataURL('image/jpeg', 0.9); }
  catch (e) { showNotification('Gagal memproses gambar.', 'error'); return; }
  var fieldKey = _ssAnot.fieldKey;
  document.getElementById('modal-ss-anotasi').classList.add('hidden');
  _ssAnot = null;
  // Simpan sbg pending (blm upload) — sama seperti foto biasa, terupload
  // sungguhan saat pindah step.
  if (!_ssPhotos[fieldKey]) _ssPhotos[fieldKey] = [];
  _ssPhotos[fieldKey].push({
    _localId: _ssNextLocalId(), pending: true, localPreview: dataUrl,
    base64: dataUrl.split(',')[1], fileName: fieldKey + '.jpg', mimeType: 'image/jpeg', caption: ''
  });
  _ssRenderFotoSlot(fieldKey);
}

// ── Submit final ─────────────────────────────────────────────────
function _ssSubmit() {
  if (!_ssCurrentId) { showNotification('Sesi form belum siap, coba buka ulang form.', 'error'); return; }
  // Upload SEMUA foto (dari semua step) sekaligus di sini, baru submit data
  // teks — pindah step sebelumnya tidak mengupload apa pun.
  _ssUploadPendingInFields(_SS_FOTO_FIELDS, function(ok) {
    if (ok) _ssDoSubmit();
  });
}

function _ssDoSubmit() {
  for (var n = 1; n <= 5; n++) {
    var err = _ssValidateStep(n);
    if (err) { _ssGotoStep(n); showNotification(err, 'error'); return; }
  }

  var g = function(id) { var el = document.getElementById(id); return el ? (el.value || '').trim() : ''; };
  var gn = function(id) { var v = g(id); return v === '' ? 0 : Number(v); };

  var atapUkuran = _ssCollectAtapUkuran().map(function(u) { return { panjang: Number(u.panjang) || 0, lebar: Number(u.lebar) || 0 }; });

  var payload = {
    id: _ssCurrentId,
    dibuatOleh: _ssUserNama(),
    // Edit mempertahankan id pembuat asli (bukan id user yg sedang edit) agar
    // hak edit tetap melekat ke pembuat aslinya, bukan berpindah ke pengedit.
    dibuatOlehId: _ssEditMode ? _ssEditOriginalDibuatOlehId : _ssUserId(),
    // Edit mempertahankan Tanggal Survey asli (bukan tanggal hari ini) —
    // hanya submit baru yg memakai tanggal saat itu disurvei/diinput.
    tanggalSurvey: _ssEditMode ? _ssEditOriginalTanggal : _ssTodayDDMMYYYY(),
    namaSite: g('ss-namaSite'),
    namaPIC: g('ss-namaPIC'),
    telepon: g('ss-telepon'),
    alamat: g('ss-alamat'),
    latitude: _ssLatLng ? _ssLatLng.lat : null,
    longitude: _ssLatLng ? _ssLatLng.lng : null,
    arahBangunan: g('ss-arahBangunan'),
    tinggiBangunan: gn('ss-tinggiBangunan'),
    fotoBangunan: _ssPhotos.fotoBangunan || [],
    kelistrikan: {
      idPelangganPLN: g('ss-idPelangganPLN'), dayaPLN: gn('ss-dayaPLN'), phase: g('ss-phase'),
      ratingBreaker: gn('ss-ratingBreaker'), fotoKwh: _ssPhotos.fotoKwh || [], fotoPHB: _ssPhotos.fotoPHB || []
    },
    bos: {
      lokasi: g('ss-bosLokasi'), lebar: gn('ss-bosLebar'), tinggi: gn('ss-bosTinggi'),
      jenisTembok: g('ss-bosJenisTembok'), jarakInterkoneksi: gn('ss-bosJarakInterkoneksi'),
      foto: _ssPhotos.bosFoto || []
    },
    atap: {
      jenis: g('ss-atapJenis'), arah: g('ss-atapArah'), rangka: g('ss-atapRangka'),
      mounting: g('ss-atapMounting'),
      jumlahAtap: atapUkuran.length, ukuran: atapUkuran,
      // panjang/lebar (atap pertama) dipertahankan utk kompatibilitas data lama.
      panjang: atapUkuran[0] ? atapUkuran[0].panjang : 0, lebar: atapUkuran[0] ? atapUkuran[0].lebar : 0,
      fotoAtap: _ssPhotos.fotoAtap || [], fotoRangka: _ssPhotos.fotoRangka || [], fotoAkses: _ssPhotos.fotoAkses || []
    },
    jalurKabel: {
      panjangPV: gn('ss-panjangPV'), panjangAC: gn('ss-panjangAC'),
      fotoPV: _ssPhotos.fotoPV || [], fotoAC: _ssPhotos.fotoAC || []
    }
  };

  toggleLoader(true, _ssEditMode ? 'Menyimpan perubahan...' : 'Menyimpan survey...');
  var handler = function(res) {
    toggleLoader(false);
    if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal menyimpan survey.', 'error'); return; }
    showNotification(res.message || 'Survey tersimpan.');
    // Baris sheet sudah ditimpa & tak lagi menunjuk foto yang dihapus saat
    // edit — baru sekarang aman men-trash file-file tsb dari Drive.
    if (_ssEditMode && _ssPendingFotoDeletes.length) {
      _ssPendingFotoDeletes.forEach(function(fileId) {
        google.script.run.withFailureHandler(function() {}).hapusSiteSurveyFoto(fileId);
      });
    }
    document.getElementById('ss-form-view').classList.add('hidden');
    document.getElementById('ss-list-view').classList.remove('hidden');
    loadSiteSurvey();
  };
  var failHandler = function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal menyimpan survey.', 'error'); };
  if (_ssEditMode) {
    google.script.run.withSuccessHandler(handler).withFailureHandler(failHandler).updateSiteSurvey(payload);
  } else {
    google.script.run.withSuccessHandler(handler).withFailureHandler(failHandler).submitSiteSurvey(payload);
  }
}

function _ssRenderDetail() {

    var hapusBtn = _ssCanDelete(d)

  }

  var petaBtn = (d.latitude != null && d.longitude != null)

    : '';
  document.getElementById('ss-detail-head').innerHTML =
      '<div class="flex flex-wrap items-start justify-between gap-3 text-xs">'
    +   '<div class="text-slate-400">'
    +     '<p class="font-bold text-slate-600">' + _ssEsc(d.namaPIC || '-') + '</p>'
    +     '<p class="mt-1">' + _ssEsc(d.telepon || '') + '</p>'
    +     '<p class="text-slate-500 mt-2"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>' + _ssEsc(d.alamat || '-') + '</p>'
    +   '</div>'
    +   '<div class="text-right">'
    +     petaBtn
    +   '</div>'
    + '</div>';

  var kel = d.kelistrikan || {}, bos = d.bos || {}, atap = d.atap || {}, jk = d.jalurKabel || {};

  function fotoThumb(f) {
    if (!f || !f.fileId) return '';
    // data-* + event delegation (bukan onclick inline) agar tak rawan bug
    // escaping kutip pada URL Drive yang panjang/kompleks.
    var img = '<button type="button" class="ss-foto-view block h-20 w-20 rounded-lg overflow-hidden border border-slate-200 bg-slate-50 cursor-zoom-in" data-fileid="' + _ssEsc(f.fileId) + '" data-fileurl="' + _ssEsc(f.fileUrl || '') + '"><img src="https://drive.google.com/thumbnail?id=' + f.fileId + '&sz=w200" class="h-full w-full object-cover" loading="lazy"></button>';
    return '<div class="w-20">' + img + (f.caption ? '<p class="text-[10px] text-slate-500 mt-1 break-words">' + _ssEsc(f.caption) + '</p>' : '') + '</div>';
  }
  // Label per field ditampilkan di atas kelompok foto-nya agar jelas foto
  // mana untuk field mana (mis. "Foto kWh Meter" vs "Foto PHB"). Setiap foto
  // punya keterangan (caption) masing-masing bila diisi saat upload.
  function fotoGroup(label, arr) {
    arr = Array.isArray(arr) ? arr : (arr ? [arr] : []);
    arr = arr.filter(function(f) { return f && f.fileId; });
    if (!arr.length) return '';
    return '<div>'
      + '<p class="text-[10px] text-slate-400 uppercase font-semibold mb-1.5">' + _ssEsc(label) + '</p>'
      + '<div class="flex flex-wrap gap-3">' + arr.map(fotoThumb).join('') + '</div>'
      + '</div>';
  }
  // Susun beberapa fotoGroup() berdampingan (horizontal, wrap di layar sempit)
  // bukan menumpuk ke bawah — dipakai saat 1 bagian punya >1 field foto.
  function fotoGroups() {
    var parts = Array.prototype.slice.call(arguments).filter(Boolean);
    if (!parts.length) return '';
    return '<div class="flex flex-wrap gap-6">' + parts.join('') + '</div>';
  }
  function row(label, val) {
    var has = val || val === 0;
    return '<div><p class="text-[10px] text-slate-400 uppercase font-semibold">' + label + '</p><p class="text-sm font-semibold text-slate-700">' + (has ? _ssEsc(val) : '-') + '</p></div>';

  function section(title, icon, bodyHtml) {
    return '<div class="bg-white rounded-2xl border border-slate-150 overflow-hidden">'
      + '<div class="px-5 py-3 bg-slate-50 border-b border-slate-100 font-extrabold text-sm text-slate-700 flex items-center gap-2"><i class="fa-solid ' + icon + ' text-blue-500"></i>' + title + '</div>'
      + '<div class="p-5 space-y-4">' + bodyHtml + '</div></div>';
  }

  var body = '';
  body += section('A. Informasi Umum', 'fa-house',
      '<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">'
    +   row('Arah Hadap Bangunan', d.arahBangunan)
    +   row('Tinggi Bangunan', d.tinggiBangunan ? d.tinggiBangunan + ' m' : '')
    + '</div>'
    + fotoGroup('Foto Bangunan Tampak Depan', d.fotoBangunan));

  body += section('B. Informasi Kelistrikan', 'fa-bolt',
      '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">'
    +   row('ID Pelanggan PLN', kel.idPelangganPLN)
    +   row('Daya PLN', kel.dayaPLN ? kel.dayaPLN + ' VA' : '')
    +   row('Phase', kel.phase)
    +   row('Rating Breaker', kel.ratingBreaker ? kel.ratingBreaker + ' A' : '')
    + '</div>'
    + fotoGroups(fotoGroup('Foto kWh Meter', kel.fotoKwh), fotoGroup('Foto Panel Hubung Bagi (PHB)', kel.fotoPHB)));

  body += section('C. Balance of System (BoS)', 'fa-server',
      '<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">'
    +   row('Lokasi Penempatan', bos.lokasi)
    +   row('Ukuran Area (Lebar x Tinggi)', (bos.lebar || bos.tinggi) ? (bos.lebar || 0) + ' x ' + (bos.tinggi || 0) + ' m' : '')
    +   row('Jenis Tembok', bos.jenisTembok)
    +   row('Jarak ke Interkoneksi', bos.jarakInterkoneksi ? bos.jarakInterkoneksi + ' m' : '')
    + '</div>'
    + fotoGroup('Foto Area BoS & Titik Interkoneksi', bos.foto));

  var atapUkr = _ssAtapUkuranArr(atap);
  var atapUkrStr = atapUkr.length
    ? atapUkr.map(function(u, i) { return (atapUkr.length > 1 ? 'Atap ' + (i + 1) + ': ' : '') + (u.panjang || 0) + ' x ' + (u.lebar || 0) + ' m'; }).join(atapUkr.length > 1 ? '  ·  ' : '')
    : '';
  body += section('D. Informasi Atap', 'fa-house-chimney',
      '<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">'
    +   row('Jenis Atap', atap.jenis)
    +   row('Arah Hadap Atap', atap.arah)
    +   row('Rangka Atap', atap.rangka)
    +   row('Jenis Mounting', atap.mounting)
    +   row('Jumlah Atap', atapUkr.length ? atapUkr.length + ' atap' : '')
    + '</div>'
    + '<div class="mt-1">' + row('Ukuran Atap (Panjang x Lebar)', atapUkrStr) + '</div>'
    + fotoGroups(fotoGroup('Foto Atap', atap.fotoAtap), fotoGroup('Foto Rangka Atap', atap.fotoRangka), fotoGroup('Foto Akses ke Atap', atap.fotoAkses)));

  body += section('E. Jalur Kabel', 'fa-timeline',
      '<div class="grid grid-cols-2 gap-3">'
    +   row('Panjang Kabel PV', jk.panjangPV ? jk.panjangPV + ' m' : '')
    +   row('Panjang Kabel AC', jk.panjangAC ? jk.panjangAC + ' m' : '')
    + '</div>'
    + fotoGroups(fotoGroup('Foto Jalur Kabel PV', jk.fotoPV), fotoGroup('Foto Jalur Kabel AC', jk.fotoAC)));

  document.getElementById('ss-detail-body').innerHTML = body;
}

// ── Edit survey lama (isi ulang form dari data yang sudah ada) ─────────────
// Selalu fetch detail terbaru dari server (bukan pakai _ssDetailCurrent yg
// belum tentu ada — dipanggil baik dari modal detail maupun langsung dari
// tombol Edit di tabel list). Foto lama diperlakukan sbg sudah terupload

// pending->upload saat Simpan Perubahan. Tanggal Survey asli dipertahankan

window.bukaEditSiteSurvey = function(id) {
  toggleLoader(true, 'Memuat data survey...');

function _ssFillEditForm(d) {
  _ssResetForm();
  _ssEditMode = true;
  _ssCurrentId = d.id;
  _ssEditOriginalTanggal = d.tanggalSurvey || _ssTodayDDMMYYYY();
  _ssEditOriginalDibuatOlehId = d.dibuatOlehId || '';

  document.getElementById('ss-list-view').classList.add('hidden');
  document.getElementById('ss-form-view').classList.remove('hidden');
  _ssGotoStep(1);
  _ssInitMap();

  var set = function(id, val) { var el = document.getElementById(id); if (el) el.value = (val == null ? '' : val); };

  // A. Informasi Umum
  set('ss-namaSite', d.namaSite);
  set('ss-namaPIC', d.namaPIC);
  set('ss-telepon', d.telepon);
  set('ss-alamat', d.alamat);
  set('ss-arahBangunan', d.arahBangunan);
  set('ss-tinggiBangunan', d.tinggiBangunan);
  _ssPhotos.fotoBangunan = (d.fotoBangunan || []).slice();
  // Dipanggil langsung (bukan ditunda) — _ssLatLng harus terisi seketika
  // supaya validasi "Titik Koordinat wajib diisi" tak gagal semu kalau user
  // langsung klik Selanjutnya. Marker peta tetap benar meski container masih
  // 0px saat ini — _ssInitMap() sudah menjadwalkan invalidateSize() sendiri.
  if (d.latitude != null && d.longitude != null) _ssSetLatLng(d.latitude, d.longitude, { zoom: 16 });

  // B. Informasi Kelistrikan
  var kel = d.kelistrikan || {};
  set('ss-idPelangganPLN', kel.idPelangganPLN);
  set('ss-phase', kel.phase);
  _ssOnPhaseChange();
  set('ss-dayaPLN', kel.dayaPLN ? String(kel.dayaPLN) : '');
  set('ss-ratingBreaker', kel.ratingBreaker ? String(kel.ratingBreaker) : '');
  _ssPhotos.fotoKwh = (kel.fotoKwh || []).slice();
  _ssPhotos.fotoPHB = (kel.fotoPHB || []).slice();

  // C. Balance of System (BoS)
  var bos = d.bos || {};
  set('ss-bosLokasi', bos.lokasi);
  set('ss-bosLebar', bos.lebar);
  set('ss-bosTinggi', bos.tinggi);
  set('ss-bosJenisTembok', bos.jenisTembok);
  set('ss-bosJarakInterkoneksi', bos.jarakInterkoneksi);
  _ssPhotos.bosFoto = (bos.foto || []).slice();

  // D. Informasi Atap
  var atap = d.atap || {};
  set('ss-atapJenis', atap.jenis);
  set('ss-atapArah', atap.arah);
  set('ss-atapRangka', atap.rangka);
  set('ss-atapMounting', atap.mounting);
  _ssRenderAtapUkuran(_ssAtapUkuranArr(atap));   // set jumlah + render (dukung >8 atap)
  _ssPhotos.fotoAtap = (atap.fotoAtap || []).slice();
  _ssPhotos.fotoRangka = (atap.fotoRangka || []).slice();
  _ssPhotos.fotoAkses = (atap.fotoAkses || []).slice();

  // E. Jalur Kabel
  var jk = d.jalurKabel || {};
  set('ss-panjangPV', jk.panjangPV);
  set('ss-panjangAC', jk.panjangAC);
  _ssPhotos.fotoPV = (jk.fotoPV || []).slice();
  _ssPhotos.fotoAC = (jk.fotoAC || []).slice();

  _SS_FOTO_FIELDS.forEach(_ssRenderFotoSlot);
  var submitBtn = document.getElementById('ss-btn-submit');
  if (submitBtn) submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Simpan Perubahan';
  showNotification('Mode edit — ' + d.id, 'info');
}

// ── Export PDF laporan Site Survey (desain konsisten dgn laporan lain) ─────
// Dipakai baik dari modal detail (_ssExportPDF) maupun langsung dari tombol

function _ssExportPDF() {

function _ssExportPDFById(id) {
  if (!window.jspdf || !window.jspdf.jsPDF) { showNotification('Modul PDF belum siap. Muat ulang halaman.', 'error'); return; }
  toggleLoader(true, 'Menyiapkan PDF laporan Site Survey (memuat foto)...');

    catch (e) { showNotification('Gagal membuat PDF: ' + e.message, 'error'); }
  }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal membuat PDF.', 'error'); })
    .getSiteSurveyReportData(id);

function _ssBuildPDF(d) {
  var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var PW = 210, PH = 297, ML = 14, MR = 14, CW = PW - ML - MR;
  var DARK = [30,41,59], SLATE = [100,116,139], WHITE = [255,255,255];
  var BOTTOM = 284;
  var y;

  function header() {
    doc.setFillColor.apply(doc, DARK); doc.rect(0, 0, PW, 24, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor.apply(doc, WHITE);
    doc.text('LAPORAN SITE SURVEY', ML, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(190,200,220);
    doc.text('PT. RENUS GLOBAL INDONESIA', ML, 17);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(170,195,255);
    doc.text('ID Survey:', PW - MR, 9, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setTextColor.apply(doc, WHITE);
    doc.text(d.id || '-', PW - MR, 14, { align:'right' });
    doc.setFontSize(7); doc.setTextColor(190,200,220);
    doc.text('Dicetak: ' + (d.tglExport || ''), PW - MR, 19, { align:'right' });
  }
  // Kop gelap hanya di halaman pertama; halaman berikutnya mulai dari margin atas.
  function newPage() { doc.addPage(); y = 16; }
  function ensure(h) { if (y + h > BOTTOM) { newPage(); } }

  function sectionBar(title) {
    ensure(12);
    doc.setFillColor(51,65,85); doc.roundedRect(ML, y, CW, 7, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc, WHITE);
    doc.text(title, ML + 3, y + 4.8);
    y += 11;
  }
  // x0/w0 opsional (default ML/CW) — dipakai saat field digambar di dalam
  // kartu (dataCard) yg butuh padding kiri/kanan.
  function fieldRow(pairs, x0, w0) {
    x0 = x0 == null ? ML : x0; w0 = w0 == null ? CW : w0;
    pairs = pairs.filter(function (p) { return p[1]; });
    if (!pairs.length) return;
    var cols = 3, colW = w0 / cols, rowH = 8;
    var rows = Math.ceil(pairs.length / cols);
    ensure(rows * rowH + 2);
    pairs.forEach(function (p, i) {
      var col = i % cols, rowI = Math.floor(i / cols);
      var bx = x0 + col * colW, by = y + rowI * rowH;
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor.apply(doc, SLATE);
      doc.text(String(p[0]).toUpperCase(), bx, by);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, DARK);
      doc.text(String(p[1]), bx, by + 4.5);
    });
    y += rows * rowH + 2;
  }
  // Field lebar penuh (label + nilai yg bisa membungkus banyak baris) — dipakai
  // utk nilai panjang spt Alamat yg tak muat di kolom sempit fieldRow.
  function fullField(label, value, x0, w0) {
    x0 = x0 == null ? ML : x0; w0 = w0 == null ? CW : w0;
    if (!value && value !== 0) return;
    var lines = doc.splitTextToSize(String(value), w0);
    ensure(4.5 + lines.length * 4 + 2);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor.apply(doc, SLATE);
    doc.text(String(label).toUpperCase(), x0, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, DARK);
    doc.text(lines, x0, y + 4.5);
    y += 4.5 + (lines.length - 1) * 4 + 4;
  }
  // Bungkus sekelompok field dlm kartu latar abu muda selebar section bar
  // (ML..ML+CW, sama persis dgn bar judul di atasnya). Tinggi dihitung dulu —
  // pakai formula yg sama dgn fieldRow/fullField — agar kotak latar bisa
  // digambar lebih dahulu, baru field-nya di atasnya dgn padding dalam.
  // blocks: [{type:'row', pairs:[[label,val],...]} | {type:'full', label, value}]
  function dataCard(blocks) {
    var padX = 5, padTop = 5, padBot = 3;
    var innerL = ML + padX, innerW = CW - 2 * padX;
    var contentH = 0;
    blocks.forEach(function (b) {
      if (b.type === 'full') {
        if (b.value || b.value === 0) {
          var lines = doc.splitTextToSize(String(b.value), innerW);
          contentH += 4.5 + (lines.length - 1) * 4 + 4;
        }
      } else {
        var n = b.pairs.filter(function (p) { return p[1]; }).length;
        contentH += n ? Math.ceil(n / 3) * 8 + 2 : 0;
      }
    });
    var panelH = padTop + contentH + padBot;
    ensure(panelH);
    var top = y;
    doc.setFillColor(248,250,252); doc.setDrawColor(226,232,240);
    doc.roundedRect(ML, top, CW, panelH, 2.5, 2.5, 'FD');
    y = top + padTop;
    blocks.forEach(function (b) {
      if (b.type === 'full') fullField(b.label, b.value, innerL, innerW);
      else fieldRow(b.pairs, innerL, innerW);
    });
    y = top + panelH + 5;
  }
  // Layout foto DINAMIS mengikuti jumlah foto per grup, agar tidak banyak ruang
  // kosong & foto sebesar mungkin:
  //  - 1 atau 2 foto  → 1 kolom, lebar penuh (2 foto ditumpuk 2 baris).
  //  - >= 3 foto      → 2 kolom; bila jumlah ganjil, foto terakhir lebar penuh.
  var _SS_PH_GAP = 8, _SS_PH_MAXH_FULL = 135, _SS_PH_MAXH_HALF = 95;
  var _SS_CAP_FS = 8.5, _SS_CAP_LH = 3.8;   // font & tinggi baris caption foto
  var _SS_CAP_PADX = 2.5, _SS_CAP_PADY = 1.8, _SS_CAP_GAP = 2; // latar kotak caption
  function _ssPhotoDims(f, boxW, maxH) {
    var iw = 4, ih = 3;
    try { var pr = doc.getImageProperties(f.dataUrl); iw = pr.width; ih = pr.height; } catch (e) {}
    var w = boxW, h = w * (ih / iw);
    if (h > maxH) { h = maxH; w = h * (iw / ih); }   // batasi tinggi → sesuaikan lebar
    return { w: w, h: h };
  }
  function _ssPhotoCapLines(f, boxW) {
    if (!f.caption) return [];
    // Set font caption dulu agar wrapping (splitTextToSize) sesuai ukuran render;
    // lebar dikurangi padding kotak latar.
    doc.setFont('helvetica','normal'); doc.setFontSize(_SS_CAP_FS);
    var cap = doc.splitTextToSize(f.caption, boxW - _SS_CAP_PADX * 2);
    if (cap.length > 6) { cap = cap.slice(0, 6); cap[5] = cap[5].replace(/.{0,3}$/, '...'); }
    return cap;
  }
  // Ukur sel-sel 1 baris (foto+caption) + boxW/maxH-nya.
  function _ssMeasureRow(row) {
    var full = row.length === 1;
    var boxW = full ? CW : (CW - _SS_PH_GAP) / 2;
    var maxH = full ? _SS_PH_MAXH_FULL : _SS_PH_MAXH_HALF;
    var cells = row.map(function (f) {
      var d = _ssPhotoDims(f, boxW, maxH);
      var cap = _ssPhotoCapLines(f, boxW);
      return { f: f, w: d.w, h: d.h, cap: cap, blockH: d.h + (cap.length ? _SS_CAP_GAP + cap.length * _SS_CAP_LH + _SS_CAP_PADY * 2 : 0) };
    });
    return { boxW: boxW, cells: cells, rowH: cells.reduce(function (m, c) { return Math.max(m, c.blockH); }, 0) };
  }
  function photoGroup(label, arr) {
    arr = (arr || []).filter(function (f) { return f && f.dataUrl; });
    if (!arr.length) return;

    // Susun baris: 1-2 foto → tiap foto 1 baris penuh; >=3 → berpasangan,
    // sisa ganjil terakhir jadi 1 baris penuh.
    var rows = [];
    if (arr.length <= 2) {
      arr.forEach(function (f) { rows.push([f]); });
    } else {
      for (var i = 0; i < arr.length; i += 2) {
        if (i === arr.length - 1) rows.push([arr[i]]);
        else rows.push([arr[i], arr[i + 1]]);
      }
    }

    // Label + baris foto PERTAMA harus muat bersama di halaman ini — cegah
    // label "yatim" (tertinggal di halaman sebelumnya, fotonya pindah halaman).
    var first = _ssMeasureRow(rows[0]);
    ensure(4.5 + first.rowH);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor.apply(doc, SLATE);
    doc.text(label.toUpperCase(), ML, y + 2.5); y += 4.5;

    rows.forEach(function (row, ri) {
      var m = ri === 0 ? first : _ssMeasureRow(row);
      if (y + m.rowH > BOTTOM) newPage();
      m.cells.forEach(function (c, ci) {
        var colX = ML + ci * (m.boxW + _SS_PH_GAP);
        var drawX = colX + (m.boxW - c.w) / 2;  // tengahkan bila lebar foto < boxW (mis. potret)
        try { doc.addImage(c.f.dataUrl, drawX, y, c.w, c.h); } catch (e) {}
        doc.setDrawColor(226,232,240); doc.rect(drawX, y, c.w, c.h);
        if (c.cap.length) {
          // Latar kotak abu-biru muda (slate-50) + border tipis, seperti kartu
          // data section — agar keterangan foto tampak sebagai satu unit.
          var capTop = y + c.h + _SS_CAP_GAP;
          var capBoxH = c.cap.length * _SS_CAP_LH + _SS_CAP_PADY * 2;
          doc.setFillColor(248, 250, 252); doc.setDrawColor(226, 232, 240);
          doc.roundedRect(colX, capTop, m.boxW, capBoxH, 1.5, 1.5, 'FD');
          doc.setFont('helvetica','normal'); doc.setFontSize(_SS_CAP_FS); doc.setTextColor(71, 85, 105);
          doc.text(c.cap, colX + _SS_CAP_PADX, capTop + _SS_CAP_PADY + 2.6, { lineHeightFactor: 1.27 });
        }
      });
      y += m.rowH + 6;
    });
  }

  header();
  y = 30;

  sectionBar('A. INFORMASI UMUM');
  // Field pendek di grid 3-kolom di atas, Alamat (panjang) full-width di bawah
  // agar ritme grid tak terputus. Semua dibungkus kartu latar abu muda.
  dataCard([
    { type: 'row', pairs: [
      ['Nama Site', d.namaSite],
      ['Nama PIC', d.namaPIC],
      ['No. Telepon', d.telepon]
    ] },
    { type: 'row', pairs: [
      ['Tanggal Survey', d.tanggalSurvey],
      ['Surveyor', d.dibuatOleh],
      ['Koordinat', (d.latitude != null && d.longitude != null) ? d.latitude.toFixed(6) + ', ' + d.longitude.toFixed(6) : '']
    ] },
    { type: 'row', pairs: [
      ['Arah Hadap Bangunan', d.arahBangunan],
      ['Tinggi Bangunan', d.tinggiBangunan ? d.tinggiBangunan + ' m' : '']
    ] },
    { type: 'full', label: 'Alamat', value: d.alamat }
  ]);
  photoGroup('Foto Bangunan Tampak Depan', d.fotoBangunan);
  y += 2;

  var kel = d.kelistrikan || {};
  newPage();
  sectionBar('B. INFORMASI KELISTRIKAN');
  dataCard([
    { type: 'row', pairs: [
      ['ID Pelanggan PLN', kel.idPelangganPLN],
      ['Daya PLN', kel.dayaPLN ? kel.dayaPLN + ' VA' : ''],
      ['Phase', kel.phase],
      ['Rating Breaker', kel.ratingBreaker ? kel.ratingBreaker + ' A' : '']
    ] }
  ]);
  photoGroup('Foto kWh Meter', kel.fotoKwh);
  photoGroup('Foto Panel Hubung Bagi (PHB)', kel.fotoPHB);
  y += 2;

  var bos = d.bos || {};
  newPage();
  sectionBar('C. BALANCE OF SYSTEM (BOS)');
  dataCard([
    { type: 'row', pairs: [
      ['Lokasi Penempatan', bos.lokasi],
      ['Ukuran Area (Lebar x Tinggi)', (bos.lebar || bos.tinggi) ? (bos.lebar || 0) + ' x ' + (bos.tinggi || 0) + ' m' : ''],
      ['Jenis Tembok', bos.jenisTembok],
      ['Jarak ke Interkoneksi', bos.jarakInterkoneksi ? bos.jarakInterkoneksi + ' m' : '']
    ] }
  ]);
  photoGroup('Foto Area BoS & Titik Interkoneksi', bos.foto);
  y += 2;

  var atap = d.atap || {};
  newPage();
  sectionBar('D. INFORMASI ATAP');
  var atapUkr = _ssAtapUkuranArr(atap);
  var atapUkrStr = atapUkr.map(function(u, i) { return (atapUkr.length > 1 ? 'Atap ' + (i + 1) + ': ' : '') + (u.panjang || 0) + ' x ' + (u.lebar || 0) + ' m'; }).join('   ·   ');
  dataCard([
    { type: 'row', pairs: [
      ['Jenis Atap', atap.jenis],
      ['Arah Hadap Atap', atap.arah],
      ['Rangka Atap', atap.rangka],
      ['Jenis Mounting', atap.mounting],
      ['Jumlah Atap', atapUkr.length ? atapUkr.length + ' atap' : '']
    ] },
    { type: 'full', label: 'Ukuran Atap (Panjang x Lebar)', value: atapUkrStr }
  ]);
  photoGroup('Foto Atap', atap.fotoAtap);
  photoGroup('Foto Rangka Atap', atap.fotoRangka);
  photoGroup('Foto Akses ke Atap', atap.fotoAkses);
  y += 2;

  var jk = d.jalurKabel || {};
  newPage();
  sectionBar('E. JALUR KABEL');
  dataCard([
    { type: 'row', pairs: [
      ['Panjang Kabel PV', jk.panjangPV ? jk.panjangPV + ' m' : ''],
      ['Panjang Kabel AC', jk.panjangAC ? jk.panjangAC + ' m' : '']
    ] }
  ]);
  photoGroup('Foto Jalur Kabel PV', jk.fotoPV);
  photoGroup('Foto Jalur Kabel AC', jk.fotoAC);

  // Footer halaman
  var totalPages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor.apply(doc, SLATE);
    doc.text('Halaman ' + p + ' / ' + totalPages, PW / 2, 292, { align:'center' });
    doc.text('PT. RENUS GLOBAL INDONESIA — KONFIDENSIAL', ML, 292);
  }

  doc.save('Laporan-SiteSurvey-' + (d.namaSite || d.id || '').toString().replace(/[\\/\s:*?"<>|]/g, '-') + '.pdf');
}

function _ssHapusSurvey(id) {
  showConfirm({ title: 'Hapus Site Survey', message: 'Hapus survey ' + id + '? Foto terkait juga akan dihapus.', confirmText: 'Ya, Hapus', onConfirm: function() {
    toggleLoader(true, 'Menghapus...');
    google.script.run.withSuccessHandler(function(res) {
      toggleLoader(false);
      if (!res || res.success === false) { showNotification((res && res.message) || 'Gagal menghapus.', 'error'); return; }
      showNotification(res.message || 'Survey dihapus.');
      _ssTutupDetail();
      loadSiteSurvey();
    }).withFailureHandler(function(err) { toggleLoader(false); showNotification((err && err.message) || 'Gagal.', 'error'); })
      .hapusSiteSurvey(id);
  } });
}
</script>
