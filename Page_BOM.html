      <section id="page-bom" class="page-section">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Bill of Material</h2>
          <span id="bom-role-hint" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500"></span>
        </div>

        <!-- HOME: ringkasan + daftar Work Order -->
        <div id="bom-home">
          <div id="bom-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
            <div class="relative w-full sm:w-72">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="bom-search" oninput="_bomRenderWOList()" placeholder="Cari No WO / project / klien..."
                class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 bg-white">
            </div>
            <div class="flex items-center gap-2 sm:ml-auto">
              <button id="bom-add-project-btn" onclick="_bomOpenAddProject()" class="hidden flex-1 sm:flex-none justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Project ke BOM</button>
            </div>
          </div>
          <div id="bom-wo-list" class="space-y-2">
            <div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>
          </div>
        </div>

        <!-- DETAIL: material per Work Order -->
        <div id="bom-detail" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliBOMHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali ke daftar</button>
            <div id="bom-detail-actions"></div>
          </div>
          <div id="bom-detail-head" class="bg-white rounded-2xl border border-slate-150 p-5 mb-4"></div>
          <div id="bom-detail-body" class="space-y-4"></div>
        </div>

        <!-- MODAL: Tambah Project ke BOM -->
        <div id="bom-modal-project" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-indigo-100 text-indigo-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-diagram-project text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tambah Project ke BOM</h3>
            </div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Order</label>
            <select id="bom-proj-wo" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white mb-3"><option value="">Memuat WO...</option></select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tugaskan Site Engineer (opsional)</label>
            <div id="bom-proj-se" class="max-h-40 overflow-y-auto border border-slate-150 rounded-xl p-3 space-y-1 mb-4 text-sm text-slate-400">Memuat...</div>
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseAddProject()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitAddProject()" class="px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i> Tambahkan</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Tambah / Edit Material -->
        <div id="bom-modal-item" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-indigo-100 text-indigo-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-cubes-stacked text-sm"></i></span>
              <h3 id="bom-item-title" class="text-base font-extrabold text-slate-800">Tambah Material</h3>
            </div>
            <input type="hidden" id="bom-item-id">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Kategori</label>
            <select id="bom-item-kat" onchange="_bomModalKatChange()" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white mb-3"></select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Material</label>
            <select id="bom-item-pl" onchange="_bomModalPick()" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white mb-3"></select>
            <div id="bom-item-manual-wrap" class="hidden mb-3">
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nama Material (manual)</label>
              <input id="bom-item-nama" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl" placeholder="Nama material">
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Merek</label>
                <input id="bom-item-merek" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl" placeholder="Merek">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Supplier</label>
                <input id="bom-item-supplier" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl" placeholder="Supplier">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Satuan</label>
                <input id="bom-item-satuan" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl" placeholder="Satuan">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Qty</label>
                <input id="bom-item-qty" type="number" step="any" min="0" value="1" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl text-center font-bold">
              </div>
            </div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Catatan (opsional)</label>
            <input id="bom-item-catatan" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl mb-4" placeholder="Catatan">
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseItemModal()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitItem()" class="px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Tolak (reject) material -->
        <div id="bom-modal-reject" class="hidden fixed inset-0 z-[320] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-rose-100 text-rose-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-xmark text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tolak Material</h3>
            </div>
            <p class="text-sm text-slate-500 mb-3">Material: <b id="bom-reject-nama" class="text-slate-700"></b></p>
            <input type="hidden" id="bom-reject-id">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Catatan Revisi</label>
            <textarea id="bom-reject-catatan" rows="3" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl mb-4" placeholder="Jelaskan revisi yang diperlukan..."></textarea>
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseReject()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitReject()" class="px-5 py-2.5 text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-xmark"></i> Tolak & Kirim Revisi</button>
            </div>
          </div>
        </div>

      </section>
