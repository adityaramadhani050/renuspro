      <section id="page-bom" class="page-section">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
          <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Bill of Material</h2>
          <span id="bom-role-hint" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500"></span>
        </div>

        <!-- HOME: ringkasan + daftar Work Order -->
        <div id="bom-home">
          <div id="bom-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>

          <!-- Tab bar -->
          <div class="flex items-center gap-1 mb-4 border-b border-slate-150 overflow-x-auto">
            <button id="bom-tabbtn-proses" onclick="_bomShowHomeTab('proses')" class="whitespace-nowrap px-4 py-2.5 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 -mb-px"><i class="fa-solid fa-clock mr-1.5"></i>Sedang Proses <span id="bom-tabcount-proses" class="ml-1 text-[11px] font-bold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500"></span></button>
            <button id="bom-tabbtn-approved" onclick="_bomShowHomeTab('approved')" class="whitespace-nowrap px-4 py-2.5 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 -mb-px"><i class="fa-solid fa-circle-check mr-1.5"></i>Approved <span id="bom-tabcount-approved" class="ml-1 text-[11px] font-bold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500"></span></button>
            <button id="bom-tabbtn-need" onclick="_bomShowHomeTab('need')" class="hidden whitespace-nowrap px-4 py-2.5 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 -mb-px"><i class="fa-solid fa-cart-shopping mr-1.5"></i>Perlu Dibelanjakan</button>
          </div>

          <!-- TAB: Daftar Project (Sedang Proses / Approved) -->
          <div id="bom-tab-projects">
            <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
              <div class="relative w-full sm:w-72">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="bom-search" oninput="_bomRenderWOList()" placeholder="Cari No WO / project / klien..."
                  class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 bg-white">
              </div>
              <div class="flex items-center gap-2 sm:ml-auto">
                <button id="bom-add-project-btn" onclick="_bomOpenAddProject()" class="hidden flex-1 sm:flex-none justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-plus"></i> Tambah Project</button>
              </div>
            </div>
            <div id="bom-wo-list" class="space-y-2">
              <div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>
            </div>
          </div>

          <!-- TAB: Perlu Dibelanjakan -->
          <div id="bom-tab-need" class="hidden">
            <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
              <div class="relative w-full sm:w-72">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="bom-need-search" oninput="_bomRenderNeedPurchase()" placeholder="Cari material / No WO / supplier..."
                  class="w-full pl-8 pr-3 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-100 bg-white">
              </div>
              <div class="flex items-center gap-2 sm:ml-auto">
                <button onclick="_bomLoadNeedPurchase()" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-rotate text-slate-400"></i> Muat Ulang</button>
                <button onclick="_bomExportNeedPurchasePDF()" class="inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-bold px-3.5 py-2.5 rounded-xl shadow-sm transition whitespace-nowrap"><i class="fa-solid fa-file-pdf text-rose-500"></i> Export PDF</button>
              </div>
            </div>
            <div id="bom-need-list" class="space-y-4">
              <div class="bg-white rounded-2xl border border-slate-150 p-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat...</div>
            </div>
          </div>
        </div>

        <!-- DETAIL: material per Work Order -->
        <div id="bom-detail" class="hidden">
          <div class="flex items-center justify-between gap-3 mb-4">
            <button onclick="kembaliBOMHome()" class="inline-flex items-center gap-1.5 text-sm font-bold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-arrow-left"></i> Kembali ke daftar</button>
            <div id="bom-detail-actions"></div>
          </div>
          <div id="bom-detail-head" class="bg-white rounded-2xl border border-slate-150 p-5 mb-4"></div>
          <div id="bom-detail-body" class="space-y-4"></div>
        </div>

        <!-- MODAL: Tambah Project ke BOM -->
        <div id="bom-modal-project" class="hidden fixed inset-0 z-[310] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-indigo-100 text-indigo-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-diagram-project text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tambah Project ke BOM</h3>
            </div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Order</label>
            <select id="bom-proj-wo" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white mb-3"><option value="">Memuat WO...</option></select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tugaskan Site Engineer (opsional)</label>
            <div id="bom-proj-se" class="max-h-40 overflow-y-auto border border-slate-150 rounded-xl p-3 space-y-1 mb-4 text-sm text-slate-400">Memuat...</div>
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseAddProject()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitAddProject()" class="px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-plus"></i> Tambahkan</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Tolak (reject) material -->
        <div id="bom-modal-reject" class="hidden fixed inset-0 z-[320] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-rose-100 text-rose-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-xmark text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Tolak Material</h3>
            </div>
            <p class="text-sm text-slate-500 mb-3">Material: <b id="bom-reject-nama" class="text-slate-700"></b></p>
            <input type="hidden" id="bom-reject-id">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Catatan Revisi</label>
            <textarea id="bom-reject-catatan" rows="3" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl mb-4" placeholder="Jelaskan revisi yang diperlukan..."></textarea>
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseReject()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitReject()" class="px-5 py-2.5 text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-xmark"></i> Tolak & Kirim Revisi</button>
            </div>
          </div>
        </div>

        <!-- MODAL: Proses procurement (reserve stok / need purchase) -->
        <div id="bom-modal-proc" class="hidden fixed inset-0 z-[320] flex items-center justify-center bg-slate-900/50 px-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
            <div class="flex items-center gap-3 mb-4">
              <span class="bg-teal-100 text-teal-600 h-10 w-10 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-clipboard-check text-sm"></i></span>
              <h3 class="text-base font-extrabold text-slate-800">Proses Material</h3>
            </div>
            <input type="hidden" id="bom-proc-id">
            <p class="text-sm font-bold text-slate-700" id="bom-proc-nama"></p>
            <p class="text-xs text-slate-400 mb-4" id="bom-proc-info"></p>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Ambil dari Stok (opsional)</label>
            <select id="bom-proc-stok" onchange="_bomProcStokChange()" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl bg-white mb-3"><option value="">— Tidak dari stok (semua dibeli) —</option></select>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Qty Reserve dari Stok</label>
            <input type="number" id="bom-proc-qty" min="0" step="any" oninput="_bomProcRecalc()" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-xl mb-3" value="0">
            <div id="bom-proc-summary" class="text-xs bg-slate-50 border border-slate-150 rounded-xl px-3 py-2.5 mb-4 text-slate-600"></div>
            <div class="flex justify-end gap-2">
              <button onclick="_bomCloseProc()" class="px-4 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
              <button onclick="_bomSubmitProcure()" class="px-5 py-2.5 text-sm font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-check"></i> Simpan</button>
            </div>
          </div>
        </div>

      </section>
